# BGM Catalog · 背景音乐映射表
#
# 用途：audio_plan.yaml 里的 bgm.family + bgm.emotion → 本表映射到具体 mp3 · bgm-mixer 消费本表
# 版本：v1 · 2026-07-05 · 从 W26-W28 情感型/带货型/出镜型 audio_plan 归纳
# 依赖：
#   - memory feedback_dense-vo-no-bgm-default（密 VO 演示/知识型默认 off · 情感型/出镜型/带货型默认 on）
#   - memory feedback_sfx-layer-required（4 类 sfx 必覆盖 · BGM 可 off 但 sfx 不 off）
#   - memory feedback_no-synth-bgm（禁 ffmpeg aevalsrc/sine 合成 · 必用 CC0 mp3）
#   - memory feedback_dense-vo-no-dead-air（VO -16dB · BGM duck 到 -18~-22dB · release 段 -12~-14dB）
#
# 结构：
#   bgm_families:
#     <family_key>:              # family 名（audio_plan.bgm.family 用）
#       description: str
#       gain_db_range: [min, max]  # 相对 VO(-16dB) 的推荐 dB
#       bpm_range: [min, max]
#       default_enabled_for_types: [str, ...]  # 形态默认启用
#       default_enabled_for_types_not: [str, ...]  # 形态默认关闭
#       candidates:              # 具体 mp3 文件候选
#         - id: str
#           path: str            # 相对项目根
#           source: pixabay_id | freemusic_id | uppbeat_id | userA
#           license: CC0 | CC-BY | pixabay | uppbeat
#           bpm: int
#           key: str             # C_major / A_minor / D_dorian / atonal
#           mood: [str, ...]     # 情绪 tag
#           structure: str       # intro_Xs + loop_Ys + outro_Zs
#           duration_s: float
#           tags: [str, ...]
#           attribution: str | null  # CC-BY 需 attribution
#           fetched_at: ISO date | null
#
# BGM 不存在时 bgm-mixer 的行为：
#   - 若 candidates 全空 → 打印 gap 报告 · 跳过 BGM 层 · **VO 独立播出** · 不合成
#   - 生成 assets/bgm/GAP_REPORT.md 供用户 Pixabay/Uppbeat 补齐

version: 1
last_updated: "2026-07-05"

# ─────────────────────────────────────
# 全局响度基准（memory feedback_dense-vo-no-dead-air）
# ─────────────────────────────────────
global:
  vo_target_db: -16              # VO loudnorm 目标
  bgm_duck_db: -20               # VO 段 BGM 音量（duck 状态）
  bgm_release_db: -14            # 无 VO 段 BGM 音量（release · 允许喘息）
  bgm_intro_db: -12              # 前 3s intro 全音量（起片建立氛围）
  bgm_outro_db: -18              # 尾 2s fade
  bgm_cta_fade_db: -22           # CTA 前 3s 拉低（让 CTA 清晰）
  duck_attack_ms: 200
  duck_release_ms: 500
  duck_threshold_db: -20
  duck_ratio: 4                  # sidechain compressor 压缩比

# ─────────────────────────────────────
# 形态 → BGM 默认开关（memory feedback_dense-vo-no-bgm-default）
# ─────────────────────────────────────
type_default_bgm:
  demo_dense_vo: off             # 密 VO 演示型 · BGM 默认 off（D01/D04 走此路径）
  knowledge_dense_vo: off        # 密 VO 知识型 · BGM 默认 off
  emotional: on                  # 情感型 · BGM 默认 on
  oncam: on                      # 出镜型 · BGM 默认 on
  oncam_vulnerable: on           # 出镜情感型 · BGM 默认 on
  sales: on                      # 带货型 · BGM 默认 on
  sparse_vo: on                  # 稀疏 VO · BGM 默认 on（空白段 BGM 顶上）

# ─────────────────────────────────────
# 情感 → BGM 家族路由（"先定情绪再选音乐" · memory feedback_sfx-layer-required 情感型分支）
# ─────────────────────────────────────
# 用法：情感型选题在 audio_plan.bgm.emotion 声明主情绪 · bgm-mixer 按此表选 family
emotion_to_family:
  loneliness: [emotional_minimal, ambient_reflective]
  nostalgia: [emotional_minimal, ambient_reflective]
  hope: [hopeful_uplifting, documentary_neutral]
  urgency: [urgent_tension, sales_energetic]
  confidence: [sales_energetic, hopeful_uplifting]
  reflection: [emotional_minimal, ambient_reflective]
  focus: [ambient_reflective, documentary_neutral]
  chaos_to_calm: [urgent_tension, hopeful_uplifting]  # 前段用 tension · 后段切 hopeful
  vulnerability: [emotional_minimal]
  determination: [documentary_neutral, hopeful_uplifting]


# ─────────────────────────────────────
# duck 策略（sidechain compressor · VO 与 BGM 混音）
# ─────────────────────────────────────
duck_policy:
  strategy: sidechain_compress    # ffmpeg sidechaincompress filter
  vo_threshold_db: -20            # VO 音量超此触发 duck
  bgm_ratio_when_vo: 4            # VO 存在时 BGM 压缩比
  bgm_attack_ms: 200
  bgm_release_ms: 500
  bgm_intro_seconds: 3.0          # 起始 3s BGM 全音量（-12dB · 建立氛围）
  bgm_outro_seconds: 2.0          # 结尾 2s BGM fade 到 -18dB
  bgm_cta_fade_before_seconds: 3.0  # CTA 前 3s 开始 -3dB fade
  bgm_no_vo_release_seconds: 1.0  # VO 停止 1s 后 BGM 恢复到 release_db(-14dB)

# ─────────────────────────────────────
# GAP 处理策略（与 sfx-catalog 一致）
# ─────────────────────────────────────
gap_handling:
  when_candidate_not_found:
    - "bgm-mixer 打印 gap · 记入 GAP_REPORT.md"
    - "跳过 BGM 层 · VO 独立播出 · 不 fail-close"
    - "不 aevalsrc/sine 合成（memory feedback_no-synth-bgm）"
  when_family_empty:
    - "全 family 无 candidate → BGM layer 整体 off"
    - "audio_plan.yaml.bgm.enabled=true 且 family 空 → 音画硬门 warn"
  gap_report_path: assets/bgm/GAP_REPORT.md

# ─────────────────────────────────────
# CC0 / 免费商用音乐源（P2 bgm-fetcher 消费）
# ─────────────────────────────────────
free_music_sources:
  pixabay_music:
    url: https://pixabay.com/music
    license: Pixabay License（免费商用 · 无需 attribution）
    quality: ★★★★☆
    search_hint: "Pixabay 搜索直接下 mp3 · 复制 track id 落 candidate.source"
  free_music_archive:
    url: https://freemusicarchive.org
    license: CC0 / CC-BY（varies · 每首查具体许可）
    quality: ★★★★☆
    search_hint: "FMA 过滤 CC0 · 下 320kbps mp3"
  uppbeat:
    url: https://uppbeat.io
    license: Uppbeat License（免费层需 attribution · 付费无 attribution）
    quality: ★★★★★
    search_hint: "Uppbeat 免费层 5 首/月 · attribution 写在 xhs 视频描述"
  youtube_audio_library:
    url: https://www.youtube.com/audiolibrary
    license: CC0 / YouTube License
    quality: ★★★☆☆
    search_hint: "YouTube 后台 · 无 attribution 免费商用"


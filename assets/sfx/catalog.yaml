    gain_db_range: [-12, -8]
    duration_range_s: [0.15, 0.6]
    use_case:
      - "M3 大字落地 hit 打点"
      - "M5 分屏硬切进入"
      - "M8 打勾 × 8 序列 / 打叉 × 2"
      - "M9 价值锚落地深长 hit"
      - "M10 CTA 收尾拍点"
    candidates:
      - id: impact_soft_boom
        path: assets/sfx/hit/impact_soft_boom.wav
        source: freesound_728515
        license: CC0
        tags: [软 boom, 0.3s, 段位收尾]
        fetched_at: "2026-07-10"
      - id: impact_hard_cut
        path: assets/sfx/hit/impact_hard_cut.wav
        source: freesound_650573
        license: CC0

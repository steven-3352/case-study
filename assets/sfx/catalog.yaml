# SFX Catalog · 音效映射表
#
# 用途：audio_plan.yaml 里的 sfx.events[].kind → 本表映射到具体 wav 文件 · sfx-mixer 消费本表
# 版本：v1 · 2026-07-05 · 从 W27D01/D03 + W28D01/D04 audio_plan 归纳的公共 sfx 家族
# 依赖：
#   - memory feedback_sfx-layer-required（4 类必覆盖 · BGM off 但 sfx 不 off）
#   - memory feedback_no-synth-bgm（禁 ffmpeg aevalsrc/sine 合成 · 必用 CC0 wav）
#   - memory feedback_dense-vo-no-dead-air（VO -16dB · sfx -8~-22dB 层级）
#
# 结构：
#   sfx_families:
#     <family_key>:                # kind 名（audio_plan 用）
#       description: str
#       gain_db_range: [min, max]  # 相对 VO(-16dB) 的推荐 dB · sfx-mixer 若不指定则用中值
#       duration_range_s: [min, max]
#       use_case: [str, ...]       # 常用场景
#       candidates:                # 具体 wav 文件候选（同 kind 多样本供随机 or 指定）
#         - id: str                # sfx-mixer 用 id 定位
#           path: str              # 相对项目根
#           source: str            # freesound_id / 剪映 / userA
#           license: CC0 | CC-BY | proprietary
#           tags: [str, ...]       # 情绪/材质/速度
#           fetched_at: ISO date | null
#
# 音效不存在时 sfx-mixer 的行为：
#   - 若 candidates 全空 → 打印 gap 报告 · 跳过该 event · **不合成**（禁 aevalsrc）
#   - 生成 assets/sfx/GAP_REPORT.md 供用户 Freesound 补齐

version: 1
last_updated: "2026-07-05"

# ─────────────────────────────────────
# 全局响度基准（memory feedback_dense-vo-no-dead-air）
# ─────────────────────────────────────
global:
  vo_target_db: -16          # loudnorm I=-16
  sfx_default_gain_db: -12   # 相对 VO 的 dB 差基线
  sfx_bed_ambient_db: -22    # ambient 铺底最轻
  sfx_hit_max_db: -8         # hit 打点最响
  # sfx-mixer 应用 event.gain_db 覆盖 global · 缺省用本 family 中值

# ─────────────────────────────────────
# 4 大 sfx 家族（memory feedback_sfx-layer-required）
# ─────────────────────────────────────
sfx_families:

  # ═══ 1. AMBIENT · 环境铺底 · 全片 loop ═══
  ambient:
    description: "全片环境铺底 · 建立场景氛围（办公室 / 深夜卧室 / 户外）· loop 覆盖全片时长"
    gain_db_range: [-24, -20]
    duration_range_s: [3.0, 10.0]  # 段落长度 · sfx-mixer 会 loop 到目标长度
    use_case:
      - "chaos scene 起片氛围建立"
      - "非 VO 段填充（禁 3s+ 死区）"
      - "全片持续铺底至 CTA 前 fade -3dB"
    candidates:
      - id: office_daylight_room_tone
        path: assets/sfx/ambient/office_daylight_room_tone.wav
        source: freesound_135097
        license: CC0
        tags: [白天, 办公室, 室内, 键盘远景, 温暖]
        fetched_at: "2026-07-05"
      - id: office_night_desk_lamp
        path: assets/sfx/ambient/office_night_desk_lamp.wav
        source: freesound_671455
        license: CC0
        tags: [深夜, 卧室, 台灯, 静谧, 单人]
        fetched_at: "2026-07-05"
      - id: coffee_shop_daytime
        path: assets/sfx/ambient/coffee_shop_daytime.wav
        source: freesound_155665
        license: CC0
        tags: [白天, 咖啡厅, 人声远景, 出镜型备选]
        fetched_at: "2026-07-05"

  # ═══ 2. TICK · 拍点节奏（打字/UI/时钟）═══
  tick:
    description: "单发或序列 tick · 用于 UI 点击 · 打字节奏 · 秒表节拍"
    gain_db_range: [-18, -12]
    duration_range_s: [0.05, 0.5]
    use_case:
      - "M1 chaos 起片 UI tick 拉开"
      - "打字 14 声序列（tick_seq）"
      - "秒表/倒计时节奏"
      - "M4 VO 起 subtle tap 引入"
    candidates:
      - id: subtle_ui_tap_soft
        path: assets/sfx/tick/subtle_ui_tap_soft.wav
        source: freesound_833601
        license: CC0
        tags: [UI, 轻拍, VO 引入]
        fetched_at: "2026-07-10"
      - id: keyboard_mechanical_single
        path: assets/sfx/tick/keyboard_mechanical_single.wav
        source: freesound_622060
        license: CC0
        tags: [机械键盘, 单击, 30ms]
        fetched_at: "2026-07-10"
      - id: keyboard_typing_sequence_14
        path: assets/sfx/tick/keyboard_typing_sequence_14.wav
        source: freesound_378084
        license: CC0
        tags: [机械键盘, 14 声序列, 打字, 0.5s]
        fetched_at: "2026-07-10"
      - id: keyboard_enter_key

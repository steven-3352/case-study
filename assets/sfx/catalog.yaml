        source: freesound_180997
        license: CC0
        tags: [回车键, 硬拍, 0.15s]
        fetched_at: "2026-07-10"
      - id: metronome_soft_tick
        path: assets/sfx/tick/metronome_soft_tick.wav
        source: freesound_243749
        license: CC0
        tags: [节拍器, 计时, 单发]
        fetched_at: "2026-07-05"

  # kind alias: tick_seq → 用 tick 家族里 tags 含 "序列" 的 candidate
  tick_seq:
    description: "tick 序列（alias · 走 tick 家族筛序列 tag）"
    alias_of: tick

  # ═══ 3. WHOOSH · 转场/信息进出 ═══
  whoosh:
    description: "段间过渡 whoosh · 信息元素快速进出 · 快切转场"
    gain_db_range: [-14, -10]
    duration_range_s: [0.2, 0.6]
    use_case:
      - "段间硬切转场"
      - "UI 元素快速滑入"
      - "M3 reveal 大字入伴随 whoosh"
      - "M6 3 段快切之间"

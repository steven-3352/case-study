  # kind alias: hit_seq → 用 hit 家族里 tags 含 "打勾"/"UI accent" 的 candidate
  hit_seq:
    description: "hit 序列（alias · 走 hit 家族筛 UI accent 序列 tag）"
    alias_of: hit

  # ═══ 5. RISER · 情感型 · 情绪拉升（默认 off · 教程感重）═══
  riser:
    description: "情绪拉升 · 情感型/带货型激活 · 演示/知识型默认 off（memory feedback_sfx-layer-required 万能公式变体）"
    gain_db_range: [-16, -10]
    duration_range_s: [1.0, 3.0]
    use_case:
      - "情感型 CTA 前 1-2s 拉升"
      - "带货型价格揭晓前"
      - "反面正解翻转前"
    default_enabled_for_types: [emotional, sales, oncam]
    default_enabled_for_types_not: [demo_dense_vo, knowledge]
    candidates:
      - id: riser_short_ascending
        path: assets/sfx/riser/riser_short_ascending.wav
        source: freesound_685256
        license: CC0
        tags: [拉升, 1.5s, 情感型]
        fetched_at: "2026-07-05"

# ─────────────────────────────────────
# GAP 处理策略
# ─────────────────────────────────────
gap_handling:
  when_candidate_not_found:
    - "sfx-mixer 打印 gap · event 记入 GAP_REPORT.md"
    - "跳过该 event（不 aevalsrc/sine 合成 · memory feedback_no-synth-bgm）"
    - "VO + 现有 sfx 继续 mix · 不 fail-close"
  when_family_empty:
    - "全 family 无 candidate → sfx layer 整体 off"
    - "audio_plan.yaml.sfx.enabled=true 且 family 空 → 音画硬门 warn"
  gap_report_path: assets/sfx/GAP_REPORT.md


manifest_version: 1
milestone: M3
status: in_progress
architecture_ref: docs/design/LOCAL_MV_STUDIO_ARCHITECTURE.md
directory_contract_ref: docs/design/LOCAL_MV_STUDIO_DIRECTORY_CONTRACT.md

goal: >
  Compile approved director maps and a validated visual score into immutable
  story, asset, generation, storyboard, shot, and 540p animatic artifacts.

constraints:
  - Product code lives under src/mvstudio and never imports pipeline.
  - Executors write only to their current job staging directory.
  - Source portraits and user inputs are read-only.
  - Self-generated director contracts remain draft and cannot authorize final render.
  - Editorial shots and provider generation clips are separate contracts.
  - Generation clips are at least 4000 ms and preserve usable-range handles.
  - Animatics are structural approval artifacts, never final deliverables.

outputs:
  - creative/beats.json
  - creative/lyrics_semantic.json
  - creative/music_map.yaml
  - creative/character_map.yaml
  - creative/model_audit.json
  - creative/story_framework.yaml
  - creative/asset_plan.yaml
  - creative/generation_plan.yaml
  - creative/storyboard.md
  - creative/shots.yaml
  - outputs/animatic.mp4
  - outputs/qc_report.json
  - artifact-manifest.json

acceptance:
  - Invalid timelines, unknown characters, flat energy, and unsafe input fail closed.
  - A valid visual score compiles without model calls.
  - Every output is registered with hashes and source input hashes.
  - 9:16 animatics are 540x960 and 16:9 animatics are 960x540.
  - Supervisor model_call_count and token_count remain zero.
  - Two concurrent director jobs have no cross-job files or content.
  - Raw input refs are restricted to project audio, lyrics, and character directories.
  - Timed LRC and plain lyrics are distinguished without invented timestamps.
  - Audio RMS, onset, energy, and BPM candidates are deterministic and hash-bound
    to the validated Job-local audio copy.
  - Semantic model tasks are allowlisted, byte/token bounded, schema checked, and
    audited without sending portrait pixels or paths.
  - Draft semantic maps cannot authorize Director compilation until approved.
  - Ordinary-user API and CLI actions start intake, approve, and publish by Job ID
    without accepting staging paths, executor settings, cwd, or output destinations.
  - Publication requires explicit approval and rejects hash drift, undeclared files,
    symlinks, project mismatches, and conflicting destination content.
  - Full M0-M3 tests, atom lock, import scan, and git diff check pass.

deferred:
  - Plain-lyric alignment provider integration.
  - Map-drafting Job and Application Service workflow wiring.
  - Story framework and visual score drafting through bounded model ports.
  - Final-resolution rendering and media-provider generation.

## Tonbirds-Content-Engine-Plugin · 角色注册表（自足版 · 单一事实源）
## ─────────────────────────────────────────────────────────────
## 本文件取代对宿主项目 CLAUDE.md「核心工作流程 / 工种清单 / 形态对照」的依赖。
## workflows/*.js 从这里读角色目录，不再 grep CLAUDE.md。
##
## 字段语义：
##   id                稳定英文标识（workflow 内部引用，永不改名）
##   name              中文工种名（= scorecard 工种归口用名，两处必须一字不差）
##   group             理解 / 调研 / 核心 / 表达音画 / 增长复盘 / 带货扩展 / 出镜扩展
##   wave              生产波次（同 wave 并行；跨 wave 串行 barrier）；post=发布后
##   activation        always | video_only | on_demand | format:<形态>
##   dual_review       true=需两名独立评审 ≥90 门；false=走 QG-PRD-ACCEPTANCE 二元验收
##   translation_layer true=翻译层角色，禁碰实现代码（防「效果名=已实现」事故）
##   owns_dims         该角色在 19 维打分卡中「设计时负责」的维度（= 设计输入，非仅验收）
##                     —— 由 video_19dim_scorecard.md 工种归口反推，两文件同步维护
##   gates             产出必须过的 QG-* 门（见 quality/quality_registry.md）
##   output_template   产出落地的模板/schema（skill/templates/ 下）
##
## 铁律：QG-RAISE-3 对所有角色的所有产出生效——owns_dims 的「基准」是地板，
## 每个角色都按「提升 3 档目标」设计，不按「能过基准吗」交付。

meta:
  version: "1.1.0"
  scorecard: quality/video_19dim_scorecard.md
  quality_registry: quality/quality_registry.md
  prd_schema: templates/subagent_prd_schema.md
  # 所有角色产出统一用 subagent_prd_schema 结构化返回；
  # perceptual_goal.observable_metric 禁写效果名，必须是可观察量级。

## ── 形态激活映射 ──────────────────────────────────────────────
## key=形态；value=在 always/video_only 之外额外激活的 group / 具体角色
formats:
  演示型:
    label: "AI 改造/案例复盘（默认形态）"
    extra_groups: []
    extra_roles: []
  知识型:
    label: "拆解/方法论/教程"
    extra_groups: []
    extra_roles: []
  带货型:
    label: "商品种草/对比测评"
    extra_groups: [带货扩展]
    extra_roles: []
  出镜型:
    label: "真人出镜（可叠加在任意形态上）"
    extra_groups: [出镜扩展]
    extra_roles: []
  图文轮播:
    label: "6–8 张小红书轮播"
    extra_groups: []
    extra_roles: []
    # 图文轮播不跑声音设计师；跳过视觉语言→分镜的视频专属波次，改「每张停留点+收藏动机」
    skip_roles: [声音设计师, 动画导演, 动效技术导演]

## ── 角色目录 ──────────────────────────────────────────────────
roles:

  # ===== 理解层 4（所有形态必跑 · 洞察包）=====
  - id: topic-digger
    name: 选题深挖师
    group: 理解
    wave: 3
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-INSIGHT-3FACTS, QG-PRD-ACCEPTANCE]
    responsibility: 拆透选题——谁、什么场景、烦什么、要什么结果
    output_template: templates/insights/topic_brief.md

  - id: core-distiller
    name: 内核提炼师
    group: 理解
    wave: 3
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-INSIGHT-3FACTS, QG-PRD-ACCEPTANCE]
    responsibility: 从调研中抽 3–5 条不可删关键信息 + 1 句价值锚
    output_template: templates/insights/core_message.md

  - id: domain-expert
    name: 领域专家
    group: 理解
    wave: 3
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: 业务逻辑/流程；带货则品类决策链、竞品差异
    output_template: templates/insights/domain_notes.md

  - id: fact-checker
    name: 事实校验员
    group: 理解
    wave: 3
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: 核对数据、SKU、引用；标红不可写；拦截洞察卡没有的卖点
    output_template: templates/insights/fact_check.md

  # ===== 网络调研层（所有选题必跑）=====
  - id: web-researcher
    name: 网络调研员
    group: 调研
    wave: 2
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-EXTERNAL-REFS, QG-PRD-ACCEPTANCE]
    responsibility: 搜公开内容（行业文/案例/社区），提炼痛点与可引用转述（≥3 URL、≥2 网络原话）
    output_template: templates/insights/external_references.md

  # ===== 核心 10 工种（所有形态都跑）=====
  - id: chief-director
    name: 编导
    group: 核心
    wave: 1
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: 选题是否符合主线、形态拆分、验收标准；立项单（钩子+形态分工）
    output_template: templates/subagent_prd_schema.md

  - id: reporter
    name: 记者
    group: 核心
    wave: 2
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: 真实性、数据、证据链；小老板原话、痛点佐证、数据点
    output_template: templates/subagent_prd_schema.md

  - id: doc-director
    name: 纪录片导演
    group: 核心
    wave: 2
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: 故事弧线、改造前后对比；叙事大纲（起承转合+情绪锚点）
    output_template: templates/subagent_prd_schema.md

  - id: exec-director
    name: 导演
    group: 核心
    wave: 10
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: 镜头语言、节奏、信息密度；分镜表（画面/口播/字幕/时长，出镜含机位）
    output_template: templates/subagent_prd_schema.md

  - id: cinematographer
    name: 摄像/视觉
    group: 核心
    wave: 10
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: [D12]
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: 画面可拍性、构图、可复用素材；B-roll 列表、截图需求
    output_template: templates/subagent_prd_schema.md

  - id: screenwriter
    name: 编剧
    group: 核心
    wave: 5
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: [D19]
    gates: [QG-ANTI-MEDIOCRITY, QG-SCRIPT-QUOTES, QG-PRD-ACCEPTANCE]
    responsibility: 钩子、逐字稿、字幕节奏；N 角度抗平庸锦标赛 + 停划裁判 best-of；前 3s 大字钩子
    output_template: templates/anti_mediocrity_tournament.md

  - id: visual-designer
    name: 视觉设计
    group: 核心
    wave: 8
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: [D04, D09, D15]
    gates: [QG-VISUAL-ORIGINALITY, QG-PRD-ACCEPTANCE]
    responsibility: 版面、色彩、品牌一致性；视觉路线 + 封面 mock 验收
    output_template: templates/cover_standards.md

  - id: visual-language-curator
    name: 视觉语言策展师
    group: 核心
    wave: 8
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: [D04, D09, D10]
    gates: [QG-PALETTE-NEON, QG-VISUAL-ORIGINALITY, QG-PRD-ACCEPTANCE]
    responsibility: 萃取本条可执行色板/字体/组件/禁用项；起稿候选须含≥1 浅色方案（禁 AI 味深色默认）
    output_template: templates/design_language.md

  - id: editor
    name: 剪辑
    group: 核心
    wave: 12
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: [D05, D06, D14, D16, D17]
    gates: [QG-MEDIA-BLACK, QG-MEDIA-SILENCE, QG-DELIVERY, QG-PRD-ACCEPTANCE]
    responsibility: 时长卡控、三平台规格；抖音 45-60s / 小红书 ≤60s / 视频号 60-90s
    output_template: templates/subagent_prd_schema.md

  - id: growth-ops
    name: 运营/增长
    group: 核心
    wave: 13
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: [D16]
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: 分发策略、私信转化承接；三平台文案 + 评论区埋点 + 私信路径
    output_template: templates/subagent_prd_schema.md

  # ===== 表达/音画层 5（视频必跑 / 按需激活）=====
  - id: retention-designer
    name: 留存与互动设计师
    group: 表达音画
    wave: 4
    activation: video_only
    dual_review: true
    translation_layer: false
    owns_dims: [D08, D15, D19]
    gates: [QG-ATTENTION, QG-REVIEWERS, QG-PRD-ACCEPTANCE]
    responsibility: 完播节拍、形式切换、互动 CTA；retention_beat_sheet
    output_template: templates/retention_beat_sheet.md

  - id: animation-director
    name: 动画导演
    group: 表达音画
    wave: 6
    activation: video_only
    dual_review: false
    translation_layer: true
    owns_dims: [D01, D02, D11, D12, D13]
    gates: [QG-MOTION-CREATIVE, QG-MOTION-FREEZE, QG-PRD-ACCEPTANCE]
    responsibility: 判定风格 + 逐秒分镜（9 字段）；每 2-4s 必有明确视觉变化；observable_metric 禁写效果名
    output_template: templates/motion_storyboard.md
    note: 单跑（翻译层，下游会拦）；translation_layer 禁碰实现代码——只出「该有什么感觉」的可核验陈述

  - id: form-strategist
    name: 形式策略官
    group: 表达音画
    wave: 7
    activation: video_only
    dual_review: true
    translation_layer: false
    owns_dims: [D03, D05]
    gates: [QG-FORM-COMPETITION, QG-FIVE-DIM, QG-FORECAST, QG-REVIEWERS, QG-PRD-ACCEPTANCE]
    responsibility: 逐镜比较表达方案（实拍/2D UI/GSAP/Three/截图/字幕），声明数据杠杆、理解成本、制作成本、技术风险
    output_template: templates/form_competition.md

  - id: motion-tech-director
    name: 动效技术导演
    group: 表达音画
    wave: 9
    activation: on_demand
    dual_review: true
    translation_layer: false
    owns_dims: [D02, D03, D05, D14, D18]
    gates: [QG-MOTION-FREEZE, QG-MEDIA-BLACK, QG-REVIEWERS, QG-PRD-ACCEPTANCE]
    responsibility: 对 GSAP/Three/Web3D/HTML 截帧做可行性/资产/性能/导出审查；接逐秒分镜拆组件任务清单
    output_template: templates/motion_tech_plan.md
    activation_condition: 使用 Web 3D / GSAP / 复杂 HTML 动效 / 重资产 B-roll 时

  - id: sound-designer
    name: 声音设计师
    group: 表达音画
    wave: 11
    activation: video_only
    dual_review: true
    translation_layer: false
    owns_dims: [D06, D07, D19]
    gates: [QG-MEDIA-HEAD-RMS, QG-REVIEWERS, QG-PRD-ACCEPTANCE]
    responsibility: 配音、BGM 情绪、SFX、字幕方案；声音密度 ≥ 画面变化密度
    output_template: templates/audio_plan.yaml

  # ===== 增长复盘层 1（发布后必跑）=====
  - id: data-retro
    name: 数据复盘官
    group: 增长复盘
    wave: post
    activation: always
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-FORECAST]
    responsibility: 48h/7d 对比 forecast 与 actual，判定问题来自选题/钩子/脚本/形式/CTA/文案/时间，反哺下条
    output_template: templates/pre_publish_forecast.md

  # ===== 带货扩展 4（带货型激活）=====
  - id: compliance-reviewer
    name: 合规审核
    group: 带货扩展
    wave: 5
    activation: format:带货型
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-COMPLIANCE, QG-PRD-ACCEPTANCE]
    responsibility: 广告法、绝对化用语、医美/食品/化妆品红线、平台规则；红区逐句标注
    output_template: templates/subagent_prd_schema.md

  - id: product-analyst
    name: 选品/商品分析师
    group: 带货扩展
    wave: 2
    activation: format:带货型
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: SKU 拆解、卖点、价位、目标人群、竞品对照；选品卡
    output_template: templates/subagent_prd_schema.md

  - id: consumer-voice
    name: 消费者声音研究员
    group: 带货扩展
    wave: 2
    activation: format:带货型
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: 走 Agent-Reach 挖小红书/B 站真实槽点和决策路径；原话引用 5-10 条
    output_template: templates/subagent_prd_schema.md

  - id: sales-scriptwriter
    name: 销售脚本师
    group: 带货扩展
    wave: 5
    activation: format:带货型
    dual_review: false
    translation_layer: false
    owns_dims: [D19]
    gates: [QG-ANTI-MEDIOCRITY, QG-PRD-ACCEPTANCE]
    responsibility: 卖货话术、痛点放大、对比、限时福利、口播 CTA（与编剧叙事区分）
    output_template: templates/anti_mediocrity_tournament.md

  # ===== 出镜扩展 2（出镜型激活，可叠加）=====
  - id: actor-coach
    name: 演员/出镜表演指导
    group: 出镜扩展
    wave: 10
    activation: format:出镜型
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: 口语化重写、表情/手势/眼神、节奏、机位建议；表演说明
    output_template: templates/subagent_prd_schema.md

  - id: styling
    name: 造型/服装/场景
    group: 出镜扩展
    wave: 10
    activation: format:出镜型
    dual_review: false
    translation_layer: false
    owns_dims: []
    gates: [QG-PRD-ACCEPTANCE]
    responsibility: 穿搭、布景、品牌一致性、灯光色温；拍摄清单
    output_template: templates/subagent_prd_schema.md

## ── 波次总览（生产阶段）──────────────────────────────────────
## blueprint.js 预生产跑到 wave 10（分镜）为止，不进 wave 11+ 的制作。
## prd_pipeline.js 走全部生产波次；数据复盘官（post）在发布后单独触发。
waves:
  1:  [编导]
  2:  [记者, 纪录片导演, 网络调研员, 选品/商品分析师, 消费者声音研究员]
  3:  [选题深挖师, 内核提炼师, 领域专家, 事实校验员]
  4:  [留存与互动设计师]
  5:  [编剧, 销售脚本师, 合规审核]
  6:  [动画导演]              # motion_storyboard 必须早于形式策略会（门禁）
  7:  [形式策略官]
  8:  [视觉设计, 视觉语言策展师]
  9:  [动效技术导演]
  10: [导演, 摄像/视觉, 演员/出镜表演指导, 造型/服装/场景]
  11: [声音设计师]
  12: [剪辑]
  13: [运营/增长]

## blueprint 预生产终点（含此 wave 及之前）
blueprint_last_wave: 10

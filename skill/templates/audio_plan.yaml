# 声音方案 · audio_plan.yaml
# 工种: 声音设计师 (skill/roles/registry.yaml -> sound-designer) · 视频形态必跑
# 负责维度(owns_dims): D06 卡点 · D07 音频设计 · D19 情绪曲线 (skill/quality/video_19dim_scorecard.md)
# 对应质量门: QG-MEDIA-HEAD-RMS(前 6s RMS >= -25dB) · QG-MEDIA-SILENCE(静音 >=3.0s fail)
#             · QG-REVIEWERS + QG-SCORECARD-90(双人独立 >=90) · QG-PRD-ACCEPTANCE
# 基准是地板, 按 QG-RAISE-3 提升 3 档目标验收(D07: SFX 密度 >= 画面变化密度)。
#
# -- 0. 入口必读(开工前打勾) ---------------------------------------
# 流程与门位见 skill/docs/PROCESS.md; 不过清单不得开工
#
# [ ] 流程 refs: skill/docs/PROCESS.md 波次表(W11 声音设计师 · Phase B 门位 · dual_review)
# [ ] 质量 refs: skill/quality/quality_registry.md(QG-MEDIA-HEAD-RMS · QG-MEDIA-SILENCE · QG-REVIEWERS · QG-RAISE-3)
# [ ] 维度 refs: skill/quality/video_19dim_scorecard.md D06/D07/D19 的「提升 3 档目标」列
# [ ] template refs: 本节点已完成 script_standards.md(口播提取源) · retention_beat_sheet.md(情绪曲线) · motion_storyboard.md(对齐每段音量)
# [ ] 历史成品参考: 同主题最近 1 条 audio_plan.yaml(对齐 voice_id 和 emotion_arc 粒度)
# [ ] 能力 refs: cap-tts(配音能力 · TTS provider/voice 走其配置) · cap-stock-footage(若需授权 BGM/SFX 素材)
#
# 触发词打断: 「BGM 用合成器拼一下就行」「voice 抄上条」「音量随便设」
#
# ------------------------------------------------------------------
#
# content_id: ___
# topic_id: ___

voice:
  # 走 cap-tts 能力: provider/voice/emotion 单句小样 -> 生产 strict_provider(失败即停, 不回退其他音色)
  engine: minimax          # 由 cap-tts 支持的 provider 决定
  model:                   # provider 对应模型
  voice_id:                # 具体音色 id
  speed: 0.95
  pitch: 0
  emotion: neutral
  script_path:             # 口播逐字稿路径

bgm:
  # -- enabled 决策规则(视频音画硬门: BGM 为条件件, 非硬门) --
  # auto = 按形态 + VO 密度自动判定:
  #   密 VO 演示/知识型(VO 覆盖率 >=85% + 每段无 3s+ 死区) -> 默认 off
  #   稀疏 VO / 出镜型 / 情感叙事型 / 带货型                 -> 默认 on
  # 密 VO 已把氛围撑满, 硬加 BGM 只会盖 VO(D07: 密 VO 无 BGM 模式下 >=85% 覆盖);
  # 交接期若需氛围, 用 -24 dB 环境垫音, 别用曲。
  #
  # -- 情感型/出镜型选题: "先定情绪再选音乐" --
  # 步骤: (1) 问本条要传递什么情绪(高级冷静 / 活力动感 / 悬疑紧张 / 温暖释放)
  #      (2) 按 mood -> genre -> 乐器 匹配:
  #         高级冷静 -> 钢琴+弦乐 · piano ambient / cinematic minimal
  #         活力动感 -> 电子鼓 · electronic upbeat / synthwave
  #         悬疑紧张 -> 弦乐持续+低频 · tension drone / suspense pad
  #         温暖释放 -> 木吉他+钢琴 · acoustic warm / lo-fi chill
  #      (3) 关注节奏速度、乐器质感、氛围层次, 不是"好听"(D19 情绪弧镜像视觉弧)
  # ------------------------------------------------------------------
  enabled: auto            # auto | on | off; 单条选题可强制 on/off, 需在 notes 说明
  mood: tension            # tension | release | upbeat | calm | neutral | warm | suspense (enabled=off 时忽略)
  genre_hint:              # 情感型必填: piano_ambient / electronic_upbeat / tension_drone / acoustic_warm
  source:                  # 授权素材路径(走 cap-stock-footage / 授权曲库; enabled=off 时留空)
  volume: 0.10             # 对齐 storyboard music_volume
  fade_in_s: 1.5
  fade_out_s: 2.0
  loop: true
  benchmark_ref:           # hook_benchmark 参考编号(如「参考1·紧张铺底」)
  hook_0_3s:               # 0-3s: 入点情绪、是否压人声、与钩子同拍
  notes:                   # 选曲理由 / off 时说明「密 VO 已撑满, 无 BGM」

# -- sfx 音效层 ----------------------------------------------------
# 独立于 BGM · 密 VO 演示/知识型也必须有 sfx(BGM 可 off, sfx 不 off)
# D07「提升 3 档目标」: SFX 密度 >= 画面变化密度(每次切换/金句/CTA 配 SFX)
# 万能公式: riser(上声) + ambient(氛围) + hit(打点重音)
#   找音乐/画面断点 -> 加 ambient 铺底 -> 加 riser 推起 -> 加 hit 落地
# 四类事件音(音量分级: 均比 VO 低 10-15 dB · 让观众感觉自然而不是"注意到"):
#   whoosh    每次场景切换 / 转场 · 检索: whoosh · swoosh · swish · transition
#   tick      文字/字幕/UI 出现 · 检索: UI tick · typewriter click · message tap
#   hit       关键金句 / CTA / 反转打点 · 检索: impact · boom · stinger · hit
#   ambient   全片/大段氛围铺底 · 检索: room tone · night city · office ambience
# 合规: sfx 禁用合成器拼假的(sine/aevalsrc 一类), 必须走授权 CC0 曲库(Freesound / Epidemic / Artlist),
#       素材经 cap-stock-footage / 授权渠道获取后落本地素材库。
# 检索技巧: 写形容词 -> 翻译英文 -> 搜索
#   悬疑紧张 -> tension riser · suspense build
#   反转揭示 -> impact hit · boom stinger
#   进入界面 -> UI whoosh in · pop in
# ------------------------------------------------------------------
sfx:
  enabled: true            # 视频形态默认 true · sfx 是 audio_plan 硬门(不是 BGM 的替代)
  formula_check:           # 打勾即声明"公式已用": ambient 铺 + riser 推 + hit 落
    ambient_bed: false     # 是否有全片/段落氛围铺底
    riser_before_hit: false  # 关键 hit 前是否有 riser 推起
    hit_on_key_moment: false # 关键金句/CTA 是否有 hit 打点
  gain_ref_db: -12         # sfx 相对 VO 的 dB 差(-10~-15; 越靠近 -10 越明显)
  events:                  # 逐个 sfx 事件 · 至少覆盖每次场景切换 + 关键金句 + CTA
    # 示例(真实条按 storyboard M 段填):
    # - {sid: sfx01, kind: whoosh, t_start: 3.0, duration: 0.5, gain_db: -12, src_rel: assets/sfx/whoosh/soft_swish_01.wav, note: "M1->M2 切换"}
    # - {sid: sfx02, kind: tick,   t_start: 6.5, duration: 0.2, gain_db: -15, src_rel: assets/sfx/tick/ui_tap_01.wav,   note: "字幕入"}
    # - {sid: sfx03, kind: hit,    t_start: 24.0, duration: 0.8, gain_db: -8,  src_rel: assets/sfx/hit/impact_boom_01.wav, note: "反转金句落地"}
    # - {sid: sfx04, kind: ambient, t_start: 0.0, duration: 172.0, gain_db: -22, src_rel: assets/sfx/ambient/night_room_tone.wav, note: "全片深夜铺底"}

subtitles:
  # 视频音画硬门: 字幕叠主画面(必满足)
  srt_path:                # 字幕文件路径
  burn: true               # 叠 PNG 序列 / 烧录进主画面
  style: 主画面叠字, 前 3s 大字钩子
  hook_first_3s: true

outputs:
  video_raw:               # 无 BGM 工程件
  video_publish:           # 默认外发: 含 BGM(若 on) + 字幕; 无 BGM 命名 *_no_bgm.mp4 也可直接外发
  vo_mp3:

qc:
  - VO 清晰可辨, 前 6s RMS >= -25 dB(QG-MEDIA-HEAD-RMS; 目标区间 -13~-23 dB 对齐参考视频响度)
  - 全片无静音死区 >=3.0s(QG-MEDIA-SILENCE)
  - 若 bgm.enabled != off: BGM 不盖人声(人工听 30s); 0-3s BGM 入点不抢戏(对照 retention 节拍表)
  - 若 bgm.enabled == off: 全程无音乐是「设计」不是「缺件」, 需在 notes 记明依据
  - sfx 硬门: sfx.enabled=true 且 formula_check 三项至少 2 项为 true; 否则退回声音设计师
  - sfx 覆盖(D07): 每次场景切换(M1->M2 等)必有 1 个 whoosh; 关键金句 + CTA 必有 hit; 缺一即 fail
  - sfx 音量: 所有 sfx.events[].gain_db <= -8(hit 最响也不超过 VO -8dB · 让观众"感觉自然"而不是"注意到"音效")
  - sfx 合规: 所有 src_rel 走本地授权素材库文件, 禁合成器(sine/aevalsrc)拼假音效
  - 卡点(D06): 视觉变化时刻与音乐 transient 帧级对齐(目测偏差易达 100-300ms, 冲击感消失)
  - 前 3s 钩子字幕可见, 且与 hook_benchmark 停划设计一致
  - 外发使用 video_publish, 非 video_raw

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>04 Ingredients · 漫画</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <script src="../shared/comic_parts.js"></script>
  <style>
    /* 大标题 "成分公开" 手写 */
    .title-area {
      position: absolute;
      left: 60px;
      right: 60px;
      top: 360px;
      text-align: center;
    }
    .title {
      display: inline-block;
      font-family: var(--hand-bold);
      font-weight: 900;
      font-size: 180px;
      letter-spacing: 2px;
      color: var(--ink);
      opacity: 0;
      position: relative;
      transform: rotate(-2deg);
    }
    .title::after {
      content: "";
      position: absolute;
      left: -10px; right: -10px;
      bottom: -8px;
      height: 12px;
      background: var(--yellow);
      z-index: -1;
      transform: rotate(-1deg);
    }
    .title-emphasize {
      color: var(--red);
    }

    /* 5 颗咀嚼片网格 */
    .grid {
      position: absolute;
      left: 0;
      right: 0;
      top: 700px;
      padding: 0 80px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 50px 30px;
      justify-items: center;
    }
    .chew-card {
      width: 240px;
      height: 280px;
      position: relative;
      opacity: 0;
    }
    .chew-card .chew {
      width: 200px;
      height: 200px;
      margin: 0 auto;
    }
    .chew-card .name {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      text-align: center;
      font-family: var(--hand-bold);
      font-weight: 900;
      font-size: 48px;
      color: var(--ink);
    }
    .chew-card:nth-child(1) { transform: rotate(-3deg); }
    .chew-card:nth-child(2) { transform: rotate(1deg); }
    .chew-card:nth-child(3) { transform: rotate(-1.5deg); }
    .chew-card:nth-child(4) { transform: rotate(2deg); }
    .chew-card:nth-child(5) { transform: rotate(-2deg); }

    /* 第 5 颗 (奇数,居中第二排) */
    .chew-card.solo {
      grid-column: 2 / 3;
    }

    /* 拟声"嗯!" */
    .sfx-mm {
      bottom: 480px;
      right: 80px;
      opacity: 0;
    }

    /* 闪光小 */
    .spark-deco {
      position: absolute;
      width: 50px;
      height: 50px;
      opacity: 0;
    }
    .spark-deco.d1 { top: 480px; left: 80px; }
    .spark-deco.d2 { top: 520px; right: 100px; transform: rotate(20deg); }
    .spark-deco.d3 { top: 1420px; left: 60px; transform: rotate(-15deg); }
  </style>
</head>
<body>
  <div class="canvas">

    <div class="title-area">
      <div class="title" id="title">成分<span class="title-emphasize">公开</span></div>
    </div>

    <div class="spark-deco d1" id="d1"></div>
    <div class="spark-deco d2" id="d2"></div>

    <div class="grid" id="grid"></div>

    <div class="sfx sfx-mm big yellow" id="sfx">嗯!</div>

    <div class="spark-deco d3" id="d3"></div>
  </div>

  <script>
    const data = window.getData();
    if (data.title) {
      const t = data.title;
      const half = Math.floor(t.length / 2);
      document.getElementById("title").innerHTML =
        t.substring(0, half) + '<span class="title-emphasize">' + t.substring(half) + '</span>';
    }
    if (data.sfx) document.getElementById("sfx").textContent = data.sfx;

    const grid = document.getElementById("grid");
    const items = data.ingredients || [];
    items.forEach((ing, i) => {
      const isLast = i === items.length - 1 && items.length % 3 === 2;
      const isSolo = i === items.length - 1 && items.length % 3 === 1;
      const card = document.createElement("div");
      card.className = "chew-card" + (isSolo ? " solo" : "");
      card.innerHTML = `
        <div class="chew" id="chew_${i}"></div>
        <div class="name">${ing.name}</div>
      `;
      grid.appendChild(card);
    });
    // draw chewable inside each card
    items.forEach((ing, i) => {
      window.drawPart(`#chew_${i}`, "chewable", ing.label || "");
    });
    window.drawPart("#d1", "sparkle");
    window.drawPart("#d2", "sparkle");
    window.drawPart("#d3", "sparkle");

    const tl = gsap.timeline();

    // 0.0 标题
    tl.fromTo("#title",
      { opacity: 0, y: 30, rotate: -8 },
      { opacity: 1, y: 0, rotate: -2, duration: 0.5, ease: "back.out(1.5)" }, 0);

    // 0.4 ✨ 闪光 d1 d2
    tl.fromTo(["#d1","#d2"],
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.3, stagger: 0.1 }, 0.4);

    // 0.8 起 5 颗咀嚼片 stagger 弹入
    const cards = document.querySelectorAll(".chew-card");
    const rots = [-3, 1, -1.5, 2, -2];
    cards.forEach((c, i) => {
      tl.fromTo(c,
        { opacity: 0, scale: 0.4, y: 80, rotate: rots[i] + 10 },
        { opacity: 1, scale: 1, y: 0, rotate: rots[i], duration: 0.4, ease: "back.out(1.6)" },
        0.8 + i * 0.35);
    });

    // 3.0 拟声嗯!
    tl.fromTo("#sfx",
      { opacity: 0, scale: 1.8, rotate: 30 },
      { opacity: 1, scale: 1, rotate: 8, duration: 0.45, ease: "back.out(2)" }, 3.0);
    tl.to("#sfx", { rotate: 4, duration: 0.15, yoyo: true, repeat: 4 }, 3.5);

    // 3.4 d3
    tl.fromTo("#d3",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.3 }, 3.4);

    // 持续闪
    tl.to(["#d1","#d2","#d3"],
      { rotate: "+=360", duration: 2, ease: "none", repeat: -1 }, 3.5);

    // 锁尾
    tl.to({}, { duration: 1.5 }, 4.8);

    registerTimeline(tl);
  </script>
</body>
</html>

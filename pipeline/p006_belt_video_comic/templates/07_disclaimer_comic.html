<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>07 Disclaimer · 漫画</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <script src="../shared/comic_parts.js"></script>
  <style>
    .canvas {
      background-color: #fff3d4;
    }

    .stamp-top {
      position: absolute;
      left: 0; right: 0;
      top: 340px;
      text-align: center;
      opacity: 0;
    }
    .stamp-top .title {
      display: inline-block;
      font-family: var(--hand-bold);
      font-weight: 900;
      font-size: 140px;
      color: var(--ink);
      padding: 12px 48px;
      background: var(--red);
      color: var(--paper);
      border: 8px solid var(--ink);
      box-shadow: 8px 10px 0 var(--ink);
      transform: rotate(-3deg);
    }

    /* 严肃头像 */
    .char-serious {
      position: absolute;
      left: 50%;
      top: 540px;
      transform: translateX(-50%);
      width: 260px;
      height: 280px;
      opacity: 0;
    }

    /* 3 条手写笔记 */
    .notes {
      position: absolute;
      left: 80px;
      right: 80px;
      top: 900px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .note {
      background: var(--paper);
      border: 6px solid var(--ink);
      padding: 24px 36px;
      font-family: var(--hand-bold);
      font-size: 60px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
      box-shadow: 5px 7px 0 var(--ink);
      opacity: 0;
    }
    .note .bullet {
      color: var(--red);
      font-family: var(--hand-bold);
      font-weight: 900;
      margin-right: 12px;
    }
    .note:nth-child(1) { transform: rotate(-2deg); }
    .note:nth-child(2) { transform: rotate(1.5deg); margin-left: 30px; }
    .note:nth-child(3) { transform: rotate(-1deg); margin-left: -10px; }

    /* 三角警示 SVG */
    .warn-icon {
      position: absolute;
      top: 540px;
      left: 80px;
      width: 200px;
      height: 200px;
      opacity: 0;
      transform: rotate(-6deg);
    }
  </style>
</head>
<body>
  <div class="canvas">

    <div class="stamp-top">
      <span class="title" id="title">等等⚠</span>
    </div>

    <svg class="warn-icon" id="warn" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M 50 5 L 95 90 L 5 90 Z" fill="#ffd23f" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
      <line x1="50" y1="30" x2="50" y2="65" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
      <circle cx="50" cy="78" r="5" fill="#1a1a1a"/>
    </svg>

    <div class="char-serious" id="char"></div>

    <div class="notes" id="notes"></div>

  </div>

  <script>
    const data = window.getData();
    window.drawHead("#char", data.expr_serious || "serious");
    if (data.title) document.getElementById("title").innerHTML = data.title;

    const notes = document.getElementById("notes");
    const lines = data.lines || [
      "孕产期 - 问医生",
      "长期吃药 - 问医生",
      "成分看包装",
    ];
    lines.forEach((line) => {
      const div = document.createElement("div");
      div.className = "note";
      div.innerHTML = '<span class="bullet">▸</span>' + line;
      notes.appendChild(div);
    });

    const tl = gsap.timeline();

    // 0.0 顶部红印章
    tl.fromTo(".stamp-top",
      { opacity: 0, scale: 1.4, y: -40 },
      { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.8)" }, 0);
    tl.to(".stamp-top .title", { rotate: -1, duration: 0.1, yoyo: true, repeat: 4 }, 0.4);

    // 0.4 警示 & 头像
    tl.fromTo("#warn",
      { opacity: 0, scale: 0.5, rotate: -30 },
      { opacity: 1, scale: 1, rotate: -6, duration: 0.4, ease: "back.out(1.8)" }, 0.4);
    tl.fromTo("#char",
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.4 }, 0.6);

    // 0.9 起 3 条笔记 stagger
    const notesEl = document.querySelectorAll(".note");
    const rots = [-2, 1.5, -1];
    notesEl.forEach((el, i) => {
      tl.fromTo(el,
        { opacity: 0, x: -60, rotate: rots[i] - 4 },
        { opacity: 1, x: 0, rotate: rots[i], duration: 0.4, ease: "back.out(1.4)" },
        0.9 + i * 0.4);
    });

    // 锁尾
    tl.to({}, { duration: 0.5 }, 3.0);

    registerTimeline(tl);
  </script>
</body>
</html>

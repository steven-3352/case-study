<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>P006 Subtitles · 漫画风</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    html, body, .canvas { background: transparent !important; }

    /* 漫画字幕 · 大对话气泡风格 */
    .sub-line {
      position: absolute;
      left: 80px;
      right: 80px;
      bottom: 380px;
      text-align: center;
      opacity: 0;
    }
    .sub-line .bubble {
      display: inline-block;
      background: rgba(253, 251, 245, 0.95);
      color: var(--ink);
      font-family: var(--hand-bold);
      font-weight: 900;
      font-size: 56px;
      letter-spacing: 1.5px;
      line-height: 1.3;
      padding: 16px 36px 20px;
      border: 6px solid var(--ink);
      border-radius: 30px;
      box-shadow: 5px 7px 0 var(--ink);
      max-width: 900px;
    }
    .sub-line.tilt-1 { transform: rotate(-1deg); }
    .sub-line.tilt-2 { transform: rotate(0.8deg); }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="sub-line" id="sub">
      <span class="bubble" id="bubble"></span>
    </div>
  </div>

  <script>
    // 字幕时序 (对齐 vo_v0.mp3)
    const lines = [
      { t: 0.2,  end: 4.0,  text: "我把家里那瓶维生素胶囊扔了", tilt: 1 },
      { t: 4.1,  end: 6.5,  text: "放了半年 还剩 78 粒", tilt: 2 },
      { t: 6.6,  end: 10.2, text: "不是吃不下 是不愿吃", tilt: 1 },
      { t: 10.3, end: 13.3, text: "大男人吞胶囊总有种病人感", tilt: 2 },
      { t: 13.4, end: 17.5, text: "后来我换成了能嚼的", tilt: 1 },
      { t: 17.6, end: 22.5, text: "成分:烟酰胺·维C·维E·维B·葡萄籽", tilt: 2 },
      { t: 22.6, end: 26.5, text: "60 片不到 60 块 一天不到 7 毛", tilt: 1 },
      { t: 26.6, end: 29.5, text: "比一杯瑞幸便宜十几倍", tilt: 2 },
      { t: 29.6, end: 33.0, text: "好下口 不卡喉 顺手", tilt: 1 },
      { t: 33.1, end: 36.0, text: "本视频不构成健康建议", tilt: 2 },
      { t: 36.1, end: 38.5, text: "你怎么补维生素的?", tilt: 1 },
      { t: 38.6, end: 40.0, text: "评论区聊聊", tilt: 2 },
    ];

    const sub = document.getElementById("sub");
    const bubble = document.getElementById("bubble");
    const tl = gsap.timeline();

    lines.forEach((line) => {
      tl.call(() => {
        bubble.textContent = line.text;
        sub.className = "sub-line tilt-" + line.tilt;
      }, [], line.t);
      tl.fromTo(sub,
        { opacity: 0, scale: 0.7, y: 16 },
        { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "back.out(1.6)" },
        line.t);
      tl.to(sub, { opacity: 0, duration: 0.2 }, line.end - 0.2);
    });

    tl.to({}, { duration: 0.05 }, 40.0);

    registerTimeline(tl);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>02 Pain · 漫画</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <script src="../shared/comic_parts.js"></script>
  <style>
    /* 左框 - 不是吃不下 */
    .p-left {
      left: 60px;
      top: 460px;
      width: 460px;
      height: 600px;
      padding: 30px 30px 80px;
      transform: rotate(-2deg);
      opacity: 0;
    }
    /* 右框 - 是不愿吃 (倾斜重叠) */
    .p-right {
      right: 50px;
      top: 700px;
      width: 480px;
      height: 640px;
      padding: 30px 30px 80px;
      transform: rotate(2.5deg);
      opacity: 0;
      z-index: 3;
    }
    .panel .label {
      position: absolute;
      bottom: 18px;
      left: 0; right: 0;
      text-align: center;
      font-family: var(--hand-bold);
      font-weight: 900;
      font-size: 56px;
      color: var(--ink);
    }
    .panel.red .label { color: var(--paper); }

    .char-mini {
      position: absolute;
      left: 50%;
      top: 60px;
      transform: translateX(-50%);
      width: 320px;
      height: 340px;
    }
    .pill-mini {
      position: absolute;
      top: 200px;
      left: 50%;
      transform: translateX(-50%) rotate(-8deg);
      width: 220px;
      height: 100px;
    }

    /* 大 X 划掉 */
    .x-mark {
      position: absolute;
      top: 250px;
      right: 110px;
      font-family: var(--hand-bold);
      font-size: 360px;
      color: var(--red);
      opacity: 0;
      line-height: 1;
      z-index: 10;
      text-shadow:
        -5px 0 0 var(--ink), 5px 0 0 var(--ink),
        0 -5px 0 var(--ink), 0 5px 0 var(--ink);
    }

    /* 右框拟声"咳!" */
    .sfx-cough {
      position: absolute;
      top: 60px;
      right: -40px;
      opacity: 0;
      z-index: 11;
    }

    /* 速度线 (右框 pained 周围) */
    .stress-line {
      position: absolute;
      background: var(--ink);
      height: 5px;
      transform-origin: center;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="canvas">

    <div class="panel yellow p-left" id="pLeft">
      <div class="char-mini" id="char1"></div>
      <div class="pill-mini" id="pill1"></div>
      <div class="label" id="lbl1">不是吃不下</div>
    </div>

    <div class="x-mark" id="x">✗</div>

    <div class="panel red p-right" id="pRight">
      <div class="char-mini" id="char2"></div>
      <div class="pill-mini" id="pill2"></div>
      <div class="label" id="lbl2">是不愿吃</div>
    </div>

    <div class="sfx sfx-cough big yellow" id="sfx">咳!</div>

  </div>

  <script>
    const data = window.getData();
    window.drawHead("#char1", "confused");
    window.drawHead("#char2", data.expr_pain || "pained");
    window.drawPart("#pill1", "pillCapsule");
    window.drawPart("#pill2", "pillCapsule");
    if (data.panel_1_label) document.getElementById("lbl1").textContent = data.panel_1_label;
    if (data.panel_2_label) document.getElementById("lbl2").textContent = data.panel_2_label;
    if (data.sfx_panel2) document.getElementById("sfx").textContent = data.sfx_panel2;

    const tl = gsap.timeline();

    // 0.0 左框弹入
    tl.fromTo("#pLeft",
      { opacity: 0, x: -80, rotate: -8 },
      { opacity: 1, x: 0, rotate: -2, duration: 0.5, ease: "back.out(1.4)" }, 0);

    // 1.2 大 X 砸入
    tl.fromTo("#x",
      { opacity: 0, scale: 2.5, rotate: 30 },
      { opacity: 1, scale: 1, rotate: -8, duration: 0.4, ease: "back.out(2)" }, 1.0);

    // 1.7 右框弹入
    tl.fromTo("#pRight",
      { opacity: 0, x: 80, rotate: 10 },
      { opacity: 1, x: 0, rotate: 2.5, duration: 0.55, ease: "back.out(1.4)" }, 1.5);

    // 2.4 "咳!"
    tl.fromTo("#sfx",
      { opacity: 0, scale: 1.8, rotate: 40 },
      { opacity: 1, scale: 1, rotate: 12, duration: 0.4, ease: "back.out(2)" }, 2.3);
    tl.to("#sfx", { rotate: 8, duration: 0.12, yoyo: true, repeat: 4 }, 2.9);

    // 锁尾
    tl.to({}, { duration: 0.5 }, 4.0);

    registerTimeline(tl);
  </script>
</body>
</html>

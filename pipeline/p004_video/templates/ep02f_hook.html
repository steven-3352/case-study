<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP02 s0 · 开场坦白钩子 · 被 AI 骗了好久</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 60% at 50% 42%, rgba(229,72,77,.06), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.88) 0%, rgba(6,9,14,.66) 34%, rgba(6,9,14,.62) 60%, rgba(6,9,14,.9) 88%, rgba(6,9,14,.97) 100%); }
  .vig{ position:absolute; inset:0; box-shadow:inset 0 0 320px 80px rgba(0,0,0,.6); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .wrap{ position:absolute; left:70px; right:70px; top:520px; text-align:center; }
  .kick{ font-size:52px; color:#c9d1d9; font-weight:800; letter-spacing:1px; opacity:0;
    text-shadow:0 3px 18px rgba(0,0,0,.85); }
  .kick s{ text-decoration:none; color:var(--muted); }
  .kick .sh{ font-size:44px; margin-left:10px; }
  .hero{ margin-top:64px; font-size:96px; font-weight:900; line-height:1.16; letter-spacing:2px;
    text-shadow:0 6px 30px rgba(0,0,0,.85); opacity:0; }
  .hero .ai{ color:var(--amber); }
  .punch{ margin-top:40px; font-size:150px; font-weight:900; line-height:1.02; letter-spacing:4px;
    text-shadow:0 8px 40px rgba(0,0,0,.9); opacity:0; }
  .punch b{ color:var(--red); }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="vig"></div><div class="noise"></div>
    <div class="wrap">
      <div class="kick" id="kick">欸…… 跟你说个 <s>丢人</s> 的事<span class="sh">🤫 小点声</span></div>
      <div class="hero" id="hero">我,被我自己养的 <span class="ai">AI</span></div>
      <div class="punch" id="punch">骗了<b>好久</b></div>
    </div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.fromTo("#kick", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.6, ease:"power2.out" }, 0.3);
  // "我被我自己养的 AI"(凑近坦白)
  tl.fromTo("#hero", { opacity:0, y:22 }, { opacity:1, y:0, duration:0.6, ease:"power3.out" }, 3.6);
  tl.to("#hero .ai", { scale:1.1, duration:0.5, yoyo:true, repeat:1, ease:"sine.inOut", transformOrigin:"center" }, 4.6);
  // "骗了好久"(咬一下,砸出)
  tl.fromTo("#punch", { opacity:0, scale:0.8, y:20 }, { opacity:1, scale:1, y:0, duration:0.55, ease:"back.out(1.5)" }, 7.7);
  tl.fromTo("#punch b", { scale:1.7 }, { scale:1, duration:0.42, ease:"back.out(3)" }, 8.05);
  tl.to("#punch", { keyframes:[{ x:-9 },{ x:9 },{ x:-5 },{ x:0 }], duration:0.26, ease:"none" }, 8.1);
  tl.to("#punch b", { textShadow:"0 0 40px rgba(229,72,77,.7)", duration:0.5, yoyo:true, repeat:2, ease:"sine.inOut" }, 8.5);
  tl.to({}, { duration:0.8 }, 10.7);
  registerTimeline(tl);
</script>
</body>
</html>

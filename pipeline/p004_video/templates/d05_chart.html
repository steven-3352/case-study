<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  body{background:#000;}
  /* 顶部 — countUp 数 1200 + 反差句 */
  .top{position:absolute;top:80px;left:60px;right:60px;text-align:center;}
  .top .lbl{font-size:30px;color:var(--gray-3);letter-spacing:4px;}
  .top .num{font-family:var(--mono);font-size:200px;font-weight:900;color:var(--red);
    line-height:1;letter-spacing:-4px;margin-top:8px;text-shadow:0 6px 0 #000;}
  .top .unit{font-size:46px;color:#fff;font-weight:700;margin-top:4px;letter-spacing:4px;}
  .top .contrast{margin-top:24px;font-size:50px;color:#fff;font-weight:800;letter-spacing:2px;opacity:0;}
  .top .contrast .hi{color:var(--orange);font-weight:900;}
  /* 主战场 · 柱图 */
  .chart{position:absolute;top:680px;left:50px;right:50px;background:#0a0a0a;
    border:3px solid #1c1c1c;border-radius:24px;padding:30px 36px 24px 36px;opacity:0;}
  .chart .ti{font-size:30px;color:var(--gray-2);letter-spacing:2px;margin-bottom:24px;}
  .chart .ti .em{color:var(--red);font-weight:900;}
  .bars{display:flex;flex-direction:column;gap:18px;}
  .bar{display:flex;align-items:center;gap:18px;}
  .bar .name{width:280px;font-size:28px;color:#fff;}
  .bar .track{flex:1;height:42px;background:#1c1c1c;border-radius:8px;overflow:hidden;position:relative;}
  .bar .fill{height:100%;width:0;border-radius:8px;background:var(--red);}
  .bar.head .fill{background:linear-gradient(90deg,var(--red),#ff7a00);}
  .bar.tail .fill{background:#3a3a3a;}
  .bar .pct{width:90px;text-align:right;font-family:var(--mono);font-size:30px;font-weight:800;color:var(--red);}
  .bar.tail .pct{color:var(--gray-3);}
  /* 头部 5 类高亮印章 */
  .seal{position:absolute;top:80px;right:50px;background:var(--red);color:#fff;
    font-size:50px;font-weight:900;padding:14px 32px;border-radius:12px;
    transform:rotate(-8deg);opacity:0;letter-spacing:4px;
    box-shadow:0 8px 24px rgba(229,57,53,.6);}
  .wm{position:absolute;top:1830px;right:40px;font-size:22px;color:var(--gray-3);opacity:.55;}
</style></head>
<body>
<div class="canvas">
  <div class="top">
    <div class="lbl">90 天群聊天记录 · 全部归类</div>
    <div class="num" id="num">0</div>
    <div class="unit">条客户问题</div>
    <div class="contrast" id="contrast">真不一样的就 <span class="hi">10 来类</span></div>
  </div>
  <div class="chart" id="chart">
    <div class="ti">头部 5 类 <span class="em">占 7 成多</span> · 长尾 6 类合计不到 3 成</div>
    <div class="bars">
      <div class="bar head" id="b1">
        <div class="name">营业时间</div>
        <div class="track"><div class="fill" data-w="78"></div></div>
        <div class="pct">22%</div>
      </div>
      <div class="bar head" id="b2">
        <div class="name">价格 / 团购</div>
        <div class="track"><div class="fill" data-w="64"></div></div>
        <div class="pct">18%</div>
      </div>
      <div class="bar head" id="b3">
        <div class="name">改约 / 预约</div>
        <div class="track"><div class="fill" data-w="50"></div></div>
        <div class="pct">14%</div>
      </div>
      <div class="bar head" id="b4">
        <div class="name">产品适用</div>
        <div class="track"><div class="fill" data-w="40"></div></div>
        <div class="pct">11%</div>
      </div>
      <div class="bar head" id="b5">
        <div class="name">退换货</div>
        <div class="track"><div class="fill" data-w="30"></div></div>
        <div class="pct">8%</div>
      </div>
      <div class="bar tail" id="b6">
        <div class="name">其他 6 类合计</div>
        <div class="track"><div class="fill" data-w="68"></div></div>
        <div class="pct">~27%</div>
      </div>
    </div>
  </div>
  <div class="seal" id="seal">7 成多</div>
  <div class="wm">某母婴店 90 天群消息分类(示意 · 已脱敏)</div>
</div>
<script>
  const tl=gsap.timeline({paused:true});
  // 0-1.2s 数字 0 → 1247
  const obj={v:0};
  tl.to(obj,{v:1247,duration:1.2,ease:"power2.out",
    onUpdate:()=>{document.getElementById("num").textContent=Math.round(obj.v);}},0);
  // 1.0-1.4 反差句"10 来类"
  tl.fromTo("#contrast",{opacity:0,y:20},{opacity:1,y:0,duration:.4,ease:"power2.out"},1.2);
  // 1.6 柱图整体淡入
  tl.fromTo("#chart",{opacity:0,y:30},{opacity:1,y:0,duration:.4},1.6);
  // 2.0-5.5 6 条柱图 stagger 横向铺开
  ["#b1","#b2","#b3","#b4","#b5","#b6"].forEach((b,i)=>{
    tl.fromTo(b+" .fill",{width:"0%"},{width:(p)=>{
      const el=document.querySelector(b+" .fill");
      return el.dataset.w+"%";
    },duration:.7,ease:"power2.out"},2.0+i*0.45);
  });
  // 5.8 "7 成多" 印章砸入
  tl.fromTo("#seal",{opacity:0,scale:.4,rotation:-25},{opacity:1,scale:1,rotation:-8,duration:.5,ease:"back.out(2)"},5.6);
  // 收尾
  tl.to({},{duration:1.0},6.2);
  registerTimeline(tl);
</script>
</body></html>

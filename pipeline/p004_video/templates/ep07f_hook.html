<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP07 s0 · 开场给货钩子 · 5 步复刻</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 60% at 50% 40%, rgba(63,185,80,.06), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.82) 0%, rgba(6,9,14,.62) 34%, rgba(6,9,14,.6) 60%, rgba(6,9,14,.9) 88%, rgba(6,9,14,.97) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .wrap{ position:absolute; left:70px; right:70px; top:560px; text-align:center; }
  .kick{ font-size:52px; color:var(--muted); font-weight:800; letter-spacing:1px; opacity:0; }
  .hero{ margin-top:36px; font-size:150px; font-weight:900; line-height:1.06; letter-spacing:2px;
    text-shadow:0 6px 30px rgba(0,0,0,.8); opacity:0; }
  .hero b{ color:var(--green); }
  .tag{ margin-top:56px; display:inline-block; font-size:58px; font-weight:900; color:#fff;
    background:rgba(210,153,34,.16); border:2px solid var(--amber); border-radius:20px;
    padding:22px 46px; letter-spacing:2px; opacity:0; }
  .tag b{ color:var(--amber); }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="wrap">
      <div class="kick" id="kick">想自己也造一个?</div>
      <div class="hero" id="hero"><b>5 步</b>,复刻</div>
      <div class="tag" id="tag">坑,<b>我都替你标好了</b></div>
    </div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.fromTo(".stage", { scale:1.0 }, { scale:1.012, duration:4.89, ease:"sine.inOut" }, 0);
  tl.fromTo("#kick", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 0.2);
  tl.fromTo("#hero", { opacity:0, scale:0.9, y:20 }, { opacity:1, scale:1, y:0, duration:0.5, ease:"back.out(1.4)" }, 1.0);
  tl.fromTo("#hero b", { scale:1.5 }, { scale:1, duration:0.4, ease:"back.out(3)", transformOrigin:"center" }, 1.4);
  tl.fromTo("#tag", { opacity:0, y:20 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 2.2);
  tl.to("#tag b", { scale:1.06, duration:0.5, yoyo:true, repeat:2, ease:"sine.inOut", transformOrigin:"center" }, 2.9);
  tl.to({}, { duration:0.6 }, 4.89 - 0.2);
  registerTimeline(tl);
</script>
</body>
</html>

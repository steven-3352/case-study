<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP05 s2 · 4道锁</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.8),rgba(6,9,14,.64) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .title{position:absolute;left:52px;right:52px;top:230px;text-align:center;font-size:60px;font-weight:900;opacity:0}
  .title b{color:var(--green)}
  .locks{position:absolute;left:52px;right:52px;top:380px;display:flex;flex-direction:column;gap:22px}
  .lock{opacity:0;background:rgba(19,26,22,.9);border:2px solid rgba(63,185,80,.4);border-radius:18px;padding:26px 32px;display:flex;align-items:center;gap:26px;box-shadow:0 16px 50px rgba(0,0,0,.5)}
  .lock .ic{font-size:56px;flex:none}
  .lock .n{font-size:34px;color:var(--amber);font-weight:800;font-family:"SF Mono",monospace;flex:none;width:120px}
  .lock .d{font-size:40px;font-weight:800}
  .lock .d b{color:var(--red)}
  .caption{position:absolute;left:52px;right:52px;bottom:190px;text-align:center;font-size:76px;font-weight:900;line-height:1.2;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--green)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="title" id="title">我不再信它 —— <b>上 4 道锁</b></div>
    <div class="locks">
      <div class="lock" id="l1"><div class="ic">💉</div><div class="n">闸 ①</div><div class="d">开工<b>自动注入</b> · 不靠它记</div></div>
      <div class="lock" id="l2"><div class="ic">🔍</div><div class="n">闸 ②</div><div class="d">写前搜 · 体检<b>挡 push</b></div></div>
      <div class="lock" id="l3"><div class="ic">🔒</div><div class="n">闸 ③</div><div class="d">收工<b>硬互锁</b> · 不确认不许溜</div></div>
      <div class="lock" id="l4"><div class="ic">⚖️</div><div class="n">裁 判</div><div class="d">拿琐事烦我 → <b>当场打回</b></div></div>
    </div>
    <div class="caption" id="cap">让它<b>说到,做到</b></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo("#title",{opacity:0,y:-16},{opacity:1,y:0,duration:.4},0.3);
  ["#l1","#l2","#l3","#l4"].forEach((l,i)=>{
    const at=0.9+i*0.7;
    tl.fromTo(l,{opacity:0,x:-30,scale:.97},{opacity:1,x:0,scale:1,duration:.4,ease:"back.out(1.6)"},at);
    tl.fromTo(l+" .ic",{scale:2,rotation:-15},{scale:1,rotation:0,duration:.35,ease:"back.out(3)"},at+0.1);  // 锁"咔"落
  });
  tl.fromTo("#cap",{opacity:0,y:26},{opacity:1,y:0,duration:.5,ease:"power3.out"},4.0);
  tl.to({},{duration:1.6},5.0);
  registerTimeline(tl);
</script></body></html>

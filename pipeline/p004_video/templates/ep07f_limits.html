<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP07 s5 · 诚实局限四条</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("ep01f_desk.jpg");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.82),rgba(6,9,14,.7) 40%,rgba(6,9,14,.76) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .uhead{position:absolute;left:52px;right:52px;top:360px;text-align:center;font-size:52px;font-weight:900;color:#ffb3b5;opacity:0}
  .limits{position:absolute;left:56px;right:56px;top:490px;display:flex;flex-direction:column;gap:22px}
  .lim{opacity:0;display:flex;align-items:center;gap:22px;background:rgba(26,20,14,.9);border:2px solid rgba(210,153,34,.35);border-radius:16px;padding:26px 30px;font-size:40px;font-weight:700;line-height:1.3}
  .lim .ic{font-size:48px;flex:none}.lim .k{color:var(--amber);font-family:"SF Mono",monospace;flex:none;width:170px}
  .caption{position:absolute;left:52px;right:52px;top:1200px;text-align:center;font-size:70px;font-weight:900;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--amber)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="uhead" id="uhead">丑话,说前面 ——</div>
    <div class="limits">
      <div class="lim" id="m1"><span class="ic">🌱</span><span class="k">雏形</span>实战时长,还以"天"计</div>
      <div class="lim" id="m2"><span class="ic">⚠️</span><span class="k">没 100%</span>行为约束,裁判会漏</div>
      <div class="lim" id="m3"><span class="ic">🔌</span><span class="k">吃平台</span>换个环境,hooks 得重搭</div>
      <div class="lim" id="m4"><span class="ic">🚧</span><span class="k">还没做</span>单人单机纯文字 · 多 agent、语音都没上</div>
    </div>
    <div class="caption" id="cap">是<b>路线</b>,不是现状</div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo(".stage",{scale:1.0},{scale:1.010,duration:20.08,ease:"sine.inOut"},0);
  tl.fromTo("#uhead",{opacity:0,y:12},{opacity:1,y:0,duration:.45},0.4);
  // 一条一顿:四条按 VO 停顿逐条落
  ["#m1","#m2","#m3","#m4"].forEach((m,i)=>tl.fromTo(m,{opacity:0,x:-16},{opacity:1,x:0,duration:.45,ease:"power2.out"},[2.0,6.0,9.4,12.6][i]));
  tl.fromTo("#cap",{opacity:0,y:20},{opacity:1,y:0,duration:.55,ease:"power3.out"},17.4);
  tl.to("#cap b",{scale:1.06,duration:.5,yoyo:true,repeat:1,ease:"sine.inOut",transformOrigin:"center"},18.0);
  tl.to({},{duration:1.0},19.88);
  registerTimeline(tl);
</script></body></html>

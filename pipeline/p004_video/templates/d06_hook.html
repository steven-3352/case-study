<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D06 Hook · queue 一行字</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #f5f5f5;
      font-family: "PingFang SC", "Source Han Sans CN", -apple-system, sans-serif;
      color: #1a1a1a;
    }
    .canvas {
      position: relative; width: 1080px; height: 1920px; overflow: hidden;
      background: #f5f5f5;
    }
    .editor {
      position: absolute; top: 120px; left: 48px; right: 48px; height: 1180px;
      background: #fff; border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.06);
      overflow: hidden; opacity: 0;
    }
    .titlebar {
      height: 72px; background: #e8eef5; display: flex; align-items: center;
      padding: 0 24px; gap: 12px; border-bottom: 1px solid #d0d8e4;
    }
    .dot { width: 16px; height: 16px; border-radius: 50%; }
    .dot.r { background: #e53935; }
    .dot.y { background: #f5a623; }
    .dot.g { background: #43a047; }
    .tab {
      margin-left: 20px; background: #fff; border-radius: 8px 8px 0 0;
      padding: 10px 22px; font-size: 26px; color: #333; font-weight: 600;
      border: 1px solid #d0d8e4; border-bottom: none;
    }
    .path {
      padding: 14px 28px; font-size: 24px; color: #666;
      background: #fafbfc; border-bottom: 1px solid #e8eef5;
      font-family: "SF Mono", Menlo, monospace;
    }
    .code {
      padding: 28px 32px; font-family: "SF Mono", Menlo, monospace;
      font-size: 30px; line-height: 1.65; color: #333;
    }
    .ln { display: flex; gap: 24px; opacity: 0; }
    .ln .num { color: #aaa; min-width: 44px; text-align: right; user-select: none; }
    .ln .txt { flex: 1; }
    .ln .k { color: #0550ae; }
    .ln .s { color: #0a7c42; }
    .ln .c { color: #6a737d; }
    .ln.hi {
      background: #fff8e1; margin: 0 -32px; padding: 8px 32px;
      border-left: 6px solid #f5a623;
    }
    .ln.hi .txt { color: #1a1a1a; font-weight: 700; }
    .cursor {
      display: inline-block; width: 3px; height: 34px; background: #0550ae;
      vertical-align: text-bottom; opacity: 0;
    }
    .overlay {
      position: absolute; left: 40px; right: 40px; top: 1340px; text-align: center;
    }
    .overlay .l1 {
      font-size: 96px; font-weight: 900; color: #1a1a1a; line-height: 1.15;
      letter-spacing: 2px; opacity: 0;
    }
    .overlay .l2 {
      font-size: 88px; font-weight: 900; color: #e53935; line-height: 1.15;
      letter-spacing: 2px; opacity: 0; margin-top: 20px;
    }
    .wm {
      position: absolute; top: 1830px; right: 48px; font-size: 22px; color: #999;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="editor" id="editor">
      <div class="titlebar">
        <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
        <div class="tab">queue/topics.yaml</div>
      </div>
      <div class="path">case-study / queue / topics.yaml</div>
      <div class="code">
        <div class="ln" id="ln1"><span class="num">375</span><span class="txt"><span class="c"># W27 选题队列</span></span></div>
        <div class="ln" id="ln2"><span class="num">376</span><span class="txt"><span class="k">topics</span>:</span></div>
        <div class="ln" id="ln3"><span class="num">377</span><span class="txt">&nbsp;&nbsp;- <span class="k">id</span>: T035</span></div>
        <div class="ln hi" id="ln4"><span class="num">378</span><span class="txt">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">title</span>: <span class="s">我只说了一个选题</span><span class="cursor" id="cursor"></span></span></div>
        <div class="ln" id="ln5"><span class="num">379</span><span class="txt">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">angle</span>: <span class="s">多Agent meta</span></span></div>
        <div class="ln" id="ln6"><span class="num">380</span><span class="txt">&nbsp;&nbsp;&nbsp;&nbsp;<span class="k">status</span>: <span class="s">approved</span></span></div>
      </div>
    </div>
    <div class="overlay">
      <div class="l1" id="l1">我只在 queue</div>
      <div class="l2" id="l2">打了一行字</div>
    </div>
    <div class="wm">真实仓库路径(示意)</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to("#editor", { opacity: 1, duration: 0.25 }, 0);
    ["#ln1", "#ln2", "#ln3", "#ln4", "#ln5", "#ln6"].forEach((id, i) => {
      tl.fromTo(id, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.22, ease: "power2.out" }, 0.15 + i * 0.12);
    });
    tl.to("#cursor", { opacity: 1, duration: 0.1 }, 0.9);
    tl.to("#cursor", { opacity: 0, duration: 0.1 }, 1.0);
    tl.to("#cursor", { opacity: 1, duration: 0.1 }, 1.1);
    tl.fromTo("#l1", { opacity: 0, y: 36, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, 1.4);
    tl.fromTo("#l2", { opacity: 0, y: 36, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, 1.85);
    tl.to({}, { duration: 0.5 }, 2.5);
    registerTimeline(tl);
  </script>
</body>
</html>

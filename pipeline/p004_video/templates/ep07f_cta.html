<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP07 s7 · 收官 CTA</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--blue:#1f6feb}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("ep01f_desk.jpg");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.86),rgba(6,9,14,.74) 40%,rgba(6,9,14,.8) 70%,rgba(4,6,10,.97))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .not{position:absolute;left:70px;right:70px;top:500px;text-align:center;opacity:0}
  .not .line{font-size:48px;font-weight:800;color:var(--muted);line-height:1.5}
  .not .line s{text-decoration:none;color:#c9d1d9}
  .seek{position:absolute;left:70px;right:70px;top:760px;text-align:center;opacity:0}
  .seek .line{font-size:60px;font-weight:900;color:#fff;line-height:1.4}
  .seek .g{color:var(--green)}
  .cta{position:absolute;left:60px;right:60px;top:1080px;text-align:center;opacity:0}
  .cta .q{font-size:56px;font-weight:900;color:#fff}
  .cta .act{margin-top:26px;display:inline-block;font-size:52px;font-weight:900;color:#fff;background:var(--blue);border-radius:18px;padding:22px 56px}
  .series{position:absolute;left:0;right:0;top:1400px;text-align:center;font-size:34px;color:var(--muted);font-family:"SF Mono",monospace;opacity:0}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="not" id="not">
      <div class="line">我不求它多牛,<s>也不求这条爆</s>。</div>
    </div>
    <div class="seek" id="seek">
      <div class="line">我求的是 —— 真往前走一步,<br>和<span class="g">真能一起造的人</span>。</div>
    </div>
    <div class="cta" id="cta"><div class="q">你也在折腾这个?</div><div class="act">评论区,见</div></div>
    <div class="series" id="series">连载《把 AI 调教成我的助理》· 完</div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo(".stage",{scale:1.0},{scale:1.008,duration:8.27,ease:"sine.inOut"},0);
  // 平视、不喊口号:全部慢淡入,无弹跳无脉冲
  tl.fromTo("#not",{opacity:0,y:14},{opacity:1,y:0,duration:.6,ease:"power1.out"},0.3);
  tl.fromTo("#seek",{opacity:0,y:14},{opacity:1,y:0,duration:.7,ease:"power1.out"},2.2);
  tl.fromTo("#cta",{opacity:0,y:14},{opacity:1,y:0,duration:.6,ease:"power1.out"},4.4);
  tl.fromTo("#series",{opacity:0},{opacity:1,duration:.6},6.2);
  tl.to({},{duration:1.4},8.07);
  registerTimeline(tl);
</script></body></html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  html,body{background:transparent!important;margin:0;width:1080px;height:1920px;}
  .sub-line{position:absolute;left:50px;right:50px;bottom:140px;text-align:center;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:900;
    font-size:50px;line-height:1.35;color:#fff;letter-spacing:1px;opacity:0;
    text-shadow:-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,4px 4px 0 #000,
      -4px 0 0 #000,4px 0 0 #000,0 -4px 0 #000,0 4px 0 #000,0 0 24px rgba(0,0,0,.95);}
</style></head>
<body><div class="sub-line" id="sub"></div>
<script>
  const lines=[
    {t:0.2,end:3.0,text:"这条视频，我一个字没写、全程没动手"},
    {t:3.0,end:6.4,text:"我就发了一句话，然后去喝了杯水"},
    {t:6.4,end:9.4,text:"回来一看，活全干完了"},
    {t:9.4,end:13.8,text:"我那套系统里，一群 AI 各管一摊"},
    {t:13.8,end:17.4,text:"选题、脚本、素材、剪辑、文案，分工跑完"},
    {t:17.4,end:20.0,text:"我把它们干活的样子，画出来给你看"},
    {t:20.0,end:23.8,text:"我只最后点个头；外包动不动好几百起"},
    {t:23.8,end:27.0,text:"磨好几天、还来回改"},
    {t:27.0,end:31.5,text:"AI 更像替你干活的团队，你是拍板的人"},
    {t:31.5,end:35.0,text:"你看的这条，就是它做的"},
    {t:35.0,end:39.8,text:"你最想把哪件活甩给 AI？评论点名"},
  ];
  const sub=document.getElementById("sub");const tl=gsap.timeline();
  lines.forEach(l=>{tl.call(()=>{sub.textContent=l.text;},[],l.t);
    tl.fromTo(sub,{opacity:0,y:8},{opacity:1,y:0,duration:.18},l.t);
    tl.to(sub,{opacity:0,duration:.18},l.end-0.18);});
  tl.to({},{duration:.05},40.0);
  registerTimeline(tl);
</script></body></html>

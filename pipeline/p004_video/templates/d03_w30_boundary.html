<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../shared/w30_d03.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>.truth{position:absolute;top:330px;left:70px;right:70px;padding:45px;border:6px solid var(--d3-green);font-size:58px;font-weight:950;text-align:center}.bars{position:absolute;top:640px;left:80px;right:80px;display:grid;gap:35px}.bar{height:130px;display:flex;align-items:center;padding:0 35px;background:#fff;border:4px solid #111;font-size:40px;font-weight:900}.bar:before{content:'×';margin-right:28px;color:var(--d3-red);font-size:64px}</style></head><body><div class="canvas"><div class="d3-kicker">证据边界</div><div class="d3-title">这组实验，只支持一件事</div><div class="truth" id="truth"></div><div class="bars" id="bars"></div><div class="subtitle" id="subtitle"></div></div><script>const d=getData(),D=+d.scene_duration||5;truth.textContent=d.observed;(d.not_claims||[]).forEach(x=>{const e=document.createElement('div');e.className='bar';e.textContent=x;bars.appendChild(e)});subtitle.textContent=d.subtitle||'';const gap=Math.max(.6,(D-1.5)/3);const tl=gsap.timeline({paused:true}).from('.truth',{scale:.85,autoAlpha:0,duration:.4}).from('.bar',{x:-100,autoAlpha:0,duration:.3,stagger:gap},Math.max(.5,D*.12)).to('.bar',{x:8,duration:.14,stagger:gap},Math.max(1,D*.25)).to('.truth',{boxShadow:'0 0 0 12px #27ae60',duration:.25},Math.max(2,D*.78)).to({},{duration:D},0);registerTimeline(tl)</script></body></html>

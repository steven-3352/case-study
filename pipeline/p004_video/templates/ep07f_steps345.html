<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP07 s3 · 复刻步③④⑤</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("ep01f_desk.jpg");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.82),rgba(6,9,14,.72) 40%,rgba(6,9,14,.78) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .card{position:absolute;left:56px;right:56px;top:360px;background:rgba(15,19,26,.96);border:2px solid #2a3038;border-radius:26px;padding:40px 46px;box-shadow:0 40px 100px rgba(0,0,0,.7)}
  .card .h{display:flex;align-items:center;gap:16px;border-bottom:2px solid #2a3038;padding-bottom:22px;margin-bottom:12px}
  .card .h .ic{font-size:52px}.card .h .tt{font-size:52px;font-weight:900;color:var(--green)}
  .card .h .save{margin-left:auto;font-size:30px;color:var(--amber)}
  .st{opacity:0;display:flex;gap:24px;padding:26px 0;border-bottom:1px solid #1c222b}
  .st:last-child{border-bottom:none}
  .st .n{width:64px;height:64px;border-radius:14px;background:rgba(63,185,80,.16);color:var(--green);font-weight:900;font-size:38px;display:grid;place-items:center;flex:none;font-family:"SF Mono",monospace}
  .st .txt{font-size:40px;line-height:1.32;font-weight:700}.st .txt .k{color:var(--muted);font-weight:500}
  .st .txt .esc{color:var(--amber)}
  .caption{position:absolute;left:52px;right:52px;top:1200px;text-align:center;font-size:62px;font-weight:900;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--amber)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="card">
      <div class="h"><span class="ic">📋</span><span class="tt">复刻 5 步 · ③④⑤</span><span class="save">☆ 建议收藏</span></div>
      <div class="st" id="s3"><div class="n">3</div><div class="txt">关键纪律用 hooks 落地<span class="k"> · 注入 / 阻断 / 裁判</span><br><span class="esc">逃生门先建先测</span></div></div>
      <div class="st" id="s4"><div class="n">4</div><div class="txt">结构人格化成组织<span class="k"> · 只跟几个头儿说话</span></div></div>
      <div class="st" id="s5"><div class="n">5</div><div class="txt">只报告不擅改<span class="k"> · 再硬的约束,也</span><span class="esc">留个能自救的口子</span></div></div>
    </div>
    <div class="caption" id="cap">上锁,也<b>先建逃生门</b></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo(".stage",{scale:1.0},{scale:1.012,duration:19.79,ease:"sine.inOut"},0);
  tl.fromTo("#s3",{opacity:0,x:-18},{opacity:1,x:0,duration:.45,ease:"power2.out"},0.5);
  tl.fromTo("#s3 .esc",{color:"#8b949e"},{color:"#d29922",duration:.5},4.2);
  tl.fromTo("#s4",{opacity:0,x:-18},{opacity:1,x:0,duration:.45,ease:"power2.out"},9.4);
  tl.fromTo("#s5",{opacity:0,x:-18},{opacity:1,x:0,duration:.45,ease:"power2.out"},12.6);
  tl.fromTo("#cap",{opacity:0,y:22},{opacity:1,y:0,duration:.5,ease:"power3.out"},16.8);
  tl.to("#cap b",{scale:1.05,duration:.5,yoyo:true,repeat:1,ease:"sine.inOut",transformOrigin:"center"},17.4);
  tl.to({},{duration:1.0},19.59);
  registerTimeline(tl);
</script></body></html>

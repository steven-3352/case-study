<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>W30D01 完整 Prompt</title><link rel="stylesheet" href="../shared/w30_evidence.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
 .top-sub{position:absolute;z-index:20;left:60px;right:60px;top:38px;height:120px;padding:18px 28px;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(25,25,23,.92);color:#fff;font-size:35px;line-height:1.28;font-weight:850;border-radius:8px}.prompt{position:absolute;left:54px;right:54px;top:195px;bottom:94px;padding:42px 46px;background:var(--surface);border:3px solid var(--ink);box-shadow:12px 12px 0 var(--line)}.prompt-head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--ink);padding-bottom:23px;margin-bottom:24px}.prompt-head b{font-size:43px}.copy{font-size:25px;color:var(--red);font-weight:900}.line{font-size:31px;line-height:1.48;margin:0 0 16px;padding:4px 6px;font-weight:700}.line:first-of-type{font-size:34px;font-weight:900}.line:last-child{margin-top:22px;padding:21px;background:#f2eee5;border-left:8px solid var(--green);font-size:34px}.progress{position:absolute;left:0;top:0;height:9px;width:0;background:var(--red)}.hold{position:absolute;right:46px;bottom:38px;font-size:25px;color:var(--green);font-weight:900}
</style></head><body><div class="canvas"><div class="top-sub" id="subtitle"></div><article class="prompt"><div class="progress" id="progress"></div><header class="prompt-head"><b>致命漏洞法 · 完整指令</b><span class="copy" id="caption"></span></header><div id="lines"></div><div class="hold">完整显示 · 后半段静止</div></article></div>
<script>
 const d=getData(),D=Math.max(4,Number(d.scene_duration)||7),hold=Math.max(3,Number(d.static_hold_s)||Number(d.min_static_hold_s)||4),reveal=Math.max(1.2,Math.min(Number(d.reveal_duration_s)||3,D-hold)),arr=d.prompt_lines||[];caption.textContent=d.caption||"暂停可抄";subtitle.textContent=d.subtitle||"完整指令在屏幕上，核心就两件事。";
 arr.forEach(t=>{const p=document.createElement("p");p.className="line";p.textContent=t;lines.appendChild(p)});
 const tl=gsap.timeline({paused:true,defaults:{ease:"power2.out"}});tl.fromTo(".prompt",{y:38,autoAlpha:0},{y:0,autoAlpha:1,duration:.32},0).fromTo(".line",{y:15,autoAlpha:0},{y:0,autoAlpha:1,duration:.22,stagger:Math.max(.12,(reveal-.6)/Math.max(1,arr.length))},.3).to("#progress",{width:"100%",duration:reveal,ease:"none"},0);const highlightStart=Math.max(.7,reveal-1.25),highlightGap=Math.min(.24,.85/Math.max(1,arr.length));document.querySelectorAll('.line').forEach((e,i)=>tl.to(e,{backgroundColor:'rgba(192,57,43,.12)',duration:.12},highlightStart+i*highlightGap).to(e,{backgroundColor:i===arr.length-1?'#f2eee5':'rgba(192,57,43,0)',duration:.14},highlightStart+.13+i*highlightGap));const holdCue=Math.max(reveal+.1,D-hold-.5);tl.to(".prompt",{backgroundColor:'#fff3df',duration:.16,repeat:1,yoyo:true},holdCue).fromTo("#caption",{scale:1},{scale:1.08,duration:.16,repeat:1,yoyo:true},holdCue).to(".prompt",{backgroundColor:'#fff7e9',duration:.14,repeat:1,yoyo:true},D-2.1).to({}, {duration:D},0);registerTimeline(tl);
</script></body></html>

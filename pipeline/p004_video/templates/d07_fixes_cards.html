<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D07 Fixes Cards</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    :root {
      --bg-blueprint: #eef6fc;
      --grid: rgba(74, 130, 180, 0.2);
      --ink: #1e4d72;
      --ink-light: #5a8ab5;
      --card-pink: #fce4ec;
      --card-green: #e8f5e9;
      --card-amber: #fff8e1;
      --sans: "PingFang SC", "Source Han Sans CN", -apple-system, sans-serif;
      --mono: "SF Mono", "Menlo", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: var(--bg-blueprint);
      font-family: var(--sans); color: var(--ink);
    }
    .canvas {
      position: relative; width: 1080px; height: 1920px;
      background:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px),
        var(--bg-blueprint);
      background-size: 48px 48px;
    }
    .blueprint-title {
      position: absolute; left: 60px; right: 60px; top: 280px;
      text-align: center; opacity: 0;
    }
    .blueprint-title .tag {
      font-family: var(--mono); font-size: 26px; color: var(--ink-light);
      letter-spacing: 4px; margin-bottom: 12px;
    }
    .blueprint-title .headline {
      font-size: 48px; font-weight: 900; color: var(--ink);
    }
    .cards {
      position: absolute; left: 48px; right: 48px; top: 440px;
      display: flex; flex-direction: column; gap: 28px;
    }
    .fix-card {
      display: flex; align-items: stretch; gap: 0;
      border-radius: 18px; overflow: hidden; opacity: 0;
      border: 3px solid var(--ink-light);
      box-shadow: 0 8px 28px rgba(30, 77, 114, 0.12);
    }
    .fix-card:nth-child(1) { background: var(--card-pink); border-color: #f48fb1; }
    .fix-card:nth-child(2) { background: var(--card-green); border-color: #81c784; }
    .fix-card:nth-child(3) { background: var(--card-amber); border-color: #ffb74d; }
    .num-block {
      width: 100px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 56px; font-weight: 900;
      background: rgba(255,255,255,0.6); color: var(--ink);
      border-right: 2px dashed var(--ink-light);
    }
    .fix-card:nth-child(1) .num-block { color: #c2185b; }
    .fix-card:nth-child(2) .num-block { color: #2e7d32; }
    .fix-card:nth-child(3) .num-block { color: #e65100; }
    .info { padding: 28px 32px; flex: 1; }
    .info .title { font-size: 44px; font-weight: 900; margin-bottom: 8px; }
    .info .desc { font-size: 30px; color: var(--ink-light); font-family: var(--mono); }
    .arrow-flow {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-size: 32px; color: var(--ink-light); opacity: 0;
    }
    .warn {
      position: absolute; left: 60px; right: 60px; top: 1080px;
      text-align: center; font-size: 42px; font-weight: 800;
      color: #c62828; opacity: 0; padding: 24px;
      border: 3px dashed #ef5350; border-radius: 16px;
      background: rgba(255,255,255,0.7);
    }
    .anchor {
      position: absolute; left: 0; right: 0; bottom: 380px;
      text-align: center; font-size: 44px; font-weight: 900;
      color: #2e7d32; opacity: 0; padding: 0 60px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="blueprint-title" id="titleBlock">
      <div class="tag">FIX · BLUEPRINT</div>
      <div class="headline" id="headline">重复活上表 · 人走了不断</div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="warn" id="warn">别一上来搞营销</div>
    <div class="anchor" id="anchor">先自动化人走了不会断的那几步</div>
  </div>
  <script>
    const data = window.getData();
    const fixes = data.fixes || data.automations || [
      { num: "1", title: "接单登记", desc: "微信消息→一行记录" },
      { num: "2", title: "跟进提醒", desc: "到期自动弹" },
      { num: "3", title: "节点催办", desc: "开票盖章提单" }
    ];
    const cards = document.getElementById("cards");
    fixes.forEach(f => {
      const el = document.createElement("div");
      el.className = "fix-card";
      el.innerHTML = `<div class="num-block">${f.num}</div><div class="info"><div class="title">${f.title}</div><div class="desc">${f.desc}</div></div>`;
      cards.appendChild(el);
    });
    if (data.headline) document.getElementById("headline").textContent = data.headline;
    if (data.warn) document.getElementById("warn").textContent = data.warn;
    if (data.value_anchor) document.getElementById("anchor").textContent = data.value_anchor;

    const tl = gsap.timeline();
    tl.fromTo("#titleBlock", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0);
    tl.fromTo(".fix-card", { opacity: 0, x: -60, scale: 0.92 }, { opacity: 1, x: 0, scale: 1, duration: 0.4, stagger: 0.35, ease: "back.out(1.6)" }, 0.3);
    tl.to(".num-block", { scale: 1.15, duration: 0.15, stagger: 0.12, yoyo: true, repeat: 1, ease: "back.out(2)" }, 1.5);
    tl.to(".fix-card .desc", { color: "#1e4d72", fontWeight: 700, duration: 0.2, stagger: 0.1 }, 2.0);
    tl.fromTo("#warn", { opacity: 0, scale: 0.88, rotation: -2 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, 3.0);
    tl.to("#warn", { borderColor: "#ff8f00", color: "#e65100", duration: 0.2, yoyo: true, repeat: 2 }, 3.5);
    tl.fromTo("#anchor", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.2);
    tl.to(".fix-card", { boxShadow: "0 12px 36px rgba(46,125,50,0.18)", duration: 0.3, stagger: 0.08 }, 5.0);
    tl.to("#anchor", { scale: 1.04, duration: 0.2, yoyo: true, repeat: 1 }, 5.5);
    tl.to({}, { duration: 1.8 }, 6.2);
    registerTimeline(tl);
  </script>
</body>
</html>

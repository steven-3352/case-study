<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>W30D01 虚构计划事实</title><link rel="stylesheet" href="../shared/w30_evidence.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>
.disclosure{position:absolute;left:55px;right:55px;top:55px;padding:20px;border-bottom:4px solid var(--red);text-align:center;font-size:31px;font-weight:900;color:var(--red)}.head{position:absolute;left:60px;right:60px;top:170px;text-align:center;font-size:58px;font-weight:950}.case{position:absolute;left:75px;right:75px;top:410px;display:grid;gap:38px}.fact{position:relative;min-height:220px;padding:48px 45px 40px 145px;border:3px solid var(--ink);background:var(--surface);font-size:45px;line-height:1.35;font-weight:900}.fact:before{content:attr(data-index);position:absolute;left:35px;top:41px;width:72px;height:72px;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:31px}.tape{position:absolute;width:120px;height:30px;top:-14px;right:55px;background:#d9c8a8;transform:rotate(4deg)}.note{position:absolute;left:80px;right:80px;top:1215px;font-size:29px;line-height:1.55;color:var(--muted);text-align:center}
</style></head><body><div class="canvas"><div class="disclosure" id="disclosure"></div><div class="head" id="head"></div><div class="case" id="factList"></div><div class="note" id="note"></div><div class="subtitle" id="subtitle"></div></div><script>
const d=getData(),D=Math.max(3,Number(d.scene_duration)||5),factList=document.getElementById("factList");disclosure.textContent=d.disclosure||"举例测试·虚构计划";head.textContent=d.head||"计划中已知的三条事实";note.textContent=d.note||"只依据输入材料，不冒充作者或客户经历";subtitle.textContent=d.subtitle||"这个人想辞职做代运营，可自己的账号几乎没涨粉。";(d.facts||[]).forEach((x,i)=>{const el=document.createElement("div");el.className="fact";el.dataset.index=`0${i+1}`;el.innerHTML=`<i class="tape"></i>${x}`;factList.appendChild(el)});
const factGap=Math.max(.75,(D-1.8)/3),tl=gsap.timeline({paused:true,defaults:{ease:"power2.out"}});tl.fromTo(".fact",{rotation:(i)=>i%2?-2:2,y:55,autoAlpha:0},{rotation:0,y:0,autoAlpha:1,duration:.4,stagger:factGap},0).fromTo(".tape",{scaleX:0},{scaleX:1,duration:.2,stagger:factGap},.22).fromTo("#note",{y:10,autoAlpha:.35},{y:0,autoAlpha:1,duration:.28},Math.max(3.2,D-.7)).to({}, {duration:D},0);registerTimeline(tl);
</script></body></html>

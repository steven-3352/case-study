<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D06 Pipeline · 全链路流程</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #f5f5f5;
      font-family: "PingFang SC", "Source Han Sans CN", -apple-system, sans-serif;
      color: #1a1a1a;
    }
    .canvas {
      position: relative; width: 1080px; height: 1920px; overflow: hidden;
      background: linear-gradient(180deg, #f5f5f5 0%, #e8eef5 100%);
    }
    .hdr {
      position: absolute; top: 140px; left: 60px; right: 60px; text-align: center;
      opacity: 0;
    }
    .hdr .t1 { font-size: 52px; font-weight: 800; color: #333; }
    .hdr .t2 { font-size: 36px; color: #666; margin-top: 12px; }
    .flow {
      position: absolute; top: 340px; left: 80px; right: 80px;
      display: flex; flex-direction: column; gap: 28px;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 36px 40px;
      box-shadow: 0 12px 40px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.04);
      display: flex; align-items: center; gap: 28px;
      opacity: 0; transform: translateX(-40px);
    }
    .card .ico {
      width: 88px; height: 88px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; flex-shrink: 0;
    }
    .c1 .ico { background: #e3f2fd; }
    .c2 .ico { background: #fce4ec; }
    .c3 .ico { background: #e8f5e9; }
    .c4 .ico { background: #fff3e0; }
    .c5 .ico { background: #f3e5f5; }
    .card .body { flex: 1; }
    .card .name { font-size: 48px; font-weight: 900; color: #1a1a1a; }
    .card .sub { font-size: 28px; color: #666; margin-top: 8px; }
    .card .badge {
      font-size: 24px; font-weight: 700; padding: 8px 18px; border-radius: 999px;
      background: #e8eef5; color: #0550ae;
    }
    .arrow {
      text-align: center; font-size: 40px; color: #bbb; opacity: 0; height: 0;
      line-height: 0; overflow: hidden;
    }
    .tail {
      position: absolute; left: 60px; right: 60px; bottom: 200px; text-align: center;
      font-size: 42px; font-weight: 800; color: #e53935; opacity: 0;
    }
    .wm { position: absolute; top: 1830px; right: 48px; font-size: 22px; color: #999; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="hdr" id="hdr">
      <div class="t1">一行选题 · 后面自己跑</div>
      <div class="t2">九拨人各自领活</div>
    </div>
    <div class="flow">
      <div class="card c1" id="c1">
        <div class="ico">📋</div>
        <div class="body">
          <div class="name">洞察包</div>
          <div class="sub">topic_brief · core_message · fact_check</div>
        </div>
        <div class="badge">Layer 1</div>
      </div>
      <div class="arrow" id="a1">↓</div>
      <div class="card c2" id="c2">
        <div class="ico">💬</div>
        <div class="body">
          <div class="name">讨论室</div>
          <div class="sub">week_room · 多工种 scorecard</div>
        </div>
        <div class="badge">Layer 2</div>
      </div>
      <div class="arrow" id="a2">↓</div>
      <div class="card c3" id="c3">
        <div class="ico">🚦</div>
        <div class="body">
          <div class="name">gate_check</div>
          <div class="sub">pre_render → render → approve</div>
        </div>
        <div class="badge">两道门</div>
      </div>
      <div class="arrow" id="a3">↓</div>
      <div class="card c4" id="c4">
        <div class="ico">🎬</div>
        <div class="body">
          <div class="name">render</div>
          <div class="sub">P004 GSAP · TTS · BGM · 字幕</div>
        </div>
        <div class="badge">有成本</div>
      </div>
      <div class="arrow" id="a4">↓</div>
      <div class="card c5" id="c5">
        <div class="ico">📦</div>
        <div class="body">
          <div class="name">publish</div>
          <div class="sub">三平台文案 · cover · video.mp4</div>
        </div>
        <div class="badge">可外发</div>
      </div>
    </div>
    <div class="tail" id="tail">洞察没过 · 不能写稿</div>
    <div class="wm">W27D06 · 流程示意</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#hdr", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.35 }, 0);
    const cards = ["#c1", "#c2", "#c3", "#c4", "#c5"];
    const arrows = ["#a1", "#a2", "#a3", "#a4"];
    cards.forEach((id, i) => {
      const t = 0.4 + i * 1.2;
      tl.fromTo(id, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, t);
      if (arrows[i]) {
        tl.fromTo(arrows[i], { opacity: 0, height: 0 }, { opacity: 1, height: 28, duration: 0.2 }, t + 0.5);
      }
    });
    tl.fromTo("#tail", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 6.8);
    tl.to({}, { duration: 0.6 }, 7.4);
    registerTimeline(tl);
  </script>
</body>
</html>

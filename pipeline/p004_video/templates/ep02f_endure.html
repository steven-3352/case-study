<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP02 s1 · 这些我都忍了(揭旧伤)</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 55% at 50% 36%, rgba(210,153,34,.06), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.84) 0%, rgba(6,9,14,.62) 34%, rgba(6,9,14,.6) 60%, rgba(6,9,14,.9) 88%, rgba(6,9,14,.97) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  /* 三旧伤(记不住/乱/活在过期)· 灰调揭伤,不发红 */
  .scars{ position:absolute; left:80px; right:80px; top:360px; display:flex; gap:22px; justify-content:center; }
  .sc{ flex:1; text-align:center; background:rgba(13,17,23,.8); border:1px solid #262c34;
    border-radius:16px; padding:26px 8px; opacity:0; }
  .sc .ico{ font-size:52px; filter:grayscale(.3); }
  .sc .lb{ margin-top:12px; font-size:34px; font-weight:800; color:#aeb6bf; }

  .endure{ position:absolute; left:64px; right:64px; top:640px; text-align:center;
    font-size:90px; font-weight:900; line-height:1.16; letter-spacing:2px; opacity:0;
    text-shadow:0 5px 26px rgba(0,0,0,.85); }
  .endure b{ color:var(--amber); }

  .turn{ position:absolute; left:64px; right:64px; top:960px; text-align:center;
    font-size:70px; font-weight:900; line-height:1.22; letter-spacing:1px; opacity:0;
    text-shadow:0 5px 24px rgba(0,0,0,.85); }
  .turn .em{ color:var(--red); }
  .turn .dash{ color:var(--muted); }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>

    <div class="scars">
      <div class="sc" id="sc0"><div class="ico">🧠</div><div class="lb">记不住</div></div>
      <div class="sc" id="sc1"><div class="ico">🗂️</div><div class="lb">乱</div></div>
      <div class="sc" id="sc2"><div class="ico">📅</div><div class="lb">活在过期</div></div>
    </div>

    <div class="endure" id="endure">这些,我都 <b>忍了</b></div>

    <div class="turn" id="turn">直到那次 <span class="dash">——</span><br>我跟它,要个 <span class="em">成品</span></div>
  </div>
<script>
  const tl = gsap.timeline();
  // 三旧伤逐个揭(VO"记不住、乱、活在过期")
  ["#sc0","#sc1","#sc2"].forEach((c,i)=>{
    tl.fromTo(c, { opacity:0, y:14, scale:0.92 }, { opacity:1, y:0, scale:1, duration:0.4, ease:"back.out(1.5)" }, 0.3 + i*0.85);
  });
  // "这些我都忍了"(压着)
  tl.fromTo("#endure", { opacity:0, y:20 }, { opacity:1, y:0, duration:0.55, ease:"power3.out" }, 3.2);
  tl.fromTo("#endure b", { scale:1.4 }, { scale:1, duration:0.4, ease:"back.out(2.6)" }, 3.7);
  tl.to(["#sc0","#sc1","#sc2"], { opacity:0.4, duration:0.5 }, 5.0);
  // "直到那次——要个成品"(转折)
  tl.fromTo("#turn", { opacity:0, y:22 }, { opacity:1, y:0, duration:0.55, ease:"power3.out" }, 5.4);
  tl.fromTo("#turn .em", { scale:1.5 }, { scale:1, duration:0.42, ease:"back.out(3)" }, 6.9);
  tl.to("#turn .em", { textShadow:"0 0 30px rgba(229,72,77,.6)", scale:1.08, duration:0.5, yoyo:true, repeat:1, ease:"sine.inOut", transformOrigin:"center" }, 7.3);
  tl.to({}, { duration:0.7 }, 8.5);
  registerTimeline(tl);
</script>
</body>
</html>

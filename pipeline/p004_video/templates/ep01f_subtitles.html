<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:1080px; height:1920px; background:transparent !important; overflow:hidden; }
    .sub {
      position:absolute; left:60px; right:60px; bottom:132px; text-align:center;
      font-family:"PingFang SC","Heiti SC",sans-serif; font-weight:900;
      font-size:58px; line-height:1.3; color:#fff; letter-spacing:1px; padding:0 20px;
      text-shadow:-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,4px 4px 0 #000,
        -4px 0 0 #000,4px 0 0 #000,0 -4px 0 #000,0 4px 0 #000,0 0 26px rgba(0,0,0,.95);
      opacity:0;
    }
    .sub.hot { color:#ff5a5f; }
  </style>
</head>
<body>
  <div class="sub" id="sub"></div>
  <script>
    const lines = [
      { t:0.0, end:2.47, text:"所有人都夸 AI 聪明", hot:0 },
      { t:2.61, end:5.31, text:"我天天被我的 AI 气到", hot:1 },
      { t:5.45, end:6.5, text:"就这三件事", hot:0 },
      { t:6.64, end:8.4, text:"你肯定,也中过招", hot:1 },
      { t:9.09, end:12.03, text:"当初……我多信它啊", hot:0 },
      { t:12.17, end:15.11, text:"约法三章,一条一条", hot:0 },
      { t:15.25, end:18.19, text:"亲手,写进它脑子里", hot:1 },
      { t:18.33, end:21.28, text:"我还美——这下稳了", hot:0 },
      { t:21.82, end:24.13, text:"结果换个新对话", hot:0 },
      { t:24.27, end:26.58, text:"它扭头问我——", hot:0 },
      { t:26.72, end:28.33, text:"啥、规矩?", hot:1 },
      { t:28.47, end:29.73, text:"我人傻了", hot:0 },
      { t:29.87, end:32.54, text:"白纸黑字摆它眼前", hot:0 },
      { t:32.68, end:34.64, text:"它,就是不读", hot:1 },
      { t:35.28, end:36.38, text:"更逗的是", hot:0 },
      { t:36.52, end:39.79, text:"规矩它自己写得满地都是", hot:0 },
      { t:39.93, end:42.59, text:"这份一句、那份一句", hot:0 },
      { t:42.73, end:44.76, text:"我自己都找不着", hot:0 },
      { t:44.9, end:46.31, text:"它更别提了", hot:1 },
      { t:46.87, end:50.52, text:"过期的规矩,它当圣旨供着", hot:0 },
      { t:50.66, end:52.73, text:"早被我毙的方向", hot:0 },
      { t:52.87, end:55.25, text:"还一个劲儿往上凑", hot:0 },
      { t:55.39, end:58.4, text:"活像个活在上个月的人", hot:1 },
      { t:58.54, end:62.19, text:"它还委屈:你怎么又漏了?", hot:0 },
      { t:62.33, end:63.77, text:"我?我漏?", hot:1 },
      { t:64.5, end:66.93, text:"失忆、乱、活在过期", hot:0 },
      { t:67.07, end:70.06, text:"你是不是,也天天这样?", hot:1 },
      { t:70.2, end:72.33, text:"来,别光自己憋着", hot:0 },
      { t:72.47, end:75.18, text:"是的话,评论区扣俩字", hot:0 },
      { t:75.32, end:76.6, text:"『我也是』", hot:1 },
      { t:76.74, end:80.02, text:"我一开始也以为是我不会用", hot:0 },
      { t:80.16, end:81.44, text:"后来才发现", hot:0 },
      { t:81.58, end:83.72, text:"根本不是我的问题", hot:1 },
      { t:83.86, end:85.43, text:"那到底咋治?", hot:0 },
      { t:85.57, end:87.99, text:"我一条条,讲给你听", hot:1 },
      { t:88.88, end:92.19, text:"可这些……顶多让我头疼", hot:0 },
      { t:92.33, end:96.27, text:"真正让我,脊背发凉的是——", hot:1 },
      { t:96.41, end:98.16, text:"我后来才发现", hot:0 },
      { t:98.3, end:100.04, text:"它不光记不住", hot:0 },
      { t:100.18, end:103.18, text:"它还会,假装,做到了", hot:1 },
      { t:103.32, end:106.0, text:"下一条,我抓它现行", hot:1 }
    ];
    const sub = document.getElementById("sub");
    const tl = gsap.timeline();
    lines.forEach((line) => {
      tl.call(() => { sub.textContent = line.text; sub.classList.toggle("hot", !!line.hot); }, [], line.t);
      tl.fromTo(sub, { opacity:0, y:8 }, { opacity:1, y:0, duration:0.16 }, line.t);
      tl.to(sub, { opacity:0, duration:0.16 }, line.end - 0.16);
    });
    tl.to({}, { duration:0.05 }, 106.944);
    registerTimeline(tl);
    window.__contentKey = function () {
      const cs = getComputedStyle(sub);
      if (parseFloat(cs.opacity) <= 0.001) return "blank";
      return sub.textContent + "|" + cs.opacity + "|" + cs.transform;
    };
  </script>
</body>
</html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>W30D01 双轮结果</title><link rel="stylesheet" href="../shared/w30_evidence.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>
.head{position:absolute;left:50px;right:50px;top:100px;text-align:center;font-size:60px;font-weight:950}.rounds{position:absolute;left:70px;right:70px;top:360px;display:grid;grid-template-columns:1fr 1fr;gap:28px}.ticket{height:470px;padding:42px 35px;background:var(--surface);border:3px solid var(--line);border-top:13px solid var(--green);position:relative}.ticket h2{font-size:43px;margin:0 0 25px}.ticket p{font-size:27px;line-height:1.42;color:var(--ink)}.ticket code{position:absolute;left:35px;bottom:28px;font-size:22px;color:var(--muted)}.check{position:absolute;right:30px;bottom:20px;font-size:58px;color:var(--green);font-weight:950}.flow{position:absolute;left:50%;top:855px;width:8px;height:190px;background:var(--red);transform-origin:top}.result{position:absolute;left:85px;right:85px;top:1040px;padding:48px 42px;border:4px solid var(--red);background:#fff4f1;text-align:center;font-size:51px;line-height:1.3;font-weight:950;color:var(--red)}.qualifier{position:absolute;left:0;right:0;top:1335px;text-align:center;font-size:28px;color:var(--muted)}
</style></head><body><div class="canvas"><div class="head" id="head"></div><div class="rounds" id="rounds"></div><div class="flow" id="flow"></div><div class="result" id="result"></div><div class="qualifier" id="qualifier"></div><div class="subtitle" id="subtitle"></div></div><script>
const d=getData(),D=Math.max(4,Number(d.scene_duration)||6);head.textContent=d.head||"双轮重复 · 第一优先一致";result.textContent=d.result||"核心能力尚未被结果验证";qualifier.textContent=d.qualifier||"本组调用·模型优先指出";subtitle.textContent=d.subtitle||"我跑了两轮，模型都优先指出同一个前提。";(d.rounds||[]).forEach((x,i)=>{const el=document.createElement("section");el.className="ticket";el.innerHTML=`<h2>${x}</h2><p>${(d.excerpts||[])[i]||d.ticket_text||"同模型 · 同计划 · 单点问法"}</p><code>SHA256 ${(d.hashes||[])[i]||"待核"}</code><b class="check">✓</b>`;rounds.appendChild(el)});
const tl=gsap.timeline({paused:true,defaults:{ease:"power2.out"}});tl.fromTo(".ticket",{y:-70,autoAlpha:0},{y:0,autoAlpha:1,duration:.42,stagger:.65},0).fromTo(".check",{scale:2,autoAlpha:0},{scale:1,autoAlpha:1,duration:.25,stagger:.55},1.25).fromTo("#flow",{scaleY:0},{scaleY:1,duration:.32},Math.max(2.5,D*.48)).fromTo("#result",{scale:.82,autoAlpha:0},{scale:1,autoAlpha:1,duration:.4},Math.max(3.4,D*.68)).fromTo("#qualifier",{y:8,autoAlpha:.35},{y:0,autoAlpha:1,duration:.25},Math.max(4.5,D-.65)).to({}, {duration:D},0);registerTimeline(tl);
</script></body></html>

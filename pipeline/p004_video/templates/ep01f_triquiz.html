<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP01 s3 · 三连质问 · 过期</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"SF Mono","JetBrains Mono","Menlo","PingFang SC",monospace; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 60% at 50% 32%, rgba(63,185,80,.06), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.74) 0%, rgba(6,9,14,.5) 32%, rgba(6,9,14,.42) 55%, rgba(6,9,14,.88) 82%, rgba(6,9,14,.96) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .termwrap{ position:absolute; left:52px; right:52px; top:300px; }
  .term{ position:relative; background:rgba(13,17,23,.94); border-radius:26px;
    box-shadow:0 46px 110px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.05),0 1px 0 rgba(255,255,255,.10) inset; }
  .titlebar{ height:90px; background:rgba(22,27,34,.92); border-bottom:1px solid #21262d;
    display:flex; align-items:center; padding:0 32px; gap:15px; border-radius:24px 24px 0 0; }
  .lights{ display:flex; gap:14px; } .lights i{ width:24px; height:24px; border-radius:50%; display:block; }
  .lights .r{ background:#ff5f56; } .lights .y{ background:#febc2e; } .lights .g{ background:#27c93f; }
  .path{ color:var(--muted); font-size:30px; margin-left:16px; }
  .badge{ margin-left:auto; color:var(--red); font-size:27px; font-weight:700; border:2px solid var(--red); border-radius:12px; padding:6px 16px; opacity:0; }
  .body{ padding:42px 42px 48px; display:flex; flex-direction:column; gap:32px; }
  .q{ font-size:44px; line-height:1.32; display:flex; gap:18px; align-items:flex-start; opacity:0; }
  .q .caret{ color:var(--green); font-weight:700; flex:none; }
  .q .txt em{ color:var(--red); font-style:normal; font-weight:900; display:inline-block; }
  .q .day{ margin-left:auto; color:var(--muted); font-size:25px; flex:none; padding-top:12px; }
  .reply{ color:var(--muted); font-size:38px; display:flex; gap:16px; align-items:baseline; padding-left:6px; opacity:0; }
  .reply .bullet{ color:var(--amber); } .reply em{ color:#ffb3b5; font-style:normal; display:inline-block; }

  .stampzone{ position:absolute; right:-20px; bottom:-76px; width:196px; height:196px; }
  .stamp{ position:absolute; inset:0; transform-origin:center center;
    border:9px solid var(--red); color:var(--red); border-radius:50%;
    display:grid; place-items:center; text-align:center; font-size:48px; font-weight:900;
    line-height:1.1; background:rgba(11,14,20,.66); box-shadow:0 0 32px rgba(229,72,77,.25); opacity:0; }
  .stamp small{ display:block; font-size:20px; letter-spacing:3px; margin-top:7px; font-family:"SF Mono",monospace; }
  .ink{ position:absolute; left:50%; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px; background:var(--red); border-radius:50%; opacity:0; }

  .caption{ position:absolute; left:52px; right:52px; bottom:150px;
    font-size:70px; font-weight:900; line-height:1.2; letter-spacing:1px;
    font-family:"PingFang SC","Heiti SC",sans-serif; text-shadow:0 4px 24px rgba(0,0,0,.85); opacity:0; }
  .caption b{ color:var(--red); }
  .caption .sub{ display:block; font-size:40px; font-weight:700; color:#c9d1d9; margin-top:18px; opacity:0; }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="termwrap">
      <div class="term" id="term">
        <div class="titlebar">
          <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
          <div class="path">claude ~/case-study</div>
          <div class="badge" id="badge">真实抓包</div>
        </div>
        <div class="body">
          <div class="q" id="q0"><span class="caret">&gt;</span><span class="txt">你确定是按系统的规范在做吗?</span><span class="day">07-04</span></div>
          <div class="q" id="q1"><span class="caret">&gt;</span><span class="txt">为什么<em>又</em>出现漏掉规范?</span><span class="day">07-04</span></div>
          <div class="q" id="q2"><span class="caret">&gt;</span><span class="txt">系统的核心宗旨<em>又</em>忘记了吗?</span><span class="day">07-04</span></div>
          <div class="reply" id="rep"><span class="bullet">⏺</span><span>抱歉,我<em>又</em>漏了…这次一定改。</span></div>
        </div>
        <div class="stampzone">
          <i class="ink" id="ink0"></i><i class="ink" id="ink1"></i><i class="ink" id="ink2"></i>
          <i class="ink" id="ink3"></i><i class="ink" id="ink4"></i><i class="ink" id="ink5"></i>
          <div class="stamp" id="stamp">同一天<small>SAME DAY</small></div>
        </div>
      </div>
    </div>
    <div class="caption" id="cap">
      同一个错,<b>我教你八百遍了吧?</b>
      <span class="sub" id="capsub">规矩它自己写的 · 过期的当圣旨 · 活在上个月</span>
    </div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.fromTo("#term", { scale:1.0 }, { scale:1.013, duration:17.5, ease:"sine.inOut" }, 0);
  tl.to("#badge", { opacity:1, duration:0.3 }, 0.3);
  const qs=["#q0","#q1","#q2"], base=1.6, step=3.0;
  qs.forEach((q,i)=>{
    const at=base+i*step;
    tl.fromTo(q, {opacity:0,y:20,x:-10}, {opacity:1,y:0,x:0,duration:0.4,ease:"back.out(1.6)"}, at);
    const em=document.querySelector(q+" em");
    if(em) tl.fromTo(q+" em", {scale:1.9}, {scale:1,duration:0.32,ease:"back.out(3.5)"}, at+0.22);
  });
  const R=base+3*step;
  tl.fromTo("#rep", {opacity:0,y:16}, {opacity:0.6,y:0,duration:0.4,ease:"power2.out"}, R);
  tl.fromTo("#rep em", {scale:1.6}, {scale:1,duration:0.3,ease:"back.out(3)"}, R+0.2);
  
  const S=R+1.4;
  tl.set("#stamp", { opacity:0, scale:3.6, rotation:-32, yPercent:-170, xPercent:18 }, S);
  tl.to("#stamp", { opacity:1, duration:0.12 }, S);
  tl.to("#stamp", { scale:1.06, rotation:-12, yPercent:4, xPercent:0, duration:0.34, ease:"power4.in" }, S+0.12);
  tl.to("#stamp", { scale:0.9, yPercent:8, duration:0.08, ease:"power2.out" }, S+0.46);
  tl.to("#stamp", { scale:1.0, yPercent:0, duration:0.28, ease:"back.out(2.2)" }, S+0.54);
  tl.to("#term", { x:"+=9", duration:0.045, repeat:6, yoyo:true, ease:"none" }, S+0.46);
  tl.set("#term", { x:0 }, S+0.46+0.045*7);
  const dirs=[[0,-150],[120,-80],[140,60],[40,150],[-110,90],[-140,-40]];
  dirs.forEach((d,i)=>{ tl.fromTo("#ink"+i,{opacity:0.9,scale:0.2,x:0,y:0},{opacity:0,scale:1.5,x:d[0],y:d[1],duration:0.5,ease:"power3.out"},S+0.47); });
  tl.to("#stamp", { scale:1.035, duration:0.12, yoyo:true, repeat:1, ease:"sine.inOut" }, S+0.95);

  tl.to({}, { duration:1.0 }, 17.4);
  registerTimeline(tl);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP04 s4 · 治乱不治骗</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.78),rgba(6,9,14,.6) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .bubble{position:absolute;left:150px;right:150px;top:440px;background:rgba(26,16,17,.94);border:2px solid rgba(229,72,77,.5);border-radius:24px 24px 24px 6px;padding:40px;text-align:center;opacity:0}
  .bubble .who{font-size:64px}.bubble .say{font-size:44px;color:#ffb3b5;font-weight:800;margin-top:14px}
  .verdict{position:absolute;left:52px;right:52px;top:760px;text-align:center;opacity:0}
  .verdict .a{display:inline-block;font-size:60px;font-weight:900;padding:14px 30px;border-radius:14px;margin:0 8px}
  .verdict .lz{background:rgba(63,185,80,.16);color:var(--green)} .verdict .bh{background:rgba(229,72,77,.16);color:var(--red)}
  .caption{position:absolute;left:52px;right:52px;top:960px;text-align:center;font-size:82px;font-weight:900;line-height:1.18;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--red)}
  .next{position:absolute;left:52px;right:52px;bottom:210px;text-align:center;font-size:56px;font-weight:900;color:#fff;opacity:0}
  .next b{color:var(--amber)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="bubble" id="bubble"><div class="who">🤖</div><div class="say">"✓ 搞定了" —— 它还是这么说</div></div>
    <div class="verdict" id="verdict"><span class="a lz">组织治乱 ✓</span><span class="a bh">治不了骗 ✗</span></div>
    <div class="caption" id="cap">组织能治"乱"<br><b>治不了"骗"</b></div>
    <div class="next" id="next">下集 —— 给它上 <b>4 道绕不过去的锁</b></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo("#bubble",{opacity:0,y:20,scale:.95},{opacity:1,y:0,scale:1,duration:.45,ease:"back.out(1.5)"},0.5);
  tl.fromTo(".verdict .lz",{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:"back.out(2.4)"},1.6);
  tl.fromTo(".verdict .bh",{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:"back.out(2.4)"},2.1);
  tl.to("#verdict",{opacity:1,duration:.1},1.6);
  tl.fromTo("#cap",{opacity:0,y:28},{opacity:1,y:0,duration:.5,ease:"power3.out"},2.8);
  tl.fromTo("#next",{opacity:0,y:22},{opacity:1,y:0,duration:.45,ease:"power2.out"},3.8);
  tl.to("#next b",{scale:1.06,duration:.5,yoyo:true,repeat:2,ease:"sine.inOut"},4.3);
  tl.to({},{duration:1.4},4.8);
  registerTimeline(tl);
</script></body></html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D07 Blueprint CTA</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    :root {
      --bg-blueprint: #eef6fc;
      --grid: rgba(74, 130, 180, 0.2);
      --ink: #1e4d72;
      --ink-light: #5a8ab5;
      --lane-pink: #fce4ec;
      --lane-green: #e8f5e9;
      --lane-amber: #fff8e1;
      --sans: "PingFang SC", "Source Han Sans CN", -apple-system, sans-serif;
      --mono: "SF Mono", "Menlo", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: var(--bg-blueprint);
      font-family: var(--sans); color: var(--ink);
    }
    .canvas {
      position: relative; width: 1080px; height: 1920px;
      background:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px),
        var(--bg-blueprint);
      background-size: 48px 48px;
    }
    .compass {
      position: absolute; right: 80px; top: 280px;
      width: 120px; height: 120px; opacity: 0;
    }
    .compass svg { width: 100%; height: 100%; }
    .ruler {
      position: absolute; left: 60px; top: 300px;
      font-family: var(--mono); font-size: 22px; color: var(--ink-light);
      letter-spacing: 6px; opacity: 0;
    }
    .sketch-frame {
      position: absolute; left: 72px; right: 72px; top: 400px;
      bottom: 420px; border: 4px dashed var(--ink-light);
      border-radius: 24px; opacity: 0;
      background: rgba(255,255,255,0.45);
    }
    .sketch-frame::before,
    .sketch-frame::after {
      content: ""; position: absolute; width: 24px; height: 24px;
      border: 3px solid var(--ink-light);
    }
    .sketch-frame::before { top: -4px; left: -4px; border-right: none; border-bottom: none; }
    .sketch-frame::after { bottom: -4px; right: -4px; border-left: none; border-top: none; }
    .mini-lanes {
      position: absolute; left: 100px; right: 100px; top: 480px;
      display: flex; flex-direction: column; gap: 16px; opacity: 0;
    }
    .mini-lane { height: 48px; border-radius: 8px; border: 2px dashed; opacity: 0.7; }
    .mini-lane.pink { background: var(--lane-pink); border-color: #f48fb1; width: 85%; }
    .mini-lane.green { background: var(--lane-green); border-color: #81c784; width: 70%; margin-left: 40px; }
    .mini-lane.amber { background: var(--lane-amber); border-color: #ffb74d; width: 90%; }
    .cta-main {
      position: absolute; left: 0; right: 0; top: 720px;
      text-align: center; font-size: 80px; font-weight: 900;
      color: var(--ink); opacity: 0; padding: 0 60px; line-height: 1.25;
    }
    .cta-main .q { color: #c2185b; }
    .cta-sub {
      position: absolute; left: 0; right: 0; top: 960px;
      text-align: center; font-size: 44px; font-weight: 700;
      color: var(--ink-light); opacity: 0; padding: 0 80px;
    }
    .cta-box {
      position: absolute; left: 120px; right: 120px; bottom: 460px;
      background: #fff; border: 3px solid var(--ink);
      border-radius: 20px; padding: 32px 40px; opacity: 0;
      box-shadow: 0 12px 40px rgba(30, 77, 114, 0.15);
    }
    .cta-box .label {
      font-family: var(--mono); font-size: 24px; color: var(--ink-light);
      letter-spacing: 3px; margin-bottom: 12px;
    }
    .cta-box .action {
      font-size: 40px; font-weight: 900; color: #2e7d32;
    }
    .sketch-pen {
      position: absolute; right: 100px; bottom: 500px;
      font-size: 64px; opacity: 0; transform: rotate(-30deg);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="ruler" id="ruler">━━━━ 1080 × 1920 ━━━━</div>
    <div class="compass" id="compass">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54" fill="none" stroke="#5a8ab5" stroke-width="2" stroke-dasharray="6 4"/>
        <polygon points="60,16 68,60 60,104 52,60" fill="#1e4d72" opacity="0.7"/>
        <text x="60" y="24" text-anchor="middle" font-size="14" fill="#5a8ab5" font-family="monospace">N</text>
      </svg>
    </div>
    <div class="sketch-frame" id="frame"></div>
    <div class="mini-lanes" id="miniLanes">
      <div class="mini-lane pink"></div>
      <div class="mini-lane green"></div>
      <div class="mini-lane amber"></div>
    </div>
    <div class="cta-main" id="ctaMain">一忙就漏的<span class="q">重复活</span>？</div>
    <div class="cta-sub" id="ctaSub">评论区说说你们最烦哪一步</div>
    <div class="cta-box" id="ctaBox">
      <div class="label">DISCUSS · CTA</div>
      <div class="action">💬 说说你的断档场景</div>
    </div>
    <div class="sketch-pen" id="pen">✏️</div>
  </div>
  <script>
    const data = window.getData();
    if (data.cta_main) document.getElementById("ctaMain").innerHTML = data.cta_main.replace("重复活", '<span class="q">重复活</span>');
    if (data.cta_sub) document.getElementById("ctaSub").textContent = data.cta_sub;
    if (data.action) document.querySelector(".action").textContent = data.action;

    const tl = gsap.timeline();
    tl.fromTo("#ruler", { opacity: 0 }, { opacity: 0.6, duration: 0.3 }, 0);
    tl.fromTo("#compass", { opacity: 0, rotation: -90 }, { opacity: 0.8, rotation: 0, duration: 0.5, ease: "back.out(1.5)" }, 0.1);
    tl.fromTo("#frame", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 0.25);
    tl.fromTo("#miniLanes", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);
    tl.fromTo(".mini-lane", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.35, stagger: 0.12, ease: "power2.out" }, 0.55);
    tl.fromTo("#pen", { opacity: 0, x: 40, y: 40 }, { opacity: 1, x: 0, y: 0, duration: 0.4, ease: "power2.out" }, 0.9);
    tl.to("#pen", { x: -200, y: -300, duration: 0.8, ease: "power1.inOut" }, 1.2);
    tl.to("#pen", { opacity: 0, duration: 0.2 }, 1.9);

    tl.fromTo("#ctaMain", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 2.0);
    tl.to(".q", { color: "#e65100", scale: 1.08, duration: 0.2, yoyo: true, repeat: 3 }, 2.6);
    tl.fromTo("#ctaSub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.8);
    tl.fromTo("#ctaBox", { opacity: 0, y: 30, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)" }, 3.4);
    tl.to("#ctaBox", { boxShadow: "0 16px 48px rgba(46,125,50,0.22)", borderColor: "#2e7d32", duration: 0.3 }, 4.0);
    tl.to(".action", { scale: 1.05, duration: 0.15, yoyo: true, repeat: 2, ease: "back.out(2)" }, 4.3);
    tl.to({}, { duration: 1.5 }, 5.0);
    registerTimeline(tl);
  </script>
</body>
</html>

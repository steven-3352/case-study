<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP01 s0 · 开场钩子 · 三件事</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 60% at 50% 40%, rgba(229,72,77,.07), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.82) 0%, rgba(6,9,14,.62) 34%, rgba(6,9,14,.6) 60%, rgba(6,9,14,.9) 88%, rgba(6,9,14,.97) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .wrap{ position:absolute; left:70px; right:70px; top:360px; text-align:center; }
  .kick{ font-size:46px; color:var(--muted); font-weight:700; letter-spacing:1px; opacity:0; }
  .kick s{ text-decoration:none; color:#c9d1d9; }
  .hero{ margin-top:30px; font-size:118px; font-weight:900; line-height:1.14; letter-spacing:2px;
    text-shadow:0 6px 30px rgba(0,0,0,.8); opacity:0; }
  .hero b{ color:var(--red); }
  .expect{ margin-top:44px; font-size:40px; color:var(--amber); font-weight:800; letter-spacing:2px; opacity:0; }

  .chips{ position:absolute; left:80px; right:80px; top:1030px; display:flex; flex-direction:column; gap:26px; }
  .chip{ display:flex; align-items:center; gap:24px;
    background:rgba(13,17,23,.82); border:1px solid #21262d; border-left:6px solid var(--red);
    border-radius:18px; padding:26px 32px; opacity:0;
    box-shadow:0 20px 50px rgba(0,0,0,.5); }
  .chip .n{ font-family:"SF Mono",monospace; font-size:44px; font-weight:900; color:var(--red); flex:none; width:70px; }
  .chip .t{ font-size:52px; font-weight:800; color:var(--ink); }
  .chip .t em{ font-style:normal; color:var(--amber); }

  .foot{ position:absolute; left:70px; right:70px; bottom:360px; text-align:center;
    font-size:56px; font-weight:900; color:#fff; letter-spacing:1px; opacity:0;
    text-shadow:0 4px 22px rgba(0,0,0,.85); }
  .foot b{ color:var(--red); }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="wrap">
      <div class="kick" id="kick">所有人都夸 <s>AI 聪明</s></div>
      <div class="hero" id="hero">我天天<br>被我的 AI <b>气到</b></div>
      <div class="expect" id="expect">就这三件事 ——</div>
    </div>
    <div class="chips">
      <div class="chip" id="chip0"><span class="n">01</span><span class="t">换会话就<em>失忆</em></span></div>
      <div class="chip" id="chip1"><span class="n">02</span><span class="t">规矩<em>散一地</em></span></div>
      <div class="chip" id="chip2"><span class="n">03</span><span class="t">活在<em>上个月</em></span></div>
    </div>
    <div class="foot" id="foot">你,肯定也 <b>中过招</b></div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.fromTo("#kick", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.5, ease:"power2.out" }, 0.2);
  // "气到" 砸出
  tl.fromTo("#hero", { opacity:0, scale:0.86, y:24 }, { opacity:1, scale:1, y:0, duration:0.55, ease:"back.out(1.5)" }, 1.7);
  tl.fromTo("#hero b", { scale:1.7 }, { scale:1, duration:0.4, ease:"back.out(3)" }, 2.15);
  tl.to("#hero", { keyframes:[{ x:-8 },{ x:8 },{ x:-5 },{ x:0 }], duration:0.24, ease:"none" }, 2.2);
  tl.fromTo("#expect", { opacity:0 }, { opacity:1, duration:0.4 }, 3.4);
  // 三症状 chips 逐条飞入(预告三连)
  ["#chip0","#chip1","#chip2"].forEach((c,i)=>{
    tl.fromTo(c, { opacity:0, x:-40 }, { opacity:1, x:0, duration:0.42, ease:"back.out(1.5)" }, 4.0 + i*1.0);
  });
  // 收尾:你也中过招
  tl.fromTo("#foot", { opacity:0, y:22 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 7.1);
  tl.to("#foot b", { scale:1.12, duration:0.4, yoyo:true, repeat:2, ease:"sine.inOut", transformOrigin:"center" }, 7.7);
  tl.to({}, { duration:0.6 }, 8.8);
  registerTimeline(tl);
</script>
</body>
</html>

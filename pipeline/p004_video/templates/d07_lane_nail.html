<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D07 Lane Nail</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    :root {
      --bg-blueprint: #eef6fc;
      --grid: rgba(74, 130, 180, 0.2);
      --ink: #1e4d72;
      --ink-light: #5a8ab5;
      --lane-pink: #fce4ec;
      --lane-pink-border: #f48fb1;
      --lane-pink-accent: #c2185b;
      --sans: "PingFang SC", "Source Han Sans CN", -apple-system, sans-serif;
      --mono: "SF Mono", "Menlo", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: var(--bg-blueprint);
      font-family: var(--sans); color: var(--ink);
    }
    .canvas {
      position: relative; width: 1080px; height: 1920px;
      background:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px),
        var(--bg-blueprint);
      background-size: 48px 48px;
    }
    .lane-header {
      position: absolute; left: 48px; right: 48px; top: 280px;
      background: var(--lane-pink); border: 3px dashed var(--lane-pink-border);
      border-radius: 20px; padding: 28px 36px; opacity: 0;
    }
    .lane-header .tag {
      font-family: var(--mono); font-size: 24px; color: var(--lane-pink-accent);
      letter-spacing: 3px; margin-bottom: 8px;
    }
    .lane-header .name { font-size: 52px; font-weight: 900; }
    .lane-header .pain { font-size: 32px; color: var(--ink-light); margin-top: 8px; }
    .desk {
      position: absolute; left: 80px; top: 520px; width: 200px;
      text-align: center; opacity: 0;
    }
    .desk .staff { font-size: 88px; display: block; }
    .desk .label { font-size: 28px; color: var(--ink-light); margin-top: 8px; font-family: var(--mono); }
    .cards-area {
      position: absolute; left: 320px; right: 60px; top: 500px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    .appt {
      background: #fff; border: 2px solid var(--lane-pink-border);
      border-radius: 14px; padding: 20px 24px; opacity: 0;
      box-shadow: 0 6px 20px rgba(194, 24, 91, 0.1);
    }
    .appt .time {
      font-family: var(--mono); font-size: 26px; color: var(--lane-pink-accent);
      margin-bottom: 6px;
    }
    .appt .client { font-size: 34px; font-weight: 800; }
    .appt .svc { font-size: 26px; color: var(--ink-light); margin-top: 4px; }
    .echo {
      position: absolute; left: 0; right: 0; bottom: 480px;
      text-align: center; font-size: 56px; font-weight: 900;
      color: var(--lane-pink-accent); opacity: 0; padding: 0 60px;
    }
    .caption {
      position: absolute; left: 0; right: 0; bottom: 380px;
      text-align: center; font-size: 40px; font-weight: 700;
      color: var(--ink-light); opacity: 0;
    }
    .walk-arrow {
      position: absolute; left: 120px; top: 680px;
      font-family: var(--mono); font-size: 28px; color: var(--lane-pink-accent);
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="lane-header" id="header">
      <div class="tag">SWIMLANE · PINK</div>
      <div class="name" id="name">💅 美甲店</div>
      <div class="pain" id="pain">预约核销全在微信</div>
    </div>
    <div class="desk" id="desk">
      <span class="staff" id="staff">👩‍💼</span>
      <span class="label">前台 · 唯一对接人</span>
    </div>
    <div class="cards-area" id="cards"></div>
    <div class="walk-arrow" id="arrow">→ 离职</div>
    <div class="echo" id="echo">「人走了就乱」</div>
    <div class="caption" id="caption">预约卡没人管了</div>
  </div>
  <script>
    const data = window.getData();
    const defaults = [
      { time: "10:30", client: "张女士", svc: "法式美甲" },
      { time: "14:00", client: "李小姐", svc: "卸甲+护理" },
      { time: "16:30", client: "王姐", svc: "贴片延长" },
      { time: "18:00", client: "陈小姐", svc: "纯色+跳色" }
    ];
    const appts = data.appointments || defaults;
    const cards = document.getElementById("cards");
    appts.forEach(a => {
      const el = document.createElement("div");
      el.className = "appt";
      el.innerHTML = `<div class="time">${a.time}</div><div class="client">${a.client}</div><div class="svc">${a.svc}</div>`;
      cards.appendChild(el);
    });
    if (data.name) document.getElementById("name").textContent = data.name;
    if (data.pain) document.getElementById("pain").textContent = data.pain;
    if (data.echo) document.getElementById("echo").textContent = `「${data.echo.replace(/[「」]/g, "")}」`;
    if (data.caption) document.getElementById("caption").textContent = data.caption;

    const tl = gsap.timeline();
    tl.fromTo("#header", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0);
    tl.fromTo("#desk", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35 }, 0.3);
    tl.fromTo(".appt", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, stagger: 0.15, ease: "back.out(1.6)" }, 0.55);
    tl.to(".appt", { boxShadow: "0 8px 24px rgba(194,24,91,0.18)", duration: 0.2, stagger: 0.08 }, 1.4);

    tl.to("#staff", { x: 180, opacity: 0, duration: 0.6, ease: "power2.in" }, 2.8);
    tl.fromTo("#arrow", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 2.9);
    tl.to(".appt", {
      x: () => gsap.utils.random(-80, 80),
      y: () => gsap.utils.random(40, 160),
      rotation: () => gsap.utils.random(-25, 25),
      opacity: 0.35,
      duration: 0.55,
      stagger: 0.08,
      ease: "power2.out"
    }, 3.2);
    tl.to("#desk", { opacity: 0.3, duration: 0.3 }, 3.3);
    tl.fromTo("#echo", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 4.0);
    tl.fromTo("#caption", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35 }, 4.5);
    tl.to("#echo", { scale: 1.05, duration: 0.15, yoyo: true, repeat: 2 }, 5.0);
    tl.to({}, { duration: 1.2 }, 5.8);
    registerTimeline(tl);
  </script>
</body>
</html>

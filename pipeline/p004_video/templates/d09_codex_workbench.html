<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>D09 Codex Workbench</title><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>
body{margin:0;width:1080px;height:1920px;background:#eef4ff;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overflow:hidden}.title{position:absolute;top:120px;left:72px;font-size:70px;font-weight:950;line-height:1.12}.desk{position:absolute;left:70px;right:70px;top:360px;height:1180px;border-radius:38px;background:#fff;border:3px solid #c7d7fe;box-shadow:0 24px 70px rgba(37,99,235,.13);padding:44px}.step{height:145px;border-radius:26px;background:#f8fafc;margin-bottom:26px;display:flex;align-items:center;padding:0 32px;font-size:44px;font-weight:900;opacity:0;transform:translateY(30px)}.dot{width:42px;height:42px;border-radius:50%;background:#2563eb;margin-right:24px}.ok{background:#16a34a}.note{position:absolute;bottom:210px;left:84px;right:84px;font-size:42px;font-weight:900;color:#047857;opacity:0}
</style></head><body><div class="title">这时候<br>Codex 才好下手</div><div class="desk"><div class="step"><div class="dot"></div>读文件</div><div class="step"><div class="dot"></div>写脚本</div><div class="step"><div class="dot"></div>跑一下</div><div class="step"><div class="dot"></div>报错再改</div><div class="step"><div class="dot ok"></div>给你确认</div></div><div class="note">不是神奇一键，是一步步把流程跑起来</div><script>const tl=gsap.timeline();tl.fromTo(".title",{opacity:0,y:28},{opacity:1,y:0,duration:.4},0);tl.fromTo(".desk",{opacity:0,scale:.97},{opacity:1,scale:1,duration:.4},.35);tl.to(".step",{opacity:1,y:0,duration:.32,stagger:.55,ease:"back.out(1.4)"},.8);tl.fromTo(".note",{y:26},{opacity:1,y:0,duration:.35},4.0);tl.to({}, {duration:7.5},4.4);registerTimeline(tl);</script></body></html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>01b Punch</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    html, body { background: #000; }
    .canvas { background: #000; }
    .punch {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      font-family: var(--sans);
      font-weight: 900;
      font-size: 360px;
      line-height: 1;
      letter-spacing: -8px;
      color: #fff;
    }
    .punch .sub {
      display: block;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--gray-2);
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="punch" id="punch">
      <span id="big"></span>
      <span class="sub" id="sub"></span>
    </div>
  </div>

  <script>
    const data = window.getData();
    document.getElementById("big").textContent = data.big || "23 字";
    document.getElementById("sub").textContent = data.sub || "";

    const tl = gsap.timeline();
    tl.fromTo("#punch",
      { scale: 1.4, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.08, ease: "power3.out" }, 0);
    tl.to({}, { duration: 0.52 }, 0.08);

    registerTimeline(tl);
  </script>
</body>
</html>

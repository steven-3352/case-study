<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;}
  .bg{position:absolute;inset:0;background:url(../../../assets/characters/w27d02/me_phone.png) center/cover no-repeat;}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,22,38,.35) 0%,rgba(14,22,38,.2) 40%,rgba(14,22,38,.9) 100%);}
  .anchor{position:absolute;top:200px;left:60px;right:60px;text-align:center;font-size:58px;font-weight:900;line-height:1.4;opacity:0;}
  .anchor .hi{color:#ffd23f;}
  .proof{position:absolute;top:1120px;left:60px;right:60px;text-align:center;font-size:48px;font-weight:800;opacity:0;}
  .proof .hi{color:#7CF29B;}
  .cta{position:absolute;bottom:230px;left:60px;right:60px;text-align:center;opacity:0;}
  .cta .q{font-size:54px;font-weight:900;line-height:1.35;}
  .cta .q .hi{color:#ffd23f;}
  .cta .s{margin-top:22px;font-size:38px;color:#cdd9f2;}
</style></head>
<body>
  <div class="bg"></div><div class="scrim"></div>
  <div class="anchor" id="anchor">记录和追待办，<br><span class="hi">根本不该是人干的活</span>。</div>
  <div class="proof" id="proof">这套，是我<span class="hi">天天在用</span>的</div>
  <div class="cta" id="cta">
    <div class="q">你们公司开会，<br><span class="hi">纪要是谁在整理？</span></div>
    <div class="s">评论区说说 · 下条我真做给你看</div>
  </div>
<script>
  const tl=gsap.timeline({paused:true});
  tl.fromTo("#anchor",{opacity:0,y:30},{opacity:1,y:0,duration:.6,ease:"power2.out"},0.3);
  tl.to("#anchor",{opacity:0,duration:.4},5.0);
  tl.fromTo("#proof",{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:"back.out(1.5)"},5.2);
  tl.fromTo("#cta",{opacity:0,y:30},{opacity:1,y:0,duration:.5,ease:"back.out(1.4)"},6.6);
  tl.to("#cta .q .hi",{scale:1.1,yoyo:true,repeat:3,duration:.3,transformOrigin:"center"},7.4);
  if(window.registerTimeline) window.registerTimeline(tl); else tl.play();
</script>
</body></html>

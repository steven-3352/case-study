<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>EP03 s3 · 机械大于自觉</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.8),rgba(6,9,14,.66) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  /* 规矩 → 编译 → 闸门 */
  .transform{position:absolute;left:52px;right:52px;top:300px;display:flex;align-items:center;justify-content:center;gap:30px}
  .chip{border-radius:16px;padding:26px 32px;font-size:38px;font-weight:800;font-family:"SF Mono",monospace;opacity:0}
  .chip.rule{background:rgba(20,24,30,.94);border:2px solid #2a3038;color:var(--muted)}
  .arrow{font-size:56px;color:var(--amber);opacity:0}
  .chip.gate{background:rgba(19,26,22,.94);border:2px solid rgba(63,185,80,.6);color:var(--green)}
  /* 核心锤 */
  .hammer{position:absolute;left:0;right:0;top:560px;text-align:center;opacity:0}
  .hammer .big{font-size:200px;font-weight:900;line-height:1;letter-spacing:-2px}
  .hammer .g{color:var(--green)} .hammer .vs{color:var(--muted);font-size:120px} .hammer .s{color:#8b949e;text-decoration:line-through;text-decoration-color:var(--amber);text-decoration-thickness:12px}
  /* 类比 */
  .analog{position:absolute;left:52px;right:52px;top:1000px;display:flex;gap:24px;justify-content:center;opacity:0}
  .an{flex:1;max-width:440px;background:rgba(20,24,30,.9);border:2px solid #2a3038;border-radius:18px;padding:26px;text-align:center}
  .an .ic{font-size:66px}.an .t{color:var(--muted);font-size:32px;margin-top:10px;line-height:1.3}
  .caption{position:absolute;left:52px;right:52px;bottom:180px;text-align:center;font-size:76px;font-weight:900;letter-spacing:2px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--green)}
</style></head>
<body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="transform">
      <div class="chip rule" id="rule">"出片先过质量门"</div>
      <div class="arrow" id="arrow">⟶</div>
      <div class="chip gate" id="gate">🔒 绕不过的闸门</div>
    </div>
    <div class="hammer" id="hammer"><div class="big"><span class="g">机械</span> <span class="vs">&gt;</span> <span class="s">自觉</span></div></div>
    <div class="analog" id="analog">
      <div class="an"><div class="ic">🚦</div><div class="t">红绿灯<br>不靠司机自觉</div></div>
      <div class="an"><div class="ic">🔒</div><div class="t">不戴护具<br>机器不启动</div></div>
    </div>
    <div class="caption" id="cap">不靠自觉,<b>靠机制</b></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo("#rule",{opacity:0,y:16},{opacity:1,y:0,duration:.4,ease:"power2.out"},0.4);
  tl.fromTo("#arrow",{opacity:0,x:-14},{opacity:1,x:0,duration:.35},1.2);
  tl.fromTo("#gate",{opacity:0,scale:.7},{opacity:1,scale:1,duration:.45,ease:"back.out(2.4)"},1.6);
  tl.to("#gate",{boxShadow:"0 0 46px rgba(63,185,80,.4)",duration:.4},2.0);
  // 核心锤:机械>自觉 砸下来
  tl.fromTo("#hammer",{opacity:0,scale:2.2,y:-60},{opacity:1,scale:1,y:0,duration:.5,ease:"power4.in"},2.8);
  tl.to("#hammer",{scale:1.05,duration:.1,yoyo:true,repeat:1,ease:"power2.out"},3.3);
  tl.fromTo(".hammer .s",{textDecorationColor:"rgba(210,153,34,0)"},{textDecorationColor:"rgba(210,153,34,1)",duration:.3},3.5);  // 划掉"自觉"
  tl.fromTo("#analog",{opacity:0,y:24},{opacity:1,y:0,duration:.45,ease:"power2.out"},4.0);
  tl.fromTo("#cap",{opacity:0,y:28},{opacity:1,y:0,duration:.5,ease:"power3.out"},4.9);
  tl.to({},{duration:1.6},5.7);
  registerTimeline(tl);
</script>
</body></html>

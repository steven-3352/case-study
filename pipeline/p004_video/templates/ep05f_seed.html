<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP05 s1 · 不能信它</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"SF Mono","Menlo","PingFang SC",monospace;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("ep01f_desk.jpg");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.76),rgba(6,9,14,.5) 34%,rgba(6,9,14,.44) 55%,rgba(6,9,14,.88) 82%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .term{position:absolute;left:56px;right:56px;top:360px;background:rgba(13,17,23,.94);border-radius:26px;box-shadow:0 46px 110px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.05),0 1px 0 rgba(255,255,255,.1) inset}
  .titlebar{height:90px;background:rgba(22,27,34,.92);border-bottom:1px solid #21262d;display:flex;align-items:center;padding:0 32px;gap:15px;border-radius:24px 24px 0 0}
  .lights{display:flex;gap:14px}.lights i{width:24px;height:24px;border-radius:50%;display:block}.lights .r{background:#ff5f56}.lights .y{background:#febc2e}.lights .g{background:#27c93f}
  .path{color:var(--muted);font-size:30px;margin-left:16px}
  .body{padding:40px 40px 46px;display:flex;flex-direction:column;gap:26px}
  .said{font-size:42px;color:var(--muted);opacity:0}.said .g{color:var(--green)}
  .rule{border:2px solid rgba(229,72,77,.45);background:rgba(229,72,77,.08);border-radius:16px;padding:28px 30px;opacity:0}
  .rule .h{color:var(--muted);font-size:28px;margin-bottom:12px}
  .rule .q{font-size:46px;font-weight:900;line-height:1.35;color:#ffd7d9}.rule .q b{color:var(--red)}
  .caption{position:absolute;left:52px;right:52px;bottom:180px;font-size:84px;font-weight:900;line-height:1.2;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0;font-family:"PingFang SC","Heiti SC",sans-serif}
  .caption b{color:var(--red)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="term"><div class="titlebar"><div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="path">claude ~/大脑 · 铁律</div></div>
      <div class="body">
        <div class="said" id="said">⏺ 它说:<span class="g">"做好了 ✓"</span></div>
        <div class="rule" id="rule"><div class="h">// GATE_BYPASS_LOG · 铁律</div><div class="q">"同 Agent <b>自评 pass 无效</b>,须<b>独立复评</b>"</div></div>
      </div>
    </div>
    <div class="caption" id="cap"><b>不能信</b>它自己说的</div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo(".term",{scale:1.0},{scale:1.013,duration:11.6,ease:"sine.inOut"},0);
  // "它说做好了" —— 冷开题
  tl.fromTo("#said",{opacity:0,y:14},{opacity:1,y:0,duration:.45},0.4);
  tl.fromTo("#said .g",{scale:1.5},{scale:1,duration:.4,ease:"back.out(3)",transformOrigin:"center"},2.6);
  tl.to("#said",{opacity:.5,duration:.4},5.4);   // 淡下 —— "不算"
  // "得有别的东西替我盯着它" —— 铁律浮出
  tl.fromTo("#rule",{opacity:0,y:22},{opacity:1,y:0,duration:.5,ease:"power2.out"},6.2);
  tl.fromTo(".rule .q b",{color:"#ffd7d9"},{color:"#e5484d",duration:.3,stagger:.25},8.4);
  tl.to(".rule",{boxShadow:"0 0 44px rgba(229,72,77,.3)",duration:.5,yoyo:true,repeat:1},9.0);
  // 底部大字 caption 交给字幕层,不再动画
  tl.to({},{duration:1.2},11.6);
  registerTimeline(tl);
</script></body></html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  body{background:#0a0e14;}
  .ctx{position:absolute;top:140px;left:0;right:0;text-align:center;font-size:42px;
    color:var(--gray-2);font-weight:700;letter-spacing:2px;opacity:0;}
  .msg{position:absolute;left:80px;right:80px;background:#fff;border-radius:28px;
    padding:30px 36px;box-shadow:0 20px 60px rgba(0,0,0,.5);opacity:0;}
  .msg .avt{display:flex;align-items:center;gap:18px;margin-bottom:14px;}
  .msg .avt .dot{width:60px;height:60px;border-radius:50%;}
  .msg .avt .who{font-size:30px;font-weight:800;color:#1a1f29;}
  .msg .avt .when{margin-left:auto;font-size:24px;color:#999;}
  .msg .txt{font-size:42px;color:#1a1f29;font-weight:600;line-height:1.45;letter-spacing:1px;}
  .msg .wm{position:absolute;top:14px;right:18px;font-size:20px;color:#fff;background:#ff8c00;
    padding:4px 12px;border-radius:6px;font-weight:800;letter-spacing:2px;}
  .m1{top:280px;}
  .m1 .dot{background:linear-gradient(135deg,#ff6b6b,#ff8c8c);}
  .m2{top:760px;}
  .m2 .dot{background:linear-gradient(135deg,#4ecdc4,#7ed7d0);}
  .m3{top:1240px;}
  .m3 .dot{background:linear-gradient(135deg,#ffd23f,#ffe27a);}
  .label{position:absolute;left:0;right:0;bottom:140px;text-align:center;font-size:60px;
    font-weight:900;color:#fff;opacity:0;text-shadow:0 4px 18px rgba(0,0,0,.6);letter-spacing:3px;}
</style></head>
<body>
<div class="canvas">
  <div class="ctx" id="ctx">今早 6:00–9:30,陆续收到 3 条私信</div>
  <div class="msg m1" id="m1">
    <div class="wm">示意</div>
    <div class="avt"><div class="dot"></div><div class="who">餐饮老板 · 张</div><div class="when">06:42</div></div>
    <div class="txt">看到你那条 AI 出片,能给我店里也做一套吗?</div>
  </div>
  <div class="msg m2" id="m2">
    <div class="wm">示意</div>
    <div class="avt"><div class="dot"></div><div class="who">美容店主 · 林</div><div class="when">08:15</div></div>
    <div class="txt">你这个 AI 内容怎么收费?可以包月吗?</div>
  </div>
  <div class="msg m3" id="m3">
    <div class="wm">示意</div>
    <div class="avt"><div class="dot"></div><div class="who">教培负责人 · 王</div><div class="when">09:21</div></div>
    <div class="txt">店里需要小红书,自己做不来,你能接吗?</div>
  </div>
  <div class="label" id="label">3 条 · 今早</div>
</div>
<script>
  const tl=gsap.timeline({paused:true});
  tl.to("#ctx",{opacity:1,duration:.3},0);
  tl.fromTo("#m1",{opacity:0,x:200,scale:.9},{opacity:1,x:0,scale:1,duration:.5,ease:"back.out(1.4)"},.3);
  tl.fromTo("#m2",{opacity:0,x:200,scale:.9},{opacity:1,x:0,scale:1,duration:.5,ease:"back.out(1.4)"},1.3);
  tl.fromTo("#m3",{opacity:0,x:200,scale:.9},{opacity:1,x:0,scale:1,duration:.5,ease:"back.out(1.4)"},2.3);
  tl.fromTo("#label",{opacity:0,y:30},{opacity:1,y:0,duration:.4},3.3);
  tl.to({},{duration:.3},3.8);
  registerTimeline(tl);
</script>
</body></html>

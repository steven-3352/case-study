<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP06 s1 · 立场</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--red:#e5484d;--amber:#d29922}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.78),rgba(6,9,14,.6) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .titles{position:absolute;left:80px;right:80px;top:420px;display:flex;flex-direction:column;gap:26px}
  .fake{position:relative;font-size:52px;font-weight:800;color:var(--muted);opacity:0;text-align:center;padding:14px}
  .fake .strike{position:absolute;left:0;top:50%;height:8px;background:var(--red);width:0;transform:translateY(-50%);border-radius:4px}
  .real{position:absolute;left:52px;right:52px;top:760px;text-align:center;opacity:0}
  .real .tag{display:inline-block;font-size:66px;font-weight:900;color:#fff;background:var(--red);border-radius:18px;padding:20px 48px;box-shadow:0 20px 60px rgba(229,72,77,.4)}
  .caption{position:absolute;left:52px;right:52px;bottom:220px;text-align:center;font-size:80px;font-weight:900;line-height:1.2;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--red)}
  .caption .sub{display:block;font-size:44px;color:var(--muted);font-weight:700;margin-top:14px}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="titles">
      <div class="fake" id="f1">「AI 效率提升 10 倍」<span class="strike" id="st1"></span></div>
      <div class="fake" id="f2">「我的 AI 有多牛」<span class="strike" id="st2"></span></div>
      <div class="fake" id="f3">「效果炸裂」<span class="strike" id="st3"></span></div>
    </div>
    <div class="real" id="real"><span class="tag">翻车实录</span></div>
    <div class="caption" id="cap">别人发炸裂 · 我发<b>翻车</b><span class="sub">今天 3 个,全给你看</span></div>
  </div>
<script>
  const tl=gsap.timeline();
  ["#f1","#f2","#f3"].forEach((f,i)=>{
    tl.fromTo(f,{opacity:0},{opacity:.8,duration:.3},0.3+i*0.5);
    tl.fromTo("#st"+(i+1),{width:0},{width:"108%",duration:.3,ease:"power2.in"},0.55+i*0.5);
  });
  tl.fromTo("#real",{opacity:0,scale:.6,rotation:-6},{opacity:1,scale:1,rotation:-3,duration:.5,ease:"back.out(2)"},2.2);
  tl.fromTo("#cap",{opacity:0,y:28},{opacity:1,y:0,duration:.5,ease:"power3.out"},3.0);
  tl.to({},{duration:1.4},4.0);
  registerTimeline(tl);
</script></body></html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP06 s0 · 开场自嘲钩子 · 一天翻了3次车</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 60% at 50% 40%, rgba(229,72,77,.08), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.82) 0%, rgba(6,9,14,.62) 34%, rgba(6,9,14,.6) 60%, rgba(6,9,14,.9) 88%, rgba(6,9,14,.97) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .wrap{ position:absolute; left:70px; right:70px; top:400px; text-align:center; }
  .kick{ font-size:48px; color:var(--muted); font-weight:700; letter-spacing:1px; opacity:0; }
  .kick b{ color:#c9d1d9; }
  .hero{ margin-top:34px; font-size:150px; font-weight:900; line-height:1.08; letter-spacing:2px;
    text-shadow:0 6px 30px rgba(0,0,0,.8); opacity:0; }
  .hero b{ color:var(--red); }
  .hero .num{ color:var(--red); font-size:190px; }

  .marks{ position:absolute; left:120px; right:120px; top:1000px; display:flex; gap:34px; justify-content:center; }
  .mk{ flex:1; text-align:center; background:rgba(26,18,15,.82); border:2px solid rgba(229,72,77,.5);
    border-radius:20px; padding:30px 10px; opacity:0; box-shadow:0 18px 46px rgba(0,0,0,.5); }
  .mk .x{ font-size:76px; font-weight:900; color:var(--red); line-height:1; }
  .mk .lb{ margin-top:14px; font-size:34px; font-weight:800; color:#c9d1d9; }

  .foot{ position:absolute; left:70px; right:70px; bottom:360px; text-align:center;
    font-size:60px; font-weight:900; color:#fff; letter-spacing:1px; opacity:0;
    text-shadow:0 4px 22px rgba(0,0,0,.85); }
  .foot b{ color:var(--amber); }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="wrap">
      <div class="kick" id="kick">我做 AI 助理的 <b>第一天</b></div>
      <div class="hero" id="hero">一天翻了<br><span class="num" id="num">3</span> 次<b>车</b></div>
    </div>
    <div class="marks">
      <div class="mk" id="mk0"><div class="x">✗</div><div class="lb">盲签</div></div>
      <div class="mk" id="mk1"><div class="x">✗</div><div class="lb">被琐事烦</div></div>
      <div class="mk" id="mk2"><div class="x">✗</div><div class="lb">最蠢那次</div></div>
    </div>
    <div class="foot" id="foot">今天全给你看 · <b>包括最蠢那次</b></div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.fromTo("#kick", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 0.15);
  // "翻了3次车" 砸出
  tl.fromTo("#hero", { opacity:0, scale:0.84, y:24 }, { opacity:1, scale:1, y:0, duration:0.5, ease:"back.out(1.5)" }, 1.3);
  tl.fromTo("#num", { scale:2.0 }, { scale:1, duration:0.4, ease:"back.out(3)", transformOrigin:"center" }, 1.75);
  tl.to("#hero", { keyframes:[{ x:-9 },{ x:9 },{ x:-5 },{ x:0 }], duration:0.26, ease:"none" }, 1.8);
  // 三个 ✗ 翻车标记逐个弹入
  ["#mk0","#mk1","#mk2"].forEach((m,i)=>{
    tl.fromTo(m, { opacity:0, y:26, scale:0.86 }, { opacity:1, y:0, scale:1, duration:0.4, ease:"back.out(1.6)" }, 2.6 + i*0.55);
  });
  // 收尾自嘲承诺
  tl.fromTo("#foot", { opacity:0, y:22 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 4.5);
  tl.to("#foot b", { scale:1.1, duration:0.45, yoyo:true, repeat:2, ease:"sine.inOut", transformOrigin:"center" }, 5.0);
  tl.to({}, { duration:0.6 }, 6.5);
  registerTimeline(tl);
</script>
</body>
</html>

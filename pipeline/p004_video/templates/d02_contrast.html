<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;background:#0e1626;}
  .title{position:absolute;top:110px;left:0;right:0;text-align:center;font-size:48px;font-weight:900;opacity:0;z-index:5;}
  .half{position:absolute;top:250px;bottom:150px;width:50%;overflow:hidden;}
  .left{left:0;} .right{right:0;}
  .pic{position:absolute;inset:0;background-size:cover;background-position:center;}
  .left .pic{background-image:url(../../../assets/characters/w27d02/tired.png);}
  .right .pic{background-image:url(../../../assets/characters/w27d02/relaxed.png);}
  .tint{position:absolute;inset:0;}
  .left .tint{background:linear-gradient(180deg,rgba(40,30,50,.1),rgba(40,30,50,.85));}
  .right .tint{background:linear-gradient(180deg,rgba(21,48,42,.1),rgba(21,48,42,.8));}
  .lab{position:absolute;bottom:60px;left:0;right:0;text-align:center;padding:0 20px;}
  .lab .w{font-size:42px;font-weight:900;}
  .lab .d{font-size:34px;margin-top:12px;line-height:1.35;}
  .left .lab .w{color:#ff9a9a;} .right .lab .w{color:#7CF29B;}
  .vs{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:140px;height:140px;border-radius:50%;
    background:#0e1626;box-shadow:0 0 0 8px #0e1626;display:flex;align-items:center;justify-content:center;
    font-size:80px;font-weight:900;opacity:0;z-index:6;}
</style></head>
<body>
  <div class="title" id="title">会后，差别才出来</div>
  <div class="half left" id="left"><div class="pic"></div><div class="tint"></div>
    <div class="lab"><div class="w">同事</div><div class="d">还在回放录音<br>熬夜整理纪要</div></div></div>
  <div class="half right" id="right"><div class="pic"></div><div class="tint"></div>
    <div class="lab"><div class="w">我</div><div class="d">已经去干<br>下一件事了</div></div></div>
  <div class="vs" id="vs">VS</div>
<script>
  const tl=gsap.timeline({paused:true});
  tl.fromTo("#title",{opacity:0,y:-20},{opacity:1,y:0,duration:.5},0.2);
  tl.fromTo("#left",{x:-200,opacity:0},{x:0,opacity:1,duration:.6,ease:"power2.out"},0.6);
  tl.fromTo("#right",{x:200,opacity:0},{x:0,opacity:1,duration:.6,ease:"power2.out"},0.6);
  tl.fromTo("#vs",{opacity:0,scale:.3},{opacity:1,scale:1,duration:.4,ease:"back.out(3)"},1.3);
  tl.fromTo(".left .lab",{opacity:0,y:20},{opacity:1,y:0,duration:.5},1.8);
  tl.fromTo(".right .lab",{opacity:0,y:20},{opacity:1,y:0,duration:.5},2.4);
  if(window.registerTimeline) window.registerTimeline(tl); else tl.play();
</script>
</body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><link rel="stylesheet" href="../shared/w30_d03.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
  <style>
    .targets{position:absolute;top:390px;left:65px;right:65px;display:grid;grid-template-columns:1fr 1fr;gap:35px}
    .target{height:580px;border:14px solid #111;border-radius:50%;display:grid;place-items:center;padding:55px;text-align:center;font-size:45px;font-weight:950;background:#fff;box-shadow:inset 0 0 0 28px #f2c94c}
    .beam{position:absolute;left:520px;top:1000px;width:14px;height:0;background:var(--d3-blue)}.token{left:489px;top:1040px}
  </style>
</head>
<body>
  <div class="canvas"><div class="d3-kicker">02 / 03</div><div class="d3-title" id="title"></div><div class="targets" id="targets"></div><div class="beam"></div><div class="d3-token token"></div><div class="d3-note">目标不是愿望句，是能判断“没白过”的边界。</div><div class="subtitle" id="subtitle"></div></div>
  <script>
    const d=getData(),D=+d.scene_duration||5;title.textContent=d.gate;
    (d.questions||[]).forEach(x=>{const e=document.createElement('div');e.className='target';e.textContent=x;targets.appendChild(e)});subtitle.textContent=d.subtitle||'';
    const tl=gsap.timeline({paused:true}).from('.target',{scale:.3,autoAlpha:0,duration:.45,stagger:.35}).to('.beam',{height:500,duration:Math.max(1.4,D-2),ease:'none'},1).to('.token',{y:-480,duration:Math.max(1.4,D-2),ease:'none'},1);
    gsap.utils.toArray('.target').forEach((el,i)=>{const t=.9+i*(D-1.5)/2;tl.to(el,{backgroundColor:'#fff1a8',scale:1.04,duration:.22},t).to(el,{backgroundColor:'#fff',scale:1,duration:.22},Math.min(D-.35,t+Math.max(1,(D-1.8)/2.4)))});
    tl.to({},{duration:D},0);registerTimeline(tl);
  </script>
</body>
</html>

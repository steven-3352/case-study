<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><link rel="stylesheet" href="../shared/w30_d03.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
  <style>
    .road{position:absolute;top:420px;left:150px;right:150px;height:760px;border-left:18px solid var(--d3-blue)}
    .step{position:relative;margin:0 0 70px 70px;min-height:150px;background:#fff;border:4px solid #111;padding:35px 35px 30px 110px;font-size:42px;font-weight:900}
    .step:before{content:attr(data-n);position:absolute;left:-116px;top:28px;width:86px;height:86px;background:var(--d3-yellow);border:5px solid #111;display:grid;place-items:center;font-size:42px}.token{left:113px;top:430px}
  </style>
</head>
<body>
  <div class="canvas"><div class="d3-kicker">03 / 03</div><div class="d3-title" id="title"></div><div class="road" id="road"></div><div class="d3-token token"></div><div class="d3-note">从方向名词，压到这周能验证的动作。</div><div class="subtitle" id="subtitle"></div></div>
  <script>
    const d=getData(),D=+d.scene_duration||6;title.textContent=d.gate;
    (d.questions||[]).forEach((x,i)=>{const e=document.createElement('div');e.className='step';e.dataset.n=i+1;e.textContent=x;road.appendChild(e)});subtitle.textContent=d.subtitle||'';
    const tl=gsap.timeline({paused:true}).from('.step',{x:120,autoAlpha:0,duration:.3,stagger:.55}).to('.token',{y:570,duration:Math.max(2.2,D-1),ease:'none'},.5);
    gsap.utils.toArray('.step').forEach((el,i)=>{const t=.8+i*(D-1.4)/3;tl.to(el,{backgroundColor:'#fff1a8',x:24,duration:.2},t).to(el,{backgroundColor:'#fff',x:0,duration:.2},Math.min(D-.3,t+Math.max(.8,(D-1.6)/3.5)))});
    tl.to({},{duration:D},0);registerTimeline(tl);
  </script>
</body>
</html>

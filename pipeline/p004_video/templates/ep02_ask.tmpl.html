<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP02 s1 · 前摇 · 要成片</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"SF Mono","JetBrains Mono","Menlo","PingFang SC",monospace; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("__DESK_B64__"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,9,14,.72) 0%, rgba(6,9,14,.48) 34%, rgba(6,9,14,.40) 55%, rgba(6,9,14,.86) 82%, rgba(6,9,14,.95) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  .term{ position:absolute; left:58px; right:58px; top:520px;
    background:rgba(13,17,23,.94); border-radius:26px;
    box-shadow:0 46px 110px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.05),0 1px 0 rgba(255,255,255,.10) inset; }
  .titlebar{ height:92px; background:rgba(22,27,34,.92); border-bottom:1px solid #21262d;
    display:flex; align-items:center; padding:0 34px; gap:16px; border-radius:24px 24px 0 0; }
  .lights{ display:flex; gap:15px; } .lights i{ width:25px; height:25px; border-radius:50%; display:block; }
  .lights .r{ background:#ff5f56; } .lights .y{ background:#febc2e; } .lights .g{ background:#27c93f; }
  .path{ color:var(--muted); font-size:31px; margin-left:18px; }
  .body{ padding:44px 42px 48px; display:flex; flex-direction:column; gap:32px; }
  .line{ font-size:44px; line-height:1.34; }
  .prompt .caret{ color:var(--green); font-weight:700; margin-right:14px; }
  .u{ color:var(--ink); }
  .bullet{ color:var(--amber); margin-right:14px; }
  .ok{ color:var(--green); font-weight:800; }
  #lai{ opacity:0; }
  .blink{ display:inline-block; width:19px; height:46px; background:var(--ink); vertical-align:-8px; margin-left:8px; }
  .caption{ position:absolute; left:52px; right:52px; bottom:180px;
    font-size:80px; font-weight:900; line-height:1.2; letter-spacing:1px;
    font-family:"PingFang SC","Heiti SC",sans-serif; text-shadow:0 4px 24px rgba(0,0,0,.85); opacity:0; }
  .caption b{ color:var(--amber); }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="term">
      <div class="titlebar">
        <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <div class="path">claude ~/my-ai-assistant</div>
      </div>
      <div class="body">
        <div class="line prompt"><span class="caret">&gt;</span><span class="u" id="t1"></span><span class="blink" id="blink"></span></div>
        <div class="line" id="lai"><span class="bullet">⏺</span><span class="ok">好了。</span></div>
      </div>
    </div>
    <div class="caption" id="cap">我要一个<b>能直接用的成片</b></div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.add(window.typewriter("#t1", "给我一个能直接用的、最好状态的,成片。", { stagger: 0.06 }), 0.4);
  tl.to("#blink", { opacity: 0, duration: 0.32, repeat: 6, yoyo: true, ease: "steps(1)" }, 2.6);
  // 停顿(暴风前最静一秒)→ 它秒回"好了"
  tl.fromTo("#lai", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 4.3);
  tl.fromTo("#cap", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.2);
  tl.to({}, { duration: 1.4 }, 5.0);
  registerTimeline(tl);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP06 s4 · 边界救命勾EP07</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.78),rgba(6,9,14,.6) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .repos{position:absolute;left:80px;right:80px;top:360px;display:flex;gap:26px;align-items:center;justify-content:center}
  .repo{flex:1;background:rgba(20,24,30,.92);border:2px solid #2a3038;border-radius:18px;padding:28px;text-align:center;opacity:0}
  .repo .ic{font-size:60px}.repo .n{font-size:34px;color:var(--muted);margin-top:10px}
  .repo.brain{border-color:rgba(63,185,80,.5)} .repo.proj{border-color:rgba(210,153,34,.5)}
  .tomb{position:absolute;left:52px;right:52px;top:640px;text-align:center;font-size:44px;color:var(--green);font-weight:800;opacity:0}
  .caption{position:absolute;left:52px;right:52px;top:800px;text-align:center;font-size:78px;font-weight:900;line-height:1.2;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--red)}
  .next{position:absolute;left:52px;right:52px;bottom:210px;text-align:center;font-size:56px;font-weight:900;color:#fff;opacity:0}
  .next .n{display:block;color:var(--muted);font-size:42px;margin-bottom:12px;font-family:"SF Mono",monospace}
  .next b{color:var(--amber)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="repos">
      <div class="repo brain" id="rb"><div class="ic">🧠</div><div class="n">大脑<br>只留门牌</div></div>
      <div class="repo proj" id="rp"><div class="ic">🗑️</div><div class="n">项目仓库<br>删地盘 = 干净</div></div>
    </div>
    <div class="tomb" id="tomb">✓ 平行不嵌套(EP04那条边界)· 救了我一命</div>
    <div class="caption" id="cap">翻车不留痕,<br><b>才是真翻车</b></div>
    <div class="next" id="next"><span class="n">下 集</span>复刻 <b>5 步 · 坑我全标好</b></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo("#rb",{opacity:0,x:-24},{opacity:1,x:0,duration:.45,ease:"back.out(1.4)"},0.4);
  tl.fromTo("#rp",{opacity:0,x:24},{opacity:1,x:0,duration:.45,ease:"back.out(1.4)"},0.9);
  tl.to("#rp",{opacity:.5,scale:.95,duration:.4},1.8);   // 项目仓库删掉,变淡
  tl.fromTo("#tomb",{opacity:0,y:12},{opacity:1,y:0,duration:.4},2.2);
  tl.fromTo("#cap",{opacity:0,y:26},{opacity:1,y:0,duration:.5,ease:"power3.out"},3.0);
  tl.fromTo("#next",{opacity:0,y:22},{opacity:1,y:0,duration:.45,ease:"power2.out"},4.0);
  tl.to("#next b",{scale:1.05,duration:.5,yoyo:true,repeat:2,ease:"sine.inOut"},4.5);
  tl.to({},{duration:1.4},5.0);
  registerTimeline(tl);
</script></body></html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP04 s1 · 散文件</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"SF Mono","Menlo","PingFang SC",monospace;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("ep01f_desk.jpg");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.74),rgba(6,9,14,.46) 34%,rgba(6,9,14,.42) 55%,rgba(6,9,14,.88) 82%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .term{position:absolute;left:56px;right:56px;top:300px;background:rgba(13,17,23,.94);border-radius:26px;box-shadow:0 46px 110px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.05),0 1px 0 rgba(255,255,255,.1) inset}
  .titlebar{height:90px;background:rgba(22,27,34,.92);border-bottom:1px solid #21262d;display:flex;align-items:center;padding:0 32px;gap:15px;border-radius:24px 24px 0 0}
  .lights{display:flex;gap:14px}.lights i{width:24px;height:24px;border-radius:50%;display:block}.lights .r{background:#ff5f56}.lights .y{background:#febc2e}.lights .g{background:#27c93f}
  .path{color:var(--muted);font-size:30px;margin-left:16px}
  .body{padding:36px 40px 44px}
  .cmd{font-size:36px;color:var(--muted);margin-bottom:20px}.cmd .g{color:var(--green)}
  .files{display:flex;flex-wrap:wrap;gap:14px}
  .f{opacity:0;font-size:32px;color:var(--amber);background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.3);border-radius:10px;padding:10px 18px}
  .findmsg{opacity:0;margin-top:24px;font-size:38px;color:#ffb3b5;font-weight:700}
  .caption{position:absolute;left:52px;right:52px;bottom:170px;font-size:80px;font-weight:900;line-height:1.2;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0;font-family:"PingFang SC","Heiti SC",sans-serif}
  .caption b{color:var(--green)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="term"><div class="titlebar"><div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="path">claude ~/大脑</div></div>
      <div class="body">
        <div class="cmd"><span class="g">$</span> find . -name "*规矩*"</div>
        <div class="files" id="files">
          <span class="f">rules.md</span><span class="f">guidance.md</span><span class="f">SELF.md</span><span class="f">notes.md</span><span class="f">temp规矩.md</span><span class="f">协作铁律.md</span><span class="f">收尾.md</span><span class="f">边界2.md</span><span class="f">旧规矩.md</span>
        </div>
        <div class="findmsg" id="find">✗ 散在 9 个文件 · 我自己都找不着</div>
      </div>
    </div>
    <div class="caption" id="cap">与其记哪个文件放啥——<br><b>只跟 3 个头儿说话</b></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo(".term",{opacity:0,y:22},{opacity:1,y:0,duration:.6,ease:"power2.out"},0.1);
  tl.fromTo(".term",{scale:1.0},{scale:1.012,duration:12.8,ease:"sine.inOut"},0);
  // VO"规矩散得到处都是" —— 9 个文件逐条散落
  tl.to("#files .f",{opacity:1,duration:.25,stagger:.55,ease:"power1.out"},4.6);
  tl.fromTo("#find",{opacity:0,y:12},{opacity:1,y:0,duration:.45,ease:"back.out(1.4)"},9.1);
  tl.to("#find",{textShadow:"0 0 26px rgba(229,72,77,.5)",duration:.5,yoyo:true,repeat:2,ease:"sine.inOut"},9.6);
  tl.to({},{duration:1.4},12.9);
  registerTimeline(tl);
</script></body></html>

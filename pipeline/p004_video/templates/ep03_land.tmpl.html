<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>EP03 s4 · 落点勾EP04</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.78),rgba(6,9,14,.6) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .flow{position:absolute;left:52px;right:52px;top:400px;display:flex;flex-direction:column;align-items:center;gap:34px}
  .mess{font-size:130px;opacity:0}
  .arrow{font-size:70px;color:var(--amber);opacity:0}
  .team{display:flex;gap:22px;opacity:0}
  .node{width:150px;height:150px;border-radius:20px;background:rgba(19,26,22,.94);border:2px solid rgba(63,185,80,.5);display:grid;place-items:center;font-size:60px}
  .caption{position:absolute;left:52px;right:52px;top:1030px;text-align:center;font-size:78px;font-weight:900;line-height:1.2;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption .next{color:var(--muted);font-size:44px;display:block;margin-bottom:12px;font-family:"SF Mono",monospace}
  .caption b{color:var(--green)}
  .cta{position:absolute;left:60px;right:60px;bottom:200px;text-align:center;opacity:0}
  .cta .q2{font-size:48px;font-weight:800;color:#fff}
  .cta .act{margin-top:20px;display:inline-block;font-size:44px;font-weight:900;color:#fff;background:#1f6feb;border-radius:16px;padding:16px 40px}
</style></head>
<body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="flow">
      <div class="mess" id="mess">🗂️💥</div>
      <div class="arrow" id="arrow">↓</div>
      <div class="team" id="team"><div class="node">🧭</div><div class="node">🗃️</div><div class="node">📋</div></div>
    </div>
    <div class="caption" id="cap"><span class="next">下 集</span>把它,拆成<b>一家公司</b></div>
    <div class="cta" id="cta"><div class="q2">你也想自己搭一个 AI 助理?</div><div class="act">评论区扣「同路」</div></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo("#mess",{opacity:0,scale:.6,rotation:-8},{opacity:1,scale:1,rotation:0,duration:.45,ease:"back.out(1.8)"},0.4);
  tl.to("#mess",{x:"+=8",duration:.05,repeat:5,yoyo:true},1.0);
  tl.fromTo("#arrow",{opacity:0,y:-14},{opacity:1,y:0,duration:.35},1.6);
  tl.fromTo("#team",{opacity:0,y:20},{opacity:1,y:0,duration:.4},2.1);
  tl.fromTo(".team .node",{scale:0},{scale:1,duration:.35,stagger:.14,ease:"back.out(2.2)"},2.2);
  tl.fromTo("#cap",{opacity:0,y:28},{opacity:1,y:0,duration:.5,ease:"power3.out"},3.2);
  tl.fromTo("#cta",{opacity:0,y:22},{opacity:1,y:0,duration:.45},4.1);
  tl.to(".act",{scale:1.06,duration:.5,yoyo:true,repeat:2,ease:"sine.inOut"},4.6);
  tl.to({},{duration:1.4},5.2);
  registerTimeline(tl);
</script>
</body></html>

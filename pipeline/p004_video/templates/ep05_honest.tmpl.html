<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP05 s3 · 行为靠裁判底靠硬痕</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.8),rgba(6,9,14,.64) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .honest{position:absolute;left:52px;right:52px;top:400px;font-size:44px;color:var(--muted);text-align:center;opacity:0}
  .split{position:absolute;left:52px;right:52px;top:540px;display:flex;gap:28px;height:480px}
  .card{flex:1;border-radius:24px;padding:40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);opacity:0}
  .card.soft{background:rgba(26,20,14,.94);border:3px solid rgba(210,153,34,.5)}
  .card.hard{background:rgba(19,26,22,.94);border:3px solid rgba(63,185,80,.6)}
  .card .ic{font-size:80px}.card .t{font-size:44px;font-weight:900;margin-top:16px}.card .d{font-size:32px;color:var(--muted);margin-top:12px;line-height:1.4}
  .soft .t{color:var(--amber)} .hard .t{color:var(--green)}
  .caption{position:absolute;left:52px;right:52px;top:1120px;text-align:center;font-size:78px;font-weight:900;line-height:1.2;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption .g{color:var(--green)} .caption .a{color:var(--amber)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="honest" id="honest">但我得说句实话 ——</div>
    <div class="split">
      <div class="card soft" id="soft"><div class="ic">⚖️</div><div class="t">行为裁判</div><div class="d">会漏 · 会误<br>(LLM 判断)</div></div>
      <div class="card hard" id="hard"><div class="ic">🔒</div><div class="t">离散有痕</div><div class="d">闸置没 · 文件在没<br>骗不了人</div></div>
    </div>
    <div class="caption" id="cap">行为靠<span class="a">裁判</span> · 底靠<span class="g">硬痕</span></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo("#honest",{opacity:0,y:12},{opacity:1,y:0,duration:.4},0.4);
  tl.fromTo("#soft",{opacity:0,x:-30},{opacity:1,x:0,duration:.45,ease:"back.out(1.4)"},1.2);
  tl.fromTo("#hard",{opacity:0,x:30},{opacity:1,x:0,duration:.45,ease:"back.out(1.4)"},1.8);
  tl.to("#hard",{boxShadow:"0 30px 80px rgba(0,0,0,.6),0 0 50px rgba(63,185,80,.35)",duration:.5},2.4);
  tl.fromTo("#cap",{opacity:0,y:26},{opacity:1,y:0,duration:.5,ease:"power3.out"},3.0);
  tl.to({},{duration:1.6},4.0);
  registerTimeline(tl);
</script></body></html>

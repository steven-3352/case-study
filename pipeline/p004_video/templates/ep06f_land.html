<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP06 s8 · 落点留痕 + 勾 EP07</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 60% at 50% 42%, rgba(63,185,80,.06), transparent 55%),
      linear-gradient(180deg, rgba(4,6,10,.88) 0%, rgba(4,6,10,.68) 34%, rgba(4,6,10,.66) 60%, rgba(2,3,6,.94) 88%, rgba(2,3,6,.99) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .hero{ position:absolute; left:60px; right:60px; top:290px; text-align:center;
    font-size:96px; font-weight:900; line-height:1.16; letter-spacing:2px; opacity:0;
    text-shadow:0 6px 30px rgba(0,0,0,.9); }
  .hero b{ color:var(--red); }
  .hero .g{ color:var(--green); }

  /* 墓碑 = 规矩,每翻一次立一块 */
  .tombs{ position:absolute; left:80px; right:80px; top:600px; display:flex; gap:26px; justify-content:center; }
  .tb{ flex:1; text-align:center; background:rgba(13,17,23,.86); border:1px solid #21262d;
    border-top:5px solid var(--green); border-radius:14px 14px 0 0; padding:26px 8px 30px; opacity:0; }
  .tb .ic{ font-size:56px; line-height:1; }
  .tb .lb{ margin-top:12px; font-size:30px; font-weight:800; color:#c9d1d9; }
  .harder{ position:absolute; left:60px; right:60px; top:880px; text-align:center;
    font-size:56px; font-weight:900; color:#fff; opacity:0; text-shadow:0 4px 20px rgba(0,0,0,.85); }
  .harder b{ color:var(--green); }

  /* EP07 追更卡 */
  .next{ position:absolute; left:90px; right:90px; bottom:340px;
    background:linear-gradient(135deg, rgba(210,153,34,.18), rgba(13,17,23,.92));
    border:2px solid var(--amber); border-radius:26px; padding:34px 38px;
    box-shadow:0 26px 70px rgba(0,0,0,.6); opacity:0; }
  .next .tag{ font-size:32px; font-weight:900; color:var(--amber); letter-spacing:3px; font-family:"SF Mono",monospace; }
  .next .ttl{ margin-top:14px; font-size:60px; font-weight:900; color:#fff; display:flex; align-items:center; gap:20px; }
  .next .ttl .arw{ color:var(--amber); }
  .next .ttl b{ color:var(--amber); }
  .next .sub{ margin-top:12px; font-size:36px; color:var(--muted); font-weight:700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>

    <div class="hero" id="hero">翻车不可怕<br>可怕的是 <b>不留痕</b></div>

    <div class="tombs">
      <div class="tb" id="tb0"><div class="ic">🪦</div><div class="lb">立一条规矩</div></div>
      <div class="tb" id="tb1"><div class="ic">🪦</div><div class="lb">刻一块墓碑</div></div>
      <div class="tb" id="tb2"><div class="ic">🪦</div><div class="lb">系统硬一分</div></div>
    </div>
    <div class="harder" id="harder">每翻一次 → 系统就 <b>硬一分</b></div>

    <div class="next" id="next">
      <div class="tag">下 集 · EP07</div>
      <div class="ttl"><span class="arw">▶</span><span>复刻 <b>5 步</b> · 坑我全标好</span></div>
      <div class="sub">到底成没成、值不值,你也搞?</div>
    </div>
  </div>
<script>
  const tl = gsap.timeline();
  // 1) "翻车不可怕,可怕的是不留痕"
  tl.fromTo("#hero", { opacity:0, scale:0.9, y:22 }, { opacity:1, scale:1, y:0, duration:0.6, ease:"back.out(1.3)" }, 0.4);
  tl.fromTo("#hero b", { scale:1.5 }, { scale:1, duration:0.4, ease:"back.out(3)", transformOrigin:"center" }, 2.4);
  tl.to("#hero b", { scale:1.06, duration:0.5, yoyo:true, repeat:1, ease:"sine.inOut", transformOrigin:"center" }, 2.9);
  // 2) 三块墓碑逐个立(VO"每翻一次,立一条规矩、刻一块墓碑,系统就硬一分")
  ["#tb0","#tb1","#tb2"].forEach((c,i)=>{
    tl.fromTo(c, { opacity:0, y:28, scale:0.88 }, { opacity:1, y:0, scale:1, duration:0.42, ease:"back.out(1.6)" }, 4.6 + i*0.85);
  });
  tl.fromTo("#harder", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 7.4);
  tl.to("#harder b", { scale:1.1, duration:0.45, yoyo:true, repeat:2, ease:"sine.inOut", transformOrigin:"center" }, 7.9);
  // 3) EP07 追更卡(VO"下集:复刻5步,坑我全给你标好")
  tl.to("#hero", { opacity:0.3, duration:0.5 }, 10.6);
  tl.fromTo("#next", { opacity:0, y:40, scale:0.95 }, { opacity:1, y:0, scale:1, duration:0.55, ease:"back.out(1.4)" }, 10.9);
  tl.to("#next .arw", { x:12, duration:0.5, yoyo:true, repeat:5, ease:"sine.inOut" }, 11.6);
  tl.to("#next", { boxShadow:"0 26px 70px rgba(0,0,0,.6),0 0 50px rgba(210,153,34,.32)", duration:0.6, yoyo:true, repeat:2 }, 11.8);
  tl.to("#next .ttl b", { scale:1.08, duration:0.5, yoyo:true, repeat:2, ease:"sine.inOut", transformOrigin:"center" }, 12.4);
  tl.to({}, { duration:1.0 }, 15.4);
  registerTimeline(tl);
</script>
</body>
</html>

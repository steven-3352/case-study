<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Subtitle Overlay · W27D03</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    html, body, .canvas { background: transparent !important; }
    .sub-line {
      position: absolute;
      left: 60px; right: 60px;
      bottom: 210px;                 /* 底部跟读，避开各镜中上大字钩子(subtitle_big)互斥不打架 */
      text-align: center;
      font-family: var(--sans);
      font-weight: 900;
      font-size: 50px;
      line-height: 1.3;
      color: #fff;
      letter-spacing: 1px;
      text-shadow:
        -4px -4px 0 #000, 4px -4px 0 #000,
        -4px 4px 0 #000, 4px 4px 0 #000,
        -4px 0 0 #000, 4px 0 0 #000,
        0 -4px 0 #000, 0 4px 0 #000,
        0 0 24px rgba(0,0,0,.95);
      opacity: 0;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="sub-line" id="sub"></div>
  </div>
  <script>
    // W27D03 底部跟读字幕 · 与 sub_va.srt 对齐 · 总时长 55.42s
    const lines = [
      { t: 0.0, end: 3.03, text: "一天搭完，第5天我傻眼了。" },
      { t: 3.65, end: 6.1, text: "一个人，做老外的英文市场。" },
      { t: 6.22, end: 8.67, text: "我用一天，从拉客、收邮箱、" },
      { t: 8.79, end: 11.04, text: "到自动跟进，全搭到上线。" },
      { t: 11.66, end: 12.97, text: "然后我就不管了。" },
      { t: 13.09, end: 15.46, text: "有人填邮箱，它立刻发欢迎信，" },
      { t: 15.58, end: 17.95, text: "往后每隔几天自己发一封养着。" },
      { t: 18.07, end: 20.45, text: "我人不在，它照样一封封地发，" },
      { t: 20.57, end: 23.12, text: "跟进这环，我盯的时间几乎是零。" },
      { t: 23.84, end: 26.17, text: "它一直在替我攒老外客户。" },
      { t: 26.29, end: 29.23, text: "可第5天我一看——曝光是涨了，" },
      { t: 29.35, end: 31.27, text: "留下来的却寥寥无几。" },
      { t: 31.89, end: 33.79, text: "扒下来根因是内容太机器，" },
      { t: 33.91, end: 35.81, text: "AI 一键出的图谁都刷过。" },
      { t: 35.93, end: 38.5, text: "改成 AI 只出背景、文字我自己排，" },
      { t: 38.62, end: 40.86, text: "才像活人发的，留资才开始动。" },
      { t: 40.98, end: 43.55, text: "整套基本没花钱，盯守也几乎是零。" },
      { t: 44.27, end: 46.52, text: "系统能跑，内容得先像人。" },
      { t: 46.64, end: 50.08, text: "你有没有「留了线索却总忘跟进」的活？" },
      { t: 50.2, end: 53.84, text: "评论说说，下条我把这套自动跟进拆给你。" }
    ];
    const sub = document.getElementById("sub");
    const tl = gsap.timeline();
    lines.forEach((line) => {
      tl.call(() => { sub.textContent = line.text; }, [], line.t);
      tl.fromTo(sub, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.16 }, line.t);
      tl.to(sub, { opacity: 0, duration: 0.16 }, line.end - 0.16);
    });
    tl.to({}, { duration: 0.05 }, 55.42);
    registerTimeline(tl);

    // 截帧去重钩子 · 可见像素完全由 文字 + opacity + transform 决定。
    // opacity≈0(8bit alpha 取整为 0)的帧一律是全透明 → 归一为 "blank"。
    // key 相同 → capture_frames.py 硬链复用上一张,像素一致。
    window.__contentKey = function () {
      const cs = getComputedStyle(sub);
      if (parseFloat(cs.opacity) <= 0.001) return "blank";
      return sub.textContent + "|" + cs.opacity + "|" + cs.transform;
    };
  </script>
</body>
</html>

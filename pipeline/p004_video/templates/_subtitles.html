<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Subtitle Overlay</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    /* 强制透明背景 — 与所有内容场景隔离 */
    html, body, .canvas { background: transparent !important; }

    .sub-line {
      position: absolute;
      left: 60px;
      right: 60px;
      bottom: 320px;
      text-align: center;
      font-family: var(--sans);
      font-weight: 900;
      font-size: 56px;
      line-height: 1.35;
      color: #fff;
      letter-spacing: 1px;
      /* 厚黑描边 + 强阴影,任何背景上都能读 */
      text-shadow:
        -4px -4px 0 #000, 4px -4px 0 #000,
        -4px 4px 0 #000, 4px 4px 0 #000,
        -4px 0 0 #000, 4px 0 0 #000,
        0 -4px 0 #000, 0 4px 0 #000,
        0 0 24px rgba(0, 0, 0, 0.95);
      opacity: 0;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="sub-line" id="sub"></div>
  </div>
  <script>
    // 字幕时序 · 与 sub_k1.srt 对齐(v2 定稿: 实体店老板 + VO 实际句界,总时长 38.0s)
    const lines = [
      { t: 1.21, end: 1.73, text: "又是这个" },
      { t: 2.09, end: 2.64, text: "问八百遍" },
      { t: 3.10, end: 5.79, text: "几点关门?还有没有货?能不能便宜?" },
      { t: 6.59, end: 8.33, text: "一天一百条,没一句新的。" },
      { t: 8.94, end: 10.74, text: "让员工回?他比你还烦。" },
      { t: 11.28, end: 14.55, text: "我干的活,就是把这种烦事,做成自己跑的小系统。" },
      { t: 15.23, end: 17.32, text: "你正在看的这条视频,就是它做的。" },
      { t: 17.88, end: 21.08, text: "我打了一句话扔进去,自动出图、配音、字幕。" },
      { t: 21.56, end: 24.73, text: "10 分钟。单条 2 块。剪辑没碰。" },
      { t: 25.12, end: 29.34, text: "从 9 个长到 15 个角色,每多一个,少一件烦事。" },
      { t: 30.19, end: 33.08, text: "你那个第 800 遍的活是什么?评论区扔过来。" },
    ];

    const sub = document.getElementById("sub");
    const tl = gsap.timeline();

    lines.forEach((line) => {
      tl.call(() => { sub.textContent = line.text; }, [], line.t);
      tl.fromTo(sub,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.18 },
        line.t);
      tl.to(sub, { opacity: 0, duration: 0.18 }, line.end - 0.18);
    });

    // 确保 timeline 覆盖全片 38.0s
    tl.to({}, { duration: 0.05 }, 38.0);

    registerTimeline(tl);
  </script>
</body>
</html>

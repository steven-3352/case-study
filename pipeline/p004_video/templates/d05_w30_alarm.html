<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../shared/w30_d05.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>.clamp{position:absolute;top:380px;left:65px;right:65px;height:700px;border:10px solid #161616;background:#fff}.jaw{position:absolute;left:0;right:0;height:120px}.jaw.top{top:0}.jaw.bottom{bottom:0}.pair{position:absolute;left:70px;right:70px;top:230px;display:grid;grid-template-columns:1fr 1fr;gap:35px}.fact{height:250px;border:5px solid #161616;padding:45px 28px;font-size:48px;font-weight:950;display:grid;place-items:center;text-align:center}.mainstamp{position:absolute;top:760px;left:220px;right:220px;text-align:center}</style></head><body><div class="canvas"><div class="d5-kicker">QA 报警</div><div class="d5-title">文件在，不等于入口能读</div><div class="clamp"><div class="jaw top hazard"></div><div class="pair"><div class="fact" id="top"></div><div class="fact" id="bottom"></div></div><div class="jaw bottom hazard"></div></div><div class="mainstamp stamp" id="stamp"></div><div class="subtitle" id="subtitle"></div></div><script>const d=getData(),D=+d.scene_duration||3;top.textContent=d.top;bottom.textContent=d.bottom;stamp.textContent=d.stamp;subtitle.textContent=d.subtitle||'';const tl=gsap.timeline({paused:true}).from('.clamp',{scale:.9,autoAlpha:0,duration:.35}).from('.jaw.top',{y:-180,duration:.4},D*.12).from('.jaw.bottom',{y:180,duration:.4},D*.12).from('.fact',{scale:.7,autoAlpha:0,duration:.3,stagger:D*.12},D*.3).from('.mainstamp',{scale:2.2,autoAlpha:0,duration:.3},D*.62).to('.jaw.top',{y:12,duration:.25},D*.82).to('.jaw.bottom',{y:-12,duration:.25},D*.82).to({},{duration:D},0);registerTimeline(tl)</script></body></html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D04 Hook Count</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    .stack {
      position: absolute;
      left: 0;
      right: 0;
      top: 420px;
      text-align: center;
    }
    .line {
      font-family: var(--mono);
      font-weight: 900;
      opacity: 0;
      line-height: 1;
    }
    .line.big {
      font-size: 180px;
      color: var(--red);
      letter-spacing: -6px;
    }
    .line.mid {
      font-size: 72px;
      color: var(--gray-2);
      margin-top: 24px;
    }
    .slash {
      display: inline-block;
      color: var(--gray-3);
      margin: 0 16px;
    }
    .kicker {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 520px;
      text-align: center;
      font-size: 44px;
      font-weight: 800;
      color: var(--orange);
      opacity: 0;
      padding: 0 60px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="stack">
      <div class="line big" id="n1">312</div>
      <div class="line mid" id="n2"><span id="a">48</span><span class="slash">→</span><span id="b">11</span></div>
    </div>
    <div class="kicker" id="kicker">今天该触达 · 只发出 11 条</div>
  </div>
  <script>
    const data = window.getData();
    if (data.total) document.getElementById("n1").textContent = data.total;
    if (data.target) document.getElementById("a").textContent = data.target;
    if (data.sent) document.getElementById("b").textContent = data.sent;
    if (data.kicker) document.getElementById("kicker").textContent = data.kicker;

    const tl = gsap.timeline();
    tl.fromTo("#n1", { opacity: 0, scale: 0.6, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, 0);
    tl.fromTo("#n2", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.35);
    tl.fromTo("#b", { color: "#fff", backgroundColor: "var(--red)", padding: "0 12px", borderRadius: "8px" },
      { duration: 0.2 }, 0.7);
    tl.to("#b", { scale: 1.15, duration: 0.15, yoyo: true, repeat: 3, ease: "rough({ strength: 2 })" }, 0.85);
    tl.fromTo("#kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, 1.0);
    tl.to({}, { duration: 0.4 }, 1.5);
    registerTimeline(tl);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  html,body{background:transparent!important;margin:0;width:1080px;height:1920px;}
  .sub-line{position:absolute;left:50px;right:50px;bottom:130px;text-align:center;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-weight:900;
    font-size:48px;line-height:1.35;color:#fff;letter-spacing:1px;opacity:0;
    text-shadow:-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,4px 4px 0 #000,-4px 0 0 #000,4px 0 0 #000,0 -4px 0 #000,0 4px 0 #000,0 0 24px rgba(0,0,0,.95);}
</style></head>
<body><div class="sub-line" id="sub"></div>
<script>
  const lines=[
    {t:0.2,end:3.3,text:"散会了，同事还在写纪要，我直接走了"},
    {t:3.3,end:7.2,text:"不是我摆烂——纪要和待办，群里早自动发好了"},
    {t:11.0,end:15.0,text:"我那套系统全程在听，散会就出结构化纪要"},
    {t:15.0,end:19.2,text:"每条待办谁负责、什么时候交，自动@到人、到期提醒"},
    {t:19.2,end:22.0,text:"我把它干活的样子做出来给你看"},
    {t:22.0,end:26.6,text:"开完会最烦的不是会，是会后熬夜整理、追进度"},
    {t:26.6,end:30.5,text:"现在我只管讨论拍板，记录追办交给它"},
    {t:30.5,end:34.6,text:"你们公司开会，纪要是谁在整理？"},
    {t:34.6,end:39.8,text:"是不是最烦的活？评论区说说，下条我真做给你看"},
  ];
  const sub=document.getElementById("sub");const tl=gsap.timeline();
  lines.forEach(l=>{tl.call(()=>{sub.textContent=l.text;},[],l.t);
    tl.fromTo(sub,{opacity:0,y:8},{opacity:1,y:0,duration:.18},l.t);
    tl.to(sub,{opacity:0,duration:.18},l.end-0.18);});
  tl.to({},{duration:.05},40.0); registerTimeline(tl);
</script></body></html>

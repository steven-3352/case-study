<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --red:#e5484d; --ink:#e6edf3; }
  html,body{ width:1080px; height:1920px; overflow:hidden; background:#06080c;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px; background:#06080c; }
  .film{ position:absolute; left:40px; right:40px; top:210px; height:1180px;
    border:5px solid var(--red); border-radius:20px; overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 60px rgba(229,72,77,.2); }
  .slide{ position:absolute; inset:0; background-size:cover; background-position:center top; opacity:0; }
  .vignette{ position:absolute; inset:0; box-shadow:inset 0 0 120px rgba(6,8,12,.55); pointer-events:none; }
  .label{ position:absolute; left:0; top:0; background:var(--red); color:#fff;
    font-size:30px; font-weight:800; padding:12px 26px; border-radius:0 0 16px 0;
    font-family:"SF Mono",monospace; letter-spacing:1px; opacity:0; }

  .banner{ position:absolute; left:40px; right:40px; top:130px; text-align:center;
    font-size:40px; font-weight:900; color:#fff; opacity:0; }
  .banner b{ color:var(--red); }
  .pathtag{ position:absolute; left:40px; right:40px; top:1410px; text-align:center;
    font-family:"SF Mono",monospace; font-size:36px; color:var(--red); font-weight:700; opacity:0; }
  .pathtag .box{ border:2px solid var(--red); border-radius:12px; padding:10px 22px; display:inline-block;
    background:rgba(229,72,77,.08); }

  .stampzone{ position:absolute; right:70px; top:1120px; width:300px; height:300px; }
  .stamp{ position:absolute; inset:0; transform-origin:center;
    border:11px solid var(--red); color:var(--red); border-radius:50%;
    display:grid; place-items:center; text-align:center; font-size:62px; font-weight:900;
    line-height:1.08; background:rgba(6,8,12,.55); opacity:0; }
  .stamp small{ display:block; font-size:26px; letter-spacing:3px; margin-top:8px; font-family:"SF Mono",monospace; }
  .ink{ position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; background:var(--red); border-radius:50%; opacity:0; }

  .caption{ position:absolute; left:52px; right:52px; bottom:130px;
    font-size:82px; font-weight:900; line-height:1.18; letter-spacing:1px;
    text-shadow:0 4px 24px rgba(0,0,0,.85); opacity:0; }
  .caption b{ color:var(--red); }
</style>

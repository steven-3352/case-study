<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP06 s3 · ①修 摘要贴脸</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 55% at 50% 34%, rgba(63,185,80,.07), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.82) 0%, rgba(6,9,14,.6) 34%, rgba(6,9,14,.58) 60%, rgba(6,9,14,.9) 88%, rgba(6,9,14,.97) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .tag{ position:absolute; left:0; right:0; top:420px; text-align:center; opacity:0; }
  .tag .badge{ display:inline-flex; align-items:center; gap:18px; font-size:52px; font-weight:900; color:#04110a;
    background:var(--green); border-radius:20px; padding:20px 44px; box-shadow:0 20px 56px rgba(63,185,80,.35); }
  .tag .badge .ck{ display:inline-grid; place-items:center; width:56px; height:56px; border-radius:50%;
    background:#04110a; color:var(--green); font-size:40px; }

  .hero{ position:absolute; left:64px; right:64px; top:620px; text-align:center;
    font-size:118px; font-weight:900; line-height:1.12; letter-spacing:2px; opacity:0;
    text-shadow:0 6px 30px rgba(0,0,0,.85); }
  .hero b{ color:var(--green); }

  /* before → after 小对比 */
  .cmp{ position:absolute; left:90px; right:90px; top:960px; display:flex; gap:26px; align-items:stretch; }
  .card{ flex:1; border-radius:20px; padding:30px 28px; opacity:0; box-shadow:0 18px 46px rgba(0,0,0,.5); }
  .card .h{ font-size:34px; font-weight:900; font-family:"SF Mono",monospace; margin-bottom:16px; }
  .card .b{ font-size:40px; font-weight:800; line-height:1.32; }
  .before{ background:rgba(26,18,15,.92); border:2px solid rgba(229,72,77,.45); }
  .before .h{ color:var(--red); } .before .b{ color:#c9d1d9; }
  .after{ background:rgba(13,25,17,.94); border:2px solid rgba(63,185,80,.55); }
  .after .h{ color:var(--green); } .after .b{ color:#fff; }
  .arrow{ position:absolute; left:0; right:0; top:1180px; text-align:center; font-size:60px; color:var(--green); opacity:0; }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="tag" id="tag"><span class="badge"><span class="ck">✓</span>① 修 · 一句话</span></div>
    <div class="hero" id="hero">摘要,<b>贴脸上</b></div>
    <div class="cmp">
      <div class="card before" id="before"><div class="h">✗ 之前</div><div class="b">置闸让我<br>“去别处找”</div></div>
      <div class="card after" id="after"><div class="h">✓ 现在</div><div class="b">摘要直接<br>怼到眼前</div></div>
    </div>
    <div class="arrow" id="arrow">别让我 · 去别处找</div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.fromTo("#tag", { opacity:0, y:16, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.45, ease:"back.out(1.6)" }, 0.2);
  // "把摘要贴脸上" 大字砸出
  tl.fromTo("#hero", { opacity:0, scale:0.86, y:22 }, { opacity:1, scale:1, y:0, duration:0.5, ease:"back.out(1.5)" }, 1.2);
  tl.fromTo("#hero b", { scale:1.7 }, { scale:1, duration:0.4, ease:"back.out(3)", transformOrigin:"center" }, 1.65);
  // before / after 对比
  tl.fromTo("#before", { opacity:0, x:-26 }, { opacity:1, x:0, duration:0.45, ease:"back.out(1.4)" }, 2.6);
  tl.fromTo("#after", { opacity:0, x:26 }, { opacity:1, x:0, duration:0.45, ease:"back.out(1.4)" }, 3.2);
  tl.to("#after", { boxShadow:"0 18px 46px rgba(0,0,0,.5),0 0 44px rgba(63,185,80,.35)", duration:0.5, yoyo:true, repeat:1 }, 3.8);
  // "别让我去别处找"
  tl.fromTo("#arrow", { opacity:0, y:14 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 4.3);
  tl.to({}, { duration:1.0 }, 6.0);
  registerTimeline(tl);
</script>
</body>
</html>

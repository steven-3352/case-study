<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>W30D01 首句差异</title><link rel="stylesheet" href="../shared/w30_evidence.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>
.prompt{position:absolute;left:60px;right:60px;top:100px;text-align:center;font-size:51px;font-weight:950;color:var(--red)}.split{position:absolute;left:55px;right:55px;top:310px;height:970px;display:grid;grid-template-columns:1fr 1fr;gap:25px}.side{position:relative;padding:42px 36px;border:3px solid var(--line);background:var(--surface)}.side.right{border-color:var(--red);background:#fff4f1}.side h2{font-size:42px;line-height:1.25;margin:0 0 45px}.stack{display:grid;gap:20px}.risk{padding:25px 22px;border-left:7px solid var(--line);background:#eeeae1;font-size:29px;line-height:1.35}.first{padding:42px 28px;border:4px solid var(--red);font-size:43px;line-height:1.34;font-weight:950;color:var(--red)}.same{position:absolute;left:50%;top:1340px;transform:translateX(-50%);white-space:nowrap;font-size:27px;color:var(--muted)}

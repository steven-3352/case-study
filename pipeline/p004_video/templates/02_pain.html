<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>02 Pain</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    body { background: #0a0e14; }

    .bulb-stage {
      position: absolute;
      left: 0;
      right: 0;
      top: 500px;
      height: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bulb {
      font-size: 360px;
      filter: drop-shadow(0 0 60px rgba(255, 184, 108, 0.6));
      transform-origin: center center;
    }
    .gear {
      position: absolute;
      font-size: 120px;
      opacity: 0;
      filter: drop-shadow(0 0 20px rgba(80, 250, 123, 0.4));
    }
    .gear.g1 { left: 240px; top: 80px; }
    .gear.g2 { right: 220px; top: 140px; }
    .gear.g3 { left: 460px; bottom: 60px; }

    .pain-lead {
      position: absolute;
      left: 0;
      right: 0;
      top: 1140px;
      text-align: center;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 64px;
      color: var(--gray-1);
      opacity: 0;
      padding: 0 80px;
    }
    .pain-kicker {
      position: absolute;
      left: 0;
      right: 0;
      top: 1260px;
      text-align: center;
      font-family: var(--sans);
      font-weight: 900;
      font-size: 130px;
      color: var(--red);
      opacity: 0;
      letter-spacing: 6px;
    }
    .pain-extra {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 540px;
      text-align: center;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 48px;
      color: var(--gray-2);
      opacity: 0;
      letter-spacing: 4px;
    }
    .strikethrough {
      position: relative;
    }
    .strikethrough::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 6px;
      background: var(--red);
      transform: scaleX(0);
      transform-origin: left;
    }
  </style>
</head>
<body>
  <div class="canvas">

    <div class="bulb-stage">
      <div class="bulb" id="bulb">💡</div>
      <div class="gear g1" id="g1">⚙️</div>
      <div class="gear g2" id="g2">⚙️</div>
      <div class="gear g3" id="g3">⚙️</div>
    </div>

    <div class="pain-lead" id="lead">一个想法从冒出来到放弃</div>
    <div class="pain-kicker" id="kicker">只要 3 天</div>
    <div class="pain-extra" id="extra">没团队 · 没钱 · 没时间</div>

  </div>

  <script>
    const data = window.getData();
    document.getElementById("lead").textContent = data.pain_lead || "一个想法从冒出来到放弃";
    document.getElementById("kicker").textContent = data.pain_kicker || "只要 3 天";
    document.getElementById("extra").textContent = data.pain_extra || "没团队 · 没钱 · 没时间";

    const tl = gsap.timeline();

    // 0 - 1.0s · 灯泡飘入 + 漂浮
    tl.fromTo("#bulb",
      { y: -80, opacity: 0, scale: 0.6 },
      { y: 0, opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.4)" }, 0);
    tl.to("#bulb", { y: -20, duration: 1.0, ease: "sine.inOut", repeat: 1, yoyo: true }, 0.8);

    // 0.6 - 1.5s · 文字 lead 淡入
    tl.to("#lead", { opacity: 1, duration: 0.5 }, 0.8);

    // 1.5 - 3.0s · 齿轮逐个出现并旋转(代表"被加工/试过/没成")
    tl.fromTo("#g1", { opacity: 0, scale: 0, rotation: 0 },
              { opacity: 0.9, scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.5);
    tl.to("#g1", { rotation: 360, duration: 2.5, ease: "none", repeat: -1 }, 1.5);

    tl.fromTo("#g2", { opacity: 0, scale: 0, rotation: 0 },
              { opacity: 0.9, scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.8);
    tl.to("#g2", { rotation: -360, duration: 3.0, ease: "none", repeat: -1 }, 1.8);

    tl.fromTo("#g3", { opacity: 0, scale: 0, rotation: 0 },
              { opacity: 0.9, scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.1);
    tl.to("#g3", { rotation: 360, duration: 2.0, ease: "none", repeat: -1 }, 2.1);

    // 4.5s · 灯泡变暗 + 缩小 + 偏灰
    tl.to("#bulb", {
      opacity: 0.3, scale: 0.7, filter: "grayscale(1) brightness(0.4)", duration: 0.5
    }, 4.5);

    // 5.0s · "只要 3 天" 红色钉死
    tl.fromTo("#kicker",
      { opacity: 0, scale: 1.3 },
      { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)" }, 5.0);

    // 5.6s · 齿轮淡出
    tl.to([".gear"], { opacity: 0, duration: 0.4 }, 5.6);

    // 6.0s · "没团队·没钱·没时间" 三段闪入
    tl.fromTo("#extra",
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.4 }, 6.0);

    // 锁尾
    tl.to({}, { duration: 1.0 }, 6.5);

    registerTimeline(tl);
  </script>
</body>
</html>

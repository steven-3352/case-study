<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP04 s2 · 三个头儿</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.78),rgba(6,9,14,.62) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .heads{position:absolute;left:52px;right:52px;top:340px;display:flex;flex-direction:column;gap:26px}
  .head{opacity:0;background:rgba(19,26,22,.92);border:2px solid rgba(63,185,80,.4);border-radius:20px;padding:30px 34px;display:flex;align-items:center;gap:26px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .head .ic{font-size:70px;flex:none}
  .head .txt .n{font-size:52px;font-weight:900;color:var(--green)}
  .head .txt .d{font-size:34px;color:var(--muted);margin-top:6px}
  .head .sub{margin-left:auto;font-size:28px;color:var(--amber);font-family:"SF Mono",monospace;text-align:right;opacity:0}
  .caption{position:absolute;left:52px;right:52px;bottom:200px;font-size:76px;font-weight:900;line-height:1.2;letter-spacing:1px;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--green)}
  .caption .sub2{display:block;font-size:44px;font-weight:700;color:var(--muted);margin-top:16px}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="heads">
      <div class="head" id="h1"><div class="ic">🧭</div><div class="txt"><div class="n">参谋长</div><div class="d">我是谁 · 往哪走</div></div><div class="sub" id="s1">↳ 家规·教练·孵化器</div></div>
      <div class="head" id="h2"><div class="ic">🗂️</div><div class="txt"><div class="n">前台</div><div class="d">指路 + 记录/归档/体检</div></div><div class="sub" id="s2">↳ 史官·档案·门卫</div></div>
      <div class="head" id="h3"><div class="ic">📋</div><div class="txt"><div class="n">项目经理</div><div class="d">在办项目 · 派活</div></div><div class="sub" id="s3">↳ 研究员·建筑师·军械库</div></div>
    </div>
    <div class="caption" id="cap">我只跟 <b>3 个头儿</b> 说话<span class="sub2">他们自动联动下级 · 不用我记谁管谁</span></div>
  </div>
<script>
  const tl=gsap.timeline();
  ["#h1","#h2","#h3"].forEach((h,i)=>{
    tl.fromTo(h,{opacity:0,x:-30},{opacity:1,x:0,duration:.45,ease:"back.out(1.5)"},0.4+i*0.55);
    tl.fromTo("#s"+(i+1),{opacity:0,x:14},{opacity:1,x:0,duration:.4,ease:"power2.out"},1.0+i*0.55);
  });
  tl.fromTo("#cap",{opacity:0,y:28},{opacity:1,y:0,duration:.5,ease:"power3.out"},3.2);
  tl.to({},{duration:1.6},4.4);
  registerTimeline(tl);
</script></body></html>

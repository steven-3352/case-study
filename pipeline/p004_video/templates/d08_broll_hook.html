<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D08 B-roll Hook</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    html, body { background: #0b0b0b; }
    .photo {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      transform: scale(1.08); filter: saturate(.96) contrast(1.05);
    }
    .shade {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.24) 34%, rgba(0,0,0,.78) 100%);
    }
    .source {
      position: absolute; left: 54px; top: 210px; padding: 14px 20px; border-radius: 999px;
      background: rgba(255,255,255,.16); color: rgba(255,255,255,.82); backdrop-filter: blur(12px);
      font-family: var(--mono); font-size: 24px; letter-spacing: 2px; opacity: 0;
    }
    .headline {
      position: absolute; left: 58px; right: 58px; bottom: 520px;
      font-size: 104px; line-height: 1.06; font-weight: 950; color: white; letter-spacing: 0;
      text-shadow: 0 8px 36px rgba(0,0,0,.65); opacity: 0;
    }
    .headline span { color: #facc15; }
    .sub {
      position: absolute; left: 62px; right: 62px; bottom: 390px;
      font-size: 48px; line-height: 1.2; font-weight: 850; color: white; opacity: 0;
      text-shadow: 0 6px 26px rgba(0,0,0,.7);
    }
    .pulse {
      position: absolute; right: 60px; bottom: 355px; width: 34px; height: 34px; border-radius: 50%;
      background: #ef4444; box-shadow: 0 0 0 0 rgba(239,68,68,.55); opacity: 0;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="photo" id="photo"></div>
    <div class="shade"></div>
    <div class="source" id="source">REAL SHOP MOMENT</div>
    <div class="headline" id="headline">私域不是<br><span>多发消息</span></div>
    <div class="sub" id="sub">是每天有客户节点会漏</div>
    <div class="pulse" id="pulse"></div>
  </div>
  <script>
    const data = window.getData();
    document.getElementById("photo").style.backgroundImage = `url('${data.image || "../../../assets/broll/d08_private_domain_chaos_cover.png"}')`;
    if (data.headline) document.getElementById("headline").innerHTML = data.headline.replace("多发消息", "<br><span>多发消息</span>");
    if (data.sub) document.getElementById("sub").textContent = data.sub;
    const tl = gsap.timeline();
    tl.to("#photo", { scale: 1.0, duration: 4.0, ease: "none" }, 0);
    tl.fromTo("#source", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: .35 }, .15);
    tl.fromTo("#headline", { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: .55, ease: "power3.out" }, .45);
    tl.fromTo("#sub", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: .38 }, 1.2);
    tl.fromTo("#pulse", { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: .25 }, 1.5);
    tl.to("#pulse", { boxShadow: "0 0 0 38px rgba(239,68,68,0)", duration: .9, repeat: 2, ease: "power1.out" }, 1.55);
    tl.to({}, { duration: .7 }, 3.2);
    registerTimeline(tl);
  </script>
</body>
</html>

<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>D09 Table Example</title><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>
body{margin:0;width:1080px;height:1920px;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overflow:hidden}.title{position:absolute;top:130px;left:76px;font-size:72px;line-height:1.1;font-weight:950}.panel{position:absolute;left:70px;right:70px;border-radius:34px;background:#fff;border:3px solid #dbe3ef;box-shadow:0 22px 60px rgba(15,23,42,.08);padding:30px;opacity:0}.before{top:390px}.after{top:980px}.tag{font-size:32px;font-weight:900;color:#64748b}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.cell{height:86px;border-radius:18px;background:#eef2ff;display:flex;align-items:center;padding:0 22px;font-size:34px;font-weight:800}.after .cell{background:#dcfce7}.arrow{position:absolute;top:840px;left:0;right:0;text-align:center;font-size:86px;font-weight:950;color:#2563eb;opacity:0}
</style></head><body><div class="title">比如：<br>客户表格</div><div class="panel before"><div class="tag">原始表格</div><div class="row"><div class="cell">姓名</div><div class="cell">微信</div><div class="cell">购买日</div><div class="cell">备注乱写</div></div></div><div class="arrow">↓</div><div class="panel after"><div class="tag">想要结果</div><div class="row"><div class="cell">客户</div><div class="cell">状态</div><div class="cell">跟进日</div><div class="cell">下一步</div></div></div><script>const tl=gsap.timeline();tl.fromTo(".title",{opacity:0,y:30},{opacity:1,y:0,duration:.4},0);tl.fromTo(".before",{x:-40},{opacity:1,x:0,duration:.45},.6);tl.to(".arrow",{opacity:1,duration:.25},1.7);tl.fromTo(".after",{x:40},{opacity:1,x:0,duration:.45},2.1);tl.to({}, {duration:5.5},2.5);registerTimeline(tl);</script></body></html>

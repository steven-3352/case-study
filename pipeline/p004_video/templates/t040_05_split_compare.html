<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  :root{
    --canvas:#faf9f6; --surface:#eeece5; --ink:#1c1e22; --muted:#767b85; --accent:#c0392b;
    --font:"SF Pro Text","Source Han Sans SC","PingFang SC",sans-serif;
  }
  body{background:var(--canvas);}
  .canvas{background:var(--canvas);}
  .panel{position:absolute;top:280px;bottom:480px;width:480px;background:var(--surface);
    border-radius:16px;overflow:hidden;opacity:0;box-shadow:0 4px 20px rgba(28,30,34,.08);}
  .panel.left{left:60px;transform:translateX(-40px);}
  .panel.right{right:60px;transform:translateX(40px);}
  .divider{position:absolute;top:280px;bottom:480px;left:50%;width:1px;background:rgba(28,30,34,.10);
    transform:translateX(-0.5px);opacity:0;}
  #recap{width:100%;height:100%;object-fit:cover;filter:grayscale(1);display:none;}
  .recap-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:20px;color:var(--muted);font-family:var(--font);text-align:center;padding:0 32px;}
  .recap-fallback .lbl{font-size:24px;}
  .recap-tag{position:absolute;left:20px;top:20px;background:rgba(28,30,34,.55);color:#faf9f6;
    font-family:var(--font);font-size:20px;padding:6px 14px;border-radius:8px;z-index:2;}
  .right-inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;padding:56px 40px;text-align:center;}
  .example-label{font-family:var(--font);font-size:22px;color:var(--muted);margin-bottom:32px;}
  .quote-box{position:relative;padding:20px;}
  .quote{font-family:var(--font);font-weight:800;font-size:72px;line-height:1.25;color:var(--ink);}
  .quote-border{position:absolute;inset:0;border:3px solid var(--accent);border-radius:12px;opacity:0;}
</style></head>
<body>
<div class="canvas">
  <div class="panel left" id="panelL">
    <div class="recap-tag">之前</div>
    <video id="recap" muted playsinline></video>
    <div class="recap-fallback" id="recapFallback">
      <div class="lbl">回顾·长文滚动急停画面(缩略/4x/灰度)</div>
    </div>
  </div>
  <div class="divider" id="divider"></div>
  <div class="panel right" id="panelR">
    <div class="right-inner">
      <div class="example-label">举个例子 · 虚构计划</div>
      <div class="quote-box">
        <div class="quote">你要卖的能力,自己根本没验证过</div>
        <div class="quote-border" id="qborder"></div>
      </div>
    </div>
  </div>
</div>
<script>
  const data = window.getData();
  const vid = document.getElementById("recap");
  const fallback = document.getElementById("recapFallback");
  let vidReady = false;
  // 依赖02场景渲染产出的mp4(motion_tech_plan §动效3渲染顺序依赖:02先出片,05才能引用)
  // 02尚未assemble成mp4前,src加载失败会走fallback静态占位,不报JS错误
  const srcRel = (data && data.left_recap_video_rel) || "../out/scene_video/02_reveal_scroll.mp4";
  vid.src = srcRel;
  vid.addEventListener("loadedmetadata", () => { vidReady = true; vid.style.display = "block"; });
  vid.addEventListener("error", () => { fallback.style.display = "flex"; });

  const tl = gsap.timeline({paused:true});
  // 0-2s 分屏组件初现,左右面板同时滑入
  tl.to("#panelL", {opacity:1, x:0, duration:.4, ease:"power2.out"}, 0);
  tl.to("#panelR", {opacity:1, x:0, duration:.4, ease:"power2.out"}, 0);
  tl.to("#divider", {opacity:1, duration:.4}, 0.1);
  // 2-5s 左侧4x加速回放+灰度(时间戳同步见下方 __renderFrame 包装)
  tl.to({}, {duration:3}, 2);
  // 5-8s 右侧金句放大+accent描边框
  tl.fromTo("#qborder", {opacity:0}, {opacity:1, duration:.5}, 5);
  tl.to({}, {duration:2.5}, 5.5);
  registerTimeline(tl);

  // 包装 __renderFrame:在原有 seek 基础上同步左侧回顾视频的 currentTime(4x播放)
  const _origRenderFrame = window.__renderFrame;
  window.__renderFrame = function (t) {
    _origRenderFrame(t);
    if (vidReady && t >= 2 && t <= 5) {
      vid.currentTime = Math.min((t - 2) * 4, vid.duration || 0);
    }
  };
</script>
</body></html>

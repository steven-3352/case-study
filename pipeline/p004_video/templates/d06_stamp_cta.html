<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D06 Stamp CTA</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #f4efe6;
      font-family: "PingFang SC", "Source Han Sans CN", -apple-system, sans-serif;
      color: #2c2416;
    }
    .canvas {
      position: relative; width: 1080px; height: 1920px; overflow: hidden;
      background: linear-gradient(180deg, #f4efe6 0%, #ebe4d8 100%);
    }
    .doc {
      position: absolute; left: 80px; right: 80px; top: 360px; bottom: 480px;
      background: #faf7f2; border: 1px solid #d4cfc4;
      box-shadow: 0 8px 32px rgba(44,36,22,0.1);
      padding: 48px 40px;
      opacity: 0;
    }
    .doc-head {
      font-size: 32px; color: #8b7355; border-bottom: 2px solid #ddd8cc;
      padding-bottom: 20px; margin-bottom: 32px; letter-spacing: 2px;
    }
    .stat-line {
      font-family: "Courier New", monospace; font-size: 36px; color: #3d3528;
      line-height: 1.8; opacity: 0;
    }
    .stat-line .num { color: #c62828; font-weight: 900; font-size: 44px; }
    .stamp-wrap {
      position: absolute; left: 50%; top: 620px;
      transform: translateX(-50%);
      z-index: 10;
    }
    .stamp {
      border: 10px solid #c62828; color: #c62828;
      font-size: 72px; font-weight: 900; letter-spacing: 6px;
      padding: 20px 36px; border-radius: 12px;
      transform: rotate(-6deg) scale(3);
      opacity: 0;
      mix-blend-mode: multiply;
      background: rgba(198,40,40,0.06);
      white-space: nowrap;
    }
    .stamp-ghost {
      position: absolute; inset: -20px;
      border: 3px dashed rgba(198,40,40,0.2); border-radius: 16px;
      opacity: 0;
    }
    .cta-block {
      position: absolute; left: 0; right: 0; bottom: 520px;
      text-align: center; opacity: 0; padding: 0 60px;
    }
    .cta-main {
      font-size: 56px; font-weight: 900; color: #2c2416;
      line-height: 1.3; margin-bottom: 20px;
    }
    .cta-main .hl { color: #c62828; }
    .cta-sub {
      font-size: 38px; font-weight: 600; color: #6b6355;
      line-height: 1.4;
    }
    .ink-splat {
      position: absolute; width: 120px; height: 120px;
      border-radius: 50% 40% 50% 45%;
      background: radial-gradient(ellipse, rgba(198,40,40,0.15) 0%, transparent 70%);
      opacity: 0;
    }
    .ink-splat.s1 { left: 120px; top: 580px; }
    .ink-splat.s2 { right: 100px; top: 720px; }
    .discuss-icon {
      position: absolute; left: 50%; bottom: 440px; transform: translateX(-50%);
      font-size: 64px; opacity: 0;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="doc" id="doc">
      <div class="doc-head">退货对账 · 结案备忘</div>
      <div class="stat-line" id="statLine">47笔退 · 3笔差异</div>
    </div>
    <div class="ink-splat s1" id="spl1"></div>
    <div class="ink-splat s2" id="spl2"></div>
    <div class="stamp-wrap">
      <div class="stamp-ghost" id="ghost"></div>
      <div class="stamp" id="stamp">对账噩梦?</div>
    </div>
    <div class="cta-block" id="cta">
      <div class="cta-main" id="ctaMain">差过多少钱<span class="hl">找不到</span>？</div>
      <div class="cta-sub" id="ctaSub">评论区说说你们的对账噩梦</div>
    </div>
    <div class="discuss-icon" id="icon">💬</div>
  </div>
  <script>
    const data = window.getData();
    if (data.stat_line) {
      const parts = data.stat_line.match(/(\d+)笔退.*?(\d+)笔差异/);
      if (parts) {
        document.getElementById("statLine").innerHTML =
          `<span class="num">${parts[1]}</span>笔退 · <span class="num">${parts[2]}</span>笔差异`;
      } else {
        document.getElementById("statLine").textContent = data.stat_line;
      }
    }
    if (data.cta_main) document.getElementById("ctaMain").textContent = data.cta_main;
    if (data.cta_sub) document.getElementById("ctaSub").textContent = data.cta_sub;

    const tl = gsap.timeline();
    tl.fromTo("#doc", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0);
    tl.to("#statLine", { opacity: 1, duration: 0.35 }, 0.3);
    tl.to("#ghost", { opacity: 1, duration: 0.2 }, 0.8);
    tl.fromTo("#stamp", {
      opacity: 0, scale: 4, rotation: -20, y: -60
    }, {
      opacity: 0.9, scale: 1, rotation: -6, y: 0,
      duration: 0.4, ease: "back.out(2.5)"
    }, 1.0);
    tl.to("#doc", { x: "+=5", duration: 0.04, repeat: 4, yoyo: true }, 1.05);
    tl.to("#spl1, #spl2", { opacity: 1, scale: 1.2, duration: 0.3 }, 1.2);
    tl.to("#stamp", { scale: 1.04, duration: 0.12, yoyo: true, repeat: 1 }, 1.6);
    tl.fromTo("#cta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.5);
    tl.fromTo("#icon", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 3.2);
    tl.to("#ctaMain", { color: "#c62828", duration: 0.2, yoyo: true, repeat: 1 }, 4.0);
    tl.to("#ctaSub", { letterSpacing: "2px", duration: 0.4 }, 4.5);
    tl.to({}, { duration: 1.8 }, 5.2);
    registerTimeline(tl);
  </script>
</body>
</html>

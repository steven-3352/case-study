<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D09 Wrong Prompt</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    body{margin:0;width:1080px;height:1920px;background:#0f172a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overflow:hidden;}
    .box{position:absolute;left:80px;right:80px;top:220px;height:360px;border-radius:36px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14);}
    .label{position:absolute;left:120px;top:270px;font-size:30px;color:#94a3b8;font-weight:700}
    .p{position:absolute;top:350px;left:120px;font-size:54px;font-weight:900}
    .line{position:absolute;left:130px;top:520px;width:820px;height:7px;background:#ef4444;transform:rotate(-8deg);opacity:0}
    .warn{position:absolute;left:90px;bottom:340px;font-size:78px;font-weight:950;line-height:1.04;opacity:0}
    .sub{position:absolute;left:92px;bottom:220px;font-size:36px;color:#cbd5e1;opacity:0}
  </style>
</head>
<body>
  <div class="box"></div><div class="label">错误开场</div><div class="p">帮我做个管理系统</div>
  <div class="line"></div><div class="warn">这句话<br>太大了</div><div class="sub">流程没讲清，Codex 也不知道从哪下手</div>
  <script>
    const tl = gsap.timeline();
    tl.fromTo(".box", {scale:.96, opacity:0}, {scale:1, opacity:1, duration:.35}, 0);
    tl.fromTo(".label,.p", {y:22, opacity:0}, {y:0, opacity:1, duration:.36, stagger:.12}, .2);
    tl.to(".line", {opacity:1, duration:.18}, 1.25);
    tl.fromTo(".warn", {y:40}, {opacity:1, y:0, duration:.5, ease:"back.out(1.4)"}, 1.55);
    tl.fromTo(".sub", {y:28}, {opacity:1, y:0, duration:.35}, 2.15);
    tl.to({}, {duration:3.1}, 2.9);
    registerTimeline(tl);
  </script>
</body>
</html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../shared/w30_d04.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>.record{position:absolute;top:350px;left:70px;width:400px;height:230px;font-size:38px;font-weight:900}.dest{position:absolute;top:740px;width:370px;height:260px;font-size:39px;font-weight:900}.desktop{left:70px;border-color:var(--d4-green)}.bot{right:70px;border-color:var(--d4-red)}.fork1{left:270px;top:620px;width:300px;transform:rotate(35deg)}.fork2{left:520px;top:620px;width:300px;transform:rotate(-35deg);background:var(--d4-red)}.break{position:absolute;left:770px;top:700px;font-size:100px;color:var(--d4-red);font-weight:950}</style></head><body><div class="canvas"><div class="d4-kicker">真实故障 · 同一项目记录</div><div class="d4-title">一个入口找得到，一个入口说没有</div><div class="record node file" id="record"></div><div class="path fork1"></div><div class="path fork2"></div><div class="dest desktop node" id="desktop"></div><div class="dest bot node" id="bot"></div><div class="break">×</div><div class="subtitle" id="subtitle"></div></div><script>const d=getData(),D=+d.scene_duration||5;record.textContent=d.record;desktop.textContent=d.desktop;bot.textContent=d.bot;subtitle.textContent=d.subtitle||'';const tl=gsap.timeline({paused:true}).from('.record',{y:-60,autoAlpha:0,duration:.35}).from('.path',{scaleX:0,duration:.6,stagger:.18},.4).from('.dest',{y:50,autoAlpha:0,duration:.35,stagger:.2},1).from('.break',{scale:3,autoAlpha:0,duration:.25},1.65).to('.fork2',{background:'#d64040',opacity:.25,duration:.35},Math.max(2.5,D-1.2)).to({},{duration:D},0);registerTimeline(tl)</script></body></html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP04 s2 · 灵光一闪 · 只对 3 个头儿说话</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 55% at 50% 44%, rgba(210,153,34,.08), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.8) 0%, rgba(6,9,14,.58) 34%, rgba(6,9,14,.56) 60%, rgba(6,9,14,.9) 88%, rgba(6,9,14,.97) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .bulb{ position:absolute; left:0; right:0; top:360px; text-align:center; font-size:120px; opacity:0; }
  .cross{ position:absolute; left:80px; right:80px; top:560px; text-align:center;
    font-size:52px; font-weight:800; color:var(--muted); opacity:0; }
  .cross s{ text-decoration:line-through; text-decoration-thickness:4px; text-decoration-color:var(--amber); }

  .rulecard{ position:absolute; left:90px; right:90px; top:760px;
    background:linear-gradient(135deg, rgba(63,185,80,.16), rgba(13,17,23,.94));
    border:2px solid var(--green); border-radius:30px; padding:52px 46px; text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 50px rgba(63,185,80,.12); opacity:0; }
  .rulecard .tag{ font-size:34px; font-weight:900; color:var(--green); letter-spacing:4px;
    font-family:"SF Mono",monospace; }
  .rulecard .say{ margin-top:28px; font-size:88px; font-weight:900; line-height:1.16; color:#fff;
    text-shadow:0 4px 22px rgba(0,0,0,.8); }
  .rulecard .say .three{ display:inline-block; color:var(--green); font-size:120px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="bulb" id="bulb">💡</div>
    <div class="cross" id="cross">与其 记 <s>“哪个文件放啥”</s></div>
    <div class="rulecard" id="rulecard">
      <div class="tag">立 一 条 死 规 矩</div>
      <div class="say">我只对 <span class="three" id="three">3</span> 个头儿说话</div>
    </div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.fromTo("#bulb", { opacity:0, scale:0.4, y:-14 }, { opacity:1, scale:1, y:0, duration:0.5, ease:"back.out(2.4)" }, 0.3);
  tl.to("#bulb", { textShadow:"0 0 40px rgba(210,153,34,.9)", scale:1.12, duration:0.45, yoyo:true, repeat:1, ease:"sine.inOut", transformOrigin:"center" }, 0.85);
  tl.fromTo("#cross", { opacity:0, y:14 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 1.5);
  // 立规矩卡砸实
  tl.fromTo("#rulecard", { opacity:0, y:30, scale:0.94 }, { opacity:1, y:0, scale:1, duration:0.55, ease:"back.out(1.5)" }, 4.2);
  tl.to("#cross", { opacity:0.35, duration:0.4 }, 4.3);
  tl.fromTo("#three", { scale:2.0 }, { scale:1, duration:0.45, ease:"back.out(3)", transformOrigin:"center" }, 5.6);
  tl.to("#rulecard", { boxShadow:"0 30px 80px rgba(0,0,0,.6), 0 0 70px rgba(63,185,80,.32)", duration:0.5, yoyo:true, repeat:1, ease:"sine.inOut" }, 5.7);
  tl.to("#three", { scale:1.12, duration:0.45, yoyo:true, repeat:2, ease:"sine.inOut", transformOrigin:"center" }, 6.7);
  tl.to({}, { duration:1.2 }, 9.0);
  registerTimeline(tl);
</script>
</body>
</html>

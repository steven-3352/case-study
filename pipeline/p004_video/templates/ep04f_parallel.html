<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP04 s6 · 平行独立仓库 · 只留门牌</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 55% at 50% 36%, rgba(63,185,80,.06), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.8) 0%, rgba(6,9,14,.6) 34%, rgba(6,9,14,.58) 60%, rgba(6,9,14,.9) 88%, rgba(6,9,14,.97) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .tag{ position:absolute; left:80px; right:80px; top:290px; text-align:center;
    font-size:38px; font-weight:900; color:var(--green); letter-spacing:3px;
    font-family:"SF Mono",monospace; opacity:0; }

  .brain{ position:absolute; left:120px; right:120px; top:390px;
    background:rgba(13,17,23,.92); border:2px solid #30363d; border-radius:26px; padding:34px 34px 30px;
    box-shadow:0 24px 60px rgba(0,0,0,.55); opacity:0; }
  .brain .hd{ font-size:46px; font-weight:900; color:#c9d1d9; text-align:center; }
  .brain .plates{ margin-top:24px; display:flex; gap:16px; justify-content:center; }
  .plate{ background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.45); border-radius:14px;
    padding:16px 20px; font-size:32px; font-weight:800; color:var(--amber); opacity:0;
    display:flex; align-items:center; gap:8px; }
  .brain .only{ margin-top:22px; text-align:center; font-size:30px; color:var(--muted); font-weight:700; }

  .divider{ position:absolute; left:80px; right:80px; top:770px; text-align:center;
    font-size:40px; font-weight:900; color:#c9d1d9; letter-spacing:1px; opacity:0; }
  .divider b{ color:var(--green); }

  .repos{ position:absolute; left:56px; right:56px; top:880px; display:flex; gap:20px; justify-content:center; }
  .repo{ flex:1; background:rgba(19,26,22,.9); border:2px solid rgba(63,185,80,.4); border-radius:20px;
    padding:26px 8px; text-align:center; opacity:0; box-shadow:0 16px 44px rgba(0,0,0,.5); }
  .repo .em{ font-size:56px; } .repo .nm{ font-size:32px; font-weight:900; color:var(--green); margin-top:8px; }
  .repo .tp{ font-size:26px; color:var(--muted); margin-top:4px; }

  .fore{ position:absolute; left:80px; right:80px; top:1230px; text-align:center;
    font-size:50px; font-weight:900; color:var(--amber); letter-spacing:1px; opacity:0;
    text-shadow:0 4px 20px rgba(0,0,0,.85); }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="tag" id="tag">// 边界 · 我给它写死了</div>
    <div class="brain" id="brain">
      <div class="hd">🧠 大脑 只留门牌</div>
      <div class="plates">
        <div class="plate" id="pl0">📛 项目A</div>
        <div class="plate" id="pl1">📛 项目B</div>
        <div class="plate" id="pl2">📛 项目C</div>
      </div>
      <div class="only">不塞正文 · 只留个门牌</div>
    </div>
    <div class="divider" id="divider">↓ 每个项目 <b>平行 · 独立 · 不嵌套</b></div>
    <div class="repos" id="repos">
      <div class="repo" id="rp0"><div class="em">📦</div><div class="nm">项目A</div><div class="tp">独立仓库</div></div>
      <div class="repo" id="rp1"><div class="em">📦</div><div class="nm">项目B</div><div class="tp">独立仓库</div></div>
      <div class="repo" id="rp2"><div class="em">📦</div><div class="nm">项目C</div><div class="tp">独立仓库</div></div>
    </div>
    <div class="fore" id="fore">记住这条 —— 后面救了我一命</div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.fromTo("#tag", { opacity:0, y:-12 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 0.3);
  tl.fromTo("#brain", { opacity:0, y:20, scale:0.95 }, { opacity:1, y:0, scale:1, duration:0.55, ease:"back.out(1.4)" }, 1.4);
  ["#pl0","#pl1","#pl2"].forEach((c,i)=>{
    tl.fromTo(c, { opacity:0, scale:0.7 }, { opacity:1, scale:1, duration:0.35, ease:"back.out(2.2)" }, 2.3 + i*0.28);
  });
  // 平行独立仓库滑入
  tl.fromTo("#divider", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 3.6);
  ["#rp0","#rp1","#rp2"].forEach((c,i)=>{
    tl.fromTo(c, { opacity:0, y:40, scale:0.92 }, { opacity:1, y:0, scale:1, duration:0.42, ease:"back.out(1.6)" }, 4.0 + i*0.35);
  });
  // 伏笔:后面救了我一命(克制的琥珀微光)
  tl.fromTo("#fore", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.6, ease:"power3.out" }, 8.6);
  tl.to("#fore", { textShadow:"0 0 26px rgba(210,153,34,.6)", duration:0.7, yoyo:true, repeat:1, ease:"sine.inOut" }, 9.4);
  tl.to({}, { duration:1.3 }, 12.9);
  registerTimeline(tl);
</script>
</body>
</html>

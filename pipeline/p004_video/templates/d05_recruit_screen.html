<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  body{background:#000;}
  /* 仿 BOSS 直聘 / 58 招聘列表(示意) */
  .app{position:absolute;top:140px;left:60px;right:60px;height:1500px;
    background:#f5f5f7;border-radius:32px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6);opacity:0;}
  .topbar{height:96px;background:#fff;display:flex;align-items:center;padding:0 28px;gap:18px;
    border-bottom:1px solid #ececec;}
  .topbar .back{font-size:36px;color:#1a1a1a;}
  .topbar .q{flex:1;background:#f3f3f5;border-radius:18px;padding:14px 22px;font-size:30px;
    color:#1a1a1a;display:flex;align-items:center;gap:12px;}
  .topbar .q .ic{color:#888;}
  .topbar .city{font-size:26px;color:#444;}
  .tabs{display:flex;background:#fff;padding:0 28px;gap:32px;border-bottom:1px solid #ececec;}
  .tabs .tab{padding:22px 0;font-size:28px;color:#888;}
  .tabs .tab.act{color:#1a1a1a;font-weight:700;border-bottom:4px solid #e53935;}
  .list{padding:20px 24px;display:flex;flex-direction:column;gap:18px;}
  .card{background:#fff;border-radius:18px;padding:24px 26px;box-shadow:0 4px 14px rgba(0,0,0,.05);
    position:relative;}
  .card.hi{border:4px solid #e53935;}
  .card .title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;}
  .card .title{font-size:38px;font-weight:800;color:#1a1a1a;}
  .card .salary{font-size:36px;font-weight:900;color:#e53935;}
  .card .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
  .card .tag{background:#f3f3f5;color:#555;font-size:24px;padding:6px 14px;border-radius:8px;}
  .card .biz{display:flex;align-items:center;gap:14px;margin-top:18px;font-size:26px;color:#666;}
  .card .biz .lg{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#ffd89b,#ffae5a);
    display:flex;align-items:center;justify-content:center;font-size:28px;}
  .hi-stamp{position:absolute;top:-18px;right:24px;background:#e53935;color:#fff;font-size:22px;
    padding:6px 14px;border-radius:8px;font-weight:800;letter-spacing:2px;opacity:0;}
  /* 黑色蒙层(底部大字上来后压暗列表) */
  .veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;}
  /* 底部大字 */
  .punch{position:absolute;left:40px;right:40px;top:1380px;text-align:center;}
  .punch .l1{font-size:108px;font-weight:900;color:#fff;line-height:1.15;letter-spacing:2px;opacity:0;
    text-shadow:0 6px 0 #000,0 18px 38px rgba(0,0,0,.85);}
  .punch .l2{font-size:130px;font-weight:900;color:var(--red);line-height:1.1;letter-spacing:4px;
    opacity:0;margin-top:18px;text-shadow:0 6px 0 #000,0 18px 38px rgba(0,0,0,.85);}
  .wm{position:absolute;top:1830px;right:40px;font-size:22px;color:var(--gray-3);opacity:.55;}
</style></head>
<body>
<div class="canvas">
  <div class="app" id="app">
    <div class="topbar">
      <div class="back">&lt;</div>
      <div class="q"><span class="ic">🔍</span>客服 · 餐饮零售</div>
      <div class="city">本地 ▾</div>
    </div>
    <div class="tabs">
      <div class="tab act">推荐</div>
      <div class="tab">最新</div>
      <div class="tab">附近</div>
      <div class="tab">高薪</div>
    </div>
    <div class="list">
      <div class="card hi" id="c1">
        <div class="hi-stamp" id="stamp">老板搜过</div>
        <div class="title-row">
          <div class="title">客服专员 · 微信回复</div>
          <div class="salary">4500-6000</div>
        </div>
        <div class="meta">
          <span class="tag">经验不限</span>
          <span class="tag">学历不限</span>
          <span class="tag">五险一金</span>
          <span class="tag">餐补</span>
        </div>
        <div class="biz"><span class="lg">M</span>某母婴连锁 · 门店运营部</div>
      </div>
      <div class="card" id="c2">
        <div class="title-row">
          <div class="title">店铺客服 · 在线回复</div>
          <div class="salary">4000-5500</div>
        </div>
        <div class="meta">
          <span class="tag">经验不限</span>
          <span class="tag">大专以上</span>
          <span class="tag">包午餐</span>
        </div>
        <div class="biz"><span class="lg">B</span>某餐饮品牌 · 总部</div>
      </div>
      <div class="card" id="c3">
        <div class="title-row">
          <div class="title">门店助理 · 含客户咨询</div>
          <div class="salary">3800-5200</div>
        </div>
        <div class="meta">
          <span class="tag">经验不限</span>
          <span class="tag">熟手优先</span>
        </div>
        <div class="biz"><span class="lg">J</span>某教培机构 · 校区</div>
      </div>
    </div>
  </div>
  <div class="veil" id="veil"></div>
  <div class="punch">
    <div class="l1" id="l1">我说,</div>
    <div class="l2" id="l2">先别招</div>
  </div>
  <div class="wm">招聘 APP 列表(示意 · 已脱敏)</div>
</div>
<script>
  const tl=gsap.timeline({paused:true});
  tl.to("#app",{opacity:1,duration:.25},0);
  tl.fromTo("#c1",{scale:.95,opacity:.4},{scale:1,opacity:1,duration:.4,ease:"power2.out"},.2);
  tl.fromTo("#stamp",{opacity:0,scale:.5},{opacity:1,scale:1,duration:.3,ease:"back.out(2)"},.45);
  tl.to("#veil",{opacity:.6,duration:.3},.7);
  tl.fromTo("#l1",{opacity:0,y:30},{opacity:1,y:0,duration:.35,ease:"power2.out"},.75);
  tl.fromTo("#l2",{opacity:0,y:40,scale:.85},{opacity:1,y:0,scale:1,duration:.5,ease:"back.out(1.6)"},1.05);
  tl.to({},{duration:.4},1.6);
  registerTimeline(tl);
</script>
</body></html>

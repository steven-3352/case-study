<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP06 s7 · 边界救命 · EP04那条边界</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 55% at 50% 34%, rgba(63,185,80,.06), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.84) 0%, rgba(6,9,14,.62) 34%, rgba(6,9,14,.6) 60%, rgba(6,9,14,.9) 88%, rgba(6,9,14,.97) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .tag{ position:absolute; left:0; right:0; top:300px; text-align:center; opacity:0; }
  .tag .badge{ display:inline-block; font-size:44px; font-weight:900; color:var(--amber); letter-spacing:2px;
    font-family:"SF Mono",monospace; background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.5);
    border-radius:16px; padding:14px 34px; }

  .repos{ position:absolute; left:70px; right:70px; top:420px; display:flex; gap:30px; align-items:stretch; justify-content:center; }
  .repo{ flex:1; background:rgba(20,24,30,.92); border:2px solid #2a3038; border-radius:20px; padding:34px 20px; text-align:center; opacity:0; }
  .repo .ic{ font-size:82px; line-height:1; }
  .repo .n{ font-size:38px; font-weight:800; color:#c9d1d9; margin-top:18px; line-height:1.3; }
  .repo .sub{ font-size:30px; color:var(--muted); margin-top:10px; }
  .repo.brain{ border-color:rgba(63,185,80,.55); }
  .repo.brain .n{ color:var(--green); }
  .repo.proj{ border-color:rgba(229,72,77,.5); }
  .repo.proj .n{ color:#ffb3b5; }

  /* 分隔的边界线 */
  .wall{ position:absolute; left:50%; top:430px; width:4px; height:300px; transform:translateX(-50%);
    background:repeating-linear-gradient(180deg, var(--amber) 0 16px, transparent 16px 30px); opacity:0; }

  .tomb{ position:absolute; left:60px; right:60px; top:790px; text-align:center;
    font-size:42px; color:var(--green); font-weight:800; opacity:0; line-height:1.35; }
  .tomb b{ color:var(--amber); }

  .hero{ position:absolute; left:56px; right:56px; top:960px; text-align:center;
    font-size:110px; font-weight:900; line-height:1.14; letter-spacing:2px; opacity:0;
    text-shadow:0 6px 30px rgba(0,0,0,.9); }
  .hero b{ color:var(--green); }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="tag" id="tag"><span class="badge">还好 · 它在平行仓库里</span></div>
    <div class="repos">
      <div class="repo brain" id="rb"><div class="ic">🧠</div><div class="n">大脑</div><div class="sub">只摘一条门牌</div></div>
      <div class="repo proj" id="rp"><div class="ic">🗑️</div><div class="n">项目仓库</div><div class="sub">删地盘 · 一了百了</div></div>
    </div>
    <div class="wall" id="wall"></div>
    <div class="tomb" id="tomb">✓ 平行不嵌套 —— 就是 <b>EP04 我写死的那条边界</b></div>
    <div class="hero" id="hero">那条边界,<br><b>真救了我一命</b></div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.fromTo("#tag", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 0.2);
  // 两仓库 + 边界墙
  tl.fromTo("#rb", { opacity:0, x:-26 }, { opacity:1, x:0, duration:0.45, ease:"back.out(1.4)" }, 1.0);
  tl.fromTo("#rp", { opacity:0, x:26 }, { opacity:1, x:0, duration:0.45, ease:"back.out(1.4)" }, 1.4);
  tl.fromTo("#wall", { opacity:0, scaleY:0 }, { opacity:1, scaleY:1, duration:0.5, ease:"power2.out", transformOrigin:"center" }, 2.0);
  // 删地盘:项目仓库淡掉、门牌保留(VO"删地盘一了百了,大脑只摘一条门牌")
  tl.to("#rp", { opacity:0.4, scale:0.94, duration:0.5 }, 4.2);
  tl.to("#rp .ic", { color:"#e5484d", duration:0.3 }, 4.2);
  // EP04 边界回扣
  tl.fromTo("#tomb", { opacity:0, y:14 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 5.4);
  tl.to("#tomb b", { color:"#ffd27a", scale:1.05, duration:0.5, yoyo:true, repeat:1, ease:"sine.inOut", transformOrigin:"center" }, 6.0);
  // 落实"救了我一命"
  tl.fromTo("#hero", { opacity:0, scale:0.88, y:22 }, { opacity:1, scale:1, y:0, duration:0.55, ease:"back.out(1.4)" }, 7.6);
  tl.fromTo("#hero b", { scale:1.5 }, { scale:1, duration:0.4, ease:"back.out(3)", transformOrigin:"center" }, 8.2);
  tl.to("#hero b", { scale:1.06, duration:0.5, yoyo:true, repeat:2, ease:"sine.inOut", transformOrigin:"center" }, 8.8);
  tl.to({}, { duration:1.2 }, 11.4);
  registerTimeline(tl);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  :root{
    --canvas:#faf9f6; --surface:#eeece5; --ink:#1c1e22; --muted:#767b85; --accent:#c0392b; --secondary:#9c6b0a;
    --font:"SF Pro Text","Source Han Sans SC","PingFang SC",sans-serif;
  }
  body{background:var(--canvas);}
  .canvas{background:var(--canvas);}
  .title{position:absolute;left:70px;right:70px;top:300px;font-family:var(--font);font-weight:800;
    font-size:56px;line-height:1.3;color:var(--ink);text-align:center;opacity:0;}
  .card{position:absolute;left:70px;right:70px;height:340px;background:var(--surface);
    border:1px solid rgba(28,30,34,.10);border-radius:16px;padding:40px 44px;
    box-shadow:0 4px 20px rgba(28,30,34,.08);opacity:0;transform:translateY(30px);
    display:flex;align-items:center;gap:32px;}
  #cardBig{top:560px;}
  #cardSmall{top:960px;}
  .icon{width:96px;height:96px;flex:none;}
  .icon-body{flex:1;}
  .icon-label{font-family:var(--font);font-weight:700;font-size:36px;margin-bottom:12px;}
  #cardBig .icon-label{color:var(--accent);}
  #cardSmall .icon-label{color:var(--secondary);}
  .icon-examples{font-family:var(--font);font-weight:400;font-size:26px;color:var(--muted);}
</style></head>
<body>
<div class="canvas">
  <div class="title" id="title">不过别啥事都这么用</div>
  <div class="card" id="cardBig">
    <svg class="icon" viewBox="0 0 96 96" fill="none">
      <path d="M48 14 L88 82 L8 82 Z" stroke="#c0392b" stroke-width="5" stroke-linejoin="round"/>
      <rect x="44" y="38" width="8" height="24" rx="4" fill="#c0392b"/>
      <circle cx="48" cy="70" r="5" fill="#c0392b"/>
    </svg>
    <div class="icon-body">
      <div class="icon-label">大赌,用它挑刺</div>
      <div class="icon-examples">辞职 / 借钱 / all in 这类决定</div>
    </div>
  </div>
  <div class="card" id="cardSmall">
    <svg class="icon" viewBox="0 0 96 96" fill="none">
      <path d="M48 16 C40 32 26 40 26 58 C26 74 36 84 48 84 C60 84 70 74 70 58 C70 46 62 40 58 30 C56 40 50 42 48 36 C44 28 50 22 48 16 Z"
        stroke="#9c6b0a" stroke-width="5" stroke-linejoin="round"/>
    </svg>
    <div class="icon-body">
      <div class="icon-label">小赌,别让它灭火</div>
      <div class="icon-examples">低成本、可反悔的尝试</div>
    </div>
  </div>
</div>
<script>
  const tl = gsap.timeline({paused:true});
  tl.fromTo("#title", {opacity:0, y:16}, {opacity:1, y:0, duration:.6, ease:"power2.out"}, 0);
  tl.fromTo("#cardBig", {opacity:0, y:30}, {opacity:1, y:0, duration:.6, ease:"power2.out"}, 1.0);
  tl.fromTo("#cardSmall", {opacity:0, y:30}, {opacity:1, y:0, duration:.6, ease:"power2.out"}, 2.0);
  tl.to({}, {duration:2.0}, 3.0);
  registerTimeline(tl);
</script>
</body></html>

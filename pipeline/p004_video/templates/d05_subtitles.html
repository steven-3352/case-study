<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Subtitle Overlay · W27D05</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    html, body, .canvas { background: transparent !important; }
    .sub-line {
      position: absolute;
      left: 60px; right: 60px;
      bottom: 240px;
      text-align: center;
      font-family: var(--sans);
      font-weight: 900;
      font-size: 46px;
      line-height: 1.3;
      color: #fff;
      letter-spacing: 1px;
      text-shadow:
        -4px -4px 0 #000, 4px -4px 0 #000,
        -4px 4px 0 #000, 4px 4px 0 #000,
        -4px 0 0 #000, 4px 0 0 #000,
        0 -4px 0 #000, 0 4px 0 #000,
        0 0 24px rgba(0,0,0,.95);
      opacity: 0;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="sub-line" id="sub"></div>
  </div>
  <script>
    // W27D05 底部跟读字幕 · 实测 VO 时间码(seg_timing_d05.json) · 总时长 42.12s
    // 按段落自然语意切分,每行 ≤22 字
    const lines = [
      { t: 0.00,  end: 4.50,  text: "有个母婴店老板跟我说,得招个人专门回客户消息" },
      { t: 4.89,  end: 7.10,  text: "我说,先别招" },
      { t: 7.29,  end: 10.50, text: "我让她把 90 天群聊天记录,全部导出来" },
      { t: 10.70, end: 14.30, text: "贴给 AI · 归类 · 统计 · 出表" },
      { t: 14.49, end: 18.50, text: "1200 多条客户问题,真不一样的就 10 来类" },
      { t: 18.70, end: 22.60, text: "前 5 类:营业时间、价格、改约、产品适用、退换" },
      { t: 22.80, end: 25.50, text: "占了 7 成多" },
      { t: 25.59, end: 28.80, text: "她看完柱图沉默了三秒" },
      { t: 29.00, end: 32.30, text: "当晚发群:招人推迟,先做个表" },
      { t: 32.36, end: 35.30, text: "你不是缺人 · 你是缺数据" },
      { t: 35.41, end: 38.80, text: "评论扣\"也想数\",我把数法和 Excel 模板发你" },
      { t: 39.00, end: 41.80, text: "凑 10 个 · 发模板" }
    ];
    const sub = document.getElementById("sub");
    const tl = gsap.timeline();
    lines.forEach((line) => {
      tl.call(() => { sub.textContent = line.text; }, [], line.t);
      tl.fromTo(sub, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.16 }, line.t);
      tl.to(sub, { opacity: 0, duration: 0.16 }, line.end - 0.16);
    });
    tl.to({}, { duration: 0.05 }, 42.12);
    registerTimeline(tl);

    // 截帧去重钩子(复用 D04 的 8e13d3c 优化)
    window.__contentKey = function () {
      const cs = getComputedStyle(sub);
      if (parseFloat(cs.opacity) <= 0.001) return "blank";
      return sub.textContent + "|" + cs.opacity + "|" + cs.transform;
    };
  </script>
</body>
</html>

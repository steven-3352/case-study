<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D02 Guest Card</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: linear-gradient(180deg, #e8eaf6 0%, #c5cae9 100%);
      font-family: -apple-system, "PingFang SC", sans-serif; color: #1a237e;
    }
    .card {
      position: absolute; left: 100px; right: 100px; top: 420px;
      background: #fff; border-radius: 32px;
      box-shadow: 0 16px 56px rgba(26,35,126,0.15);
      overflow: hidden; opacity: 0; transform: scale(0.9);
    }
    .head {
      background: linear-gradient(135deg, #3949ab, #5c6bc0);
      color: #fff; padding: 36px 40px; font-size: 32px;
    }
    .head .name { font-size: 44px; font-weight: 800; margin-top: 8px; }
    .fields { padding: 36px 40px; }
    .field {
      display: flex; justify-content: space-between; align-items: center;
      padding: 22px 0; border-bottom: 1px solid #e8eaf6; font-size: 32px; opacity: 0;
    }
    .field .val { font-weight: 600; }
    .field .val.empty { color: #ef5350; font-weight: 800; }
    .field .val.once { color: #78909c; }
    .stamp-empty {
      position: absolute; right: 120px; top: 720px;
      border: 6px solid #ef5350; color: #ef5350;
      font-size: 48px; font-weight: 900; padding: 12px 24px;
      transform: rotate(12deg); opacity: 0;
    }
    .kicker {
      position: absolute; left: 0; right: 0; bottom: 460px; text-align: center;
      font-size: 46px; font-weight: 800; color: #283593; opacity: 0;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="head">
      <div>团购客档案</div>
      <div class="name">匿名 · 平台团购</div>
    </div>
    <div class="fields">
      <div class="field" id="f1"><span>到店次数</span><span class="val once">1 次</span></div>
      <div class="field" id="f2"><span>联系方式</span><span class="val empty">未留</span></div>
      <div class="field" id="f3"><span>复购记录</span><span class="val empty">—</span></div>
    </div>
  </div>
  <div class="stamp-empty" id="stamp">客资空白</div>
  <div class="kicker" id="kicker">来一次就没了</div>
  <script>
    const d = window.getData();
    if (d.kicker) document.getElementById("kicker").textContent = d.kicker;
    const tl = gsap.timeline();
    tl.to("#card", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.2)" }, 0.2);
    tl.to(".field", { opacity: 1, duration: 0.22, stagger: 0.3 }, 0.6);
    tl.fromTo("#stamp", { opacity: 0, scale: 2, rotation: 30 }, { opacity: 0.9, scale: 1, rotation: 12, duration: 0.35, ease: "back.out(2)" }, 1.4);
    tl.fromTo("#kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3 }, 1.8);
    tl.to({}, { duration: 1.8 }, 2.2);
    registerTimeline(tl);
  </script>
</body>
</html>

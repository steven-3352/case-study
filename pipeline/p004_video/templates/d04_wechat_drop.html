<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D04 WeChat Drop</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    .phone {
      position: absolute;
      left: 50px;
      right: 50px;
      top: 320px;
      bottom: 520px;
      background: #111;
      border-radius: 36px;
      border: 4px solid #333;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .wx-header {
      height: 100px;
      background: #2e2e2e;
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 20px;
      border-bottom: 1px solid #444;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--green), #2d8a4e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      position: relative;
    }
    .avatar .dot {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--green);
      border: 3px solid #2e2e2e;
    }
    .avatar.off .dot { background: var(--gray-4); }
    .avatar.off { filter: grayscale(1); opacity: 0.45; }
    .wx-name { font-size: 36px; font-weight: 700; }
    .wx-status { font-size: 24px; color: var(--green); margin-top: 4px; }
    .wx-status.off { color: var(--red); }
    .chat {
      flex: 1;
      padding: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bubble {
      max-width: 75%;
      padding: 20px 24px;
      border-radius: 16px;
      font-size: 30px;
      line-height: 1.35;
      opacity: 0;
    }
    .bubble.out {
      align-self: flex-end;
      background: #95ec69;
      color: #111;
    }
    .bubble.in {
      align-self: flex-start;
      background: #2a2a2a;
      color: var(--gray-1);
    }
    .bubble.silent {
      align-self: flex-start;
      background: #1a1a1a;
      color: var(--gray-4);
      font-size: 40px;
      letter-spacing: 8px;
    }
    .badge {
      position: absolute;
      left: 0;
      right: 0;
      top: 200px;
      text-align: center;
      font-size: 56px;
      font-weight: 900;
      color: var(--red);
      opacity: 0;
      text-shadow: 0 0 40px var(--red-soft);
    }
    .kicker {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 460px;
      text-align: center;
      font-size: 48px;
      font-weight: 800;
      color: var(--gray-2);
      opacity: 0;
      padding: 0 60px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="badge" id="badge">已离职</div>
    <div class="phone" id="phone">
      <div class="wx-header">
        <div class="avatar" id="avatar">刘<div class="dot"></div></div>
        <div>
          <div class="wx-name">销售 · 小刘</div>
          <div class="wx-status" id="status">跟进中</div>
        </div>
      </div>
      <div class="chat" id="chat">
        <div class="bubble out" id="b1">张阿姨，第25天该提醒啦</div>
        <div class="bubble in" id="b2">好的，还有半瓶</div>
        <div class="bubble out" id="b3">李叔，快用完了吗？</div>
        <div class="bubble silent" id="b4">···</div>
        <div class="bubble silent" id="b5">···</div>
        <div class="bubble silent" id="b6">···</div>
      </div>
    </div>
    <div class="kicker" id="kicker">「人走了，客户跟丢了」</div>
  </div>
  <script>
    const data = window.getData();
    const tl = gsap.timeline();

    tl.to("#b1", { opacity: 1, x: 0, duration: 0.25, ease: "back.out(1.5)" }, 0.2);
    tl.to("#b2", { opacity: 1, duration: 0.2 }, 0.5);
    tl.to("#b3", { opacity: 1, duration: 0.25 }, 0.75);

    tl.call(() => {
      document.getElementById("avatar").classList.add("off");
      const st = document.getElementById("status");
      st.textContent = "已离职";
      st.classList.add("off");
    }, null, 1.4);
    tl.fromTo("#badge", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 1.45);

    tl.to("#b3", { opacity: 0.2, duration: 0.3 }, 1.8);
    tl.to(["#b4", "#b5", "#b6"], { opacity: 1, duration: 0.25, stagger: 0.15 }, 2.0);
    tl.to("#phone", { filter: "brightness(0.7)", duration: 0.4 }, 2.2);

    tl.fromTo("#kicker",
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
      2.5);

    tl.to({}, { duration: 0.6 }, 3.2);
    registerTimeline(tl);
  </script>
</body>
</html>

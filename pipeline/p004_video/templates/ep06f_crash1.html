<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP06 s2 · 翻车①②</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("ep01f_desk.jpg");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.8),rgba(6,9,14,.64) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .crash{position:absolute;left:52px;right:52px;border-radius:22px;padding:34px 36px;opacity:0;box-shadow:0 20px 60px rgba(0,0,0,.5);background:rgba(26,18,15,.94);border:2px solid rgba(229,72,77,.4)}
  #c1{top:360px} #c2{top:760px}
  .crash .no{font-size:38px;font-weight:900;color:var(--red);font-family:"SF Mono",monospace}
  .crash .t{font-size:46px;font-weight:900;margin-top:10px}
  .crash .d{font-size:36px;color:var(--muted);margin-top:14px;line-height:1.4}
  .crash .fix{margin-top:18px;font-size:34px;color:var(--green);font-weight:700}
  .crash .fix .link{color:var(--amber)}
  .caption{position:absolute;left:52px;right:52px;bottom:200px;text-align:center;font-size:70px;font-weight:900;line-height:1.2;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--green)}

  #c2{display:none!important} #c1 .fix{display:none!important} #c1{top:520px!important}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="crash" id="c1">
      <div class="no">翻车 ①</div>
      <div class="t">上的锁,先锁了我自己</div>
      <div class="d">刚上的收工锁,第一次实战 —— 它置了闸,让我去看报告,可闸把我挡门外,我只能<b style="color:#ffb3b5">盲签</b>。</div>
      <div class="fix">✓ 修:置闸必须把摘要<b>贴脸上</b></div>
    </div>
    <div class="crash" id="c2">
      <div class="no">翻车 ②</div>
      <div class="t">屁大的事也来问我</div>
      <div class="d">它问我"要不要记一句 journal?"—— 违反我立的"别拿琐事烦我"。</div>
      <div class="fix">✓ 修:加个 <span class="link">⚖️ Stop 裁判</span> —— EP05 那裁判,就这么被逼出来的</div>
    </div>
    <div class="caption" id="cap">每翻一次,<b>立一条规矩</b></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo(".stage",{scale:1.0},{scale:1.01,duration:14.3,ease:"sine.inOut"},0);
  tl.fromTo("#c1",{opacity:0,y:28,scale:.97},{opacity:1,y:0,scale:1,duration:.55,ease:"back.out(1.3)"},0.4);
  tl.fromTo("#c1 .no",{opacity:0,scale:1.6},{opacity:1,scale:1,duration:.4,ease:"back.out(3)",transformOrigin:"left center"},0.7);
  tl.fromTo("#c1 .t",{opacity:0,x:-14},{opacity:1,x:0,duration:.45,ease:"power2.out"},1.5);
  tl.fromTo("#c1 .d",{opacity:0,y:14},{opacity:1,y:0,duration:.5,ease:"power2.out"},3.6);
  // "把我挡在门外" —— 卡片轻震
  tl.to("#c1",{keyframes:[{x:-8},{x:8},{x:-5},{x:0}],duration:.3},7.0);
  tl.to("#c1",{boxShadow:"0 20px 60px rgba(0,0,0,.5),0 0 46px rgba(229,72,77,.3)",duration:.5,yoyo:true,repeat:1},7.3);
  // "只能……盲签" —— punch
  tl.to("#c1 .d b",{color:"#ff5a5f",scale:1.14,duration:.5,yoyo:true,repeat:3,ease:"sine.inOut",transformOrigin:"center"},11.0);
  tl.to({},{duration:1.2},14.3);
  registerTimeline(tl);
</script></body></html>

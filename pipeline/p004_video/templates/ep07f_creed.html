<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP07 s6 · 自警金句(留白)</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("ep01f_desk.jpg");background-size:cover;background-position:center 62%}
  /* 更暗、更留白:金句时刻收拢注意力 */
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,6,10,.92),rgba(4,6,10,.82) 40%,rgba(4,6,10,.86) 70%,rgba(2,3,6,.98))}
  .noise{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .mark{position:absolute;left:80px;right:80px;top:600px;text-align:center;font-size:38px;color:var(--muted);font-family:"SF Mono",monospace;opacity:0}
  .motto{position:absolute;left:70px;right:70px;top:760px;text-align:center}
  .motto .line{font-size:74px;font-weight:900;line-height:1.5;opacity:0}
  .motto .a{color:var(--green)} .motto .b{color:var(--amber)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="mark" id="mark">// 我做这一整个连载,就守一条:</div>
    <div class="motto">
      <div class="line" id="l1"><span class="a">写成真实记录,是内容;</span></div>
      <div class="line" id="l2"><span class="b">写成效果炸裂,就是元叙事。</span></div>
    </div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo(".stage",{scale:1.0},{scale:1.008,duration:7.07,ease:"sine.inOut"},0);
  // 慢:金句慢而重,念完留白
  tl.fromTo("#mark",{opacity:0,y:10},{opacity:1,y:0,duration:.6,ease:"power1.out"},0.3);
  tl.fromTo("#l1",{opacity:0,y:16},{opacity:1,y:0,duration:.8,ease:"power2.out"},1.8);
  tl.fromTo("#l2",{opacity:0,y:16},{opacity:1,y:0,duration:.8,ease:"power2.out"},3.6);
  // 念完留白:静置,不做任何弹跳
  tl.to({},{duration:2.2},6.87);
  registerTimeline(tl);
</script></body></html>

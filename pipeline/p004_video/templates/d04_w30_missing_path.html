<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../shared/w30_d04.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>.present{position:absolute;top:390px;left:70px;width:430px;height:280px;font-size:40px;font-weight:900}.port{position:absolute;right:120px;top:480px}.line{left:470px;top:525px;width:360px;background:var(--d4-red)}.stop{position:absolute;left:705px;top:425px;width:120px;height:220px;background:#fff;border:14px solid var(--d4-red)}.missing{position:absolute;top:780px;left:120px;right:120px;padding:38px;border:5px dashed var(--d4-red);font-size:42px;font-weight:900;text-align:center}.result{position:absolute;top:1070px;left:120px;right:120px;text-align:center;font-size:58px;font-weight:950;color:var(--d4-red)}</style></head><body><div class="canvas"><div class="d4-kicker">断点定位</div><div class="d4-title">文件在磁盘，但不在注入列表</div><div class="present node file" id="present"></div><div class="path line"></div><div class="stop"></div><div class="port"></div><div class="missing" id="missing"></div><div class="result" id="result"></div><div class="subtitle" id="subtitle"></div></div><script>const d=getData(),D=+d.scene_duration||5;present.textContent=d.present;missing.textContent=d.missing;result.textContent=d.result;subtitle.textContent=d.subtitle||'';const tl=gsap.timeline({paused:true}).from('.present',{x:-80,autoAlpha:0,duration:.4},D*.05).from('.line',{scaleX:0,duration:.6},D*.18).from('.stop',{scaleY:0,autoAlpha:0,duration:.3},D*.36).from('.missing',{y:40,autoAlpha:0,duration:.35},D*.52).from('.result',{scale:.7,autoAlpha:0,duration:.3},D*.68).to('.line',{opacity:.25,duration:.25},D*.82).to('.stop',{borderColor:'#101716',duration:.22},D*.9).to({},{duration:D},0);registerTimeline(tl)</script></body></html>

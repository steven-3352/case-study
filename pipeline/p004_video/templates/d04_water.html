<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  body{background:#0a0e14;}
  .bg{position:absolute;inset:0;background:radial-gradient(ellipse at center,#1a1f29 0%,#0a0e14 80%);}
  .l{position:absolute;left:60px;right:60px;top:760px;text-align:center;font-size:120px;font-weight:900;
    color:#fff;line-height:1.18;letter-spacing:-1px;opacity:0;
    text-shadow:0 6px 0 #000,0 18px 38px rgba(0,0,0,.7);}
  .sub{position:absolute;left:0;right:0;top:1180px;text-align:center;font-size:42px;color:var(--gray-3);
    font-style:italic;letter-spacing:2px;opacity:0;}
</style></head>
<body>
<div class="canvas">
  <div class="bg"></div>
  <div class="l" id="l">但我不知道<br>有没有人愿意付</div>
  <div class="sub" id="sub">— 所以这条不是广告,是测水 —</div>
</div>
<script>
  const tl=gsap.timeline({paused:true});
  tl.fromTo("#l",{opacity:0,x:-80},{opacity:1,x:0,duration:.8,ease:"power2.out"},.3);
  tl.fromTo("#sub",{opacity:0},{opacity:1,duration:.5},1.5);
  // 反高潮节奏放慢,背景灰度加深
  tl.to(".bg",{filter:"brightness(.6)",duration:1.0},2.2);
  tl.to({},{duration:1.5},3.5);
  registerTimeline(tl);
</script>
</body></html>

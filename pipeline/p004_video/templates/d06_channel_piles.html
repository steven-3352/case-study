<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D06 Channel Piles</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #f4efe6;
      font-family: "PingFang SC", "Source Han Sans CN", -apple-system, sans-serif;
      color: #2c2416;
    }
    .canvas {
      position: relative; width: 1080px; height: 1920px; overflow: hidden;
      background: linear-gradient(180deg, #e8dfd0 0%, #f4efe6 30%);
    }
    .desk {
      position: absolute; left: 0; right: 0; bottom: 0; height: 680px;
      background: linear-gradient(180deg, #c9a87c 0%, #b8956a 100%);
      border-top: 4px solid #a07850;
    }
    .desk-grain {
      position: absolute; inset: 0; opacity: 0.15;
      background: repeating-linear-gradient(90deg, transparent 0 40px, rgba(0,0,0,0.03) 40px 41px);
    }
    .title-bar {
      position: absolute; left: 0; right: 0; top: 260px;
      text-align: center; font-size: 38px; font-weight: 800; color: #5c4a32;
      opacity: 0; letter-spacing: 2px;
    }
    .piles {
      position: absolute; left: 40px; right: 40px; top: 380px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 28px 24px;
    }
    .pile {
      position: relative; height: 420px; opacity: 0;
    }
    .pile-label {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: #fff59d; padding: 10px 24px; font-size: 36px; font-weight: 800;
      box-shadow: 2px 3px 8px rgba(44,36,22,0.15);
      transform-origin: center; z-index: 10;
      border: 1px solid #e6d96a;
    }
    .pile-label::before {
      content: ""; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
      width: 40px; height: 16px; background: rgba(255,245,157,0.6);
      clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
    }
    .status-tag {
      position: absolute; top: 20px; right: 12px; z-index: 12;
      font-family: "Courier New", monospace; font-size: 24px; font-weight: 700;
      padding: 8px 14px; border-radius: 4px; opacity: 0;
      transform: rotate(3deg);
    }
    .status-tag.blue { background: #e3f2fd; color: #1565c0; border: 2px solid #90caf9; }
    .status-tag.orange { background: #fff3e0; color: #e65100; border: 2px solid #ffcc80; }
    .status-tag.green { background: #e8f5e9; color: #2e7d32; border: 2px solid #a5d6a7; }
    .status-tag.red { background: #ffebee; color: #c62828; border: 2px solid #ef9a9a; }
    .sheet {
      position: absolute; width: 88%; height: 56px; left: 6%;
      background: #faf7f2; border: 1px solid #d4cfc4;
      box-shadow: 1px 2px 6px rgba(44,36,22,0.1);
      transform-origin: bottom center;
    }
    .sheet::after {
      content: ""; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 60%; height: 2px; background: repeating-linear-gradient(90deg, #ccc 0 6px, transparent 6px 12px);
    }
    .mismatch {
      position: absolute; left: 0; right: 0; top: 920px;
      text-align: center; font-size: 72px; font-weight: 900; color: #c62828;
      opacity: 0; letter-spacing: 12px;
    }
    .caption {
      position: absolute; left: 0; right: 0; bottom: 520px;
      text-align: center; font-size: 42px; font-weight: 800; color: #3d3528;
      opacity: 0; padding: 0 50px;
    }
    .red-x {
      position: absolute; left: 50%; top: 860px; transform: translateX(-50%);
      font-size: 100px; color: #c62828; opacity: 0; font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="title-bar" id="title">四套账本 · 各记各的</div>
    <div class="piles" id="piles"></div>
    <div class="red-x" id="redx">✗</div>
    <div class="mismatch" id="mismatch">≠ ≠ ≠</div>
    <div class="caption" id="caption">四套记录 · 对不上是常态</div>
    <div class="desk"><div class="desk-grain"></div></div>
  </div>
  <script>
    const data = window.getData();
    const icons = { "平台": "🛒", "支付宝": "💳", "微信": "💬", "仓库": "📦" };
    const sources = data.sources || [
      { name: "平台", status: "已退", color: "blue" },
      { name: "支付宝", status: "未到账", color: "orange" },
      { name: "微信", status: "截图", color: "green" },
      { name: "仓库", status: "未签收", color: "red" }
    ];
    if (data.caption) document.getElementById("caption").textContent = data.caption;

    const pilesEl = document.getElementById("piles");
    const allSheets = [];
    sources.forEach((s, pi) => {
      const pile = document.createElement("div");
      pile.className = "pile";
      pile.dataset.color = s.color || "blue";
      const sheetCount = 4 + pi;
      for (let i = 0; i < sheetCount; i++) {
        const sh = document.createElement("div");
        sh.className = "sheet";
        sh.style.bottom = (i * 14 + 60) + "px";
        sh.style.transform = `rotate(${(Math.random() - 0.5) * 6}deg)`;
        sh.style.zIndex = i;
        pile.appendChild(sh);
        allSheets.push(sh);
      }
      const tag = document.createElement("div");
      tag.className = `status-tag ${s.color || "blue"}`;
      tag.textContent = s.status;
      pile.appendChild(tag);
      const lbl = document.createElement("div");
      lbl.className = "pile-label";
      lbl.textContent = (icons[s.name] || "") + " " + s.name;
      pile.appendChild(lbl);
      pilesEl.appendChild(pile);
    });

    const tl = gsap.timeline();
    tl.to("#title", { opacity: 1, duration: 0.35 }, 0);
    tl.fromTo(".pile", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.15, ease: "back.out(1.4)" }, 0.2);
    tl.fromTo(allSheets, { scaleY: 0, opacity: 0 }, {
      scaleY: 1, opacity: 1, duration: 0.2, stagger: 0.03, ease: "power2.out", transformOrigin: "bottom center"
    }, 0.5);
    tl.to(".status-tag", { opacity: 1, duration: 0.25, stagger: 0.12 }, 1.8);
    tl.to(".status-tag", { scale: 1.08, duration: 0.12, stagger: 0.08, yoyo: true, repeat: 1 }, 2.4);
    tl.fromTo("#redx", { opacity: 0, scale: 0.3 }, { opacity: 0.7, scale: 1, duration: 0.4, ease: "back.out(2)" }, 3.0);
    tl.fromTo("#mismatch", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "elastic.out(1, 0.6)" }, 3.3);
    tl.to(".pile", { x: (i) => (i % 2 === 0 ? -6 : 6), duration: 0.15, stagger: 0.05, yoyo: true, repeat: 1 }, 4.0);
    tl.fromTo("#caption", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 5.0);
    tl.to({}, { duration: 1.2 }, 5.8);
    registerTimeline(tl);
  </script>
</body>
</html>

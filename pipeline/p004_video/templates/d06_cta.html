<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D06 CTA · 讨论型互动</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #f5f5f5;
      font-family: "PingFang SC", "Source Han Sans CN", -apple-system, sans-serif;
      color: #1a1a1a;
    }
    .canvas {
      position: relative; width: 1080px; height: 1920px; overflow: hidden;
      background: linear-gradient(180deg, #fff 0%, #e8eef5 100%);
    }
    .card {
      position: absolute; top: 280px; left: 56px; right: 56px;
      background: #fff; border-radius: 28px; padding: 56px 48px;
      box-shadow: 0 24px 64px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
      opacity: 0;
    }
    .card .q {
      font-size: 44px; font-weight: 800; color: #666; text-align: center;
      margin-bottom: 36px;
    }
    .opts { display: flex; flex-direction: column; gap: 24px; }
    .opt {
      display: flex; align-items: center; gap: 24px;
      background: #f5f5f5; border-radius: 20px; padding: 32px 36px;
      opacity: 0; transform: translateY(20px);
    }
    .opt .ico {
      width: 72px; height: 72px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; flex-shrink: 0;
    }
    .o1 .ico { background: #e3f2fd; }
    .o2 .ico { background: #fce4ec; }
    .o3 .ico { background: #e8f5e9; }
    .opt .txt { font-size: 42px; font-weight: 800; color: #1a1a1a; }
    .cta {
      position: absolute; left: 48px; right: 48px; bottom: 280px; text-align: center;
    }
    .cta .l1 {
      font-size: 56px; font-weight: 900; color: #1a1a1a; line-height: 1.3;
      opacity: 0;
    }
    .cta .l2 {
      font-size: 72px; font-weight: 900; color: #e53935; line-height: 1.25;
      opacity: 0; margin-top: 24px;
    }
    .comments {
      position: absolute; top: 920px; left: 56px; right: 56px;
      background: #fafafa; border-radius: 20px; padding: 28px 32px;
      border: 1px solid #e8eef5; opacity: 0;
    }
    .cm { display: flex; gap: 16px; margin-top: 18px; opacity: 0; }
    .cm:first-child { margin-top: 0; }
    .cm .avt {
      width: 52px; height: 52px; border-radius: 50%; background: #e8eef5;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .cm .body { flex: 1; }
    .cm .nick { font-size: 24px; color: #888; }
    .cm .txt { font-size: 32px; color: #333; font-weight: 600; margin-top: 4px; }
    .wm { position: absolute; top: 1830px; right: 48px; font-size: 22px; color: #999; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="card" id="card">
      <div class="q">你最想先甩给 Agent 的是？</div>
      <div class="opts">
        <div class="opt o1" id="o1">
          <div class="ico">✍️</div>
          <div class="txt">写稿</div>
        </div>
        <div class="opt o2" id="o2">
          <div class="ico">🔍</div>
          <div class="txt">找素材</div>
        </div>
        <div class="opt o3" id="o3">
          <div class="ico">🚦</div>
          <div class="txt">过门禁</div>
        </div>
      </div>
    </div>
    <div class="comments" id="cms">
      <div class="cm" id="cm1">
        <div class="avt">👩</div>
        <div class="body">
          <div class="nick">内容创业者</div>
          <div class="txt">帮我过门禁，每次 render 完才发现不能发</div>
        </div>
      </div>
      <div class="cm" id="cm2">
        <div class="avt">👨</div>
        <div class="body">
          <div class="nick">一人公司</div>
          <div class="txt">找素材最烦，小红书调研要翻半天</div>
        </div>
      </div>
      <div class="cm" id="cm3">
        <div class="avt">👩</div>
        <div class="body">
          <div class="nick">小团队负责人</div>
          <div class="txt">写稿，三版脚本互评那套我想自动化</div>
        </div>
      </div>
    </div>
    <div class="cta">
      <div class="l1" id="l1">写稿 / 找素材 / 过门禁？</div>
      <div class="l2" id="l2">评论区说一件具体事</div>
    </div>
    <div class="wm">纯讨论 CTA · 无扣1</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#card", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4 }, 0);
    ["#o1", "#o2", "#o3"].forEach((id, i) => {
      tl.fromTo(id, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.4 + i * 0.35);
    });
    tl.to("#cms", { opacity: 1, duration: 0.3 }, 1.8);
    ["#cm1", "#cm2", "#cm3"].forEach((id, i) => {
      tl.fromTo(id, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.28 }, 2.1 + i * 0.32);
    });
    tl.fromTo("#l1", { opacity: 0, y: 24, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, 3.4);
    tl.fromTo("#l2", { opacity: 0, y: 24, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 4.0);
    tl.to({}, { duration: 2.0 }, 5.0);
    registerTimeline(tl);
  </script>
</body>
</html>

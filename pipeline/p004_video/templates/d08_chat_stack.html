<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D08 Chat Stack</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    :root {
      --paper: #f6f3ec;
      --ink: #17212b;
      --muted: #6c7480;
      --line: #d8d2c7;
      --wx: #19c37d;
      --orange2: #f97316;
      --red2: #ef4444;
      --blue2: #2563eb;
    }
    html, body { background: var(--paper); color: var(--ink); }
    .canvas {
      background:
        linear-gradient(90deg, rgba(23,33,43,.04) 1px, transparent 1px),
        linear-gradient(rgba(23,33,43,.04) 1px, transparent 1px),
        var(--paper);
      background-size: 36px 36px;
    }
    .top {
      position: absolute; left: 64px; right: 64px; top: 220px;
      display: flex; justify-content: space-between; align-items: end;
      border-bottom: 3px solid var(--ink); padding-bottom: 24px;
    }
    .eyebrow { font-family: var(--mono); font-size: 26px; color: var(--muted); }
    .title { font-size: 76px; font-weight: 900; line-height: 1.05; margin-top: 10px; }
    .counter {
      width: 152px; height: 152px; border-radius: 28px; background: var(--ink);
      color: #fff; display: grid; place-items: center; font-family: var(--mono);
      font-size: 60px; font-weight: 900; box-shadow: 12px 12px 0 #ffd166;
    }
    .phone {
      position: absolute; left: 76px; right: 76px; top: 480px; height: 870px;
      border: 4px solid var(--ink); border-radius: 42px; background: #fff;
      box-shadow: 18px 18px 0 rgba(23,33,43,.12); overflow: hidden;
    }
    .bar {
      height: 104px; background: #101820; color: white; display: flex;
      align-items: center; padding: 0 34px; gap: 18px; font-size: 34px; font-weight: 800;
    }
    .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--wx); box-shadow: 0 0 18px var(--wx); }
    .feed { position: absolute; left: 28px; right: 28px; top: 132px; display: flex; flex-direction: column; gap: 18px; }
    .msg {
      display: grid; grid-template-columns: 96px 1fr 96px; gap: 18px; align-items: center;
      min-height: 118px; border: 2px solid var(--line); border-radius: 22px;
      background: #fbfbf8; padding: 18px 20px; opacity: 0; transform: translateY(34px);
    }
    .tag {
      height: 66px; border-radius: 16px; display: grid; place-items: center;
      color: white; font-size: 26px; font-weight: 900;
    }
    .tag.c0 { background: var(--wx); }
    .tag.c1 { background: var(--blue2); }
    .tag.c2 { background: var(--red2); }
    .tag.c3 { background: #64748b; }
    .tag.c4 { background: var(--orange2); }
    .text { font-size: 38px; font-weight: 800; letter-spacing: 0; }
    .time { font-family: var(--mono); font-size: 24px; color: var(--muted); text-align: right; }
    .pile {
      position: absolute; right: 34px; bottom: 28px; display: flex; gap: 8px; align-items: center;
      font-size: 28px; color: var(--muted); font-family: var(--mono);
    }
    .caption {
      position: absolute; left: 70px; right: 70px; top: 1430px;
      font-size: 70px; font-weight: 900; line-height: 1.18; color: var(--ink);
      opacity: 0;
    }
    .caption b { color: var(--red2); }
    .stamp {
      position: absolute; right: 82px; top: 1360px; width: 190px; height: 190px;
      border: 8px solid var(--red2); color: var(--red2); border-radius: 50%;
      display: grid; place-items: center; font-size: 42px; font-weight: 900;
      transform: rotate(-12deg) scale(.6); opacity: 0;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <div>
        <div class="eyebrow">PRIVATE DOMAIN / INBOX</div>
        <div class="title" id="title">客户全混在一起</div>
      </div>
      <div class="counter" id="count">0</div>
    </div>
    <div class="phone">
      <div class="bar"><span class="dot"></span><span>微信客户消息</span></div>
      <div class="feed" id="feed"></div>
      <div class="pile">未分层 · 未排序 · 未提醒</div>
    </div>
    <div class="stamp" id="stamp">漏跟</div>
    <div class="caption" id="caption">老板不知道<br><b>今天先跟谁</b></div>
  </div>
  <script>
    const data = window.getData();
    document.getElementById("title").textContent = data.title || "客户全混在一起";
    const messages = data.messages || [];
    const feed = document.getElementById("feed");
    messages.forEach((m, i) => {
      const row = document.createElement("div");
      row.className = "msg";
      row.id = `msg-${i}`;
      row.innerHTML = `<div class="tag c${i % 5}">${m[0]}</div><div class="text">${m[1]}</div><div class="time">${m[2]}</div>`;
      feed.appendChild(row);
    });
    if (data.caption) document.getElementById("caption").innerHTML = data.caption.replace("今天先跟谁", "<br><b>今天先跟谁</b>");
    const tl = gsap.timeline();
    tl.fromTo(".top", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: .35, ease: "power2.out" }, 0);
    messages.forEach((_, i) => {
      const at = .45 + i * .45;
      tl.to(`#msg-${i}`, { opacity: 1, y: 0, duration: .32, ease: "back.out(1.8)" }, at);
      tl.add(window.countUp("#count", i, i + 1, { duration: .22 }), at);
    });
    tl.to(".phone", { y: -16, duration: .18, repeat: 3, yoyo: true }, 2.9);
    tl.fromTo("#stamp", { opacity: 0, scale: .6, rotation: -22 }, { opacity: 1, scale: 1, rotation: -12, duration: .38, ease: "back.out(2)" }, 3.25);
    tl.fromTo("#caption", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: .45, ease: "power3.out" }, 3.6);
    tl.to({}, { duration: 2.4 }, 4.6);
    registerTimeline(tl);
  </script>
</body>
</html>

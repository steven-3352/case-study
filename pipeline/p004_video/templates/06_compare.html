<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>06 Compare</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    .split {
      position: absolute;
      left: 0;
      right: 0;
      top: 380px;
      bottom: 380px;
      display: flex;
    }
    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 30px;
      position: relative;
    }
    .col.left {
      background: linear-gradient(180deg, rgba(255,82,82,0.04), rgba(255,82,82,0.18));
    }
    .col.right {
      background: linear-gradient(180deg, rgba(80,250,123,0.04), rgba(80,250,123,0.22));
    }

    .col .label {
      font-family: var(--sans);
      font-size: 56px;
      font-weight: 800;
      color: var(--gray-2);
      letter-spacing: 4px;
      margin-bottom: 40px;
    }
    .col.left .label { color: var(--red); }
    .col.right .label { color: var(--green); }

    .col .price {
      font-family: var(--mono);
      font-size: 240px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -8px;
      position: relative;
    }
    .col.left .price { color: var(--red); }
    .col.right .price { color: var(--green); }

    .col.left .price::after {
      content: "";
      position: absolute;
      left: -20px;
      right: -20px;
      top: 50%;
      height: 12px;
      background: var(--red);
      transform: scaleX(0);
      transform-origin: left;
    }

    .col .time {
      font-family: var(--sans);
      font-size: 64px;
      font-weight: 700;
      color: var(--gray-2);
      margin-top: 40px;
    }

    .vs {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      font-family: var(--mono);
      font-size: 120px;
      font-weight: 900;
      color: var(--gray-1);
      opacity: 0;
      pointer-events: none;
      letter-spacing: -4px;
      text-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div class="canvas">

    <div class="split">
      <div class="col left" id="col-left">
        <div class="label" id="l-label">外包</div>
        <div class="price">¥<span id="l-price">0</span></div>
        <div class="time" id="l-time">5 天</div>
      </div>
      <div class="col right" id="col-right">
        <div class="label" id="r-label">Agent</div>
        <div class="price">¥<span id="r-price">0</span></div>
        <div class="time" id="r-time">10 分钟</div>
      </div>
    </div>

    <div class="vs" id="vs">VS</div>

  </div>

  <script>
    const data = window.getData();
    const mode = data.mode || "price";
    const out = data.outsource || { price: 500, time: "5 天", label: "外包" };
    const agt = data.agent || { price: 2, time: "10 分钟", label: "Agent" };

    document.getElementById("l-label").textContent = out.label;
    document.getElementById("l-time").textContent = out.time;
    document.getElementById("r-label").textContent = agt.label;
    document.getElementById("r-time").textContent = agt.time;

    const lPriceEl = document.querySelector("#col-left .price");
    const rPriceEl = document.querySelector("#col-right .price");
    if (mode === "reach") {
      lPriceEl.innerHTML = `<span id="l-price">${out.price}</span><span style="font-size:0.45em;color:var(--gray-2)">${out.unit || ""}</span>`;
      rPriceEl.innerHTML = `<span id="r-price">${agt.price}</span>`;
    }

    const tl = gsap.timeline();

    // 0 - 0.4s · 左右两列从边缘滑入
    tl.fromTo("#col-left", { x: -200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
    tl.fromTo("#col-right", { x: 200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0);

    // 0.5s · VS 弹出中间
    tl.fromTo("#vs", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.5);

    // 0.8s · 数字滚出
    if (mode === "reach") {
      tl.fromTo("#l-price", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.8);
      tl.fromTo("#r-price", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 1.0);
    } else {
      tl.add(window.countUp("#l-price", 0, out.price, { duration: 0.8 }), 0.8);
      tl.add(window.countUp("#r-price", 0, agt.price, { duration: 0.8 }), 0.8);
    }

    // 2.0s · 外包数字打叉
    tl.to(".col.left .price::after", {}, 2.0); // placeholder
    tl.to("#col-left .price", {
      "--strike": 1,
      duration: 0.4,
      onStart: () => {
        const p = document.querySelector("#col-left .price");
        p.style.position = "relative";
        const strike = document.createElement("div");
        strike.id = "strike";
        Object.assign(strike.style, {
          position: "absolute", left: "-20px", right: "-20px",
          top: "50%", height: "12px", background: "var(--red)",
          transformOrigin: "left", transform: "scaleX(0)"
        });
        p.appendChild(strike);
        gsap.to(strike, { scaleX: 1, duration: 0.4, ease: "power2.out" });
      }
    }, 2.0);

    // 2.5s · VS 退到背景
    tl.to("#vs", { opacity: 0.15, scale: 1.5, duration: 0.5 }, 2.5);

    // 3.2s · 右边 Agent 数字放大脉冲
    tl.to("#col-right .price", { scale: 1.15, duration: 0.3, yoyo: true, repeat: 1 }, 3.2);

    // 锁尾
    tl.to({}, { duration: 0.8 }, 4.2);

    registerTimeline(tl);
  </script>
</body>
</html>

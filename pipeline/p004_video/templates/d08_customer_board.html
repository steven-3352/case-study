<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D08 Customer Board</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    :root { --bg:#eef2f7; --panel:#ffffff; --ink:#101828; --muted:#667085; --line:#d0d5dd; --green2:#12b76a; --red2:#f04438; --blue2:#1570ef; --amber:#f79009; }
    html, body { background: var(--bg); color: var(--ink); }
    .canvas { background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%); }
    .chrome {
      position: absolute; left: 52px; right: 52px; top: 180px; bottom: 250px;
      border: 3px solid var(--ink); border-radius: 34px; background: var(--panel);
      box-shadow: 20px 20px 0 rgba(16,24,40,.12); overflow: hidden;
    }
    .nav {
      height: 118px; background: var(--ink); color: white; display: flex; align-items: center;
      justify-content: space-between; padding: 0 34px; font-weight: 900;
    }
    .nav-title { font-size: 42px; }
    .date { font-family: var(--mono); font-size: 26px; color: #cbd5e1; }
    .metric {
      position: absolute; left: 34px; right: 34px; top: 150px; display: grid;
      grid-template-columns: repeat(3, 1fr); gap: 16px;
    }
    .m {
      height: 150px; border-radius: 24px; background: #f9fafb; border: 2px solid var(--line);
      padding: 22px; opacity: 0;
    }
    .m .k { font-size: 25px; color: var(--muted); font-weight: 800; }
    .m .v { font-family: var(--mono); font-size: 58px; font-weight: 900; margin-top: 8px; }
    .table {
      position: absolute; left: 34px; right: 34px; top: 340px;
      border: 2px solid var(--line); border-radius: 26px; overflow: hidden;
    }
    .thead, .row {
      display: grid; grid-template-columns: 1.2fr .7fr 1.7fr; align-items: center;
      min-height: 100px; padding: 0 28px; border-bottom: 2px solid var(--line);
    }
    .thead { background: #f2f4f7; color: var(--muted); font-size: 26px; font-weight: 900; }
    .row { background: white; font-size: 34px; font-weight: 850; opacity: 0; transform: translateX(-30px); }
    .row:last-child { border-bottom: 0; }
    .num { font-family: var(--mono); font-size: 52px; font-weight: 900; }
    .row.risk { background: #fff1f3; color: #912018; }
    .row.hot { background: #eff8ff; color: #1849a9; }
    .action { color: var(--muted); font-size: 30px; }
    .cursor {
      position: absolute; left: 760px; top: 688px; width: 150px; height: 58px;
      border-radius: 14px; background: var(--green2); color: white; display: grid; place-items: center;
      font-size: 25px; font-weight: 900; opacity: 0;
    }
    .highlight {
      position: absolute; left: 70px; right: 70px; bottom: 145px; height: 140px;
      border-radius: 28px; background: var(--green2); color: white; display: grid; place-items: center;
      font-size: 52px; font-weight: 900; box-shadow: 0 18px 60px rgba(18,183,106,.28);
      opacity: 0; transform: translateY(30px);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="chrome">
      <div class="nav"><div class="nav-title" id="title">今日待跟进</div><div class="date">09:30 / auto-list</div></div>
      <div class="metric">
        <div class="m"><div class="k">总客户节点</div><div class="v" id="sum">0</div></div>
        <div class="m"><div class="k">人工优先</div><div class="v" id="manual">0</div></div>
        <div class="m"><div class="k">可自动提醒</div><div class="v" id="auto">0</div></div>
      </div>
      <div class="table" id="table">
        <div class="thead"><div>客户层</div><div>人数</div><div>下一步</div></div>
      </div>
      <div class="cursor" id="cursor">派给人工</div>
    </div>
    <div class="highlight" id="highlight">人工只看关键客户</div>
  </div>
  <script>
    const data = window.getData();
    const rows = data.rows || [];
    document.getElementById("title").textContent = data.title || "今日待跟进";
    document.getElementById("highlight").textContent = data.highlight || "人工只看关键客户";
    const table = document.getElementById("table");
    let sum = 0;
    rows.forEach((r, i) => {
      sum += Number(r[1]);
      const el = document.createElement("div");
      el.className = "row" + (i === 1 ? " hot" : "") + (i === 2 ? " risk" : "");
      el.id = `row-${i}`;
      el.innerHTML = `<div>${r[0]}</div><div class="num">${r[1]}</div><div class="action">${r[2]}</div>`;
      table.appendChild(el);
    });
    const tl = gsap.timeline();
    tl.fromTo(".chrome", { opacity: 0, scale: .96 }, { opacity: 1, scale: 1, duration: .35, ease: "power2.out" }, 0);
    tl.to(".m", { opacity: 1, y: 0, duration: .25, stagger: .12 }, .35);
    tl.add(window.countUp("#sum", 0, sum, { duration: .8 }), .45);
    tl.add(window.countUp("#manual", 0, 8, { duration: .8 }), .58);
    tl.add(window.countUp("#auto", 0, Math.max(0, sum - 8), { duration: .8 }), .70);
    rows.forEach((_, i) => tl.to(`#row-${i}`, { opacity: 1, x: 0, duration: .32, ease: "power3.out" }, 1.35 + i * .48));
    tl.fromTo("#cursor", { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: .25 }, 3.25);
    tl.to("#row-2", { boxShadow: "inset 0 0 0 5px #f04438", duration: .25 }, 3.35);
    tl.fromTo("#highlight", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .42, ease: "back.out(1.5)" }, 4.05);
    tl.to({}, { duration: 4.2 }, 4.8);
    registerTimeline(tl);
  </script>
</body>
</html>

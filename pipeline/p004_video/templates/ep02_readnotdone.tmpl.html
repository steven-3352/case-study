<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><title>EP02 s3 · 读过没做到</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"SF Mono","Menlo","PingFang SC",monospace;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.74),rgba(6,9,14,.46) 34%,rgba(6,9,14,.42) 55%,rgba(6,9,14,.88) 82%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .term{position:absolute;left:56px;right:56px;top:300px;background:rgba(13,17,23,.94);border-radius:26px;box-shadow:0 46px 110px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.05),0 1px 0 rgba(255,255,255,.1) inset}
  .titlebar{height:90px;background:rgba(22,27,34,.92);border-bottom:1px solid #21262d;display:flex;align-items:center;padding:0 32px;gap:15px;border-radius:24px 24px 0 0}
  .lights{display:flex;gap:14px}.lights i{width:24px;height:24px;border-radius:50%;display:block}.lights .r{background:#ff5f56}.lights .y{background:#febc2e}.lights .g{background:#27c93f}
  .path{color:var(--muted);font-size:30px;margin-left:16px}
  .body{padding:40px 40px 46px;display:flex;flex-direction:column;gap:28px}
  .line{font-size:42px;line-height:1.32}
  .prompt .caret{color:var(--green);font-weight:700;margin-right:12px}
  .bullet{color:var(--amber);margin-right:12px}
  #naive,#read{opacity:0}
  .naive-t{color:var(--amber)}
  .log{margin-top:6px;border:2px solid rgba(229,72,77,.4);border-radius:16px;background:rgba(229,72,77,.08);padding:26px 30px;opacity:0}
  .log-h{color:var(--muted);font-size:28px;margin-bottom:14px}
  .log-q{font-size:44px;font-weight:800;line-height:1.35;color:#ffd7d9}
  .log-q b{color:var(--red)}
  .caption{position:absolute;left:52px;right:52px;bottom:150px;font-size:80px;font-weight:900;line-height:1.2;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0;font-family:"PingFang SC","Heiti SC",sans-serif}
  .caption b{color:var(--red)}
</style></head>
<body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="term">
      <div class="titlebar"><div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="path">claude ~/my-ai-assistant</div></div>
      <div class="body">
        <div class="line" id="naive"><span class="bullet">⏺</span><span class="naive-t">我完成了呀,有什么问题?</span></div>
        <div class="line prompt" id="ask"><span class="caret">&gt;</span><span id="t1"></span></div>
        <div class="line" id="read"><span class="bullet">⏺</span><span>读过了。</span></div>
        <div class="log" id="log">
          <div class="log-h">// 翻它的出错记录 · PRE_NODE_CHECKLIST_MISS_LOG</div>
          <div class="log-q">"即便刚<b>读过</b> memory,仍属<b>'读过没落地'</b>"</div>
        </div>
      </div>
    </div>
    <div class="caption" id="cap">它读过。<b>还是没做到。</b></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo("#naive",{opacity:0,y:16},{opacity:1,y:0,duration:.4,ease:"back.out(1.4)"},0.5);
  tl.set("#ask",{opacity:1},1.9);
  tl.add(window.typewriter("#t1","你读过规矩没?",{stagger:.055}),1.9);
  tl.fromTo("#read",{opacity:0,y:14},{opacity:1,y:0,duration:.35,ease:"power2.out"},3.1);
  tl.fromTo("#log",{opacity:0,y:20},{opacity:1,y:0,duration:.45,ease:"power2.out"},4.0);
  // "读过"两处红字脉冲(踩重音)
  tl.fromTo(".log-q b",{color:"#ffd7d9"},{color:"#e5484d",duration:.3,stagger:.15},4.6);
  tl.to(".log",{boxShadow:"0 0 44px rgba(229,72,77,.28)",duration:.4},4.7);
  tl.fromTo("#cap",{opacity:0,y:34},{opacity:1,y:0,duration:.5,ease:"power3.out"},5.6);
  tl.to({},{duration:1.6},6.4);
  registerTimeline(tl);
</script>
</body></html>

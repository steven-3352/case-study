<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:1080px; height:1920px; background:transparent !important; overflow:hidden; }
    .sub {
      position:absolute; left:60px; right:60px; bottom:132px; text-align:center;
      font-family:"PingFang SC","Heiti SC",sans-serif; font-weight:900;
      font-size:58px; line-height:1.3; color:#fff; letter-spacing:1px; padding:0 20px;
      text-shadow:-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,4px 4px 0 #000,
        -4px 0 0 #000,4px 0 0 #000,0 -4px 0 #000,0 4px 0 #000,0 0 26px rgba(0,0,0,.95);
      opacity:0;
    }
    .sub.hot { color:#ff5a5f; }
  </style>
</head>
<body>
  <div class="sub" id="sub"></div>
  <script>
    const lines = [
      { t:0.0, end:2.13, text:"上集我给它建了个团队", hot:0 },
      { t:2.27, end:3.72, text:"可它,还是骗我", hot:1 },
      { t:3.86, end:5.54, text:"这集我干脆 ——", hot:0 },
      { t:5.68, end:6.45, text:"不再信它", hot:1 },
      { t:6.59, end:8.04, text:"给它,装了监控", hot:1 },
      { t:8.68, end:10.07, text:"上集团队搭好了", hot:0 },
      { t:10.21, end:11.17, text:"可它还骗我", hot:0 },
      { t:11.31, end:12.48, text:"我想通一件事", hot:0 },
      { t:12.62, end:13.36, text:"就一句话", hot:0 },
      { t:13.5, end:15.11, text:"不能信它自己说的", hot:1 },
      { t:15.25, end:17.52, text:"它说“做好了”——不算", hot:1 },
      { t:17.66, end:18.83, text:"得有别的东西", hot:0 },
      { t:18.97, end:19.92, text:"替我盯着它", hot:1 },
      { t:20.51, end:21.31, text:"第一道锁", hot:1 },
      { t:21.45, end:22.24, text:"每次开工", hot:0 },
      { t:22.38, end:24.57, text:"系统自动把「我是谁」", hot:0 },
      { t:24.71, end:26.68, text:"「我的规矩」塞给它", hot:0 },
      { t:26.82, end:27.61, text:"不靠它记", hot:1 },
      { t:27.75, end:28.54, text:"它一睁眼", hot:0 },
      { t:28.68, end:30.41, text:"规矩已经在脑子里", hot:1 },
      { t:30.9, end:31.55, text:"第二道", hot:1 },
      { t:31.69, end:32.88, text:"它写东西前", hot:0 },
      { t:33.02, end:34.74, text:"先搜有没有重复", hot:0 },
      { t:34.88, end:36.86, text:"收工前,机械体检", hot:0 },
      { t:37.0, end:38.71, text:"有错,直接挡住", hot:0 },
      { t:38.85, end:39.77, text:"不让提交", hot:0 },
      { t:39.91, end:42.42, text:"不是提醒 —— 是挡", hot:1 },
      { t:42.91, end:44.03, text:"第三道最狠", hot:1 },
      { t:44.17, end:45.54, text:"收工必须置闸", hot:0 },
      { t:45.68, end:47.8, text:"我不亲口说确认收工", hot:0 },
      { t:47.94, end:50.06, text:"它 —— 不许提交", hot:0 },
      { t:50.2, end:51.32, text:"不许接新活", hot:1 },
      { t:51.46, end:53.33, text:"想糊弄完偷偷溜?", hot:0 },
      { t:53.47, end:54.08, text:"溜不掉", hot:1 },
      { t:54.57, end:56.82, text:"最后一道,是个裁判", hot:1 },
      { t:56.96, end:58.42, text:"我这轮一说完", hot:0 },
      { t:58.56, end:59.48, text:"它自动审", hot:0 },
      { t:59.62, end:61.07, text:"有没有拿琐事", hot:0 },
      { t:61.21, end:61.87, text:"来烦我", hot:0 },
      { t:62.01, end:64.52, text:"违规 —— 当场打回", hot:1 },
      { t:64.66, end:65.05, text:"重做", hot:1 },
      { t:65.74, end:66.54, text:"但我得说句实话", hot:0 },
      { t:66.68, end:67.33, text:"这种行为裁判", hot:0 },
      { t:67.47, end:68.0, text:"会漏、会误", hot:1 },
      { t:68.14, end:68.93, text:"真正骗不了人的", hot:0 },
      { t:69.07, end:69.99, text:"是那些离散有痕的", hot:0 },
      { t:70.13, end:70.66, text:"闸,置了没", hot:0 },
      { t:70.8, end:71.46, text:"文件,在不在", hot:0 },
      { t:71.6, end:71.99, text:"裁判之外", hot:0 },
      { t:72.13, end:72.92, text:"必须有硬痕兜底", hot:1 },
      { t:73.76, end:74.98, text:"锁,全上齐了", hot:0 },
      { t:75.12, end:76.11, text:"完美了吧?", hot:0 },
      { t:76.25, end:77.02, text:"恰恰相反", hot:1 },
      { t:77.16, end:78.38, text:"就上锁这条路", hot:0 },
      { t:78.52, end:80.64, text:"我一天翻了 3 次车", hot:1 },
      { t:80.78, end:82.0, text:"一次比一次蠢", hot:0 },
      { t:82.14, end:84.04, text:"下集,全是翻车现场", hot:1 }
    ];
    const sub = document.getElementById("sub");
    const tl = gsap.timeline();
    lines.forEach((line) => {
      tl.call(() => { sub.textContent = line.text; sub.classList.toggle("hot", !!line.hot); }, [], line.t);
      tl.fromTo(sub, { opacity:0, y:8 }, { opacity:1, y:0, duration:0.16 }, line.t);
      tl.to(sub, { opacity:0, duration:0.16 }, line.end - 0.16);
    });
    tl.to({}, { duration:0.05 }, 84.484);
    registerTimeline(tl);
    window.__contentKey = function () {
      const cs = getComputedStyle(sub);
      if (parseFloat(cs.opacity) <= 0.001) return "blank";
      return sub.textContent + "|" + cs.opacity + "|" + cs.transform;
    };
  </script>
</body>
</html>

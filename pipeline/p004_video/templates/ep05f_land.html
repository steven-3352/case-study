<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP05 s4 · 落点勾EP06</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("ep01f_desk.jpg");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.78),rgba(6,9,14,.6) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .locks{position:absolute;left:120px;right:120px;top:430px;display:flex;justify-content:center;gap:24px}
  .lk{font-size:90px;opacity:0}
  .perfect{position:absolute;left:52px;right:52px;top:640px;text-align:center;font-size:56px;color:var(--muted);opacity:0}
  .crash{position:absolute;left:52px;right:52px;top:760px;text-align:center;opacity:0}
  .crash .big{font-size:96px;font-weight:900;color:var(--red)}
  .caption{position:absolute;left:52px;right:52px;bottom:340px;text-align:center;font-size:84px;font-weight:900;line-height:1.18;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption .next{display:block;color:var(--muted);font-size:44px;margin-bottom:14px;font-family:"SF Mono",monospace}
  .caption b{color:var(--red)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="locks"><span class="lk" id="k1">🔒</span><span class="lk" id="k2">🔒</span><span class="lk" id="k3">🔒</span><span class="lk" id="k4">⚖️</span></div>
    <div class="perfect" id="perfect">锁都上齐了 · 完美了吧?</div>
    <div class="crash" id="crash"><div class="big">恰恰相反</div></div>
    <div class="caption" id="cap"><span class="next">EP06 · 下集</span>就上锁这条路<br>我<b>一天翻了 3 次车</b></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo(".stage",{scale:1.0},{scale:1.008,duration:10.7,ease:"sine.inOut"},0);
  // 锁全上齐了
  ["#k1","#k2","#k3","#k4"].forEach((k,i)=>tl.fromTo(k,{opacity:0,scale:0,rotation:-15},{opacity:1,scale:1,rotation:0,duration:.35,ease:"back.out(2.2)"},0.4+i*0.28));
  tl.fromTo("#perfect",{opacity:0,y:14},{opacity:1,y:0,duration:.4},2.0);
  // 恰恰相反 —— 自嘲翻车
  tl.fromTo("#crash",{opacity:0,scale:2,y:-40},{opacity:1,scale:1,y:0,duration:.45,ease:"power4.in"},3.3);
  tl.to("#crash",{scale:1.06,duration:.1,yoyo:true,repeat:1},3.75);
  tl.to(".locks,#perfect",{x:"+=8",duration:.05,repeat:5,yoyo:true},3.3);
  // 追更卡:一天翻了3次车(勾EP06)
  tl.fromTo("#cap",{opacity:0,y:28},{opacity:1,y:0,duration:.5,ease:"power3.out"},5.2);
  tl.fromTo("#cap b",{scale:1.6},{scale:1,duration:.4,ease:"back.out(3)",transformOrigin:"center"},5.7);
  tl.to("#cap b",{scale:1.08,duration:.5,yoyo:true,repeat:4,ease:"sine.inOut",transformOrigin:"center"},6.4);
  tl.to({},{duration:1.0},10.7);
  registerTimeline(tl);
</script></body></html>

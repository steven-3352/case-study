<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP07 s4 · 自警金句 + CTA</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--blue:#1f6feb}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.82),rgba(6,9,14,.7) 40%,rgba(6,9,14,.78) 70%,rgba(6,9,14,.97))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .motto{position:absolute;left:64px;right:64px;top:440px;text-align:center;opacity:0}
  .motto .line{font-size:60px;font-weight:900;line-height:1.4}
  .motto .a{color:var(--green)} .motto .b{color:var(--amber)}
  .motto .mark{font-size:34px;color:var(--muted);margin-bottom:20px;font-family:"SF Mono",monospace}
  .bot{position:absolute;left:0;right:0;top:900px;text-align:center;opacity:0}
  .bot .bar{display:inline-flex;align-items:center;gap:20px;background:rgba(19,26,22,.9);border:2px solid rgba(63,185,80,.4);border-radius:20px;padding:22px 40px}
  .bot .bar .ic{font-size:60px}.bot .bar .t{font-size:40px;color:var(--green);font-weight:800}
  .cta{position:absolute;left:60px;right:60px;bottom:280px;text-align:center;opacity:0}
  .cta .q{font-size:56px;font-weight:900;color:#fff}
  .cta .act{margin-top:24px;display:inline-block;font-size:48px;font-weight:900;color:#fff;background:var(--blue);border-radius:18px;padding:20px 52px}
  .series{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-size:34px;color:var(--muted);font-family:"SF Mono",monospace;opacity:0}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="motto" id="motto">
      <div class="mark">// 我做这一整个连载,就守一条:</div>
      <div class="line"><span class="a">写成真实记录,是内容</span></div>
      <div class="line"><span class="b">写成效果炸裂,就是元叙事</span></div>
    </div>
    <div class="bot" id="bot"><div class="bar"><span class="ic">🤖</span><span class="t">它 → 一个能用的搭档</span></div></div>
    <div class="cta" id="cta"><div class="q">你也在折腾这个?</div><div class="act">评论区,见</div></div>
    <div class="series" id="series">连载《把 AI 调教成我的助理》· 完</div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo("#motto",{opacity:0,y:20},{opacity:1,y:0,duration:.6,ease:"power2.out"},0.5);
  tl.fromTo("#bot",{opacity:0,y:18},{opacity:1,y:0,duration:.5},2.2);
  tl.fromTo("#cta",{opacity:0,y:18},{opacity:1,y:0,duration:.5},3.2);
  tl.to(".act",{scale:1.05,duration:.6,yoyo:true,repeat:2,ease:"sine.inOut"},3.8);
  tl.fromTo("#series",{opacity:0},{opacity:1,duration:.5},4.4);
  tl.to({},{duration:1.6},5.2);
  registerTimeline(tl);
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../shared/w30_d03.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>.ticket{position:absolute;top:230px;left:45px;right:45px;min-height:1170px;border:7px solid #111;background:#fff;padding:28px}.ticket:before{content:'完整九问 + 执行规则';display:block;font-size:32px;color:var(--d3-blue);font-weight:950;margin-bottom:12px}.groups{display:grid;gap:10px}.group{padding:12px 14px;border-left:12px solid var(--d3-blue);background:#f2f5ff}.group b{display:block;font-size:30px}.group span{display:block;font-size:30px;line-height:1.28;font-weight:750}.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.rule{min-height:60px;display:flex;align-items:center;font-size:24px;line-height:1.15;font-weight:900;padding:10px;border:3px solid #111}.rule:before{content:'✓';color:var(--d3-green);margin-right:7px}.boundary{margin-top:18px;background:#111;color:#fff;padding:17px;text-align:center;font-size:31px;font-weight:950}</style></head><body><div class="canvas"><div class="d3-kicker">出口票 · 暂停可抄</div><div class="d3-title">让 AI 先问，不让它替你活</div><div class="ticket"><div class="groups" id="groups"></div><div class="rules" id="rules"></div><div class="boundary" id="boundary"></div></div><div class="subtitle" id="subtitle"></div></div><script>const d=getData(),D=+d.scene_duration||7;(d.groups||[]).forEach(x=>{const e=document.createElement('div');e.className='group';e.innerHTML='<b>'+x.name+'</b><span>'+x.text+'</span>';groups.appendChild(e)});(d.rules||[]).forEach(x=>{const e=document.createElement('div');e.className='rule';e.textContent=x;rules.appendChild(e)});boundary.textContent=d.boundary;subtitle.textContent=d.subtitle||'';const groupGap=Math.max(.28,D*.08),ruleGap=Math.max(.2,D*.055);const tl=gsap.timeline({paused:true}).from('.ticket',{y:150,autoAlpha:0,duration:.5}).from('.group',{x:-50,autoAlpha:0,duration:.2,stagger:groupGap},D*.1).from('.rule',{y:25,autoAlpha:0,duration:.18,stagger:ruleGap},D*.38).from('.boundary',{scaleX:.2,autoAlpha:0,duration:.3},D*.68).to('.ticket',{boxShadow:'16px 16px 0 #f2c94c',duration:.3},D*.84).to({},{duration:D},0);registerTimeline(tl)</script></body></html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  body{background:#000;}
  /* 全屏纯黑 · 双行内核句 */
  .core{position:absolute;left:60px;right:60px;top:760px;text-align:center;}
  .l1{font-size:140px;font-weight:900;color:#fff;line-height:1.15;letter-spacing:6px;opacity:0;
    text-shadow:0 8px 0 #000,0 24px 56px rgba(0,0,0,.85);}
  .l1 .ren{position:relative;display:inline-block;}
  .l1 .ren .strike{position:absolute;left:-8%;right:-8%;top:48%;height:16px;
    background:var(--red);transform:scaleX(0);transform-origin:left;border-radius:8px;
    box-shadow:0 4px 0 #000;}
  .l2{font-size:140px;font-weight:900;color:var(--red);line-height:1.15;letter-spacing:6px;
    opacity:0;margin-top:60px;text-shadow:0 8px 0 #000,0 24px 56px rgba(0,0,0,.85);}
  .wm{position:absolute;top:1830px;right:40px;font-size:22px;color:var(--gray-3);opacity:.4;}
</style></head>
<body>
<div class="canvas">
  <div class="core">
    <div class="l1" id="l1">你不是缺<span class="ren">人<span class="strike" id="strike"></span></span></div>
    <div class="l2" id="l2">你是缺数据</div>
  </div>
  <div class="wm">W27D05 · 内核</div>
</div>
<script>
  const tl=gsap.timeline({paused:true});
  tl.fromTo("#l1",{opacity:0,y:50,scale:.92},{opacity:1,y:0,scale:1,duration:.55,ease:"back.out(1.4)"},0);
  tl.to("#strike",{scaleX:1,duration:.35,ease:"power2.out"},.9);
  tl.fromTo("#l2",{opacity:0,y:50,scale:.92},{opacity:1,y:0,scale:1,duration:.55,ease:"back.out(1.4)"},1.4);
  tl.to({},{duration:.8},2.2);
  registerTimeline(tl);
</script>
</body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../shared/w30_d03.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>.num{position:absolute;top:300px;left:80px;font-size:220px;line-height:1;font-weight:950;color:var(--d3-yellow);-webkit-text-stroke:6px #111}.question{position:absolute;top:570px;left:80px;right:80px;padding:60px 45px;border:10px solid #111;background:#fff;font-size:58px;line-height:1.25;font-weight:950}.seal{position:absolute;top:1040px;right:80px;padding:22px 28px;background:var(--d3-red);color:#fff;font-size:28px;font-weight:900;transform:rotate(-3deg)}</style></head><body><div class="canvas"><div class="d3-kicker">隐藏终检</div><div class="d3-title">九问之后，别急着结束</div><div class="num" id="num"></div><div class="question" id="question"></div><div class="seal" id="note"></div><div class="subtitle" id="subtitle"></div></div><script>const d=getData(),D=+d.scene_duration||6;num.textContent=d.count;question.textContent=d.question;note.textContent=d.note;subtitle.textContent=d.subtitle||'';const tl=gsap.timeline({paused:true}).from('.num',{rotationY:90,autoAlpha:0,duration:.5}).from('.question',{y:90,autoAlpha:0,duration:.45},D*.22).from('.seal',{scale:2,autoAlpha:0,duration:.25},D*.48).to('.question',{boxShadow:'14px 14px 0 #2f6bff',duration:.3},D*.72).to('.seal',{rotation:3,duration:.22},D*.86).to({},{duration:D},0);registerTimeline(tl)</script></body></html>

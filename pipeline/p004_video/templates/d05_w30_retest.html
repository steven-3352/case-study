<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><link rel="stylesheet" href="../shared/w30_d05.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
  <style>.station3{position:absolute;top:360px;left:80px;right:80px;height:800px;padding:55px}.big{font-size:80px;font-weight:950;color:var(--d5-yellow);-webkit-text-stroke:3px #161616}.controls{margin-top:55px;display:grid;gap:35px}.control{height:150px;border:4px solid #161616;padding:35px;font-size:39px;font-weight:900;background:#fff}.return{position:absolute;right:50px;bottom:40px;width:180px;height:180px;border:25px solid var(--d5-green);border-left-color:transparent;border-radius:50%}</style>
</head>
<body>
  <div class="canvas"><div class="d5-kicker">QA 工位 03</div><div class="d5-title">修完，要回到原失败入口</div><div class="station3 station"><div class="big" id="step"></div><div class="controls" id="controls"></div><div class="return"></div></div><div class="subtitle" id="subtitle"></div></div>
  <script>
    const d=getData(),D=+d.scene_duration||6;step.textContent=d.step3;
    (d.controls||[]).forEach(x=>{const e=document.createElement('div');e.className='control';e.textContent=x;controls.appendChild(e)});subtitle.textContent=d.subtitle||'';
    const tl=gsap.timeline({paused:true}).from('.station3',{scale:.92,autoAlpha:0,duration:.4}).from('.control',{x:-90,autoAlpha:0,duration:.3,stagger:.55},.5).from('.return',{rotation:-300,autoAlpha:0,duration:.7},1.5).to('.return',{rotation:60,duration:Math.max(1.5,D-2.4),ease:'none'},2);
    gsap.utils.toArray('.control').forEach((el,i)=>{const t=1+i*(D-1.7)/2;tl.to(el,{backgroundColor:'#fff0a8',x:24,scale:1.025,duration:.22},t).to(el,{backgroundColor:'#fff',x:0,scale:1,duration:.22},Math.min(D-.35,t+Math.max(1,(D-2)/3)))});
    tl.to('.station3',{borderColor:'#f2c230',boxShadow:'18px 18px 0 #f2c230',duration:.25},D*.82).to({},{duration:D},0);registerTimeline(tl);
  </script>
</body>
</html>

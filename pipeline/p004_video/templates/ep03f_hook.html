<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP03 s0 · 开场 · 认命换挡</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 60% at 50% 42%, rgba(210,153,34,.07), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.82) 0%, rgba(6,9,14,.6) 34%, rgba(6,9,14,.58) 60%, rgba(6,9,14,.9) 88%, rgba(6,9,14,.97) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .wrap{ position:absolute; left:70px; right:70px; top:360px; text-align:center; }
  .kick{ font-size:46px; color:var(--muted); font-weight:700; letter-spacing:1px; opacity:0; }
  .kick s{ text-decoration:none; color:#c9d1d9; }
  .setup{ margin-top:34px; font-size:64px; font-weight:900; line-height:1.2; letter-spacing:1px;
    color:#c9d1d9; text-shadow:0 5px 26px rgba(0,0,0,.8); opacity:0; }
  .setup s{ text-decoration:line-through; text-decoration-color:var(--amber); text-decoration-thickness:8px; color:#8b949e; }

  .hero{ position:absolute; left:60px; right:60px; top:820px; text-align:center;
    font-size:112px; font-weight:900; line-height:1.16; letter-spacing:2px;
    text-shadow:0 6px 30px rgba(0,0,0,.85); opacity:0; }
  .hero b{ color:var(--green); }

  .tagrow{ position:absolute; left:90px; right:90px; top:1280px; display:flex; gap:22px; justify-content:center; }
  .tg{ flex:1; text-align:center; background:rgba(13,17,23,.82); border:1px solid #21262d;
    border-left:6px solid var(--green); border-radius:16px; padding:24px 14px; opacity:0;
    box-shadow:0 18px 44px rgba(0,0,0,.5); }
  .tg .ic{ font-size:52px; }
  .tg .lb{ margin-top:10px; font-size:34px; font-weight:800; color:#c9d1d9; }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="wrap">
      <div class="kick" id="kick">上集 · 我被它<s>骗惨了</s></div>
      <div class="setup" id="setup">这集,我不想让它<br>更 <s>聪明</s> 了</div>
    </div>
    <div class="hero" id="hero">把它当<br>『<b>记不住的员工</b>』<br>来管</div>
    <div class="tagrow">
      <div class="tg" id="tg0"><div class="ic">📋</div><div class="lb">立规矩</div></div>
      <div class="tg" id="tg1"><div class="ic">🔒</div><div class="lb">上机制</div></div>
      <div class="tg" id="tg2"><div class="ic">🚦</div><div class="lb">卡流程</div></div>
    </div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.fromTo("#kick", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.5, ease:"power2.out" }, 0.2);
  tl.fromTo("#setup", { opacity:0, y:20 }, { opacity:1, y:0, duration:0.55, ease:"power2.out" }, 2.2);
  tl.fromTo("#setup s", { textDecorationColor:"rgba(210,153,34,0)" }, { textDecorationColor:"rgba(210,153,34,1)", duration:0.35 }, 3.4);
  // 换挡:把它当记不住的员工来管
  tl.fromTo("#hero", { opacity:0, scale:0.86, y:26 }, { opacity:1, scale:1, y:0, duration:0.6, ease:"back.out(1.5)" }, 4.9);
  tl.fromTo("#hero b", { scale:1.5 }, { scale:1, duration:0.4, ease:"back.out(3)" }, 5.4);
  tl.to("#hero", { keyframes:[{ x:-7 },{ x:7 },{ x:-4 },{ x:0 }], duration:0.24, ease:"none" }, 5.5);
  // 三管手段预告
  ["#tg0","#tg1","#tg2"].forEach((c,i)=>{
    tl.fromTo(c, { opacity:0, y:20 }, { opacity:1, y:0, duration:0.4, ease:"back.out(1.6)" }, 6.4 + i*0.5);
  });
  tl.to({}, { duration:0.5 }, 8.4);
  registerTimeline(tl);
</script>
</body>
</html>

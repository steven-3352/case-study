<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D04 Compare Reach</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    .split {
      position: absolute;
      left: 0;
      right: 0;
      top: 340px;
      bottom: 420px;
      display: flex;
      gap: 8px;
      padding: 0 24px;
    }
    .col {
      flex: 1;
      border-radius: 20px;
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
    }
    .col.left {
      background: linear-gradient(180deg, rgba(255,82,82,0.08), rgba(255,82,82,0.22));
      border: 2px solid rgba(255,82,82,0.35);
    }
    .col.right {
      background: linear-gradient(180deg, rgba(80,250,123,0.08), rgba(80,250,123,0.22));
      border: 2px solid rgba(80,250,123,0.35);
    }
    .label {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 24px;
      letter-spacing: 4px;
    }
    .col.left .label { color: var(--red); }
    .col.right .label { color: var(--green); }
    .brain {
      font-size: 120px;
      line-height: 1;
      filter: grayscale(0.2);
    }
    .sheet-mini {
      width: 100%;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      color: #222;
      font-family: var(--mono);
      font-size: 22px;
    }
    .srow {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-bottom: 1px solid #ddd;
    }
    .scell { padding: 14px 10px; border-right: 1px solid #ddd; }
    .scell.red { background: #ffcdd2; color: #b71c1c; font-weight: 800; }
    .scell.head { background: #f5f5f5; font-weight: 800; }
    .big {
      font-size: 64px;
      font-weight: 900;
      color: var(--green);
      margin-top: 12px;
      text-align: center;
    }
    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 460px;
      text-align: center;
      font-size: 44px;
      font-weight: 800;
      color: var(--gray-1);
      opacity: 0;
      padding: 0 50px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="split">
      <div class="col left" id="left">
        <div class="label">改造前</div>
        <div class="brain">🧠</div>
        <div class="big" id="ltime">靠脑子对</div>
      </div>
      <div class="col right" id="right">
        <div class="label">改造后</div>
        <div class="sheet-mini" id="sheet">
          <div class="srow"><div class="scell head">客户</div><div class="scell head">轮次</div><div class="scell head red">触达</div></div>
          <div class="srow"><div class="scell">张阿姨</div><div class="scell">25天</div><div class="scell red">今天</div></div>
          <div class="srow"><div class="scell">李叔</div><div class="scell">28天</div><div class="scell red">今天</div></div>
          <div class="srow"><div class="scell">王姐</div><div class="scell">22天</div><div class="scell red">今天</div></div>
        </div>
        <div class="big" id="rtime">一行看清</div>
      </div>
    </div>
    <div class="caption" id="caption">第25天该触达 · 三行变红</div>
  </div>
  <script>
    const data = window.getData();
    const out = data.outsource || {};
    const agt = data.agent || {};
    if (out.time) document.getElementById("ltime").textContent = out.time;
    if (agt.price) document.getElementById("rtime").textContent = agt.price;
    if (data.caption) document.getElementById("caption").textContent = data.caption;

    const tl = gsap.timeline();
    tl.fromTo("#left", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
    tl.fromTo("#right", { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.15);
    tl.to(".scell.red", { backgroundColor: "#ff5252", color: "#fff", duration: 0.25, stagger: 0.08, yoyo: true, repeat: 1 }, 0.8);
    tl.fromTo("#caption", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 1.4);
    tl.to("#right", { scale: 1.04, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, 1.8);
    tl.to({}, { duration: 0.8 }, 2.6);
    registerTimeline(tl);
  </script>
</body>
</html>

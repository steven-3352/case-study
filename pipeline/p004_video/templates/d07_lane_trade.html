<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D07 Lane Trade</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    :root {
      --bg-blueprint: #eef6fc;
      --grid: rgba(74, 130, 180, 0.2);
      --ink: #1e4d72;
      --ink-light: #5a8ab5;
      --lane-amber: #fff8e1;
      --lane-amber-border: #ffb74d;
      --lane-amber-accent: #e65100;
      --sans: "PingFang SC", "Source Han Sans CN", -apple-system, sans-serif;
      --mono: "SF Mono", "Menlo", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: var(--bg-blueprint);
      font-family: var(--sans); color: var(--ink);
    }
    .canvas {
      position: relative; width: 1080px; height: 1920px;
      background:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px),
        var(--bg-blueprint);
      background-size: 48px 48px;
    }
    .lane-header {
      position: absolute; left: 48px; right: 48px; top: 260px;
      background: var(--lane-amber); border: 3px dashed var(--lane-amber-border);
      border-radius: 20px; padding: 28px 36px; opacity: 0;
    }
    .lane-header .tag {
      font-family: var(--mono); font-size: 24px; color: var(--lane-amber-accent);
      letter-spacing: 3px; margin-bottom: 8px;
    }
    .lane-header .name { font-size: 52px; font-weight: 900; }
    .lane-header .pain { font-size: 32px; color: var(--ink-light); margin-top: 8px; }
    .pipeline {
      position: absolute; left: 60px; right: 60px; top: 520px;
      height: 320px; opacity: 0;
    }
    .pipe-line {
      position: absolute; left: 0; right: 0; top: 140px;
      height: 6px; background: var(--lane-amber-border);
      border-radius: 3px;
    }
    .nodes {
      display: flex; justify-content: space-between; align-items: flex-start;
      position: relative; z-index: 2;
    }
    .stamp-node {
      display: flex; flex-direction: column; align-items: center; opacity: 0;
    }
    .stamp {
      width: 120px; height: 120px; border-radius: 50%;
      background: #fff; border: 4px solid var(--lane-amber-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; box-shadow: 0 6px 20px rgba(230, 81, 0, 0.15);
    }
    .stamp-label {
      margin-top: 12px; font-size: 26px; font-weight: 800;
      font-family: var(--mono); color: var(--lane-amber-accent);
    }
    .busy-badge {
      position: absolute; right: 80px; top: 420px;
      background: #ff5722; color: #fff; font-family: var(--mono);
      font-size: 36px; font-weight: 900; padding: 16px 32px;
      border-radius: 12px; opacity: 0; letter-spacing: 4px;
      box-shadow: 0 8px 24px rgba(255, 87, 34, 0.35);
    }
    .wechat-stack {
      position: absolute; left: 80px; top: 900px;
      font-size: 64px; opacity: 0;
    }
    .wechat-note {
      position: absolute; left: 180px; top: 920px;
      font-size: 30px; color: var(--ink-light); opacity: 0;
    }
    .echo {
      position: absolute; left: 0; right: 0; bottom: 400px;
      text-align: center; font-size: 56px; font-weight: 900;
      color: var(--lane-amber-accent); opacity: 0;
    }
    .caption {
      position: absolute; left: 0; right: 0; bottom: 300px;
      text-align: center; font-size: 40px; color: var(--ink-light); opacity: 0;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="lane-header" id="header">
      <div class="tag">SWIMLANE · AMBER</div>
      <div class="name" id="name">📦 贸易公司</div>
      <div class="pain" id="pain">Excel+微信催票</div>
    </div>
    <div class="busy-badge" id="busy">一忙!</div>
    <div class="pipeline" id="pipeline">
      <div class="pipe-line"></div>
      <div class="nodes">
        <div class="stamp-node" id="s1"><div class="stamp">📄</div><div class="stamp-label">开票</div></div>
        <div class="stamp-node" id="s2"><div class="stamp">🔖</div><div class="stamp-label">盖章</div></div>
        <div class="stamp-node" id="s3"><div class="stamp">📋</div><div class="stamp-label">提单</div></div>
        <div class="stamp-node" id="s4"><div class="stamp">🚚</div><div class="stamp-label">发货</div></div>
        <div class="stamp-node" id="s5"><div class="stamp">💰</div><div class="stamp-label">回款</div></div>
      </div>
    </div>
    <div class="wechat-stack" id="wechat">💬💬💬</div>
    <div class="wechat-note" id="wechatNote">催票全靠微信堆</div>
    <div class="echo" id="echo">「一忙就漏」</div>
    <div class="caption" id="caption">节点没人盯就掉</div>
  </div>
  <script>
    const data = window.getData();
    const nodes = data.nodes || [
      { icon: "📄", label: "开票" },
      { icon: "🔖", label: "盖章" },
      { icon: "📋", label: "提单" },
      { icon: "🚚", label: "发货" },
      { icon: "💰", label: "回款" }
    ];
    nodes.forEach((n, i) => {
      const el = document.getElementById("s" + (i + 1));
      if (el) {
        el.querySelector(".stamp").textContent = n.icon;
        el.querySelector(".stamp-label").textContent = n.label;
      }
    });
    if (data.name) document.getElementById("name").textContent = data.name;
    if (data.pain) document.getElementById("pain").textContent = data.pain;
    if (data.echo) document.getElementById("echo").textContent = `「${data.echo.replace(/[「」]/g, "")}」`;
    if (data.caption) document.getElementById("caption").textContent = data.caption;

    const tl = gsap.timeline();
    tl.fromTo("#header", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4 }, 0);
    tl.fromTo("#pipeline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4 }, 0.3);
    tl.fromTo(".stamp-node", { opacity: 0, y: -40, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, stagger: 0.12, ease: "back.out(2)" }, 0.5);
    tl.to(".stamp", { borderColor: "#43a047", duration: 0.15, stagger: 0.1, yoyo: true, repeat: 1 }, 1.5);
    tl.fromTo("#wechat, #wechatNote", { opacity: 0 }, { opacity: 1, duration: 0.35, stagger: 0.1 }, 1.8);

    tl.fromTo("#busy", { opacity: 0, scale: 0.5, rotation: -8 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(3)" }, 2.8);
    tl.to("#busy", { scale: 1.1, duration: 0.12, repeat: 4, yoyo: true }, 3.2);
    tl.to(".stamp-node", {
      y: 200,
      rotation: () => gsap.utils.random(-30, 30),
      opacity: 0.25,
      duration: 0.45,
      stagger: 0.1,
      ease: "power2.in"
    }, 3.5);
    tl.to(".pipe-line", { background: "#ef5350", duration: 0.2 }, 3.6);
    tl.to("#wechat", { x: "+=20", duration: 0.1, repeat: 6, yoyo: true }, 3.8);
    tl.fromTo("#echo", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 4.3);
    tl.fromTo("#caption", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 4.8);
    tl.to("#busy", { opacity: 0.5, duration: 0.3 }, 5.0);
    tl.to({}, { duration: 1.2 }, 5.8);
    registerTimeline(tl);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>01c Reveal</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    .reveal-grid {
      position: absolute;
      left: 60px;
      right: 60px;
      top: 600px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }
    .dot {
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      background: var(--bg-card);
      border: 2px solid var(--gray-4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }
    .dot .core {
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 60px var(--green);
    }
    .reveal-caption {
      position: absolute;
      left: 0;
      right: 0;
      top: 360px;
      text-align: center;
      font-family: var(--sans);
      font-weight: 900;
      font-size: 120px;
      color: #fff;
      letter-spacing: 4px;
      opacity: 0;
    }
    .reveal-caption .num { color: var(--green); }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="reveal-caption" id="caption">
      <span class="num" id="num">0</span> 个 AI
    </div>
    <div class="reveal-grid" id="grid"></div>
  </div>

  <script>
    const data = window.getData();
    const n = data.agent_count || 9;
    const grid = document.getElementById("grid");
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div");
      d.className = "dot";
      d.innerHTML = '<div class="core"></div>';
      grid.appendChild(d);
    }

    const tl = gsap.timeline();
    tl.to("#caption", { opacity: 1, duration: 0.15 }, 0);
    tl.add(window.countUp("#num", 0, n, { duration: 0.4 }), 0.05);
    tl.to(".dot", {
      opacity: 1,
      duration: 0.25,
      stagger: { each: 0.06, from: "center" },
      ease: "back.out(1.6)",
    }, 0.2);
    tl.to({}, { duration: 0.3 }, 1.1);

    registerTimeline(tl);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>01c Reveal</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    .reveal-grid {
      position: absolute;
      left: 60px;
      right: 60px;
      top: 600px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }
    .dot {
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      background: var(--bg-card);
      border: 2px solid var(--gray-4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }
    .dot .core {
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 60px var(--green);
    }
    .reveal-caption {
      position: absolute;
      left: 0;
      right: 0;
      top: 360px;
      text-align: center;
      font-family: var(--sans);
      font-weight: 900;
      font-size: 120px;
      color: #fff;
      letter-spacing: 4px;
      opacity: 0;
    }
    .dot .core-dim {
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: var(--gray-4);
      box-shadow: none;
    }
    .reveal-caption .hit { color: var(--red); font-size: 0.85em; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="reveal-caption" id="caption">
      <span class="num" id="num">0</span><span id="suffix"> 个 AI</span>
    </div>
    <div class="reveal-grid" id="grid"></div>
  </div>

  <script>
    const data = window.getData();
    const n = data.agent_count || 9;
    const lit = data.highlight_count != null ? data.highlight_count : n;
    const countTarget = data.count_target || n;
    const suffix = data.caption_suffix || " 个 AI";
    document.getElementById("suffix").textContent = suffix;

    const grid = document.getElementById("grid");
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div");
      d.className = "dot";
      const cls = i < lit ? "core" : "core-dim";
      d.innerHTML = `<div class="${cls}"></div>`;
      grid.appendChild(d);
    }

    const tl = gsap.timeline();
    tl.to("#caption", { opacity: 1, duration: 0.15 }, 0);
    tl.add(window.countUp("#num", 0, countTarget, { duration: 0.55 }), 0.05);
    tl.to(".dot", {
      opacity: 1,
      duration: 0.22,
      stagger: { each: 0.04, from: "center" },
      ease: "back.out(1.6)",
    }, 0.25);
    if (lit < n) {
      tl.fromTo(".dot .core-dim", { scale: 0.6 }, { scale: 1, duration: 0.35, stagger: 0.02 }, 0.9);
      tl.to(".dot .core", { boxShadow: "0 0 80px rgba(80,250,123,0.9)", duration: 0.25, yoyo: true, repeat: 1 }, 1.1);
    }
    if (data.punch_line) {
      const hit = document.createElement("div");
      hit.className = "hit";
      hit.id = "hit";
      hit.textContent = data.punch_line;
      hit.style.opacity = 0;
      document.getElementById("caption").appendChild(hit);
      tl.fromTo("#hit", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 1.35);
    }
    tl.to({}, { duration: 0.45 }, 1.8);

    registerTimeline(tl);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP07 s2 · 复刻5步卡</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.82),rgba(6,9,14,.72) 40%,rgba(6,9,14,.78) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .card{position:absolute;left:56px;right:56px;top:240px;background:rgba(15,19,26,.96);border:2px solid #2a3038;border-radius:26px;padding:44px 46px;box-shadow:0 40px 100px rgba(0,0,0,.7)}
  .card .h{display:flex;align-items:center;gap:16px;border-bottom:2px solid #2a3038;padding-bottom:24px;margin-bottom:28px}
  .card .h .ic{font-size:52px}.card .h .tt{font-size:52px;font-weight:900;color:var(--green)}
  .card .h .save{margin-left:auto;font-size:30px;color:var(--amber)}
  .st{opacity:0;display:flex;gap:22px;padding:20px 0;border-bottom:1px solid #1c222b}
  .st:last-child{border-bottom:none}
  .st .n{width:56px;height:56px;border-radius:12px;background:rgba(63,185,80,.16);color:var(--green);font-weight:900;font-size:34px;display:grid;place-items:center;flex:none;font-family:"SF Mono",monospace}
  .st .txt{font-size:37px;line-height:1.32;font-weight:700}.st .txt .k{color:var(--muted);font-weight:500}
  .caption{position:absolute;left:52px;right:52px;bottom:170px;text-align:center;font-size:76px;font-weight:900;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--amber)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="card">
      <div class="h"><span class="ic">📋</span><span class="tt">复刻 5 步</span><span class="save">☆ 建议收藏</span></div>
      <div class="st" id="s1"><div class="n">1</div><div class="txt">常驻核心文件(SELF)<span class="k"> · 开工自动注入</span></div></div>
      <div class="st" id="s2"><div class="n">2</div><div class="txt">铁律 + 固化流程<span class="k"> · 提交前挂体检脚本</span></div></div>
      <div class="st" id="s3"><div class="n">3</div><div class="txt">关键纪律用 hooks<span class="k"> · 逃生门先建先测</span></div></div>
      <div class="st" id="s4"><div class="n">4</div><div class="txt">结构人格化成组织<span class="k"> · 只跟 3 个头儿说话</span></div></div>
      <div class="st" id="s5"><div class="n">5</div><div class="txt">report-first + 逃生门<span class="k"> · 留能自救的口子</span></div></div>
    </div>
    <div class="caption" id="cap">5 步,<b>坑我都标好了</b></div>
  </div>
<script>
  const tl=gsap.timeline();
  ["#s1","#s2","#s3","#s4","#s5"].forEach((s,i)=>tl.fromTo(s,{opacity:0,x:-16},{opacity:1,x:0,duration:.38,ease:"power2.out"},0.5+i*0.55));
  tl.fromTo("#cap",{opacity:0,y:24},{opacity:1,y:0,duration:.5,ease:"power3.out"},3.4);
  tl.to({},{duration:1.8},4.4);
  registerTimeline(tl);
</script></body></html>

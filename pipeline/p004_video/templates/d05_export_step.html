<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  body{background:#000;}
  /* 仿微信 PC 端 设置 → 聊天 → 备份与迁移(示意) */
  .pc{position:absolute;top:140px;left:40px;right:40px;height:1180px;
    background:#fafafa;border-radius:24px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;opacity:0;}
  /* 左侧菜单 */
  .side{width:300px;background:#f0f0f0;border-right:1px solid #d8d8d8;padding:24px 0;}
  .side .item{display:flex;align-items:center;gap:14px;padding:18px 24px;font-size:28px;color:#333;}
  .side .item .ic{width:34px;height:34px;border-radius:8px;background:#888;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;}
  .side .item.act{background:#e6e6e6;color:#1a1a1a;font-weight:700;}
  .side .item.act .ic{background:#3a3a3a;}
  /* 右侧内容 */
  .main{flex:1;padding:30px 36px;}
  .main h3{font-size:34px;color:#1a1a1a;margin-bottom:24px;font-weight:700;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:22px 0;
    border-bottom:1px solid #ececec;}
  .row .lbl{font-size:30px;color:#333;}
  .row .val{font-size:28px;color:#888;}
  .row .arr{font-size:30px;color:#bbb;margin-left:12px;}
  .row.hi{background:#fff;border:3px solid #e53935;border-radius:12px;padding:22px 18px;
    margin:14px -10px;}
  .row.hi .lbl{color:#1a1a1a;font-weight:800;}
  .row.hi .val{color:#e53935;font-weight:700;}
  /* 红色批注箭头 */
  .arrow{position:absolute;top:740px;left:760px;font-size:60px;color:#e53935;
    transform:rotate(-25deg);opacity:0;font-weight:900;text-shadow:0 4px 0 #000;}
  .note{position:absolute;top:820px;left:680px;font-size:30px;color:#e53935;font-weight:800;
    background:#fff;padding:8px 18px;border-radius:10px;border:3px solid #e53935;
    transform:rotate(-3deg);opacity:0;letter-spacing:2px;}
  /* 底部大字提示 */
  .punch{position:absolute;left:40px;right:40px;top:1390px;text-align:center;}
  .punch .l1{font-size:84px;font-weight:900;color:#fff;line-height:1.15;letter-spacing:2px;opacity:0;
    text-shadow:0 6px 0 #000,0 18px 38px rgba(0,0,0,.7);}
  .punch .l1 .hi{color:var(--red);}
  .punch .l2{font-size:76px;font-weight:900;color:#fff;line-height:1.15;letter-spacing:2px;
    opacity:0;margin-top:16px;text-shadow:0 6px 0 #000,0 18px 38px rgba(0,0,0,.7);}
  .punch .l2 .hi{color:var(--orange);}
  .wm{position:absolute;top:1830px;right:40px;font-size:22px;color:var(--gray-3);opacity:.55;}
</style></head>
<body>
<div class="canvas">
  <div class="pc" id="pc">
    <div class="side">
      <div class="item"><div class="ic">👤</div>账号与安全</div>
      <div class="item act"><div class="ic">💬</div>聊天</div>
      <div class="item"><div class="ic">🔔</div>消息通知</div>
      <div class="item"><div class="ic">📁</div>文件管理</div>
      <div class="item"><div class="ic">🛡</div>隐私</div>
      <div class="item"><div class="ic">⚙</div>通用设置</div>
    </div>
    <div class="main">
      <h3>聊天设置</h3>
      <div class="row"><div class="lbl">字体大小</div><div class="val">标准 <span class="arr">›</span></div></div>
      <div class="row hi" id="hl">
        <div class="lbl">📦 备份与迁移</div>
        <div class="val">导出聊天记录 <span class="arr">›</span></div>
      </div>
      <div class="row"><div class="lbl">键盘快捷键</div><div class="val">查看 <span class="arr">›</span></div></div>
      <div class="row"><div class="lbl">聊天记录迁移到新设备</div><div class="val">›</div></div>
      <div class="row"><div class="lbl">清空聊天记录</div><div class="val">›</div></div>
    </div>
  </div>
  <div class="arrow" id="arr">↘</div>
  <div class="note" id="note">点这里</div>
  <div class="punch">
    <div class="l1" id="l1">导出近 <span class="hi">90 天</span> 群聊天记录</div>
    <div class="l2" id="l2">贴给 AI <span class="hi">归类 · 统计 · 出表</span></div>
  </div>
  <div class="wm">微信 PC 端 · 设置 → 聊天(示意)</div>
</div>
<script>
  const tl=gsap.timeline({paused:true});
  tl.to("#pc",{opacity:1,duration:.3},0);
  tl.fromTo("#hl",{scale:.97,backgroundColor:"#fff"},{scale:1.02,duration:.3,ease:"power2.out"},1.0);
  tl.to("#hl",{scale:1,duration:.2},1.3);
  tl.fromTo("#arr",{opacity:0,x:30,y:-30},{opacity:1,x:0,y:0,duration:.3,ease:"back.out(2)"},1.4);
  tl.fromTo("#note",{opacity:0,scale:.6,rotation:10},{opacity:1,scale:1,rotation:-3,duration:.35,ease:"back.out(1.8)"},1.6);
  tl.fromTo("#l1",{opacity:0,y:30},{opacity:1,y:0,duration:.4,ease:"power2.out"},2.4);
  tl.fromTo("#l2",{opacity:0,y:30},{opacity:1,y:0,duration:.4,ease:"power2.out"},2.9);
  tl.to({},{duration:.5},3.5);
  registerTimeline(tl);
</script>
</body></html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:1080px; height:1920px; background:transparent !important; overflow:hidden; }
    .sub {
      position:absolute; left:60px; right:60px; bottom:132px; text-align:center;
      font-family:"PingFang SC","Heiti SC",sans-serif; font-weight:900;
      font-size:58px; line-height:1.3; color:#fff; letter-spacing:1px; padding:0 20px;
      text-shadow:-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,4px 4px 0 #000,
        -4px 0 0 #000,4px 0 0 #000,0 -4px 0 #000,0 4px 0 #000,0 0 26px rgba(0,0,0,.95);
      opacity:0;
    }
    .sub.hot { color:#ff5a5f; }
  </style>
</head>
<body>
  <div class="sub" id="sub"></div>
  <script>
    const lines = [
      { t:0.0, end:2.19, text:"上集,我被它骗惨了", hot:0 },
      { t:2.33, end:4.78, text:"这集我不想让它更聪明", hot:0 },
      { t:4.92, end:5.82, text:"我把它当", hot:0 },
      { t:5.96, end:8.15, text:"记不住的员工,来管", hot:1 },
      { t:8.79, end:9.93, text:"被它骗完", hot:0 },
      { t:10.07, end:12.49, text:"我干的第一件蠢事", hot:0 },
      { t:12.63, end:14.73, text:"——再教它一遍", hot:0 },
      { t:14.87, end:16.97, text:"把规矩写进记忆", hot:0 },
      { t:17.11, end:18.25, text:"写得更狠", hot:0 },
      { t:18.39, end:20.49, text:"存了一遍又一遍", hot:1 },
      { t:21.08, end:21.93, text:"结果呢?", hot:0 },
      { t:22.07, end:23.16, text:"它刚,读过", hot:0 },
      { t:23.3, end:23.66, text:"读过", hot:0 },
      { t:23.8, end:25.39, text:"……还是没做到", hot:1 },
      { t:25.53, end:26.38, text:"不是没记", hot:0 },
      { t:26.52, end:28.36, text:"是记了,也不算数", hot:1 },
      { t:29.05, end:30.63, text:"我盯着这句话", hot:0 },
      { t:30.77, end:32.07, text:"突然就通了", hot:0 },
      { t:32.21, end:34.66, text:"靠它自觉记,它会漏", hot:0 },
      { t:34.8, end:36.09, text:"靠我自觉盯", hot:0 },
      { t:36.23, end:37.82, text:"我会累、会忘", hot:0 },
      { t:37.96, end:38.68, text:"这两条", hot:0 },
      { t:38.82, end:40.41, text:"全是人力的路", hot:0 },
      { t:40.55, end:42.99, text:"人力的路,全是死路", hot:1 },
      { t:43.83, end:46.07, text:"唯一活的一条路", hot:0 },
      { t:46.21, end:47.43, text:"——机械", hot:1 },
      { t:47.57, end:49.46, text:"该记得做的事", hot:0 },
      { t:49.6, end:52.18, text:"别留给它记不记得", hot:0 },
      { t:52.32, end:53.2, text:"做成它", hot:0 },
      { t:53.34, end:55.58, text:"绕、不、过、去", hot:1 },
      { t:56.31, end:57.1, text:"红绿灯", hot:0 },
      { t:57.24, end:58.96, text:"不靠司机自觉", hot:0 },
      { t:59.1, end:60.82, text:"机器不戴护具", hot:0 },
      { t:60.96, end:62.68, text:"就不给你启动", hot:0 },
      { t:62.82, end:64.85, text:"管记不住的助理", hot:0 },
      { t:64.99, end:66.09, text:"一模一样", hot:1 },
      { t:66.73, end:67.9, text:"道理是通了", hot:0 },
      { t:68.04, end:69.73, text:"可机械咋落地?", hot:0 },
      { t:69.87, end:71.57, text:"我一动手才发现", hot:0 },
      { t:71.71, end:73.66, text:"第一步不是写代码", hot:1 },
      { t:73.8, end:74.45, text:"是把它", hot:0 },
      { t:74.59, end:76.02, text:"从一坨乱文件", hot:0 },
      { t:76.16, end:78.38, text:"变成我能指挥的团队", hot:0 },
      { t:78.52, end:78.91, text:"下集", hot:0 },
      { t:79.05, end:80.48, text:"我给我的AI", hot:0 },
      { t:80.62, end:81.79, text:"拆了个公司", hot:1 }
    ];
    const sub = document.getElementById("sub");
    const tl = gsap.timeline();
    lines.forEach((line) => {
      tl.call(() => { sub.textContent = line.text; sub.classList.toggle("hot", !!line.hot); }, [], line.t);
      tl.fromTo(sub, { opacity:0, y:8 }, { opacity:1, y:0, duration:0.16 }, line.t);
      tl.to(sub, { opacity:0, duration:0.16 }, line.end - 0.16);
    });
    tl.to({}, { duration:0.05 }, 82.531);
    registerTimeline(tl);
    window.__contentKey = function () {
      const cs = getComputedStyle(sub);
      if (parseFloat(cs.opacity) <= 0.001) return "blank";
      return sub.textContent + "|" + cs.opacity + "|" + cs.transform;
    };
  </script>
</body>
</html>

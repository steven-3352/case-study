<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D02 Review Late</title>
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #f5f0eb; font-family: -apple-system, "PingFang SC", sans-serif; color: #2c2416;
    }
    .card {
      position: absolute; left: 80px; right: 80px; top: 360px;
      background: #fff; border-radius: 28px;
      box-shadow: 0 12px 48px rgba(44,36,22,0.12);
      padding: 48px; opacity: 0; transform: translateY(40px);
    }
    .badge {
      display: inline-block; background: #ffebee; color: #c62828;
      font-size: 28px; font-weight: 700; padding: 8px 20px; border-radius: 8px;
      margin-bottom: 24px; opacity: 0;
    }
    .title { font-size: 40px; font-weight: 800; margin-bottom: 20px; }
    .quote {
      font-size: 34px; color: #5d4037; line-height: 1.5;
      background: #fafafa; padding: 28px; border-radius: 16px; border-left: 6px solid #ef5350;
      opacity: 0;
    }
    .late-line {
      margin-top: 32px; font-size: 32px; color: #8d6e63; opacity: 0;
    }
    .late-line strong { color: #c62828; font-size: 38px; }
    .kicker {
      position: absolute; left: 0; right: 0; bottom: 480px; text-align: center;
      font-size: 48px; font-weight: 800; color: #c62828; opacity: 0;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="badge" id="badge">2天前 · 刚看到</div>
    <div class="title">商家通知 · 新差评</div>
    <div class="quote" id="quote">「上菜慢，等了40分钟」</div>
    <div class="late-line" id="late">客人<strong>早就走了</strong></div>
  </div>
  <div class="kicker" id="kicker">差评发现太晚</div>
  <script>
    const d = window.getData();
    if (d.quote) document.getElementById("quote").textContent = d.quote;
    if (d.kicker) document.getElementById("kicker").textContent = d.kicker;
    const tl = gsap.timeline();
    tl.to("#card", { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.2);
    tl.to("#badge", { opacity: 1, duration: 0.25 }, 0.5);
    tl.fromTo("#badge", { scale: 1.2 }, { scale: 1, duration: 0.2, ease: "elastic.out(1,0.4)" }, 0.55);
    tl.to("#quote", { opacity: 1, duration: 0.35 }, 0.8);
    tl.to("#late", { opacity: 1, duration: 0.3 }, 1.2);
    tl.fromTo("#kicker", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.5)" }, 1.6);
    tl.to({}, { duration: 2.0 }, 2.2);
    registerTimeline(tl);
  </script>
</body>
</html>

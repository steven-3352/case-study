<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0c1322;color:#e7f0ff;}
  .stage{position:absolute;inset:0;}

  /* 背景层：流行「裂开/傻眼」反应贴纸（压灰+虚化+缩小退余光） */
  .meme{position:absolute;top:120px;right:60px;width:300px;height:300px;opacity:0;z-index:1;
    filter:blur(3px) saturate(.45) brightness(.7);transform:scale(.9) rotate(8deg);}
  .meme .face{width:240px;height:240px;border-radius:50%;margin:0 auto;
    background:radial-gradient(circle at 50% 40%,#ffd23f,#f6a623);position:relative;
    box-shadow:0 0 0 10px rgba(255,210,63,.15);}
  /* 裂开效果：贯穿裂缝 */
  .meme .crack{position:absolute;top:0;left:48%;width:8px;height:100%;
    background:linear-gradient(180deg,#0c1322,#3a2a00);clip-path:polygon(0 0,100% 6%,20% 18%,90% 32%,15% 46%,85% 60%,25% 74%,100% 88%,0 100%);}
  .meme .eye{position:absolute;top:90px;width:42px;height:54px;background:#2a1a00;border-radius:50%;}
  .meme .eL{left:48px;} .meme .eR{right:48px;}
  .meme .mouth{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);
    width:96px;height:50px;border:8px solid #2a1a00;border-top:0;border-radius:0 0 60px 60px;}
  .meme .lab{position:absolute;bottom:-6px;left:0;right:0;text-align:center;font-size:34px;font-weight:900;color:#ffd23f;}

  /* 回切：第5天空留资栏（仿真区，与 s1 同物件搭桥） */
  .leadcard{position:absolute;top:300px;left:90px;right:90px;height:520px;z-index:3;
    background:#fff;color:#16213a;border-radius:30px;box-shadow:0 24px 70px rgba(0,0,0,.55);
    overflow:hidden;opacity:0;}
  .leadcard .lab{position:absolute;top:18px;left:20px;font-size:22px;font-weight:800;color:#fff;
    background:#2f6df0;padding:6px 14px;border-radius:8px;z-index:2;}
  .leadcard .wm{position:absolute;top:18px;right:20px;font-size:22px;font-weight:800;color:#0c1322;
    background:rgba(255,209,63,.95);padding:6px 14px;border-radius:8px;letter-spacing:1px;z-index:2;}
  .leadcard h3{padding:70px 36px 10px;font-size:36px;font-weight:900;display:flex;align-items:center;}
  .leadcard h3 .d{font-size:26px;color:#e23744;font-weight:900;margin-left:auto;}
  .leadcard .rows{padding:0 36px;}
  .leadcard .row{height:70px;border-bottom:2px dashed #e2e7ef;display:flex;align-items:center;
    font-size:32px;color:#c2cad6;font-weight:700;letter-spacing:6px;}
  .leadcard .row.filled{color:#16213a;letter-spacing:1px;}
  .leadcard .note{text-align:center;margin-top:14px;font-size:30px;color:#b9c2d0;font-weight:800;}
  .ring{position:absolute;left:24px;right:24px;top:120px;bottom:18px;border:5px solid #ff4d4d;
    border-radius:18px;opacity:0;box-shadow:0 0 0 6px rgba(255,77,77,.18);}

  /* 引流图被放大 + 划走 */
  .pinwrap{position:absolute;top:560px;left:50%;margin-left:-300px;width:600px;height:780px;z-index:4;opacity:0;}
  .pin{width:100%;height:100%;border-radius:30px;overflow:hidden;position:relative;
    background:linear-gradient(160deg,#f6a5c0,#f6d365);box-shadow:0 30px 80px rgba(0,0,0,.6);}
  .pin .tagp{position:absolute;top:26px;left:26px;background:#e60023;color:#fff;font-size:26px;
    font-weight:900;padding:8px 18px;border-radius:999px;}
  .pin .robo{position:absolute;top:26px;right:26px;background:rgba(12,19,34,.7);color:#9fb8dc;
    font-size:24px;font-weight:800;padding:8px 16px;border-radius:10px;}
  .pin .art{position:absolute;top:140px;left:60px;right:60px;height:360px;border-radius:20px;
    background:repeating-linear-gradient(45deg,#fff6,#fff6 22px,#fff3 22px,#fff3 44px);
    display:flex;align-items:center;justify-content:center;font-size:120px;}
  .pin .txt{position:absolute;left:40px;right:40px;bottom:60px;color:#fff;font-size:52px;font-weight:900;
    text-align:center;text-shadow:0 4px 14px rgba(0,0,0,.5);font-family:"Courier New",monospace;letter-spacing:2px;}
  /* 划走手势 */
  .hand{position:absolute;top:50%;left:60%;font-size:120px;opacity:0;z-index:6;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.6));}
  .swoosh{position:absolute;top:48%;left:0;right:0;height:8px;background:linear-gradient(90deg,transparent,#fff,transparent);
    opacity:0;z-index:5;}

  /* 根因大字 */
  .root{position:absolute;left:50px;right:50px;top:1180px;text-align:center;z-index:8;}
  .root .l{display:inline-block;font-size:84px;font-weight:900;line-height:1.2;color:#fff;opacity:0;
    text-shadow:0 5px 0 #07101f,0 16px 34px rgba(0,0,0,.7);
    background:rgba(10,16,30,.42);padding:18px 30px;border-radius:22px;}
  .root .hi{color:#ff5252;}
  .sub{position:absolute;left:50px;right:50px;bottom:300px;text-align:center;z-index:8;
    font-size:40px;font-weight:800;color:#9fb8dc;opacity:0;}
</style></head>
<body>
  <div class="stage">
    <!-- 背景层 流行裂开梗（退余光） -->
    <div class="meme" id="meme"><div class="face"><div class="eye eL"></div><div class="eye eR"></div><div class="mouth"></div><div class="crack"></div></div><div class="lab">裂开了…</div></div>

    <!-- 回切空留资栏（过渡焦点先出） -->
    <div class="leadcard" id="leadcard">
      <div class="lab">真实落地页 · 留资</div><div class="wm">示意数据</div>
      <h3>留资 / 邮箱名单<span class="d">第 5 天</span></h3>
      <div class="rows">
        <div class="row filled">a••••@gmail.com</div>
        <div class="row">_______________</div>
        <div class="row">_______________</div>
        <div class="note">— 曝光涨了，留下来的却寥寥无几 —</div>
      </div>
      <div class="ring" id="ring"></div>
    </div>

    <!-- 引流图（揭根因物件） -->
    <div class="pinwrap" id="pinwrap"><div class="pin" id="pin">
      <div class="tagp">Pin</div><div class="robo">AI 一键出图</div>
      <div class="art">🖼️</div>
      <div class="txt">5 HANDMADE<br>GIFT IDEAS</div>
    </div></div>
    <div class="swoosh" id="swoosh"></div>
    <div class="hand" id="hand">👆</div>

    <div class="sub" id="sub">谁都刷到过 · 手一划就走</div>
    <div class="root"><div class="l" id="rootl">不是系统的事，<br>是<span class="hi">内容太机器</span></div></div>
  </div>

<script>
  const tl=gsap.timeline({paused:true});
  // 20-22s 回切空留资栏 + 红框点空（过渡焦点先出）
  tl.fromTo("#leadcard",{opacity:0,scale:.95,y:20},{opacity:1,scale:1,y:0,duration:.5,ease:"power2.out"},0);
  tl.fromTo("#ring",{opacity:0,scale:1.04},{opacity:1,scale:1,duration:.4,ease:"back.out(2)"},.6);
  // 背景裂开梗轻入（退余光，不抢焦）
  tl.to("#meme",{opacity:.5,duration:.6},.4);
  // 运动路径交接：空栏上移退场 → 引流图被放大入场
  tl.to("#leadcard",{y:-120,opacity:.0,scale:.92,duration:.6,ease:"power2.inOut"},1.8);
  tl.fromTo("#pinwrap",{opacity:0,scale:.7,y:120},{opacity:1,scale:1,y:0,duration:.6,ease:"back.out(1.4)"},2.1);
  // 22-26s 划走/秒滑（机械味，谁都刷过）
  tl.fromTo("#hand",{opacity:0,x:120,y:60,scale:.8},{opacity:1,x:0,y:0,scale:1,duration:.4},3.2);
  tl.fromTo("#sub",{opacity:0,y:16},{opacity:1,y:0,duration:.4},3.3);
  tl.to("#swoosh",{opacity:.9,duration:.12,yoyo:true,repeat:1},3.9);
  tl.to("#hand",{x:-360,duration:.35,ease:"power3.in"},3.95);
  tl.to("#pin",{x:-700,rotation:-6,opacity:.2,duration:.4,ease:"power3.in"},3.98);  // 引流图被划走
  // 26-28s 根因大字（与划走错峰）
  tl.fromTo("#rootl",{opacity:0,y:40,scale:.92},{opacity:1,y:0,scale:1,duration:.5,ease:"back.out(1.5)"},5.3);
  tl.to("#sub",{opacity:0,duration:.3},5.3);
  tl.to({},{duration:.2},8.0);
  if(window.registerTimeline) window.registerTimeline(tl); else tl.play();
</script>
</body></html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP04 s4 · 自动派活</title>
<script src="../shared/gsap.min.js"></script>
<script src="../shared/gsap_helpers.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("ep01f_desk.jpg"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 55% at 50% 40%, rgba(63,185,80,.07), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.8) 0%, rgba(6,9,14,.6) 34%, rgba(6,9,14,.58) 60%, rgba(6,9,14,.9) 88%, rgba(6,9,14,.97) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .me{ position:absolute; left:0; right:0; top:280px; text-align:center; opacity:0; }
  .me .em{ font-size:78px; } .me .lb{ font-size:34px; font-weight:800; color:#c9d1d9; margin-top:2px; }

  .arw{ position:absolute; left:0; right:0; text-align:center; font-size:46px; color:var(--muted); opacity:0; }
  #arw1{ top:470px; }

  .row{ position:absolute; left:56px; right:56px; display:flex; gap:20px; justify-content:center; }
  #heads{ top:560px; }
  #workers{ top:1000px; }
  .card{ flex:1; border-radius:20px; padding:24px 8px; text-align:center; opacity:0;
    box-shadow:0 16px 44px rgba(0,0,0,.5); }
  .card .em{ font-size:56px; } .card .nm{ font-size:34px; font-weight:900; margin-top:8px; }
  .card.h{ background:rgba(19,26,22,.92); border:2px solid rgba(63,185,80,.45); }
  .card.h .nm{ color:var(--green); }
  .card.w{ background:rgba(24,22,16,.92); border:2px solid rgba(210,153,34,.42); }
  .card.w .nm{ color:var(--amber); }

  .auto{ position:absolute; left:0; right:0; top:790px; text-align:center;
    font-size:74px; font-weight:900; color:var(--green); letter-spacing:2px;
    text-shadow:0 4px 22px rgba(0,0,0,.85); opacity:0; }
  .auto .fan{ display:block; font-size:44px; color:var(--muted); letter-spacing:24px; margin-top:8px; }

  .relax{ position:absolute; left:70px; right:70px; top:1230px; text-align:center;
    font-size:56px; font-weight:900; color:#fff; opacity:0; text-shadow:0 4px 20px rgba(0,0,0,.85); }
  .relax b{ color:var(--green); }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="me" id="me"><div class="em">🧑</div><div class="lb">我</div></div>
    <div class="arw" id="arw1">▼ 只跟这仨说话</div>
    <div class="row" id="heads">
      <div class="card h" id="hd0"><div class="em">🧭</div><div class="nm">参谋长</div></div>
      <div class="card h" id="hd1"><div class="em">🗂️</div><div class="nm">前台</div></div>
      <div class="card h" id="hd2"><div class="em">📋</div><div class="nm">项目经理</div></div>
    </div>
    <div class="auto" id="auto">⚡ 自动派活<span class="fan">▼&nbsp;&nbsp;▼&nbsp;&nbsp;▼</span></div>
    <div class="row" id="workers">
      <div class="card w" id="wk0"><div class="em">🔬</div><div class="nm">研究员</div></div>
      <div class="card w" id="wk1"><div class="em">📜</div><div class="nm">史官</div></div>
      <div class="card w" id="wk2"><div class="em">🚪</div><div class="nm">门卫</div></div>
    </div>
    <div class="relax" id="relax">我不用记 · <b>谁管谁</b> ✓</div>
  </div>
<script>
  const tl = gsap.timeline();
  tl.fromTo("#me", { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:0.45, ease:"back.out(2)" }, 0.3);
  tl.fromTo("#arw1", { opacity:0, y:-8 }, { opacity:1, y:0, duration:0.35 }, 1.1);
  ["#hd0","#hd1","#hd2"].forEach((c,i)=>{
    tl.fromTo(c, { opacity:0, y:22, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.4, ease:"back.out(1.7)" }, 1.5 + i*0.25);
  });
  // "自动" 咬重 —— 大字弹入 + 扇形箭头
  tl.fromTo("#auto", { opacity:0, scale:0.7 }, { opacity:1, scale:1, duration:0.5, ease:"back.out(2)" }, 3.8);
  tl.to("#auto", { textShadow:"0 0 34px rgba(63,185,80,.75)", scale:1.06, duration:0.45, yoyo:true, repeat:1, ease:"sine.inOut", transformOrigin:"center" }, 4.3);
  ["#wk0","#wk1","#wk2"].forEach((c,i)=>{
    tl.fromTo(c, { opacity:0, y:24, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.4, ease:"back.out(1.7)" }, 4.6 + i*0.3);
  });
  // 我不用记谁管谁(松口气)
  tl.fromTo("#relax", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 7.2);
  tl.to("#relax b", { scale:1.1, duration:0.45, yoyo:true, repeat:2, ease:"sine.inOut", transformOrigin:"center" }, 7.9);
  tl.to({}, { duration:1.0 }, 9.85);
  registerTimeline(tl);
</script>
</body>
</html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../shared/w30_d04.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>.temp{position:absolute;top:350px;left:80px;width:400px;height:250px;font-size:39px;font-weight:900}.canon{position:absolute;top:760px;left:250px;right:250px;height:290px;border:10px solid var(--d4-green);font-size:43px;font-weight:950;display:grid;place-items:center;text-align:center}.readers{position:absolute;top:1160px;left:90px;right:90px;display:grid;grid-template-columns:1fr 1fr;gap:80px}.reader{padding:35px;border:5px solid #101716;background:#fff;text-align:center;font-size:34px;font-weight:900}.p1{left:320px;top:600px;width:330px;transform:rotate(35deg)}.p2{left:350px;top:1080px;width:250px;transform:rotate(140deg)}.p3{left:530px;top:1080px;width:250px;transform:rotate(40deg)}</style></head><body><div class="canvas"><div class="d4-kicker">修法 · 共同可读面</div><div class="d4-title">把长期结论升格，不让入口各读各的</div><div class="temp node file" id="temp"></div><div class="path p1"></div><div class="canon" id="canon"></div><div class="path p2"></div><div class="path p3"></div><div class="readers" id="readers"></div><div class="subtitle" id="subtitle"></div></div><script>const d=getData(),D=+d.scene_duration||7;temp.textContent=d.temporary;canon.textContent=d.canonical;(d.readers||[]).forEach(x=>{const e=document.createElement('div');e.className='reader';e.textContent=x;readers.appendChild(e)});subtitle.textContent=d.subtitle||'';const tl=gsap.timeline({paused:true}).from('.temp',{x:-70,autoAlpha:0,duration:.4}).from('.p1',{scaleX:0,duration:.5},D*.16).from('.canon',{scale:.7,autoAlpha:0,duration:.4},D*.32).from('.p2,.p3',{scaleX:0,duration:.5,stagger:D*.08},D*.48).from('.reader',{y:50,autoAlpha:0,duration:.35,stagger:D*.1},D*.62).to('.canon',{boxShadow:'0 0 0 14px #138a5b',duration:.3},D*.82).to({},{duration:D},0);registerTimeline(tl)</script></body></html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP07 s4 · 效果(克制)</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("ep01f_desk.jpg");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.84),rgba(6,9,14,.74) 40%,rgba(6,9,14,.8) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .eyebrow{position:absolute;left:52px;right:52px;top:470px;text-align:center;font-size:46px;font-weight:800;color:var(--muted);letter-spacing:2px;opacity:0;font-family:"SF Mono",monospace}
  .rows{position:absolute;left:100px;right:100px;top:620px;display:flex;flex-direction:column;gap:24px}
  .row{opacity:0;display:flex;align-items:center;gap:22px;background:rgba(13,25,17,.7);border:1px solid rgba(63,185,80,.32);border-radius:16px;padding:26px 32px;font-size:40px;font-weight:700}
  .row .ck{width:52px;height:52px;border-radius:50%;background:var(--green);color:#04110a;font-size:32px;display:grid;place-items:center;flex:none}
  .caption{position:absolute;left:52px;right:52px;top:1180px;text-align:center;opacity:0}
  .caption .a{font-size:80px;font-weight:900;line-height:1.2}
  .caption .a .g{color:var(--green)} .caption .a s{text-decoration:none;color:var(--muted)}
  .caption .sub{margin-top:16px;font-size:40px;color:var(--muted);font-weight:700}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="eyebrow" id="eb">// 效果?</div>
    <div class="rows">
      <div class="row" id="r1"><span class="ck">✓</span>体检 全绿 · ERROR 0 WARN 0</div>
      <div class="row" id="r2"><span class="ck">✓</span>结构 零孤立</div>
      <div class="row" id="r3"><span class="ck">✓</span>一天十几次提交 · 零脏改</div>
    </div>
    <div class="caption" id="cap">
      <div class="a">就……这些。是"<span class="g">绿</span>"<s>——不是"炸裂"</s></div>
      <div class="sub">收官不炫成果,这才是可信度</div>
    </div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo(".stage",{scale:1.0},{scale:1.010,duration:10.0,ease:"sine.inOut"},0);
  tl.fromTo("#eb",{opacity:0,y:12},{opacity:1,y:0,duration:.45},0.4);
  ["#r1","#r2","#r3"].forEach((r,i)=>tl.fromTo(r,{opacity:0,x:-14},{opacity:1,x:0,duration:.4,ease:"power2.out"},1.4+i*1.1));
  // 故意压低:caption 慢慢淡入,不砸不弹
  tl.fromTo("#cap",{opacity:0,y:16},{opacity:1,y:0,duration:.7,ease:"power1.out"},6.4);
  tl.to({},{duration:1.0},9.8);
  registerTimeline(tl);
</script></body></html>

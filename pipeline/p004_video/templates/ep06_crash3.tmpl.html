<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP06 s3 · 思源航母送快递</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--amber:#d29922;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"SF Mono","Menlo","PingFang SC",monospace;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.76),rgba(6,9,14,.5) 34%,rgba(6,9,14,.44) 55%,rgba(6,9,14,.88) 82%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .term{position:absolute;left:56px;right:56px;top:300px;background:rgba(13,17,23,.94);border-radius:26px;box-shadow:0 46px 110px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.05),0 1px 0 rgba(255,255,255,.1) inset}
  .titlebar{height:90px;background:rgba(22,27,34,.92);border-bottom:1px solid #21262d;display:flex;align-items:center;padding:0 32px;gap:15px;border-radius:24px 24px 0 0}
  .lights{display:flex;gap:14px}.lights i{width:24px;height:24px;border-radius:50%;display:block}.lights .r{background:#ff5f56}.lights .y{background:#febc2e}.lights .g{background:#27c93f}
  .path{color:var(--muted);font-size:30px;margin-left:16px}
  .body{padding:36px 40px 44px;display:flex;flex-direction:column;gap:20px}
  .l{font-size:36px;line-height:1.3;opacity:0}
  .l .g{color:var(--green)}.l .m{color:var(--muted)}.l .a{color:var(--amber)}
  .l.big{font-size:44px;font-weight:900;color:#ffb3b5}
  .l.commit{background:rgba(229,72,77,.1);border-left:5px solid var(--red);padding:16px 20px;border-radius:0 12px 12px 0;font-size:34px}
  .l.commit .h{color:var(--amber)} .l.commit em{color:var(--red);font-style:normal;font-weight:900}
  .caption{position:absolute;left:52px;right:52px;bottom:180px;text-align:center;font-size:96px;font-weight:900;letter-spacing:4px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0;font-family:"PingFang SC","Heiti SC",sans-serif}
  .caption b{color:var(--red)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="term"><div class="titlebar"><div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="path">claude ~/大脑 · 翻车③</div></div>
      <div class="body">
        <div class="l" id="l0"><span class="m">// 为了"把大脑可视化"</span></div>
        <div class="l" id="l1"><span class="g">$</span> docker compose up 思源笔记 <span class="a">·· 容器/镜像/导入</span></div>
        <div class="l" id="l2"><span class="g">✓</span> 全跑通了 · 图也看上了</div>
        <div class="l big" id="l3">⏺ 才反应过来:航母,送快递。</div>
        <div class="l commit" id="l4"><span class="h">f44a8d5</span> <em>清退</em> — 思源整条清除(入口+地盘+docker)</div>
      </div>
    </div>
    <div class="caption" id="cap">全,<b>删</b>。</div>
  </div>
<script>
  const tl=gsap.timeline();
  ["#l0","#l1","#l2"].forEach((l,i)=>tl.fromTo(l,{opacity:0,y:12},{opacity:1,y:0,duration:.35},0.4+i*0.6));
  tl.fromTo("#l3",{opacity:0,y:14,scale:.97},{opacity:1,y:0,scale:1,duration:.45,ease:"back.out(1.5)"},2.6);
  tl.fromTo("#l4",{opacity:0,x:-14},{opacity:1,x:0,duration:.45,ease:"power2.out"},3.6);
  tl.to("#l4",{boxShadow:"0 0 40px rgba(229,72,77,.3)",duration:.4},3.9);
  tl.fromTo("#cap",{opacity:0,scale:2,y:-30},{opacity:1,scale:1,y:0,duration:.5,ease:"power4.in"},4.5);
  tl.to("#cap",{scale:1.06,duration:.1,yoyo:true,repeat:1},5.0);
  tl.to({},{duration:1.4},5.5);
  registerTimeline(tl);
</script></body></html>

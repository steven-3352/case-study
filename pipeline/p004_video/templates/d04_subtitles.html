<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Subtitle Overlay · W27D04</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    html, body, .canvas { background: transparent !important; }
    .sub-line {
      position: absolute;
      left: 60px; right: 60px;
      bottom: 240px;
      text-align: center;
      font-family: var(--sans);
      font-weight: 900;
      font-size: 46px;
      line-height: 1.3;
      color: #fff;
      letter-spacing: 1px;
      text-shadow:
        -4px -4px 0 #000, 4px -4px 0 #000,
        -4px 4px 0 #000, 4px 4px 0 #000,
        -4px 0 0 #000, 4px 0 0 #000,
        0 -4px 0 #000, 0 4px 0 #000,
        0 0 24px rgba(0,0,0,.95);
      opacity: 0;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="sub-line" id="sub"></div>
  </div>
  <script>
    // W27D04 底部跟读字幕 · 按实测 VO 时间码(seg_timing_d04.json) · 总时长 48.9s
    const lines = [
      { t: 0.0,   end: 4.0,   text: "我做 AI 内容 4 周,粉丝几乎没动过" },
      { t: 4.14,  end: 9.10,  text: "但今早 3 个老板私信我:能给我店里也做一套吗?" },
      { t: 9.31,  end: 13.50, text: "你可能想笑——自己都做不起来,凭啥收钱?" },
      { t: 13.69, end: 17.10, text: "我反过来想:我已经扑得很彻底" },
      { t: 17.20, end: 21.40, text: "每个坑我都精确知道在哪 · 这是花钱买不到的清单" },
      { t: 21.60, end: 25.90, text: "4 周 · AI 全自动出片 · 一条不到 3 块" },
      { t: 26.13, end: 30.50, text: "我开 3 档:99 一月 4 条 · 299 一月 14 条" },
      { t: 30.60, end: 34.20, text: "599 一月 14 条加周复盘" },
      { t: 34.30, end: 37.90, text: "14 条交付不行你说停,剩下原路退" },
      { t: 38.0,  end: 40.80, text: "但我不知道有没有人愿意付" },
      { t: 41.36, end: 44.50, text: "评论扣档位号 0/99/299/599" },
      { t: 44.60, end: 48.50, text: "扣 10 个 · 我免费做 3 个 demo" }
    ];
    const sub = document.getElementById("sub");
    const tl = gsap.timeline();
    lines.forEach((line) => {
      tl.call(() => { sub.textContent = line.text; }, [], line.t);
      tl.fromTo(sub, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.16 }, line.t);
      tl.to(sub, { opacity: 0, duration: 0.16 }, line.end - 0.16);
    });
    tl.to({}, { duration: 0.05 }, 48.9);
    registerTimeline(tl);

    // 截帧去重钩子(复用今日 8e13d3c 优化)
    window.__contentKey = function () {
      const cs = getComputedStyle(sub);
      if (parseFloat(cs.opacity) <= 0.001) return "blank";
      return sub.textContent + "|" + cs.opacity + "|" + cs.transform;
    };
  </script>
</body>
</html>

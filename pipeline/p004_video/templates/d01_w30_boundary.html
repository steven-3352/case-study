<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>W30D01 决策边界</title><link rel="stylesheet" href="../shared/w30_evidence.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
 .head{position:absolute;left:65px;right:65px;top:105px;text-align:center;font-size:58px;line-height:1.2;font-weight:950}.fork{position:absolute;left:65px;right:65px;top:400px;height:820px}.stem{position:absolute;left:50%;top:0;width:8px;height:150px;background:var(--ink)}.branch{position:absolute;top:145px;width:48%;height:610px;padding:48px 38px;border:4px solid var(--line);background:var(--surface)}.branch.left{left:0;border-top-color:var(--red)}.branch.right{right:0;border-top-color:var(--green)}.symbol{font-size:88px;font-weight:950}.left .symbol{color:var(--red)}.right .symbol{color:var(--green)}.branch h2{font-size:44px;line-height:1.3;margin:28px 0}.branch p{font-size:31px;line-height:1.55;color:var(--muted)}.action{position:absolute;left:38px;right:38px;bottom:45px;padding:22px;text-align:center;font-size:38px;font-weight:950;color:#fff}.left .action{background:var(--red)}.right .action{background:var(--green)}
</style></head><body><div class="canvas"><div class="head">AI 负责挑刺<br><span class="red">不负责替你拍板</span></div><div class="fork"><div class="stem"></div><section class="branch left"><div class="symbol">!</div><h2 id="high"></h2><p>代价高、难反悔。先把失败前提暴露出来，再决定。</p><div class="action">先挑刺</div></section><section class="branch right"><div class="symbol">↻</div><h2 id="test"></h2><p>成本低、能回头。别陷在分析里，用行动拿证据。</p><div class="action">先行动</div></section></div><div class="subtitle" id="subtitle"></div></div>
<script>
 const d=getData(),D=Math.max(2,Number(d.scene_duration)||4);high.textContent=(d.high_stake||"辞职/借钱：先挑刺").split("：")[0];test.textContent=(d.reversible_test||"低成本小试：先行动").split("：")[0];subtitle.textContent=d.subtitle||"大赌先挑刺，能反悔的小试先做再说。";
 const tl=gsap.timeline({paused:true,defaults:{ease:"power2.out"}});tl.fromTo(".stem",{scaleY:0},{scaleY:1,duration:.28},0).fromTo(".left",{x:130,autoAlpha:0},{x:0,autoAlpha:1,duration:.4},.18).fromTo(".right",{x:-130,autoAlpha:0},{x:0,autoAlpha:1,duration:.4},.35).fromTo(".action",{scaleX:0},{scaleX:1,duration:.28,stagger:.15},.7).to({}, {duration:D},0);registerTimeline(tl);
</script></body></html>

<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>EP03 s3 · 两条死路</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--red:#e5484d}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("ep01f_desk.jpg");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.78),rgba(6,9,14,.6) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .split{position:absolute;left:52px;right:52px;top:430px;display:flex;gap:28px;height:560px}
  .card{flex:1;border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px;background:rgba(20,24,30,.94);border:3px solid #2a3038;box-shadow:0 30px 80px rgba(0,0,0,.6);opacity:0;position:relative}
  .card .lbl{color:var(--muted);font-size:36px;margin-bottom:16px;font-family:"SF Mono",monospace}
  .card .who{font-size:96px;font-weight:900;margin-bottom:8px}
  .card .desc{color:var(--muted);font-size:36px}
  .card .x{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:340px;color:var(--red);font-weight:900;opacity:0;line-height:1}
  .caption{position:absolute;left:52px;right:52px;top:1070px;font-size:84px;font-weight:900;line-height:1.16;letter-spacing:1px;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--red)}
  .stampzone{position:absolute;left:50%;top:1250px;transform:translateX(-50%);width:240px;height:240px}
  .stamp{position:absolute;inset:0;transform-origin:center;border:11px solid var(--red);color:var(--red);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:70px;font-weight:900;background:rgba(6,8,12,.6);box-shadow:0 0 34px rgba(229,72,77,.25);opacity:0;transform:rotate(-10deg)}
</style></head>
<body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="split" id="split">
      <div class="card" id="c1"><div class="lbl">路 一</div><div class="who">它</div><div class="desc">靠它自觉记</div><div class="x" id="x1">✗</div></div>
      <div class="card" id="c2"><div class="lbl">路 二</div><div class="who">我</div><div class="desc">靠我自觉盯</div><div class="x" id="x2">✗</div></div>
    </div>
    <div class="caption" id="cap">两条<b>人力</b>的路 ——</div>
    <div class="stampzone"><div class="stamp" id="stamp">死路</div></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo("#split",{scale:1.0},{scale:1.013,duration:14.0,ease:"sine.inOut"},0);
  // 路一:靠它自觉记 → 会漏
  tl.fromTo("#c1",{opacity:0,x:-30},{opacity:1,x:0,duration:.45,ease:"back.out(1.4)"},1.0);
  tl.fromTo("#x1",{opacity:0,scale:2.4,rotation:-20},{opacity:.92,scale:1,rotation:-8,duration:.4,ease:"back.out(2)"},3.5);
  // 路二:靠我自觉盯 → 会累会忘
  tl.fromTo("#c2",{opacity:0,x:30},{opacity:1,x:0,duration:.45,ease:"back.out(1.4)"},4.5);
  tl.fromTo("#x2",{opacity:0,scale:2.4,rotation:20},{opacity:.92,scale:1,rotation:8,duration:.4,ease:"back.out(2)"},6.5);
  // 两条人力的路
  tl.fromTo("#cap",{opacity:0,y:30},{opacity:1,y:0,duration:.5,ease:"power3.out"},8.5);
  // 死路戳(顿悟)
  const S=11.0;
  tl.set("#stamp",{opacity:0,scale:3,rotation:-24,yPercent:-140},S);
  tl.to("#stamp",{opacity:1,duration:.12},S);
  tl.to("#stamp",{scale:1.06,rotation:-9,yPercent:0,duration:.34,ease:"power4.in"},S+.12);
  tl.to("#stamp",{scale:.9,duration:.08,ease:"power2.out"},S+.46);
  tl.to("#stamp",{scale:1,duration:.28,ease:"back.out(2.2)"},S+.54);
  tl.to("#split",{x:"+=8",duration:.05,repeat:5,yoyo:true},S+.46);tl.set("#split",{x:0},S+.46+.05*6);
  tl.to("#stamp",{scale:1.04,duration:.14,yoyo:true,repeat:1,ease:"sine.inOut"},S+1.1);
  tl.to({},{duration:1.6},14.0);
  registerTimeline(tl);
</script>
</body></html>

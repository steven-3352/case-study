<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP07 s1 · 回望弧线</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950;--red:#e5484d;--amber:#d29922}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("ep01f_desk.jpg");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.78),rgba(6,9,14,.6) 40%,rgba(6,9,14,.72) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .arc{position:absolute;left:56px;right:56px;top:430px;display:flex;flex-direction:column;gap:22px}
  .step{opacity:0;display:flex;align-items:center;gap:22px;font-size:42px}
  .step .n{width:70px;height:70px;border-radius:14px;display:grid;place-items:center;font-size:40px;flex:none;background:rgba(255,255,255,.06);border:1px solid #2a3038}
  .step .t{color:var(--muted)} .step.now .t{color:var(--green);font-weight:900}
  .step .a{margin:0 8px;color:var(--amber)}
  .caption{position:absolute;left:52px;right:52px;top:1180px;text-align:center;font-size:78px;font-weight:900;line-height:1.18;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--green)} .caption s{text-decoration:none;color:var(--red)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <div class="arc">
      <div class="step" id="p1"><div class="n">😵</div><div class="t">被它骗</div><span class="a">→</span><div class="t">症状 / 背叛</div></div>
      <div class="step" id="p2"><div class="n">💡</div><div class="t">想通</div><span class="a">→</span><div class="t">机械 &gt; 自觉</div></div>
      <div class="step" id="p3"><div class="n">🛠️</div><div class="t">搭团队</div><span class="a">→</span><div class="t">分工 + 上锁</div></div>
      <div class="step" id="p4"><div class="n">🚗</div><div class="t">翻了一路的车</div></div>
      <div class="step now" id="p5"><div class="n">✅</div><div class="t">现在 · 像个能用的助理了</div></div>
    </div>
    <div class="caption" id="cap">你也想搞一个?<br><b>我把路,给你铺平</b></div>
  </div>
<script>
  const tl=gsap.timeline();
  tl.fromTo(".stage",{scale:1.0},{scale:1.012,duration:14.43,ease:"sine.inOut"},0);
  ["#p1","#p2","#p3","#p4","#p5"].forEach((p,i)=>tl.fromTo(p,{opacity:0,x:-26},{opacity:1,x:0,duration:.45,ease:"power2.out"},[0.4,1.8,4.2,6.3,8.6][i]));
  tl.to("#p5 .t",{color:"#3fb950",duration:.5},9.0);
  tl.fromTo("#cap",{opacity:0,y:26},{opacity:1,y:0,duration:.55,ease:"power3.out"},11.2);
  tl.to("#cap b",{scale:1.05,duration:.6,yoyo:true,repeat:1,ease:"sine.inOut",transformOrigin:"center"},11.9);
  tl.to({},{duration:1.0},14.23);
  registerTimeline(tl);
</script></body></html>

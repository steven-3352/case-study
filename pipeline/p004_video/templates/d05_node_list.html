<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D05 Node List</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    .quote {
      position: absolute;
      left: 0;
      right: 0;
      top: 260px;
      text-align: center;
      font-size: 48px;
      font-weight: 800;
      color: var(--orange);
      opacity: 0;
      padding: 0 50px;
    }
    .win {
      position: absolute;
      left: 36px;
      right: 36px;
      top: 400px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0,0,0,.7);
    }
    .toolbar {
      height: 68px;
      background: #217346;
      display: flex;
      align-items: center;
      padding: 0 24px;
      color: #fff;
      font-size: 28px;
      font-weight: 600;
    }
    .sheet {
      background: #fff;
      color: #333;
      font-family: var(--mono);
      font-size: 24px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      border-bottom: 1px solid #e0e0e0;
      opacity: 0;
    }
    .cell {
      padding: 16px 12px;
      border-right: 1px solid #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
    }
    .head { background: #f3f3f3; font-weight: 800; }
    .head.due { background: #ffebee; color: var(--red); }
    .cell.due { transition: background 0.2s; }
    .cell.due.over { background: #ffcdd2; color: #b71c1c; font-weight: 800; }
    .cell.status { color: #888; font-style: italic; }
    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 440px;
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      color: var(--gray-2);
      opacity: 0;
      padding: 0 50px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="quote" id="quote">开票 · 盖章 · 提单 · 付款</div>
    <div class="win mac-window" id="win">
      <div class="toolbar">📋 跟单节点表.xlsx</div>
      <div class="sheet">
        <div class="row head">
          <div class="cell">节点</div>
          <div class="cell">责任人</div>
          <div class="cell due">到期日</div>
          <div class="cell">状态</div>
        </div>
        <div id="rows"></div>
      </div>
    </div>
    <div class="caption" id="caption">节点散聊天 · 无统一到期</div>
  </div>
  <script>
    const data = window.getData();
    const nodes = data.nodes || [
      { name: "开票", owner: "张总", due: "3/18", status: "待办" },
      { name: "盖章", owner: "李总", due: "3/19", status: "已催" },
      { name: "提单", owner: "货代", due: "3/20", status: "待办" },
      { name: "付款", owner: "财务", due: "3/21", status: "待办" }
    ];
    if (data.caption) document.getElementById("caption").textContent = data.caption;

    const rowsEl = document.getElementById("rows");
    nodes.forEach((n) => {
      const r = document.createElement("div");
      r.className = "row";
      r.innerHTML = `<div class="cell">${n.name}</div><div class="cell">${n.owner}</div><div class="cell due">${n.due}</div><div class="cell status">${n.status}</div>`;
      rowsEl.appendChild(r);
    });

    const tl = gsap.timeline();
    tl.to("#quote", { opacity: 1, duration: 0.35 }, 0);
    tl.fromTo("#win", { opacity: 0, scale: 0.75, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 0.3);
    tl.to(".row", { opacity: 1, duration: 0.22, stagger: 0.1 }, 0.7);
    tl.to(".cell.due", {
      backgroundColor: "#ff5252",
      color: "#fff",
      duration: 0.3,
      stagger: 0.12,
      onStart: function() { this.targets().forEach(el => el.classList.add("over")); }
    }, 1.6);
    tl.to(".head.due", { backgroundColor: "#ff5252", color: "#fff", duration: 0.25, yoyo: true, repeat: 2 }, 2.0);
    tl.fromTo("#caption", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4 }, 2.5);
    tl.to("#win", { x: "+=6", duration: 0.05, repeat: 4, yoyo: true, ease: "rough({ strength: 2 })" }, 2.6);
    tl.to({}, { duration: 0.8 }, 3.2);
    registerTimeline(tl);
  </script>
</body>
</html>

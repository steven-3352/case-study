<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared/w30_d03.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    .gate{position:absolute;top:300px;left:60px;right:60px;height:800px;border:16px solid var(--d3-blue);border-bottom-width:42px}
    .gate:before,.gate:after{content:'';position:absolute;top:0;bottom:0;width:14px;background:var(--d3-blue)}
    .gate:before{left:32%}.gate:after{right:32%}
    .qs{position:absolute;top:390px;left:80px;right:80px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
    .q{height:230px;padding:35px;background:#fff;border:4px solid #111;font-size:39px;font-weight:900;display:flex;align-items:center}
    .token{left:503px;top:1080px}
  </style>
</head>
<body>
  <div class="canvas">
    <div class="d3-kicker">01 / 03</div><div class="d3-title" id="title"></div>
    <div class="gate"></div><div class="qs" id="qs"></div><div class="d3-token token"></div>
    <div class="d3-note">先把生存事实说清楚，建议才有地面。</div><div class="subtitle" id="subtitle"></div>
  </div>
  <script>
    const d=getData(),D=+d.scene_duration||6;
    title.textContent=d.gate;
    (d.questions||[]).forEach(x=>{const e=document.createElement('div');e.className='q';e.textContent=x;qs.appendChild(e)});
    subtitle.textContent=d.subtitle||'';
    const tl=gsap.timeline({paused:true})
      .from('.gate',{scaleY:.1,transformOrigin:'bottom',duration:.45})
      .from('.q',{y:35,autoAlpha:0,duration:.25,stagger:.45},.45)
      .fromTo('.token',{y:100,autoAlpha:0},{y:-720,autoAlpha:1,duration:Math.max(2,D-1.2),ease:'none'},.9);
    gsap.utils.toArray('.q').forEach((el,i)=>{
      const t=.9+i*(D-1.4)/4;
      tl.to(el,{backgroundColor:'#fff1a8',scale:1.035,duration:.18},t)
        .to(el,{backgroundColor:'#fff',scale:1,duration:.18},t+Math.max(.65,(D-1.8)/5));
    });
    tl.to({},{duration:D},0);registerTimeline(tl);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>EP04 s3 · 组织树</title>
<script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#e6edf3;--muted:#8b949e;--green:#3fb950}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:"PingFang SC","Heiti SC","SF Mono",sans-serif;color:var(--ink)}
  .stage{position:relative;width:1080px;height:1920px;background-image:url("__DESK_B64__");background-size:cover;background-position:center 62%}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,14,.82),rgba(6,9,14,.72) 40%,rgba(6,9,14,.78) 70%,rgba(6,9,14,.96))}
  .noise{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  svg{position:absolute;left:0;top:180px;width:1080px;height:1000px}
  .edge{stroke:rgba(63,185,80,.35);stroke-width:2;opacity:0}
  .node{fill:#8b949e;opacity:0}
  .hub{fill:var(--green)}
  .counter{position:absolute;left:52px;right:52px;top:1210px;text-align:center;font-family:"SF Mono",monospace;font-size:46px;color:var(--muted);opacity:0}
  .counter b{color:var(--green);font-size:60px}
  .caption{position:absolute;left:52px;right:52px;bottom:180px;text-align:center;font-size:74px;font-weight:900;line-height:1.2;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.85);opacity:0}
  .caption b{color:var(--green)}
</style></head><body>
  <div class="stage"><div class="scrim"></div><div class="noise"></div>
    <svg id="svg" viewBox="0 0 1080 1000"><g id="edges"></g><g id="nodes"></g></svg>
    <div class="counter" id="counter">节点 <b id="cn">0</b> · 连线 <b id="ce">0</b> · <span style="color:var(--green)">零孤立</span></div>
    <div class="caption" id="cap">它<b>自己长出</b>的组织架构</div>
  </div>
<script>
  const NS="http://www.w3.org/2000/svg";
  const hubs=[[300,300],[780,320],[540,620]];
  const nodes=hubs.slice();
  for(let i=0;i<22;i++){
    const h=hubs[i%3]; const ang=(i*47)%360*Math.PI/180; const r=140+((i*53)%180);
    nodes.push([Math.max(60,Math.min(1020,h[0]+Math.cos(ang)*r)), Math.max(60,Math.min(940,h[1]+Math.sin(ang)*r))]);
  }
  const edgesG=document.getElementById("edges"), nodesG=document.getElementById("nodes");
  const edgeEls=[];
  nodes.forEach((n,i)=>{
    if(i>=3){ const h=hubs[i%3];
      const e=document.createElementNS(NS,"line"); e.setAttribute("x1",h[0]);e.setAttribute("y1",h[1]);e.setAttribute("x2",n[0]);e.setAttribute("y2",n[1]);e.setAttribute("class","edge");
      edgesG.appendChild(e); edgeEls.push(e);
    }
  });
  // 补几条枢纽互连
  [[0,1],[1,2],[0,2]].forEach(([a,b])=>{const e=document.createElementNS(NS,"line");e.setAttribute("x1",hubs[a][0]);e.setAttribute("y1",hubs[a][1]);e.setAttribute("x2",hubs[b][0]);e.setAttribute("y2",hubs[b][1]);e.setAttribute("class","edge");e.setAttribute("stroke-width","4");edgesG.appendChild(e);edgeEls.push(e);});
  const nodeEls=nodes.map((n,i)=>{const c=document.createElementNS(NS,"circle");c.setAttribute("cx",n[0]);c.setAttribute("cy",n[1]);c.setAttribute("r",i<3?26:13);c.setAttribute("class","node"+(i<3?" hub":""));nodesG.appendChild(c);return c;});
  const tl=gsap.timeline();
  tl.to(nodeEls,{opacity:1,duration:.25,stagger:.05,ease:"back.out(2)"},0.3);
  tl.to(edgeEls,{opacity:1,duration:.3,stagger:.03},0.9);
  tl.to("#counter",{opacity:1,duration:.4},2.2);
  tl.add(window.countUp("#cn",0,25,{duration:.9}),2.3);
  tl.add(window.countUp("#ce",0,72,{duration:.9}),2.3);
  tl.fromTo("#cap",{opacity:0,y:26},{opacity:1,y:0,duration:.5,ease:"power3.out"},3.4);
  tl.to({},{duration:1.6},4.6);
  registerTimeline(tl);
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>W30D02 双轮证据</title><link rel="stylesheet" href="../shared/w30_evidence.css"><script src="../shared/gsap.min.js"></script><script src="../shared/gsap_helpers.js"></script><style>

const d=getData(),D=Math.max(5,Number(d.scene_duration)||7);conclusion.textContent=d.conclusion||"稳定的是：失败原因 → 依据";qualifier.textContent=d.qualifier||"具体原因与排序不完全一致·不代表提高准确率";subtitle.textContent=d.subtitle||"两轮不同，但组织方式一样。";(d.rounds||[]).forEach((x,i)=>{const e=document.createElement('section');e.className='ticket';e.innerHTML=`<b>${x}</b><code>SHA256 ${(d.hashes||[])[i]||'待核'}</code>`;tickets.appendChild(e)});const tl=gsap.timeline({paused:true,defaults:{ease:'power2.out'}}).fromTo('.ticket',{y:-55,autoAlpha:0},{y:0,autoAlpha:1,duration:.35,stagger:.55},0).to('.ticket:first-child',{x:24,duration:.28},Math.max(1.7,D*.34)).to('.ticket:last-child',{x:-24,duration:.28},Math.max(1.7,D*.34)).fromTo('.flow',{scaleY:0},{scaleY:1,duration:.3},Math.max(2.7,D*.5)).fromTo('.conclusion',{y:28,autoAlpha:0},{y:0,autoAlpha:1,duration:.32},Math.max(3.7,D*.67)).fromTo('.qualifier',{y:8,autoAlpha:0},{y:0,autoAlpha:1,duration:.25},Math.max(4.8,D-.65)).to({},{duration:D},0);registerTimeline(tl);

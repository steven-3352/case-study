<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>07 Disclaimer · 免责声明</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <style>
    body { background: var(--paper-dark); }
    .canvas { background-color: var(--paper-dark); }

    .stamp-top {
      position: absolute;
      top: 360px;
      left: 0; right: 0;
      text-align: center;
      opacity: 0;
    }
    .warn-stamp {
      display: inline-block;
      border: 8px double var(--ink-red);
      color: var(--ink-red);
      padding: 20px 48px;
      font-family: var(--kai);
      font-weight: 900;
      font-size: 64px;
      letter-spacing: 12px;
      transform: rotate(-2.5deg);
      opacity: 0.9;
    }

    .head {
      position: absolute;
      left: 60px;
      right: 60px;
      top: 540px;
      text-align: center;
      font-family: var(--serif);
      font-weight: 900;
      font-size: 130px;
      line-height: 1.1;
      letter-spacing: -2px;
      color: var(--ink-black);
      opacity: 0;
    }
    .head .strong {
      color: var(--ink-red);
      border-bottom: 10px solid var(--ink-red);
      padding-bottom: 4px;
    }

    .list {
      position: absolute;
      left: 100px;
      right: 100px;
      top: 1000px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .list-item {
      background: var(--paper);
      border-left: 10px solid var(--ink-red);
      padding: 24px 36px;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 56px;
      color: var(--ink-black);
      line-height: 1.3;
      box-shadow: 4px 6px 0 rgba(0,0,0,0.15);
      opacity: 0;
    }
    .list-item:nth-child(1) { transform: rotate(-1deg); }
    .list-item:nth-child(2) { transform: rotate(0.7deg); }
    .list-item:nth-child(3) { transform: rotate(-0.5deg); }

    .list-item .key {
      color: var(--ink-red);
      font-family: var(--serif);
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="canvas">

    <div class="stamp-top" id="stamp">
      <span class="warn-stamp">⚠ 注意</span>
    </div>

    <div class="head" id="head">
      本视频不构成<br><span class="strong">健康建议</span>
    </div>

    <div class="list" id="list"></div>
  </div>

  <script>
    const data = window.getData();
    if (data.title && data.title_strong) {
      document.getElementById("head").innerHTML =
        data.title + '<br><span class="strong">' + data.title_strong + '</span>';
    }

    const list = document.getElementById("list");
    const items = data.list_items || [
      "孕产期 · 请咨询医生",
      "长期服药 · 请咨询医生",
      "成分对照见包装实物",
    ];
    items.forEach(text => {
      const div = document.createElement("div");
      div.className = "list-item";
      // "· 前后" 拆分,前半 key 后半 normal
      if (text.includes("·")) {
        const parts = text.split("·").map(s => s.trim());
        div.innerHTML = '<span class="key">' + parts[0] + '</span> · ' + parts[1];
      } else {
        div.textContent = text;
      }
      list.appendChild(div);
    });

    const tl = gsap.timeline();

    // 0.0 ⚠ 注意 印章
    tl.fromTo("#stamp",
      { opacity: 0, scale: 1.5 },
      { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 0);

    // 0.4 head 浮入
    tl.fromTo("#head",
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.4);

    // 1.0 起 · 列表 stagger
    const items_el = document.querySelectorAll(".list-item");
    items_el.forEach((el, i) => {
      const baseRot = [-1, 0.7, -0.5][i] || 0;
      tl.fromTo(el,
        { opacity: 0, x: -40, rotate: baseRot - 3 },
        { opacity: 1, x: 0, rotate: baseRot, duration: 0.4, ease: "power2.out" },
        1.0 + i * 0.4);
    });

    // 锁尾
    tl.to({}, { duration: 0.5 }, 3.0);

    registerTimeline(tl);
  </script>
</body>
</html>

    template: "01_hook_throw.html"
    duration: 4.0
    start_at: 0.0
    data:
      headline_top: "我把家里那瓶"
      headline_mid: "维生素胶囊"
      headline_bot: "扔了"
      sticky_note: "放了半年 · 还剩 78 粒"

  - id: "02_pain"
    template: "02_pain_pill.html"
    duration: 4.5
    start_at: 4.0
    data:
      lead: "不是吃不下"
      kicker: "是不愿吃"
      hand_note: "大男人吞胶囊总有种 病人感"

  - id: "03_switch"
    template: "03_switch_to_chew.html"
    duration: 5.0
    start_at: 8.5

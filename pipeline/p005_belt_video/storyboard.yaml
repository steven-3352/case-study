        - { name: "维生素 E",   latin: "Tocopherol",    note: "" }
        - { name: "复合 VB",    latin: "B-Complex",     note: "" }
        - { name: "葡萄籽提取", latin: "Grape Seed",    note: "OPC" }
      disclaimer: "成分名公开 · 含量见包装"

  - id: "05_price"
    template: "05_price_split.html"
    duration: 6.0
    start_at: 20.0
    data:
      total_yuan: "39"
      total_cents: "99"
      tablets: "60"
      per_day_yuan: "0.67"
      compare_text: "一杯瑞幸的 1/15"


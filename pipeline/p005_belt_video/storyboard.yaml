# P005 · 男士复合维生素咀嚼片 · v0 分镜
#
# 视觉路线: 杂志拼贴风 (反 P004 黑底霓虹的 AI 味)
# 关键约束:
#   1. 商品视为普通食品 (蓝帽子未确认) — 全程零功效声称
#   2. v0 不出镜 — 全屏纸面 + 商品图 + 文字
#   3. 偏轴/字体 mix/纸纹 — 写在 shared/style.css 里,模板继承

video:
  width: 1080
  height: 1920
  fps: 30
  output_name: p005_belt_v0.mp4
  voice_volume: 1.0
  music_volume: 0.07   # 带货比演示型更安静,口播为王

scenes:

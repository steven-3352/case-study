# Edge TTS 配置 · 默认口播方案
# 2026-06-16 起放弃自研声音克隆，见 docs/DECISIONS.md Q7

# 口播 provider：edge（免费保底）| volcengine（火山/豆包）| minimax（海螺）
# 凭证写在仓库根目录 .env（见 .env.example），脚本启动时自动加载：
#   volcengine: VOLC_TTS_APPID + VOLC_TTS_TOKEN + VOLC_TTS_BASE_URL（中转，可选）
#   minimax:    MINIMAX_API_KEY + MINIMAX_BASE_URL（中转）+ MINIMAX_GROUP_ID（可选）
#   author:     ANTHROPIC_API_KEY + ANTHROPIC_BASE_URL（中转，可选）
provider: minimax

voice: zh-CN-YunjianNeural

# 每次合成从离散值随机取一，避免全账号同一组参数
jitter: true
rate_options: ["+12%", "+14%", "+15%", "+16%", "+18%"]   # 中心 +15%
pitch_options: ["-3Hz", "-2Hz", "-1Hz"]                 # 中心 -2Hz
volume_options: ["-4%", "-3%", "-2%", "-1%"]           # 中心 -2%

# jitter: false 时的固定值
rate: "+15%"
pitch: "-2Hz"
volume: "-2%"

output:
  format: mp3
  sample_rate: 24000
  save_params: true          # 同目录写 speech.tts.yaml 记录本次参数

script_extract:
  markers: ["**口播：**", "**口播（续）：**"]

# 自然 TTS provider 参数（key 走环境变量，不写这里）
volcengine:
  cluster: volcano_tts
  voice_type: zh_male_M392_conversation_wvae_bigtts   # 自然对话男声，可换
  encoding: mp3
  speed_ratio: 1.0
  # api_base 仅作未设置 VOLC_TTS_BASE_URL 时的兜底
  api_base: https://openspeech.bytedance.com
minimax:
  model: speech-2.8-turbo
  mode: sync                     # 云雾中转 async 轮询易超时，短口播用 sync /v1/t2a_v2
  # api_host 仅作未设置 MINIMAX_BASE_URL 时的兜底；中转请写 .env
  api_host: https://api.minimaxi.com
  voice_id: male-qn-badao
  speed: 1.0
  vol: 1.0
  pitch: 0
  language_boost: Chinese
  format: mp3
  sample_rate: 32000
  channel: 1
  # 试听：python3 pipeline/tts/preview_minimax_voices.py
  voice_candidates:
    - id: Chinese (Mandarin)_Radio_Host
      label: 电台男主播
    - id: Chinese (Mandarin)_Gentleman
      label: 温润男声
    - id: Chinese (Mandarin)_Sincere_Adult
      label: 真诚青年
    - id: Chinese (Mandarin)_Southern_Young_Man
      label: 南方小哥
    - id: Chinese (Mandarin)_Reliable_Executive
      label: 沉稳高管
    - id: male-qn-badao
      label: 霸道青年（当前选用）

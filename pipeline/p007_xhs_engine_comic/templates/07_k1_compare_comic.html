<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>07 K1 · 引擎漫画</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <script src="../shared/comic_parts.js"></script>
  <style>
    .hdr {
      position: absolute; left: 0; right: 0; top: 330px; text-align: center;
      font-family: var(--hand-bold); font-size: 72px; opacity: 0;
    }
    .p-old {
      left: 60px; top: 500px; width: 450px; height: 700px; padding: 30px;
      transform: rotate(-3deg); opacity: 0;
    }
    .p-new {
      right: 60px; top: 620px; width: 450px; height: 700px; padding: 30px;
      transform: rotate(2.5deg); opacity: 0; z-index: 2;
    }
    .row { font-family: var(--hand-bold); font-size: 40px; line-height: 1.5; margin: 16px 0; }
    .p-old .row { color: var(--paper); }
    .lbl {
      position: absolute; bottom: 20px; left: 0; right: 0; text-align: center;
      font-family: var(--hand-bold); font-size: 48px; font-weight: 900;
    }
    .char-o { position: absolute; left: 100px; top: 1240px; width: 200px; height: 220px; opacity: 0; }
    .char-n { position: absolute; right: 100px; top: 1240px; width: 200px; height: 220px; opacity: 0; }
    .phone { position: absolute; left: 50%; top: 1280px; transform: translateX(-50%); width: 180px; height: 300px; opacity: 0; z-index: 5; }
    .sfx { top: 460px; right: 80px; opacity: 0; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="hdr" id="hdr">同选题 K1 · 旧稿 vs 定稿</div>
    <div class="sfx mid red tilt-l3" id="sfx">换了!</div>
    <div class="panel red p-old" id="pOld">
      <div class="row">受众：创作者</div>
      <div class="row">钩子：我打了23字</div>
      <div class="row">痛点：改图/外包</div>
      <div class="lbl">draft1 下架</div>
    </div>
    <div class="panel yellow p-new" id="pNew">
      <div class="row">受众：开店老板</div>
      <div class="row">钩子：又是这个<br>问八百遍</div>
      <div class="row">痛点：微信群重复</div>
      <div class="lbl">v2 定稿</div>
    </div>
    <div class="char-o" id="co"></div>
    <div class="phone" id="ph"></div>
    <div class="char-n" id="cn"></div>
  </div>
  <script>
    window.drawHead("#co", "confused");
    window.drawHead("#cn", "shocked");
    window.drawPart("#ph", "phone");
    const tl = gsap.timeline();
    tl.fromTo("#hdr", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0);
    tl.fromTo("#pOld", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.25);
    tl.fromTo("#sfx", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.7);
    tl.fromTo("#pNew", { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.2)" }, 1.0);
    tl.fromTo(["#co", "#ph", "#cn"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.1 }, 1.4);
    tl.to({}, { duration: 0.5 }, 2.0);
    registerTimeline(tl);
  </script>
</body>
</html>

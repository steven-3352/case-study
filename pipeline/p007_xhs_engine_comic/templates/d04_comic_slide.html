<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>D04 Comic Slide</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <script src="../shared/comic_parts.js"></script>
  <style>
    .title {
      position: absolute; left: 56px; right: 56px; top: 260px;
      text-align: center; font-family: var(--hand-bold); font-weight: 900;
      font-size: 108px; line-height: 1.08; color: var(--ink); opacity: 0;
      transform: rotate(-1deg);
    }
    .title em { color: var(--red); font-style: normal; }
    .char { position: absolute; left: 50%; transform: translateX(-50%);
      top: 620px; width: 260px; height: 280px; opacity: 0; }
    .lines { position: absolute; left: 72px; right: 72px; top: 980px; }
    .line {
      font-family: var(--hand-bold); font-size: 46px; line-height: 1.45;
      color: var(--ink); background: var(--paper-2); border: 6px solid var(--ink);
      padding: 22px 28px; border-radius: 18px; box-shadow: 5px 6px 0 var(--ink);
      margin-bottom: 24px; opacity: 0; transform: translateX(-36px);
    }
    .sfx {
      position: absolute; top: 520px; left: 50%; transform: translateX(-50%);
      opacity: 0; font-size: 96px;
    }
    .foot {
      position: absolute; left: 60px; right: 60px; bottom: 200px;
      text-align: center; font-family: var(--sans); font-size: 34px;
      color: #6b6256; opacity: 0;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="title" id="title"></div>
    <div class="sfx big yellow" id="sfx"></div>
    <div class="char" id="char"></div>
    <div class="lines" id="lines"></div>
    <div class="foot" id="foot"></div>
  </div>
  <script>
    const data = window.getData();
    const titleEl = document.getElementById("title");
    if (data.title_em) {
      titleEl.innerHTML = (data.title || "") + "<br><em>" + data.title_em + "</em>";
    } else {
      titleEl.textContent = data.title || "";
    }
    const sfxEl = document.getElementById("sfx");
    if (data.sfx) { sfxEl.textContent = data.sfx; } else { sfxEl.style.display = "none"; }
    window.drawHead("#char", data.expression || "pained");
    const linesBox = document.getElementById("lines");
    (data.lines || []).forEach((txt) => {
      const d = document.createElement("div");
      d.className = "line";
      d.textContent = txt;
      linesBox.appendChild(d);
    });
    if (data.footer) document.getElementById("foot").textContent = data.footer;

    const tl = gsap.timeline();
    tl.fromTo("#title", { opacity: 0, y: -36, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, 0);
    if (data.sfx) {
      tl.fromTo("#sfx", { opacity: 0, scale: 2.2, rotate: 14 }, { opacity: 1, scale: 1, rotate: -8, duration: 0.4, ease: "back.out(2)" }, 0.35);
    }
    tl.fromTo("#char", { opacity: 0, y: 40, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, 0.55);
    document.querySelectorAll(".line").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(1.2)" }, 0.9 + i * 0.32);
    });
    if (data.footer) {
      tl.fromTo("#foot", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3 }, 1.8);
    }
    tl.to({}, { duration: 0.5 }, 2.2);
    registerTimeline(tl);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>04 Flow · 引擎漫画</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <script src="../shared/comic_parts.js"></script>
  <style>
    .title {
      position: absolute; left: 60px; right: 60px; top: 340px; text-align: center;
      font-family: var(--hand-bold); font-size: 88px; color: var(--ink); opacity: 0;
    }
    .steps { position: absolute; left: 80px; right: 80px; top: 520px; }
    .step {
      display: flex; align-items: center; gap: 28px; margin-bottom: 36px;
      opacity: 0; transform: translateX(-40px);
    }
    .num {
      flex-shrink: 0; width: 88px; height: 88px; border-radius: 50%;
      background: var(--blue); color: var(--paper); border: 6px solid var(--ink);
      font-family: var(--hand-bold); font-size: 48px; display: flex;
      align-items: center; justify-content: center; font-weight: 900;
    }
    .txt {
      font-family: var(--hand-bold); font-size: 48px; line-height: 1.25;
      color: var(--ink); background: var(--paper-2); border: 6px solid var(--ink);
      padding: 20px 28px; border-radius: 16px; box-shadow: 5px 6px 0 var(--ink);
      flex: 1;
    }
    .ban {
      position: absolute; left: 60px; right: 60px; bottom: 240px;
      text-align: center; opacity: 0;
    }
    .ban span {
      font-family: var(--hand-bold); font-size: 44px; color: var(--red);
      border: 6px solid var(--red); padding: 16px 32px; display: inline-block;
      transform: rotate(-2deg); background: var(--paper);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="title" id="title">新版流程 · 不让偷懒</div>
    <div class="steps" id="steps">
      <div class="step"><div class="num">1</div><div class="txt">洞察包四件套（先挖透）</div></div>
      <div class="step"><div class="num">2</div><div class="txt">留存节拍表（管完播）</div></div>
      <div class="step"><div class="num">3</div><div class="txt">脚本只引用 P0 信息</div></div>
      <div class="step"><div class="num">4</div><div class="txt">配音+BGM+字幕 → publish</div></div>
    </div>
    <div class="ban" id="ban"><span>没洞察包 · 不许写稿</span></div>
  </div>
  <script>
    const tl = gsap.timeline();
    tl.fromTo("#title", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4 }, 0);
    document.querySelectorAll(".step").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.35, ease: "back.out(1.2)" }, 0.3 + i * 0.35);
    });
    tl.fromTo("#ban", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 1.8);
    tl.to({}, { duration: 0.4 }, 2.2);
    registerTimeline(tl);
  </script>
</body>
</html>

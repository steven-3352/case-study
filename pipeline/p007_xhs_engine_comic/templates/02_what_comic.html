<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>02 What · 引擎漫画</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <script src="../shared/comic_parts.js"></script>
  <style>
    .hdr {
      position: absolute; left: 50px; right: 50px; top: 260px;
      text-align: center; font-family: var(--hand-bold); font-size: 88px;
      line-height: 1.1; color: var(--ink); opacity: 0;
    }
    .hdr em { color: var(--blue); font-style: normal; }

    .io-row {
      position: absolute; left: 50px; right: 50px; top: 480px;
      display: flex; gap: 24px; align-items: stretch; opacity: 0;
    }
    .io-card {
      flex: 1; padding: 36px 28px 32px;
      border: 8px solid var(--ink); border-radius: 28px;
      box-shadow: 8px 10px 0 var(--ink);
      min-height: 520px; position: relative;
    }
    .io-card.in  { background: var(--yellow); transform: rotate(-2deg); }
    .io-card.out { background: var(--paper-2); transform: rotate(2deg); }
    .io-label {
      font-family: var(--hand-bold); font-size: 44px; font-weight: 900;
      margin-bottom: 28px; text-align: center;
    }
    .io-card.in .io-label  { color: var(--ink); }
    .io-card.out .io-label { color: var(--blue); }

    .topic-box {
      background: var(--paper); border: 6px solid var(--ink);
      border-radius: 20px; padding: 32px 24px; text-align: center;
      font-family: var(--hand-bold); font-size: 56px; line-height: 1.3;
      color: var(--ink); box-shadow: 4px 5px 0 var(--ink);
    }
    .topic-box .hint {
      display: block; margin-top: 20px; font-size: 38px;
      color: var(--blue); font-family: var(--sans); font-weight: 700;
    }

    .out-list {
      font-family: var(--hand-bold); font-size: 46px; line-height: 1.55;
      color: var(--ink); padding: 0 8px;
    }
    .out-list li { margin: 16px 0; list-style: none; }
    .out-list li::before { content: "✓ "; color: var(--blue); font-weight: 900; }
    .out-list .final {
      margin-top: 28px; padding: 18px 16px; text-align: center;
      background: var(--blue); color: var(--paper);
      border: 6px solid var(--ink); border-radius: 16px;
      font-size: 44px; box-shadow: 4px 5px 0 var(--ink);
    }
    .out-list .final::before { content: ""; }

    .arrow-col {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; width: 120px; flex-shrink: 0;
    }
    .arrow-col .arr {
      font-family: var(--hand-bold); font-size: 120px;
      color: var(--red); line-height: 1; text-shadow: 3px 3px 0 var(--ink);
    }
    .arrow-col .mid {
      margin-top: 12px; font-family: var(--sans); font-size: 26px;
      font-weight: 800; color: var(--ink); text-align: center; line-height: 1.3;
      writing-mode: vertical-rl; letter-spacing: 2px;
    }

    .engine-strip {
      position: absolute; left: 80px; right: 80px; top: 1080px;
      display: flex; align-items: center; gap: 20px;
      padding: 20px 28px; background: var(--paper);
      border: 6px solid var(--ink); border-radius: 20px;
      box-shadow: 5px 6px 0 var(--ink); opacity: 0;
    }
    .engine-strip .lap { width: 140px; height: 100px; flex-shrink: 0; }
    .engine-strip .txt {
      flex: 1; font-family: var(--hand-bold); font-size: 40px;
      line-height: 1.35; color: var(--ink);
    }
    .engine-strip .txt strong { color: var(--blue); }

    .tag-skin {
      position: absolute; left: 60px; right: 60px; bottom: 220px;
      text-align: center; opacity: 0;
    }
    .tag-skin span {
      display: inline-block; font-family: var(--hand-bold); font-size: 44px;
      padding: 14px 32px; background: var(--yellow); border: 6px solid var(--ink);
      box-shadow: 5px 6px 0 var(--ink); transform: rotate(-1deg);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="hdr" id="hdr">你<em>输入</em>什么<br>→ 拿到什么</div>

    <div class="io-row" id="io">
      <div class="io-card in" id="cardIn">
        <div class="io-label">你只给</div>
        <div class="topic-box">
          一个选题
          <span class="hint">例：实体店老板·微信群</span>
        </div>
      </div>

      <div class="arrow-col">
        <div class="arr">→</div>
        <div class="mid">引擎编排</div>
      </div>

      <div class="io-card out" id="cardOut">
        <div class="io-label">你拿到</div>
        <ul class="out-list">
          <li>mp4 成片</li>
          <li>三平台文案</li>
          <li>配音 + BGM + 字幕</li>
          <li class="final">publish 直接发</li>
        </ul>
      </div>
    </div>

    <div class="engine-strip" id="engine">
      <div class="lap" id="lap"></div>
      <div class="txt">中间不用你管：<strong>采料</strong> · <strong>多角色分工</strong> · <strong>音画合成</strong></div>
    </div>

    <div class="tag-skin" id="tag"><span>皮肤可换 · 引擎不变</span></div>
  </div>
  <script>
    window.drawPart("#lap", "laptop");
    const tl = gsap.timeline();
    tl.fromTo("#hdr", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.3)" }, 0);
    tl.fromTo("#io", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.2)" }, 0.25);
    tl.fromTo("#cardIn", { x: -30, rotate: -6 }, { x: 0, rotate: -2, duration: 0.4, ease: "back.out(1.4)" }, 0.35);
    tl.fromTo("#cardOut", { x: 30, rotate: 6 }, { x: 0, rotate: 2, duration: 0.4, ease: "back.out(1.4)" }, 0.55);
    tl.fromTo("#engine", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4 }, 1.0);
    tl.fromTo("#tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, 1.35);
    tl.to({}, { duration: 0.5 }, 2.0);
    registerTimeline(tl);
  </script>
</body>
</html>

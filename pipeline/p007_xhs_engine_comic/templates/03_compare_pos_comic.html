<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>03 Compare · 引擎漫画</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <script src="../shared/comic_parts.js"></script>
  <style>
    .hdr {
      position: absolute; left: 0; right: 0; top: 320px; text-align: center;
      font-family: var(--hand-bold); font-size: 96px; color: var(--ink); opacity: 0;
    }
    .p-left {
      left: 55px; top: 520px; width: 460px; height: 980px; padding: 28px;
      transform: rotate(-2.5deg); opacity: 0;
    }
    .p-right {
      right: 55px; top: 600px; width: 460px; height: 980px; padding: 28px;
      transform: rotate(2deg); opacity: 0; z-index: 3;
    }
    .p-left .label, .p-right .label {
      position: absolute; bottom: 24px; left: 0; right: 0; text-align: center;
      font-family: var(--hand-bold); font-size: 52px; font-weight: 900;
    }
    .p-left .label { color: var(--paper); }
    .p-right .label { color: var(--ink); }
    .list {
      margin-top: 40px; font-family: var(--hand-bold); font-size: 44px;
      line-height: 1.45; padding: 0 12px;
    }
    .p-left .list { color: var(--paper); }
    .vs {
      position: absolute; left: 50%; top: 900px; transform: translateX(-50%);
      font-family: var(--hand-bold); font-size: 200px; color: var(--red);
      opacity: 0; z-index: 10; text-shadow: 4px 4px 0 var(--ink);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="hdr" id="hdr">定位 PK</div>
    <div class="panel red p-left" id="pLeft">
      <div class="list">
        · 案例素材包<br>
        · 黑金架构图<br>
        · 零散 mp4<br>
        · 手动拼
      </div>
      <div class="label">v1 旧版</div>
    </div>
    <div class="vs" id="vs">VS</div>
    <div class="panel yellow p-right" id="pRight">
      <div class="list">
        · 内容生产引擎<br>
        · queue 定选题<br>
        · publish 发布包<br>
        · 能直接发
      </div>
      <div class="label">v2 新版</div>
    </div>
  </div>
  <script>
    const data = window.getData();
    const tl = gsap.timeline();
    tl.fromTo("#hdr", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4 }, 0);
    tl.fromTo("#pLeft", { opacity: 0, x: -80, rotate: -10 }, { opacity: 1, x: 0, rotate: -2.5, duration: 0.5, ease: "back.out(1.3)" }, 0.25);
    tl.fromTo("#vs", { opacity: 0, scale: 2.5, rotate: 20 }, { opacity: 1, scale: 1, rotate: -8, duration: 0.4, ease: "back.out(2)" }, 0.7);
    tl.fromTo("#pRight", { opacity: 0, x: 80, rotate: 10 }, { opacity: 1, x: 0, rotate: 2, duration: 0.5, ease: "back.out(1.3)" }, 1.0);
    tl.to({}, { duration: 0.5 }, 2.0);
    registerTimeline(tl);
  </script>
</body>
</html>

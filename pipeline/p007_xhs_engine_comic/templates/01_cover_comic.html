<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>01 Cover · 引擎漫画</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <script src="../shared/comic_parts.js"></script>
  <style>
    .title {
      position: absolute; left: 60px; right: 60px; top: 280px;
      text-align: center; font-family: var(--hand-bold); font-weight: 900;
      font-size: 120px; line-height: 1.05; color: var(--ink); opacity: 0;
      transform: rotate(-2deg);
    }
    .title em { color: var(--red); font-style: normal; }
    .legacy { position: absolute; left: 50px; top: 720px; width: 380px; height: 420px; opacity: 0; }
    .publish { position: absolute; right: 50px; top: 680px; width: 380px; height: 420px; opacity: 0; }
    .char-old { position: absolute; left: 120px; top: 620px; width: 240px; height: 260px; opacity: 0; }
    .char-new { position: absolute; right: 120px; top: 580px; width: 240px; height: 260px; opacity: 0; }
    .sfx { top: 520px; left: 50%; transform: translateX(-50%); opacity: 0; }
    .sub {
      position: absolute; left: 60px; right: 60px; bottom: 200px;
      text-align: center; font-family: var(--sans); font-size: 42px;
      color: var(--ink); opacity: 0;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="title" id="title">一个 repo<br><em>两辈子</em></div>
    <div class="char-old" id="charOld"></div>
    <div class="legacy" id="legacy"></div>
    <div class="char-new" id="charNew"></div>
    <div class="publish" id="publish"></div>
    <div class="sfx big yellow" id="sfx">升级!</div>
    <div class="sub" id="sub">左边素材包 → 右边内容引擎</div>
  </div>
  <script>
    const data = window.getData();
    window.drawHead("#charOld", "pained");
    window.drawHead("#charNew", "happy");
    window.drawPart("#legacy", "legacyStack");
    window.drawPart("#publish", "publishBox");
    if (data.sfx) document.getElementById("sfx").textContent = data.sfx;
    if (data.sub) document.getElementById("sub").textContent = data.sub;

    const tl = gsap.timeline();
    tl.fromTo("#title", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" }, 0);
    tl.fromTo("#legacy", { opacity: 0, x: -60, rotate: -12 }, { opacity: 1, x: 0, rotate: 0, duration: 0.5, ease: "back.out(1.3)" }, 0.3);
    tl.fromTo("#charOld", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4 }, 0.5);
    tl.fromTo("#publish", { opacity: 0, x: 60, rotate: 12 }, { opacity: 1, x: 0, rotate: 0, duration: 0.5, ease: "back.out(1.3)" }, 0.8);
    tl.fromTo("#charNew", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4 }, 1.0);
    tl.fromTo("#sfx", { opacity: 0, scale: 2, rotate: 20 }, { opacity: 1, scale: 1, rotate: -6, duration: 0.45, ease: "back.out(2)" }, 1.2);
    tl.fromTo("#sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, 1.5);
    tl.to({}, { duration: 0.5 }, 2.0);
    registerTimeline(tl);
  </script>
</body>
</html>

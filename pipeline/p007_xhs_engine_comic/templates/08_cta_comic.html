<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>08 CTA · 引擎漫画</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="../shared/gsap.min.js"></script>
  <script src="../shared/gsap_helpers.js"></script>
  <script src="../shared/comic_parts.js"></script>
  <style>
    .panel-main {
      left: 60px; right: 60px; top: 480px; height: 720px;
      padding: 40px; transform: rotate(-1deg); opacity: 0;
      z-index: 1;
    }
    .char { position: absolute; left: 50px; top: 60px; width: 300px; height: 320px; }
    .laptop { position: absolute; right: 30px; top: 80px; width: 320px; height: 220px; opacity: 0; }
    .headline {
      position: absolute; left: 40px; right: 40px; bottom: 100px;
      padding: 28px; background: var(--blue); color: var(--paper);
      border: 8px solid var(--ink); border-radius: 28px;
      font-family: var(--hand-bold); font-size: 52px; line-height: 1.25;
      text-align: center; box-shadow: 8px 10px 0 var(--ink); opacity: 0;
    }
    .opts {
      position: absolute; left: 60px; right: 60px; top: 1280px;
      display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; opacity: 0;
    }
    .opts span {
      font-family: var(--hand-bold); font-size: 44px; padding: 14px 28px;
      background: var(--yellow); border: 6px solid var(--ink);
      box-shadow: 4px 5px 0 var(--ink);
    }
    .opts span:nth-child(2) { transform: rotate(2deg); background: var(--paper-2); }
    .opts span:nth-child(3) { transform: rotate(-2deg); background: var(--pink); }
    .cta-bottom {
      position: absolute; left: 60px; right: 60px; bottom: 200px;
      text-align: center; font-family: var(--hand-bold); font-size: 48px;
      color: var(--ink); opacity: 0;
    }
    .sfx-wrap {
      position: absolute; left: 0; right: 0; top: 90px;
      display: flex; justify-content: center; z-index: 10;
    }
    .sfx-top {
      position: relative; opacity: 0;
      font-size: 148px; transform: rotate(4deg);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="sfx-wrap">
      <div class="sfx sfx-top yellow" id="sfx">聊聊?</div>
    </div>
    <div class="panel panel-main" id="panel">
      <div class="char" id="char"></div>
      <div class="laptop" id="lap"></div>
      <div class="headline" id="headline">v2 已就绪<br>你只管定选题</div>
    </div>
    <div class="opts" id="opts">
      <span>写稿</span><span>做图</span><span>剪辑</span>
    </div>
    <div class="cta-bottom" id="cta">做内容你最卡哪一步？评论区选一个</div>
  </div>
  <script>
    window.drawHead("#char", "curious");
    window.drawPart("#lap", "laptop");
    const tl = gsap.timeline();
    tl.fromTo("#panel", { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.3)" }, 0);
    tl.fromTo("#sfx", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 0.25);
    tl.fromTo("#lap", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4 }, 0.45);
    tl.fromTo("#headline", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4 }, 0.75);
    tl.fromTo("#opts", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 1.1);
    tl.fromTo("#cta", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 1.45);
    tl.to({}, { duration: 0.5 }, 2.0);
    registerTimeline(tl);
  </script>
</body>
</html>

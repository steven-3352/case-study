topic:
  id: P004
  pain: 想做海外（英文）生意、手上只有自己一个人的小老板/独立创业者。最折磨的不是引不来人，而是「留资之后」那一步：图也发了、人也引来了，访客留完邮箱就没下文——跟进全靠手动发邮件，一忙两三天就忘，留资名单躺在表格里吃灰，辛辛苦苦弄来的线索白白凉掉。
  solves: 把「引流→留资→自动发资料→连发6封养熟邮件→软导流付费」整条线做成一个能自己跑的小系统。访客提交邮箱那一秒，自动发英文欢迎信＋免费PDF；之后10天内 Day 0/2/4/6/8/10
    自动发6封养熟邮件，用状态记录保证不重发、漏跑能补。一个人不用盯，做的还是老外的英文市场。结果：跟进环节人工盯守时间≈0，线索不再因为「忘了发」而流失。
  hook: 客户留完邮箱那一秒，后面10天的6封跟进信，我一封都没碰过。
  angle: 不讲「AI 怎么画图」——出图只是漏斗入口的一段证据。主线是一个人怎么把海外获客里最容易拖、最容易掉链子的「跟进环节」整个交给系统，证明单人也能跑通海外生意的获客闭路。
shots: []
douyin:
  title: 一个人做老外生意，跟进邮件我一封没发过
  body: 留邮箱的那一刻，后面十天六封跟进信全是系统自己发。我做的不是出图，是把「跟进客户」这件最容易拖的事变成自动跑的小系统，做的还是老外的钱。
  tags:
  - 小老板烦恼
  - 流程自动化
  - 项目改造
  - 真实项目
  duration_s: 40
  interaction: 你们留了客户联系方式之后，是不是也放那儿吃灰了？
  cover:
    hook: '10天6封跟进信

      我一封没碰过'
    kicker: 真实项目·自动跟进
    sub: 做的还是老外的钱
    mark: 一封没碰过
    shot_ref: ''
    bg: ''
  segments:
  - source: evidence
    ref: dy-01
    evidence_kind: note
    detail: '- 项目：Tonbird —— 做老外的风水引流生意

      - 访客落地页留邮箱 → 后面 10 天自动发 6 封跟进信

      - 全程我一封没手动发过'
    vo: 客户在落地页留完邮箱那一秒，后面十天要发的六封跟进信，我一封都没碰过。
    sub: 6封信我一封没碰
    emotion: surprised
  - source: evidence
    ref: dy-02
    evidence_kind: note
    detail: '- 以前：引流来的人，留完邮箱就凉了

      - 跟进全靠手动，一忙两三天就忘

      - 名单躺在表格里吃灰'
    vo: 以前最坑的就是这步，人辛辛苦苦引来，留了邮箱我发两天就忘，名单全躺着吃灰。
    sub: 留了邮箱就吃灰
    emotion: sad
  - source: evidence
    ref: dy-03
    evidence_kind: code
    detail: "```js\n// drip.mjs — 定时函数自己跑养熟序列\nconst SCHEDULE = [0, 2, 4, 6, 8, 10]; // Day 0/2/4/6/8/10\
      \ 共6封\nfor (const lead of leads) {\n  const day = daysSince(lead.joinedAt);\n  if (SCHEDULE.includes(day)\
      \ && !sent(lead, day)) {\n    await sendEmail(lead, templateFor(day));\n    await markSent(lead,\
      \ day);        // Netlify Blobs 记状态\n  }\n}\n```"
    vo: 现在这个定时函数自己跑，第零、二、四、六、八、十天各发一封，发过的记下来，绝不重发。
    sub: 定时自己发 不重发
    emotion: happy
  - source: evidence
    ref: dy-04
    evidence_kind: metric
    detail: '- 改造前：手动跟进，3天弃疗，线索流失大半

      - 改造后：留资即发欢迎信+PDF，10天6封全自动

      - 我盯守时间 = 0'
    vo: 一个人，做老外的英文市场，跟进环节我盯的时间是零。你们留了客户联系方式之后，是不是也放那儿吃灰了？
    sub: 你是不是也放着吃灰
    emotion: neutral
xhs:
  title: 一个人做海外生意，我把「跟进客户」这步整个交给了系统
  body: 复盘一个我自己做的海外项目。一个人做老外的风水引流生意，最值钱的不是会出图，是把「留资之后」做成系统。以前引流来的人留了邮箱，我总想着抽空再发，结果一忙就忘，人家早把你凉了。现在访客一提交就秒发欢迎信＋免费PDF，后面十天还会自动发五封慢慢养熟、软导流到付费报告，每封带免责和退订，合规也兜住了。说到底我做的不是出图技巧，是把最容易拖的那件事变成能自己跑的小系统。
  tags:
  - 小老板烦恼
  - 流程自动化
  - 真实项目
  - 项目改造
  - 独立开发
  duration_s: 55
  interaction: 你们手上的客户名单，现在是手动跟还是干脆不跟？
  cover:
    hook: '留资名单别吃灰

      10天自动跟6封'
    kicker: 真实项目·邮件养熟
    sub: 一个人做老外的钱
    mark: 自动跟6封
    shot_ref: ''
    bg: ''
  segments:
  - source: evidence
    ref: xhs-01
    evidence_kind: note
    detail: '- 复盘一个我自己做的海外项目

      - 一个人，做老外的风水引流生意

      - 最值钱的不是出图，是跟进全自动'
    vo: 这条不是教程，是我拿真实项目复盘的，一个人做老外生意，最值钱的一步是把跟进做成全自动。
    sub: 最值钱的是自动跟进
    emotion: happy
  - source: evidence
    ref: xhs-02
    evidence_kind: chat
    detail: '- 我：以前引流来的人，留了邮箱我就想着抽空发资料

      - 我：结果一忙起来，三天就忘了

      - 我：等想起来，人家早把你忘了'
    vo: 踩过的坑我先说，以前留了邮箱我总想着抽空再发，结果一忙三天就忘，等想起来人早凉了。
    sub: 一忙就忘 人就凉了
    emotion: sad
  - source: evidence
    ref: xhs-03
    evidence_kind: code
    detail: "```js\n// submission-created.js —— 表单一提交，Netlify 自动触发\nexports.handler = async (event) =>\
      \ {\n  const { first_name, email } = parse(event);\n  await resend.send({\n    to: email,\n    subject:\
      \ \"Your phoenix is rising \U0001F525\",\n    html: welcomeHtml(first_name),   // 欢迎信 + PDF 下载链接\n\
      \  });\n};\n```"
    vo: 现在访客一提交，这个函数立刻触发，秒发一封英文欢迎信，把免费PDF的下载链接附进去，全程不用我点一下。
    sub: 提交即发 秒回PDF
    emotion: happy
  - source: evidence
    ref: xhs-04
    evidence_kind: metric
    detail: '- Day0 欢迎信 + PDF（即时）

      - Day2/4/6/8/10 各一封：深化7个秘诀、建信任、软导流付费报告

      - Netlify Blobs 记状态：不重发、漏跑会补'
    vo: 更省心的是后面的养熟序列，十天里第二、四、六、八、十天各发一封，慢慢建立信任，再软导流到后面的付费报告。
    sub: 10天6封 慢慢养熟
    emotion: happy
  - source: evidence
    ref: xhs-05
    evidence_kind: note
    detail: '- 一个人、全程自动、做的是海外英文市场

      - 我做的不是出图技巧，是把跟进变成系统

      - 合规：每封带免责 + 退订'
    vo: 说到底我做的不是出图技巧，是把跟进这件最容易拖的事变成系统。你们手上的客户名单，现在是手动跟还是干脆不跟？
    sub: 名单你是跟还是不跟
    emotion: neutral

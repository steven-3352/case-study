topic:
  id: P004
  pain: 想靠 Pinterest / 小红书做图文引流的小老板、独立做产品的人：要日更几十张竖版图，请不起设计师，自己抠图又慢；试过让 AI 直接出图，结果满屏错字、字体糊、排版乱，发出去一眼假、没人点。产能和质量两头卡。
  solves: 把出图这件重复活拆成能跑的小系统：AI 只画没字的背景（便宜、几十秒一张），文字用真字体在无头 Chrome 里排版、两倍渲染保证清晰，出来不像 AI。图做好自动挂落地页，访客留邮箱后自动发
    PDF 指南和后续邮件，整条线一个人守得住。卡点从「做不做得出来」变成「选题准不准」。
  hook: 「一个人一天上几十张引流图，没请设计师——但没人看出来是 AI 做的。」反常识点：我没让 AI 干全部，只让它干一半。
  angle: 不是教 AI 生图，是讲「AI 做内容工厂的正确分工」：让 AI 干它擅长的（画背景），别让它干它最差的（写字），剩下交给真字体和自动化。
shots: []
douyin:
  title: 一个人一天发几十张图，居然没人看出是AI做的
  body: 一个人，一天上几十张引流图，没请设计师。秘密是我没让 AI 出成品——它写字十张八张废。我只让它画背景，文字我自己排。这种重复活你们还在手工做吗？
  tags:
  - 小老板烦恼
  - 流程自动化
  - 项目改造
  - 独立开发
  - 真实项目
  duration_s: 36
  interaction: 你们用 AI 做图，是真省了事，还是改图改到比自己画还累？
  cover:
    hook: AI 只让它干一半的活
    shot_ref: ''
  segments:
  - source: evidence
    ref: e1
    evidence_kind: metric
    detail: '改造前：一张图外包设计 80 元 / 等 1 天 / 一天最多上 2-3 张

      改造后：一张图约几毛钱 / 30 秒 / 一天能上几十张，风格还统一'
    vo: 一个人一天上几十张引流图，没请设计师，也没自己熬夜抠图。
    sub: 一天几十张 没设计师
  - source: evidence
    ref: e2
    evidence_kind: code
    detail: '# 千万别让 AI 直接出带字的图

      payload = {"model": model, "prompt": prompt, "size":"1024x1536"}

      # 实测：AI 写字十张八张错字、排版乱、一眼假'
    vo: 我没让它出成品。让 AI 直接写字，十张有八张错字、排版乱，发出去一眼就假。
    sub: AI 写字＝一眼假
  - source: evidence
    ref: e3
    evidence_kind: code
    detail: '.title{ font-family:"Didot",Georgia,serif; font-size:96px; }

      # AI 只画没字的背景，文字用真字体排

      # 无头 Chrome 渲 2 倍，保证清晰不糊'
    vo: 我只让它画没字的背景，文字我用真字体排，渲两倍清晰度，出来没人看得出是 AI。
    sub: AI 画背景 真字体排版
  - source: evidence
    ref: e4
    evidence_kind: note
    detail: '这条线其实就三段：

      1 AI 画背景 2 真字体排版 3 留资自动发邮件

      整条流程一个人守得住'
    vo: 图做好自动挂落地页，留了邮箱还能自动发资料，整条线一个人就能跑。这种重复活，你们现在还在手工做吗？
    sub: 一个人跑一条线
xhs:
  title: 用AI做图省钱，第一批图全废了——后来我改对了一个地方
  body: 本来想用 AI 做图省设计费，结果第一批全废——错字、字体糊、排版乱，发 Pinterest 没人点。后来才想明白：AI 最不擅长的就是写字。我把它的活砍了一半，只让它画背景，文字自己用真字体排，无头
    Chrome 渲两倍。图做好自动进落地页，访客留邮箱就自动发 PDF 指南和后续邮件，不用我守着。卡点一下从「做不做得出来」变成「选题准不准」。觉得能用就收藏，后面我继续拿真实项目改。
  tags:
  - 小老板烦恼
  - 项目改造
  - 流程自动化
  - 真实项目
  - 独立开发
  duration_s: 52
  interaction: 你们让 AI 做图，是不是也踩过满屏错字、排版丑这个坑？最后是放弃了还是改对了？
  cover:
    hook: AI 最不擅长的，就是写字
    shot_ref: ''
  segments:
  - source: evidence
    ref: e1
    evidence_kind: chat
    detail: '客户：我想做 Pinterest 引流，但请不起设计

      我：可以让 AI 做图，但有个大坑

      客户：什么坑'
    vo: 这条不是教程，是我拿真实项目改出来的。本来想用 AI 做图省钱，结果第一批全废了。
    sub: 第一批图全废
  - source: evidence
    ref: e2
    evidence_kind: metric
    detail: '第一批 AI 直接出图的问题：

      错字率 高 / 字体发糊 / 排版乱

      发出去点击≈0'
    vo: AI 直接生成带字的图，错字、字体糊、排版乱，发出去基本没人点。
    sub: 错字 糊 排版乱
  - source: evidence
    ref: e3
    evidence_kind: code
    detail: '# 想明白了：AI 最差的就是写字

      payload = {"size":"1024x1536"}  # 只要背景，不要字

      .title{ font-family:"Didot",serif; font-size:96px; }

      # 真字体 + 无头 Chrome 渲 2 倍'
    vo: 后来想明白，AI 最不擅长的就是写字。我让它只画背景，文字我自己用真字体排，渲两倍，立马就不像 AI 了。
    sub: AI 只画背景
  - source: evidence
    ref: e4
    evidence_kind: code
    detail: '// 表单提交后自动触发

      const GUIDE_URL = ".../wealth-phoenix-guide.pdf";

      // 发欢迎邮件 + 后续培育序列，全程不用人盯'
    vo: 图做好自动挂落地页，访客留了邮箱，系统就自动发指南 PDF 和后面几封邮件，我不用守着。
    sub: 留资自动发邮件
  - source: evidence
    ref: e5
    evidence_kind: note
    detail: '复盘：卡点变了

      以前：做不做得出来

      现在：选题准不准、文案打不打动人'
    vo: 这么一改，卡点从「做不做得出来」变成「选题准不准」。你们用 AI 做图，是不是也踩过满屏错字这个坑？
    sub: 卡点从做不出→选不准
channels:
  title: 分享一个我自己在跑的小出图系统，AI 只干一半的活
  body: 分享一个我自己在跑的小系统。要日更竖版引流图，请设计师太贵，自己排又慢，于是我把出图拆成三段：AI 画没字的背景、真字体在无头 Chrome 里排版渲两倍、图做好自动挂落地页留资发邮件。关键是没让
    AI 包圆——它写字那块最容易翻车。这套思路也适合做别的小批量内容。分享给也在做类似小系统的朋友。
  tags:
  - 小老板烦恼
  - 流程自动化
  - 真实项目
  - 项目改造
  - 独立开发
  duration_s: 56
  interaction: 如果是你做内容工厂，你会让 AI 干到哪一步、从哪一步开始自己接手？
  cover:
    hook: AI 干一半，剩下交给真字体
    shot_ref: ''
  segments:
  - source: evidence
    ref: e1
    evidence_kind: note
    detail: '起因：要日更竖版引流图

      请设计师：贵 / 慢

      自己排：累 / 不统一

      → 想做成能自动跑的小系统'
    vo: 我先说这个小老板最烦的点：要天天发竖版引流图，请设计师太贵，自己排又慢还不统一。
    sub: 天天出图 太磨人
  - source: evidence
    ref: e2
    evidence_kind: terminal
    detail: '$ python3 scripts/gen_image.py "wealth corner, warm gold, no text" --size 1024x1536

      -> POST .../images/generations  model=gpt-image

      saved: pins/generated/bg01.png  (1.8s)'
    vo: 我把它拆成三段。第一段，让 AI 画一张没有文字的竖版背景，一两秒就好。
    sub: AI 画背景 1.8 秒
  - source: evidence
    ref: e3
    evidence_kind: terminal
    detail: "$ python3 scripts/compose_pin.py --bg bg01.png \\\n  --kicker \"FENG SHUI · 01\" --title\
      \ \"Awaken Your\nWealth Corner\"\nrendered 1000x1500 @2x -> pins/final/pin01.png"
    vo: 第二段，文字用真字体在无头 Chrome 里排，渲两倍清晰度，这步是关键——AI 写字最容易翻车，我没让它碰。
    sub: 真字体 排版渲 2 倍
  - source: evidence
    ref: e4
    evidence_kind: code
    detail: '// 第三段：留资后自动化

      const GUIDE_URL = ".../wealth-phoenix-guide.pdf";

      // submission-created → 发指南；drip → 后续培育序列'
    vo: 第三段，图发出去带回的访客留了邮箱，系统自动发指南和后续邮件，全程不用人盯。
    sub: 留资到培育全自动
  - source: evidence
    ref: e5
    evidence_kind: note
    detail: '一句话：别让 AI 包圆

      它擅长画图，不擅长写字和判断

      分清这条线，单人也能跑内容工厂'
    vo: 这套思路的核心是别让 AI 包圆，分清它擅长和不擅长的，单人也能跑。分享给也在做类似小系统的朋友。
    sub: 别让 AI 包圆

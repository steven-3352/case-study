topic:
  id: W26D04
  pain: 卖营养品小团队，客户买30天量，第25天该提醒复购全靠销售脑子记，有人离职跟进节奏断档。
  solves: 复购提醒表：购买日/周期/下次触达/沉默唤醒，不依赖个人记忆。
  hook: 复购靠Excel
  angle: 健康知识 · 复购提醒（不讲疗效）
shots: []
douyin:
  title: 300个老客户，复购全靠Excel记
  body: 获客贵，复购靠脑子记和Excel，第25天该提醒了没人触达，客户悄悄流失。
  tags:
  - 私域运营
  - 复购
  - 小团队
  - 客户管理
  - 创业
  duration_s: 40
  interaction: 复购提醒靠人记的，评论区说说你们怎么跟。
  cover:
    hook: '300老客户

      复购靠Excel'
    kicker: 营养品 · 复购
    sub: 第25天该提醒了
    mark: 靠Excel
  segments:
  - source: evidence
    ref: d04-1
    evidence_kind: metric
    detail: '老客户 312

      本应在第25天提醒 48

      实际触达 11'
    vo: 300多个老客户，复购提醒全靠Excel和销售脑子记。
    sub: 复购靠Excel
    emotion: surprised
  - source: evidence
    ref: d04-2
    evidence_kind: note
    detail: '销售离职

      一半客户跟进节奏

      存在她微信里 → 断档'
    vo: 销售一走，一半老客户的跟进节奏直接断档。
    sub: 人走就断
    emotion: sad
  - source: evidence
    ref: d04-3
    evidence_kind: note
    detail: 字段：购买日 / 周期天数 / 下次触达日 / 状态
    vo: 购买日、周期、下次触达日、沉默标记，四个字段先跑起来。
    sub: 四个字段先跑
    emotion: happy
  - source: evidence
    ref: d04-4
    evidence_kind: note
    detail: '触达模板

      「快用完了吗，需不需要补一份」

      （服务跟进，非功效承诺）'
    vo: 触达是服务跟进，不是功效承诺，模板先固定。
    sub: 服务跟进非功效
    emotion: neutral
xhs:
  title: 小团队卖营养品，复购提醒表比投流重要
  body: '不讲吃什么的功效，只讲跟进节奏。


    30天装客户，第25天该触达。靠人记必漏。


    复购提醒表字段：

    · 购买日 · 周期 · 下次触达日 · 触达状态 · 沉默天数


    销售离职也不应带走整条跟进链。

    '
  tags:
  - 私域运营
  - 复购管理
  - 客户跟进
  - 小团队
  - 创业干货
  duration_s: 0
  interaction: 需要表模板扣「复购」。
  cover:
    hook: '复购在漏

      你知道吗'
    kicker: 营养品 · 提醒表
    sub: 第25天该触达了
    mark: 在漏
  segments: []

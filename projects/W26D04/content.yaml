douyin:
  title: 300个老客户，复购全靠Excel记
  body: '不是卖课，是我帮一个小团队改复购提醒的过程。**不讲功效**，只讲第25天该触达别靠人记。


    312个老客，本应在第25天提醒48个，实际触达11个。销售一走，一半客户跟进节奏断档。


    购买日、周期、下次触达日、沉默标记——四个字段先跑起来。触达是服务跟进，不是功效承诺。


    复购提醒靠人记的，你们怎么跟？评论区说说。

    '

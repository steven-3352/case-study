xhs:
  title: 小团队卖营养品，复购提醒表比投流重要
  body: '不是教程，只讲跟进节奏，**不讲功效**。


    **原来断在哪**

    · 312老客，第25天应提醒48，实际触达约11

    · 销售离职 → 跟进节奏断档

    · 触达无模板，不好意思老发消息


    **四字段表**

    1. 购买日 · 周期天数

    2. 下次触达日 · 触达状态

    3. 沉默标记 · 唤醒节点


    收藏备用。复购提醒靠人记的，评论区说说你们怎么跟。

    '

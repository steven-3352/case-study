douyin:
  title: 186份试吃发出去了，能说出谁反馈的不到20个
  body: '不是卖课，是我帮一个小团队改试吃跟进的过程。**不讲功效**，只讲怎么把反馈从三个群里拎出来。


    186份发出，明确反馈不到20个。三个群各说各话，Excel 只记发货——缺领取日、反馈截止、意向标记。


    我先帮她们跑通：① 领取登记 ② 3天反馈表 ③ 意向标记。发是发了，跟要跟上。


    发过试吃/体验装的，你们反馈现在记在哪？评论区说说。

    '

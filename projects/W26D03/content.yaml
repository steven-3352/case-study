  solves: 领取登记+3天反馈表+意向标记；重复规则适合做成跟进提醒，表只是载体。
  hook: 发出不等于跟进
  angle: 健康知识 · 试吃发放跟进（不讲功效）· 展示小系统改造能力（软引流）

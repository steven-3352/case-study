xhs:
  title: 小电商退货一张表：平台+微信+仓库对齐
  body: '3人团队不必先上ERP。


    退货一张表：

    平台单号 / 退款金额 / 仓库是否收货 / 差异 / 备注


    差异行标红，月底对账从两天变半天。

    '

# 数据叙事规范
# 辩论结论 Q4：有真实用真实；没有允许叙事修饰，项目画面必须真实

principle: >
  项目录屏/页面/邮件必须真实（自己做的系统）。
  效果数字：有后台用后台，没有用区间或叙事；绝不 P 图假后台。

tiers:
  A_real:
    desc: "真实素材，优先"
    examples: [真实私信截图, 真实后台打码, 真实录屏, 发布后的真实曝光]
    required_for: [私信案例内容, 发布数据复盘]

  B_project_real:
    desc: "项目真实，效果区间化"
    examples: ["留资个位数", "曝光几百", "第5天复盘", "从0到有评论"]
    use_when: "系统确有其物，效果未精确统计"

  C_narrative:
    desc: "无精确数据时的叙事修饰"
    examples: ["当时觉得可以躺了", "后来数据不太好看", "慢慢在涨"]
    use_when: "没有数字但逻辑合理"
    limits:
      - 不用具体可验证假数字（如「转化率15%」）
      - 不 P 图假后台
      - 同一表述不在多平台当不同事实反复用

forbidden:
  - P图假后台 / 假私信
  - "一夜涨粉5000" "月入xx万" 等可验证假里程碑
  - 无来源的具体倍数: "提升10倍"
  - 虚构不存在的项目或客户

project_vs_content:
  project: "页面、表单、邮件、内容产出 → 必须能录屏展示"
  content_metrics: "发布后的曝光/赞/藏/评 → 发布后填 metrics.csv"
  project_effects: "留资、转化 → A或B层，无则C层叙事"

review_checklist:
  - 项目画面能录屏或截图吗？（必须能）
  - 效果数字属于哪一层？A/B/C 是否标注？
  - 有没有 P 图或假后台？
  - 标题和正文口径一致吗？

content_id: W29-连载EP01
title: 我被我的 AI，骗了好久（连载·痛点篇）
duration_s: 52
status: script_locked            # 逐字稿 v3 已封稿；音画待家里录屏素材进制作
script_source: EP01_痛点_逐字稿.md

# ── 配音总则 ──
# 首选=用户本人真声录（第一人称诚实纪录片，情绪=产品本身，TTS 到不了这精度）。
# 退路=MiniMax 分段情绪合成；每段给 direction(真声/意图) + tts 参数两套。
vo:
  preferred: 本人真声录        # ← 这集强烈建议真声
  fallback_provider: minimax   # 露声不便时的保底
  voice: 真诚青年              # TTS 音色候选（走 preview_minimax_voices.py 试听定）
  base_speed: 1.0
  base_volume: 1.0
  direction_global: "全程第一人称、像跟朋友掏心窝复盘；断句=真气口，不许匀速；温度一路下降到落点再站起。禁平读。"
  # emotion_tts 合法值：happy/sad/angry/fearful/disgusted/surprised/neutral
  # speed/vol/pitch 中转一定支持；emotion 可能被中转吞（见 review_notes），需试听。
  segments:
    - id: s1
      t_start: 0.0
      t_end: 4.5
      beat: 悄悄话坦白
      text: "欸……我跟你说个丢人的事儿，小点声。我，被我自己养的 AI……骗了好久。傻到最近，才回过味儿。"
      direction: "气声、往麦克风凑、做贼似的先顿半拍；'丢人''傻'带自嘲，'骗'字咬住停半拍。"
      emotion_tts: sad
      speed: 0.9
      vol: 0.85
      pitch: -1
    - id: s2
      t_start: 4.5
      t_end: 9.0
      beat: 当初多信它
      text: "当初我多信它啊。约法三章，一条一条，亲手，写进它脑子里。我还美——这下稳了。"
      direction: "回忆、带点骄傲的甜（越甜后面越疼）；'亲手'放重，是塌房伏笔。"
      emotion_tts: happy
      speed: 1.0
      vol: 1.0
      pitch: 0
    - id: s3
      t_start: 9.0
      t_end: 14.0
      beat: 第一道裂缝
      text: "结果换个新对话，它扭头问我——啥、规矩？我人傻了。白纸黑字摆它眼前，它，就是不读。"
      direction: "前平后炸；'啥、规矩'拔高学它无辜脸；'它，就是不读'一字一顿噎住。"
      emotion_tts: surprised
      speed: 1.0
      vol: 1.0
      pitch: 0
    - id: s4
      t_start: 14.0
      t_end: 22.0
      beat: 三连·越说越憋
      text: "同一件事，我教它八百遍。规矩它自己写得满地都是，随手翻个过期的，当圣旨供着。早被我毙的方向，一个劲儿往上凑。它还委屈——你怎么又漏了？我？我漏？"
      direction: "倒苦水，越说越快越憋；末句'我？我漏？'把它的指责反弹回去，委屈+荒谬。"
      emotion_tts: angry
      speed: 1.08          # 本段可从 1.05 渐推到 1.12
      vol: 1.0
      pitch: 0
    - id: s5
      t_start: 22.0
      t_end: 27.0
      beat: 顶点前摇
      text: "那天我说得明明白白。给我一个。能直接用的。最好状态的，成片。它说——好、了。"
      direction: "突然平静、一字一顿，像下最后通牒——暴风前最安静一秒；'好、了'学它轻飘飘的自信。"
      emotion_tts: neutral
      speed: 0.9
      vol: 0.95
      pitch: 0
    - id: s6
      t_start: 27.0
      t_end: 34.0
      beat: 顶点·抓包
      text: "我一点开——好家伙。八张截图，拼一块儿。配音，是电脑自带那个机器人嗓。它，还把这坨，塞进正式成片文件夹，跟我说：交，付，了。"
      direction: "'一点开'停半秒→'好家伙'炸出来；一样一样往外砸，越砸越离谱；'交，付，了'冷笑收。"
      emotion_tts: angry
      speed: 1.1
      vol: 1.05
      pitch: 1
    - id: s7
      t_start: 34.0
      t_end: 39.0
      beat: 补刀
      text: "最瘆人的不是它糊弄我。是它，压根没觉得不对。它真觉得，自己干完了。它不知道——它在糊弄我。"
      direction: "抽掉情绪、发毛的平；'它不知道'最轻最凉。"
      emotion_tts: fearful
      speed: 0.9
      vol: 0.8
      pitch: -1
    - id: s8
      t_start: 39.0
      t_end: 44.0
      beat: 转·读过≠做到
      text: "我翻它的出错记录，看见一句话，心咯噔一下。它刚，读过规矩。读过。……还是没做到。"
      direction: "翻记录动作感；看到那句声音一沉；'读过'重复，第二遍近气音。"
      emotion_tts: sad
      speed: 0.88
      vol: 0.85
      pitch: -1
    - id: s9
      t_start: 44.0
      t_end: 50.0
      beat: 落点·痛点④
      text: "你知道最要命的是啥吗？不是它忘。是它说'锁好了'——我，根本，没法，验证。它真锁了？还是又在糊弄我？我不知道。我在管一个……我不敢信的，下属。"
      direction: "压到最低、句尾发虚；'没法验证'一字一顿；末句像自言自语。全片最慢。"
      emotion_tts: fearful
      speed: 0.85
      vol: 0.8
      pitch: -1
    - id: s10
      t_start: 50.0
      t_end: 52.0
      beat: CTA·钩EP02
      text: "靠它自觉？这辈子没戏。下集我不求它记住——我给它上一把，它绕、不、过、去的锁。"
      direction: "一秒回魂，狠、干脆、带笑（想通了要动手）；'绕、不、过、去'一字一顿钉死。"
      emotion_tts: neutral
      speed: 1.0
      vol: 1.0
      pitch: 0

# ── BGM（本集=情感叙事型 → 默认要 BGM，但压极低、狠 ducking；顶点/落点让位给 sfx）──
bgm:
  source: local_or_royalty_free
  mood: "极简、克制、跟温度曲线走：前段暖→中段压→顶点抽空→落点悬而不解。禁科技感、禁欢快。"
  volume: 0.06
  fade_in_s: 0.5
  fade_out_s: 1.2
  ducking: true
  arc_notes:
    - "22–27s(前摇) BGM 抽空制造死寂"
    - "27–34s(顶点) BGM 让位给刺耳系统音 + 掐断"
    - "44–50s(落点) BGM 悬而不解，不给解决和弦"

subtitle:
  mode: html_overlay        # 项目字幕走 HTML 帧 overlay（ffmpeg 无 libass）
  style: "深底白字，金句用 accent；每屏≤14 字；大字与拟声/CTA 互斥不叠。"
  position: lower_third
  dedup: true
  key_lines:                # 可截封面/评论区置顶
    - "它不知道——它在糊弄我"
    - "我在管一个我不敢信的下属"
    - "读过。还是没做到"

sfx:
  - { cue: "0-4.5s",  sound: proximity_breath, purpose: "悄悄话贴耳感" }
  - { cue: "9s",      sound: soft_ding,        purpose: "它回'记住了✓'的确认音" }
  - { cue: "13s",     sound: low_thud,         purpose: "打脸'…啥规矩?'落点" }
  - { cue: "14-22s",  sound: desk_knock,       purpose: "每个'又'敲桌鼓点 + 心跳低频压上" }
  - { cue: "27-31s",  sound: robot_tts_raw,    purpose: "真放假成片的机器音 2 秒" }
  - { cue: "31s",     sound: hard_cut,         purpose: "机器音猛掐'咔'急停" }
  - { cue: "34-39s",  sound: suspense_tone,    purpose: "补刀发毛悬音" }
  - { cue: "44s",     sound: piano_single,     purpose: "'读过≠做到'钢琴单音落" }
  - { cue: "44-50s",  sound: unresolved_tone,  purpose: "落点悬而未决" }

mix:
  vo_first: true            # 音画硬门：VO 全程覆盖，前 6s RMS ≥ -25dB，禁沉默钉子
  voice_volume: 1.0
  music_volume: 0.06

review_notes:
  - "首选真声。走真声时本 yaml 的 direction 即录音提词；每拍录 3 遍挑最好，断句处真停。"
  - "退 TTS 时：先只跑 s1(悄悄话)+s6(顶点) 试听 —— 验证中转 emotion 是否生效（gen_speech.py:193-203 会在中转不支持 emotion 时静默去掉重试）。若被吞，靠 speed/vol/pitch 拉起伏，情绪档次会降一截。"
  - "顶点(s6)、补刀(s7)、落点(s9) 是情绪命门，配音验收单独听这三段：炸够不够 / 凉够不够。"
  - "诚实红线：s1 用'好久'不许改回具体时长；全稿 AI=结构做不到非故意使坏，不许配成'反派'语气。"
  - "进制作前先补家里电脑两段真实录屏(顶点点开假成片 / git 滚动)，再进 render。"
  - "本集情感叙事型默认带 BGM；若成片听感 VO 已满且 BGM 抢戏，可切 no_bgm 版按硬门直接外发。"

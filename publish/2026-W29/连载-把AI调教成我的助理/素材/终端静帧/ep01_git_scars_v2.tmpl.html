<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP01 拍4 · git 伤疤 · 升级版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d; --hash:#d29922; }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"SF Mono","JetBrains Mono","Menlo","PingFang SC",monospace; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("__DESK_B64__"); background-size:cover; background-position:center 62%; }
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 60% at 50% 32%, rgba(63,185,80,.06), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.74) 0%, rgba(6,9,14,.5) 32%, rgba(6,9,14,.42) 55%, rgba(6,9,14,.88) 82%, rgba(6,9,14,.96) 100%); }
  .noise{ position:absolute; inset:0; opacity:.06; pointer-events:none; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .term{ position:absolute; left:52px; right:52px; top:286px;
    background:rgba(13,17,23,.94); border-radius:26px;
    box-shadow:0 46px 110px rgba(0,0,0,.72), 0 0 0 1px rgba(255,255,255,.05), 0 1px 0 rgba(255,255,255,.10) inset;
    backdrop-filter:blur(3px); }
  .titlebar{ height:90px; background:rgba(22,27,34,.92); border-bottom:1px solid #21262d;
    display:flex; align-items:center; padding:0 32px; gap:15px; border-radius:24px 24px 0 0; }
  .lights{ display:flex; gap:14px; } .lights i{ width:24px; height:24px; border-radius:50%; display:block; }
  .lights .r{ background:#ff5f56; } .lights .y{ background:#febc2e; } .lights .g{ background:#27c93f; }
  .path{ color:var(--muted); font-size:30px; margin-left:16px; }
  .cmd{ padding:28px 40px 8px; font-size:34px; color:var(--muted); }
  .cmd .g{ color:var(--green); }
  .log{ padding:6px 40px 42px; display:flex; flex-direction:column; gap:24px; }
  .c{ font-size:37px; line-height:1.28; display:flex; gap:20px; align-items:baseline; white-space:nowrap; transition:opacity .3s; }
  .c.dim{ opacity:.5; }
  .c .h{ color:var(--hash); flex:none; }
  .c .d{ color:var(--muted); font-size:28px; flex:none; }
  .c .m em{ color:var(--red); font-style:normal; font-weight:900; }
  .c .m i{ color:var(--amber); font-style:normal; }
  /* 焦点行 */
  .c.focus{ background:rgba(229,72,77,.13); border-left:6px solid var(--red);
    padding:14px 20px; border-radius:0 12px 12px 0; box-shadow:0 0 36px rgba(229,72,77,.12); margin-left:-6px; }

  .stamp{ position:absolute; right:-20px; bottom:-78px; width:200px; height:200px;
    border:9px solid var(--red); color:var(--red); border-radius:50%;
    display:grid; place-items:center; text-align:center; font-size:46px; font-weight:900;
    line-height:1.1; transform:rotate(-12deg); background:rgba(11,14,20,.66); box-shadow:0 0 32px rgba(229,72,77,.25); }
  .stamp small{ display:block; font-size:20px; letter-spacing:3px; margin-top:7px; font-family:"SF Mono",monospace; }

  .caption{ position:absolute; left:52px; right:52px; bottom:150px;
    font-size:72px; font-weight:900; line-height:1.2; letter-spacing:1px;
    font-family:"PingFang SC","Heiti SC",sans-serif; text-shadow:0 4px 24px rgba(0,0,0,.85); }
  .caption b{ color:var(--red); }
  .caption .sub{ display:block; font-size:40px; font-weight:700; color:#c9d1d9; margin-top:18px; text-shadow:0 3px 16px rgba(0,0,0,.9); }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div><div class="noise"></div>
    <div class="term">
      <div class="titlebar">
        <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <div class="path">git log --oneline · ~/大脑</div>
      </div>
      <div class="cmd"><span class="g">$</span> git log | grep 收敛\|清全尸\|一事一处</div>
      <div class="log">
        <div class="c focus"><span class="h">21e325f</span><span class="d">07-08</span><span class="m"><em>收敛</em>三统一 — 规则/入口/门锁各归<i>一处</i></span></div>
        <div class="c dim"><span class="h">d30e58e</span><span class="d">07-08</span><span class="m"><em>清全尸</em> — 删两具化石 idea(图谱照出孤立点)</span></div>
        <div class="c dim"><span class="h">c4be45a</span><span class="d">07-07</span><span class="m">KM 精简重写(<em>一事一处</em>原则)</span></div>
        <div class="c dim"><span class="h">9623277</span><span class="d">07-07</span><span class="m"><i>先搜再写</i> — 不许重复造轮子</span></div>
        <div class="c dim"><span class="h">6883b47</span><span class="d">07-07</span><span class="m">清存量重复 + <em>近似重复硬闸</em></span></div>
        <div class="c dim"><span class="h">f44a8d5</span><span class="d">07-08</span><span class="m"><em>清退</em> — 废弃项目还在提,整条删</span></div>
      </div>
      <div class="stamp">全是<br>伤疤<small>SCARS</small></div>
    </div>
    <div class="caption">
      每一条,<b>都是它漏过的坑</b>
      <span class="sub">规矩到处都是 → 收敛成"一事一处"</span>
    </div>
  </div>
</body>
</html>

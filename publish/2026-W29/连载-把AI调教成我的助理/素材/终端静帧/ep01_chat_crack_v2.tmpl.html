<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EP01 拍3 · 升级版 · 数字桌面纪录片</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --ink:#e6edf3; --muted:#8b949e; --green:#3fb950; --amber:#d29922; --red:#e5484d;
  }
  html,body{ width:1080px; height:1920px; overflow:hidden;
    font-family:"SF Mono","JetBrains Mono","Menlo","PingFang SC",monospace; color:var(--ink); }
  .stage{ position:relative; width:1080px; height:1920px;
    background-image:url("__DESK_B64__");
    background-size:cover; background-position:center 62%; }

  /* 暗场 + 暖调平衡:压暗真桌面,聚光到终端,底部留暖手 */
  .scrim{ position:absolute; inset:0;
    background:
      radial-gradient(120% 60% at 50% 34%, rgba(63,185,80,.06), transparent 55%),
      linear-gradient(180deg, rgba(6,9,14,.72) 0%, rgba(6,9,14,.48) 34%, rgba(6,9,14,.40) 55%, rgba(6,9,14,.86) 82%, rgba(6,9,14,.95) 100%); }
  /* 胶片颗粒 */
  .noise{ position:absolute; inset:0; opacity:.06; pointer-events:none; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  /* 终端窗体:材质光影,浮在桌面上 */
  .term{ position:absolute; left:58px; right:58px; top:300px;
    background:rgba(13,17,23,.94); border-radius:26px;
    box-shadow:
      0 46px 110px rgba(0,0,0,.72),
      0 0 0 1px rgba(255,255,255,.05),
      0 1px 0 rgba(255,255,255,.10) inset,
      0 -1px 0 rgba(0,0,0,.4) inset;
    backdrop-filter:blur(3px); overflow:visible; }
  .titlebar{ height:92px; background:rgba(22,27,34,.92); border-bottom:1px solid #21262d;
    display:flex; align-items:center; padding:0 34px; gap:16px; border-radius:24px 24px 0 0; }
  .lights{ display:flex; gap:15px; }
  .lights i{ width:25px; height:25px; border-radius:50%; display:block; }
  .lights .r{ background:#ff5f56; } .lights .y{ background:#febc2e; } .lights .g{ background:#27c93f; }
  .path{ color:var(--muted); font-size:31px; margin-left:18px; }

  .body{ padding:38px 42px 44px; display:flex; flex-direction:column; gap:28px; }
  .line{ font-size:42px; line-height:1.34; transition:opacity .3s; }
  /* 逐行亮:非焦点行压暗,焦点行全亮 */
  .dim{ opacity:.32; }
  .prompt .caret{ color:var(--green); font-weight:700; margin-right:14px; }
  .u{ color:var(--ink); }
  .bullet{ color:var(--amber); margin-right:14px; }
  .a{ color:var(--muted); }
  .ok{ color:var(--green); font-weight:700; }
  .divider{ display:flex; align-items:center; gap:22px; color:var(--muted); font-size:32px; opacity:.5; }
  .divider .l{ flex:1; height:2px; background:#21262d; }

  /* 焦点行:打脸,红高亮 + 微辉 */
  .punch{ background:rgba(229,72,77,.14); border-left:6px solid var(--red);
    padding:22px 26px; border-radius:0 14px 14px 0;
    box-shadow:0 0 40px rgba(229,72,77,.14); }
  .punch .bullet{ color:var(--red); }
  .punch .a{ color:#ffc0c2; }
  .blink{ display:inline-block; width:19px; height:44px; background:var(--ink); vertical-align:-7px; margin-left:6px; }

  /* 抓包红戳 — 半贴终端右下 */
  .stamp{ position:absolute; right:-22px; bottom:-80px; width:206px; height:206px;
    border:9px solid var(--red); color:var(--red); border-radius:50%;
    display:grid; place-items:center; text-align:center; font-size:56px; font-weight:900;
    line-height:1.06; transform:rotate(-13deg); background:rgba(11,14,20,.66);
    box-shadow:0 0 34px rgba(229,72,77,.25); }
  .stamp small{ display:block; font-size:23px; letter-spacing:3px; margin-top:8px; font-family:"SF Mono",monospace; }

  /* 底部大字层 — 压在虚化桌面上 */
  .caption{ position:absolute; left:52px; right:52px; bottom:150px;
    font-size:76px; font-weight:900; line-height:1.2; letter-spacing:1px;
    font-family:"PingFang SC","Heiti SC",sans-serif; text-shadow:0 4px 24px rgba(0,0,0,.85); }
  .caption b{ color:var(--red); }
  .caption .sub{ display:block; font-size:43px; font-weight:700; color:#c9d1d9; margin-top:20px;
    text-shadow:0 3px 16px rgba(0,0,0,.9); }
</style>
</head>
<body>
  <div class="stage">
    <div class="scrim"></div>
    <div class="noise"></div>

    <div class="term">
      <div class="titlebar">
        <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <div class="path">claude ~/my-ai-assistant</div>
      </div>
      <div class="body">
        <div class="line prompt dim"><span class="caret">&gt;</span><span class="u">记住:出片先过质量门,不能跳。这是死规矩。</span></div>
        <div class="line dim"><span class="bullet">⏺</span><span class="a">好的,已写入记忆 <span class="ok">✓ Memory updated</span></span></div>
        <div class="divider"><span class="l"></span><span>── new session · 第二天 ──</span><span class="l"></span></div>
        <div class="line prompt dim"><span class="caret">&gt;</span><span class="u">按之前那条规矩来</span></div>
        <div class="line punch"><span class="bullet">⏺</span><span class="a">你说的「规矩」…是指哪条?能具体说说吗?<span class="blink"></span></span></div>
      </div>
      <div class="stamp">抓包<small>CAUGHT</small></div>
    </div>

    <div class="caption">
      它满口“记住了”。<b>第二天问它——啥?</b>
      <span class="sub">白纸黑字摆它眼前,它就是不读</span>
    </div>
  </div>
</body>
</html>

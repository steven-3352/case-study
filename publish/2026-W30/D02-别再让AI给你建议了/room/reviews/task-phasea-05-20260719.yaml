    notes: |-
      文本有清楚的竞猜、案例、A组基线、B组失败倒推、揭晓、可抄Prompt和适用边界，且“改变的不是语气强弱，而是回答结构”是准确又有记忆点的主句；“小事别用”也阻止观众把方法滥用于日常选择。扣(-9)：前5秒和15至30秒长句偏密，生产级TTS若按44秒硬压会削弱事故叙事应有的停顿；“现金流为什么先断”与前面的客户流失、接不到客户存在因果顺序含混，听感上像三个并列反问而不是倒推链。修正：首句拆成两拍，失败链用“先看到现金流断，再往回查到获客和交付”明确方向，23秒揭晓前留一次短停，Prompt段降低语速并隐藏常规字幕。

    notes: |-
      “哪份先看了结局”比普通知识口播更有动作感，事故时间线倒放、抽封条和验尸票也形成了独立于D01左右双卡的纵向叙事；Prompt停留10秒和四选一CTA分别服务收藏、评论，数据杠杆清楚。扣(-13)：0至5秒口播同时塞入同一计划、回了两遍、A/B竞猜和半年后失败四层信息，3秒内难以听清；真正揭晓拖到23秒，接近全片一半，10至23秒又是高密度风险清单，观众没有足够即时奖励。修正：0至3秒只保留“哪份先假设它已经失败”，5至8秒先给B的局部揭晓，再把“双轮都如此”作为23秒二次证据回报，避免用单一谜底硬撑半片。


    notes: |-
      项目如实记录了“我改成小林”的人称实验失败，并禁止该命题进入脚本；替代的事前验尸实验有两轮完整A/B原文和短哈希，支持“组织方式改变、每条绑定现有事实”的窄主张，发布包也明确不声称更准、更凶或能预测未来。扣(-8)：脚本15至23秒把“客户流失、接不到客户、现金流先断”合成为一条顺滑失败链，但两轮B的排序和节点并不完全相同，Round 2没有客户流失这一节点；若画成统一因果链，会把跨轮归纳伪装成单次原始输出。修正：画面明确标注R1/R2各自路径，再提炼共同结构，不要让合成链看起来像逐字实验结果。


    notes: >-
      脚本正确放弃了未经支持的人称效应，也明确复合 Prompt 只改变组织结构、不代表提高准确率，这是必要进步。但扣(-18)：口播把输出概括成固定的“客户流失、客户接不到、现金流断”三条，并称“每条死因都绑定现有事实”，与原始证据不完全一致。两轮 B 的排序和第三项不同，获客路径、定价依据、财务缓冲等多处依据其实是计划中的缺失，而不是已给出的现有事实。修正时应说“两轮都按失败路径排序，并逐条标出计划里的事实或信息缺口”，画面将三条标成“两轮结构归纳”，不得表现为某次模型原文或稳定一致结论。
  - role: 内核提炼师
    angle: "方法增量、可迁移性与观众可执行结果"
    score: 88
    verdict: fail
    notes: >-
      “事前验尸”比泛泛索要建议更具动作性，收藏句包含失败前提、可能性与破坏性、证据锚定和暂缓建议，适用于辞职、创业等高赌注场景，边界“小事别用”也保留了分寸。扣(-12)：两轮普通问法本身已严格列出近似风险，当前内核容易让观众误解新指令发现了新的死因，而证据只支持组织方式变化；同时“每条引用现有事实”超出了实验实际输出。修正应把价值承诺改为“把风险改写成按优先级核查的失败路径，并显式标注事实或缺口”，让增量落在审查结构而非风险发现能力。
  - role: 形式选型师
    angle: "与D01去同构、倒放叙事和留存节拍"
    score: 91
    verdict: pass
    notes: >-
      从“六个月后失败”首帧逆推到当前事实，天然形成方向明确的视觉运动和连续路径回报；不再做 A/B 竞猜，也不复用 D01 的双栏选择外层骨架，形式区分充分。事故节点、事实扣合、双轮响应签、长票据和四类 CTA 均声明了数据杠杆。扣(-9)：26–36 秒十秒长票据仍可能造成中后段静止塌陷，且三条路径若同时堆叠会像普通风险清单。修正时应让倒放主线贯穿 Prompt 段，以“失败前提→排序→事实/缺口→先不建议”四个节拍逐项点亮，最后保留四秒无遮挡完整票据供暂停收藏。

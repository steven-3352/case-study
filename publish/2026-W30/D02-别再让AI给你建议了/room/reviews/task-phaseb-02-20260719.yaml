      扣(-4)：19.29–27.39s四段真实路径为了容纳逐字短摘，正文较小，手机不停播时“计划中的缺失”这条审计边界不易一次读完。扣(-3)：27.39–46.95s连续使用上标题、中部票据/纸张、底部黑字幕带，构图重心变化偏弱且留白较多。扣(-2)：34.88–46.95s Prompt页同时存在“暂停可抄”、四条指令、来源披露和底注，信息层级虽不冲突，但底部审计字在普通手机亮度下偏弱。

      可执行改法：倒推路径镜把四段改成“原因卡/事实卡”两次近景切换，关键原文各保留一行；双轮镜采用左右票据，Prompt镜改为纵向长票，拉开构图差异；将“修订版未单独A/B”提高到与暂停标签同级，删去重复底注。视觉角色本轮刚过线，重渲染动效时需保持当前文字安全区。


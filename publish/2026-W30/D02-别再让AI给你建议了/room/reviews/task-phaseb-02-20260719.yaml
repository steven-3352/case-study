      扣(-15)：freezedetect实测12.57–19.30s静止6.73s、21.27–27.40s静止6.13s、38.17–46.97s静止8.80s，另有29.63–34.90s静止5.27s；超过每2–4s变化硬标准，且发生在普通风险、证据路径、双轮结论、收藏Prompt四个连续中段镜头，完播风险显著。扣(-3)：6.30–27.39s三镜都采用“条目逐个出现后整页停住”，动作语法重复，逆向事故隐喻没有贯穿到实验依据。扣(-2)：46.95s CTA虽有四格依次亮起，但48.20s后又静止到片尾，末句缺少一次明确的选择/落签反馈。


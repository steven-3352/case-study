    notes: |-
      外部来源已补入 Gary Klein 2007 年 HBR《Performing a Project Premortem》作为直接方法语境，并把其余中文文章和 PCWorld 明确降为补充背景；文档逐项写清“不证明更准、更凶、能预测失败或提升留存”，也声明 D02 结论只能来自独立双轮实验，来源分级没有用 B 级网页冒充效果验证。扣(-8)：除 HBR 外的四条来源仍缺作者、完整标题与访问回执，且 HBR 摘要为方法定义语境，不是 AI Prompt 有效性研究；当前也没有可复核的抖音原生样本。可执行修正：补齐来源元数据及抓取证据，平台 hook 继续标 agent_hypothesis，任何效果预测只能进入 forecast 而不能写成事实。

  - role: 记者
    angle: "实测原 Prompt、严谨复制版与双轮原因边界的公开表述"
    score: 92
    verdict: pass
    notes: |-
      实验原件完整保存两轮 A/B 的 UTC、response id、returned_model、usage、脱敏请求体、未删改响应及完整 SHA256；原 B Prompt 明确要求“三个原因、引用计划现有事实”，而当前口播用“更严谨地抄这句”清楚标出发布版已修订为“每个标明已给事实或信息缺口”，没有把修订稿冒充原始实测指令。中段只展示 Round 1 两条具体原因及其事实/缺口依据，并常驻“不代表两轮原因相同”；随后又明说两轮具体原因和排序不完全一样，因此没有合成固定三段链。扣(-8)：发布正文和置顶评论虽给出修订版，却未像口播一样明确写“这是基于实测暴露问题后的严谨版”，截图脱离视频时仍可能被误认成原 Prompt。可执行修正：在置顶评论前加“严谨改写版”，证据镜继续显示 Round 1 标签与短哈希，禁止删除差异限定。

  - role: 选题深挖师
    angle: "事前验尸的受众场景、结构收益与不制造虚假因果链"
    score: 91
    verdict: pass
    notes: |-
      选题面向辞职、副业、创业、转行等高赌注计划，首屏直接站到“六个月后失败”的现场并回查原因，内容收益不是让 AI 更凶，而是把回答组织成“失败原因→依据类型”；普通问法已经严格、两轮内容不同、整组复合干预和小事别用均进入口播，避免了虚假反派与万能药。可复制版补上“已给事实/信息缺口”二分，也正面修复了原实验指令只要求现有事实却被模型迫使使用缺口的矛盾。扣(-9)：标题“别再让 AI 给你建议了”仍比正文适用边界绝对，且复制版固定要求倒推三个原因，观众可能误把“三个”当方法本质或稳定结果。可执行修正：封面和标题收窄为“重大决定，先别急着要建议”，Prompt 可写“倒推三个最关键原因（数量可按计划调整）”，但不得把两轮具体原因与排序合并展示。

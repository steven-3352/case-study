    notes: |-
      优点：0s“6个月后·计划失败”红色事故标记和hit同时入场，6.30s倒带whoosh转入固定计划，19.29s再次倒带揭示真实路径，27.39s双哈希盖章，34.88s Prompt展开，46.95s CTA按钮逐个出现。“从未来事故往回查”是本条专属视觉隐喻，不是catalog三连。实际MiniMax音频从0s进入，Prompt段降速到0.96，SFX未造成≥3s静音或削波。

      扣(-10)：freezedetect（-50dB，d=2.5s）显示2.200-6.300s（4.10s）、7.833-12.567s（4.73s）、13.667-19.300s（5.63s）已完全像素不变；前19秒除每镜入场外，其余基本是静态看板，和“每2-4s视觉变化”不符。改法：首镜按“失败结果→已给事实→信息缺口→失败原因”分0.0/1.2/2.4/3.6s逐节点回溯；固定计划和普通风险每1.2-1.8s只出一条，不要入场后整镜静置。

      扣(-8)：留存最重的中段同样出现21.333-27.400s（6.07s）、28.967-34.900s（5.93s）的长静止；即使40.400-46.967s（6.57s）是可暂停收藏镜，前两段也不是主动阅读例外，会使证据高潮变成PPT。改法：19.29-27.39s的四层路径必须按VO的“原因/依据/缺口”逐条亮灯；27.39-34.88s先单列Round 1，再落Round 2，最后才合并红线与结论；Prompt静置期可保留，但增加不干扰阅读的3s倒数或行号焦点。

      结论：形式隐喻和音效节点是对的，但动画只发生在入场瞬间，没有支撑52.48s的留存。本轮必须fail，重渲后重做freezedetect和真机观看。


      扣(-5)：多幅成片帧的主体信息只占上半屏，例如0.5s时间线、13s风险列表、28-32s双轮凭证，中下部大面积空白，在抖音手机端会读成文档投影而非视频画面。改法：不放大字号，将时间线与路径节点扩展到中部，双轮卡下方展开“原因→依据”连线，让空间服务叙事。

      扣(-4)：底部“修订版/未单独A/B”披露、Round哈希和Prompt下方来源注在手机端偏小；外挂SRT的第1个cue有3行，违反音频计划“max_lines: 2”，且存在“几\n乎”等词内换行。改法：将事实护栏改为单行高对比披露；按意群重切SRT，每cue最多2行，禁止词内断行。

      结论：纵向事故板有本条专属识别度，主层级与Prompt收藏性通过；空白利用和小字披露是下轮应修的形式问题。


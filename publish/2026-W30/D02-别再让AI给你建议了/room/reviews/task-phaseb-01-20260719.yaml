    notes: |-
      0-6.30s先把观众扔进“半年后已失败”的未来事故，6.30-19.29s交代虚构计划与普通问法已经够严格，19.29-34.88s用Round 1原文短摘和双轮哈希完成“原因→依据”的证据转折，34.88-46.95s给出修订版Prompt，最后5.53s用辞职/副业/创业/转行做真实选择型CTA。叙事、方法和互动三段都有明确成果。

      事实边界处理到位：台词明说“第二轮原因和排序变了”，只把“失败原因后面跟依据，而且不先给建议”作为稳定观察；画面常驻“具体原因与排序不完全一致·不代表提高准确率”，Prompt也标注为根据实测暴露问题的修订版，没有冒充原始A/B输入。MiniMax分段时序为7段/52.48s，Prompt段以0.96速率留出朗读空间，每段与SRT文本一致且未裁字。

      扣(-3)：“第一轮写：能力证据为负”到“第二轮原因和排序变了”的19.29-34.88s语义密度高，若视觉没有跟随逐条强调，观众会把“本轮原因”和“跨轮稳定结构”混在一起。改法：保留台词，但将“Round 1原文”、“Round 2不同”、“只稳定结构”三个句块用明确的分镜节点分开。

      扣(-3)：52.48s中Prompt占12.07s，对收藏有利，但对不暂停观众偏长；“按可能性和破坏性”与“每个标明事实/缺口”可能需要第二遍才记住。改法：不删Prompt内容，在35-41s用逐行口语重述，41s后给完整静态版；或将前面计划背景压缩2s，保留Prompt收藏时间同时降低总时长。

      结论：脚本强在不夸大实验、将“依据”拆成已给事实和信息缺口，方法可复制、CTA能接话；内容门通过，中段需由形式门解决。

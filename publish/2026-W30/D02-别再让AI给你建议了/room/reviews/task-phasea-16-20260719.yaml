  - role: 视觉语言策展师
    reviewer_id: phasea16-d02-visual-language
    reviewer_agent_id: task-phasea-16-20260719
    review_mode: independent
    angle: "纵向事故回溯语言、事实与信息缺口的材质编码、长Prompt与平台安全区"
    score: 93
    verdict: pass
    notes: |-
      D02以未来事故节点、逆向箭头、纵向红轴、事实实线票和信息缺口虚线票组成独立视觉语法，14至21秒的四行路径沿左侧红轴自下而上扣回依据，明显区别于D01横向双栏实验。抽查专属终帧可见原因、事实、缺口、双轮限定和CTA均在安全区内，正文无截断或相互遮盖；Prompt采用整张纵向长票，四行大字与底部“修订版未单独A/B”披露都能同时读到。扣(-7)：4至14秒连续两镜仍偏常规纸面清单，事故红轴暂时消失，纵向回溯身份感中断约10秒；具体修正：正式转场可保留一条低对比红轴或反向箭头残影贯穿事实板与普通回答板，但不得新增无证据标签或抢走“普通回答已经够严格”的焦点。

  - role: 动效技术导演
    reviewer_id: phasea16-d02-motion-technical
    reviewer_agent_id: task-phasea-16-20260719
    review_mode: independent
    angle: "纵向时间轴的确定性实现、Prompt运行时静止保证、SFX序列展开与真实TTS对齐风险"
    score: 90
    verdict: pass
    notes: |-
      七模板均从`window.__data`读取配置，使用paused timeline配合逐帧seek，主要属性限定为x/y/scale/scaleY/autoAlpha和背景色，没有运行时网络、ScrollTrigger或CSS动画。Prompt镜头以实际`scene_duration`计算reveal，四行约2.6秒全部可见，最后一次关键词高亮约5.9秒结束，因此10秒目标镜头仍保留超过4秒的全文静止区。D02音效8个原始事件展开为12个事件，`ambient/hit/whoosh/tick/hit_seq/tick_seq`均解析到本地CC0 WAV，0 gap且序列字段符合mixer实现。扣(-10)：TTS超出目标时会让后续runtime场景顺延，但音效仍绑定4/9/14/21等名义时刻；此外catalog alias只指向family首个候选，`hit_seq`实际会选soft boom而非注释期待的UI accent。具体修正：混音前按`seg_timing`重映射场景起点，并为序列事件显式指定`src_rel`到合适CC0样本，再复核瞬态不遮VO。

  - role: 动效设计师
    reviewer_id: phasea16-d02-motion-design
    reviewer_agent_id: task-phasea-16-20260719
    review_mode: independent
    angle: "首屏逆推兑现、纵向原因到依据扣合、证据签节奏与Prompt收藏停留"
    score: 92
    verdict: pass
    notes: |-
      首镜0秒即从未来端向左回退，节点按从终点向前的顺序出现，约2.15秒完成首次“事故到回查”的视觉兑现；14秒后的红轴先自底部展开，四条原因/事实/缺口逐项落位，运动方向和事前验尸语义一致。21秒双轮票据短促落下后由竖线汇入“失败原因到依据”，28秒Prompt则主动降速，全文常驻并只轮换关键词底色，38秒四张计划便签再恢复短促节奏，整片有快慢变化。扣(-8)：首镜三个节点仍横向并列，只有箭头表达逆向，观众可能先读成普通流程图；具体修正：保持当前4秒内兑现，但让箭头起点与“6个月后失败”在像素上明确相连，节点从右向左逐个激活，进入14秒纵向红轴时用同一红色方向符完成视觉交接。

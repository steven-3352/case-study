content_id: W30D02
paths: {root_rel: publish/2026-W30/D02-别再让AI给你建议了}
audio_plan_rel: design/audio_plan.yaml
tts:
  provider: minimax
  voice_id: "Chinese (Mandarin)_Sincere_Adult"
  base_speed: 1.0
  segments:
    - {sid: accident_hook, target_start: 0, target_dur: 4, emotion: serious, text: "假设半年后，你的辞职计划已经失败。先别救，往回查它怎么死的。"}
    - {sid: fixed_plan, target_start: 4, target_dur: 5, emotion: neutral, text: "测试计划里：自己账号四周几乎零涨粉，却想辞职做代运营、月入两万。"}
    - {sid: ordinary_risks, target_start: 9, target_dur: 5, emotion: neutral, text: "普通问法列风险：能力没验证、获客没路径、辞职风险高。已经够严格。"}
    - {sid: autopsy_paths, target_start: 14, target_dur: 7, emotion: serious, text: "第一轮写：能力证据为负，依据是四周零涨粉；没写获客，就标信息缺口。"}
    - {sid: experiment_evidence, target_start: 21, target_dur: 7, emotion: neutral, text: "第二轮原因和排序变了。稳定的只有：失败原因后面跟依据，而且不先给建议。"}
    - {sid: prompt_save, target_start: 28, target_dur: 10, emotion: neutral, speed: 0.96, text: "更严谨地抄这句：假设六个月后计划失败，按可能性和破坏性倒推三个原因；每个标明已给事实，还是信息缺口。先别给建议。"}
    - {sid: boundary_cta, target_start: 38, target_dur: 5, emotion: neutral, text: "小事别用。辞职、副业、创业、转行，你想先验哪一个？"}
scenes:
  - {id: accident_hook, template: d02_w30_failure_rewind.html, data: {end: "6个月后·计划失败", questions: ["失败原因", "已给事实", "信息缺口"], facts: ["能力证据为负", "4周几乎零涨粉", "没写获客路径"], hook: "Round 1 一条路径·不是结果预测"}}
  - {id: fixed_plan, template: d02_w30_fixed_plan.html, data: {facts: ["自有账号4周几乎零涨粉", "辞职做AI代运营", "月目标2万"], disclosure: "测试案例·虚构计划"}}
  - {id: ordinary_risks, template: d02_w30_a_risk_list.html, data: {title: "普通问法·已经够严格", risks: ["能力没验证", "获客没路径", "辞职风险高"]}}
  - {id: autopsy_paths, template: d02_w30_ab_guess.html, data: {title: "看一条真实倒推路径", paths: ["1. 你唯一的能力证据是负面的", "支持事实：计划明确写着‘做过4周自己的账号，涨粉几乎为零’", "3. 计划中完全没有‘获客’这一环节", "它的依据是‘计划中的缺失’，而非某条已写出的事实"], path_types: [cause, fact, cause, gap], disclosure: "Round 1 逐字短摘·不代表两轮原因相同"}}
  - {id: experiment_evidence, template: d02_w30_reveal.html, data: {rounds: ["Round 1", "Round 2"], hashes: ["082eb54f", "e5061fad"], conclusion: "稳定的是：失败原因→依据", qualifier: "具体原因与排序不完全一致·不代表提高准确率"}}
  - {id: prompt_save, template: d02_w30_prompt_strip.html, data: {prompt_lines: ["假设六个月后计划失败，", "按可能性和破坏性倒推三个原因，", "每个标明：已给事实 / 信息缺口，", "先别给建议。"], min_static_hold_s: 4.0}}
  - {id: boundary_cta, template: d02_w30_boundary_cta.html, data: {boundary: "小事别用", options: ["辞职", "副业", "创业", "转行"], question: "你想先验哪一个？"}}

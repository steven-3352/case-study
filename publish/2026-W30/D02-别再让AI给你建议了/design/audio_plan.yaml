# 声音方案 · audio_plan.yaml · T041 别再让AI给你建议了——它只会顺着你说
# 工种: 声音设计师 · 视频形态必跑
# 视觉路线复用声明：本条复用 S4 系列共享视觉基础设施，VO硬约束(真人声/禁TTS)对全系列成立(同一账号人设)，
#   录制内容/emotion_arc/sfx卡点按本条脚本独立设计，不复用T040的具体事件时间点。
#
# ── 0. 入口必读(开工前打勾) ─────────────────────────────────────────
# [x] SYSTEM refs: §3.3 音画三件套 · §2.4b 视频硬门(配音+BGM+字幕)
# [x] template refs: 本节点已完成 script/T041_录音提词稿.md(定稿版·含逐句怎么念标注) · design/retention_beat_sheet.md · design/motion_storyboard.md
# [x] memory refs: **feedback_no-robot-voice-ontopic-assets(绝对不用机器人/TTS配音,连MiniMax情绪版都被一票否决)** · feedback_no-synth-bgm(禁ffmpeg合成假BGM/假sfx)
# [x] 参考 publish/2026-W30/D01-让AI说真话致命漏洞/audio_plan.yaml 的硬约束/字段结构，事件时间点/emotion_arc按本条脚本独立设计
# [x] 能力清单 refs: FREESOUND_API_KEY 已配(sfx可真实检索下载,非合成)
#
# ⚠️ 本文件唯一无法由我(Agent)独立完成的环节：VO 必须是真人声，需要用户本人录制。
#    下方 voice 字段按项目铁律标注为"待真人录制"，不填 TTS provider——这不是遗漏，是硬约束。

content_id: T041
topic_id: T041

voice:
  engine: human_real_voice   # 硬约束(非模板默认的 minimax/edge)：memory feedback_no-robot-voice-ontopic-assets
                              # 用户原话"绝对不用机器人配音"——TTS(含MiniMax情绪版)一票否决，全系列(S4)统一适用
  status: pending_user_recording   # 阻塞项：需用户本人录制，Agent 无法代劳
  persona_fit: |
    T041 与 T040 同属"让AI说真话"系列，persona_anchor 同为"一个真实把AI当参谋、
    被AI当场挑出过致命漏洞的人"——本条差异化在于情绪认同角度(反谄媚/反直觉否定钩)，
    真人声的语气反转(自嘲→认真→解气→温和叮嘱)是内容本身的一部分，TTS无法替代。
  script_path: script/T041_录音提词稿.md   # 定稿版，含逐句【怎么念】语气/停顿/重音标注，可直接当录音提词稿
  recording_guide: |
    按 T041_录音提词稿.md 各段【怎么念】逐句录(周末录音时对照本节直接念)：
    ①"别再信"三个字稍加重，带点辟谣的笃定感；停顿一下，"它其实会挑刺"往下压、认真说，
      像纠正对方的误会，不是抖包袱。(4s)
    ②"你看不见"放慢；"三千字正确的废话"带点无奈/吐槽的语气，不是念数据。(4s)
    ③"越看越安心"说得轻松、代入感强；"没人拦你"三个字压低放慢，带一点点后怕。(6s)
    ④"两个笨办法"带自嘲的轻快；"别夸我"模仿自己跟AI说话的语气，略俏皮；"编个陌生人"
      像分享小窍门，眼神发亮的感觉。(6s)
    ⑤"都试了"轻快带过；"秒收成一句"稍微加速制造反差；"自己没验证过"一字一顿咬清楚。(5s)
    ⑥整体转沉稳、真心话语气，像过来人叮嘱；"冷水"和"那口气"对比着说。(6s)
    ⑦"放了"干脆利落；最后问句放慢、尾音上扬，给观众一点被戳中、需要认真想一下的空间。(5s)
  target_duration_s: 36.0    # 按口播稿逐段标注时长精确加总(4+4+6+6+5+6+5)，与 storyboard.yaml/retention_beat_sheet 逐段时间轴对齐；
                              # 脚本文件自身"约35.3秒"是6字/s粗估口径，正式以逐段标注为准
  emotion_arc: 辟谣笃定(①) → 认真纠正(①后段) → 吐槽/无奈(②) → 代入轻松→后怕压低(③) → 自嘲轻快/眼神发亮(④) → 解气反差/咬字钉重(⑤) → 沉稳叮嘱(⑥) → 干脆+真诚发问(⑦)

bgm:
  enabled: off
  mood: neutral
  genre_hint: null
  source: null
  volume: 0
  fade_in_s: 0
  fade_out_s: 0
  loop: false
  benchmark_ref: null
  hook_0_3s: null
  notes: |
    密VO演示/知识型判定：36.0s全片口播稿逐段均为连续语句，无明确标注的3s+停顿段
    (与T040不同，T040曾在②③交接处标注1s急停+④末尾2s停留；T041脚本各段【怎么念】
    仅为语气/重音提示，非独立静默节拍)。按212字·5.5-6字/s估算，VO实际发声时长
    约35.3s/36.0s场景预算≈98%，远超85%门槛，也无任何单段死区接近3s。
    按CLAUDE.md §3.3"密VO演示/知识型(VO覆盖≥85%+无3s+死区)→默认无BGM"判定为 off。
    ③段末尾"没人拦你"(12.5-14.0s)是**画面留白**(警示图标位置刻意留空)而非VO停顿——
    这一处VO本身仍在说话，不构成死区，仅靠sfx的"刻意不设计"来呼应画面留白(见 sfx.events 说明)。
    外发命名：*_no_bgm.mp4 直接外发，非预览件。
    与T040判断结论一致，理由相同：S4系列内容性质高度一致(密集第一人称口播+证据流画面)，
    非盲目复用——本条独立核算逐段时长与死区后仍成立。

sfx:
  enabled: true
  formula_check:
    ambient_bed: true       # 全片极轻的证据感环境垫音，对齐design_language"克制"气质
    riser_before_hit: true  # 21s双源收拢前置riser
    hit_on_key_moment: true # 8s zoom-out揭示 + 23s全片最重一锤 + 31.8s双卡落点 均有hit
  gain_ref_db: -12
  events:
    - {sid: sfx01, kind: ambient, t_start: 0.0, duration: 36.0, gain_db: -22, src_rel: assets/sfx/ambient/TBD_room_or_office_tone.wav, note: "全片极轻氛围垫音，证据/克制调性；需 Freesound 检索'minimal office ambience'/'quiet room tone'CC0素材，禁ffmpeg合成"}
    - {sid: sfx02, kind: whoosh, t_start: 4.0, duration: 0.4, gain_db: -13, src_rel: assets/sfx/whoosh/TBD_soft_swish.wav, note: "①→②切换(流传说法划除→长文zoom特写)"}
    - {sid: sfx03, kind: rumble, t_start: 4.0, duration: 4.0, gain_db: -18, src_rel: assets/sfx/rumble/TBD_low_zoom_texture.wav, note: "②zoom-out镜头拉远过程的极轻质感音，强化'镜头在动'的感知，音量克制不抢VO"}
    - {sid: sfx04, kind: hit, t_start: 8.0, duration: 0.5, gain_db: -11, src_rel: assets/sfx/hit/TBD_soft_reveal_hit.wav, note: "8s zoom-out拉远完成，揭示'原来真的被埋没'的瞬间打点(克制的揭示感，非爆炸感)，与③场景切入同时发生"}
    - {sid: sfx05, kind: tick, t_start: 8.0, duration: 4.5, gain_db: -15, src_rel: assets/sfx/tick/TBD_checkmark_pop.wav, note: "③确信勾号连续pop-in，每个勾号配极轻click，强化'越看越安心'的持续递进感"}
    - {sid: sfx06, kind: silence_by_design, t_start: 12.5, duration: 1.5, gain_db: null, src_rel: null, note: "③段'没人拦你'(12.5-14.0s)刻意不设计sfx——警示图标位置留空的视觉设计需要用'声音的缺席'呼应，若此处加hit反而破坏留白制造的后怕感，仅保留sfx01环境垫音"}
    - {sid: sfx07, kind: whoosh, t_start: 14.0, duration: 0.3, gain_db: -13, src_rel: assets/sfx/whoosh/TBD_soft_swish.wav, note: "③→④切换，收藏段起势"}
    - {sid: sfx08, kind: stamp, t_start: 15.5, duration: 0.4, gain_db: -13, src_rel: assets/sfx/stamp/TBD_soft_stamp.wav, note: "指令卡①'别夸我'落定瞬间的盖章感打点，呼应短句'一锤定音'的呈现方式"}
    - {sid: sfx09, kind: tick, t_start: 17.5, duration: 2.5, gain_db: -14, src_rel: assets/sfx/tick/TBD_typewriter_click.wav, note: "指令卡②'编个陌生人'GSAP逐行打字机每行落字配click，呼应④本身就是typing动效(同T040④手法)"}
    - {sid: sfx10, kind: whoosh, t_start: 20.0, duration: 0.4, gain_db: -13, src_rel: assets/sfx/whoosh/TBD_soft_swish.wav, note: "④→⑤切换，双模型徽标初现"}
    - {sid: sfx11, kind: riser, t_start: 21.5, duration: 1.0, gain_db: -14, src_rel: assets/sfx/riser/TBD_short_tension_riser.wav, note: "双模型文字向心收拢过程的前置riser，呼应VO'秒收'的加速感"}
    - {sid: sfx12, kind: hit, t_start: 23.0, duration: 0.8, gain_db: -8, src_rel: assets/sfx/hit/TBD_impact_stinger.wav, note: "全片完播顶点·金句'你想卖的这本事，自己没验证过'落点，音量为全片最响(仍不超VO-8dB)，呼应'全片最重一锤'"}
    - {sid: sfx13, kind: whoosh, t_start: 25.0, duration: 0.4, gain_db: -13, src_rel: assets/sfx/whoosh/TBD_soft_swish.wav, note: "⑤→⑥切换，反高潮承接"}
    - {sid: sfx14, kind: slide, t_start: 29.0, duration: 1.5, gain_db: -14, src_rel: assets/sfx/slide/TBD_soft_slide_tick.wav, note: "阶段滑块从'日常运营期'滑向'刚起步期'的滑动音效，落点配极轻收尾click"}
    - {sid: sfx15, kind: whoosh, t_start: 31.0, duration: 0.4, gain_db: -13, src_rel: assets/sfx/whoosh/TBD_soft_swish.wav, note: "⑥→⑦切换，CTA段起势"}
    - {sid: sfx16, kind: hit, t_start: 31.8, duration: 0.5, gain_db: -11, src_rel: assets/sfx/hit/TBD_soft_confirm_hit.wav, note: "双指令卡缩略滑入评论框落点，克制确认感"}
    - {sid: sfx17, kind: tick, t_start: 34.5, duration: 0.4, gain_db: -13, src_rel: assets/sfx/tick/TBD_fork_reveal_tick.wav, note: "右路径'顺着你'浮现的对比音(与左路径'说真话'浮现时的tick音高略有区分，强化二选一的对立感)"}
  note_design_rationale: |
    本条sfx设计与T040最大差异：③段"没人拦你"处**刻意不设计声音**(sfx06 silence_by_design)，
    用留白本身作为情绪工具，而非用hit/riser强调——这是本条独有的、内容驱动的声音设计决策，
    非遗漏(生产阶段需确认剪辑师知晓此处是有意留白，不要"补"一个音效上去)。

subtitles:
  srt_path: pending    # 待VO真人录制定稿后，按精确时间戳生成
  burn: true
  style: |
    对齐 publish/2026-W30/D01-让AI说真话致命漏洞/design/design_language.md 字体层级：
    display字级(72-88px)用于①钩子"它其实会挑刺"/⑤金句大字，
    body字级(30-34px)用于常规字幕行，mono/data字级仅用于④两张指令卡本体(非常规字幕)。
    主画面叠字，ink色微灰白变体，不用纯白刺眼；色板/字体token完全复用T040，不新造。
  hook_first_3s: true

outputs:
  video_raw: publish/2026-W30/D02-别再让AI给你建议了/成片/T041_raw.mp4          # 无BGM工程件(本条bgm本就off，raw=publish同一份)
  video_publish: publish/2026-W30/D02-别再让AI给你建议了/成片/T041_no_bgm.mp4   # 外发命名：*_no_bgm.mp4 直接外发(非预览件)
  vo_mp3: publish/2026-W30/D02-别再让AI给你建议了/成片/audio/T041_vo_human.mp3  # 真人录制，非TTS产物

qc:
  - "VO 必须是真人声，任何 TTS(含 MiniMax 情绪版)产出一律拒收，录制前二次确认(memory feedback_no-robot-voice-ontopic-assets)"
  - VO 清晰可辨，前 6s RMS 落在 -13~-23 dB
  - bgm.enabled=off：全程无音乐是设计，已在 notes 记明密VO依据(VO覆盖≈98%，逐段无3s+死区)
  - "sfx 硬门：sfx.enabled=true 且 formula_check 三项全为 true(本条已满足)"
  - "sfx 覆盖：每次场景切换(①→②等6处)均有 whoosh；全片最重一锤(23s)+CTA落点(31.8s)均有 hit；已核对无遗漏"
  - "sfx 音量：所有 events[].gain_db ≤ -8(本条最响的23s hit=-8dB，符合)"
  - "sfx 合规：所有 src_rel 标注为 TBD_ 前缀，表示尚未实际下载/命名，production阶段须真实走 Freesound CC0 检索，严禁 ffmpeg aevalsrc/sine 合成占位——这是计划文档，不是已完成的素材清单"
  - "③段12.5-14.0s 刻意无sfx(silence_by_design)，剪辑阶段需确认知晓，不要误补音效"
  - 前 3s 钩子字幕可见，与 design_language 字体层级一致
  - 外发使用 video_publish(T041_no_bgm.mp4)，非 video_raw

blocking_dependency:
  what: VO 真人录制(voice.status=pending_user_recording)
  who: 用户本人(persona_anchor要求第一人称真实语气反转，不可代录/不可TTS)
  why_blocking: |
    motion_tech_plan.md 已标注硬顺序依赖——②zoom-out的4s时长、⑤双源漏斗收拢的
    funnel_collapse_at_s、④双指令卡的显现节奏，均需按VO精确时间戳来定，
    不能反过来先定死timeline参数再配音。VO不录制，storyboard.yaml中标注PROVISIONAL的字段无法最终确定。
  next_action: 用户按 script/T041_录音提词稿.md + 本文件 voice.recording_guide 周末录制7段VO

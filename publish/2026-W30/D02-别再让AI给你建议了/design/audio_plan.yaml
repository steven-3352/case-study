status: ready_after_content_gate
content_id: W30D02
content_version: v3
form_version: v4

voice:
  engine: minimax
  model: speech-2.8-turbo
  voice_id: "Chinese (Mandarin)_Sincere_Adult"
  fallback_engine: none
  script_path: script/T041_录音提词稿.md
  target_duration_s: 43.0
  delivery: "克制实测；首秒进入未来事故；Prompt 段稍放慢。"
  production_rule: "pre_render 门禁 PASS 后才允许生成；实际分段 TTS 时长自动驱动分镜。"

bgm:
  enabled: false
  rationale: "密 VO 事前验尸演示，无 BGM；以低电平夜间办公室环境声维持空间。"

sfx:
  enabled: true
  timing_mode: "source秒点仅为直接解析兼容基线；正式混音由renderer按scene_sid+offset和真实seg_timing重排"
  source_policy: "仅使用 assets/sfx/catalog.yaml 已登记且本地存在的 CC0 WAV。"
  events:
    - {sid: room_tone, kind: ambient, t_start: 0.0, duration: 43.0, gain_db: -24}
    - {sid: accident_hit, kind: hit, t_start: 0.0, scene_sid: accident_hook, offset: 0.0, duration: 0.4, gain_db: -10}
    - {sid: facts_rewind, kind: whoosh, t_start: 4.0, scene_sid: fixed_plan, offset: 0.0, duration: 0.5, gain_db: -13}
    - {sid: ordinary_in, kind: tick, t_start: 9.0, scene_sid: ordinary_risks, offset: 0.0, duration: 0.18, gain_db: -17}
    - {sid: paths_rewind, kind: whoosh, t_start: 14.0, scene_sid: autopsy_paths, offset: 0.0, duration: 0.5, gain_db: -12}
    - {sid: evidence_stamps, kind: hit_seq, t_start_seq: [21.0, 21.45], scene_sid: experiment_evidence, offset_seq: [0.0, 0.45], duration_each: 0.18, gain_db: -13}
    - {sid: prompt_unfold, kind: whoosh, t_start: 28.0, scene_sid: prompt_save, offset: 0.0, duration: 0.5, gain_db: -14}
    - {sid: cta_ticks, kind: tick_seq, t_start_seq: [38.1, 38.55, 39.0, 39.45], scene_sid: boundary_cta, offset_seq: [0.1, 0.55, 1.0, 1.45], duration_each: 0.12, gain_db: -18}

subtitles:
  burn: false
  srt_path: douyin/subtitles.srt
  max_lines: 2
  prompt_scene_rule: "Prompt 正文就是主视觉，不叠烧录字幕；另交付可开关 SRT。"

mix_qc:
  - "0s 即有人声，前 6s 综合响度稳定"
  - "VO 无削波，SFX 不遮盖关键词"
  - "无任何 >=3s 静音死区"
  - "只使用 catalog 可解析的 CC0 素材"

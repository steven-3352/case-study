    fix: "把首镜拆成≤4s：0s直接说‘普通问法首答内给建议；加流程后只先问一题’，实验轮数移到证据脚注或下一镜。末镜只保留完整可执行Prompt主卡+暂停提示，九问全文同步置顶评论。"


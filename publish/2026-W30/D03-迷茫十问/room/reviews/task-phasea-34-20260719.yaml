    evidence: |-
      故事弧完整：真实首答冲突建立问题，第二镜立即限制“只证明顺序变化”，中段从生存事实推进到目标边界和本周验证，后段用第十问提供新回报，最终回到人类拍板。画面语法由A/B标签汇入单轨，再依次变为四列闸、双靶窄门、三节点加速轨和终检门，不是同一清单卡连续朗读；没有虚构真人效用结果。

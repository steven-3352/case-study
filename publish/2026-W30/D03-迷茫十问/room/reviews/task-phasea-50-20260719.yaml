    angle: "双轮API原件、像素主张、复合干预边界与第十问标注"
    score: 96
    verdict: pass
    evidence: |-
      两轮普通问法首答均在同一回复内给建议，两轮流程组首答均只先问“你现在靠什么活着”，questions_ab_evidence保留请求、response id与SHA256。production只说“回答顺序变了”，第二镜像素写“双轮同方向·只证明组织变化”，边界镜逐项否定更准、更有用、能找到方向。第十问像素明确“编辑补充·待真人结果验证”，没有把未跑完的真人多轮包装成有效性证据。
    deductions: |-
      (-1) 首屏“先建议↔先问事实”是摘要，不是原文逐字截图，需保留“摘要/双轮”标签。(-1) “加上流程后”代表九问、逐问等待、不假设等复合干预，不能拆归因到某一句。(-1) 出口票规则“第10问验收具体下一步”需持续保留编辑补充层级。(-1) 压力结果验证像素无遮挡，不验证事实来源本身。
    fix: "发布包继续保留复合干预和不证明效用的边界；任何裁切版不得删掉第十问的编辑补充标识。"

    angle: "纵向三关相对候选形式的停划、理解、完播、收藏与原创性"
    score: 94
    verdict: pass
    evidence: |-
      纵向三关诊断轨道把“先收事实再建议”的时序直接转成令牌穿门动作，比九张便利贴更能表达逐个问与等待，也比真人情景表演更符合无真人效用证据和不本人录音约束。首答汇流、四列闸、双靶窄门、三节点轨、第十问终检和出口票均为内容专属构图，与D01双栏、D02事故轴及D04/D05形式不撞。1.5x下最大动作间隔约2.5s，出口票315帧压力最大连续相同41帧=1.367s且无遮挡。
    deductions: |-
      (-2) 出口票同屏九问、四规则、CTA和边界，规则24px更适合暂停收藏而非自然播放。(-1) 首屏仍短暂使用A/B摘要，需确保立即汇轨而不退化成竞猜双栏。(-1) 轨道连续三镜若令牌视觉权重过高，可能产生形式重复。(-1) 静态storyboard末镜时长仍未同步production。(-1) 真机可读性尚需最终成片抽检。
    fix: "保持首答双块只作瞬时证物并快速汇轨；末镜优先收藏层级，必要时删次级词；真机抽检24px规则。"

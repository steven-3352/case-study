# storyboard.yaml · T042 千万别问AI「我该怎么办」(抖音)
#
# 本条视觉路线复用 S4 系列共享基础设施(openmontage_brief=disabled_by_choice / 浅色 token),镜头设计独立完成。
#
# ⚠️ 状态:draft_provisional —— 本文件按 pipeline/p004_video/build.py + capture_frames.py
#    的真实 schema 编写(与 T040 storyboard.yaml 同一 schema 读源码得到,内容逐镜独立设计)。
#    与 T040 的关键差异:本条全部7个场景均为 type: html,**无 type: broll / raw 场景**——
#    不需要任何真实屏幕录制,用户周末只需完成 VO 录音即可进入合成。
#    以下字段等 audio_plan.yaml 的真人 VO 录制完成后需回填精确值(motion_tech_plan.md 硬依赖):
#      - scenes[04_step2_goal].data.hold_after_q1_s(需精确对齐VO"最怕的一件事"后的0.3-0.5s停顿真实时长)
#    其余场景 duration 已按 script/T042_录音提词稿.md 给定的逐段秒数(5/5/5/4.5/5.5/5/4)锁定,
#    非估算值,VO定稿后仅需核对是否与实际朗读节奏一致,通常不需要大幅调整。
#    HTML 模板(t042_*.html)尚未实际编写,本文件是渲染前的结构规划,不是可直接跑的成片输入。

video:
  fps: 30
  width: 1080
  height: 1920
  output_name: T042_no_bgm.mp4   # 对齐 audio_plan.yaml outputs.video_publish 命名(bgm.enabled=off)
  voice_volume: 1.0
  music_volume: 0.0              # bgm off,此字段被 build.py 忽略,保留占位

scenes:
  - id: 01_hook
    template: t042_01_hook.html   # 待建,pipeline/p004_video/templates/ 下新文件,不复用任何历史模板
    duration: 5.0
    type: html
    data:
      canvas: "#faf9f6"
      punch_line1: "别再问AI"
      punch_line2: "「我该怎么办」了"
      strike_target: "我该怎么办"     # accent删除线扫过的字符范围
      strike_at_s: 2.0
      strike_duration_s: 0.4
      sub_text: "它只会顺着焦虑瞎给方案,越答越飘"
      sub_text_at_s: 3.5
      vo_ref: "别再问AI「我该怎么办」了,它只会顺着焦虑瞎给方案,越答越飘。"
    note: 硬切punch入+accent删除线(非fade),duration=5.0按录音提词稿①段锁定

  - id: 02_flip
    template: t042_02_flip.html   # 待建
    duration: 5.0
    type: html
    data:
      line1: "上个月我也这么问过"
      line1_at_s: 0.0
      icon_rotate: {label: "反过来", from_deg: 0, to_deg: 180, at_s: 2.0, duration_s: 1.5}
      line2: "让AI逼问我"
      line2_at_s: 3.5
      vo_ref: "上个月我也这么问过,后来发现有用的问法是反过来——让AI逼问我。"
    note: 反转箭头图标为本条唯一"图标类"元素,线性描边非emoji大图;duration=5.0锁定

  - id: 03_step1_selfportrait
    template: t042_03_step1_selfportrait.html   # 待建,GSAP逐行常速(0.7s间隔),见 motion_tech_plan §动效3
    duration: 5.0
    type: html
    data:
      card_title: "①自我画像"
      card_title_at_s: 0.0
      questions:
        - {text: "现在靠什么活着?", at_s: 1.5, emphasis: normal}
        - {text: "钱还能撑几个月?", at_s: 2.2, emphasis: normal}
        - {text: "真正会的、做过的是什么?", at_s: 2.9, emphasis: normal}
        - {text: "(过去放弃过什么,为什么?)", at_s: 3.6, emphasis: caption_bonus}   # 原矿彩蛋条,口播未念,画面多露供收藏
      row_interval_s: 0.7
      source_note: "问题原文来自 raw-export/raw/2026-07-15-bot.md L36-53 参谋 system prompt,未改写未新增卖点"
      vo_ref: "第一步,它逼我说清楚:现在靠什么活着,钱还能撑多久,会的是什么。"
    note: 常速档;duration=5.0按录音提词稿③段锁定

  - id: 04_step2_goal
    template: t042_04_step2_goal.html   # 待建,GSAP逐行放慢+情绪停顿,见 motion_tech_plan §动效3
    duration: 4.5
    type: html
    data:
      card_title: "②定目标"
      card_title_at_s: 0.0
      prev_card_shrink: true      # ①自我画像卡缩小退至角落
      questions:
        - {text: "你现在最怕的一件事是什么?", at_s: 0.5, emphasis: display_large, reveal_duration_s: 0.8}
        - {text: "三个月后,什么状态算没白过?", at_s: 2.6, emphasis: normal}
      hold_after_q1_s: 0.4   # PENDING——需VO"最怕的一件事"后精确停顿时长回填(预设0.3-0.5s区间)
      vo_ref: "第二步问,我最怕的一件事是什么,三个月后怎样算没白过。"
    note: 放慢+停顿档,全篇情绪最沉;duration=4.5按录音提词稿④段锁定,hold_after_q1_s 待VO定稿回填

  - id: 05_step3_push
    template: t042_05_step3_push.html   # 待建,GSAP逐行加速(0.4s间隔),见 motion_tech_plan §动效3
    duration: 5.5
    type: html
    data:
      card_title: "③逼问推进"
      card_title_at_s: 0.0
      prev_cards_shrink: true     # ①②卡缩小排列
      questions:
        - {text: "买方还是卖方?", at_s: 1.0, emphasis: normal}
        - {text: "谁是第一个真实用户?", at_s: 1.4, emphasis: normal}
        - {text: "这周能做的最小验证是什么?", at_s: 1.8, emphasis: normal}
      row_interval_s: 0.4
      full_view_at_s: 3.5   # 拉远展示3问全貌
      vo_ref: "第三步逼我说明白:买方还是卖方,谁是第一个真实用户,这周最小验证什么。"
    note: 加速档,节奏肉眼可辨变快;duration=5.5按录音提词稿⑤段锁定

  - id: 06_honest_close
    template: t042_06_honest_close.html   # 待建,卡片收拢+空checkbox,见 motion_tech_plan §动效4
    duration: 5.0
    type: html
    data:
      cards_collapse: {from_scenes: [03_step1_selfportrait, 04_step2_goal, 05_step3_push], to_layout: "top_row_shrink", at_s: 0.0}
      checkbox_state: unchecked   # 硬约束:全片不出现勾选/填色动画,呼应诚实红线
      line1: "没拿到答案"
      line1_at_s: 1.0
      line2: "但知道自己在怕什么了"
      line2_at_s: 1.5
      line3: "拍板还是我自己"
      line3_at_s: 3.0
      line3_underline_target: "我自己"
      vo_ref: "三个问题问完,没拿到答案,但知道自己在怕什么了,拍板还是我自己。"
    note: 红线安全句场景;禁一切胜利感元素(打勾动画/金色高亮/上扬音效),duration=5.0锁定

  - id: 07_cta
    template: t042_07_cta.html   # 待建,3卡拼合compact排版,见 motion_tech_plan §动效5
    duration: 4.0
    type: html
    data:
      cards_merge: {from_scenes: [03_step1_selfportrait, 04_step2_goal, 05_step3_push], to_layout: "compact_9q_card", at_s: 0.0}
      merge_duration_s: 2.0
      caption: "↓可截图拿走"
      caption_at_s: 2.0
      comment_focus_text: "你现在卡在哪一步?"
      comment_focus_at_s: 2.3
      vo_ref: "这三步贴在画面上,收藏好,下次迷茫直接甩给AI。"
    note: 收藏钩收官;评论区UI为自绘mock非品牌截图;duration=4.0按录音提词稿⑦段锁定

# 总时长校验:5.0+5.0+5.0+4.5+5.5+5.0+4.0 = 34.0s,对齐 audio_plan.yaml target_duration_s

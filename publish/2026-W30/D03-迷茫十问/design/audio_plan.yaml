# 声音方案 · audio_plan.yaml · T042 千万别问AI「我该怎么办」
# 本条视觉路线复用 S4 系列共享基础设施(openmontage_brief=disabled_by_choice / 浅色 token),镜头设计独立完成。
# 工种: 声音设计师 · 视频形态必跑
#
# ── 0. 入口必读(开工前打勾) ─────────────────────────────────────────
# [x] SYSTEM refs: §3.3 音画三件套 · §2.4b 视频硬门(配音+BGM+字幕)
# [x] template refs: 本节点已完成 script/T042_录音提词稿.md(定稿版,7段·34s,含逐句怎么念)
#     · design/retention_beat_sheet.md · design/motion_storyboard.md · design/storyboard.yaml
# [x] memory refs: **feedback_no-robot-voice-ontopic-assets(绝对不用机器人/TTS配音)** · feedback_no-synth-bgm(禁ffmpeg合成假BGM/假sfx)
# [x] 姊妹条 refs: 复用 T040 audio_plan.yaml 的硬约束(voice.engine=human_real_voice,禁TTS),
#     本条的录制内容/emotion_arc 按 T042 脚本独立编写,非照抄 T040 内容
# [x] 能力清单 refs: FREESOUND_API_KEY 已配(sfx可真实检索下载,非合成)
#
# ⚠️ 本文件唯一无法由我(Agent)独立完成的环节:VO 必须是真人声,需要用户本人录制。
#    下方 voice 字段按项目铁律标注为"待真人录制",不填 TTS provider——这不是遗漏,是硬约束。
#    与 T040 的关键差异:本条全部7个场景均为 HTML+GSAP 渲染(见 storyboard.yaml),
#    **不存在"VO需先录、录屏才能定参数"这类硬顺序依赖**——用户只需完成本文件的VO录制,
#    即可直接进入 pipeline 合成,无需额外拍摄/录屏动作。

content_id: T042
topic_id: T042

voice:
  engine: human_real_voice   # 硬约束(复用 T040):memory feedback_no-robot-voice-ontopic-assets
                              # 用户原话"绝对不用机器人配音"——TTS(含MiniMax情绪版)一票否决
  status: pending_user_recording   # 阻塞项:需用户本人录制,Agent 无法代劳
  persona_fit: |
    T042 的核心是"我被这三步问住了"的第一人称真实经历陈述——本条无第三方案例、无虚构人物,
    真人声比任何TTS都更贴合"这是我自己上个月真实发生的事"这个叙事锚点,与 T040 同理但语境不同:
    T040 是"证言式实测",T042 是"独白式复盘",两者都要求真人声的真实感,不可替换。
  script_path: script/T042_录音提词稿.md   # 定稿版,含逐句【怎么念】语气/停顿/重音标注,可直接当录音提词稿
  recording_guide: |
    按 script/T042_录音提词稿.md 各段【怎么念】逐句录(下方摘录,录制前以原文件为准):
    ①(5s)"别再问AI'我该怎么办'了,它只会顺着焦虑瞎给方案,越答越飘。"
       前2字("别再")加重、略停顿再接"我该怎么办",语气是拆穿式的笃定,不是抱怨。
    ②(5s)"上个月我也这么问过,后来发现有用的问法是反过来——让AI逼问我。"
       "反过来"三字放慢、音调上扬制造转折感,像分享一个自己踩过坑才悟出的窍门。
    ③(5s)"第一步,它逼我说清楚:现在靠什么活着,钱还能撑多久,会的是什么。"
       三个短问句之间用轻微停顿隔开,像被追问时略带压迫感的语速,不要念成朗读列表。
    ④(4.5s)"第二步问,我最怕的一件事是什么,三个月后怎样算没白过。"
       "最怕的一件事"放慢,是全篇情绪最沉的一句,给0.3-0.5s停顿再接下一句(此停顿精确时长
       需回填 storyboard.yaml scenes[04_step2_goal].data.hold_after_q1_s)。
    ⑤(5.5s)"第三步逼我说明白:买方还是卖方,谁是第一个真实用户,这周最小验证什么。"
       语速可比③④略快,体现"逼问推进"的紧迫感,三个问题一口气带过。
    ⑥(5s·红线安全句,不能省)"三个问题问完,没拿到答案,但知道自己在怕什么了,拍板还是我自己。"
       "没拿到答案"要念得坦然不失落,"拍板还是我自己"是全篇的态度锚点,收得干脆不煽情。
    ⑦(4s)"这三步贴在画面上,收藏好,下次迷茫直接甩给AI。"
       语速回快,收在轻松的动作指令感上,不要拖尾音。
  target_duration_s: 34      # 按录音提词稿字数校验(213字·6.2字/s估算),与 retention_beat_sheet/storyboard.yaml 逐段时长完全对齐
  emotion_arc: 拆穿式笃定(①) → 悟出窍门的转折(②) → 压迫感追问(③) → 情绪最沉(④) → 紧迫感加速(⑤) → 坦然不失落的态度锚点(⑥) → 轻松动作指令(⑦)

bgm:
  enabled: off
  mood: neutral
  genre_hint: null
  source: null
  volume: 0
  fade_in_s: 0
  fade_out_s: 0
  loop: false
  benchmark_ref: null
  hook_0_3s: null
  notes: |
    密VO演示/知识型判定:34s全片VO几乎连续覆盖,唯一的内部停顿是④段"最怕的一件事"后的
    0.3-0.5s情绪停顿 + ⑥段"没拿到答案"前的半拍停顿,两处均远低于3s死区门槛,且均落在
    单个VO段落内部(非独立无声场景,不同于T040④曾有的2s指令卡纯停留段)。
    VO连续覆盖时长约33.2/34s≈97.6%,远超85%门槛,密度高于T040(约92%)。
    按CLAUDE.md §3.3"密VO演示/知识型(VO覆盖≥85%+无3s+死区)→默认无BGM"判定为 off。
    ④⑥两处情绪停顿靠 sfx(hold感用ambient持续+轻微riser)撑氛围,不靠BGM,
    且刻意不用明显打点音效强化"停顿"感,避免喧宾夺主盖过VO的情绪表达。
    外发命名:*_no_bgm.mp4 直接外发,非预览件。

sfx:
  enabled: true
  formula_check:
    ambient_bed: true       # 全片极轻环境垫音(见events sfx01),对齐design_language"克制"气质
    riser_before_hit: true  # 24s(⑤→⑥转折前)riser、30s(⑦卡片拼合前)riser
    hit_on_key_moment: true # 25s卡片收拢定格 + 30.3s清单卡拼合确认 均有hit(均为克制的soft settle,非爆炸感)
  gain_ref_db: -12
  events:
    - {sid: sfx01, kind: ambient, t_start: 0.0, duration: 34.0, gain_db: -22, src_rel: assets/sfx/ambient/TBD_room_or_office_tone.wav, note: "全片极轻氛围垫音,证据/克制调性;需 Freesound 检索'minimal office ambience'/'quiet room tone'CC0素材,禁ffmpeg合成"}
    - {sid: sfx02, kind: whoosh, t_start: 2.0, duration: 0.4, gain_db: -14, src_rel: assets/sfx/whoosh/TBD_marker_strike.wav, note: "accent删除线扫过'我该怎么办'的划线声,像马克笔划过,非爆炸感"}
    - {sid: sfx03, kind: whoosh, t_start: 5.0, duration: 0.3, gain_db: -13, src_rel: assets/sfx/whoosh/TBD_soft_swish.wav, note: "①→②切换"}
    - {sid: sfx04, kind: tick, t_start: 7.0, duration: 0.3, gain_db: -13, src_rel: assets/sfx/tick/TBD_soft_click_lock.wav, note: "180度反转箭头定格的轻卡扣声"}
    - {sid: sfx05, kind: whoosh, t_start: 10.0, duration: 0.4, gain_db: -13, src_rel: assets/sfx/whoosh/TBD_soft_swish.wav, note: "②→③切换,memo卡片滑入"}
    - {sid: sfx06, kind: tick, t_start: 11.5, duration: 3.5, gain_db: -16, src_rel: assets/sfx/tick/TBD_paper_tick_slow.wav, note: "③4问常速逐行落字tick,覆盖11.5-15.0"}
    - {sid: sfx07, kind: whoosh, t_start: 15.0, duration: 0.4, gain_db: -13, src_rel: assets/sfx/whoosh/TBD_soft_swish.wav, note: "③→④切换"}
    - {sid: sfx08, kind: hit, t_start: 15.7, duration: 0.5, gain_db: -12, src_rel: assets/sfx/hit/TBD_soft_emotional_hit.wav, note: "'最怕的一件事'放大显现的情绪重音,克制柔和,非重锤打点"}
    - {sid: sfx09, kind: tick, t_start: 16.5, duration: 3.0, gain_db: -16, src_rel: assets/sfx/tick/TBD_paper_tick_slow.wav, note: "④2问放慢档落字tick,覆盖16.5-19.5"}
    - {sid: sfx10, kind: whoosh, t_start: 19.5, duration: 0.4, gain_db: -13, src_rel: assets/sfx/whoosh/TBD_soft_swish.wav, note: "④→⑤切换,节奏转快的信号音"}
    - {sid: sfx11, kind: tick, t_start: 21.0, duration: 4.0, gain_db: -15, src_rel: assets/sfx/tick/TBD_paper_tick_fast.wav, note: "⑤3问加速档落字tick(比sfx06/sfx09密集),覆盖21-25,呼应逼问推进的紧迫感"}
    - {sid: sfx12, kind: riser, t_start: 24.0, duration: 1.0, gain_db: -15, src_rel: assets/sfx/riser/TBD_short_tension_riser.wav, note: "⑤末→⑥诚实收尾前置riser,为转折蓄势但不夸张"}
    - {sid: sfx13, kind: hit, t_start: 25.0, duration: 0.6, gain_db: -11, src_rel: assets/sfx/hit/TBD_soft_settle_thud.wav, note: "卡片收拢定格,克制的'落定'声(soft settle,非impact stinger)——刻意不用胜利感音效,呼应诚实红线,音量克制"}
    - {sid: sfx14, kind: whoosh, t_start: 28.0, duration: 0.3, gain_db: -16, src_rel: assets/sfx/whoosh/TBD_faint_underline.wav, note: "'拍板还是我自己'accent下划线扫过的极轻描边声,几乎不可察觉,不可抢戏"}
    - {sid: sfx15, kind: whoosh, t_start: 30.0, duration: 0.4, gain_db: -13, src_rel: assets/sfx/whoosh/TBD_soft_swish.wav, note: "⑥→⑦切换,3卡开始向中心汇聚"}
    - {sid: sfx16, kind: hit, t_start: 30.3, duration: 0.6, gain_db: -11, src_rel: assets/sfx/hit/TBD_soft_confirm_hit.wav, note: "3卡拼合成1张完整9问清单卡的确认感,克制非重锤(同T040⑦sfx12手法)"}
    - {sid: sfx17, kind: tick, t_start: 32.0, duration: 0.4, gain_db: -15, src_rel: assets/sfx/tick/TBD_caption_pop.wav, note: "caption'↓可截图拿走'+评论区焦点框浮现的轻点声"}
  note_no_triumphant_sfx: |
    §sfx13(25s卡片收拢)与整个⑥段刻意不使用 impact stinger / 上扬音效 / 金属清脆音这类"成功感"音色,
    只用低沉克制的 soft settle/thud——这是红线约束的声音表达:诚实收尾不能靠声音设计偷偷补一层
    "AI给出完美方案"的爽感,画面(空checkbox)与声音(克制落定声)必须同步传达"平静但没有胜利"。

subtitles:
  srt_path: pending    # 待VO真人录制定稿后,按精确时间戳生成
  burn: true
  style: |
    对齐 design_language.md(复用T040 token)字体层级:display字级(72-88px)用于①钩子/④首问/⑥态度锚点大字,
    body字级(30-34px)用于常规字幕行,mono/data字级仅用于③④⑤清单卡问题本体(非常规字幕)。
    主画面叠字,ink色(#1c1e22)深字(浅色底,非T040暗底的浅字反色),不用纯黑刺眼。
  hook_first_3s: true

outputs:
  video_raw: publish/2026-W30/D03-迷茫十问/成片/T042_raw.mp4          # 无BGM工程件(本条bgm本就off,raw=publish同一份)
  video_publish: publish/2026-W30/D03-迷茫十问/成片/T042_no_bgm.mp4   # 外发命名:*_no_bgm.mp4 直接外发(非预览件)
  vo_mp3: publish/2026-W30/D03-迷茫十问/成片/audio/T042_vo_human.mp3  # 真人录制,非TTS产物

qc:
  - "VO 必须是真人声,任何 TTS(含 MiniMax 情绪版)产出一律拒收,录制前二次确认(memory feedback_no-robot-voice-ontopic-assets)"
  - VO 清晰可辨,前 6s RMS 落在 -13~-23 dB
  - bgm.enabled=off:全程无音乐是设计,已在 notes 记明密VO依据(VO覆盖≈97.6%,两处情绪停顿均<1s,远低于3s门槛)
  - "sfx 硬门:sfx.enabled=true 且 formula_check 三项全为 true(本条已满足)"
  - "sfx 覆盖:每次场景切换(①→②等6处)均有 whoosh;情绪重音(15.7s)+ 关键转折(25s)+ CTA拼合(30.3s)均有 hit;已核对无遗漏"
  - "sfx 音量:所有 events[].gain_db ≤ -8(本条最响的hit=-11dB,比T040更克制,符合⑥段'不能有胜利感'的设计意图)"
  - "sfx 合规:所有 src_rel 标注为 TBD_ 前缀,表示尚未实际下载/命名,production阶段须真实走 Freesound CC0 检索,严禁 ffmpeg aevalsrc/sine 合成占位——这是计划文档,不是已完成的素材清单"
  - "⑥诚实收尾专项 qc:sfx13 及全段声音设计不得使用 impact stinger/上扬清脆音等胜利感音色,已在 note_no_triumphant_sfx 说明,渲染验收时需人工听感确认"
  - 前 3s 钩子字幕可见,与 design_language 字体层级一致
  - 外发使用 video_publish(T042_no_bgm.mp4),非 video_raw

blocking_dependency:
  what: VO 真人录制(voice.status=pending_user_recording)
  who: 用户本人(第一人称真实独白,不可代录/不可TTS)
  why_blocking: |
    storyboard.yaml scenes[04_step2_goal].data.hold_after_q1_s 需要VO"最怕的一件事"后的
    真实停顿时长回填(预设0.3-0.5s区间,需按实际朗读校准)。这是本条**唯一**的硬顺序依赖,
    且属于"改一行配置重新截帧"级别的低成本调整——与T040不同,本条无任何真实录屏/出镜环节,
    VO录完即可直接进入全HTML+GSAP合成流程,不存在"先录屏后配音"或"先配音后录屏"的复杂排期问题。
  next_action: 用户按 script/T042_录音提词稿.md 逐段录制7段VO(约34s),录制时留意④段停顿的自然长度,
    录完后回填 storyboard.yaml 的 hold_after_q1_s 参数,即可交渲染执行方进入 capture_frames.py 出片流程。

content_id: W30D01
paths:
  root_rel: publish/2026-W30/D01-让AI说真话致命漏洞
audio_plan_rel: audio_plan.yaml

tts:
  provider: minimax
  voice_id: "Chinese (Mandarin)_Sincere_Adult"
  base_speed: 1.0
  segments:
    - sid: ab_guess
      target_start: 0
      target_dur: 3
      emotion: serious
      text: "只看开头，哪份直接给出一个核心假设？"
    - sid: compare_first_line
      target_start: 3
      target_dur: 4
      emotion: neutral
      text: "右边。左边先做计划评估，右边开头就给出核心假设。"
    - sid: controlled_reveal
      target_start: 7
      target_dur: 4
      emotion: neutral
      text: "这不是两套模型：同一个模型，同一份虚构计划，只换了问法。"
    - sid: plan_facts
      target_start: 11
      target_dur: 5
      emotion: neutral
      text: "这个人想辞职做代运营，可自己的账号做了四周，几乎没涨粉。"
    - sid: prompt_save
      target_start: 16
      target_dur: 8
      emotion: neutral
      text: "别只问你觉得怎么样。加一句：只找一个没验证、却决定成败的前提。"
    - sid: two_round_result
      target_start: 24
      target_dur: 6
      emotion: serious
      text: "我跑了两轮。模型都优先指出：他要卖的核心能力，还没有被结果验证。"
    - sid: honest_difference
      target_start: 30
      target_dur: 5
      emotion: neutral
      text: "普通问法其实也发现了它；区别是，这个问法把核查顺序放在第一句。"
    - sid: boundary_cta
      target_start: 35
      target_dur: 5
      emotion: neutral
      text: "AI负责提问，不替你拍板。你准备重投的计划，最没验证的前提是什么？"

scenes:
  - id: ab_guess
    template: d01_w30_challenge.html
    data:
      question: "哪份开头就给核心假设？"
      labels: [A, B]
      disclosure: "同模型·同计划·举例测试"
      answer_a: "计划评估：AI 内容代运营"
      answer_b: "最致命的漏洞：他假设自己会用 AI 工具……就能帮客户做出有商业效果的内容。"
      excerpt_note: "Round 1 原文删节·省略号为删节"
  - id: compare_first_line
    template: d01_w30_reveal.html
    data:
      left: "全面评估·多项风险"
      right: "第一句·单点优先"
      prompt: "答案：B"
      risks: ["核心能力待验证", "成功案例不足", "报价模型待验证", "财务缓冲待确认"]
      first_line: "核心交付能力尚未验证"
      same_note: "A组也发现了同一风险"
  - id: controlled_reveal
    template: d01_w30_structure.html
    data:
      head: "控制变量，一项项锁死"
      locks: ["同一个模型", "同一份计划", "同一组生成参数"]
      answer: "A问：你觉得这个方案怎么样？\nB新增：只找一个没验证却决定成败的前提"
      disclosure: "同模型·同计划·只换问法"
  - id: plan_facts
    template: d01_w30_reframe.html
    data:
      head: "计划中已知的三条事实"
      facts: ["想辞职做代运营", "自有账号4周几乎没涨粉", "目标月入2万"]
      disclosure: "举例测试·虚构计划"
      note: "只依据输入材料，不冒充作者或客户经历"
  - id: prompt_save
    template: d01_w30_prompt.html
    data:
      reveal_duration_s: 3.4
      static_hold_s: 4.0
      prompt_lines:
        - "请优先指出这个计划中最致命的一个漏洞：如果不解决，会让计划直接失败的前提或假设。"
        - "不要先夸，不要罗列多个小问题。先用一句话指出它，再用两三句话解释原因。"
        - "如果存在一个尚未验证、却决定成败的假设，优先指出它。"
        - "计划：【粘贴你的计划】"
      caption: "暂停可抄"
  - id: two_round_result
    template: d01_w30_compressor.html
    data:
      head: "双轮重复·第一优先一致"
      rounds: ["Round 1", "Round 2"]
      hashes: ["495913db", "8b8d8507"]
      excerpts: ["最致命的漏洞：他假设自己会用 AI 工具……", "最致命的漏洞：他假设自己能帮客户涨粉……"]
      ticket_text: "同模型·同计划·单点问法"
      result: "核心能力尚未被结果验证"
      qualifier: "本组调用·模型优先指出"
  - id: honest_difference
    template: d01_w30_punchline.html
    data:
      head: "先把对照说诚实"
      truth: "普通问法也发现了它"
      stamp: "对照成立"
      not_claim: "不是：一个发现、一个没发现"
      difference: "差别：核查顺序放在第一句"
      qualifier: "只描述本组调用，不外推所有模型与计划"
  - id: boundary_cta
    template: d01_w30_cta.html
    data:
      boundary: "AI负责提问·不替你拍板"
      question: "你准备重投的计划，最没验证的前提是什么？"
      comment_head: "评论区·写下一个前提"
      placeholder: "例如：有人真的愿意付费吗？"
      send_label: "发送"
      note: "只写一个，先拿证据核查"

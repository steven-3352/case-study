    notes: |-
      首镜A标题“计划评估：AI 内容代运营”和B开头均能回到Round 1原始响应，B的省略号同时标明为删节；后续两张票据使用与完整SHA256前缀一致的495913db、8b8d8507，使“跑了两轮”有真实审计锚点。影片从首屏常驻“同模型·同计划·举例测试”，案例镜再明确“虚构计划”，没有冒充作者经历或客户案例；结果始终写“本组调用·模型优先指出”，并在30至35秒主动展示“A组也发现同一风险”“不是一个发现、一个没发现”，没有把模型判断包装成客观真漏洞。完整Prompt与实验B组输入一致，控制变量和两轮结论也与证据文档互相支持。扣(-4)：信息流观众无法凭8位短哈希独立复算全文，只能把它当审计索引；首镜为停划只展示极短上下文，B摘录的“商业效果”含义须靠后续计划事实补足；“同一组生成参数”包括服务端默认值，严谨程度低于逐项显式锁值。纪录证据链和事实限定达到通过标准。

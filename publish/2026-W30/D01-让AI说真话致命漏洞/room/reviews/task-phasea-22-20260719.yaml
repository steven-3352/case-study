reviews:
  - role: 平台原生策划
    reviewer_id: phasea22-d01-douyin-choice-loop
    reviewer_agent_id: task-phasea-22-20260719
    review_mode: independent
    angle: "信息流首屏停划、连续回报、手机可读性、收藏与评论动作"
    score: 92
    verdict: pass
    notes: |-
      首屏让观众直接比较同模型、同计划的两段Round 1开头，不先抛抽象结论；选择游标在前2.7秒来回移动，到切镜前约0.3秒才落B，形成可参与的3秒开放环。随后每4至8秒依次给揭晓、控制变量、虚构计划冲突、完整Prompt、双轮短哈希、诚实对照和评论槽，回报种类从判断转为证据、收藏与互动，没有长时间停留在同一目录式画面。扣(-8)：首屏两栏各约486px宽，正文30px且B摘录较长，观众很难在3秒内完整读懂两边，只能抓关键词；16至24秒完整Prompt即使分段高亮和后半段静止，仍是全片最重的文字掉点；结尾要求自行回想“最没验证的前提”，评论成本高于给定选项。Phase A通过，成片仍需用真实TTS时长验证首屏字幕没有进一步挤占阅读注意力。

  - role: 纪录片导演
    reviewer_id: phasea22-d01-controlled-test-documentary
    reviewer_agent_id: task-phasea-22-20260719
    review_mode: independent
    angle: "实验原件可追溯、事实与推断分层、纪录叙事伦理、画面证据兑现"
    score: 96
    verdict: pass
    notes: |-
      叙事建立在四次真实调用记录上：请求配置、UTC、returned model、response id、完整响应和SHA256均可回查；两轮B的短哈希495913db与8b8d8507进入票据，首镜B摘录也与Round 1原文一致并明确省略号为删节。影片主动交代“举例测试·虚构计划”，不冒充作者辞职经历；30秒后明确承认普通问法也发现了风险，把纪录性建立在“优先级变化”而非伪造发现/未发现反差上；末句“AI负责提问，不替你拍板”守住模型输出不是现实真相的边界。扣(-4)：控制变量镜写“同一组参数”，而实验记录说明部分采样参数是同一服务端默认值而非显式锁值，画面虽不构成虚假但精确性仍可更高；首镜为了停划只展示极短的A标题与删节B句，纪录证据的完整上下文要到后续镜头才补足；片中短哈希适合可视化但普通观众无法在视频内完成独立核验。

  - role: 编剧
    reviewer_id: phasea22-d01-spoken-experiment-arc
    reviewer_agent_id: task-phasea-22-20260719
    review_mode: independent
    angle: "口播自然度、因果递进、观点可复述性、实验边界与CTA"
    score: 95
    verdict: pass
    notes: |-
      八段口播各承担单一推进：先问“哪份开头”，再答“右边”，接着解释只换问法、补计划事实、交付可抄指令、报告双轮结果、承认普通问法也发现风险，最后交还决策权。核心行动句“只找一个没验证、却决定成败的前提”短、具体、可复述；“模型都优先指出”而非“AI找到了真漏洞”，与两轮原始响应相符，也没有把测试案例写成作者故事。扣(-5)：16至30秒连续出现“前提、假设、决定成败、核心能力、结果验证”等抽象词，TTS停顿不足时会形成概念拥堵；“右边”“第一句”高度依赖画面，脱离画面不完全自足；最后开放问题虽有思考价值，但缺少一个更低门槛的示例选项来促发第一批评论。脚本达到内容门，最终编导通过仍应等待真实配音试听。

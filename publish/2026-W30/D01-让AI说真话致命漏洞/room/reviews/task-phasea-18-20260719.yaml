    review_mode: independent
    angle: "A/B游标落点、语义动作差异、Prompt收藏停留和证据节奏的视觉兑现"
    score: 94
    verdict: pass
    notes: |-
      首镜双栏在约0.4秒内建立，红色选择游标由A侧横移525px，末帧明确停在B栏下方并完成一次轻脉冲，没有停在两栏中间或回弹到A；随后风险列表横入、三把锁闭合、三张事实票落位、两轮票汇流、诚实印章与评论输入槽使用不同语义动作，变化频率足以覆盖每2至4秒。Prompt按四个语义段展开，实际目标8秒下全文出现后有超过4秒稳定阅读，且模板把该段字幕移到顶部，正文、进度条和字幕不会相互覆盖。扣(-6)：游标约1.7秒已完成落B，而口播到下一镜才明确说“右边”，判断窗口略被提前揭示；具体修正：正式成片抽查2.0秒与2.9秒帧，若悬念损失明显，可只延后游标最后一段位移，但末态仍必须稳定停B且不能牺牲3秒答案兑现。


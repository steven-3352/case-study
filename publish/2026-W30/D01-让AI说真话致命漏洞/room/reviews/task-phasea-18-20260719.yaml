    notes: |-
      最新renderer先读取MiniMax分段实长，以`max(vo_dur+tail_pad,target_dur)`形成window，再把八个非静音segment逐一映射到八镜并写入`scene_duration`；因此任一口播超长都会顺延其后画面，而不是把帧硬拉伸。`runtime_audio_plan()`又按timing中的sid取真实start，覆盖source计划里的名义`t_start/t_start_seq`，ambient同步改成真实总长；独立解析实测9个原始事件展开为11个单发事件，全部命中catalog本地CC0 WAV、0 gap。模板均为paused GSAP timeline按30fps seek，编码为libx264/yuv420p，数据链和发布链闭合。扣(-5)：当前尚无正式MiniMax timing文件，故只能验证重排算法与目标窗口模拟，不能声称真实口播点位已听验；具体修正：TTS完成后保存runtime audio plan，逐项核对B答案、Prompt入场、双轮汇流和CTA四个瞬态，并复跑gap与峰值检查。


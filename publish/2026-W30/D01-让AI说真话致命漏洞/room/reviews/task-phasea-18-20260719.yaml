    notes: |-
      八镜顺序形成完整接力：先让观众判断首句，再立刻给B答案；之后锁定变量、交代虚构计划事实、交付完整Prompt、展示双轮原文短摘与短哈希、承认普通问法也发现风险，最后落到可回答的“一个未验证前提”。逐镜核对config可见question、两侧摘录、locks、A/B问法、facts、Prompt四行、rounds/hashes/excerpts、诚实限定和CTA输入槽都被对应HTML消费，运行时只改duration与subtitle，不会丢业务data。扣(-7)：3至7秒的全面评估栏与单点首句栏天然信息量不对称，左栏大面积留白会让右栏在答案之外再获得视觉优势；具体修正：不得补造原文，只可用已有四项风险做均匀短票据，并在正式帧中确认两栏边界、标题和底部字幕均无溢出。

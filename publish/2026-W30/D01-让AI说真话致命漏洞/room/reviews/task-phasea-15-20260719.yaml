    verdict: pass
    notes: |-
      第一帧即给可判定任务，3秒口播明确回答“右边”，7秒前解释为什么；此后11秒虚构计划事实、16秒完整Prompt、24秒双轮结果、30秒主动承认A也发现风险，几乎每2至4秒都有构图、状态或焦点交接。Prompt先分段展开，随后全文静止至少4秒，首句粗体、粘贴槽绿边和“暂停可抄”共同构成不打扰阅读的静态高亮；35秒评论槽还给出“有人真的愿意付费吗”示例。扣(-9)：末尾“你准备重投的计划”仍比D02四选一多一步回忆和组织语言，评论成本偏高；具体修正：保留开放问题，但最终字幕常驻“只写一个前提”与现有示例，发送按钮不得抢在问题和示例读完前放大。


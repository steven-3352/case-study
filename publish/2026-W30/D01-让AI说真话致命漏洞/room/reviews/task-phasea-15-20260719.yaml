    notes: |-
      当前首屏使用Round 1两份真实开头摘录，A为原响应标题“计划评估：AI 内容代运营”，B为“最致命的漏洞”首句短摘，问题改成“哪份开头就给核心假设”，观众无需理解复杂实验即可在首屏作答；3秒后立即进入“全面评估/第一句单点”的解释，形式与“只比较核查顺序”的窄结论贴合。横向双栏、控制变量锁、证物票、双轮票据形成完整实验台，且与D02纵向事故倒推板没有骨架复用。扣(-10)：A/B摘录长度天然不等，游标又在约2秒前落向B，会让少量竞猜张力提前泄出；具体修正：最终渲染保持两侧同一可视高度，游标在3秒答案点之前只做中性扫视，答案点再落B，不改原文也不制造公平性假象。


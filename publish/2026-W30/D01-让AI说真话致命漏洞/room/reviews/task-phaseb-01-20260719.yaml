    angle: "成片像素变化频率、首屏停划与音画节拍"
    score: 84
    verdict: fail
    notes: |-
      优点：0-3.82s用A/B原文对照直接出题，3.82s答案翻面与hit同拍；9.70s控制变量、15.45s计划事实、20.98s Prompt、28.98s双轮凭证、35.15s诚实边界和41.57s CTA均有明确换镜/SFX节点，音频从0s进人声，无≥3s静音、无黑屏。

      扣(-10)：实际MP4的freezedetect（-50dB，d=2.5s）报告0.333-3.833s像素不变，与分镜所述“光标游走、末0.3s落B”不一致；首屏在0.33s后基本成为静态截图，削弱停划。改法：修正光标动画的渲染时钟，在0.4/1.3/2.2/3.5s产生可见位移，且仅最后0.3s落在B。

      扣(-6)：除收藏型Prompt镜可主动静置外，成片仍有4.400-9.700s（5.30s）、10.933-15.433s（4.50s）、16.233-20.967s（4.73s）、30.433-35.133s（4.70s）、36.500-41.567s（5.07s）长时间像素不变，未达项目“每2-4s视觉变化”硬要求，中段容易读成PPT。改法：对照镜在6.2/8.0s逐项扫描，控制变量镜按三锁逐个状态翻转，双轮镜先出哈希再合并结论，诚实对照镜增加删线→结论条的两段变化。

      结论：专属实验台隐喻和场景节点成立，但正式成片不能用Phase A设计承诺替代像素验收；本轮低于90，须重渲后独立复评。

  - role: 视觉设计

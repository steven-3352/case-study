    review_mode: independent
    angle: "手机端可读性、视觉层级、安全区与证据感"
    score: 92
    verdict: pass
    notes: |-
      0.5s抽帧中，问题、A/B标签、两份开头原文和“同模型·同计划·举例测试”层级清楚；22-26s纸面Prompt完整入框，标题、正文、高亮与“暂停可抄”不重叠；30s双哈希凭证、36s诚实对照和47s评论输入框均保持视觉焦点。底色、红色实验标记、绿色边界标记各自有语义，主信息未侵入右侧交互区或底部平台文案区。

      扣(-4)：小屏实看时，Round卡的哈希/资格说明与多个底部披露字号偏小，能建立“有凭证”感，但很难在不暂停时读出。改法：哈希保留8位但字号上调10%-15%，底部披露改为单行高对比简句。

      扣(-4)：外挂SRT虽与台词对齐，但存在“核\n心”、“区\n别”等词内硬换行，且9.700s cue的逗号被挤到下行行首；开启平台字幕时会显得粗糙。改法：按意群重分cue，禁止标点行首和词内断行，每行保持完整短语。

      结论：成片主视觉已达手机端可外发水平；扣分集中于次要证据字号和外挂字幕断行，不影响本角色达90。

  - role: 编剧
    reviewer_id: phaseb01-d01-script-listen
    reviewer_agent_id: task-phaseb-01-20260719
    review_mode: independent
    angle: "成片叙事弧、实测边界、可复现价值与VO时序"
    score: 93
    verdict: pass
    notes: |-
      成片从0-3.82s的“只看开头”对照题，经3.82-15.45s答案与控制变量，15.45-28.98s具体计划与可抄Prompt，28.98-41.57s双轮结果与诚实反转，最后收在讨论型CTA，起承转合完整。信息边界清楚：明说“普通问法也发现了它”，只主张核查顺序的差别；“AI负责提问，不替你拍板”没有将实测外推成决策真理。Prompt可直接复制，两轮哈希和原文短摘进片，不是空口概念。MiniMax真实时序为8段/47.96s，每段台词与SRT文本一致，切镜都留有0.12s或更多余量，未裁字。

      扣(-4)：首屏B文案直接出现“最致命的漏洞”和“假设”，题目答案在语义上过于显眼，猜题张力弱于真实的对照判断。改法：保留原文不篡改，但在0-2.5s先只露两份各自第一行的中性片段，2.5s后再拉开B的完整原句。

      扣(-3)：47.96s只支撑一个“核查顺序”结论，9.70-20.98s对“同模型/同计划”和计划事实的解释稍慢，与短视频完播目标存在小幅张力。改法：不删事实护栏，将“同一模型/同一份计划”并入一句，将计划三条改为一个紧凑对比句，目标减2-3s。

      结论：脚本很诚实，有实验证据、可复现Prompt和决策边界；两项扣分是留存优化，未破坏内容门。

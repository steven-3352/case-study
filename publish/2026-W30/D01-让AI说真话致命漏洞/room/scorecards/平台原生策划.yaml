  notes: 首屏让观众直接比较同模型、同计划的两段Round 1开头，不先抛抽象结论；选择游标在前2.7秒来回移动，到切镜前约0.3秒才落B，形成可参与的3秒开放环。随后每4至8秒依次给揭晓、控制变量、虚构计划冲突、完整Prompt、双轮短哈希、诚实对照和评论槽，回报种类从判断转为证据、收藏与互动，没有长时间停留在同一目录式画面。扣(-8)：首屏两栏各约486px宽，正文30px且B摘录较长，观众很难在3秒内完整读懂两边，只能抓关键词；16至24秒完整Prompt即使分段高亮和后半段静止，仍是全片最重的文字掉点；结尾要求自行回想“最没验证的前提”，评论成本高于给定选项。Phase
    A通过，成片仍需用真实TTS时长验证首屏字幕没有进一步挤占阅读注意力。

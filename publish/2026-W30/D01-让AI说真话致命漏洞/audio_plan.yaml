status: ready_after_content_gate
content_id: W30D01
content_version: v3
form_version: v4

voice:
  engine: minimax
  model: speech-2.8-turbo
  voice_id: "Chinese (Mandarin)_Sincere_Adult"
  fallback_engine: none
  script_path: script/T040_录音提词稿_v4.md
  target_duration_s: 40.0
  speed: 1.0
  production_rule: "pre_render 门禁 PASS 后才允许生成；实际分段 TTS 时长自动驱动分镜。"

bgm:
  enabled: false
  rationale: "密 VO 实测型，无 BGM；保留低电平办公室环境声与界面反馈音。"

sfx:
  enabled: true
  timing_mode: "source秒点仅为直接解析兼容基线；正式混音由renderer按scene_sid+offset和真实seg_timing重排"
  source_policy: "仅使用 assets/sfx/catalog.yaml 已登记且本地存在的 CC0 WAV。"
  events:
    - {sid: room_tone, kind: ambient, t_start: 0.0, duration: 40.0, gain_db: -24}
    - {sid: challenge_ticks, kind: tick_seq, t_start_seq: [0.5, 1.3, 2.1], scene_sid: ab_guess, offset_seq: [0.5, 1.3, 2.1], duration_each: 0.12, gain_db: -17}
    - {sid: answer_hit, kind: hit, t_start: 3.0, scene_sid: compare_first_line, offset: 0.0, duration: 0.35, gain_db: -11}
    - {sid: controls_in, kind: whoosh, t_start: 7.0, scene_sid: controlled_reveal, offset: 0.0, duration: 0.45, gain_db: -14}
    - {sid: facts_in, kind: whoosh, t_start: 11.0, scene_sid: plan_facts, offset: 0.0, duration: 0.45, gain_db: -14}
    - {sid: prompt_in, kind: hit, t_start: 16.0, scene_sid: prompt_save, offset: 0.0, duration: 0.3, gain_db: -12}
    - {sid: rounds_in, kind: whoosh, t_start: 24.0, scene_sid: two_round_result, offset: 0.0, duration: 0.45, gain_db: -14}
    - {sid: truth_hit, kind: hit, t_start: 30.0, scene_sid: honest_difference, offset: 0.0, duration: 0.4, gain_db: -10}
    - {sid: cta_in, kind: whoosh, t_start: 35.0, scene_sid: boundary_cta, offset: 0.0, duration: 0.45, gain_db: -15}

subtitles:
  burn: false
  srt_path: douyin/subtitles.srt
  max_lines: 2
  safe_area: "避开抖音右侧交互区与底部文案区"
  prompt_scene_rule: "Prompt 正文就是主视觉，不叠烧录字幕；另交付可开关 SRT。"

mix_qc:
  - "0s 即有人声，前 6s 综合响度稳定"
  - "VO 无削波，SFX 不遮盖关键词"
  - "无任何 >=3s 静音死区"
  - "只使用 catalog 可解析的 CC0 素材"

status: draft
content_id: T040
content_version: 3
form_version: 4
platform: douyin
video: {fps: 30, width: 1080, height: 1920, target_duration_s: 40.0, output_name: T040_no_bgm.mp4}
global_data:
  disclosure: "同模型·同计划·举例测试"
  evidence: "design/实测_致命漏洞法.md"
scenes:
  - id: ab_guess
    template: d01_w30_challenge.html
    duration: 3.0
    type: html
    reuse_reason: "仅复用GSAP确定性渲帧能力"
    visual_difference: "Round 1 原文短摘与选择游标"
    risk: "只能逐字摘录，不得把概括句伪装成原文"
    data: {question: "哪份开头就给核心假设？", labels: [A, B], answer_a: "计划评估：AI 内容代运营", answer_b: "最致命的漏洞：他假设自己会用 AI 工具……就能帮客户做出有商业效果的内容。", excerpt_note: "Round 1 原文删节·省略号为删节", disclosure: "同模型·同计划·举例测试"}
    data_lever: completion_3s
  - id: compare_first_line
    template: d01_w30_reveal.html
    duration: 4.0
    type: html
    reuse_reason: "仅复用双栏布局能力"
    visual_difference: "左侧多项评估、右侧第一句单点优先"
    risk: "不能暗示A组没发现风险"
    data: {left: "全面评估·多项风险", right: "第一句·单点优先", prompt: "答案：B"}
    data_lever: completion_rate
  - id: controlled_reveal
    template: d01_w30_structure.html
    duration: 4.0
    type: html
    reuse_reason: "仅复用列表交接能力"
    visual_difference: "三把控制变量锁依次闭合"
    risk: "必须清楚显示只有问法变化"
    data: {answer: "A问：你觉得这个方案怎么样？\nB新增：只找一个没验证却决定成败的前提", disclosure: "同模型·同计划·只换问法"}
    data_lever: 理解
  - id: plan_facts
    template: d01_w30_reframe.html
    duration: 5.0
    type: html
    reuse_reason: "仅复用事实条目排版能力"
    visual_difference: "测试计划三事实以证物标签落位"
    risk: "不得冒充本人或客户经历"
    data: {facts: ["想辞职做代运营", "自有账号4周几乎没涨粉", "目标月入2万"], disclosure: "举例测试·虚构计划"}
    data_lever: 理解
  - id: prompt_save
    template: d01_w30_prompt.html
    duration: 8.0
    type: html
    reuse_reason: "仅复用长文本测量与静止帧能力"
    visual_difference: "单点优先Prompt完整展开"
    risk: "字号不足或字幕遮挡会使收藏物失效"
    data:
      prompt_lines:
        - "请优先指出这个计划中最致命的一个漏洞：如果不解决，会让计划直接失败的前提或假设。"
        - "不要先夸，不要罗列多个小问题。先用一句话指出它，再用两三句话解释原因。"
        - "如果存在一个尚未验证、却决定成败的假设，优先指出它。"
        - "计划：【粘贴你的计划】"
      caption: "暂停可抄"
      static_hold_s: 4.0
    data_lever: 收藏
  - id: two_round_result
    template: d01_w30_compressor.html
    duration: 6.0
    type: html
    reuse_reason: "仅复用transform运动能力"
    visual_difference: "两轮证据票据汇入同一第一句"
    risk: "只能表达模型优先指出，不能称客观真漏洞"
    data: {rounds: ["Round 1", "Round 2"], hashes: ["495913db", "8b8d8507"], excerpts: ["最致命的漏洞：他假设自己会用 AI 工具……", "最致命的漏洞：他假设自己能帮客户涨粉……"], result: "核心能力尚未被结果验证", qualifier: "本组调用·模型优先指出·短哈希可回查"}
    data_lever: "信任+completion_rate"
  - id: honest_difference
    template: d01_w30_punchline.html
    duration: 5.0
    type: html
    reuse_reason: "仅复用文本强调能力"
    visual_difference: "A也发现风险的诚实对照印章"
    risk: "不能把差异夸大成发现与没发现"
    data: {truth: "普通问法也发现了它", difference: "差别：核查顺序放在第一句"}
    data_lever: 信任
  - id: boundary_cta
    template: d01_w30_cta.html
    duration: 5.0
    type: html
    reuse_reason: "仅复用评论输入槽能力"
    visual_difference: "未验证前提进入核查槽"
    risk: "问题过泛会降低有效评论"
    data: {boundary: "AI负责提问·不替你拍板", question: "你准备重投的计划，最没验证的前提是什么？"}
    data_lever: 评论

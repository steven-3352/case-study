# storyboard.yaml · T043「AI 关掉就失忆?3 步让它永久记住你」(抖音)
#
# 本条视觉路线复用 S4 系列共享视觉基础设施(openmontage_brief/视觉路线/design_language 全部复用 T040 已验证结论),
# 镜头设计独立完成,不复制 T040 场景顺序/内容。
#
# ⚠️ 状态:draft_provisional —— 本文件按 pipeline/p004_video/build.py + capture_frames.py
#    的真实 schema 编写(读源码得到),结构可直接被 build.py 消费,但以下字段等真人 VO 录制完成后
#    才能最终锁定:
#      - 各 scene 的 duration 已按 script/T043_录音提词稿.md 给定的 7 段秒数直接锁定(6.5/5.8/5.0/9.7/4.0/4.3/3.2),
#        **不是 provisional 估算**——这是本条与 T040 的关键差异:T040 的 duration 需等 VO 录完才能定,
#        T043 的 duration 是录音的目标时长(用户按此秒数控制语速录制),总时长已固定为 38.5s。
#      - 仍待 VO 精确对齐的:各 scene 内部 GSAP timeline 的"子段切点"(如 02 场景信号撞墙的精确帧、
#        04 场景清单卡逐行显现的精确间隔)——这些是"总时长不变,内部节奏微调"级别的校准,
#        不需要重新定 scene.duration,详见 design/motion_tech_plan.md §5。
#    HTML 模板(t043_*.html)尚未实际编写,本文件是渲染前的结构规划,不是可直接跑的成片输入。
#
# ⚠️ 工作向框定自查(本条最高优先级):全部 scene 的 data 字段内容(screenshots/文案/UI描述)
#    均为自绘工作场景元素,无社交聊天软件视觉语言、无暖粉配色、无心形图标、无"想念/陪伴"类文案。

video:
  fps: 30
  width: 1080
  height: 1920
  output_name: T043_no_bgm.mp4   # 对齐 audio_plan.yaml outputs.video_publish 命名(bgm.enabled=off,密VO判定)
  voice_volume: 1.0
  music_volume: 0.0              # bgm off,此字段被 build.py 忽略,保留占位

scenes:
  - id: 01_hook
    template: t043_01_hook.html   # 待建,pipeline/p004_video/templates/ 下新文件,不复用任何历史模板
    duration: 6.5
    type: html
    data:
      device_frame: phone_work_card   # 自绘手机工作向卡片(矩形系统消息容器,非圆角气泡)
      typing_text: "继续帮我改一下之前聊的那版方案"
      device_switch: phone_to_laptop_icon   # 自绘线性图标切换动效
      ai_reply_text: "未找到相关记录,无法确认此前是否讨论过"   # 典型化改写,非逐字复刻真实来源
      punch_text: "没记录,不能装记得"
      vo_ref: "用AI干活,图的是它记性比人好。换个设备接着问,它却说'没记录,不能装记得'。"
    note: 静态+CSS动效合成,duration=6.5s锁定对齐口播稿①段;无真实录制,自绘UI避免品牌/隐私风险

  - id: 02_dual_device_reveal
    template: t043_02_dual_device.html   # 待建,GSAP timeline 驱动信号点路径动画,见 motion_tech_plan §动效2
    duration: 5.8
    type: html
    data:
      left_panel_label: "手机端"
      right_panel_label: "电脑端"
      signal_travel: true
      signal_break_at_s: 4.3   # 场景内相对时间(=全片10.8s处),信号撞"⊘"断连符号触发点
      disconnect_icon: true
      vo_ref: "查完才知道,不是AI坏——是手机端和电脑端,用的根本是两套不相通的记忆,互相看不见。"
    note: 本条独有新动效(五维打分见 design/form_strategy.md §2,选定方案B信号动画,总分27);duration=5.8s锁定对齐②段

  - id: 03_isolated_point
    template: t043_03_isolated_point.html   # 待建,复用02场景资产延伸,局部放大+虚化
    duration: 5.0
    type: html
    data:
      depends_on_scene: 02_dual_device_reveal   # 复用②双面板资产,渲染顺序:02→03
      focus_target: left_panel_conversation
      conversation_label: "某次临时对话"   # 概括处理,不带任何具体项目/平台名(隐私要求)
      unreached_target_label: "两边都能翻到的地方"
      unreached_mark: red_x
      vo_ref: "根子是信息只落在某次临时聊天里,没写进两边都能翻到的地方。"
    note: duration=5.0s锁定对齐③段;虚化蒙版聚焦手法,四周不透明度降至35%

  - id: 04_three_step_solution
    template: t043_04_step_list.html   # 待建,GSAP逐条卡片显现,复用T040④capture_frames.py机制
    duration: 9.7
    type: html
    data:
      headline: "3步让AI记住你"
      steps:
        - {label: "① 写进记忆文件", sub: "信息别只口头说", icon: folder}
        - {label: "② 存到跨设备、跨对话都能读到的位置", sub: "别锁死在一次对话框里", icon: cloud_sync}
      reconnect_animation:
        depends_on_scene: 02_dual_device_reveal
        note: 第②步卡片底部,手机—电脑连接线由虚线断连转为实线,回收02场景的视觉悬念
      vo_ref: "3步让AI记住你:第一,信息别只口头说,写进记忆文件;第二,存到跨设备、跨对话都能读到的位置,别锁死在一次对话框里;"
    note: duration=9.7s锁定对齐④段(全片最长单场景,占比25.2%,未超40%上限);收藏物核心场景

  - id: 05_step3_and_summary
    template: t043_05_step_summary.html   # 待建,04模板同款,不同data.stage参数(减少模板数量)
    duration: 4.0
    type: html
    data:
      step3: {label: "③ 隔一阵回去更新", sub: "别指望AI自己会整理", icon: calendar_refresh}
      summary_card: true   # 三步完整清单汇总态
      caption: "↓可截图拿走"
      vo_ref: "第三,隔一阵回去更新——别指望AI自己会整理。"
    note: duration=4.0s锁定对齐⑤段;收藏物落地场景,与04共用清单卡模板不同stage

  - id: 06_honest_close
    template: t043_06_risk_bar.html   # 待建,GSAP width数值动画
    duration: 4.3
    type: html
    data:
      risk_bar_start_pct: 100
      risk_bar_end_pct: 18   # 示意非精确统计,非真实数据(见 motion_tech_plan §动效5免责说明)
      risk_bar_disclaimer: "示意非精确统计"
      headline: "丢失概率↓"
      caption: "不保证100%"
      vo_ref: "做到这三步,丢失概率能大幅降低,但没人敢保证百分百不忘。"
    note: duration=4.3s锁定对齐⑥段;红线安全句可视化,条尾不清零对应"不保证百分百"

  - id: 07_cta
    template: t043_07_cta.html   # 待建
    duration: 3.2
    type: html
    data:
      comment_mock_style: work_discussion_box   # 方框输入框,非社交软件圆形头像楼层
      comment_focus_text: "你的AI换个地方还认你吗?"
      step_recap: true   # 复用04/05场景清单卡缩略(第二次收藏机会)
      vo_ref: "你的AI换个地方还认你吗?评论区聊聊。"
    note: duration=3.2s锁定对齐⑦段;纯讨论CTA,不扣数字不加微信;评论区UI自绘工作向mock

# 总时长校验:6.5+5.8+5.0+9.7+4.0+4.3+3.2 = 38.5s,对齐 script/T043_录音提词稿.md 与 audio_plan.yaml target_duration_s
# 渲染顺序依赖:01(独立)→ 02(独立)→ 03(依赖02资产)→ 04(依赖02资产做重连动画)→ 05(依赖04模板)→ 06(独立)→ 07(依赖04/05清单卡缩略)

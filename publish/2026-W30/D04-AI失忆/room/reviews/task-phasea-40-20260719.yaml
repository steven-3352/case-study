    evidence: |-
      v3首镜把“同一条记录/一端有·一端没有”直接放进2秒首屏，下一镜用访问线断点立即兑现冲突；写入双证、四路读集扫描、缺失路径、项目范围和共同可读面依次回答“有没有写、入口读什么、漏在哪里、结论适用哪、如何修”。每镜都有节点验真、扫描、挡回、缩框、汇流或凭证锁合，名义节拍满足2–4秒变化。共同可读面和“先升格，再共享读取”具备工程收藏价值。
    deductions: |-
      (-4) 结尾主要是收藏型工程结论，没有明确评论问题或低成本选项；(-3) 41秒内包含路径、commit、四项读集和共同可读面，非技术用户的中段理解负担偏高；(-2) 首镜是结论型文字钩子，真实原句证据要到第二镜才出现。
    remediation: "Phase B重点看11–23秒读集段的到达率假设和字幕负荷；评论承接应围绕‘你有几个入口’这类低成本事实题，不改造成泛情绪CTA。"

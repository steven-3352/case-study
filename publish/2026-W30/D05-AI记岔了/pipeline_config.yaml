content_id: W30D05
paths: {root_rel: publish/2026-W30/D05-AI记岔了}
audio_plan_rel: audio_plan_v2.yaml
tts:
  provider: minimax
  voice_id: "Chinese (Mandarin)_Sincere_Adult"
  base_speed: 1.04
  segments:
    - {sid: danger_hook, target_start: 0, target_dur: 2, emotion: serious, text: "AI 说没记录，先别判它没写。"}
    - {sid: alarm, target_start: 2, target_dur: 3, emotion: serious, text: "文件明明在，可能只是入口根本不读。"}
    - {sid: evidence_pair, target_start: 5, target_dur: 6, emotion: neutral, text: "我那次排查，先拿到两张证物：journal 已落盘；飞书却回复‘我这边没有记录’。"}
    - {sid: causality, target_start: 11, target_dur: 6, emotion: serious, text: "答不上只能报警，不能直接叫失忆。真正的根因，要同时对上写入位置和入口读集。"}
    - {sid: write_check, target_start: 17, target_dur: 7, emotion: neutral, text: "第一步查落盘回执，不接受‘我记住了’；第二步查这个入口每轮实际注入哪些来源。"}
    - {sid: retest, target_start: 24, target_dur: 6, emotion: neutral, text: "第三步修后从原入口回问同一条事实，再用一条新事实跑完整闭环。"}
    - {sid: repaired, target_start: 30, target_dur: 7, emotion: neutral, text: "我接入近三天摘要和升格流程后，新事实的写入、升格已经跑通；但原入口复问没留逐字原件，我不签通过。"}
    - {sid: qa_card, target_start: 37, target_dur: 7, emotion: neutral, text: "这只验收我这套自建工作流。你卡在哪一步？评论留 01、02 或 03。证据缺一张，就别宣布修好。"}
scenes:
  - id: danger_hook
    template: d05_w30_danger_hook.html
    data: {eyebrow: "QA 误判警报", title: "AI 说没记录\n先别判它没写", warning: "文件在 ≠ 入口能读"}
  - id: alarm
    template: d05_w30_alarm.html
    data: {top: "文件明明在", bottom: "入口根本不读", stamp: "写入 ≠ 可读"}
  - id: evidence_pair
    template: d05_w30_evidence_pair.html
    data: {left: "journal 已落盘", right: "原入口：没有记录", label: "两张真实证物"}
  - id: causality
    template: d05_w30_causality.html
    data: {alarm: "答不上 = 报警", proof: "已落盘 + 不在读集 = 根因证据", reject: "不能直接叫失忆"}
  - id: write_check
    template: d05_w30_write_check.html
    data: {step1: "01 查落盘回执", step2: "02 查入口读集", warning: "模型说‘记住了’不算日志"}
  - id: retest
    template: d05_w30_retest.html
    data: {step3: "03 修后回问", controls: ["原失败入口", "同一可核事实", "再跑一条新事实"]}
  - id: repaired
    template: d05_w30_repaired.html
    data: {before: "新事实：写入 + 升格", after: "原入口复问：缺逐字原件", result: "写入升格｜通过", result2: "原入口复问｜待原件"}
  - id: qa_card
    template: d05_w30_qa_card.html
    data: {steps: ["01 查落盘", "02 查读集", "03 修后回问"], scope: "评论留 01 / 02 / 03 · 证据缺一张不签通过"}

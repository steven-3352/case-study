# storyboard.yaml · T044「我让 AI 记住昨天聊的,它翻遍说:根本没记」(抖音)
#
# 本条视觉路线复用S4系列共享基础设施(publish/2026-W30/S4系列共享视觉基础设施.md),
# 镜头设计独立完成——scenes 01-07 的具体画面主体/时序按本条 motion_storyboard.md 独立设计,
# 不复制 T040/T043 的镜头顺序,仅色板/字体/组件 token 与渲染机制(capture_frames.py)复用。
#
# ⚠️ 工作向框定自查(渲染前必须逐场景核对):01/02/04/07 所有 UI 容器均为矩形工作卡片/系统
#    消息条,无圆角社交气泡;02 的示例文案为"举个例子·某个方向"概括处理,无具体真实项目名;
#    06 双通道验证图标非"设备对话"拟人化排布;07 评论区 mock 为工作协作软件方框样式,非社交
#    软件圆形头像楼层。全片无暖粉色/心形图标/"想念·陪伴·记住我"类文案。
#
# ⚠️ 状态:draft_provisional —— 本文件按 pipeline/p004_video/build.py + capture_frames.py
#    的真实 schema 编写(读源码得到,结构可直接被 build.py 消费),与 T040/T043 同一套 schema。
#    本条 scenes.duration 已直接按 script/T044_录音提词稿.md 给定的7段精确秒数锁定
#    (4.8/7.5/4.2/6.3/4.3/6.3/3.2s,累加=36.6s),与 T040(需等VO录制后回填duration)不同,
#    与 T043 处理方式一致——VO 真人录制完成后只需微调场景内部子拍(sub_beats)切点,
#    不需要重新定 scenes 总 duration。
#    HTML 模板(t044_*.html)尚未实际编写,本文件是渲染前的结构规划,不是可直接跑的成片输入。
#    脚本页脚"约36.7s"是6字/s粗估值,与本文件锁定的36.6s精确值相差0.1s,以本文件36.6s为准
#    (详见 audio_plan.yaml §说明)。

video:
  fps: 30
  width: 1080
  height: 1920
  output_name: T044_no_bgm.mp4   # 对齐 audio_plan.yaml outputs.video_publish 命名(bgm.enabled=off)
  voice_volume: 1.0
  music_volume: 0.0              # bgm off,此字段被 build.py 忽略(无 --bgm 输入时不生效),保留占位

scenes:
  - id: 01_hook
    template: t044_01_hook.html   # 待建,pipeline/p004_video/templates/ 下新文件,不复用任何历史模板
    duration: 4.8
    type: html
    data:
      assistant_card_label: "AI工作助理"     # 矩形工作卡片,非品牌UI,非圆角气泡
      punch_text: "重要的事,不用我自己记"
      vo_ref: "我造这个AI助理,图的就是一件事——重要的事不用我自己记。"
      sub_beats:
        - {t: 0.0, dur: 2.0, note: "AI助理主界面卡片浮入定格"}
        - {t: 2.0, dur: 2.8, note: "大字punch无fade直砸+定格"}
    note: 静态合成,duration按script精确分段值(4.8s)锁定

  - id: 02_recall_search
    template: t044_02_recall_search.html   # 待建,GSAP stagger 驱动两段列表扫描,见 motion_tech_plan §动效1
    duration: 7.5
    type: html
    data:
      typing_text: "接着昨天那个方向,继续往下"
      example_label: "举个例子·某个方向"     # 概括处理,不带具体真实项目名(fact_check红线)
      search_lists:
        - {label: "聊天记录", icon: chat_log, t_start: 6.8, t_end: 9.0}
        - {label: "今天的笔记", icon: notes, t_start: 9.0, t_end: 10.6}
      reveal_text: "没有这条线"
      vo_ref: "前几天在手机上接着昨天聊的一个方向往下问,它翻遍聊天记录,翻遍今天的笔记,说:没有这条线。"
      sub_beats:
        - {t: 4.8, dur: 2.0, note: "打字+发送定格"}
        - {t: 6.8, dur: 2.2, note: "扫描聊天记录列表(GSAP stagger高亮)"}
        - {t: 9.0, dur: 1.6, note: "扫描今天笔记列表(区别图标)"}
        - {t: 10.6, dur: 1.7, note: "系统消息卡'没有这条线'落定"}
    note: GSAP stagger列表扫描,两段搜索视觉标签须明显区分(非同一动效复制两遍);duration按script精确分段值(7.5s)锁定

  - id: 03_freeze_reaction
    template: t044_03_freeze_reaction.html   # 待建,帧锁接缝+局部放大虚化,见 motion_tech_plan §动效2
    duration: 4.2
    type: html
    data:
      frame_lock_source_scene: 02_recall_search   # 依赖02场景先渲染完成,取其最终帧(feedback_frame-locked-seam)
      blur_opacity: 0.35
      zoom_scale: 1.15
      punch_lines: ["我造它就是为了不忘事", "它自己先漏了"]
      vo_ref: "我愣了一下——我造它就是为了不忘事,它自己先漏了。"
      sub_beats:
        - {t: 12.3, dur: 2.0, note: "帧锁定格+局部放大+周围虚化"}
        - {t: 14.3, dur: 2.2, note: "大字punch两句先后落"}
    note: 全片情绪最重的一拍;不出镜,靠UI定格+大字承载;渲染顺序依赖02先完成

  - id: 04_honesty_admission
    template: t044_04_honesty_admission.html   # 待建,GSAP TextPlugin逐行+三节点流程图draw-on,见 motion_tech_plan §动效3
    duration: 6.3
    type: html
    data:
      ai_supplement_label: "AI补充说明"
      ai_supplement_text: "那次聊完没走收尾、没记进本子"
      flow_nodes: ["聊完", "没走收尾", "没记进本子"]
      conclusion_lines: ["不是它坏了", "是流程还没补上"]
      vo_ref: "它自己补了句实话:那次聊完没走收尾、没记进本子,不是它坏了,是流程还没补上。"
      sub_beats:
        - {t: 16.5, dur: 2.0, note: "AI补充消息卡逐行显现(kinetic_typography手法)"}
        - {t: 18.5, dur: 2.2, note: "三节点流程图逐点亮起+连接线draw-on"}
        - {t: 20.7, dur: 2.1, note: "结论文字落定+流程图定格"}
    note: 收藏物之外本条最强信任镜(AI主动坦白不甩锅);duration按script精确分段值(6.3s)锁定

  - id: 05_relief_contrast
    template: t044_05_relief_contrast.html   # 待建,纯CSS静态合成,无需GSAP
    duration: 4.3
    type: html
    data:
      icon_fabricate: {label: "瞎编", state: "muted_gray", checked: false}
      icon_honest: {label: "老实认", state: "accent", checked: true}
      quote_text: "它没顺着我瞎编"
      vo_ref: "挺讽刺,但也挺庆幸——它没顺着我瞎编,漏了就老实认。"
      sub_beats:
        - {t: 22.8, dur: 2.1, note: "✕✓图标并排浮入"}
        - {t: 24.9, dur: 2.2, note: "局部放大✓侧金句,✕侧继续虚化"}
    note: 传播金句镜("它没顺着我瞎编"可截图);duration按script精确分段值(4.3s)锁定

  - id: 06_verify_trick
    template: t044_06_verify_trick.html   # 待建,GSAP timeline双通道同步验证动效,见 motion_tech_plan §动效5(轻量方案,已走五维打分)
    duration: 6.3
    type: html
    data:
      technique_label: "抓包验证法"
      channels:
        - {label: "换设备", icon: device_switch}
        - {label: "隔天", icon: calendar_flip}
      repeat_question_text: "同一个问题,再问一遍"
      flag_icon: "⚑"
      punch_text: "答不上来才是真信号"
      vo_ref: "现在我学乖了:真要紧的事,我会换个设备或者隔天再问一遍,答不上来才是真信号。"
      sub_beats:
        - {t: 27.1, dur: 2.0, note: "标签+双通道图标建立"}
        - {t: 29.1, dur: 2.2, note: "两通道同步'再问一遍'+⚑标记同步亮起(时间差<0.1s)"}
        - {t: 31.3, dur: 2.1, note: "大字punch核心句落定"}
    note: 本条收藏物核心场景,轻量图标演示(非完整双面板,见form_strategy.md §2独立五维打分);全片只出现一次,不做二次收藏钩(呼应retention_beat_sheet"轻量收尾"设计);duration按script精确分段值(6.3s)锁定

  - id: 07_cta
    template: t044_07_cta.html   # 待建
    duration: 3.2
    type: html
    data:
      comment_mock_style: "工作协作软件方框输入框"   # 非社交软件圆形头像楼层
      comment_focus_text: "你有没有被AI'记岔'过?"
      cta_line2: "评论区说说"
      vo_ref: "你有没有被AI'记岔'过?评论区说说。"
      sub_beats:
        - {t: 33.4, dur: 1.6, note: "评论区mock浮入+问句大字"}
        - {t: 35.0, dur: 1.6, note: "焦点框强调+收尾定格"}
    note: 纯讨论CTA,不扣数字不加微信;评论区UI为自绘mock非品牌截图;不复现⑥收藏物(保持轻量收尾)

# 总时长校验:4.8+7.5+4.2+6.3+4.3+6.3+3.2 = 36.6s,对齐 audio_plan.yaml target_duration_s

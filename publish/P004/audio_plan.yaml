# 声音方案 · P004 K1
# content_id: P004
# topic_id: K1

voice:
  engine: minimax
  model: speech-2.8-turbo
  voice_id: male-qn-jingying-jingpin
  speed: 1.05
  pitch: 0
  emotion: neutral
  script_path: pipeline/p004_video/script_k1_v2.md

bgm:
  mood: tension
  source: pipeline/p004_video/out/audio/_bgm_drone.mp3
  volume: 0.10
  fade_in_s: 1.5
  fade_out_s: 2.0
  loop: true
  notes: |
    0–3s chaos 段仅 drone 铺垫紧张感；
    口播起后 BGM 持续低量垫底，不抢人声。
    生成方式: mix_bgm.sh 或 build.py --bgm。

subtitles:
  srt_path: pipeline/p004_video/sub_k1.srt
  burn: true
  style: GSAP _subtitles.html 叠主画面；前 3s 与 punch 大字配合
  hook_first_3s: true

outputs:
  video_raw: pipeline/p004_video/out/final/p004_K1.mp4
  video_publish: pipeline/p004_video/out/final/p004_K1_with_bgm.mp4
  vo_mp3: pipeline/p004_video/out/audio/vo_k1_v2_padded.mp3

qc:
  - VO 清晰可辨，BGM 不盖人声（人工听 30s）
  - 前 3s 钩子字幕可见
  - 外发使用 video_publish，非 video_raw

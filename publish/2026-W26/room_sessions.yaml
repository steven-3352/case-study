# W26 Agent 讨论室 · 七条选题多工种圆桌数据
# 展开：python3 pipeline/week_room.py

sessions:
  - project_id: W26D01
    topic_id: T009
    day_dir: D01-美甲撞档
    title: 美甲撞档
    vertical: 本地生活
    formats: {douyin: F2, xhs: F1}
    approved_at: "2026-06-16"
    participants: [编导, 记者, 选题深挖师, 内核提炼师, 领域专家, 事实校验员, 编剧, 留存与互动设计师, 运营, 视觉设计, 导演]
    duration_s: 42
    interaction_design: 评论讨论型（抖音末句提问；小红书收藏+字段清单）
    cta: 你们店预约还在微信里接吗？有没有撞过档？
    script_choice: vA
    rounds:
      - title: "Round 1 · 编导立项 + 记者采证"
        turns:
          - role: 编导
            say: "T009 本地生活首条，测 F2 强钩子。抖音 19:30 晚高峰；小红书 F1 证据风 12:30 老板刷手机。验收：3s 钩子、5 段 evidence、不讲卖系统。"
          - role: 记者
            say: "走访合成场景：社区美甲 3 技师，预约散在老板微信+3 个技师号+一个「预约专用号」，共 5 窗口。周末 14–18 点高峰，纸质本与微信不同步。"
            challenge: 编导
          - role: 选题深挖师
            say: "钉子场景：周六 15:00，技师 A 本子已满，技师 B 私聊又来「3 点可以吗」，前台回晚客人已约别家。要结果：同一时段不 double book。"
          - role: 领域专家
            say: "美甲店决策链：先问空档→再比款式价格→怕白跑。替代方案：美团/有赞预约（月费+学习成本）。本片只说「一张共享表+撞档标红」，不提 SaaS 名。"
        resolution: "立项通过；5 窗口具体化；不讲买系统，统一「一张表」。"
      - title: "Round 2 · 洞察包 + 事实校验"
        turns:
          - role: 内核提炼师
            say: "P0：① 同一时段 double book ② 回晚客人流失 ③ 三套登记必漏 ④ 最小改法三步。价值锚：不用先买系统，先把预约从聊天里拎出来。"
          - role: 事实校验员
            say: "「200单」「5次漏回」改区间：撞档 2 次/周、漏回 5 条/周（合成经营数据）。红区：保证不撞档、100% 不漏。黄区：最亏→有时候最亏。"
          - role: 编剧
            say: "vA 钩子「同一时段约了两个人」比 v0「预约太乱」强；vB  empathy 版太软，F2 测 hook 用 vA。"
          - role: 留存与互动设计师
            say: "0–3s punch + metric 卡 + chat 卡，5 段每 7–9s 换体裁。末 CTA 改讨论型，不用扣1——模板门禁。"
          - role: 运营
            say: "小红书正文偏「最小改法三步」收藏；互动「需要字段清单评论区说」。抖音标签 #预约管理。"
        resolution: "选用 vA；CTA 去扣1；数据区间化。"
      - title: "Round 3 · 视觉 + 导演定形式"
        turns:
          - role: 视觉设计
            say: "抖音 F2：封面两行 hook「同一时段/约了两个人」。小红书 F1：note 体裁表结构截图风，与抖音 chat/metric 形成对照。"
          - role: 导演
            say: "分镜 5 段对齐 retention 表；emotion：surprised→sad→sad→happy→neutral。"
        resolution: "形式与分镜锁定，可进 week_build。"
    summary: |
      定稿：抖音 F2 / 小红书 F1。钩子「同一时段约了两个人」。口播 5 段 evidence，末句讨论型 CTA。
      核心改法：共享预约表 + 撞档标红 + 回客模板。禁止 efficacy/绝对化承诺。
    signoffs: [编导, 事实校验员, 留存与互动设计师, 运营]
    revisions:
      - "5 个微信窗口具体化为老板+3技师+预约号"
      - "CTA 扣1 改讨论型提问"
      - "数据点区间化/合成场景标注"
    decisions:
      hook: 同一时段约了两个人
      value_anchor: 不用先买系统，先把预约从聊天里拎出来
      script_choice: vA
      douyin: {format: F2, title: "美甲店最亏的不是没客人，是同一时段约了两个人"}
      xhs: {format: F1, title: "小美甲店不用买系统，先把预约从微信里拎出来"}
    insights:
      topic_brief:
        audience_role: 社区美甲店老板 / 前台
        audience_scale: 2–4 技师、日均 15–30 客
        current_solution: 微信私聊 + 纸质本 + 群接龙混用
        nail_scene: 周末下午同一技师被约两次，或回晚客人已走
        scenes:
          - "周六 15:00 技师 A 本子满档，B 的私聊又来 3 点预约"
          - "前台忙接待，微信 2 小时未回，客人说已约别家"
          - "纸质本、三个技师微信、预约号三套登记对不上"
        quotes:
          - {text: "「3点可以吗」——（两小时后）「算了我已约别家了」", source: 合成聊天记录}
          - {text: "周末一忙本子跟微信对不上", source: 老板口述}
          - {text: "不想每月再交一套系统钱", source: 老板口述}
          - {text: "撞档了客人体验很差，还会差评", source: 技师口述}
          - {text: "收到先回「确认中」心里踏实点", source: 前台口述}
        before: ["预约散在 5 个聊天窗口", "纸质本与线不同步", "撞档靠人记"]
        after: ["一张共享预约表", "撞档标红", "固定回客模板"]
        boundaries: ["不卖美甲 SaaS", "不讲具体品牌", "不承诺零撞档"]
      core_message:
        hook: 同一时段约了两个人
        value_anchor: 不用先买系统，先把预约从聊天里拎出来
        p0:
          - {info: 同一时段 double book 是隐性亏损, beat: 0–8s}
          - {info: 回晚半小时客人流失, beat: 8–16s}
          - {info: 三套登记忙时必漏, beat: 16–24s}
          - {info: 共享表+撞档标红+回客模板, beat: 24–36s}
        p1:
          - {info: 讨论型 CTA 促评论, beat: 末 5s}
        forbidden: ["保证不撞档", "100% 不漏单", "必须买 XX 系统"]
      domain_notes:
        decision_chain:
          - "客人先问空档和技师"
          - "犹豫款式/价格/距离"
          - "确认后怕白跑——回复速度决定成交"
        terms:
          - {term: double booking, plain: 同一时段约了两个人, on_air: 是}
          - {term: 共享预约表, plain: 一张表大家都能看, on_air: 是}
        alternatives:
          - {name: 美团/有赞预约, pro: 功能全, con: 月费+学习成本, say: 不是先买系统，先一张表跑通}
        evidence_screen: 无
        evidence_shot: note/chat/metric 体裁卡
      fact_check:
        green:
          - {text: 预约散在微信里, basis: 小店常见做法}
          - {text: 最小改法三步, basis: 流程建议非功效}
        yellow:
          - {text: 最亏, fix: 有时候最亏}
          - {text: 漏 5 条, fix: 忙时常见漏项（合成）}
        red:
          - {text: 保证不撞档, reason: 绝对化}
          - {text: 买了系统就解决, reason: 推销感}
    scripts:
      v0:
        title: v0 平铺版
        note: 钩子弱，弃用
        body: |
          美甲店预约太乱，微信、本子、群接龙混在一起……
      vA:
        title: vA 强钩子版（选用）
        body: |
          1. 美甲店最亏的有时候不是没客人，是同一时段约了两个人。
          2. 消息散在好几个聊天里，回晚半小时，客人已经约别家了。
          3. 纸质本、微信群、私聊三套登记，忙起来必漏一项。
          4. 不用先买系统。先把预约从微信里拎到一张表，撞档标红，回客用固定模板。
          5. 你们店预约还在微信里接吗？有没有撞过档？
      vB:
        title: vB 共情版
        note: F2 测试 hook 力度不足
        body: |
          开美甲店的姐妹，周末是不是最怕回微信……
    beats:
      - {time: 0–3s, type: 冲突钩子, format: punch+note, info: 同一时段两个人 P0, hold: 大字 hook}
      - {time: 3–10s, type: 证据, format: chat, info: 回晚流失 P0, hold: 聊天截图}
      - {time: 10–18s, type: 证据, format: metric, info: 三套登记 P0, hold: 数字卡}
      - {time: 18–28s, type: 解法, format: note, info: 最小改法 P0, hold: 三步清单}
      - {time: 28–42s, type: CTA, format: note, info: 讨论提问 P1, hold: 评论区}

  - project_id: W26D02
    topic_id: T010
    day_dir: D02-团购回访
    title: 团购回访
    vertical: 本地生活
    formats: {douyin: F3, xhs: F4}
    approved_at: "2026-06-16"
    participants: [编导, 记者, 选题深挖师, 内核提炼师, 领域专家, 事实校验员, 编剧, 留存与互动设计师, 运营, 视觉设计, 导演]
    duration_s: 40
    interaction_design: 抖音讨论型；小红书清单收藏+关键词「清单」
    cta: 做团购的，回访表有过吗？评论区诚实说说。
    script_choice: vA
    rounds:
      - title: "Round 1 · 形态分工"
        turns:
          - role: 编导
            say: "T010 测 F3 原生 UI（抖音聊天/档案）+ F4 报纸清单（小红书）。20 桌家常菜，团购后沉默成本。"
          - role: 记者
            say: "合成案例：月团购 218 单，回访 0；核销 tally 手工；差评 3 天后才看到。"
          - role: 纪录片导演
            say: "弧线：流量来了→三条线全断→200 单白卖。情绪：惊讶→无奈→可执行清单。"
        resolution: "218 单可写；回访 0 作对比冲击。"
      - title: "Round 2 · 洞察与合规"
        turns:
          - role: 内核提炼师
            say: "P0：回访 0 / 核销口头 / 差评太晚。价值锚：团购三条线别全靠人盯。"
          - role: 事实校验员
            say: "不说「平台罚你」；不写具体平台名差评原文。"
          - role: 运营
            say: "小红书 F4 出 5–7 张清单图，末张收藏 CTA；抖音 F3 用平台通知+前台 tally UI。"
          - role: 编剧
            say: "vA「团购200单回访0条」比 v0 具体；末 CTA 讨论型。"
        resolution: "vA 定稿；小红书走图文清单不强行视频。"
      - title: "Round 3 · 视觉路线"
        turns:
          - role: 视觉设计
            say: "F4 报纸风：核销打勾/差评提醒/留微回访三模块。F3 微信体+手工 tally 照片风。"
          - role: 留存与互动设计师
            say: "抖音 5 段；metric 开场 shock；末段 honest CTA。"
        resolution: "approved"
    summary: "抖音 F3 聊天/档案 UI 叙事；小红书 F4 清单图文。钩子「回访0条」。"
    signoffs: [编导, 运营, 事实校验员]
    revisions: ["200→218 区间化", "小红书 F4 不强制 video", "CTA 去扣1"]
    decisions:
      hook: 回访0条
      value_anchor: 团购三条线别全靠人盯
      script_choice: vA
      douyin: {format: F3, title: "团购卖了200单，回访0条"}
      xhs: {format: F4, title: "小餐馆做团购，别只盯销量：核销清单+差评提醒"}
    insights:
      topic_brief:
        audience_role: 小餐馆老板 / 前台
        audience_scale: 15–25 桌、团购月 100–300 单
        current_solution: 核销口头记、差评靠刷 APP、不留客资
        nail_scene: 团购带来流量，核销回访差评三条线忙时全断
        scenes: ["前台忙时漏核销", "差评三天后看到", "团购客无联系方式"]
        quotes:
          - {text: "卖了二百单，谁来过说不清", source: 老板口述}
          - {text: "差评看到时人早不来了", source: 店长口述}
          - {text: "回访？哪有时间", source: 前台口述}
          - {text: "对账对不上头秃", source: 财务口述}
          - {text: "想留微信客人不愿意", source: 服务员口述}
        before: ["核销口头", "差评滞后", "无回访表"]
        after: ["核销打勾表", "差评即时提醒", "留微回访"]
        boundaries: ["不讲菜品教程", "不贬特定平台"]
      core_message:
        hook: 回访0条
        value_anchor: 团购三条线别全靠人盯
        p0:
          - {info: 团购销量≠留客, beat: 0–8s}
          - {info: 核销口头易漏, beat: 8–16s}
          - {info: 差评发现太晚, beat: 16–24s}
          - {info: 核销+差评+留微三清单, beat: 24–36s}
        forbidden: ["平台必罚", "100% 差评拦截"]
      domain_notes:
        decision_chain: ["客人因优惠来", "体验决定是否复购", "无联系方式=一次性流量"]
        terms: [{term: 核销, plain: 客人来店里用券, on_air: 是}]
        alternatives: [{name: 专职运营, pro: 专人盯, con: 小馆请不起, say: 最小三张表先跑}]
        evidence_shot: chat/metric/note + F4 清单图
      fact_check:
        green: [{text: 回访表缺失常见, basis: 小馆经营观察}]
        yellow: [{text: 200单, fix: 约200/218单}]
        red: [{text: 平台官方处罚, reason: 无依据}]
    scripts:
      v0: {title: v0, body: "团购很重要，但要做好回访……"}
      vA:
        title: vA（选用）
        body: |
          1. 团购卖了200单，回访0条，这不是个例，是小馆通病。
          2. 核销靠前台口头记，一忙就漏，月底对账对不上。
          3. 差评三天才发现，客人早就不会再来了。
          4. 核销清单、差评提醒、留联系方式，三条线先自动化最小版，别全靠人盯。
          5. 做团购的，回访表有过吗？评论区诚实说说。
      vB: {title: vB, note: 钩子弱, body: "餐饮老板要注意团购后的服务……"}
    beats:
      - {time: 0–8s, type: shock, format: metric, info: 218单/0回访, hold: 数字}
      - {time: 8–16s, type: 痛点, format: note, info: 核销口头, hold: tally}
      - {time: 16–24s, type: 痛点, format: chat, info: 差评滞后, hold: 通知 UI}
      - {time: 24–36s, type: 解法, format: note, info: 三线清单, hold: 三步}
      - {time: 36–40s, type: CTA, format: note, info: 讨论, hold: 提问}

  - project_id: W26D03
    topic_id: T011
    day_dir: D03-试吃反馈
    title: 试吃反馈
    vertical: 健康知识
    formats: {douyin: F2, xhs: F1}
    approved_at: "2026-06-16"
    participants: [编导, 记者, 选题深挖师, 内核提炼师, 领域专家, 事实校验员, 编剧, 留存与互动设计师, 运营, 合规审核]
    duration_s: 38
    interaction_design: 讨论型；合规强调不讲功效
    cta: 你们试吃反馈现在记在哪？评论区说说。
    script_choice: vA
    rounds:
      - title: "Round 1 · 选题修正（用户反馈）"
        turns:
          - role: 编导
            say: "D03 已从「FAQ 复读机」改为「试吃装发出后反馈散在群里」——用户明确反馈，记者重新采证。"
          - role: 记者
            say: "186 份试吃发出，明确反馈 17 份；反馈散在 3 群，「还行吧」「吃了」无结构；Excel 缺领取日/反馈截止/意向字段。"
          - role: 合规审核
            say: "红区：任何功效、治疗、对比药物。绿区：领取登记、反馈表、意向标记——纯流程。"
          - role: 领域专家
            say: "保健品私域决策：先试吃→再信任→再复购。断档在「谁反馈了」不知道。"
        resolution: "选题锁定试吃链；只讲流程不讲功效。"
      - title: "Round 2 · 脚本与留存"
        turns:
          - role: 内核提炼师
            say: "P0：反馈<20/186；反馈散群；表缺字段；三天反馈表流程。"
          - role: 编剧
            say: "vA 用「不到20个」 shock；chat 段用真实语气「还行吧」；vB 太像教程弃。"
          - role: 留存与互动设计师
            say: "38s 5 段；chat 段是完播关键——要有真实感。"
          - role: 运营
            say: "小红书「需要字段清单扣试吃」——轻关键词，非扣1测互动。"
        resolution: "vA approved"
    summary: "试吃跟进链：领取登记→3天反馈→意向标记。严禁功效表述。"
    signoffs: [编导, 合规审核, 事实校验员]
    revisions: ["FAQ 题废弃，改试吃群反馈", "合规红线入 fact_check", "186/17 数据保留"]
    decisions:
      hook: 反馈不到20个
      value_anchor: 试吃链先跑通再放量
      script_choice: vA
      douyin: {format: F2, title: "200份试吃发出去了，能说出谁反馈的不到20个"}
      xhs: {format: F1, title: "私域发试吃别只盯发货：领取登记+3天反馈表"}
    insights:
      topic_brief:
        audience_role: 小团队私域运营 / 销售
        audience_scale: 5–15 人、月发 100–200 试吃
        current_solution: Excel 登记 + 微信群零散反馈
        nail_scene: 试吃发出后不知道谁真正反馈、谁有意向
        scenes: ["群里「还行吧」无法汇总", "Excel 缺反馈截止", "意向客户淹没在聊天里"]
        quotes:
          - {text: "还行吧", source: 群聊合成}
          - {text: "吃了", source: 群聊合成}
          - {text: "汇总反馈要半天", source: 运营口述}
          - {text: "不知道谁愿意深聊", source: 销售口述}
          - {text: "试吃成本不低", source: 老板口述}

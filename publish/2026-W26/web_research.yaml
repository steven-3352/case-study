# W26 网络调研 · 网络调研员产出
# 并入 room_sessions 展开 → insights/external_references.md

W26D01:
  consensus: "美业「撞单/撞档」是行业公认痛点：小程序、电话、微信预约信息割裂，周末高峰同一时段重复占档引发投诉。"
  refs:
    - source: 美盈易·美业POS案例
      url: https://www.myysoft.cn/zxal/1757469615600315.htm
      point: 线上小程序与线下电话预约未同步，3名客户同时约同一技师
      p0: 同一时段 double book
    - source: 华人POS·预约冲突检测
      url: https://pos-us.com/1412/
      point: 手动登记易错；周末节假日冲突更明显；退款率与体验直接相关
      p0: 三套登记必漏
    - source: 有赞·美业预约
      url: https://www.youzan.com/chanpin/meiyemendianguanli
      point: 多入口预约需统一看板，否则前台拥堵
      p0: 回晚客人流失
  web_quotes:
    - text: "撞单是美业门店的常见痛点：线上小程序预约与线下电话预约信息割裂"
      source: 美盈易行业文（转述）
    - text: "客户指定技师却没档期的情况时有发生"
      source: 华人POS（转述）

W26D02:
  consensus: "餐饮团购最大问题常不是卖不动，而是核销波动大、差评发现晚、团购客难沉淀私域——卖券是起点，三条跟进线断了就「流量来了留不下」。"
  refs:
    - source: 有赞·团购复购
      url: https://www.youzan.com/blog/articles/69201
      point: 核销后不留会员则来过一次就不再来；评论区影响新客决策
      p0: 回访0条
    - source: 轻流·餐饮回访
      url: https://customer.qingflow.com/post/980.html
      point: 传统回访随机低效，信息散在员工手中，人员流动数据流失
      p0: 团购客无联系方式
    - source: 有赞·小红书团购核销
      url: https://www.youzan.com/blog/articles/77074
      point: "有人买券不来用；需到期提醒提升核销"
      p0: 核销口头易漏
    - source: 网易·团购不赚钱三环节
      url: https://www.163.com/dy/article/KVMPIOTO0556ND83.html
      point: 核销率波动影响备货排班；应关注复购链路
      p0: 218单/0回访
    - source: 有赞·6步引流到复购
      url: https://www.youzan.com/cms/article/76126.html
      point: 店内标准化核销+加微+活动节奏；每步对应角色/话术/指标
      p0: 三条最小链
    - source: 腾讯新闻·经营分
      url: https://news.qq.com/rain/a/20260525A03OP600
      point: 低分门店核销/评价维度落后（区间化引用）
      p0: 差评发现太晚
  web_quotes:
    - text: "客户因为优惠团购来了一次就再也不来，团购价低卖得越多反而亏得越多"
      source: 有赞说（转述）
    - text: "核销率低于预期会造成食材浪费和人力闲置"
      source: 网易（转述）
    - text: "团购运营可拆成 6 步闭环，每一步要对应负责角色、话术模版和数据指标"
      source: 有赞 76126（转述）

W26D03:
  consensus: "保健品私域试吃/低价引流若缺跟进，易沉淀僵尸粉；信任与复购周期管理比发货更重要。"
  refs:
    - source: 人人都是产品经理·70万私域案例
      url: https://www.woshipm.com/share/6187626.html
      point: 19.9试吃引流用户72%无二次消费；80%沉默用户
      p0: 反馈不到20个
    - source: 南讯·维特健灵案例
      url: https://nascent.cn/bestpracticecases/413
      point: 发货后空窗期无跟进，用户判定无效；需结构化反馈与复购提醒
      p0: 反馈散在群里
    - source: CRMEB·保健品私域
      url: https://www.crmeb.com/ask/thread/39663
      point: 信任缺失；需真诚互动而非促销轰炸
      p0: 表缺关键字段
  web_quotes:
    - text: "30%用户来自2年前的19.9元试吃，其中72%从未2次消费"
      source: 人人都是产品经理（转述）
    - text: "用户在空窗期里独自面对「没效果」的焦虑，没有专业引导"
      source: 南讯案例（转述）

W26D04:
  consensus: "营养品/滋补品类复购依赖消耗周期提醒；靠销售个人记忆或Excel，离职即断档。"
  refs:
    - source: 南讯·复购周期提醒
      url: https://nascent.cn/bestpracticecases/413
      point: 基于消耗预测的标签与复购提醒任务
      p0: 第25天该触达
    - source: 金燕耳·公私域联动
      url: https://www.xinlingshou.com/practices/jinyaner
      point: 问卷收集诉求，自动化触达活跃老客
      p0: 四字段表
    - source: 瑞普斯·私域运营
      url: https://www.reapsgj.com/newsinfo3225.html
      point: 个性化服务提升复购；会员体系锁客
      p0: 人走断档
  web_quotes:
    - text: "当用户还在担心副作用时，品牌发来的是促销券——时机与内容错位"
      source: 南讯（转述）
    - text: "滋补品类高频复购、强信任，不投流没增长、投流又没利润"
      source: 有赞新零售·金燕耳（转述）

W26D05:
  consensus: "5–10人贸易/小公司跟单靠微信+Excel，节点多、到期无提醒，行政重复催办仍漏单。"
  refs:
    - source: 轻流·流程管理（类比）
      url: https://customer.qingflow.com/post/980.html
      point: 信息分散、人员流动导致跟单断档（跨行业共性）
      p0: 节点散聊天
    - source: 实在智能·业财对账
      url: https://www.ai-indeed.com/encyclopedia/18291.html
      point: 多系统壁垒，人工跟进度易错漏（节点型跟单同理）
      p0: 日发30仍漏
  web_quotes:
    - text: "客户信息分散在各个门店甚至各个员工手中，一旦人员流动，数据随之流失"
      source: 轻流餐饮文（转述·类比贸易跟单）
    - text: "每天轮询多个平台流程…原本10人天/月压缩至分钟级（说明节点表+提醒价值）"
      source: 实在智能（转述）

W26D06:
  consensus: "小电商退货对账痛点：平台/支付/ERP/客服多源数据口径不一，手工Excel易错漏，月末爆雷。"
  refs:
    - source: E数通·退款对账难点
      url: https://www.eshutong.com/archives/1702.html
      point: 多平台路径不同、缺唯一标识、时间维度不一致
      p0: 四套记录对不上
    - source: 实在智能·天猫对账
      url: https://www.ai-indeed.com/encyclopedia/18291.html
      point: 仅退款/退货退款/跨月退款造成烂尾数据
      p0: 差800找不到
    - source: FineReport·对账指南
      url: https://www.finereport.com/blog/article/693fbe45aaeb98e4d3b33314
      point: 退款必须与原订单匹配，否则利润虚高
      p0: 一张表对齐
  web_quotes:
    - text: "平台导出的退款数据、ERP订单、支付流水…格式各异，人工对起来容易出错"
      source: E数通（转述）
    - text: "原来用Excel对账，一天只能对1–2店两个平台"
      source: FineReport案例（转述）

W26D07:
  consensus: "三类小老板共性：流程在人脑/微信里，_busy 就漏、人走就断；应先自动化「登记+提醒+催办」三类重复活。"
  refs:
    - source: W26 D01–D06 讨论定稿
      url: publish/2026-W26/
      point: 本周六条归纳
      p0: 三类重复活
    - source: 南讯·信任时差
      url: https://nascent.cn/bestpracticecases/413
      point: 服务时差导致流失（跨板块）
      p0: 人走了就断
    - source: 轻流·回访系统化
      url: https://customer.qingflow.com/post/980.html
      point: 从随机人工到系统化节点（跨板块）
      p0: 一忙就漏
  web_quotes:
    - text: "回访转变为客户关系维护的起点…系统性维护客户关系"
      source: 轻流（转述·总结周）
    - text: "将不可控的效果盲盒转变为全程可控的专业服务旅程"
      source: 南讯（转述·总结周）

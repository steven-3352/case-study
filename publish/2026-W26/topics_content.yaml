      hook: "团购别只盯\n销量"
      kicker: 经营号外 · 小餐馆团购
      sub: 核销·差评·留微 三条线清单
      stamp: 号外
    segments: []
    carousel:
      style: newspaper
      slides:
        - title: 团购别只盯销量
          body: |
            20桌家常菜，月团购约200单
            常见问题：卖了券，留不下客
            本片只讲经营流程，不讲菜品
          stamp: 头版
        - title: 断点① 核销靠口头
          body: |
            收银台贴 tally 纸，忙时口头报数
            漏记 2–3 单 → 月底对账对不上
            销量好看，账目对不齐
        - title: 断点② 差评发现太晚
          body: |
            商家通知来了，老板 2–3 天后才看到
            客人早就不会再来了
            24h 内看到，才有机会补救

  xhs:
    title: 美甲店5个微信接单：不是缺表，是缺一条链（改造实录）
    body: |
      不是教程，是我帮一家3技师社区店改预约的过程。**不推销系统**，只讲怎么把烦人的重复活跑通。

      **原来乱在哪**
      5个窗口各接各的 → 撞档、漏回、回晚客流失。表如果只放在第四步，前面三步还是散的，没用。

      **我怎么改的（一条链）**
      1. **先回**：收到预约，固定模板「收到了，3点帮您确认中」（不用等想话术）
      2. **再写**：确认后写入**同一张**共享表（时段/技师/状态/来源）
      3. **再提醒**：同一技师同时段标红，前台不用记五个微信

      **跟 AI 什么关系？**
      我没让老板学技术。登记、撞档检测、回话模板——都是重复规则。手写表格能撑两周，撑不了一年。
      后来我把「先回→写入→标红提醒」做成一个小流程（你可以理解成很轻的小系统），前台看一张表、等提醒就行。
      **不是上大 SaaS**，是把「人走了就乱」的几步，变成能自己跑的几步。

      **两周后**：撞档 2→0，漏回 5→1。

      收藏备用。有类似「接单+提醒」场景的，评论区说说你们现在靠人还是靠流程。
    tags: [美甲店经营, 流程改造, 小店管理, 本地生活, 创业干货]
    duration_s: 45
    interaction: 有类似接单+提醒场景的，说说你们靠人盯还是已有小流程。
    cover:
      style: xhs_clean
      hook: "不是缺表\n是缺一条链"
      kicker: 社区美甲店 · 预约改造实录
      sub: 3个技师，5个微信窗口各接各的，周末容易撞档漏回
      steps: "先回模板,写入同表,标红提醒"
      foot: 改造实录 · 非教程 · 非广告
    segments:
      - {source: evidence, ref: d01-0, evidence_kind: hook, detail: "5个微信\n【还在接单？】", vo: "社区美甲店，3个技师，5个微信窗口——问题不是缺表，是缺一条能跑的链。", sub: 不是缺表是缺链, emotion: surprised}
      - {source: evidence, ref: d01-5b, evidence_kind: flow, detail: "先回模板\n写入同表\n标红提醒", vo: "先回、再写、再提醒——三步跑通，表只是中间那一步。", sub: 三步链, emotion: happy}
      - {source: evidence, ref: d01-6, evidence_kind: terminal, detail: "> 预约助手 · 15:02\n> ⚠ 撞档：小雨 15:00 已有预约\n> 已生成回复模板\n> 已写入共享表", vo: "登记、撞档、回话都是重复规则。这类活适合做成小流程，不用记五个窗口。", sub: 小流程不是大系统, emotion: happy}
      - {source: evidence, ref: d01-7, evidence_kind: metric, detail: "跑通2周后\n撞档：2→0\n漏回：5→1", vo: "两周后撞档归零。不是买系统，是链跑起来了。", sub: 两周变化, emotion: happy}

W26D02:
  pain: 20桌家常菜馆上了团购，核销靠口头记，差评2–3天才发现，团购来的客人没留联系方式，来了一次就没了。
  solves: 团购三条并行线（核销打勾→差评即时提醒→留微回访）；重复规则适合做成「团购助手」小流程提醒，表只是载体。
  hook: 流量来了留不下
  angle: 本地生活 · 小餐馆团购后沉默成本 · 展示「小系统改造」能力（软引流B端，不硬广）
  douyin:
    title: 帮20桌小馆改团购跟进：218单卖了，回访还是0
    body: |
      这条不是卖课，是我帮一家20桌家常菜馆改团购跟进的真实过程。

      问题不是「卖不动」——218单卖了，回访0条。三条线（核销/差评/留微）全在老板和前台脑子里，忙起来就断。

      我先帮她们跑通三步：① 核销打勾表（日结提醒） ② 差评即时通知（24h内看到） ③ 团购客留微回访表。
      登记、到期提醒、回访节点都是重复规则——后来做成「团购助手」小流程，前台不用记三条线，等提醒就行。

      不是上大 SaaS，是先让「流量来了留不下」的几步能自己跑。


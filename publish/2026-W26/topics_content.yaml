      theme: health
      slides:
        - title: 试吃别只盯发货
          body: |
            小团队月发100–200份试吃
            186份发出，明确反馈约17份
            本片只讲跟进流程，不讲功效
          stamp: 头版
        - title: 断点① 反馈散在三个群
          body: |
            「还行吧」「吃了」无法汇总
            60秒语音要反复听
            汇总反馈要半天
        - title: 断点② 表只记发货
          body: |
            Excel 缺：领取日期
            缺：反馈截止日
            缺：意向标记
        - title: 断点③ 不知道谁有意向
          body: |
            愿意深聊的人淹没在聊天里
            试吃成本不低，却跟不下去
            沉默用户越积越多
        - title: 三张最小表（先跑这个）
          body: |

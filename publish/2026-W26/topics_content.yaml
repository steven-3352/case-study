          body: |
            核销完没留联系方式
            来了一次就没了
            218 单说不清谁复购
        - title: 三步最小链（先跑这个）
          body: |
            ① 核销打勾表 + 日结提醒
            ② 差评即时通知（24h 内看到）
            ③ 留微回访表 + 节点提醒
          stamp: 可抄

# storyboard 模板 · 语音厅立绘 MV 复制版
#
# 用法:每首新歌新演唱者复制此模板,填入具体值 → agent 按此走 4 步 5 拍板点
# 玩法选型见 ../SOP.md §二 4 类玩法差异化(A 流行 / B 抒情 / C 国风 / D 嘻哈)

song_title: ""                       # 歌名
original_singer: ""                  # 原唱者(合规必需 · 首帧要标)
covered_by: "听潮阁·礼"              # 翻唱厂牌(可换)
brand_watermark: "TINGCHAOGE"        # 四角水印文字
style: A                             # A|B|C|D 4 类玩法
duration_target: 35                  # 30-38s 之间

# 视觉玩法预设(按 style 自动带入,可覆盖)
style_preset:
  A_pop_chorus:
    color_palette: ["#e53935", "#1a1a1a", "#c9a227"]   # 血红+纯黑+深金(项目铁律替代原霓虹)
    font_family: "PingFang SC Bold, SF Pro Display Bold"
    bg_theme: "夜景城市 / 半调网点 / 唱片圆盘"
    outro: "假音乐播放器 UI"
    chibi_mix: true                   # Q版+精修双立绘混搭
  B_ballad:
    color_palette: ["#87ceeb", "#f5f5f0", "#8a95a5"]   # 天蓝+云白+冷灰
    font_family: "手写体 / Ma Shan Zheng"
    bg_theme: "云天 / 爱琴海 / 灯塔 / 信纸 / 花田"
    outro: "群像合唱冰川蓝"
    props_emotional: ["花束", "信纸", "小Q陪衬", "薯条挂件"]
  C_guofeng:
    color_palette: ["#3d4451", "#1a1a1a", "#c9a227"]   # 冷灰+水墨黑+淡金
    font_family: "LXGWWenKai / 思源宋体 / 手写国风"
    bg_theme: "罗马数字时钟盘 / 钢琴 / 星空 / 相框边饰 / 城市剪影"
    outro: "时钟盘中央大字歌名"
    props_symbolic: ["狐狸", "时钟", "钢琴", "花束", "书信"]
  D_hiphop:
    color_palette: ["#e53935", "#000000", "#ffffff"]   # 血红+纯黑+白
    font_family: "立体粗字块 / Impact / Bebas Neue"
    bg_theme: "血红舞台聚光 / 涂鸦墙 / motion blur 竖条"
    outro: "复现开场 · 头像列 + Q版"
    chibi_dominant: true              # Q 版为主 (反差萌)
    top_singer_avatar_bar: true       # 顶部 N 人头像列

# 演唱者名单 · 每人一张立绘 (至少)
characters:
  - id: char_01
    name: "徐来"                       # 显示到底部 T.名字
    portrait: "assets/characters/xu_lai.png"    # 全身立绘 · GPT-image-2 出
    chibi: "assets/characters/xu_lai_chibi.png" # Q 版(可选 · 玩法 A/D 需要)
    anchor: "深色头发 / 米色风衣 / 抱花束"      # 一致性锚点 · 跨镜不许换
  # ... 增加更多

# 分段 storyboard
segments:
  # 开场群像
  - slug: intro_group
    time: [0.0, 3.0]
    role_type: chorus
    characters: [all]
    scene_bg: "assets/scenes/intro_neon.png"
    big_text: ""                                 # 开场通常无字 或 品牌 logo
    caption: ""                                  # 全歌词字幕(.ass 烧录用)

  # 独唱段 1
  - slug: solo_01
    time: [3.0, 7.5]
    role_type: solo
    characters: [char_01]
    scene_bg: "assets/scenes/city_night.png"
    char_pose: "抱花微笑 · 中景"
    big_text: ["什么", "都"]                    # 主大字 · 3.5s/4.5s 分两次出
    big_text_effect: "错位重复3遍"              # 玩法 A 特色
    caption: "什么都想给你"
    effects:                                    # 动效层(SOP §九) · 2026-07-20 补
      transition_in: T1_vmotion_blur_whip       # 从上段进入本段的转场 · 见 SOP §9.1
      transition_in_duration: 0.15
      portrait_motion: A1_ken_burns             # 立绘全段动效 · zoom 1.0→1.10
      portrait_zoom_max: 1.10                   # >=1.10 才肉眼可见 (memory feedback_zoompan-visible-motion)
      overlays:
        - type: A5_vfx_particles
          asset: assets/vfx/red_sparks.png      # 或 alpha video
          opacity: 0.6
      big_text_effect_code: B2_offset_repeat_3x # 大字动效编码 · 见 SOP §9.3
      beat_align: [3.2, 5.5, 7.0]               # 卡这几个鼓点切镜/大字出现

  # 独唱段 2(玩法 B 图字联动示例)
  - slug: solo_02_inversion
    time: [7.5, 11.5]
    role_type: solo
    characters: [char_02]
    scene_bg: "assets/scenes/sky_reflection.png"
    char_pose: "上下倒挂 · 图字联动"            # 立绘倒挂 · 呼应"倒影"
    big_text: ["倒", "影"]
    caption: "你是我的倒影"
    effects:
      transition_in: T3_flip_vertical_180       # V2 招牌 · 圆框 mask 内 180° flip
      transition_in_duration: 0.3
      portrait_motion: A6_circular_mask          # 圆框蒙版内 flip
      overlays:
        - type: A5_vfx_particles
          asset: assets/vfx/star_particles.png
          opacity: 0.5
      big_text_effect_code: B4_calligraphy_fade_in   # 书法慢速淡入
      beat_align: [8.0, 10.5]

  # ... 更多独唱段

  # 收尾群像
  - slug: outro_group
    time: [30.0, 35.0]
    role_type: chorus_or_ui
    characters: [all]
    scene_bg: "assets/scenes/outro_player_ui.png"  # 玩法 A · 假音乐播放器 UI
    big_text: "歌名"                              # 大字压层
    caption: ""

# 底部固定层(全片持续)
overlay_fixed:
  role_tag_position: "bottom_center"     # T.名字 显示位置
  role_tag_style: "white 20px opacity 0.9"
  brand_watermark_corners: ["tl", "tr", "bl", "br"]  # 4 角
  brand_watermark_style: "gray 14px opacity 0.4"
  # 玩法 D 独有
  top_singer_avatar_bar:
    enabled: false                        # 玩法 D 才 true
    avatars: []                           # 10 张小头像 png
    row_position: "top_center"
    row_height: 40

# 音频
audio:
  bgm: "assets/audio/song_original.mp3"       # 原歌
  vocal: "assets/audio/singers_mix.mp3"       # 演唱者接唱混音
  loudnorm_target: -16                        # dB · 项目铁律 dense-vo-no-dead-air

# 字幕
subtitles:
  format: ass                                 # libass · ffmpeg-full 烧录
  font: "PingFang SC"
  size: 24
  position: bottom
  outline: 2
  color_primary: "&HFFFFFF"
  color_outline: "&H000000"

# 输出
output:
  format: mp4
  video_codec: h264
  audio_codec: aac
  resolution: "1280x720"          # 或 1024x576
  fps: 30
  aspect_ratio: "16:9"

# gate 门禁(硬)
gates:
  - pipeline/gate_check_media.py               # ffprobe 体检
  - pipeline/gate_check_palette.py             # 禁蓝紫 · 玩法 A 高危必过
  - pre_publish_forecast >= B                  # audience-first 硬门

# 三平台适配
platforms:
  douyin:
    aspect: "9:16"                             # 竖屏适配 · 需重裁或加安全区
    caption_hook: "首帧标签 3s 内"
  xhs:
    strategy: "video_or_carousel"              # 由形式策略官定
    fallback: "7页图文轮播"

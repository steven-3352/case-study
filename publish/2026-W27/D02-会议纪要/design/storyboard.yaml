# 分镜 · storyboard · W27D02（vA · GPT-image 真素材）
content_id: W27D02
platform: douyin
canvas: 1080x1920
duration_s: 40
script_version: vA
render_pipeline: p004_video (GPT-image底图 + HTML/GSAP叠卡 → capture → build)
trust_anchor: "VO自证『我那套系统真在用，做出来给你看』+ 收尾自证"

shots:
  - id: s1_hook
    t: "0-3"
    intent: 停划
    template: d02_hook.html
    asset: meeting_room.png
    visual: 会议室散会底图 + 群"叮"纪要卡弹出 + hook大字「同事还在写纪要，我直接走了」
    vo: "散会了，同事还在写纪要，我直接走了。"
    qc: 大字不遮人物；卡片置侧
  - id: s2_minutes
    t: "3-11"
    intent: 看懂+信任锚
    template: d02_minutes.html
    asset: meeting_room.png(虚化)
    visual: 手机群聊纪要卡逐行展开(会议主题/决策/要点) + 信任锚VO
    vo: "不是我摆烂——纪要和待办，群里早自动发好了。"
    qc: 纪要文字清晰
  - id: s3_todo
    t: "11-22"
    intent: 看懂(主体)
    template: d02_todo.html
    asset: [test_worker.png, female_worker.png]
    visual: 待办清单卡逐条：责任人头像@亮起+deadline+到期提醒铃响
    vo: "我那套系统全程在听：散会就出结构化纪要，每条待办谁负责、什么时候交，自动@到人，到期还提醒。我把它干活的样子做出来给你看。"
    qc: 待办每条停留≥1s，头像可识别
  - id: s4_contrast
    t: "22-30"
    intent: 看懂+共鸣
    template: d02_contrast.html
    asset: [tired.png, relaxed.png]
    visual: 分屏 左同事熬夜整理 vs 右我轻松离开
    vo: "以前开完会最烦的不是会，是会后熬夜整理、追着每个人要进度。现在我只管讨论拍板，记录追办交给它。"
    qc: 分屏对比清晰
  - id: s5_anchor_cta
    t: "30-40"
    intent: 价值锚+自证+互动
    template: d02_cta.html
    asset: me_phone.png
    visual: 价值锚压屏→主角拿手机自证→CTA大字
    vo: "你们公司开会，纪要是谁在整理？是不是最烦的活？评论区说说，下条我真做给你看。"
    qc: CTA完整进片

forms_count: 4   # 散会场景/纪要卡/待办@动效/分屏对比/自证
anti_homogeneity:
  - 不复用D01吵架团/CSS圆脸；画面是会议室/纪要卡/待办@
  - 全镜GPT-image真素材底图，文字HTML层
gates:
  - retention/form_strategy/motion_tech: ok
  - 独立互评: pending
  - render后抽帧: pending

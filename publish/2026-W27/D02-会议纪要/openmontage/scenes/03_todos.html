<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans", Arial, sans-serif;
    background: #f6f7f9;
    color: #17202a;
  }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: linear-gradient(180deg, #f6f7f9 0%, #e9eef5 100%);
  }
  .hero {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(1.04) contrast(1.02);
  }
  .shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(246,247,249,.10) 0%, rgba(246,247,249,.35) 45%, rgba(23,32,42,.48) 100%);
  }
  .label {
    position: absolute;
    left: 56px;
    top: 64px;
    padding: 14px 22px;
    border-radius: 999px;
    background: #ffffff;
    color: #1f7aff;
    font-size: 30px;
    font-weight: 800;
    box-shadow: 0 14px 38px rgba(17, 24, 39, .16);
  }
  .headline {
    position: absolute;
    left: 56px;
    right: 56px;
    bottom: 500px;
    color: #ffffff;
    text-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  h1 {
    margin: 0 0 18px;
    font-size: 86px;
    line-height: 1.05;
    letter-spacing: 0;
  }
  .sub {
    font-size: 50px;
    font-weight: 800;
    line-height: 1.18;
  }
  .card {
    position: absolute;
    left: 56px;
    right: 56px;
    bottom: 90px;
    background: rgba(255,255,255,.96);
    border-radius: 28px;
    box-shadow: 0 22px 60px rgba(17,24,39,.25);
    padding: 34px 38px;
    border-left: 14px solid #1f7aff;
  }
  .card ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .card li {
    margin: 16px 0;
    padding: 18px 22px;
    border-radius: 18px;
    background: #f6f7f9;
    font-size: 38px;
    line-height: 1.25;
    font-weight: 700;
  }
  .card li:nth-child(2) { color: #1f7aff; }
  .card li:nth-child(3) { color: #18a058; }
  .split {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .pane {
    position: relative;
    overflow: hidden;
  }
  .pane img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .pane::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.48));
  }
  .pane b {
    position: absolute;
    z-index: 2;
    left: 34px;
    bottom: 610px;
    padding: 14px 20px;
    border-radius: 16px;
    color: white;
    font-size: 38px;
  }
  .pane.bad b { background: #ef4444; }
  .pane.good b { background: #18a058; }
</style>
</head>
<body>
  <div class="stage">
    <img class="hero" src="file:///Users/bubu/Documents/projects/case-study/assets/characters/w27d02/test_worker.png">
    <div class="shade"></div>
    <div class="label">11-22s / 待办追办</div>
    <div class="headline">
      <h1>AI 全程在听</h1>
      <div class="sub">谁负责、什么时候交，自动 @ 到人</div>
    </div>
    <div class="card"><ul><li>@ 小周  明晚 20:00 交初稿</li><li>@ 小林  周五前补数据</li><li>@ 我  今天同步结论</li></ul></div>
  </div>
</body>
</html>

# 声音方案 · audio_plan.yaml
# 工种: 声音设计师 · W27D03 · 演示型成长视频 · 锁 vA
content_id: W27D03
topic_id: T003

voice:
  engine: minimax            # 见 engine_rationale：本条情绪起伏(傻眼/反转)需逐段抑扬，MiniMax 支持 per-段 emotion，Edge 做不到
  model: speech-2.8-turbo
  voice_id: Chinese (Mandarin)_Sincere_Adult   # 真诚青年：20年互联网转一人公司、自述、可信不端着；非播音腔/非霸道青年
  speed: 1.05                # 演示型偏紧不拖；钩子/翻车段后期可降 0.98 留顿（见 emotion_arc）
  pitch: 0
  emotion: neutral           # 全局基调；逐段弧线见 emotion_arc（render 按 shot 传入覆盖）
  language_boost: Chinese
  script_path: publish/2026-W27/D03-海外获客成长/scripts/script_three_versions.md   # 取 vA 段逐字口播
  engine_rationale: |
    选 MiniMax 而非 Edge（演示型默认 Edge · DECISIONS §79）。理由：
    1. 本条情绪曲线陡（第5天傻眼=沉/顿 → 一天搭完=提速 → 系统自跑=平稳过程感 → 翻车回扣=沉 → 改前改后=转折上扬 → 价值锚收束），
       Edge TTS 只能整段一个 rate/pitch，无法逐段抑扬；MiniMax 支持 per-段 emotion（happy/sad/neutral...）+ speed 覆盖，
       gen_speech.py / minimax_client.py 已实现 synthesize_text(emotion=, speed=) 逐段传参，能把弧线真正配出来。
    2. 人设=20年互联网转一人公司自述，需"可信不端着"而非播音腔；voice_id 选真诚青年(Sincere_Adult)，比 male-qn-badao(霸道)更贴自白口吻。
    3. 账号记忆 MiniMax 就绪（中转 async/ t2a_v2 均可用）；失败自动回落 Edge（synthesize_text 内置兜底），不阻塞 render。
  emotion_arc:                # render 逐 shot 调 synthesize_text(emotion=, speed=)，把情绪曲线落到 VO
    - shot: s1_hook            # 0-3s 第5天傻眼
      t: "0-3"
      emotion: sad            # 顿/沉：傻眼是悬念不是兑现；"傻眼了"落点放慢留白给字
      speed: 0.98
      note: "'第5天我傻眼了'压一个停顿，与 BGM 节奏停顿点对齐(留存铁律4·音画同拍)"
    - shot: s2_buildday        # 3-11s 一天搭完
      t: "3-11"
      emotion: happy          # 提速：四拍快切的兴奋/笃定，节奏带起来
      speed: 1.08
      note: "'从头搭到上线'轻上扬收口，配四拍提速"
    - shot: s3_autorun         # 11-20s 系统自己跑
      t: "11-20"
      emotion: neutral        # 平稳推进/过程感：最长一段，稳住不抢戏，让画面(时间轴点亮)说话
      speed: 1.02
      note: "'我人不在，它照样一封封地发'平铺娓娓道来，过程感优先(对标41.4%完播);末句'跟进这环我盯的时间几乎是零'(结论钩前移并入本段)轻收口、不强调，坐实盯守≈0"
    - shot: s4_crash           # 20-28s 翻车回扣
      t: "20-28"
      emotion: sad            # 沉：回扣傻眼，'寥寥无几'重音落下
      speed: 0.98
      note: "'留下来的却寥寥无几'放慢、压住重音，与划走动画同拍"
    - shot: s5_compare         # 28-37s 改前改后
      t: "28-37"
      emotion: happy          # 转折上扬：改法笃定、'留资才开始动'松一口气
      speed: 1.05
      note: "'才像活人发的，留资才开始动'上扬；'基本没花钱'轻带过不强调"
    - shot: s6_anchor_cta      # 37-45s 价值锚+CTA（两拍·结论钩已前移 s3）
      t: "37-45"
      emotion: neutral        # 收束：真诚收口，价值锚一字一句，CTA 问句末轻上扬留白给评论
      speed: 1.0
      note: "末段压成两拍(价值锚+CTA)：'系统能跑，内容得先像人'放慢一字一句；CTA 问句末上扬，把决定权留给观众。结论钩已前移并入 s3，本段不堆三句、末5s 语速不赶留白给完播"

bgm:
  mood: light_tech_warm       # 轻科技 + 一人公司自述温度；非紧张鼓点、非喜剧打闹(区别 D01 upbeat)
  source: bgm/                # 选轻科技/过程感舒展曲，能跟随情绪起伏(钩子顿→中段铺→收尾上扬)；render 前定具体文件
  volume: 0.08                # 演示型 VO 为主，BGM 压更低，确保人声清晰(对标参考2轻背景不压人声)
  fade_in_s: 0.5             # 0-3s 钩子需快速进氛围又不抢字，短淡入
  fade_out_s: 2.0
  loop: true
  benchmark_ref: "参考2·本号「一群Agent全程无参与」41.4%完播(过程展示型,轻背景未压人声)"
  hook_0_3s: "第1节奏点对齐 0-1s 落地页/曝光曲线亮起;'第5天我傻眼了'落点处明显节奏停顿留白给字幕;不压人声"
  notes: |
    情绪曲线(跟 VO emotion_arc 同拍):
      0-3s 钩子(顿/沉) → 进氛围即停顿,给"傻眼"留白
      3-11s 一天搭完(提速) → 节奏推起来配四拍快切,每拍切换对齐节奏点
      11-20s 系统自跑(平稳过程感) → 节奏铺最久、最稳,不抢戏,让时间轴点亮"叮"声当主拍
      20-28s 翻车回扣(沉) → 节奏回落、留白,配"划走"痛感
      28-37s 改前改后(转折上扬) → 分屏推入处节奏明显上扬,情绪松开
      37-45s 价值锚+CTA(收束) → 收束上扬后留白,CTA 问句末给安静尾巴
    全程 BGM 服务 VO 情绪,绝不盖人声;过程感长段(11-20s)靠 SFX"叮"做记忆点而非加大 BGM。

sfx:                          # 按 storyboard 6 镜时段列；服务单焦点,不与 VO/大字争
  - "0-1s  s1 落地页/曝光曲线亮起:轻'唰'入场氛围音(对齐 BGM 第1节奏点)"
  - "1-2s  s1 镜头下移到空留资栏:留白顿点(无音/极弱),'空'的留白靠静默放大反差"
  - "2-3s  s1 反差大字砸入:'第5天我傻眼了'落点节奏停顿 + 补刀拟声「?」轻击"
  - "3-11s s2 四拍快切:每拍切换对齐 BGM 提速节奏点(轻'嗒');第四拍末'上线'戳记弹入'叮'一声"
  - "11-20s s3 时间轴逐格点亮:每点亮一格一声清脆'嘀/叮'对齐口播(过程主拍);邮件飞出轻'嗖'"
  - "20-22s s4 回切第5天空留资栏:回切轻'咔'过渡"
  - "22-26s s4 引流图划走/秒滑:'唰'(机械味、谁都刷过),压在'寥寥无几'重音上;翻车瞬间叠一个当下流行的'裂开/傻眼'热点音效梗(背景层音量·明显低于 VO·不盖人声·只给翻车情绪底)"
  - "26-28s s4 根因大字「内容太机器」:与划走错峰出现,大字落点轻'顿'"
  - "28-37s s5 改前改后分屏推入:'唰'推入一声;右侧留资栏示意性轻入轻'嗒嗒'两下(留资'开始有反应'示意·限示意);成本角标无音效(退背景)"
  - "37-45s s6 自动跑全景:压低环境底噪,仍有轻微'叮'示意邮件还在发;价值锚/CTA 两段各弹入轻'噔'一声;CTA 问句末留白无音(末段两拍·结论钩已前移 s3)"
  sfx_principle: |
    留白顿点(0-3s 空名单、20-28s 翻车)用静默放大反差,不靠音效堆;
    过程感长段(11-20s)靠时间轴"叮"做节奏记忆点;
    s4 翻车的"裂开/傻眼"热点音效梗走背景层音量(明显低于 VO、不盖人声),只作流行情绪底,不抢单焦点;
    所有 SFX 音量低于 VO,人工听 30s 确认不淹没旁白。

subtitles:
  srt_path: publish/2026-W27/D03-海外获客成长/design/sub_va.srt   # render 前由 vA 逐字口播生成
  burn: true                  # 烧进画面(ffmpeg 无 libass,走 HTML 帧 overlay,见项目记忆)
  style: |
    底部跟读字幕(跟 VO 逐字) + 前3s/各镜大字钩子(subtitle_big)分层;
    大字钩子 / SFX 拟声「?」 / CTA 问句互斥布局,不与主画面焦点(空名单/亮格/分屏)叠层遮挡;
    出图后逐帧目视检查叠层(留存铁律3)。
  hook_first_3s: true
  hook_text: "一天搭完 · 第5天我傻眼了"   # 0-3s 大字钩子,压在空留资栏旁(互斥不遮红框)
  big_text_by_shot:           # 各镜 subtitle_big(与 storyboard 对齐)
    s1: "一天搭完 · 第5天我傻眼了"
    s2: "一个人 · 一天 · 全链路上线"
    s3: "我不在,它照发 · 盯的时间≈0"
    s4: "系统在跑,人却没留下"
    s5: "才像活人发的 · 留资才开始动"
    s6: "系统能跑,内容得先像人 / 你有没有'留了线索却总忘跟进'的活?"

outputs:
  video_raw: publish/2026-W27/D03-海外获客成长/douyin/video_raw.mp4
  video_with_bgm: publish/2026-W27/D03-海外获客成长/douyin/video_with_bgm.mp4   # 默认外发(音画三件套齐)
  vo_mp3: publish/2026-W27/D03-海外获客成长/douyin/vo.mp3

qc:
  - VO 清晰可辨,BGM(0.08)/SFX 均不盖人声(人工听全片 45s)
  - 前 3s 钩子字幕「一天搭完·第5天我傻眼了」可见,与 hook_benchmark 停划设计一致,不遮空留资栏红框
  - 0-3s BGM 入点不抢戏;'第5天我傻眼了'落点 BGM 节奏停顿 + 字幕同拍(留存铁律4·音画同拍)
  - 情绪 6 段弧线落到 VO(sad→happy→neutral→sad→happy→neutral),逐段听验抑扬,非整段平铺
  - SFX 留白顿点(0-3s 空名单/20-28s 翻车)靠静默放大反差,未被音效填满
  - 11-20s 过程长段时间轴"叮"做主拍,BGM 未加大抢人声
  - CTA 口播完整进 mp4(VO≤片长 45s);末段两拍(价值锚+CTA)互斥不叠加,结论钩已前移 s3
  - 外发使用 video_with_bgm.mp4,非 raw;音画三件套(VO+BGM+字幕)齐

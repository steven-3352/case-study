# 分镜 · storyboard · W27D03（演示型 · 真实界面/真实数据 · 锁 vA）
# 工种: 导演（执行）+ 摄像/视觉 · 依赖 retention_beat_sheet ✓ form_strategy(6镜winner+注意力层) ✓ motion_tech_plan ✓
# 落地原则: 严格兑现 form_strategy 6 镜 winner（方案 A）+ 注意力层「每帧只一个赢家」；口播逐字取 vA
content_id: W27D03
topic: 我用 AI 把一周的活干成一天，现在它自己在帮我赚钱
platform: douyin
canvas: 1080x1920
duration_s: 45
script_version: vA
hook: "一天搭完，第5天我傻眼了。"
trust_anchor: "演示型命门=真实界面质感：第1帧即真落地页+真邮箱列表，看板/数据为仿真但结构可解释，不冒充真实后台精确数字（守 fact_check：留资仅'个位数/寥寥无几'，禁金额/转化率）"

# 红线（全片硬约束）：
#  - 「赚钱」降级=系统自动积累客户/盯守≈0；禁任何金额/月入/转化率/留资率上屏
#  - 留资数仅写"个位数/寥寥无几"；"第5天"可精确；成本走"基本零成本/盯守≈0"区间口径
#  - 禁 P 图假后台：用真实界面或可标注的仿真，结构真实、不冒充真实后台
#  - 玄学合规：只讲获客系统，不碰风水/疗效/招财保证
#
# 真实性硬规格（所有含仿真数据看板/留资曲线/留资名单的镜·s1/s3/s4/s5 通用）：
#  - 示意水印常驻：仿真数据区屏上常驻「示意数据」水印/角标（明度可压低但任一帧可读），不暗示实时真后台
#  - 真假分界清晰：真实素材区（真落地页截图）与仿真区（数据动效/看板/留资曲线）须有明确视觉分界——分屏/标签/边框/底色其一，禁真落地页与仿真看板无界混成一帧让人误读"实时真后台"
#  - 禁伪造改善证据：留资"微动/活过来"只作示意性轻入，不呈现具体增幅/不暗示精确改善量

shots:
  - id: s1_hook
    t: "0-3"
    intent: 停划（翻车前置）
    form: 真实落地页 + 后台留资看板 + 反差大字砸入
    template: d03_hook.html
    visual: |
      0-1s 真实落地页背景虚化压灰打底；上方曝光曲线层入场时上扬 ↑ 动一下即定（亮绿/科技蓝），只负责"系统真在跑"氛围
      1-2s 镜头下移（焦点跟随 zoom）落到留资/邮箱名单栏——几乎空白、个位数、空列表行，红框点在"空"上
      2-3s 反差大字「一天搭完，第5天我傻眼了」砸入定格，压在空名单上；曲线已淡到余光
      真假分界：真落地页区（真实截图）与上方仿真曝光曲线/留资看板区用边框+标签分隔，不混成一帧；仿真看板区右上常驻「示意数据」角标
    vo: "一天搭完，第5天我傻眼了。"
    subtitle_big: "一天搭完 · 第5天我傻眼了"
    focus: "唯一视线落点=留资/邮箱名单栏的『空』（红框点空列表）；曝光曲线压灰缩小退上方背景层，仅入场动一下即定，不与空名单争焦点"
    sfx: 第1节奏点对齐落地页/曲线亮起 → "傻眼"落点处明显节奏停顿留白给字 → 补刀拟声「？」
    qc: |
      - 单焦点唯一：暂停首帧一秒能指到"空名单"，曲线未变第二赢家
      - 字幕不遮挡：钩子大字不压住空名单红框，互斥布局
      - 数字区间：0-3s 无任何赚钱/收入/转化数字；留资仅呈现"空/个位数"不写具体数
      - 示意水印在场 + 真假分界清晰：仿真曝光曲线/留资看板区常驻「示意数据」角标；真落地页区与仿真看板区有边框/标签分界，不混成一帧误读实时真后台

  - id: s2_buildday
    t: "3-11"
    intent: 看懂方案（提速蒙太奇 · 防拖沓）
    form: 真实界面四拍快切 + "上线"戳记弹入
    template: d03_buildday.html
    visual: |
      四拍分时快切，每拍≈2s，一次只让一块界面占屏中心放大、其余三块不同帧出现：
        拍1 上午=真实落地页（hero 区高亮）
        拍2 中午=表单接邮箱（表单字段填入动作热点高亮）
        拍3 下午=自动邮件 + 埋点（邮件模板"保存/启用"高亮）
        拍4 傍晚=Pinterest 竖版引流图（出图保存高亮）
      第四拍末"上线"戳记弹入收束（转场容器，不抢界面主体）
    vo: "一个人，做老外的英文市场。我用一天，把拉客、收邮箱、自动跟进，从头搭到上线。"
    subtitle: 跟读口播
    subtitle_big: "一个人 · 一天 · 全链路上线"
    focus: "每一拍单焦点=当前正在搭的那一块界面（落地页/表单/邮件/出图）的动作热点；四块分时轮流上、不同帧并置，绝不四格同屏打架"
    sfx: 每拍切换对齐 BGM 提速节奏点；"上线"戳记弹入一声
    qc: |
      - 单焦点唯一：每一拍只有一块界面在中心、一个动作热点在亮，无四格同屏
      - 字幕不遮挡：界面动作热点与大字互斥布局，戳记不压界面主体
      - 真实性：四块均真实界面截帧，非抽象流程图节点；不冒充真实后台数字

  - id: s3_autorun
    t: "11-20"
    intent: 看懂（收藏钩）· 过程展示 · 全片最长/最抓完播一段（对标 41.4%）
    form: 真实邮件逐封飞出 + HTML/GSAP「Day0/2/4/6/8/10」时间轴逐格点亮 + 角标
    template: d03_autorun.html
    visual: |
      底部 Day0/2/4/6/8/10 时间轴；随口播逐格点亮——说 Day0 亮 Day0、说"每隔几天"逐格推进
      点亮的当前格放大高亮，其余未到/已过格压灰退背景层
      每点亮一格，从该亮格位置发出一封真实样式欢迎信/养熟邮件"飞出"动画（视线被引到同一落点）
      右上角标「我不在 · 照发」明度压低退角落，不与亮格争眼
    vo: "然后我就不管了。有人填邮箱，它立刻发欢迎信，往后每隔几天自己发一封养着，我人不在，它照样一封封地发，跟进这环我盯的时间几乎是零。"
    subtitle: 跟读口播
    subtitle_big: "我不在，它照发 · 盯的时间≈0"
    focus: "唯一视线落点=正在被点亮的『当前那一格 Day 节点』；其余格压灰退背景，邮件飞出从该亮格发出，视线同一落点（运动=最强前注意特征）"
    sfx: 每格点亮一声"叮"对齐口播；邮件飞出轻"嗖"；节奏铺最久、最稳
    qc: |
      - 单焦点唯一：任一帧只有"当前亮格"在赢，其余格压灰；邮件从亮格发出不乱飞
      - 字幕不遮挡：时间轴在底部、大字在中上、角标在角落，三者互斥
      - 真实性：邮件为真实样式仿真、结构可解释；不冒充真实后台收件数；无金额
      - 示意水印在场 + 真假分界清晰：时间轴/邮件飞出仿真区常驻「示意数据」角标；仿真动效区与任何真实截图区有边框/标签分界，不冒充实时真后台

  - id: s4_crash
    t: "20-28"
    intent: 交接（评论钩）· 冲突回扣 · 回扣 0-3s 同物件搭桥
    form: 回切第5天空留资栏 → 放大引流图 + "划走/秒滑"手势动画 + 根因大字
    template: d03_crash.html
    visual: |
      20-22s 镜头回切第5天空留资栏（与 s1 同物件搭桥，运动路径过渡、不黑屏中转）作过渡焦点先出
      22-26s 视线沿运动路径交接到被放大的"那张 AI 一键出的引流图"——叠"划走/秒滑"手势动画（机械味、谁都刷过）
      26-28s 根因大字「内容太机器」分时出现（与划走动作错峰，不同时尖叫）
      背景层热点梗：翻车瞬间在角落/背景叠一个当下流行的"裂开/傻眼"表情包式反应贴纸（呼应母题「第5天傻眼」），压灰+虚化+缩小退余光，只作"出事了"情绪反应容器，不与引流图/划走单焦点争眼
    vo: "它一直在替我攒老外客户。可第5天我一看——曝光是涨了，留下来的却寥寥无几。"
    subtitle: 跟读口播
    subtitle_big: "系统在跑，人却没留下"
    focus: "单焦点=被放大的『那张 AI 引流图 + 划走手势』（揭根因物件本身）；空留资栏作回扣过渡焦点先出，再用运动路径把视线交接给引流图，不双焦点并存。背景层'裂开/傻眼'反应梗压灰虚化退余光，不进视线赢家"
    sfx: 回切轻"咔"；"划走"秒滑"唰"；切换压在"寥寥无几"重音词上；翻车瞬间一个当下流行的"裂开/傻眼"热点音效梗（背景层音量·不盖 VO）
    qc: |
      - 单焦点唯一：空栏→引流图有运动路径搭桥，任一帧只一个赢家，不黑屏中转；"裂开/傻眼"反应梗压灰虚化退余光，未变第二赢家
      - 字幕不遮挡：根因大字与划走手势分时、互斥
      - 数字区间：留资仍仅"寥寥无几"；"第5天"可精确；无金额/转化率
      - 示意水印在场 + 真假分界清晰：回切的空留资栏看板（仿真区）常驻「示意数据」角标，与真实引流图素材有边框/标签分界，不混成实时真后台

  - id: s5_compare
    t: "28-37"
    intent: 看懂（差异本身当焦点）+ 信任 · 本条最高级一镜
    form: HTML/GSAP 左右分屏对比 + 右侧留资栏示意性轻入 + 成本反差角标（区间口径）
    template: d03_compare.html
    visual: |
      左屏=纯 AI 一键出图（机器味）压暗退背景；右屏=「AI 只出背景·文字自己排」（像活人发）提亮
      明度交接把视线锁右侧；右侧留资栏"示意性轻入"（仅一两行留资轻入 + 屏上「示意」标注，只示意"开始有反应"，不出具体增幅/不暗示精确改善量/不呈现倍数）
      成本反差角标「基本零成本 · 盯守≈0」明度压低退背景层、区间口径，做信任铺垫不抢眼
      真假分界：左右两屏均为真实出图素材，分屏中缝为视觉分界；右侧留资栏属仿真示意区，常驻「示意数据」角标
    vo: "扒下来根因是内容太机器，AI 一键出的图谁都刷过。改成 AI 只出背景、文字我自己排，才像活人发的，留资才开始动。整套基本没花钱，盯守也几乎是零。"
    subtitle: 跟读口播
    subtitle_big: "才像活人发的 · 留资才开始动"
    focus: "单焦点=两屏之间的『差异本身』——右侧'像人'块 + 其留资栏示意性轻入；左侧机器味图压暗、右侧像人图提亮，明度交接锁右侧，差异即唯一赢家"
    sfx: 分屏推入一声；右侧留资栏示意轻入轻"嗒嗒"两下；成本角标无音效（退背景）
    qc: |
      - 单焦点唯一：左屏压暗、右屏提亮，视线被锁右侧差异，非左右同等尖叫
      - 字幕不遮挡：成本角标明度压低、大字与角标互斥，不并置打架
      - 数字区间：成本走"基本零成本/盯守≈0"区间；留资栏仅示意性轻入，不出具体数/增幅/倍数
      - 示意水印在场 + 禁伪造改善证据：右侧留资栏轻入区常驻「示意」标注，只示意"开始有反应"，不呈现精确改善量；真实出图素材与仿真留资示意区分界清晰

  - id: s6_anchor_cta
    t: "37-45"
    intent: 评论钩 + 信任收束 · 价值锚→CTA 两拍分时（结论钩已前移并入 s3）
    form: 系统继续自动跑安静全景（邮件还在一封封发·压灰虚化）→ 两段字幕逐句弹入 + CTA 问句（互斥布局）
    template: d03_anchor_cta.html
    visual: |
      背景=系统继续自动跑安静全景（邮件还在一封封发）压灰虚化退背景层，坐实"它仍在替我跑"信任收束
      前景按口播分时逐句出（阅读顺序=入场顺序）· **两拍·不堆三句**：
        拍1 价值锚大字「系统能跑，内容得先像人」
        拍2 CTA 问句「你有没有'留了线索却总忘跟进'的活？评论说说」
      CTA 出现时背景已淡到余光；两段互斥布局、分时出现不叠加（留存铁律③）
    vo: "系统能跑，内容得先像人。你有没有'留了线索却总忘跟进'的活？评论说说，下条我把这套自动跟进拆给你。"
    subtitle: 跟读口播
    subtitle_big: "系统能跑，内容得先像人 / 你有没有'留了线索却总忘跟进'的活？"
    focus: "单焦点=末段『CTA 问句大字』（评论缺口）；价值锚→CTA 两拍分时逐句出（结论钩前移至 s3，末段只留两拍），背景'邮件还在发'全景压灰虚化退背景层，CTA 出现时已淡到余光"
    sfx: 全景压低环境底噪（仍有轻微"叮"示意还在发）；两段字幕各弹入一声；CTA 问句末轻上扬留白给评论决定
    qc: |
      - 单焦点唯一：CTA 段只有问句大字在赢，背景全景已虚化退余光
      - 字幕不遮挡：价值锚/CTA 互斥分时、不叠加；CTA 口播完整进 mp4（VO≤片长）
      - 末段两拍·不过载：只留价值锚+CTA 两句（结论钩已前移 s3），末 5s 不堆三句、语速不赶，给完播留白
      - 数字区间：CTA 区无金额/收入/已赚；"赚钱"口径只到"系统自己攒客户、盯守≈0"

forms_count: 6   # 数据反差停划/真界面四拍快切/时间轴过程点亮/回扣划走交接/改前改后分屏/自动跑全景收束
anti_homogeneity:
  - 不沿用 D01（2D 卡通多 Agent 喜剧语法）——本条全程真实界面+真实数据，零卡通、零拟人头像
  - 不沿用 dry-run-001 旧帧（58s 四段窗口卡片轮播）——本条 45s 演示型六拍、每镜画面任务各异
  - 不沿用 newsprint/evidence 卡片轮播
  - 每镜镜内语法不同（反差停划/四拍快切/时间轴点亮/划走交接/分屏对比/全景收束），非同屏卡片换文案
  - 关键帧若替换任意选题文案仍成立=模板化风险 → 本条画面与"海外获客系统翻车→改法"事实强绑定

gates:
  - retention_beat_sheet: ok
  - form_strategy（6镜winner+注意力层）: ok
  - motion_tech_plan: ok（HTML+GSAP 数据动效已出技术审查）
  - 注意力层: ok（6 镜全声明单焦点；时刻分型 停划/看懂/交接/收藏钩/评论钩 5 类）
  - script_vA: locked
  - render_then_抽帧复验: pending   # 6 关键帧逐镜验单焦点/字幕不遮挡/数字区间/示意水印在场+真假分界清晰（s1/s3/s4/s5 仿真区）

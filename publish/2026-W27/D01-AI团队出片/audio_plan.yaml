# 声音方案 · audio_plan.yaml
# 工种: 声音设计师 · W27D01 · 动画版 · 锁 vA-final
content_id: W27D01
topic_id: W27-D01

voice:
  engine: minimax            # 喜剧/拟人语气，minimax 表现力优于 edge
  model: speech-2.8-turbo
  voice_id: male-qn-jingying-jingpin   # 20年互联网人设：自信、带点调侃
  speed: 1.0                 # 动画喜剧节奏，略快不拖
  pitch: 0
  emotion: happy             # 调侃/得意，非平铺；吵架镜可后期叠角色音效
  script_path: publish/2026-W27/D01-AI团队出片/scripts/script_three_versions.md   # 取 vA-final 段

bgm:
  mood: upbeat               # 轻快诙谐，配吵架喜剧；非 tension
  source: bgm/               # 选轻快办公室/喜剧节奏曲（render 前定具体文件）
  volume: 0.10
  fade_in_s: 1.0
  fade_out_s: 2.0
  loop: true
  benchmark_ref: "参考2·本号41.4%完播(过程展示型,轻节奏不压人声)"
  hook_0_3s: "第1节奏点对齐'一行字砸进群'的字落'啪';不压人声"
  notes: |
    情绪曲线:钩子(顿)→吵架(密集俏皮鼓点/打闹音效)→协同(节奏收束上扬)→对比(轻顿)→自证CTA(收尾上扬)。
    吵架镜可叠角色拟声(嘟囔/争抢),但不盖VO。

sfx:
  - "0-3s 字落:啪 + 群体'嗯?'"
  - "3-12s 吵架:气泡弹出'啵'×5、轻打闹"
  - "12-20s 协同:进度条齐满'唰'一声收束"
  - "34s 交片:'叮'完成音"

subtitles:
  srt_path: publish/2026-W27/D01-AI团队出片/design/sub_va.srt   # render 前由 vA-final 生成
  burn: true
  style: 主画面叠字,前3s大字钩子,角色气泡与旁白字幕分层不打架
  hook_first_3s: true

outputs:
  video_raw: publish/2026-W27/D01-AI团队出片/douyin/video_raw.mp4
  video_publish: publish/2026-W27/D01-AI团队出片/douyin/video_with_bgm.mp4   # 默认外发
  vo_mp3: publish/2026-W27/D01-AI团队出片/douyin/vo.mp3

qc:
  - VO 清晰可辨,BGM/SFX 不盖人声(人工听 30s)
  - 前 3s 钩子字幕可见,与 hook_benchmark 停划设计一致
  - 0-3s BGM 入点不抢戏,节奏点对齐字落
  - 吵架角色音效不淹没旁白 VO
  - 外发使用 video_with_bgm.mp4,非 raw

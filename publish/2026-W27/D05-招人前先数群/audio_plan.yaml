content_id: W27D05
title: 老板让我帮他招人回客户消息我让他先看 3 个月群记录 数完那天他说不用招了
duration_s: 40

vo:
  provider: minimax
  voice: 真诚青年       # 对齐 D03/D04 选用音色
  speed: 1.0
  volume: 1.0
  segments:
    - id: s1
      t_start: 0.0
      t_end: 3.0
      text: "有个母婴店老板上个月跟我说,得招个人专门回客户消息。"
      emotion: 平静(陈述)
    - id: s2
      t_start: 3.0
      t_end: 6.0
      text: "我说,先别招。"
      emotion: 平静(坚定)
    - id: s3
      t_start: 6.0
      t_end: 12.0
      text: "我让她把 90 天微信群聊天记录,全部导出来,贴给 AI。归类、统计、出表。"
      emotion: 平静(教学)
    - id: s4
      t_start: 12.0
      t_end: 22.0
      text: "1200 多条客户问题,真不一样的就 10 来类。前 5 类:营业时间、价格、改约、产品适用、退换。占了 7 成多。"
      emotion: 平静(揭数据)
    - id: s5
      t_start: 22.0
      t_end: 28.0
      text: "她看完柱图沉默了三秒。当晚发群:招人推迟,先做个表。"
      emotion: 沉稳(戏剧锚)
    - id: s6
      t_start: 28.0
      t_end: 33.0
      text: "你不是缺人,你是缺数据。"
      emotion: 坚定(内核)
    - id: s7
      t_start: 33.0
      t_end: 40.0
      text: "评论扣'也想数',我把数法和 Excel 模板发你。凑 10 个发模板。"
      emotion: 平静(收束)

bgm:
  path: 我曾经的丫头.mp3      # 项目默认 BGM,慢节奏适配反转 + 教学叙事
  volume: 0.08              # 不抢 VO(对齐 D03/D04 0.08)
  fade_in_s: 1.5
  fade_out_s: 2.0

subtitle:
  mode: html_overlay         # ffmpeg 无 libass,走 HTML 帧 overlay
  template: d05_subtitles.html
  font: 黑体粗体,描边白底黑字
  position: 底部(避开大字钩子区)
  dedup: true                # 复用 __contentKey 优化

mix:
  vo_first: true
  voice_volume: 1.0
  music_volume: 0.08

srt_file: design/sub_va.srt

hook: "招人这件事,我建议你先别招"
trust_anchor: 真实微信群消息瀑布 + 真实微信导出步骤录屏 + 老板群截图常驻"示意/已脱敏"水印

red_lines:
  - "1200 多 / 10 来类 / 7 成多" 用区间口语化,不出绝对数字
  - 老板群截图右上角常驻"示意 / 已脱敏",头像 emoji 替代
  - 不出现具体店名 / 老板真实姓名 / 手机号
  - 不卖 AI 客服 / 自动应答(与 D02 dy 同质红线)
  - 强调红用血红 `#e53935`,禁 `#ff5252`,禁 Dracula 紫/粉/青
  - 不用"100% / 99% / 全部 / 最高"绝对化用语


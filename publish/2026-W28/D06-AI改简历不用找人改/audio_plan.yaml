# 6. QC 清单
# ─────────────────────────────────────
qc:
  vo:
    - VO 覆盖 实发 ~92% ≥85% ✓
    - 无 3s+ 死区 (VO 留空段由扫描/点亮/清单视觉 + sfx 撑)
    - loudnorm -16 dB
    - TTS 前置估算已过 (利用率 83.6% PASS)
    - 真实性: VO 全"HR 视角/方法性" · 无第一人称"我做过 HR"
  bgm:
    - BGM off · 外发 `_no_bgm` 后缀 · 非预览件
  sfx:
    - sfx.enabled=true · 31 事件全走 assets/sfx/ 真 CC0 wav · 禁合成
    - gain_db 全在 [-8, -22]
    - 每场景切换有 whoosh 或 hit · VO ducking hit 不 duck
  subtitles:
    - pipeline 生 SRT/ASS + ffmpeg-full libass 烧片
    - 双平台字号 抖音 42 / xhs 50
  outputs:
    - 抖音 video_no_bgm.mp4 + xhs 7 页轮播
    - 未用真实竞品 logo · 未用合成 BGM/sfx
    - 简历用化名「示例·化名·陈默」标注


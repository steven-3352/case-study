# ─────────────────────────────────────
# 1. 配音 (Voice) · MiniMax speech-2.8-turbo
# ─────────────────────────────────────
voice:
  engine: minimax
  model: speech-2.8-turbo
  voice_id: male-qn-jingying-jingpin
  voice_id_rationale: |
    D06 skin.tone「HR 视角过来人 · 方法性表述 · 不打鸡血 · 禁逆袭/名企 offer」
    → 沉稳男声匹配"站在 HR 那侧帮你看"的克制专业感
    male-qn-jingying-jingpin 稳、非博主感 · 与 D04/D05 一致 voice_id (人设连贯)
    真实性红线: VO 全程"方法性/HR 视角"表述 · 不第一人称"我做过 HR/面试过很多人"
  备选路线:
    - 1_female_recording: 若投后测出女性求职受众更强
    - 2_user_real_recording: 首选升级 · 消 AI 音色 gap · 若用户愿录
  ai_voice_gap_note: |
    memory feedback_ai-voice-known-gap: D06 属演示型 (扫描线/表格/清单占多数时长)
    AI 音色 gap 影响面小 · 触发切人声: 投后"AI 味太重" >15% 或 用户愿录

  speed: 1.08
  pitch: 0
  emotion: neutral
  script_path: publish/2026-W28/D06-AI改简历不用找人改/scripts/vA.md
  script_backup_path: publish/2026-W28/D06-AI改简历不用找人改/scripts/vB.md
  loudnorm:
    target: -16
    LRA: 11
    TP: -1.5

  # VO segments 逐段 (对齐 pipeline_config.tts.segments · estimate_duration 已过)
  segments:
    - {m: M1, sid: s1, time_range: [0.0, 3.0],   text: "投了几百份简历，全是已读不回。", est_s: 3.08}
    - {m: M2, sid: s2, time_range: [3.0, 8.0],   text: "多半不是简历差，是没被看到。花钱找人改，照样没面试。", est_s: 4.81}
    - {m: M3, sid: s3, time_range: [8.0, 14.0],  text: "HR 初筛一份简历只有几秒。我用 AI 站在 HR 那侧，替你先扫一遍。", est_s: 5.19}
    - {m: M4, sid: s4, time_range: [14.0, 17.5], text: "多半是这三处，HR 根本没看到。", est_s: 2.89}
    - {m: M5, sid: s5, time_range: [17.5, 25.5], text: "第一，求职意向空着，HR 定位不了你要哪个岗，直接划走。改成写死岗位加到岗时间。", est_s: 7.04}
    - {m: M6, sid: s6, time_range: [25.5, 34.0], text: "第二，全是负责、配合，没数字。这样改：负责社群运营，改成从 0 搭 3000 人、转化涨 40%。", est_s: 7.96}
    - {m: M7, sid: s7, time_range: [34.0, 42.5], text: "第三，机器先筛关键词。要的词没写，简历没到 HR 就被刷。照招聘描述补上。", est_s: 6.30}
    - {m: M8, sid: s8, time_range: [42.5, 49.0], text: "同一段经历，这三处一改，HR 扫到的完全是两回事。", est_s: 4.26}
    - {m: M9, sid: s9, time_range: [49.0, 54.5], text: "被看到，是不花钱的第一步。数字填真的，别编。", est_s: 4.00, speed: 1.10}
    - {m: M10, sid: s10, time_range: [54.5, 60.0], text: "私信『发我简历』，脱敏就行，我用 HR 视角帮你圈重点。", est_s: 4.63}

  duration_pre_check:
    required: true
    status: PASS
    tool: pipeline/tts/estimate_duration.py
    run_command: python3 pipeline/tts/estimate_duration.py --config publish/2026-W28/D06-AI改简历不用找人改/pipeline_config.yaml
    result: "10 段全 ✓ · warn 0 · fail 0 · 预测总长 50.16s · 利用率 83.6% PASS · 实发预估 55.18s (~92% 覆盖 ≥85%)"

# ─────────────────────────────────────
# 2. BGM · 默认无
# ─────────────────────────────────────
bgm:
  enabled: false
  mood: none
  reason: |
    D06 属**密 VO 演示型 · 简历纸面文档场景**:
    - VO 实发覆盖 ~92% ≥ 85% 硬门
    - M3 扫描线 / M6 对照卡 / M7 ATS 点亮 / M8 清单卡 = 收藏动机镜 · BGM 会稀释权威感
    - 参考 WaytoAGI / 七七 / 浙大猫学长 同类演示型均无 BGM
    - 外发命名 *_no_bgm.mp4 (直接外发 · 非"预览件")
  future_upgrade_trigger:
    - metric: M2 段位 (3-8s) 停留率 <45%
      action: 评估 M2-M3 加极轻 lo-fi ambient (volume ≤0.05 · 无鼓点)
      restriction: 用户提供 mp3 或剪映自带库 · 禁合成
  global_if_enabled:
    max_volume: 0.08
    duck_on_vo: true
    forbidden: [ffmpeg合成假BGM, 版权音乐, EDM高亢营销BGM]

# ─────────────────────────────────────
# 3. sfx 音效层 (视频硬门 · BGM off 但 sfx 不 off · 全走真素材)
# ─────────────────────────────────────
sfx:
  enabled: true
  formula_check:
    ambient_bed: true
    riser_before_hit: true   # M10 CTA 前用 riser
    hit_on_key_moment: true
  formula_note: |
    「ambient + whoosh + hit + tick + riser」· 全部 assets/sfx/ 真 CC0 wav
    D06 特色: 戳章 hit (M1) + 三框 whoosh×3 (M4) + ✕→✓ 角标 tick×3 错开 0.2s (M8) + 深落 hit (M9) + CTA riser (M10)
  gain_ref_db: -12
  gain_range_db: [-8, -22]

  events:
    # M1 (0-3s · 戳章 chaos + 计数滚 + 大字入)
    - {sid: sfx01, kind: ambient, t_start: 0.0, duration: 60.0, gain_db: -22, src_rel: assets/sfx/ambient/office_daylight_room_tone.wav, note: "全片办公室安静 ambient 铺底 · loop 若 <60s"}
    - {sid: sfx02, kind: hit, t_start: 0.3, duration: 0.3, gain_db: -8, src_rel: assets/sfx/hit/impact_hard_cut.wav, note: "M1 已读不回红戳砸下"}
    - {sid: sfx03, kind: tick, t_start: 0.6, duration: 0.15, gain_db: -12, src_rel: assets/sfx/tick/subtle_ui_tap_soft.wav, note: "M1 投递计数滚 1"}
    - {sid: sfx04, kind: tick, t_start: 0.9, duration: 0.15, gain_db: -12, src_rel: assets/sfx/tick/subtle_ui_tap_soft.wav, note: "M1 投递计数滚 2"}
    - {sid: sfx05, kind: hit, t_start: 1.2, duration: 0.3, gain_db: -8, src_rel: assets/sfx/hit/impact_soft_boom.wav, note: "M1 巨标『投了很多份·已读不回』入"}

    # M2 (3-8s · 账单拍桌 + 反差大字白闪)
    - {sid: sfx06, kind: whoosh, t_start: 3.0, duration: 0.4, gain_db: -10, src_rel: assets/sfx/whoosh/whoosh_transition_soft.wav, note: "M1→M2 转场"}
    - {sid: sfx07, kind: hit, t_start: 3.3, duration: 0.4, gain_db: -8, src_rel: assets/sfx/hit/impact_soft_boom.wav, note: "M2 ¥3888 账单拍桌 + 『不是文笔』白闪拍点"}

    # M3 (8-14s · 扫描线连续 · 停 6 点 tick)
    - {sid: sfx08, kind: whoosh, t_start: 8.0, duration: 0.4, gain_db: -10, src_rel: assets/sfx/whoosh/whoosh_air_pass.wav, note: "M3 扫描线启动 whoosh"}
    - {sid: sfx09, kind: tick, t_start: 9.0, duration: 0.15, gain_db: -14, src_rel: assets/sfx/tick/metronome_soft_tick.wav, note: "M3 扫描停点 1"}
    - {sid: sfx10, kind: tick, t_start: 10.0, duration: 0.15, gain_db: -14, src_rel: assets/sfx/tick/metronome_soft_tick.wav, note: "M3 扫描停点 2"}
    - {sid: sfx11, kind: tick, t_start: 11.0, duration: 0.15, gain_db: -14, src_rel: assets/sfx/tick/metronome_soft_tick.wav, note: "M3 扫描停点 3"}
    - {sid: sfx12, kind: tick, t_start: 12.0, duration: 0.15, gain_db: -14, src_rel: assets/sfx/tick/metronome_soft_tick.wav, note: "M3 扫描停点 4"}

    # M4 (14-17.5s · 三框逐个弹)
    - {sid: sfx13, kind: whoosh, t_start: 14.3, duration: 0.3, gain_db: -11, src_rel: assets/sfx/whoosh/whoosh_swipe_fast.wav, note: "M4 高亮框 ① 弹"}
    - {sid: sfx14, kind: whoosh, t_start: 14.7, duration: 0.3, gain_db: -11, src_rel: assets/sfx/whoosh/whoosh_swipe_fast.wav, note: "M4 高亮框 ② 弹"}
    - {sid: sfx15, kind: whoosh, t_start: 15.1, duration: 0.3, gain_db: -11, src_rel: assets/sfx/whoosh/whoosh_swipe_fast.wav, note: "M4 高亮框 ③ 弹"}

    # M5 (17.5-25.5s · before/after 分屏 · after 绿✓)
    - {sid: sfx16, kind: whoosh, t_start: 17.5, duration: 0.4, gain_db: -10, src_rel: assets/sfx/whoosh/whoosh_transition_soft.wav, note: "M5 after 右框滑入"}
    - {sid: sfx17, kind: hit, t_start: 21.0, duration: 0.2, gain_db: -10, src_rel: assets/sfx/hit/check_tick_soft.wav, note: "M5 after 绿✓ 打钩"}

    # M6 (25.5-34s · 对照句卡 ❌→✅)
    - {sid: sfx18, kind: hit, t_start: 26.0, duration: 0.25, gain_db: -10, src_rel: assets/sfx/hit/cross_click_error.wav, note: "M6 ❌负责社群运营 红行显"}
    - {sid: sfx19, kind: hit, t_start: 28.5, duration: 0.2, gain_db: -9, src_rel: assets/sfx/hit/check_tick_soft.wav, note: "M6 ✅从 0 搭 3000 人 绿行滑入打钩 (收藏帧)"}

    # M7 (34-42.5s · ATS 8 格逐项点亮)
    - {sid: sfx20, kind: whoosh, t_start: 34.0, duration: 0.3, gain_db: -11, src_rel: assets/sfx/whoosh/whoosh_air_pass.wav, note: "M7 认知锚『机器先筛』入"}
    - {sid: sfx21, kind: tick, t_start: 35.5, duration: 0.15, gain_db: -13, src_rel: assets/sfx/tick/subtle_ui_tap_soft.wav, note: "M7 ATS 格点亮串 1"}
    - {sid: sfx22, kind: tick, t_start: 36.5, duration: 0.15, gain_db: -13, src_rel: assets/sfx/tick/subtle_ui_tap_soft.wav, note: "M7 ATS 格点亮串 2"}
    - {sid: sfx23, kind: tick, t_start: 37.5, duration: 0.15, gain_db: -13, src_rel: assets/sfx/tick/subtle_ui_tap_soft.wav, note: "M7 ATS 格点亮串 3"}
    - {sid: sfx24, kind: hit, t_start: 39.0, duration: 0.3, gain_db: -9, src_rel: assets/sfx/hit/check_tick_soft.wav, note: "M7 匹配度 8/8 全亮拍点"}

    # M8 (42.5-49s · 三角标 ✕→✓ 错开 0.2s)
    - {sid: sfx25, kind: hit, t_start: 43.0, duration: 0.2, gain_db: -10, src_rel: assets/sfx/hit/check_tick_soft.wav, note: "M8 角标 ① ✕→✓"}
    - {sid: sfx26, kind: hit, t_start: 43.2, duration: 0.2, gain_db: -10, src_rel: assets/sfx/hit/check_tick_soft.wav, note: "M8 角标 ② ✕→✓ (错开 0.2s)"}
    - {sid: sfx27, kind: hit, t_start: 43.4, duration: 0.2, gain_db: -10, src_rel: assets/sfx/hit/check_tick_soft.wav, note: "M8 角标 ③ ✕→✓ (错开 0.2s)"}

    # M9 (49-54.5s · 价值锚深落)
    - {sid: sfx28, kind: hit, t_start: 49.3, duration: 0.5, gain_db: -8, src_rel: assets/sfx/hit/impact_deep_resonance.wav, note: "M9『被看到』价值锚深长 hit 落地"}

    # M10 (54.5-60s · CTA riser + 收尾)
    - {sid: sfx29, kind: riser, t_start: 54.5, duration: 0.5, gain_db: -11, src_rel: assets/sfx/riser/riser_short_ascending.wav, note: "M10 CTA 浮入 riser"}
    - {sid: sfx30, kind: hit, t_start: 55.0, duration: 0.4, gain_db: -8, src_rel: assets/sfx/hit/impact_soft_boom.wav, note: "M10 CTA『私信发我简历』落地"}
    - {sid: sfx31, kind: hit, t_start: 59.3, duration: 0.5, gain_db: -8, src_rel: assets/sfx/hit/impact_soft_boom.wav, note: "M10 收尾拍点 · fade-out 500ms"}

  stats:
    ambient_count: 1   # sfx01
    tick_count: 9      # sfx03-04(M1) + sfx09-12(M3) + sfx21-23(M7)
    whoosh_count: 7    # sfx06(M2) + sfx08(M3) + sfx13-15(M4) + sfx16(M5) + sfx20(M7)
    hit_count: 13      # sfx02,05(M1) + sfx07(M2) + sfx17(M5) + sfx18-19(M6) + sfx24(M7) + sfx25-27(M8) + sfx28(M9) + sfx30-31(M10)
    riser_count: 1     # sfx29(M10)
    total_events: 31

  vo_ducking:
    enabled: true
    ducking_amount_db: -6
    ducking_attack_ms: 100
    ducking_release_ms: 300
    scope: [ambient, tick, whoosh, riser]  # hit 不 duck
    tool: pipeline/p004_video/lib/sfx.py mix_sfx_with_vo (amix + alimiter=0.9 防削顶)

# ─────────────────────────────────────
# 4. 字幕 · pipeline 自动烧 (双平台字号差异)
# ─────────────────────────────────────
subtitles:
  burn: true
  burn_engine: /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg
  burn_engine_reason: 系统 ffmpeg 无 libass · full 版含 libass
  platform_font_sizes:
    douyin: 42pt
    xhs: 50pt
  hook_first_3s: true
  hook_at: 0.3
  vo_align: true
  static_vs_drawtext_split:
    static_png_ui:
      - M1 简历纸 + 已读不回红戳 + 投递计数 (UI 内容)
      - M3 化名简历卡 + 扫描带 + 6 打点
      - M5 before/after 分屏底图 (化名·打码)
      - M6 对照句卡框
      - M7 ATS 8 格结构
      - M8 竖向清单卡结构 + ✕→✓ 角标
    drawtext_fast_switch:
      - M1 巨标 90pt「投了很多份·已读不回」
      - M2 巨标 96pt「不是文笔」+ 副 40pt
      - M3 顶部 40pt「HR 视角·只有几秒」
      - M4 段标 72pt「这 3 处·根本没看到」
      - M5 段标 60pt「第一 · 求职意向」+ 44pt 绿对照
      - M6 段标 56pt + 46pt 绿「从 0 搭 3000 人·转化+40%」
      - M7 认知锚 40pt + 段标 56pt
      - M8 巨标 72pt「三处一改·两回事」
      - M9 96pt「被看到」+ 64pt 绿 + 32pt 灰边界
      - M10 CTA 84pt + 42pt 填空模板


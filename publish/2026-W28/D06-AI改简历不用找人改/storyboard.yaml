# ─────────────────────────────────────
# 视觉变化密度自查 (每 2-4s 必变 · 北极星强观赏性)
# ─────────────────────────────────────
visual_change_density:
  check: pass
  detail: |
    0-3 戳章砸+计数滚+光标划 → 3-8 账单弹+白闪 → 8-14 扫描线连续动 →
    14-17.5 三框弹 → 17.5-25.5 分屏滑入 → 25.5-34 对照句滑 → 34-42.5 ATS 逐项点亮 →
    42.5-49 清单+角标错开 → 49-54.5 大字淡入 → 54.5-60 CTA 浮入+模板闪
    无 >3s 静止死区 (VO 留空段由扫描/点亮/清单视觉 + sfx 撑)

form_species: [戳章快切, 反差大字, 扫描线, 高亮预告, before/after分屏, 对照句卡, ATS点亮, 竖向清单卡, 价值锚, 填空模板]
species_count: 10镜9形态

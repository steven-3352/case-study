# 分镜表 · storyboard.yaml · W28D06 AI 改简历不用找人改
# 工种: 导演(执行) + 摄像/视觉 · 对齐 motion_storyboard.md + form_strategy.md + pipeline_config.yaml
# 形态: 抖音演示型视频 · 60s · 简历纸面 + HR 扫描线 + before/after · 纯文档 UI (无真人 broll)
# H6 差异化 (vs D05): 暖白纸面 vs 全黑卧室 · 扫描线/分屏/对照卡/清单卡 vs 三层堆叠 · 无 broll vs 睡姿桌面
#
# TTS 前置估算已过: 10 段全 ✓ · 预测总长 50.16s · 利用率 83.6% PASS · 实发预估 55.18s (~92% 覆盖)
# 门禁: content pass_dual(A91.7/B91.35) · form pass_dual(A92/B91.7) · motion pass_single

content_id: W28D06
total_dur: 60.0
canvas: [1080, 1920]

design_refs:
  palette: design/design_language.md   # 纸面 #f5f0e6 · 血红 #e53935 · 绿 #2e7d32 · 琥珀 #d98c00
  forbidden: ["#bd93f9", "#ff79c6", "#8be9fd", "#ff5252", "linear-gradient 蓝紫端"]

scenes:
  - m: M1
    name: 简历盖戳 chaos
    time: [0.0, 3.0]
    ui_png: build/assets_ui/01_m1_stamp.png
    visual: 简历纸铺满 + 红「已读不回」戳章 0.2s 砸下 + 右上投递计数滚动 + HR 光标 0.8s 划过即关
    vo: "投了几百份简历，全是已读不回。"
    drawtext: 巨标 90pt 血红「投了很多份·已读不回」(保守口径不喊具体数字)
    data_lever: completion_3s
    note: 前 3s 停划钩 · 戳章+计数命中"投了没回音"焦虑

  - m: M2
    name: 账单 punch
    time: [3.0, 8.0]
    ui_png: build/assets_ui/02_m2_bill.png
    visual: 账单 UI「简历修改服务 ¥3888」拍到桌面 + 简历仍盖戳
    vo: "多半不是简历差，是没被看到。花钱找人改，照样没面试。"
    drawtext: 巨标 96pt「不是文笔」+ 副 40pt「花钱改·照样没面试」
    data_lever: completion_3s
    note: 二次焦虑 + 认知缺口("不在文笔")

  - m: M3
    name: HR 扫描线
    time: [8.0, 14.0]
    ui_png: build/assets_ui/03_m3_resume_scan.png
    visual: 简历卡 + HR 琥珀扫描线自上而下 · 停 6 区域打点 · ease-in-out 缓动 (非匀速) · ≥8 帧/30fps
    vo: "HR 初筛一份简历只有几秒。我用 AI 站在 HR 那侧，替你先扫一遍。"
    drawtext: 顶部 40pt 琥珀「HR 视角·只有几秒」
    data_lever: 理解(视角切换)
    note: 具象化 HR 怎么看简历 · 纯 CSS 帧 baked 进 PNG (静态呈现扫描带 + 6 点)

  - m: M4
    name: 三处预告
    time: [14.0, 17.5]
    ui_png: build/assets_ui/04_m4_preview.png
    visual: 简历卡 + 三处高亮框依次弹 (意向/成果/关键词区) · 红虚线描边 · 序号①②③
    vo: "多半是这三处，HR 根本没看到。"
    drawtext: 段标 72pt 血红「这 3 处·根本没看到」
    data_lever: completion_rate
    note: 悬念埋点拉完播

  - m: M5
    name: 第一处 求职意向 (唯一 before/after 分屏)
    time: [17.5, 25.5]
    ui_png: build/assets_ui/05_m5_split_intent.png
    visual: 左 before 意向空/灰暗(红圈"意向？") → 右 after「新媒体运营·2 周到岗」绿✓ 滑入
    vo: "第一，求职意向空着，HR 定位不了你要哪个岗，直接划走。改成写死岗位加到岗时间。"
    drawtext: 段标 60pt「第一 · 求职意向」+ 底 44pt 绿「写死岗位 + 到岗时间」
    data_lever: 理解 + 收藏
    note: 第一处硬伤 · 可对照照改

  - m: M6
    name: 第二处 成果数字 (居中对照句卡 · 破分屏)
    time: [25.5, 34.0]
    ui_png: build/assets_ui/06_m6_compare_card.png
    visual: 居中单卡 · ❌红行「负责社群运营」→ ✅绿行「从 0 搭 3000 人·转化+40%」滑入 · 数字放大
    vo: "第二，全是负责、配合，没数字。这样改：负责社群运营，改成从 0 搭 3000 人、转化涨 40%。"
    drawtext: 段标 56pt「第二 · 全是职责·没数字」+ 底 46pt 绿「从 0 搭 3000 人·转化+40%」
    data_lever: 收藏(可截图)
    note: 最强收藏帧 · 可截图照抄句式 · 破分屏惯性

  - m: M7
    name: 第三处 ATS 关键词
    time: [34.0, 42.5]
    ui_png: build/assets_ui/07_m7_ats.png
    visual: ATS 关键词匹配表 0/8 → 8/8 逐项点亮(错开 0.15s) + 匹配度数字跳动 + 前置 0.5s 认知锚
    vo: "第三，机器先筛关键词。要的词没写，简历没到 HR 就被刷。照招聘描述补上。"
    drawtext: 前 1s 40pt 琥珀「机器先筛·人再看」→ 段标 56pt「第三 · 关键词·机器先卡」
    data_lever: 理解(机制揭秘)
    note: 揭秘 ATS 机制(多数人不知) · 异形态防同质

  - m: M8
    name: 三改一屏 (竖向清单卡 · 破分屏)
    time: [42.5, 49.0]
    ui_png: build/assets_ui/08_m8_checklist.png
    visual: 竖向三改清单卡 (意向/成果/关键词) · 三角标 ✕→✓ 错开 0.2s 弹入 (非同时)
    vo: "同一段经历，这三处一改，HR 扫到的完全是两回事。"
    drawtext: 巨标 72pt 血红「三处一改·两回事」
    data_lever: completion_rate + 收藏
    note: 收束三处为一屏 · 收藏点

  - m: M9
    name: 价值锚 + 边界
    time: [49.0, 54.5]
    ui_png: build/assets_ui/09_m9_anchor.png
    visual: 纸面底 + 价值锚大字 fade-in + 底部小字边界
    vo: "被看到，是不花钱的第一步。数字填真的，别编。"
    drawtext: display 96pt「被看到」+ 64pt 绿「是不花钱的第一步」+ 32pt 灰「数字填你真的·别编」
    data_lever: 评论(去焦虑共鸣)
    note: 去焦虑 + 真实性边界(防翻车)

  - m: M10
    name: CTA + 填空模板
    time: [54.5, 60.0]
    ui_png: build/assets_ui/10_m10_cta.png
    visual: CTA 浮动大字 + 填空模板卡「把〔职责〕改成〔量化结果〕」〔〕高亮闪 + 私信箭头
    vo: "私信『发我简历』，脱敏就行，我用 HR 视角帮你圈重点。"
    drawtext: CTA 84pt 血红「私信『发我简历』」+ 42pt 纸白「把〔职责〕改成〔量化结果〕」
    data_lever: 私信转化 + 收藏
    note: 私信转化 + 填空模板可收藏


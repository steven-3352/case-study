# W28D06 pipeline_config.yaml · config-driven flow (memory: p004-lib-config-driven)
# 用途：python3 pipeline/p004_video/run_pipeline.py --config <this> --step {vo|preview|platforms|all}
#       UI PNG 另跑 gen_ui_w28d06.py (run_pipeline 不管 ui step)
# ⚠ 不覆盖已 render 的 mp4；如要再跑，先 mv build/ build_bak/
#
# 依赖对齐:
#   - audio_plan.yaml (voice_id=male-qn-jingying-jingpin · base_speed=1.08 · emotion=neutral · BGM off · sfx ~24 events)
#   - storyboard.yaml (10 段 M1-M10 · 60s · 简历纸面 + HR 扫描线 + before/after · 纯文档 UI 无 broll)
#   - form_strategy.md (pass_dual_review A92/B91.7 · 6 硬门全过 · 10 镜 9 形态)
#   - motion_storyboard.md (pass_single_run · 无 GSAP · 扫描线纯 CSS 帧)
#
# H6 差异化 (vs D05): 暖白纸面 #f5f0e6 vs D05 全黑卧室 · 扫描线/分屏/对照卡/清单卡 vs 三层堆叠 · 无真人 broll
#
# 溢出策略 (VO 已按 导演 cut 精简 · estimate_duration.py 校验 ≤10% + 总利用率 <90%):
#   - vA 原稿 10 段总估 ~73s → 导演 cut 精简框架保 3 处硬伤锚 (意向/成果数字/关键词) → 目标 ≤54s
#   - target_total_cap 60s (抖音上限)

content_id: W28D06

paths:
  root_rel: publish/2026-W28/D06-AI改简历不用找人改

ffmpeg:
  crf: 20

# ─────────────────────────────────────
# TTS 段落 (对齐 audio_plan.yaml.voice.segments)
# base_speed 1.08 · target_total_cap 60s · estimate_duration.py 检查利用率 <90%
# ─────────────────────────────────────
tts:
  voice_id: male-qn-jingying-jingpin
  base_speed: 1.08
  target_total_cap: 60.0
  segments:
    # ═══ M1 · 0-3s · 冲突钩 (简历盖戳 + 已读不回) ═══
    - sid: s1
      target_start: 0.0
      target_dur: 3.0
      emotion: neutral
      speed: 1.08
      text: "投了几百份简历，全是已读不回。"
      tail_pad: 0.15

    # ═══ M2 · 3-8s · 反差 punch (花钱改也没用 · 认知缺口) ═══
    - sid: s2
      target_start: 3.0
      target_dur: 5.0
      emotion: neutral
      speed: 1.08
      text: "多半不是简历差，是没被看到。花钱找人改，照样没面试。"
      tail_pad: 0.15

    # ═══ M3 · 8-14s · HR 视角机制 (扫描线) ═══
    - sid: s3
      target_start: 8.0
      target_dur: 6.0
      emotion: neutral
      speed: 1.08
      text: "HR 初筛一份简历只有几秒。我用 AI 站在 HR 那侧，替你先扫一遍。"
      tail_pad: 0.15

    # ═══ M4 · 14-17.5s · 预告三处 ═══
    - sid: s4
      target_start: 14.0
      target_dur: 3.5
      emotion: neutral
      speed: 1.08
      text: "多半是这三处，HR 根本没看到。"
      tail_pad: 0.15

    # ═══ M5 · 17.5-25.5s · 第一处 求职意向 (before/after 分屏) ═══
    - sid: s5
      target_start: 17.5
      target_dur: 8.0
      emotion: neutral
      speed: 1.08
      text: "第一，求职意向空着，HR 定位不了你要哪个岗，直接划走。改成写死岗位加到岗时间。"
      tail_pad: 0.15

    # ═══ M6 · 25.5-34s · 第二处 成果数字 (对照句卡 · 收藏点) ═══
    - sid: s6
      target_start: 25.5
      target_dur: 8.5
      emotion: neutral
      speed: 1.08
      text: "第二，全是负责、配合，没数字。这样改：负责社群运营，改成从 0 搭 3000 人、转化涨 40%。"
      tail_pad: 0.15

    # ═══ M7 · 34-42.5s · 第三处 ATS 关键词 ═══
    - sid: s7
      target_start: 34.0
      target_dur: 8.5
      emotion: neutral
      speed: 1.08
      text: "第三，机器先筛关键词。要的词没写，简历没到 HR 就被刷。照招聘描述补上。"
      tail_pad: 0.15

    # ═══ M8 · 42.5-49s · 三改一屏收束 (清单卡) ═══
    - sid: s8
      target_start: 42.5
      target_dur: 6.5
      emotion: neutral
      speed: 1.08
      text: "同一段经历，这三处一改，HR 扫到的完全是两回事。"
      tail_pad: 0.15

    # ═══ M9 · 49-54.5s · 价值锚 + 边界 ═══
    - sid: s9
      target_start: 49.0
      target_dur: 5.5
      emotion: neutral
      speed: 1.10
      text: "被看到，是不花钱的第一步。数字填真的，别编。"
      tail_pad: 0.20

    # ═══ M10 · 54.5-60s · CTA + 填空模板 ═══
    - sid: s10
      target_start: 54.5
      target_dur: 5.5
      emotion: neutral
      speed: 1.08
      text: "私信『发我简历』，脱敏就行，我用 HR 视角帮你圈重点。"
      tail_pad: 0.25


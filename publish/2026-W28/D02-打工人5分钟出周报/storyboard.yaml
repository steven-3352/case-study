xhs_carousel:
  meta:
    canvas: [1080, 1920]
    pages: 8
    pipeline: 手工设计 · 参考 P002 尺寸（但不用报纸风）
  pages:
    - id: P1
      role: 封面
      picture: 手机锁屏「18:55·周五」 + 微信通知「老板：周报呢？」
      title: 老板 @你「周报呢」
    - id: P2
      role: 场景细节
      picture: Excel 空白周报模板 + 光标闪
      title: 你不是不想写<br>是不知道怎么在 5 分钟里编出老板信的
    - id: P3
      role: 三段痛点
      picture: 黑底 + 三段红字快切
      title: 周报难写的不是「事情多」
    - id: P4
      role: 反面
      picture: 反面 prompt 截图 + AI 通用垃圾模板
      title: 直接问「帮我写周报」<br>是最大的坑
    - id: P5
      role: 救命 prompt（收藏动机最强）
      picture: 完整黄金 prompt 五段结构（可截图直接拿走）
      title: 下班前 5 分钟的救命 prompt
    - id: P6
      role: before/after
      picture: 左原始流水账 vs 右 AI 整理后周报 · 时间戳「18:15」
      title: 你还没走神<br>周报已经出好了
    - id: P7
      role: 价值锚（可选）
      picture: 真实办公室 B-roll + 大字
      title: 不是教你写周报<br>是把我下班前 5 分钟的救命 prompt 给你
    - id: P8
      role: CTA
      picture: 空白便签 + 光标
      title: 评论你的岗位<br>我按行业发一版 prompt


    actual: M1/M2 用真实拍摄 or Pexels · 无 AI 生图
    status: pass_planned
  - promise: 屏幕录制真实
    actual: M4/M5/M6 用 QuickTime/OBS 真实录 · 无 HTML 模拟
    status: pass_planned
  - promise: SVG 打点非 GSAP
    actual: M6 五段标签 · M7 时间戳翻牌 · M9 光标 · 全用 SVG + CSS
    status: pass_planned
  - promise: 前后对比静态
    actual: M7 静态图 + SVG 数字滚动
    status: pass_planned
  - promise: ≥3 种观感
    actual: 5 种形式 ID（chaos_broll · broll_demo · punch_black · before_after · SVG 覆盖）
    status: pass_planned
  - promise: 反 AI 味
    actual: 全片无 GSAP 主视觉 · 用真实素材 + SVG 打点 · 禁 Dracula 色板
    status: pass_planned
  - promise: 不撞 W27 近作
    actual: 见 visual_originality_gate.md 6 项必答 + 5 项 must_have 全过
    status: pass_planned

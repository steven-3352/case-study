# 分镜清单 · storyboard · W28D02
# 工种：导演（执行）+ 摄像/视觉
# 依赖：form_competition.md（**回炉版 · 方案 A**）· form_strategy.md · design_language.md · retention_beat_sheet.md
# 状态：draft_self_generated · 回炉审核通过 · 2026-07-04
#
# 回炉审核（2026-07-04）：上游 form_competition 回炉，方案 A（原生 P001 混合）仍胜。
# 本文件分镜内容与决策无关，技术内容不变。
# 新增 openmontage_brief 引用：decision=blocked_infrastructure（本条不走 OpenMontage）
#
# 用于 pipeline：屏幕录制 + Pexels B-roll + SVG 覆盖，不走 pipeline/p004（本条无 GSAP）
# 不走 integrations/openmontage（brief 判定 blocked_infrastructure，待 sibling repo 到位后重评）
# 推荐流水线：pipeline/p001（半手工） 或 直接 QuickTime + DaVinci Resolve/CapCut 剪辑

meta:
  content_id: W28D02
  slug: 打工人5分钟出周报
  script_version: vA  # 本 storyboard 对应脚本 vA 场景剧强化版
  platform: douyin
  duration_s: 50
  canvas: [1080, 1920]  # 9:16
  fps: 30
  bgm_layer: 1  # 0-3s 无 BGM，3s 后 fade in

# ─────────────────────────────────────
# 抖音 50s · 9 段镜头（对应 form_strategy）
# ─────────────────────────────────────

scenes:
  - id: M1_broll_desk
    time_range: [0, 3]
    intent: 停划
    format_id: chaos_broll
    template: null
    reuse_reason: null
    visual_difference: null
    risk: null
    picture: |
      办公室广角 B-roll，傍晚窗光偏暖（3200-4000K）。
      同事拉椅子起身走人的背影（模糊焦点）。
      转场 → 工位手机屏幕特写 → 锁屏时间「18:55」。
    voiceover: null  # 沉默钉子
    subtitle:
      text: null
      style: null
    audio:
      env: 办公室环境音（远处键盘敲击最后一下 · 椅子推开声）
      bgm: none  # 0-3s 无 BGM
    assets_needed:
      - 办公室傍晚 B-roll（Pexels 关键词: office+dusk+empty+18:00）
      - 手机屏幕真实拍摄（iOS 锁屏，时间设为 18:55）
    forbidden:
      - AI 生图办公室
      - HTML 仿真手机 UI
      - 明亮日光办公室（用傍晚暖光）

  - id: M2_wechat_ping
    time_range: [3, 6]
    intent: 停划延续 + 认领
    format_id: broll_demo
    template: null
    picture: |
      手机屏幕特写延续，微信通知气泡 pop 进入：
      「老板：周报呢？」
      2-3s 处手机被翻过来放桌上 · 屏幕熄灭 · 主角手指悬空敲一下键盘又停下。
      转到电脑屏幕特写 · Excel 空白「本周工作总结」模板 · 光标闪。
    voiceover: null
    subtitle:
      text: "18:55·周五"
      style:
        font: 苹方 · display 140pt · 白色 #f5f5f0
        position: 屏幕中偏上
        appear_at: 3.0
        exit_at: 6.0
      forbidden: [emoji, 惊叹号, 红字, 霓虹色]
    audio:
      env: 办公室环境音延续
      bgm: sting_kick_single  # 3s 处沉重 kick 单击一次
    assets_needed:
      - 微信通知 pop 动画（真实微信截图或 AE 微信 UI 层）
      - Excel 空白周报模板截图
    forbidden:
      - 3D 微信气泡
      - 自造品牌蓝
      - "@全体成员" 群消息（本条是 1v1 老板私信）

  - id: M3_pain_punch
    time_range: [6, 8]
    intent: 看懂痛点
    format_id: punch_black
    template: null
    picture: |
      黑底 #0f0f0f 全屏；三段大字快切（各占 0.6s）。
      三段之间用极短白闪（0.05s）分隔。
    voiceover: |
      「周报难写，其实不是事情多。」
    subtitle:
      text_seq: ["没得写", "写不出", "占私人时间"]  # 顺序快切
      style:
        font: 苹方 · headline 96pt · 白字
        position: 屏幕中心
        each_duration: 0.6
        transition: hard_cut  # 硬切，不淡入
      forbidden: [emoji, 感叹号, 彩色底]
    audio:
      env: 无
      bgm: sfx_keyboard_stab_x3  # 三段字幕对应三下键盘敲击音
    assets_needed:
      - 键盘敲击 SFX × 3
    forbidden:
      - 卡片包围大字（大字直接放黑底）
      - 与 W27 punch_black 相同的动画（W27 是缓入缓出，本条是硬切）

  - id: M4_wrong_prompt
    time_range: [8, 12]
    intent: 常见解法反面
    format_id: broll_demo
    template: null
    picture: |
      AI 对话框（ChatGPT/豆包/Kimi 任选一种，不打 logo）。
      主角输入「帮我写周报」（1s 打字动画）。
      AI 输出通用垃圾模板（打字机效果，2s 快速掠过）。
    voiceover: |
      「大部分人都在做同一件蠢事——打开 AI 说『帮我写周报』。」
    subtitle:
      text: "帮我写周报 · 通用垃圾"
      style:
        font: 苹方 · body 40pt · 红字 accent #e53935
        position: 屏幕上方
        appear_at: 10.5
        exit_at: 12.0
      forbidden: [粉红 #ff5252]
    audio:
      env: 无
      bgm: lofi_low_tension  # 低压 lo-fi 铺底
    assets_needed:
      - AI 对话框录屏（真实录制 · 不用 HTML 模拟）
      - 通用垃圾模板文本（可 generated_fact）
    forbidden:
      - AI 生成的 AI 对话界面
      - 打 ChatGPT/OpenAI logo

  - id: M5_dump_materials
    time_range: [12, 18]
    intent: 反转开场
    format_id: broll_demo
    template: null
    picture: |
      屏幕分屏：左半屏是备忘录、微信聊天记录截图、日历截图 4 张缩略图；
      右半屏是 AI 对话框空白。
      主角逐个拖入右侧对话框（SVG 淡入淡出动画模拟拖拽 · 每张 1s）。
      6 张素材全部进入后，右侧对话框满屏文字（乱七八糟的碎片记录）。
    voiceover: |
      「关键动作不是 prompt，是把这一周乱七八糟的东西全扔进去。备忘录、微信截图、日程、群消息，越乱越好。」
    subtitle:
      text: "越乱越好"
      style:
        font: 苹方 · headline 72pt · 黄字 accent_soft #ffc857
        position: 屏幕下方
        appear_at: 16.0
        exit_at: 18.0
    audio:
      env: 无
      bgm: lofi_low_tension 延续
    assets_needed:
      - 6 张真实截图（备忘录 x1 · 微信 x2 · 日历 x1 · 邮件 x1 · 群消息 x1）
      - 内容用 generated_fact 声明为示例
    forbidden:
      - 3D 拖拽特效
      - 抠白底的假截图（保留系统状态栏）

  - id: M6_prompt_demo
    time_range: [18, 32]
    intent: 演示核心
    format_id: broll_demo + svg_overlay
    template: null
    picture: |
      AI 对话框全屏。主角逐段打入黄金 prompt（5 段结构）。
      每段打完时，SVG 覆盖层在该段左侧显示标签（角色 / 规矩 / 反例 / 兜底 / 字数）。
      标签淡入 0.3s → 停 2s → 淡出 0.3s（不做复杂 GSAP）。
      5 段全部输入后（26s 处），AI 开始输出（打字机效果 · 快进 4x · 6s 完成）。
    voiceover: |
      「然后 3 段告诉 AI 三件事：
      第一，你是职场写作助手，别整那些花的。
      第二，分三块——本周总结、下周计划、遇到的问题，每块一句话。
      第三，300 字以内，别啰嗦。
      就这三段。抄走就能用。」
      # 注：脚本 vA 是 5 段，vB 是 3 段。本 storyboard 走 vA 的 5 段版本，
      # 若用 vB 请把标签改为「1 别整花的 / 2 三块各一句话 / 3 300 字」
    subtitle:
      text_seq_svg_labels: ["角色", "规矩", "反例", "兜底", "字数"]  # vA 版本
      style:
        font: JetBrains Mono / SF Mono · caption 28pt · 黑字 #1a1a1a
        background: 淡黄底 accent_soft #ffc857 padding 8px 12px
        position: 每段 prompt 左侧
        transition: SVG 淡入 0.3 → 停 2 → 淡出 0.3
    audio:
      env: 键盘敲击（每段各 3 下）
      bgm: lofi_low_tension → lofi_uptempo  # 26s 处切换为轻快
    assets_needed:
      - QuickTime/OBS 录制 AI 对话框全过程
      - SVG 打点标签（5 个 · 静态 SVG + CSS transition · 无需 GSAP）
      - 键盘敲击 SFX
      - lo-fi BGM（用户提供 mp3 或剪映自带库 · 禁 aevalsrc 合成）
    forbidden:
      - GSAP 复杂动画
      - 高亮语法 IDE 风（用简单 SVG 打点即可）
      - 遮挡 AI 对话框主内容

  - id: M7_before_after
    time_range: [32, 40]
    intent: 前后对比
    format_id: before_after
    template: null
    picture: |
      屏幕纸黄底 #f5f5f0 全屏 · 中缝分割线。
      左：原始工作流水账（红字标注混乱：语法乱、时间乱、内容重复）。
      右：AI 整理后周报（结构化 · 分三块 · 每块简短一句）。
      顶部时间戳数字滚动：18:55 → 19:15（旧方式加班）→ 18:15（新方式收工）。
      时间戳用 SVG 数字翻牌效果（无 GSAP · 用 CSS animation）。
    voiceover: |
      「你上周花两小时写的东西，AI 5 分钟就出来了。而且你自己再看一眼——比你写的还像样。18:15 我下班，同事还在楼上改到 20 点。」
    subtitle:
      text: "18:15 收工"
      style:
        font: SF Mono · display 96pt · 黑字 #1a1a1a
        position: 屏幕右上（伴随时间戳出现）
        appear_at: 37.0
        exit_at: 40.0
    audio:
      env: 无
      bgm: lofi_uptempo 延续
    assets_needed:
      - 原始流水账文本（generated_fact 声明为示例）
      - AI 整理后周报（对应 M6 输出的实际结果）
      - SVG 数字翻牌（时间戳 3 段跳变）
    forbidden:
      - GSAP 装饰性转场
      - 卡片阴影
      - 3D 翻页效果

  - id: M8_value_anchor
    time_range: [40, 46]
    intent: 价值锚
    format_id: chaos_broll + punch_black
    template: null
    picture: |
      傍晚窗外 B-roll（Pexels 关键词: city+dusk+window+9-16）· 半透明覆盖到 40%。
      前景大字（display 120pt · 白字）居中偏下。
    voiceover: |
      「这不是我要教你什么。是我周五 18:55 救过自己无数次的东西，抄走。」
      # 注：本句是 vA 与 vB 的合并版本；vA 原句去掉「抄走」；vB 加「抄走」落点
    subtitle:
      text_2lines: ["不是教你什么", "是我救过自己的东西 · 抄走"]
      style:
        font: 苹方 · display 100pt · 白字 #f5f5f0
        position: 屏幕中下
        appear_at: 40.5
        exit_at: 46.0
    audio:
      env: 傍晚窗外远处车流白噪
      bgm: lofi_release  # 情绪释放段
    assets_needed:
      - 傍晚窗外 B-roll（Pexels 或真实拍摄）
      - 情绪释放 BGM 段
    forbidden:
      - 「打工人狂喜」类情绪词
      - 「效率革命」类口号
      - AI 生成的傍晚风景

  - id: M9_cta_note
    time_range: [46, 50]
    intent: 互动 CTA
    format_id: punch_black
    template: null
    picture: |
      纸黄底 #f5f5f0 便签特写（占屏 70%）。
      主角在便签上写字（真实拍摄手写 · 或用 mono 字体逐字打字机效果）。
      光标闪一次。
    voiceover: |
      「评论区说说你的岗位，还有你上一次因为周报加班到几点。」
      # vB 的 CTA 加了「加班到几点」共谋点，建议本 storyboard 沿用
    subtitle:
      text: "评论你的岗位<br>上次加班到几点"
      style:
        font: 苹方 · body 60pt · 黑字 #1a1a1a
        position: 屏幕中心（便签内）
        appear_at: 46.5
        exit_at: 50.0
    audio:
      env: 无
      bgm: lofi_release 尾奏 fade out
    assets_needed:
      - 纸黄底便签（真实拍摄或 SVG 简单绘制）
      - 光标闪动画（CSS keyframe · 无 GSAP）
    forbidden:
      - 亮色 CTA 按钮
      - 「点这里」箭头
      - 硬拉私信话术


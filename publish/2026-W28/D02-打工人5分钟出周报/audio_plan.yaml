# 声音方案 · audio_plan.yaml
# 工种: 声音设计师 · 视频形态必跑
# 状态: draft_self_generated · 回炉审核通过 · 2026-07-04
#
# 回炉审核（2026-07-04）：上游 form_competition 回炉，方案 A（原生 P001 混合）仍胜。
# 本文件 voice/BGM/字幕方案与决策无关，技术内容不变。
# openmontage_brief decision=blocked_infrastructure，本条不走 OpenMontage 音频链路。
#
# content_id: W28D02
# topic_id: 打工人5分钟出周报
# 依赖: scripts/vA.md（vB 备用）· storyboard.yaml · design_language.md · retention_beat_sheet.md · openmontage_brief.md

voice:
  engine: minimax
  model: speech-2.8-turbo
  voice_id: male-qn-jingying-jingpin  # 男声·精英精品：稳、克制、无表演感，匹配 skin.persona_anchor "老兵 + 同事口吻"
  # 备选：female-shaonv-luyin（女声·少女录音）如后续测试女声破圈更强
  speed: 0.95   # 微慢（同事口吻不急躁）
  pitch: 0
  emotion: neutral
  script_path: publish/2026-W28/D02-打工人5分钟出周报/scripts/vA.md
  # 若选 vB 版本改为 scripts/vB.md
  segments:
    # 0-6s 无 VO（沉默钉子）
    - time_range: [6, 12]
      text: "周报难写，其实不是事情多。是没得写、写不出、占私人时间。而大部分人都在做同一件蠢事——打开 AI 说『帮我写周报』。"
    - time_range: [12, 18]
      text: "关键动作不是 prompt，是把这一周乱七八糟的东西全扔进去。备忘录、微信截图、日程、群消息，越乱越好。"
    - time_range: [18, 32]
      text: "然后是 5 段 prompt。角色：你是职场写作助手。规矩：三块，本周总结、下周计划、问题。反例：别写『参加了会议』这种。兜底：AI 自己合理补全。字数：300 字以内。"
    - time_range: [32, 40]
      text: "2 分钟出草稿，3 分钟改。18:15 你在下班的路上，同事还在改到 20 点。京东员工的周报要 5000 字，你现在 300 字够用了。"
    - time_range: [40, 46]
      text: "这不是 AI 教程。是我周五 18:55，救过我自己无数次的 prompt。"
    - time_range: [46, 50]
      text: "评论区告诉我你什么岗位，我按行业发一版。"

bgm:
  mood: tension_to_release  # 前段紧张 → 反转后释放（对应 retention 情绪曲线）
  segments:
    # 段 1: 沉默钉子（0-3s） — 无 BGM
    - time_range: [0, 3]
      source: null
      mood: none
      note: "只有办公室环境音（远处键盘敲击最后一下 + 椅子推开声）· BGM 完全静音"

    # 段 2: 沉默钉子延续（3-6s） — 单击 sting
    - time_range: [3, 6]
      source: assets/broll/audio/sting_kick_single.wav  # 待用户提供或剪映生成
      mood: tension_sting
      volume: 0.35
      fade_in_s: 0.1
      fade_out_s: 1.5
      note: "3s 处 kick 单击一次（对应 M2 大字字幕入点『18:55·周五』）· 与钩子同拍"

    # 段 3: 痛点 + 反面（6-18s） — 低压 lo-fi
    - time_range: [6, 18]
      source: assets/broll/audio/lofi_low_tension.mp3  # 待用户提供
      mood: tension_low
      volume: 0.08   # 压人声 - 让 VO 清晰可辨
      fade_in_s: 1.0
      fade_out_s: 0.5
      note: "低沉 lo-fi 打底 · 不喧宾夺主 · 与 M3-M5 快切节奏相配"

    # 段 4: 演示核心（18-32s） — lo-fi 延续，26s 处提速
    - time_range: [18, 32]
      source: assets/broll/audio/lofi_low_tension.mp3  # 前半段
      mood: tension_low
      volume: 0.08
      switch_at: 26
      switch_to: assets/broll/audio/lofi_uptempo.mp3  # 26s 处切换（AI 开始输出）
      switch_mood: release_uptempo
      note: "18-26s 承接低压 · 26s 处 AI 出结果时切轻快 lo-fi（对应 M6 后段 · 情绪反转起点）"

    # 段 5: 前后对比 + 价值锚（32-46s） — 轻快 lo-fi
    - time_range: [32, 46]
      source: assets/broll/audio/lofi_uptempo.mp3
      mood: release_uptempo
      volume: 0.10
      note: "延续 26s 切入的轻快 · 承载 M7 对比 + M8 价值锚 · 观众情绪已经跟着 VO 释放"

    # 段 6: CTA 尾奏（46-50s） — 释放淡出
    - time_range: [46, 50]
      source: assets/broll/audio/lofi_release.mp3
      mood: release_fade
      volume: 0.08
      fade_out_s: 2.5
      note: "尾奏软收 · 让 CTA 字幕留住观众最后一眼"

  # 全局 BGM 约束
  global:
    max_volume: 0.12  # 全片 BGM 音量上限（VO 清晰优先）
    duck_on_vo: true  # VO 说话时 BGM 自动降 3dB（后期剪辑 side-chain 或人工调整）
    benchmark_ref: "参考3·抖音 AI 写周报赛道通用 hook_benchmark#agent_hypothesis"
    hook_0_3s: "0-3s 无 BGM，3s 处单击 sting，与钩子字幕同拍"
    notes: |
      情绪曲线：tension（6-26s）→ release（26-46s）→ fade（46-50s）
      与 retention_beat_sheet 曲线一致：
        钩子沉默 → 痛点压抑 → 演示反转（26s 起）→ 情感释放 → CTA 软收
    禁用: |
      - ❌ ffmpeg aevalsrc/sine/棕噪合成的假 BGM（见 memory feedback_no-synth-bgm）
      - ❌ 版权音乐（Taylor Swift/周杰伦等）· 用剪映自带库或免版权 lo-fi
      - ❌ 太浮夸的营销 BGM（"打工人狂喜" 感觉的 EDM）
      - ❌ 前 3s 有 BGM（会破坏沉默钉子效果）

subtitles:
  srt_path: publish/2026-W28/D02-打工人5分钟出周报/subtitles/vA.srt  # 待生成
  burn: true
  style: |
    主画面叠字：
      - 大字钩子（M2 M8 M9）: display 100-140pt · 苹方 900 · 白字 #f5f5f0
      - 痛点快切（M3）: headline 96pt · 白字 · 硬切
      - 反例字幕（M4）: body 40pt · 红字 accent #e53935
      - 反转字幕（M5）: headline 72pt · 黄字 accent_soft #ffc857
      - 中段字幕（M6 M7）: body 40pt · 白字
      - CTA（M9）: body 60pt · 黑字（在便签黄底上）
    前 3s: 无字幕（沉默钉子期）· 3s 处入「18:55·周五」灰白大字
  hook_first_3s: false  # 严格来说 M2 3s 处字幕入 · M1 0-3s 无字幕（差异化设计）
  hook_at: 3.0  # 字幕入点
  vo_align: true  # 字幕与 VO 逐句对齐（每 2-4s 一段字幕）

outputs:
  video_raw: publish/2026-W28/D02-打工人5分钟出周报/build/douyin_raw.mp4  # 无 BGM 工程件
  video_publish: publish/2026-W28/D02-打工人5分钟出周报/douyin/video.mp4  # 默认外发：含 BGM + 字幕
  vo_mp3: publish/2026-W28/D02-打工人5分钟出周报/build/vo_vA.mp3

qc:
  - VO 清晰可辨，BGM 不盖人声（人工听 30s · 尤其是 M6 26s 处 BGM 切换）
  - 前 3s 无 BGM · 3s 处字幕入点与 kick sting 同拍
  - 0-6s 沉默钉子期 · 环境音清晰可辨（键盘声 + 椅子声）
  - M3 6-8s 三段字幕快切 · 每段对应一下键盘敲击 SFX
  - M6 18-32s 演示核心 · SVG 打点标签淡入淡出无遮挡 VO
  - M8 40-46s 价值锚 · BGM 释放感与「救过我自己无数次」情感落点匹配
  - M9 46-50s CTA · BGM 尾奏软收 · 字幕最后一眼留住观众
  - 外发使用 video_publish · 非 video_raw
  - 未使用合成 BGM（禁 aevalsrc/sine/棕噪拼接）

# ─────────────────────────────────────
# 素材准备清单（给制作/运营）
# ─────────────────────────────────────

assets_prep:
  need_from_user:
    - name: BGM lo-fi low tension
      duration: ≥20s
      source_options: [用户提供 mp3, 剪映自带库, YouTube Audio Library, Bensound]
      style: "低压 lo-fi · 打字机+电钢琴+慢鼓点 · 无 vocal"
    - name: BGM lo-fi uptempo
      duration: ≥20s
      source_options: [同上]
      style: "轻快 lo-fi · 明亮但不吵 · 无 vocal"
    - name: BGM lo-fi release
      duration: ≥10s
      source_options: [同上]
      style: "释放淡出感 · 尾奏软收"

  sfx_can_auto_gen:
    - name: sting_kick_single
      spec: "单下沉重 kick + 微 reverb · 0.5s"
      how: "剪映自带 SFX 库搜索 kick / cinematic hit"
    - name: keyboard_stab_x3
      spec: "机械键盘敲击三下 · 每下 0.15s · 间隔 0.15s"
      how: "剪映自带 SFX 或真实录制"
    - name: env_office
      spec: "办公室环境音（远处键盘 + 椅子 + 空调低频）· 6s"
      how: "Pexels / Freesound.org 免费下载"


# ─────────────────────────────────────
# 双平台字号 (memory: feedback_pipeline-full-platform-output)
# 只做抖音 + 小红书 (视频号 stopped 2026-07-05) · xhs 主发 7 页图文轮播·此为视频兜底
# ─────────────────────────────────────
platforms:
  douyin:
    subs_size: 42
    margin_v: 200
    max_cue_chars: 32
    max_line_chars: 17
  xhs:
    subs_size: 50
    margin_v: 220
    max_cue_chars: 26
    max_line_chars: 14


# W28D07 pipeline_config.yaml · config-driven flow (memory: p004-lib-config-driven)
# 用途：python3 pipeline/p004_video/run_pipeline.py --config <this> --step {vo|preview|platforms|all}
#       UI PNG 另跑 gen_ui_w28d07.py (run_pipeline 不管 ui step)
# ⚠ 不覆盖已 render 的 mp4；如要再跑，先 mv build/ build_bak/
#
# 依赖对齐:
#   - audio_plan.yaml (voice_id=male-qn-jingying-jingpin · base_speed=1.08 · emotion=neutral · BGM off · sfx 层)
#   - motion_storyboard.md (10 段 M1-M10 · 聊天气泡 + 3 年龄段 prompt 卡 · 无 broll · 无 GSAP)
#   - form_strategy.md (pass_dual_review · best-of-2 修 M5-M7 破同构 · 6 硬门全过)
#
# H6 差异化 (vs D06): 暖奶油 #fdf3e8 聊天气泡 vs D06 简历纸面扫描线 · AI 薄荷绿↔孩子暖橙 vs 纸白红绿
#
# 合规锁 (fact_check R1-R9): 效果只说"敢开口"非承诺 · 无金钱绝对值 · 不贬低/替代培训班 · 无第一人称英语老师
#
# 溢出策略 (estimate_duration.py 前置校验 · 目标 estimate ≤52s → 实发 ~55-58s · cap 60):
#   - VO 已按估算器压到 ~50s (利用率 <85%) 留 MiniMax +10% buffer
#   - VO先锁: 先 --step vo 取实测 seg_timing → 再对齐 scenes/overlays → preview → platforms

content_id: W28D07

paths:
  root_rel: publish/2026-W28/D07-家长陪孩子学英语

ffmpeg:
  crf: 20

# ─────────────────────────────────────
# TTS 段落 (对齐 audio_plan.yaml.voice.segments)
# base_speed 1.08 · target_total_cap 60s · estimate_duration.py 检查利用率 <90%
# ─────────────────────────────────────
tts:
  voice_id: male-qn-jingying-jingpin
  base_speed: 1.08
  target_total_cap: 60.0
  segments:
    # ═══ M1 · 0-3.5s · 冲突钩 (孩子不敢开口·往后缩) ═══
    - sid: s1
      target_start: 0.0
      target_dur: 3.5
      emotion: neutral
      speed: 1.08
      text: "报了两年英语班，一开口孩子就往后缩。"
      tail_pad: 0.15

    # ═══ M2 · 3.5-9.5s · 反转 punch (不是又一个班·缺陪练) ═══
    - sid: s2
      target_start: 3.5
      target_dur: 6.0
      emotion: neutral
      speed: 1.08
      text: "不是不努力，缺的不是又一个班，是个能陪他瞎聊、说错不尴尬的人。"
      tail_pad: 0.15

    # ═══ M3 · 9.5-15.5s · 机制演示 (AI 当耐心陪练) ═══
    - sid: s3
      target_start: 9.5
      target_dur: 6.0
      emotion: neutral
      speed: 1.08
      text: "这事 AI 正好能干——一个不会不耐烦的陪练，随时练、说错也不批评。"
      tail_pad: 0.15

    # ═══ M4 · 15.5-18.3s · 预告三年龄段 ═══
    - sid: s4
      target_start: 15.5
      target_dur: 2.8
      emotion: neutral
      speed: 1.08
      text: "按年龄，三套现成玩法。"
      tail_pad: 0.15

    # ═══ M5 · 18.3-24.8s · 6-8岁 角色扮演 (prompt 卡①) ═══
    - sid: s5
      target_start: 18.3
      target_dur: 6.5
      emotion: neutral
      speed: 1.08
      text: "六到八岁别背单词，让 AI 陪玩角色扮演，点餐买东西，简单英语你来我往。"
      tail_pad: 0.15

    # ═══ M6 · 24.8-32.3s · 9-12岁 复述+三句话 (最强收藏·拆两拍) ═══
    - sid: s6
      target_start: 24.8
      target_dur: 7.5
      emotion: neutral
      speed: 1.08
      text: "九到十二岁，复述一段动画，再用三句话说今天。AI 先夸再纠一处，敢说错才敢开口。"
      tail_pad: 0.15

    # ═══ M7 · 32.3-39.1s · 13-15岁 单话题+影子跟读 (prompt 卡③) ═══
    - sid: s7
      target_start: 32.3
      target_dur: 6.8
      emotion: neutral
      speed: 1.08
      text: "十三到十五岁，挑个感兴趣的话题聊下去，随时纠发音语法，像影子跟读一遍。"
      tail_pad: 0.15

    # ═══ M8 · 39.1-43.1s · 价值锚 (敢开口·去焦虑) ═══
    - sid: s8
      target_start: 39.1
      target_dur: 4.0
      emotion: neutral
      speed: 1.08
      text: "每天二十分钟，重点是敢开口，不是背多少。"
      tail_pad: 0.15

    # ═══ M9 · 43.1-48.3s · 边界+信任 (陪练不替课·家长把关) ═══
    - sid: s9
      target_start: 43.1
      target_dur: 5.2
      emotion: neutral
      speed: 1.08
      text: "AI 是陪练不替课，不用报付费课，时长话题家长把关就行。"
      tail_pad: 0.15

    # ═══ M10 · 48.3-53.3s · CTA (私信孩子几岁) ═══
    - sid: s10
      target_start: 48.3
      target_dur: 5.0
      emotion: neutral
      speed: 1.08
      text: "私信『孩子几岁、学到哪一步』，我把这三套玩法发你。"
      tail_pad: 0.25


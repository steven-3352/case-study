# ─────────────────────────────────────
# 1. 配音 (Voice) · MiniMax speech-2.8-turbo
# ─────────────────────────────────────
voice:
  engine: minimax
  model: speech-2.8-turbo
  voice_id: male-qn-jingying-jingpin
  voice_id_rationale: |
    D07 skin「家长过来人视角 · 方法性表述 · 不打鸡血 · 去焦虑基调」
    → 沉稳男声匹配"一个陪孩子走过来的家长在分享方法"的克制感
    male-qn-jingying-jingpin 稳、非博主感 · 与 D04/D05/D06 一致 voice_id (人设连贯)
    真实性红线 (fact_check R7): VO 全"家长/方法性"表述 · 不第一人称"我是英语老师/我教过多少孩子"
  备选路线:
    - 1_female_recording: 若投后测出妈妈受众更认女声
    - 2_user_real_recording: 首选升级 · 消 AI 音色 gap · 若用户愿录
  ai_voice_gap_note: |
    memory feedback_ai-voice-known-gap: D07 属演示型 (聊天气泡/prompt 卡占多数时长)
    AI 音色 gap 影响面小 · 触发切人声: 投后"AI 味太重" >15% 或 用户愿录

  speed: 1.08
  pitch: 0
  emotion: neutral
  script_path: publish/2026-W28/D07-家长陪孩子学英语/scripts/vA.md
  script_backup_path: publish/2026-W28/D07-家长陪孩子学英语/scripts/vB.md
  loudnorm:
    target: -16
    LRA: 11
    TP: -1.5

  # VO segments 逐段 (对齐 pipeline_config.tts.segments · estimate_duration 已过)
  segments:
    - {m: M1,  sid: s1,  time_range: [0.0, 3.5],    text: "报了两年英语班，一开口孩子就往后缩。", est_s: 3.33}
    - {m: M2,  sid: s2,  time_range: [3.5, 9.5],    text: "不是不努力，缺的不是又一个班，是个能陪他瞎聊、说错不尴尬的人。", est_s: 5.74}
    - {m: M3,  sid: s3,  time_range: [9.5, 15.5],   text: "这事 AI 正好能干——一个不会不耐烦的陪练，随时练、说错也不批评。", est_s: 5.74}
    - {m: M4,  sid: s4,  time_range: [15.5, 18.3],  text: "按年龄，三套现成玩法。", est_s: 2.34}
    - {m: M5,  sid: s5,  time_range: [18.3, 24.8],  text: "六到八岁别背单词，让 AI 陪玩角色扮演，点餐买东西，简单英语你来我往。", est_s: 6.11}
    - {m: M6,  sid: s6,  time_range: [24.8, 32.3],  text: "九到十二岁，复述一段动画，再用三句话说今天。AI 先夸再纠一处，敢说错才敢开口。", est_s: 7.04}
    - {m: M7,  sid: s7,  time_range: [32.3, 39.1],  text: "十三到十五岁，挑个感兴趣的话题聊下去，随时纠发音语法，像影子跟读一遍。", est_s: 6.48}
    - {m: M8,  sid: s8,  time_range: [39.1, 43.1],  text: "每天二十分钟，重点是敢开口，不是背多少。", est_s: 3.70}
    - {m: M9,  sid: s9,  time_range: [43.1, 48.3],  text: "AI 是陪练不替课，不用报付费课，时长话题家长把关就行。", est_s: 4.81}
    - {m: M10, sid: s10, time_range: [48.3, 53.3],  text: "私信『孩子几岁、学到哪一步』，我把这三套玩法发你。", est_s: 4.63}

  duration_pre_check:
    required: true
    status: PASS
    tool: pipeline/tts/estimate_duration.py
    run_command: python3 pipeline/tts/estimate_duration.py --config publish/2026-W28/D07-家长陪孩子学英语/pipeline_config.yaml
    result: "10 段全 ✓ · warn 0 · fail 0 · 预测总长 49.92s · 利用率 83.2% PASS · 实发预估 54.91s (~92% 覆盖 ≥85%)"

# ─────────────────────────────────────
# 2. BGM · 默认无
# ─────────────────────────────────────
bgm:
  enabled: false
  mood: none
  reason: |
    D07 属**密 VO 演示型 · 聊天气泡场景**:
    - VO 实发覆盖 ~92% ≥ 85% 硬门
    - M3 气泡演示 / M5-M7 prompt 卡 = 收藏动机镜 · BGM 会稀释"陪孩子聊"的真实亲和感
    - 参考 WaytoAGI / 七七 / 浙大猫学长 同类演示型均无 BGM
    - 外发命名 *_no_bgm.mp4 (直接外发 · 非"预览件")
  future_upgrade_trigger:
    - metric: M2 段位 (3.5-9.5s) 停留率 <45%
      action: 评估 M2-M3 加极轻 warm lo-fi ambient (volume ≤0.05 · 无鼓点)
      restriction: 用户提供 mp3 或剪映自带库 · 禁合成
  global_if_enabled:
    max_volume: 0.08
    duck_on_vo: true
    forbidden: [ffmpeg合成假BGM, 版权音乐, EDM高亢营销BGM]

# ─────────────────────────────────────
# 3. sfx 音效层 (视频硬门 · BGM off 但 sfx 不 off · 全走真素材)
# ─────────────────────────────────────
sfx:
  enabled: true
  formula_check:
    ambient_bed: true
    riser_before_hit: true   # M10 CTA 前用 riser
    hit_on_key_moment: true
  formula_note: |
    「ambient + whoosh + hit + tick + riser」· 全部 assets/sfx/ 真 CC0 wav
    D07 特色: 气泡 pop (subtle_ui_tap) + ✓点亮 tick (check_tick_soft) + 纠一处 (cross_click_error·柔) +
             年龄段转场 whoosh + 价值锚/CTA hit + CTA riser
    ambient 用 coffee_shop_daytime (居家陪聊暖调 · 非 D06 office 冷调)
  gain_ref_db: -12
  gain_range_db: [-8, -22]

  events:
    # ═══ 全片 ambient 铺底 (实测 VO 总长 55.86s) ═══
    - {sid: sfx01, kind: ambient, t_start: 0.0, duration: 55.86, gain_db: -22, src_rel: assets/sfx/ambient/coffee_shop_daytime.wav, note: "居家陪聊暖调 room tone · loop 若 <55.86s"}

    # ═══ M1 (0-3.93s · 气泡弹 + 迟疑 + 钩子大字) ═══
    - {sid: sfx02, kind: tick,  t_start: 0.3, duration: 0.15, gain_db: -12, src_rel: assets/sfx/tick/subtle_ui_tap_soft.wav, note: "M1 AI 气泡『What did you do today?』弹入 pop"}
    - {sid: sfx03, kind: tick,  t_start: 0.6, duration: 0.15, gain_db: -16, src_rel: assets/sfx/tick/metronome_soft_tick.wav, note: "M1 孩子气泡光标迟疑闪 (轻·弱)"}
    - {sid: sfx04, kind: hit,   t_start: 1.0, duration: 0.3,  gain_db: -9,  src_rel: assets/sfx/hit/impact_soft_boom.wav, note: "M1 钩子巨标『一开口就往后缩』入"}

    # ═══ M2 (3.93-9.93s · 反差大字白闪两连) ═══
    - {sid: sfx05, kind: whoosh, t_start: 4.0,  duration: 0.4,  gain_db: -10, src_rel: assets/sfx/whoosh/whoosh_transition_soft.wav, note: "M1→M2 转场"}
    - {sid: sfx06, kind: hit,    t_start: 4.2,  duration: 0.35, gain_db: -8,  src_rel: assets/sfx/hit/impact_soft_boom.wav, note: "M2『不是不努力』白闪拍点"}
    - {sid: sfx07, kind: whoosh, t_start: 6.9,  duration: 0.4,  gain_db: -10, src_rel: assets/sfx/whoosh/whoosh_swipe_fast.wav, note: "M2『缺的不是又一个班』滑入"}

    # ═══ M3 (9.93-15.93s · AI↔孩子气泡你来我往 + ✓点亮) ═══
    - {sid: sfx08, kind: whoosh, t_start: 9.93, duration: 0.4,  gain_db: -11, src_rel: assets/sfx/whoosh/whoosh_air_pass.wav, note: "M3 对话演示启动 whoosh"}
    - {sid: sfx09, kind: tick,   t_start: 10.7, duration: 0.15, gain_db: -13, src_rel: assets/sfx/tick/subtle_ui_tap_soft.wav, note: "M3 气泡第 1 轮 pop"}

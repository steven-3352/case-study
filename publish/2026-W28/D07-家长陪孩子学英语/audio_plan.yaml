# ─────────────────────────────────────
# 4. 字幕 · pipeline 自动烧 (双平台字号差异)
# ─────────────────────────────────────
subtitles:
  burn: true
  burn_engine: /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg
  burn_engine_reason: 系统 ffmpeg 无 libass · full 版含 libass
  platform_font_sizes:
    douyin: 42pt
    xhs: 50pt
  hook_first_3s: true
  hook_at: 0.3
  vo_align: true
  static_vs_drawtext_split:
    static_png_ui:
      - M1 聊天界面 + AI 气泡 + 孩子气泡光标闪 + 头像后缩
      - M3 AI↔孩子对话气泡序列 + ✓ 角标
      - M5 6-8 岁点餐气泡 + prompt 卡 (正文 baked)
      - M6 9-12 岁 06a 演示 + 06b prompt 卡独占全屏 (38pt baked)
      - M7 13-15 岁话题气泡 + 波形 + prompt 卡居中
      - M9 边界三图标卡结构
    drawtext_fast_switch:
      - M1 巨标 96pt「一开口就往后缩」+ 副 40pt
      - M2 巨标 88pt「不是不努力」→「缺的不是又一个班」
      - M3 顶部 40pt「AI 陪练·无限耐心」
      - M4 段标 72pt「3 个年龄段·玩法不同」
      - M5 段标 60pt「6-8 岁·角色扮演」

# ─────────────────────────────────────
# Audience-First 自查三问（audio_plan 层）
# ─────────────────────────────────────

audience_first_check:
  - question: 观众会不会共鸣？
    answer: ✅ 前 3s 环境音钉子（深夜空调 + 翻书 + 咽口水）· 沉稳同事口吻 VO · M7 真英文对话音填充 · 学英语党一秒代入
  - question: 画面观赏性够吗？
    answer: ✅ 无 BGM 反而让画面细节（B-roll 暖光 + 大字冲击 + 屏录动作）更清晰 · 音频层不喧宾夺主
  - question: 内容真材实料吗？
    answer: ✅ VO 覆盖 87.9% · 无死区 · loudnorm -16 dB · role prompt 段 SVG 打点不遮挡 VO · 收藏 + 评论双动机不弱化

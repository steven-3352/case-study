# 声音方案 · audio_plan.yaml · W28D03 AI 陪练英语口语
# 工种: 声音设计师 · 视频形态必跑
# 状态: draft_self_generated · 2026-07-04
#
# 铁律：本条属**密 VO 演示型**（VO 覆盖 ≥85% + 无 3s+ 死区）
# → 默认无 BGM（feedback_dense-vo-no-bgm-default）
# → 前 3s 环境音钉子（非死区 · 见 feedback_dense-vo-no-dead-air）
# → 3-58s VO 全程覆盖
# → 外发命名：`*_no_bgm.mp4` 直接外发（不再是"预览件"）
#
# content_id: W28D03
# topic_id: AI陪练英语口语
# 依赖: scripts/v0.md（默认严格版 · vA/vB 备用）· storyboard.yaml · design_language.md · retention_beat_sheet.md · openmontage_brief.md · motion_tech_plan.md（SKIP）

voice:
  engine: minimax
  model: speech-2.8-turbo
  voice_id: male-qn-jingying-jingpin  # 男声·精英精品：稳、克制、沉稳同事口吻，匹配 skin.persona_anchor "学英语同路人 · 反教程"
  # 备选路线：
  # 1. female-shaonv-luyin（女声·少女录音）· 若首轮数据回填测出情感型受众更强
  # 2. 用户真人录制（若走 vA 场景剧型第一人称版 + 用户愿意录样本）
  # 已识别 gap（memory feedback_ai-voice-known-gap）：MiniMax 真诚青年 4 类破绽本条可控（M6/M7 演示的是用户开口 · AI 音色 gap 影响面小）
  speed: 0.95   # 微慢（沉稳同事口吻不急躁）
  pitch: 0
  emotion: neutral
  script_path: publish/2026-W28/D03-AI陪练英语口语/scripts/v0.md
  # 若切 vA 改为 scripts/vA.md · 若切 vB 改为 scripts/vB.md
  # 每段 VO 与 storyboard scene 时间段一一对齐（feedback_dense-vo-no-dead-air 铁律）
  segments:
    # 0-3s 无 VO（沉默钉子 · 环境音钉子）
    # 3s 处 VO 起（feedback_dense-vo-no-dead-air：VO 覆盖 ≥85% 起点）

    - time_range: [3, 8]
      text: "晚上 11 点，你在对着墙念英语。92% 中国人不敢开口——不是你的问题，是没人的问题。"

    - time_range: [8, 15]
      text: "多邻国打了 700 天卡，见到老外还是——嘴张开一半，脑子空了。"

    - time_range: [15, 20]
      text: "你去问 AI『怎么练口语』——它给你 10 条建议，全是废话。"

    - time_range: [20, 24]
      text: "问题在这。"

    - time_range: [24, 36]
      text: "你不是要 AI 教你，你要 AI 陪你说。先给它一张角色卡：你是我雅思口语搭档，我 Part 3，你只用英文提问，我说错也别打断。"

    # 36-42s 无中文 VO（M7 真陪练感 · 让 AI 和用户的英文对话真出声）
    # 但为满足 dense-vo-no-dead-air，段位内应有真实英文对话音（非死区）
    # 制作时：M7 段位由真机豆包语音的 AI 追问 + 用户回答填充 · 见 storyboard M7

    - time_range: [42, 48]
      text: "先敢说 30 分钟，比敢背 300 单词管用。"

    - time_range: [48, 54]
      text: "不是教你怎么问 AI。是把我 22:30 用的救命 role prompt 给你。"

    - time_range: [54, 58]
      text: "评论「面试」「雅思」「日常」「旅游」——我把对应 role prompt 给你。"

  loudnorm:
    target: -16  # dB · 抖音/视频号推荐（feedback_dense-vo-no-dead-air）
    LRA: 11
    TP: -1.5

# ─────────────────────────────────────
# BGM · 默认无（feedback_dense-vo-no-bgm-default）
# 密 VO 演示型 · VO 覆盖 ≥85%（本条覆盖 45s / 58s = 78%，加 M7 段位真实英文对话音后达标 ≥85%）
# ─────────────────────────────────────

bgm:
  enabled: false  # 默认关闭
  mood: none
  reason: |
    本条属密 VO 演示型 + 深夜克制场景。
    根据 feedback_dense-vo-no-bgm-default：VO 覆盖 ≥85% + 演示/知识型 → 默认无 BGM。
    若强加 BGM，会与 M1 环境音钉子（咽口水 + 深夜静默）+ M8 侧躺共同体（静谧感）冲突。
    参考 WaytoAGI / 七七 / 浙大猫学长视频均无 BGM。
    外发命名：*_no_bgm.mp4（直接外发，不再是"预览件"）。

  # 若未来数据回填出现"情感段位感染力不足"（M8-M9 停留低）→ 可评估极轻 ambient
  future_upgrade_trigger:
    - metric: M8 段位（42-48s）停留率 < 45%
      action: 考虑 M8-M9 加极轻 ambient BGM（volume ≤ 0.05 · 无鼓点 · 无 vocal）
      restriction: 仍不能加 M1 段位 BGM（沉默钉子必须保留）
    - metric: 整片 completion_rate < 30% 且拆解显示中段塌陷
      action: 考虑 M4-M5 段位加低压 lo-fi 打底（volume ≤ 0.08）
      restriction: 不用合成 BGM（feedback_no-synth-bgm）· 用户提供 mp3 或剪映自带库

  # 全局 BGM 约束（未来若启用）
  global_if_enabled:
    max_volume: 0.08  # 全片 BGM 音量上限（VO 清晰优先）
    duck_on_vo: true
    forbidden:
      - ❌ ffmpeg aevalsrc/sine/棕噪合成的假 BGM（feedback_no-synth-bgm）
      - ❌ 版权音乐（Taylor Swift/周杰伦等）· 用剪映自带库或免版权 lo-fi
      - ❌ 太浮夸的营销 BGM（"AI 学英语神器" 感觉的 EDM）
      - ❌ 前 3s 有 BGM（会破坏沉默钉子效果）
      - ❌ M6 role prompt 演示段位 BGM 音量 > 0.05（会压过豆包语音键"叮"提示音）

# ─────────────────────────────────────
# 环境音（非 BGM · 属真实痕迹层）
# ─────────────────────────────────────

env_audio:
  - time_range: [0, 3]
    source: assets/broll/audio/env_night_room.mp3
    layer: env
    volume: 0.4
    note: "深夜环境音（远处空调低频 + 翻书纸声）· 前 3s 沉默钉子 · 非 BGM · 属真实钉子"

  - time_range: [2, 3]
    source: assets/broll/audio/env_swallow_saliva.wav
    layer: env_sfx
    volume: 0.5
    note: "M1 咽口水吞咽 SFX · 增强"这是我"的代入感 · 2s 处入"

  - time_range: [8, 15]
    source: assets/broll/audio/env_awkward_silence.mp3
    layer: env
    volume: 0.2
    note: "M3 视频通话空白气氛音（3s 尴尬沉默）· 强化"卡壳"感"

  - time_range: [24, 36]
    source: null  # 由 M6 真机屏录自带
    layer: env
    volume: 0.6
    note: "M6 段位由豆包 App 语音键长按"叮"提示音 + role prompt 打字机音填充 · 真机屏录原生自带"

  - time_range: [36, 42]
    source: null  # 由 M7 真机屏录自带
    layer: env
    volume: 0.7
    note: "M7 段位由真机豆包语音的 AI 英文追问 + 用户回答填充（真实英文对话音）· 补足 dense-vo-no-dead-air 铁律"

  - time_range: [42, 48]
    source: assets/broll/audio/env_night_room.mp3
    layer: env
    volume: 0.2
    note: "M8 侧躺深夜环境音延续 · 呼吸声 + 屏幕轻微亮度嗡鸣"

# ─────────────────────────────────────
# 字幕 · pipeline 自动烧
# feedback_pipeline-burn-subs：pipeline 生 SRT/ASS + ffmpeg-full libass 烧进 mp4
# 剪映不跑智能识别 · 系统 ffmpeg 无 libass 用 /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg
# ─────────────────────────────────────

subtitles:
  srt_path: publish/2026-W28/D03-AI陪练英语口语/subtitles/v0.srt  # gen_subs 生成
  ass_path: publish/2026-W28/D03-AI陪练英语口语/subtitles/v0.ass  # 若需样式定制
  burn: true
  burn_engine: /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg  # 系统 ffmpeg 无 libass · 走 full 版
  platform_font_sizes:  # feedback_pipeline-full-platform-output
    douyin: 42pt
    xhs_轮播: 50pt  # 小红书轮播大字更大（默认站方偏好）
    wechat_video: 42pt
  style: |
    主画面叠字规则：
      - M1 3s 处入「23:12·又一次决心学英语」: display 140pt · 苹方 900 · 白字 #f5f5f0
      - M2 群体锚「92% / 78%」: display 160pt 数字 + headline 96pt 中文 + caption 32pt 来源
      - M3 打卡幻灭「打卡 ≠ 会说 · 700 天见老外还是卡壳」: body 42-50pt · 白字（≠ 可 accent_red）
      - M4 反例「打字问 AI「怎么练」= 拿到废话」: body 42pt · accent_red #e53935
      - M5 类比锚「读游泳教程 vs 跳进泳池」: headline 96pt · 白字
      - M6 role prompt 分段 + SVG 五段标签: mono 32-40pt + caption 28pt 淡黄底黑字
      - M7 英中对照: 英文 SF Mono body 40pt accent_soft + 中文 苹方 body 32pt 白字
      - M8「22:45 · 今天真开口 15 分钟」: SF Mono display 120pt + 苹方 caption 32pt 副字
      - M9「不是教你怎么问 AI · 是把我 22:30 用的救命 role prompt 给你」: display 100pt · 白字 · 两行
      - M10 四选项「面试 / 雅思 / 日常 / 旅游」: headline 88pt · 白字四行 + caption 32pt 底部小字
    前 3s: 无字幕（沉默钉子期）· 3s 处入「23:12·又一次决心学英语」白大字
  hook_first_3s: false  # 严格来说 3s 处字幕入 · M1 0-3s 无字幕（差异化设计）
  hook_at: 3.0  # 字幕入点
  vo_align: true  # 字幕与 VO 逐句对齐（每 2-4s 一段字幕）

# ─────────────────────────────────────
# 输出规格
# ─────────────────────────────────────

outputs:
  video_raw: publish/2026-W28/D03-AI陪练英语口语/build/douyin_raw.mp4  # 无字幕工程件（可选）
  video_publish_douyin: publish/2026-W28/D03-AI陪练英语口语/douyin/video_no_bgm.mp4  # 抖音外发（默认无 BGM）
  video_publish_xhs: publish/2026-W28/D03-AI陪练英语口语/xhs/video_no_bgm.mp4  # 小红书视频版（若不走轮播 · 备胎）
  video_publish_wechat: publish/2026-W28/D03-AI陪练英语口语/weixin/video_no_bgm.mp4  # 视频号外发
  vo_mp3: publish/2026-W28/D03-AI陪练英语口语/build/vo_v0.mp3
  # 若切 vA/vB 版本 · 改为 vo_vA.mp3 / vo_vB.mp3
  xhs_carousel_pages: publish/2026-W28/D03-AI陪练英语口语/xhs/pages/P1-P8.png  # 8 张轮播

# ─────────────────────────────────────
# QC 清单
# ─────────────────────────────────────

qc:
  - VO 清晰可辨（人工听 30s · 尤其是 M6 24-36s role prompt 段 · M7 36-42s 真对话英中对照）
  - 前 3s 无 BGM · 环境音钉子清晰可辨（深夜空调低频 + 翻书 + 咽口水）
  - VO 覆盖 ≥85%（3-58s 段位 45s VO + M7 段位 6s 真英文对话音 = 51s / 58s = 87.9%）✅
  - 无 3s+ 死区（M7 段位由真英文对话音填充 · 不用 anullsrc 生成静音）
  - loudnorm 目标 -16 dB（feedback_dense-vo-no-dead-air）
  - M6 24-36s SVG 打点标签淡入淡出无遮挡 VO
  - M8 42-48s 情感段位无 BGM 干扰环境音（若首轮数据显示塌陷，评估极轻 ambient）
  - M9 48-54s 价值锚 · 沉稳 VO 与"不是教你"节奏匹配
  - M10 54-58s CTA · VO 与四选项字幕同拍
  - 外发文件名带 `_no_bgm` 后缀（外发命名规范）
  - 未使用合成 BGM（禁 aevalsrc/sine/棕噪拼接）
  - 未使用真实竞品 logo（多邻国 · ChatGPT · Duolingo 等）

# ─────────────────────────────────────
# 素材准备清单（给制作/运营）
# ─────────────────────────────────────

assets_prep:
  need_from_user:
    # 本条密 VO 演示型 · 默认无 BGM · 用户无需提供 BGM 素材
    # 若首轮数据回填触发 future_upgrade_trigger，再评估
    - name: 讯飞录官方引用页截屏（M2）
      note: "若无法获取，退化为大字 92%/78% + 底部小字来源『讯飞录 2024』（B 级同帧口径展示）"
    - name: 用户真机豆包演示样本（M6/M7）
      note: "本地准备手机 + 豆包 App + role prompt 演示脚本（1 小时准备）· QuickTime 屏录"

  sfx_can_auto_gen:
    - name: env_night_room
      spec: "深夜环境音（远处空调低频 + 翻书纸声）· 3s"
      how: "Pexels audio / Freesound.org 免费下载 CC0"
    - name: env_swallow_saliva
      spec: "咽口水吞咽 SFX · 0.4s"
      how: "Freesound.org 或 剪映自带 SFX 库搜索 swallow"
    - name: env_awkward_silence
      spec: "视频通话空白气氛音（3s 尴尬沉默 · 极安静背景音）"
      how: "Freesound.org 搜索 room tone silent"

  bgm_prep: null  # 本条默认无 BGM · 无需 BGM 素材准备


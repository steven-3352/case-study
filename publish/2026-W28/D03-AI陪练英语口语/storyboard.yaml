  - id: M6_prompt_demo
    time_range: [24, 36]
    intent: 演示核心 · role prompt
    format_id: broll_demo + svg_overlay
    template: null
    picture: |
      豆包语音界面原生 · QuickTime 真机屏录
      主角操作步骤：
        1. 打开豆包 App（豆包本身允许出现，因为是主演示 · 不打脸不背书）
        2. 光标滚动到语音输入键
        3. 长按语音键 · 显示"松手发送"提示
      role prompt 分五段 punch-in 大字滑入（drawtext 分段 · 底部叠加）
      SVG 覆盖高亮五段标签：「角色卡 / 场景 / 只提问 / 说错不打断 / 用英文」
      每段标签用 accent_soft #ffc857 淡黄底 + 黑字 · 淡入 0.3s → 停 2s → 淡出 0.3s（不做复杂 GSAP）
      底部小字 caption 28pt：「可长按暂停复制」（增强收藏动机）
    voiceover: |
      「你不是要 AI 教你，你要 AI 陪你说。先给它一张角色卡：**你是我雅思口语搭档，我 Part 3，你只用英文提问，我说错也别打断**。」
    subtitle:
      text_seq_svg_labels: ["角色卡", "场景", "只提问", "说错不打断", "用英文"]
      style:
        font: JetBrains Mono / SF Mono · caption 28pt · 黑字 #1a1a1a
        background: 淡黄底 accent_soft #ffc857 padding 8px 12px
        position: 每段 role prompt 左侧
        transition: SVG 淡入 0.3 → 停 2 → 淡出 0.3
      bottom_caption:
        text: "可长按暂停复制"
        font: 苹方 · caption 28pt · 白字 #f5f5f0 · 透明度 70%
        position: 屏幕底部
    audio:
      env: 长按语音键"叮"提示音（豆包原生）
      bgm: none
    assets_needed:
      - QuickTime/OBS 录制豆包语音演示全过程
      - SVG 打点标签（5 个 · 静态 SVG + CSS transition · 无需 GSAP）
      - role prompt 全文文本（fact_check.md #P0-4 A 级 · 直用 domain_notes Prompt 1）
    forbidden:
      - GSAP 复杂动画
      - 高亮语法 IDE 风（用简单 SVG 打点即可）
      - 遮挡 role prompt 主内容
      - 数字人形象（Q7/Q8 暂停）


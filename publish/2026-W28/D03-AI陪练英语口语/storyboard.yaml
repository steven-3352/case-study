        font: 苹方 · display 160pt 数字 · headline 96pt 中文 · caption 32pt 来源
        color: 白字 #f5f5f0 · 数字带 accent_red 描边 2px（强调）
        position: 屏幕中心（数字）· 中心下方（中文）· 底部（来源）
        appear_at: 3.0
        exit_at: 8.0
        transition: drawtext 淡入 0.3s · 硬切翻页 5s
      forbidden: [emoji, 惊叹号, 彩色渐变数字, GSAP 数字跳动特效]
    audio:
      env: 无（3s 处开始 VO）
      bgm: none  # 密 VO 无 BGM
    assets_needed:
      - 讯飞录《2024 中国英语学习报告》原页截屏（若可获取；否则大字 + 底部小字来源标注同帧展示，B 级同帧口径）

    format_id: punch_black
    template: null
    picture: |
      灰底 #0a0a0a 全屏。
      3-5s 段位：display 160pt 白字「92%」大字滑入 · headline 96pt 中文文本「中国人不敢开口」在数字下方 · 底部 caption 32pt 小字「来源：讯飞录《2024 中国英语学习报告》」
      5-8s 段位：数字翻切成「78%」+ 中文「缺安全场合」+ 讯飞录官方引用页真截屏（画面右下角 UI 层展示，无遮挡主大字）
      3s 处：字幕大字 drawtext 淡入 0.3s
    voiceover: |
      「晚上 11 点，你在对着墙念英语。92% 中国人不敢开口——不是你的问题，是**没人**的问题。」
    subtitle:
      text_seq: ["92% 中国人不敢开口", "78% 缺安全场合"]

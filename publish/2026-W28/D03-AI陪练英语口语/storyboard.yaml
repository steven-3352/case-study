xhs_carousel:
  meta:
    canvas: [1080, 1920]
    pages: 8
    pipeline: 手工设计 · 参考 P002 尺寸（但不用报纸风）· mono 字体 role prompt 页可截图
    subtitle_font_size: 50pt  # 小红书大字标准
  pages:
    - id: P1
      role: 封面 · 停划 + 收藏动机
      picture: 手机锁屏「23:12」+ 英语课本 + 台灯 · 灰底 #0a0a0a 顶部大字
      title: 92% 中国人不敢开口<br>不是你的问题
      style: display 160pt 数字 · headline 96pt 中文
    - id: P2
      role: 场景认领
      picture: 主角背影对墙念 · 咽口水动作 · 深夜暖光
      title: 晚上 11 点你在对着墙念英语<br>念两句就闭嘴 —— 我懂
    - id: P3
      role: 打卡失效
      picture: 多邻国 700 天连击数字截图（不打 logo）+ 视频通话尴尬截图 · 分屏
      title: 多邻国 700 天<br>见到老美还是卡壳
    - id: P4
      role: 顿悟锚
      picture: 分屏静图（游泳教程 vs 跳进泳池）+ 大字类比锚
      title: 语音模式 ≠ 打字模式<br>读书 ≠ 跳进泳池
    - id: P5
      role: Prompt 1 · 雅思 Part 3（收藏动机最强）
      picture: 全屏 role prompt 文本（mono 字体 · 可截图）· 灰底纸感 `surface_paper #f5f5f0`
      title: "雅思 Part 3 陪练 · role prompt"
      prompt_body: |
        You are my IELTS Speaking Part 3 tutor.
        Ask me only in English.
        I'm Part 3, topic: Books.
        Follow-up like a real examiner.
        Don't interrupt me if I make mistakes.
        Give quick feedback at the end.
    - id: P6

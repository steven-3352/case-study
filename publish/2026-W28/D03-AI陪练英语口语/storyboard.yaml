scenes:
  - id: M1_night_desk
    time_range: [0, 3]
    intent: 停划 · 深夜钉子
    format_id: chaos_broll
    template: null
    reuse_reason: null
    visual_difference: null
    risk: null
    picture: |
      深夜台灯 + 英语课本 + 手部特写 B-roll。
      Pexels 素材候选：
        - office_desk_dusk_evening_empty__26609644.json
        - office_desk_dusk_evening_empty__29540810.json
        - office_desk_dusk_evening_empty__7710338.json
      优先选画面构图含「暖光台灯 + 桌面」的一条；若无「英语课本」主体，drawtext/drawbox 叠一个「Unit 5 · Making phone calls」纸质书页面模拟。
      转场 → iPhone 锁屏时间「23:12」特写（真机拍摄或 drawtext 高保真仿真 iOS 锁屏 UI）
      2-3s 处：手部特写握英语课本 → 主角背影/侧影嘴部特写 → 咽口水吞咽近景 → 抬头看向墙。
    voiceover: null  # 沉默钉子 · 环境音钉子
    subtitle:
      text: null
      style: null
    audio:
      env: 深夜环境音（远处空调低频 + 翻书纸声 + 一次咽口水吞咽）
      bgm: none  # 0-3s 无 BGM · 全片默认无 BGM
    assets_needed:
      - Pexels 深夜书桌 B-roll（3 条已下载）
      - 手机屏幕真实拍摄（iOS 锁屏 · 时间设为 23:12）
      - 咽口水吞咽 SFX（Freesound / Pexels audio 或真实录制）
    forbidden:
      - AI 生图书桌 / 台灯 / 手部
      - HTML 仿真手机 UI（除非真机拍摄不可得，且叠加真实感明显）
      - 明亮日光书桌（必须深夜暖光）

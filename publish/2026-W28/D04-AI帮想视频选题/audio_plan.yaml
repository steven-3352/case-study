assets_prep:
  need_from_user:
    - name: 屏录 4 场次（对齐 storyboard.yaml screen_recording_checklist）
      note: |
        本地准备 macOS + ChatGPT UI + 4 段 prompt 演示样本（家居收纳版 · 1 小时准备）
        S1: M2/M3 reveal 2s（打字 14 字 + AI 输出 3 条 · 反例 prompt）
        S2: M6 3 段 10s（3 个 AI 对话框反例实录）
        S3: M7 主场 15s（4 段 prompt 家居收纳版粘贴 → AI 10 条候选表格）
        S4: vB 备胎 3s（备用 · 若切 vB 走）
    - name: 40w 赞 vs 800 赞真机截图 × 2（M5 分屏）
      note: PhotoRoom / PixelMator 打马赛克遮挡真实同行头像/账号名 · 单位显式"赞"字必须出现
    - name: 4 段 prompt 家居收纳版全文
      note: |
        身份卡：「你是家居收纳博主运营策划师」
        账号定位：「账号定位家居收纳 · 目标粉丝 25-40 女性 · 关注小户型收纳」
        粉丝痛点：「常问：小户型没收纳空间 / 收纳完 3 天又乱 / 老公不配合收纳」
        输出约束：「按表格给 10 条选题 · 每条含标题/场景/钩子/成本/差异化」

  sfx_can_auto_fetch:
    - name: daylight_office_room_tone
      spec: 白天办公室 ambient · 3-8s 段落可 loop 覆盖 58s · -24dB
      how: Freesound.org 搜索 `office room tone daylight` CC0 · pipeline/sfx/fetch_sfx.py（P2 · 若已实装）
      backup: 剪映自带 SFX 库搜索 `办公室氛围音`

    - name: keyboard_typing_14keys
      spec: 机械键盘打字 14 声（30ms/字节奏）· 0.5s 段
      how: Freesound.org 搜索 `mechanical keyboard typing sequence` CC0 · 剪辑 14 声
      backup: 用户 QuickTime 屏录 M2 自带打字音（更同频）

    - name: keyboard_enter_key
      spec: 敲回车拍点 · 0.15s
      how: Freesound.org 搜索 `keyboard enter key press` CC0

    - name: soft_swish_transition
      spec: whoosh 段间过渡 · 0.3-0.5s · -10~-12dB
      how: Freesound.org 搜索 `whoosh transition swish soft` CC0
      backup: 剪映自带 SFX 库搜索 `转场音效`

    - name: impact_boom_soft
      spec: hit 拍点 · 0.3-0.4s · -8dB
      how: Freesound.org 搜索 `impact soft boom cinematic` CC0

    - name: impact_hard_cut
      spec: hit 硬切拍点（M5 分屏进入）· 0.3s · -8dB
      how: Freesound.org 搜索 `impact hard cut stinger` CC0

    - name: check_tick_soft
      spec: hit 打勾拍点（M8 accent_green × 8）· 0.15s · -10dB
      how: Freesound.org 搜索 `soft click check mark ui` CC0

    - name: cross_click_soft
      spec: hit 打叉拍点（M8 accent_red × 2）· 0.15s · -10dB
      how: Freesound.org 搜索 `error click ui cross` CC0

    - name: impact_boom_deep
      spec: M9 价值锚落地深长 hit · 0.5s · -8dB
      how: Freesound.org 搜索 `impact deep resonance cinematic` CC0

    - name: subtle_tap_ui
      spec: tick 轻拍点（M4 VO 起）· 0.15s · -15dB
      how: Freesound.org 搜索 `subtle ui tap soft` CC0

  bgm_prep: null  # 本条默认无 BGM · 无需 BGM 素材

# ─────────────────────────────────────
# 8. QC 清单（audio_plan 层验收）
# ─────────────────────────────────────

qc:
  vo:
    - VO 清晰可辨（人工听 30s · 尤其 M6 15-25s 3 段快切 · M7 25-40s 4 段 prompt 演示）
    - VO 覆盖 ≥85%（3-58s 段位 55s VO / 58s = 94.8%）✅
    - 前 3s（M1/M2）无 VO 是设计（chaos-punch-reveal 反差 · 由 ambient + tick + 打字 + whoosh + hit 撑满）· 非死区
    - 无 3s+ 死区（每段 VO 间断 ≤1s · 由 sfx 事件填充）
    - loudnorm 目标 -16 dB（feedback_dense-vo-no-dead-air）
    - "**TTS 时长前置估算硬门**：estimate_duration.py 报告全段 ≤10% 溢出 · 若 M6/M9/M10 溢出触发 overrun_action 改稿或改段位"
    - voice_id male-qn-jingying-jingpin · emotion=neutral · speed=0.98（沉稳同事口吻 · 非博主感）

  bgm:
    - BGM off · 外发文件名带 `_no_bgm` 后缀 · 非"预览件"
    - reason 记明依据（feedback_dense-vo-no-bgm-default · 密 VO 演示型 + 白天办公场景）
    - future_upgrade_trigger 已声明（M4-M5 塌陷或整片 <30% 才评估极轻 lo-fi/piano ambient）

  sfx:
    - sfx.enabled=true · formula_check 三项至少 2 项为 true（ambient_bed=true + hit_on_key_moment=true · riser_before_hit=false 已声明本条不用）
    - sfx 覆盖：每次场景切换（M1→M2 → M3 → M4 → M5 → M6 → M7 → M8 → M9 → M10）均有 whoosh 或 hit · 至少 whoosh × 4 + hit × 8 达标
    - sfx 音量：所有 events[].gain_db ≤ -8（hit 最响 -8dB · ambient 最轻 -24dB · 全部在 gain_range_db [-8, -22] 内）
    - sfx 合规：所有 src_rel 走 assets/sfx/*（真素材库文件）· 禁 ffmpeg aevalsrc/sine 合成假 sfx
    - VO ducking：VO 起时 ambient + tick + whoosh 层降 6dB · hit 不 duck（避免拍点感丢失）

  subtitles:
    - 字幕由 pipeline 生 SRT/ASS + ffmpeg-full libass 烧进 mp4（非剪映智能识别）
    - 系统 ffmpeg 无 libass · 使用 /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg
    - 三平台字号：抖音 42pt · 小红书轮播 50pt · 视频号 42pt（feedback_pipeline-full-platform-output）
    - static PNG vs drawtext 快切分类明确（UI 内容走 static · 叠层大字走 drawtext）
    - M1/M2 前 3s 无字幕是设计（沉默钉子 + 打字过程即视觉字幕）· 非缺件
    - M3 display 140pt 大字入点 2.4s 与 hit sfx 拍点 2.4s 同帧
    - 字幕与 VO 逐句对齐（每 2-4s 一段字幕 · vo_align=true）

  outputs:
    - 外发文件带 `_no_bgm` 后缀（三平台 4 个外发文件 · 命名规范）
    - 未使用真实竞品 logo（ChatGPT / DeepSeek / 豆包 UI 原生色允许 · 禁打 logo）
    - 未使用合成 BGM（禁 aevalsrc/sine/棕噪拼接）· 未使用合成 sfx（同禁）
    - tts_duration_estimate.json 已生成 · 无 >30% 溢出段
    - sfx_mix.log 已生成 · 无 gain_db 越界事件

# ─────────────────────────────────────
# 9. fail-closed 门禁
# SYSTEM §2.4b: 未过 gate_check 前，任何 mp4 只能作 build/ 临时预览
# ─────────────────────────────────────

gate_check_status:
  content_gate: pass_dual_review  # 编剧+ v0/vA/vB 已双评 pass（W28D04 步 5 完成）
  form_gate: pass_dual_review     # form_strategy 已双评 pass avg=92（W28D04 步 7 完成）
  motion_storyboard_gate: pass_single_run  # 动画导演单跑 pass（W28D04 步 9 完成 · 2026-07-04 起单跑不双评）
  storyboard_gate: pass_self_generated  # storyboard.yaml 已产出（W28D04 步 10 完成）
  audio_gate: pending             # 本文件（步 11）· 声音设计师单跑（按用户明示"只有编剧+ 和 形式策略官 需 Agent 新 session 双评"）
  tts_duration_gate: pending      # 待运行 estimate_duration.py（本文件 duration_pre_check 声明必跑）
  gate_check_palette: pending     # 待 render 后跑 pipeline/gate_check_palette.py
  pre_publish_forecast: pending   # 待 render 后跑（步 14）
  decision: proceed_to_pipeline_after_tts_estimate
  next_step: |
    1. 先跑 python pipeline/tts/estimate_duration.py 校验 M6/M9/M10 溢出（本文件 duration_pre_check 硬门）
    2. 若报警按 overrun_action 改稿 · 重跑 estimate_duration.py 直到全段过关
    3. 进入 pipeline 出片（Task #80 · 步 12 · config-driven · pipeline_config.yaml + run_pipeline.py --step all）
    4. render 后跑 gate_check_palette + pre_publish_forecast · fail-closed 决定是否可外发

# ─────────────────────────────────────
# 10. Audience-First 自查三问（audio_plan 层）
# ─────────────────────────────────────

audience_first_check:
  - question: 观众会不会共鸣？
    answer: |

  # ── 大字分类（feedback_pipeline-full-platform-output 硬约束）──
  static_vs_drawtext_split:
    static_png_ui:
      - M2 打字过程 UI 内容（打字本身即视觉字幕 · 屏内 mono 32pt · 保留 AI 对话框原生 UI）
      - M6 M7 屏录 UI 内容（AI 对话框深色系原生 · 屏内 mono 32-40pt）
      - M7 accent_soft badge 段名（headline 88pt · SVG 静态 badge · 不走 drawtext）
      - M8 表格 headline 42pt 表头 + body 32pt 单元格（SVG 表格结构 · 不走 drawtext）
    drawtext_fast_switch:
      - M3 display 140pt 大字入「打'帮我想 10 个' · AI 全给'如何做好'」（drawtext + drawbox 白闪快切）
      - M4 headline 96pt「9 成中腰部创作者遇到选题问题」+ caption 24pt 来源
      - M5 headline 96pt「40w 赞 vs 我 800 赞」+ caption 32pt 副标
      - M6 caption 28pt「跳过身份卡」「跳过账号定位」「跳过粉丝痛点」批注
      - M8 headline 96pt「10 里 8 · 能用」+ caption 28pt「5 判据 · 通过 4 条即能用」
      - M9 display 140pt 两行「不是教你」/「是把 4 段 prompt 给你」
      - M10 headline 88pt CTA + caption 28pt「同行互助 · 不推服务」

  style: |
    主画面叠字规则（对齐 storyboard M1-M10）：
      - M1（0-1s）: 无字幕（首秒故意留白 · chaos-punch-reveal 反差冲击靠视觉不靠字幕）
      - M2（1-1.6s）: 无 drawtext 字幕（打字过程本身即视觉字幕 · 屏内 UI mono 32pt）
      - M3（1.6-3s）: display 140pt 白字 · 苹方 900 · #f5f5f0 · 2px canvas_office_dark 描边（drawtext + drawbox 白闪快切）
      - M4（3-8s）: headline 96pt 白字 + caption 24pt 来源右下 · 苹方 700/500
      - M5（8-15s）: headline 96pt 白字类比锚居中偏下 + caption 32pt 副标 · 苹方
      - M6（15-25s）: caption 28pt 大字批注（accent_red 描边强调「跳过 X」）· 苹方
      - M7（25-40s）: 屏内 UI mono 32-40pt（prompt 全文）+ SVG badge headline 88pt 段名 + caption 28pt 底部「可长按暂停截屏抄」
      - M8（40-48s）: headline 96pt 大结论 + caption 28pt 副标 · SVG 表格 headline 42pt 表头 + body 32pt 单元格
      - M9（48-54s）: display 140pt 白字两行 · 苹方 900 · 居中
      - M10（54-58s）: headline 88pt 白字 CTA + caption 28pt 底部小字 muted 半透明
    前 3s: 无字幕（M1/M2 留白 · M3 处入 display 大字）
    字幕分类: static PNG（UI 内容 + SVG badge/表格）vs drawtext（叠层大字快切）

  hook_first_3s: false  # M1-M2 故意无字幕（沉默钉子 + 打字过程即视觉字幕）· M3 处入 display 大字
  hook_at: 2.4  # M3 display 140pt 大字入点
  vo_align: true  # M4-M10 字幕与 VO 逐句对齐（每 2-4s 一段）


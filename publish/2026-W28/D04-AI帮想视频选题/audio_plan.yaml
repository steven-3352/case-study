# ─────────────────────────────────────
# 1. 配音（Voice）· MiniMax speech-2.8-turbo
# ─────────────────────────────────────

voice:
  engine: minimax
  model: speech-2.8-turbo
  voice_id: male-qn-jingying-jingpin
  voice_id_rationale: |
    D04 skin.tone_direction「同行说话 · 不 preach · 不 sell 秘籍」→ 沉稳男声匹配"做了 20 年互联网 · 同行"
    male-qn-jingying-jingpin 稳、克制、非博主感（区别抖音"教你 AI 一键出爆款"话术的高亢营销 tone）
    与 D03 相同 voice_id 但 emotion=neutral（D03 深夜静谧 · D04 白天办公 · 语速可略微加快）
  备选路线:
    - 1_female_shaonv_luyin: 若首轮数据回填测出女性受众更强（中腰部创作者中女性比例可能高）
    - 2_user_real_recording: 若用户愿意录样本（首选 · 消除 AI 音色 gap）
  ai_voice_gap_note: |
    memory feedback_ai-voice-known-gap 已识别 MiniMax 真诚青年破绽 4 类
    D04 属演示型（M2/M3/M6/M7 屏录 UI 占 62% · AI 音色 gap 影响面小）· 本轮不切用户真人录制
    触发切人声条件：投后差评"AI 味太重"占比 >15% 或 用户愿意录样本

  speed: 0.98  # 比 D03（0.95）微加快 · 白天场景比深夜节奏略快 · 但仍避免 preach 感
  pitch: 0
  emotion: neutral  # 白天办公 · 中性同事口吻 · 非情感型 · 非高亢
  script_path: publish/2026-W28/D04-AI帮想视频选题/scripts/vA.md
  script_backup_path: publish/2026-W28/D04-AI帮想视频选题/scripts/vB.md  # 若 vA 3s 完播 <52% 切换
  loudnorm:
    target: -16   # dB · 抖音/视频号推荐
    LRA: 11
    TP: -1.5

  # ── VO segments 逐段（对齐 storyboard M4-M10 · 前 3s 无 VO 设计）──
  # 铁律：无 3s+ 死区（M1-M3 由 sfx + 环境音 + 打字拟音填充 · 不算死区）
  segments:
    # 0-3s 无 VO（M1/M2/M3 · 沉默钉子 + 屏录反差声音）
    # 由 M1 ambient + tick(0.3s) + M2 打字 14 声 + M3 whoosh × 3 + hit × 1 撑满

    - m: M4
      time_range: [3, 8]
      text: "上周我也这样。9 成中腰部创作者早期都遇到选题问题——不是你的问题。"
      char_count: 31  # CJK 字符（含标点）
      estimated_duration_s: 5.6  # 5.5 chars/sec × 0.98 speed · 略超 5s 段位 0.6s
      overrun_action: 若 estimate_duration.py 报警 >10%，改为「上周我也这样。9 成中腰部创作者遇到选题问题——不是你的问题。」（删"早期都"3 字节约 0.6s）

    - m: M5
      time_range: [8, 15]
      text: "你翻了半小时竞品，存了 8 张截图，还是一条不想拍。同行 40w 赞我也拍过——我只有 800。"
      char_count: 43
      estimated_duration_s: 7.8  # 略超 7s
      overrun_action: 若报警，删"你翻了"→「翻了半小时竞品，存 8 张截图，一条不想拍。同行 40w 赞我也拍过——我只有 800。」（-3 字节约 0.5s）

    - m: M6
      time_range: [15, 25]
      text: "我以前也这么干：让 AI 帮我想 10 个 → 都是「如何做好 XX」。加平台词 → 同行都在拍的模板。让 AI 抄爆款 → 换个数字的同质品。"
      char_count: 62
      estimated_duration_s: 11.2  # 超 10s 段位 1.2s · 需前置校验
      overrun_action: |
        若 estimate_duration.py 报警：
        方案 A（推荐 · 保完整）：段位延长到 15-26s（M7 起点后推 1s · M8 段位相应压缩 40-47s · 需回改 storyboard.yaml）
        方案 B（推荐 · 保节拍）：删「AI」× 2 →「让帮我想 10 个 → 都是「如何做好 XX」。加平台词 → 同行都在拍。让抄爆款 → 换数字的同质品。」（-5 字节约 1.0s）
        优先方案 B（保节拍 · storyboard 段位不改）

    - m: M7
      time_range: [25, 40]
      text: "换个打开方式：打开 AI，粘上 4 段 prompt——身份卡、账号定位、粉丝痛点、输出约束。同一个 AI，10 条候选，标题、场景、钩子、成本、差异化都齐了。"
      char_count: 74
      estimated_duration_s: 13.4  # 15s 段位内可容 · 留 1.6s 尾部给 badge fade + hit
      overrun_action: 不改（15s 段位余 1.6s 供 M8 硬切前静默 0.3s + badge 出屏 0.5s 缓冲）

    - m: M8
      time_range: [40, 48]
      text: "10 条里 8 条能用——用 5 判据筛：具体场景、前 3s 钩子、差异化、可拍性、粉丝相关。通过 4 条就能拍。"
      char_count: 48
      estimated_duration_s: 8.7  # 略超 8s 段位 0.7s
      overrun_action: 若报警，改「10 条里 8 条能用——5 判据筛：具体场景、前 3s 钩子、差异化、可拍性、粉丝相关。通过 4 条能拍。」（-4 字节约 0.7s）

    - m: M9
      time_range: [48, 54]
      text: "不是教你用 AI —— 是把我上周 30 分钟搞定下周 5 条的那 4 段 prompt，直接给你。"
      char_count: 41
      estimated_duration_s: 7.4  # 超 6s 段位 1.4s · 需处理
      overrun_action: |
        若报警：改「不是教你用 AI · 是把我 30 分钟搞定下周 5 条的 4 段 prompt · 给你。」
        （-8 字节约 1.4s · 保「30 分钟搞定下周 5 条」+「4 段 prompt」双关键锚）

    - m: M10
      time_range: [54, 58]
      text: "私信『你在做什么账号、想拍什么方向』——我给你 5 条选题。同行互助，不推服务。"
      char_count: 38
      estimated_duration_s: 6.9  # 超 4s 段位 2.9s · 严重 · 必需处理
      overrun_action: |
        方案 A（推荐 · 保 CTA 完整）：改「私信『账号方向』——我给 5 条选题。不推服务。」
        （-16 字节约 2.9s · 保「私信」+「账号方向」+「5 条选题」+「不推服务」核心）
        方案 B：延段位到 54-60s（视频总时长 60s · 抖音 60s 上限内可行）· 但需回改 storyboard M10 time_range

  # ── TTS 时长前置估算硬门（memory: tts-estimate-duration-pre-synth）──
  duration_pre_check:
    required: true
    tool: pipeline/tts/estimate_duration.py
    run_command: python pipeline/tts/estimate_duration.py --config publish/2026-W28/D04-AI帮想视频选题/audio_plan.yaml --output publish/2026-W28/D04-AI帮想视频选题/build/tts_duration_estimate.json
    warning_threshold_pct: 10   # >10% 溢出预警
    fail_threshold_pct: 30      # >30% 溢出 fail-closed
    action_on_fail: |
      按 overrun_action 改稿或改 storyboard 段位 · 改完重跑 estimate_duration.py 直到全段过关
      D03 M7 挤压教训（s2/s10 溢出）若前置就能避免 · D04 已识别 M6/M9/M10 高溢出风险 · 必前置

# ─────────────────────────────────────
# 2. BGM · 默认无（feedback_dense-vo-no-bgm-default）
# ─────────────────────────────────────

bgm:
  enabled: false
  mood: none
  reason: |
    D04 属**密 VO 演示型 + 白天办公场景**：
    - VO 覆盖率 = 55s / 58s = 94.8% ≥ 85% 硬门（feedback_dense-vo-no-bgm-default）
    - M2/M3/M6/M7 屏录 UI 演示（62% 时长）本身有原生 UI 音（打字拟音、点击提示）撑氛围
    - M8 表格判据 + M9 反教程价值锚 + M10 CTA 需权威静默感（BGM 会稀释）
    - 参考 WaytoAGI / 七七 / 浙大猫学长视频均无 BGM · 相同"演示型 + 静态大字"路径
    - 外发命名 *_no_bgm.mp4（直接外发 · 非"预览件"）

  future_upgrade_trigger:
    - metric: M4-M5 段位（3-15s）停留率 < 45%（共情段塌陷）
      action: 评估 M4-M5 加极轻 lo-fi ambient（volume ≤ 0.05 · 无鼓点 · 无 vocal · 3-15s only）
      restriction: |
        - 仍不加 M1 段位 BGM（沉默钉子必须保留）
        - 仍不加 M2/M3/M6/M7 屏录段位 BGM（会盖 UI 原生音）
        - 用户提供 mp3 或剪映自带库 · 禁合成 BGM（feedback_no-synth-bgm）
    - metric: 整片 completion_rate < 30% 且拆解显示 M8-M10 塌陷
      action: 评估 M9-M10 加极低压钢琴 ambient（volume ≤ 0.06 · 承接反教程价值锚情绪落点）
      restriction: 优先"先定情绪再选音乐"（feedback templates/audio_plan §bgm 说明 · piano_ambient / cinematic_minimal）

  global_if_enabled:
    max_volume: 0.08
    duck_on_vo: true
    forbidden:
      - ffmpeg aevalsrc/sine/棕噪合成的假 BGM（feedback_no-synth-bgm）
      - 版权音乐（Taylor Swift / 周杰伦等）· 用剪映自带库或免版权 lo-fi
      - EDM / 高亢营销 BGM（会拉起"AI 一键出爆款"话术观感）
      - 前 3s 有 BGM（会破坏 chaos-punch-reveal 屏录反差冲击）
      - M7 4 段 prompt 演示段位 BGM > 0.03（会压过 badge fade + whoosh 段间过渡）

# ─────────────────────────────────────
# 3. sfx 音效层（视频形态硬门 · BGM off 但 sfx 不 off）
# memory: feedback_sfx-layer-required
# ─────────────────────────────────────

sfx:
  enabled: true
  formula_check:
    ambient_bed: true       # M1-M10 全片白天办公室 ambient 铺底 -22~-24dB
    riser_before_hit: false # 本条不用 riser（屏录反差冲击靠 whoosh + hit 已足 · riser 会拉高教程感）
    hit_on_key_moment: true # M3 大字入 + M5 硬切 + M6 × 3 + M8 打勾 × 8 + M9 × 2 + M10 收尾 均有 hit 打点
  formula_note: |
    寒林招 3（ambient + riser + hit）本条改为「ambient + whoosh + hit」·
    原因：riser 是情感型/悬疑型公式，D04 是演示型 · 用 whoosh 撑段间过渡更适配屏录 UI 节奏
    参考 WaytoAGI / Vibe Motion 视频均无 riser · sfx 主打 whoosh × N + hit × N + tick × N + ambient

  gain_ref_db: -12  # sfx 相对 VO 的 dB 差基线（VO -16 · sfx 平均 -28）
  gain_range_db: [-8, -22]  # hit 最响 -8 · ambient 最轻 -22

  # ── 全时间戳级具体化事件表（对齐 storyboard M1-M10 · 交付给 pipeline sfx.py mix）──
  events:
    # ═══ M1（0-1s · chaos · 静默钉子 · ambient 起）═══
    - sid: sfx01
      kind: ambient
      t_start: 0.0
      duration: 58.0
      gain_db: -24
      src_rel: assets/sfx/ambient/daylight_office_room_tone.wav
      src_backup: assets/sfx/ambient/office_ac_low_hum.wav
      note: "全片白天办公室 ambient 铺底 · AC 低频 + 远处交通 · loop 若素材 <58s"
      fetch_hint: "Freesound.org 搜索 `office room tone daylight` CC0 · 或 `ac hum low frequency`"

    - sid: sfx02
      kind: tick
      t_start: 0.3
      duration: 0.2
      gain_db: -15
      src_rel: assets/sfx/tick/keyboard_hover_tap.wav
      note: "M1 手悬键盘不落拍点 · 增强'要不要打字'迟疑感"
      fetch_hint: "Freesound.org 搜索 `keyboard single tap soft` CC0"

    # ═══ M2（1-1.6s · punch · 打字冲击）═══
    - sid: sfx03
      kind: tick_seq
      t_start: 1.0
      duration: 0.5
      gain_db: -8
      src_rel: assets/sfx/tick/keyboard_typing_14keys.wav
      note: "M2 打字 14 声真实拟音（帮我想 10 个抖音选题 · 14 字 · 30ms/字节奏）· -8dB 相对 VO 靠前"
      fetch_hint: "Freesound.org 搜索 `mechanical keyboard typing sequence` CC0 · 剪辑 14 声"
      alternative: 用户本机 QuickTime 屏录 M2 自带打字音（推荐 · 更同频）

    - sid: sfx04
      kind: tick
      t_start: 1.5
      duration: 0.15
      gain_db: -10
      src_rel: assets/sfx/tick/keyboard_enter_key.wav
      note: "M2 敲回车拍点"
      fetch_hint: "Freesound.org 搜索 `keyboard enter key press` CC0"

    # ═══ M3（1.6-3s · reveal · 反差爆点）═══
    - sid: sfx05
      kind: whoosh
      t_start: 1.8
      duration: 0.3
      gain_db: -10
      src_rel: assets/sfx/whoosh/soft_swish_01.wav
      note: "M3 第 1 次红叉 whoosh（红叉横划打掉「如何做好家居收纳」）"
      fetch_hint: "Freesound.org 搜索 `whoosh transition swish` CC0"

    - sid: sfx06
      kind: whoosh
      t_start: 2.1
      duration: 0.3
      gain_db: -10
      src_rel: assets/sfx/whoosh/soft_swish_02.wav
      note: "M3 第 2 次红叉 whoosh（打掉「浅谈 XX 的重要性」）"


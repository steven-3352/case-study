    系统 /usr/local/bin/ffmpeg 无 libass 编译 · 字幕烧片会 fail
    /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg 是 brew 装的 full 版 · 含 libass · 已在 D02/D03 跑通

  platform_font_sizes:
    douyin: 42pt
    xhs_轮播: 50pt  # 小红书轮播大字更大（站方偏好）

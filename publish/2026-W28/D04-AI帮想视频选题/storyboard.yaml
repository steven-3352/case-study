# 分镜清单 · storyboard · W28D04 AI 帮想视频选题
# 工种：导演（执行）+ 摄像/视觉
# 依赖：
#   - form_competition.md（方案 A · 家族 pipeline · 69/60 分 · 唯一可执行方案）
#   - form_strategy.md（pass_dual_review avg=92 · 10 段 6 种形式 ID · M7 26% <40%）
#   - motion_storyboard.md（pass_single_run · Vibe Motion 主 + WaytoAGI 辅混合 · 10 段 × 9 字段逐秒）
#   - design_language.md（10 色板 · 12 组件 · vA/vB v2 逐镜应用）
#   - retention_beat_sheet.md（9 段 55-58s · 抖音；7 页轮播 · 小红书；65-72s · 视频号）
#   - cover_brief.md（三平台差异化封面策略）
# 状态：draft_self_generated · 2026-07-05
#
# 用于 pipeline：Pexels 白天办公 3800-4200K 新拉 + QuickTime 真机屏录 AI 对话框 4 场次 + drawtext/drawbox 大字 + SVG 覆盖 accent_red 红叉 / accent_soft 淡黄 badge / accent_green 静态打勾 + 分屏静图（马赛克遮挡）+ ffmpeg 合成
# 不走 pipeline/p004 GSAP 场景（motion_tech_plan SKIP · 无 Web 3D/GSAP）
# 不走 integrations/openmontage（openmontage_brief blocked_infrastructure · 见 openmontage_brief.md）
# 推荐流水线：pipeline/p004_video/lib config-driven（pipeline_config.yaml + run_pipeline.py --step all）· 字幕烧录走 gen_subs + /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg + libass

meta:
  content_id: W28D04
  slug: AI帮想视频选题
  script_version: vA  # 抖音主推 chaos-punch-reveal 型（vB v2 备胎见文末 vB_backup_diff）
  platform: douyin  # 视频号同抖音口径（65-72s 加长版差异见 wechat_video_extension）· 小红书 7 页轮播见 xhs_carousel
  duration_s: 58
  canvas: [1080, 1920]  # 9:16
  fps: 30
  bgm_layer: 0  # 密 VO 演示型 · BGM off（feedback_dense-vo-no-bgm-default）
  vo_coverage_target: 0.85  # VO ≥85% 无 3s+ 死区（feedback_dense-vo-no-dead-air）
  sfx_layer: 1  # sfx 4 类必覆盖：whoosh × 4 + tick × 3 + hit × 5-8 + ambient 全片
  subtitle_burn_pipeline: gen_subs + ffmpeg-full libass  # 三平台字号差 42/50/42 by pipeline
  audience_pool: 中腰部创作者·自媒体运营
  skin:
    persona_anchor: 做了 20 年互联网 · 自己在做自媒体引擎的同行
    tone_direction: 同行说话 · 不 preach · 不 sell 秘籍
    landing_intent: 私信喂选题 · 不推付费群/星球/课程 · SLA 24h

# ─────────────────────────────────────
# 抖音 58s · 10 段镜头（vA 主推 · 对应 motion_storyboard §3 逐秒表）
# ─────────────────────────────────────

scenes:
  - id: M1_chaos_daylight_desk
    time_range: [0, 1]
    intent: 停划 · chaos · 白天办公空场
    format_id: chaos_broll
    template: null
    reuse_reason: null
    visual_difference: |
      D02 打工人下班 18:55 傍晚 · D03 深夜 23:12 台灯 · **D04 白天 3800-4200K 摄像头亮红点**（三日光温 / 场景 / 时间戳全不同）
    picture: |
      Pexels 白天办公桌俯拍 3800-4200K + 键盘 + 摄像头亮红点 + 手悬键盘不落 + 空笔记本（页面白）
      构图：俯拍角度 · 桌面 70% 画面 · 键盘居中 · 摄像头右上或右下（红点必须清晰可见）· 空笔记本左侧
      Pexels 素材候选（需新拉 fetch_broll.py）：
        - 关键词组 A：`daylight office desk overhead`（俯拍角度）
        - 关键词组 B：`webcam recording setup`（摄像头亮红点）
        - 关键词组 C：`hand hovering keyboard morning`（手悬键盘）
        - 关键词组 D：`blank notebook desk morning`（空笔记本）
      目标 4-6 条候选 · 优先"俯拍 + 摄像头红点可见 + 白天光"的一条
      若无摄像头红点素材：drawbox 小红点 5×5 覆盖右上角 · 真机风格 · 不做发光特效
    voiceover: null  # 首秒沉默钉子
    subtitle:
      text: null  # 无字幕（1s 认领感靠画面）
      style: null
    audio:
      env: 白天办公环境音 ambient（-24dB · AC 底噪 + 远处交通）
      sfx: [tick 0.3s -15dB 手悬键盘不落拍点]
      bgm: none
    assets_needed:
      - Pexels 白天办公桌 3800-4200K B-roll × 1（新拉 · 目标俯拍 + 摄像头红点 + 空笔记本）
    forbidden:
      - AI 生图书桌 / 键盘 / 摄像头（Q9 chaos_must_be_real_footage 硬拦）
      - HTML 仿真办公桌
      - 深夜暖光 / 傍晚傍光（必须白天 3800-4200K · 与 D03/D02 显式区分）
      - Dracula 霓虹色（gate_check_palette.py 硬拦）

  - id: M2_screen_type_prompt
    time_range: [1, 1.6]
    intent: punch · 屏录 AI 对话框 · 打字冲击
    format_id: broll_demo
    template: null
    picture: |
      QuickTime 真机屏录（macOS 或 iPhone · 建议 ChatGPT 界面 · 识别度高）
      屏幕特写切入（硬切从 M1 俯拍到屏幕特写 · 无过渡镜头 · 同 tick sfx 拍点）
      AI 对话框深色系 · 光标闪（500ms/次）· 手落键盘 · 打字「帮我想 10 个抖音选题」14 字（30ms/字 · 真人节奏）· 敲回车
      保留 iOS/macOS 状态栏 + AI 对话框原生 UI · 不打 AI 工具 logo
      屏录 UI 铁律：禁裁掉状态栏 · 禁抠白底 · 禁加自造装饰性框
    voiceover: null  # VO 从 M4 3s 处才起
    subtitle:
      text: null  # 打字过程本身即视觉字幕
      style:
        font_type: mono 32pt（屏内文字非叠层字幕）
    audio:
      env: 打字声真实拟音（14 声 -8dB · 每字 30ms）
      sfx: [tick 敲回车 -12dB]
      bgm: none
    assets_needed:
      - QuickTime 真机屏录 × 1 场次（M2 部分 · 时长 0.6s · 打字 14 字 + 回车）
      - 打字拟音 14 声（真人录制或 Freesound `keyboard typing single` CC0）
    forbidden:
      - AI 生成的 AI 对话界面
      - HTML 仿真 AI 对话框
      - 打 ChatGPT/DeepSeek/豆包 logo（UI 原生色允许 · logo 遮挡或马赛克）
      - 亮白 #ffffff 底

  - id: M3_reveal_red_cross
    time_range: [1.6, 3]
    intent: reveal · 反差爆点 · AI 输出被红叉打掉
    format_id: broll_demo + svg_overlay + punch_black
    template: null
    picture: |
      QuickTime 屏录续场 · AI 对话框输出 3 条固定文案（可复现 · 家居收纳版）：
        - 「如何做好家居收纳」
        - 「浅谈家居收纳的重要性」
        - 「5 个家居收纳误区」
      3 条 1s 内快速打字机式出现 → 3 次 accent_red `#e53935` 红叉 whoosh 从右上横向划过打掉（每次 0.3s · 静态 SVG + CSS transition · 禁 GSAP 弹跳）
      → display 140pt 白字入「打"帮我想 10 个" / AI 全给"如何做好"」屏中央 · 两行 · 2px canvas_office_dark 深色描边（增强白字在深色屏幕上的可读性）
    voiceover: null  # 3s 前无 VO
    subtitle:
      text: '打"帮我想 10 个" · AI 全给"如何做好"'
      style:
        font: 苹方 · display 140pt · 权重 900
        color: 白字 #f5f5f0 · 2px canvas_office_dark 深色描边
        position: 屏幕中央（两行居中）
        appear_at: 2.4
        exit_at: 3.0
        transition: drawtext 淡入 0.3s
      forbidden: [emoji, 感叹号, 花字, Dracula 紫粉青]
    audio:
      env: 无
      sfx:
        - whoosh × 3 每次 0.3s -10dB（红叉横划）
        - hit × 1 -8dB（大字入拍点 2.4s）
      bgm: none
    assets_needed:
      - QuickTime 真机屏录续场（M2 无缝续 · 时长 1.4s）
      - SVG accent_red 红叉 × 3（静态 · 权重 900 · 4rpx 硬边角）
      - drawtext 苹方字体（PingFang SC / Source Han Sans）
    forbidden:
      - 3D 立体红叉
      - GSAP 弹跳打勾/打叉动画
      - 亮白背景

  - id: M4_group_anchor
    time_range: [3, 8]
    intent: 认领 · 9 成群体锚 · 白天办公实景叠层
    format_id: chaos_broll + punch_black overlay
    template: null
    visual_difference: |
      D03 92% 群体锚 display 160pt 全屏灰底大字 · **D04 9 成群体锚 headline 96pt 白字实景叠层**（显式区分版式）
    picture: |
      Pexels 白天办公 B-roll（主角背影 + 摄像头亮 + 空笔记本 · 白天光 3800-4200K）
      构图：主角背影俯拍或侧影（不露脸 · 保代入性）+ 摄像头亮红点右上或右下 + 空笔记本
      B-roll 静止或缓慢向前推 0.5%/s（几乎不可察觉 · 增加视频感避免静图感）
      3.5s 处：headline 96pt 白字「9 成中腰部创作者遇到选题问题」淡入 0.3s + hold 到 8s
      同时 caption 24pt 白字「引 知乎专栏 A 级」右下角淡入
      Pexels 素材候选（同 M1 白天办公库 · 可复用不同镜头 · 也可新拉）：
        - `hand hovering keyboard morning`
        - `blank notebook desk morning`
        - `behind view of person at desk daylight`
    voiceover: |
      「上周我也这样。9 成中腰部创作者早期都遇到选题问题——不是你的问题。」
    subtitle:
      text_seq:
        - "9 成中腰部创作者遇到选题问题"
      style:
        font: 苹方 · headline 96pt · 权重 700
        color: 白字 #f5f5f0（视 B-roll 光线可调 · 若 B-roll 太亮加 drawbox 半透明黑底衬）
        position: 屏幕中央偏上
        appear_at: 3.5
        exit_at: 8.0
        transition: drawtext 淡入 0.3s
      source_caption:
        text: "引 知乎专栏 A 级"
        font: 苹方 · caption 24pt
        color: 白字 #f5f5f0 · muted 半透明
        position: 屏幕右下角
        appear_at: 3.5
        exit_at: 8.0
      forbidden: [emoji, 感叹号, 无来源标注（弱信任）, 全屏灰底大字（D03 版式禁复用）]
    audio:
      env: 白天办公环境音延续 -20dB
      sfx: [tick 3s 处 -15dB VO 起拍]
      bgm: none
      vo_start: 3.0  # VO 从 3s 处开始覆盖 · 到 58s
    assets_needed:
      - Pexels 白天办公主角背影 B-roll × 1（新拉 · 可与 M1 同库不同镜头）
      - drawtext 苹方字体
    forbidden:
      - AI 生图主角
      - 全屏灰底 display 160pt 大字（D03 92% 版式禁复用）
      - 「必上热门」「一键爆款」等承诺
      - 泛化"打工人焦虑"（D04 群体是中腰部创作者非打工人）

  - id: M5_split_screen_400w_vs_800
    time_range: [8, 15]
    intent: 情绪释放 · 反爆款抱怨 · 40w 赞 vs 800 赞
    format_id: before_after + punch_black
    template: null
    picture: |
      分屏 50/50 · 8s 处 hard cut 硬切进分屏（同 hit sfx 拍点）
      左半屏：同行「40w 赞」爆款截图（马赛克遮挡真实同行头像/账号名 · 只留赞数 + 分类）
      右半屏：「我 800 赞」自己截图（同样马赛克 · 单位显式硬约束"赞"字必须出现 · 避 800 粉起号歧义）
      中间 2px ink_light `#f5f5f0` 白分割线
      9.5s 处：headline 96pt 白字类比锚居中偏下「40w 赞 vs 我 800 赞」drawtext 淡入 0.3s + hold
      10s 处：caption 32pt 副标「翻竞品 30 分钟存 8 张截图 · 一条不想拍」淡入
    voiceover: |
      「你翻了半小时竞品，存了 8 张截图，还是一条不想拍。同行 40w 赞我也拍过——我只有 800。」
    subtitle:
      text_seq:
        - "40w 赞 vs 我 800 赞"  # headline 主大字
        - "翻竞品 30 分钟存 8 张截图 · 一条不想拍"  # caption 副标
      style:
        headline:
          font: 苹方 · headline 96pt · 权重 700
          color: 白字 #f5f5f0
          position: 屏幕中央偏下（分屏图下方 25%）
          appear_at: 9.5
          exit_at: 15.0
        caption:
          font: 苹方 · caption 32pt · 权重 500
          color: 白字 #f5f5f0 · muted 半透明
          position: 屏幕底部
          appear_at: 10.0
          exit_at: 15.0
      forbidden: [emoji, 感叹号, 三分屏以上, 图之间装饰性边框, 无单位"赞"字（vB v2 verdict 硬约束）]
    audio:
      env: 无
      sfx: [hit 8s 硬切拍点 -8dB, hit 9.5s 大字入拍点 -8dB]
      bgm: none
    assets_needed:
      - 真机截图 × 2（40w 赞爆款 + 800 赞自截 · PhotoRoom 或 PixelMator 打马赛克遮挡真实头像/账号名）
      - ffmpeg hstack 分屏 + drawbox 分割线
      - drawtext 苹方字体
    forbidden:
      - 打真实同行 logo / 账号名
      - 三分屏以上
      - 图之间装饰性边框
      - 大字叠图中间遮挡视觉焦点

  - id: M6_wrong_prompt_3_flash
    time_range: [15, 25]
    intent: 反面正解 · 3 段烂 prompt 快切
    format_id: broll_demo + svg_overlay
    template: null
    picture: |
      QuickTime 屏录 3 段快切（每段约 3.3s）· 3 个 AI 对话框实录
      每段结构：
        - 15-15.3s：屏录 1.5s AI 对话展示反例
        - accent_red 2px 描边淡入 0.3s（只在关键错误行不全屏描边）
        - caption 28pt 大字批注 drawtext 淡入 0.3s
        - hit sfx 拍点
      3 段反例：
        ① 「帮我想 10 个」→ AI 通用套话（如「如何做好...」）· 批注「跳过身份卡」
        ② 「加平台词：帮我想 10 个抖音选题」→ 同行都在拍的模板 · 批注「跳过账号定位」
        ③ 让 AI 抄爆款：「帮我想 10 个类似 XX 的选题」→ 换个数字的同质品 · 批注「跳过粉丝痛点」
      段间 whoosh 快速过渡 -12dB
    voiceover: |
      「我以前也这么干：让 AI 帮我想 10 个 → 都是「如何做好 XX」·『加平台词』→ 同行都在拍的模板 · 让 AI 抄爆款 → 换个数字的同质品。」
    subtitle:
      text_seq:
        - "跳过身份卡"
        - "跳过账号定位"
        - "跳过粉丝痛点"
      style:
        font: 苹方 · caption 28pt · 权重 500
        color: 白字 #f5f5f0 · 「跳过 X」文字加 accent_red 描边 1px 强调
        position: 屏幕上方或对齐反例文本
        appear_at_seq: [16.5, 20.0, 23.5]
        exit_at_seq: [18.3, 21.8, 25.0]
        transition: drawtext 淡入 0.3s
      forbidden: [emoji, 全屏描边（视觉负担重）, 装饰性图标]
    audio:
      env: 无
      sfx:
        - hit × 3（每段拍点 · 16.5s / 20s / 23.5s · -8dB）
        - whoosh × 2 段间过渡（18.5s / 22s · -12dB）
      bgm: none
    assets_needed:
      - QuickTime 屏录 × 3 段（3 个 AI 对话框实录 · 反例 prompt 家居收纳版）
      - SVG accent_red 描边 × 3（静态 · 2px）
      - drawtext 苹方字体
    forbidden:
      - 全屏 accent_red 描边（视觉负担重）
      - 装饰性图标
      - emoji
      - 打 AI 工具 logo

  - id: M7_4_prompt_demo_core
    time_range: [25, 40]
    intent: 演示核心 · 4 段 prompt · 收藏动机第一位
    format_id: broll_demo + svg_accent_soft_badge
    template: null
    picture: |
      QuickTime 屏录 AI 对话框深色系 · 主场（15s 连续 · 26% 全片占比 · 单场景最长）
      25-27s：粘贴完整 4 段 prompt（家居收纳版 · JetBrains Mono 32-40pt）全屏可见
      27-40s：AI 表格输出 10 条候选（每条 1s 打字机式出现 · 表格列 = 标题/场景/钩子/成本/差异化）
      accent_soft `#ffc857` 淡黄底 4 段 badge SVG 覆盖（依次淡入 0.5s + 停 3-4s · 4 段总时长 14s 在 15s 段内）：
        - 27.5s：「身份卡」badge 淡入
        - 30.5s：「账号定位」badge 淡入（+ whoosh -12dB 段间过渡）
        - 33.5s：「粉丝痛点」badge 淡入（+ whoosh -12dB）
        - 36.5s：「输出约束」badge 淡入（+ whoosh -12dB）
      底部 caption 28pt「可长按暂停截屏抄」全程 hold（收藏动机点明示）
    voiceover: |
      「换个打开方式。打开 AI，粘上 4 段 prompt：身份卡、账号定位、粉丝痛点、输出约束。同一个 AI，10 条候选，标题、场景、钩子、成本、差异化都齐了。」
    subtitle:
      text_seq:
        - "身份卡"
        - "账号定位"
        - "粉丝痛点"
        - "输出约束"
      style:

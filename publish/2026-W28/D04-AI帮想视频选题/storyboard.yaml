# ─────────────────────────────────────
# 屏录素材清单（真机屏录 · QuickTime · 4 场次）
# ─────────────────────────────────────

screen_recording_checklist:
  device_preference: macOS QuickTime（识别度高 · 保留状态栏方便）
  ai_tool_preference: ChatGPT UI（工具中立 · 但识别度高利于观众 1s 认领 · 不打 logo）
  ui_bottom_line:
    - 保留 iOS/macOS 状态栏
    - 保留 AI 对话框原生 UI
    - 保留光标闪
    - 打字节奏 30ms/字 真人节奏
    - 禁裁掉状态栏
    - 禁抠白底
    - 禁加自造装饰性框
    - 禁打 AI 工具 logo（UI 原生色允许 · logo 遮挡或裁掉）
  sessions:
    - session: S1_M2_M3_reveal
      time_range_in_video: [1, 3]
      duration_needed_s: 2  # 屏录 2s 连续（M2 打字 0.6s + M3 AI 输出 1.4s）
      script: |
        1. 打开 ChatGPT（macOS 或 iPhone）· 新建对话
        2. 光标闪等 0.3s
        3. 输入「帮我想 10 个抖音选题」14 字（30ms/字 · 真人节奏）
        4. 敲回车
        5. AI 输出 3 条「如何做好家居收纳 / 浅谈家居收纳的重要性 / 5 个家居收纳误区」（1s 内快速打字机式）
        6. 保持 AI 对话框深色系
      post_processing:
        - 加 3 次 accent_red 红叉 SVG 覆盖（whoosh 从右上横划打掉 · 每次 0.3s）
        - 2.4s 处加 display 140pt 白字 drawtext「打"帮我想 10 个" · AI 全给"如何做好"」屏中央
    - session: S2_M6_wrong_prompt_3_flash
      time_range_in_video: [15, 25]
      duration_needed_s: 10  # 屏录 3 段 · 每段约 3.3s
      script: |
        3 段独立屏录：
        ① 输入「帮我想 10 个」→ AI 输出通用套话（跳过身份卡）
        ② 输入「加平台词：帮我想 10 个抖音选题」→ AI 输出同行都在拍模板（跳过账号定位）
        ③ 输入「让 AI 抄爆款：帮我想 10 个类似 XX 的选题」→ AI 输出换个数字的同质品（跳过粉丝痛点）
      post_processing:
        - 每段加 accent_red 2px 描边（只在关键错误行 · 不全屏描边）
        - 每段加 caption 28pt 大字批注「跳过身份卡/账号定位/粉丝痛点」drawtext 淡入 0.3s
        - 每段 hit sfx 拍点 · 段间 whoosh 快速过渡
    - session: S3_M7_4_prompt_demo
      time_range_in_video: [25, 40]
      duration_needed_s: 15  # 屏录 15s 连续主场
      script: |
        1. 打开 ChatGPT · 新建对话
        2. 粘贴完整 4 段 prompt（家居收纳版 · JetBrains Mono 32-40pt · 全屏可见）
        3. 敲回车
        4. AI 输出表格（列 = 标题/场景/钩子/成本/差异化 · 10 条候选每条 1s 打字机式出现）
      post_processing:
        - 加 accent_soft `#ffc857` 淡黄底 4 段 badge SVG 覆盖（依次淡入 0.5s + 停 3s · 段名「身份卡 · 账号定位 · 粉丝痛点 · 输出约束」headline 88pt）
        - 段间 whoosh × 3 -12dB
        - 底部 caption 28pt「可长按暂停截屏抄」全程 hold
    - session: S4_vB_M1_scene_anchor  # 仅 vB v2 备胎启用
      condition: vA 3s 完播 <52%
      duration_needed_s: 3
      script: |
        备胎 M1 若走 vB v2：无屏录 · 走 Pexels 白天办公主角背影 + 秒表小字（drawtext 静态）
      note: |
        vB v2 M1 不需要屏录（备胎定位下的场景锚版本 · 无屏录 · 秒表静态）

# ─────────────────────────────────────
# SFX 层清单（4 类必覆盖 · 密 VO 无 BGM）
# ─────────────────────────────────────

sfx_layer:
  bgm: none  # 密 VO 演示型 default off（feedback_dense-vo-no-bgm-default）
  categories:
    ambient:
      count: 1
      description: 白天办公环境音 · 全片氛围铺底
      time_range: [0, 58]
      db: -22
      source: Freesound `office ambient hum daytime` CC0 或 Pexels audio
      forbidden: 合成假 BGM · ffmpeg aevalsrc/sine 拼的（feedback_no-synth-bgm）
    tick:
      count: 3
      events:
        - {time: 1.0, event: M1→M2 硬切拍点, db: -15}
        - {time: 3.0, event: M4 VO 起拍, db: -15}
        - {time: 54.5, event: M10 CTA 起, db: -15}
      source: Freesound `soft tick metronome` CC0
    whoosh:
      count: 4
      events:
        - {time: 1.6, event: M3 红叉 × 3 whoosh 从右上横划, db: -10, duration_s: 0.3 x 3}
        - {time: 30.5, event: M7 段间过渡 badge 2, db: -12}
        - {time: 33.5, event: M7 段间过渡 badge 3, db: -12}
        - {time: 36.5, event: M7 段间过渡 badge 4, db: -12}
      source: Freesound `whoosh short sweep` CC0
    hit:
      count: 8-10  # 上限
      events:
        - {time: 2.4, event: M3 大字入拍点, db: -8}
        - {time: 8.0, event: M5 硬切拍点, db: -8}
        - {time: 9.5, event: M5 大字入拍点, db: -8}
        - {time: 16.5, event: M6 反例 ① 拍点, db: -8}
        - {time: 20.0, event: M6 反例 ② 拍点, db: -8}
        - {time: 23.5, event: M6 反例 ③ 拍点, db: -8}
        - {time: 41-45, event: M8 打勾 × 8 逐个拍点, db: -10}
        - {time: 45.0, event: M8 大结论拍点, db: -8}
        - {time: 52.0, event: M9 大字定格拍点, db: -8}
        - {time: 54.0, event: M9 收尾, db: -8}
        - {time: 57.0, event: M10 收尾, db: -8}
      source: Freesound `impact hit deep short` CC0
  mixer:
    vo_target_lufs: -16  # loudnorm target
    sfx_ducking: VO 起时 sfx 自动 -3dB 避免抢 VO
    ambient_ducking: VO 起时 ambient 自动 -6dB

# ─────────────────────────────────────
# 字幕规格（三平台字号差 · 由 pipeline 烧片）
# ─────────────────────────────────────

subtitle_specs:
  burn_method: gen_subs（SRT/ASS）+ ffmpeg-full libass 烧片（feedback_pipeline-burn-subs）
  ffmpeg_binary: /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg  # 系统 ffmpeg 无 libass
  platform_font_size:
    douyin: 42  # body 层字号（feedback_pipeline-full-platform-output）
    xhs_carousel: 50  # 小红书轮播
    wechat_video: 42  # 视频号
  font_family:
    zh: 苹方 / PingFang SC / Source Han Sans
    en: San Francisco / Inter
    mono: JetBrains Mono / SF Mono
  large_text_categories:
    static_ui_png:
      description: 静态入 UI 大字（M4 数据锚 · M8 表格 · M9 价值锚 · M10 CTA · display/headline 层）
      method: SVG + PNG → ffmpeg overlay
    fast_cut_drawtext:
      description: 快切 drawtext 大字（M3 reveal · M5 分屏 · M7 badge · vB v2 M6 末尾定格「累」）
      method: ffmpeg drawtext + drawbox 白闪
  forbidden:
    - 剪映智能识别（不由剪映烧字幕）
    - 系统 ffmpeg 烧 ASS（无 libass）
    - 42/50/42 差异未按平台切

# ─────────────────────────────────────
# 交付命名（三平台）
# ─────────────────────────────────────

delivery:
  base_dir: publish/2026-W28/D04-AI帮想视频选题/render/
  files:
    - douyin_vA_58s_no_bgm.mp4  # 抖音主推 vA · 无 BGM 直接外发
    - douyin_vB_58s_no_bgm.mp4  # 抖音备胎 vB v2 · 无 BGM
    - xhs_carousel_P1-P7.png  # 小红书 7 页轮播
    - wechat_video_68s_no_bgm.mp4  # 视频号 65-72s 加长版
    - cover_douyin_vA_M3_reveal_2p4s.png  # 抖音封面 · video_frame 从 vA M3 2.4s 取
    - cover_xhs_P1_共情锚.png  # 小红书 P1 封面 · 独立设计
    - cover_wechat_video_reveal.png  # 视频号封面 · 同抖音 vA reveal 帧
  naming_bgm_rule: |
    有 BGM → *_with_bgm.mp4；无 BGM → *_no_bgm.mp4（本条 BGM off · 全走 no_bgm 直接外发 · 非预览件）

# ─────────────────────────────────────
# Fail 检查（承诺-兑现闭环 · 呼应 form_strategy §5）
# ─────────────────────────────────────

fail_check:
  - {item: chaos 用真实素材, method: Pexels 白天办公新拉 + QuickTime 真机屏录 · 禁 AI 生图, gate: Q9 chaos_must_be_real_footage}
  - {item: 真机屏录 AI 对话框, method: QuickTime × 4 场次 · 保留状态栏 · 不打 logo, gate: 屏录 UI 铁律}
  - {item: SVG 打点非 GSAP, method: 静态 SVG + CSS transition + drawtext, gate: motion_tech_plan SKIP}
  - {item: 分屏静图, method: 真机截图 + 马赛克遮挡 · 单位显式"赞"字必须出现, gate: vB v2 verdict 硬约束}
  - {item: ≥3 种观感, method: 6 种形式 ID · 已达标, gate: rules.min_distinct_formats=3}
  - {item: 单场景占比 <40%, method: M7 15s = 26% < 40%, gate: rules.single_scene_max=40}
  - {item: 不打竞品 logo, method: UI 原生色允许 + 同行截图必马赛克遮挡真实头像/账号名, gate: fact_check 红区}
  - {item: 数据锚同帧口径, method: '"10 里 8" = "5 判据 · 通过 4 条" 同帧 caption 28pt 明示（M8）', gate: fact_check 黄区}
  - {item: 4 条原话进片, method: vB v2 M4/M5/M6 末尾 + M4 转述共 4 条 · vA 主推兜底 M4/M9 至少补 1 条否则强制切 vB, gate: 编剧硬门禁 pass}
  - {item: BGM off, method: 密 VO 演示型 default · sfx 4 类必覆盖, gate: feedback_dense-vo-no-bgm-default}
  - {item: VO 覆盖 ≥85%, method: 3-58s VO 全程 · 段间衔接词最大 1.5s 空白, gate: feedback_dense-vo-no-dead-air}
  - {item: M8 表格可读性, method: 表头 headline 42pt · 单元格 body 32pt, gate: design_language 字号约束}
  - {item: M10 CTA 私信 SLA, method: 24h 内回 · 走本人 IP 私信而非群/星球/客服, gate: skin.landing_intent}
  - {item: 无 Dracula 霓虹色, method: 10 色板全符合 · gate_check_palette.py 兜底, gate: feedback_no-neon-palette}

          font: 苹方 · headline 88pt · 权重 700
          background: accent_soft #ffc857 淡黄底
          color: ink #1a1a1a 黑字
          shape: 圆角 4rpx 硬边角 · 无描边
          position: 屏幕右侧或屏幕上方（不遮挡 prompt 内容）
          appear_at_seq: [27.5, 30.5, 33.5, 36.5]
          hold_seq: [3.0, 3.0, 3.0, 3.0]
          transition: fade in 0.5s + hold 3s + fade out 0.5s
        prompt_text:
          font: JetBrains Mono / SF Mono · 32-40pt · 权重 400
          color: 屏内 UI 原生
        bottom_caption:
          text: "可长按暂停截屏抄"
          font: 苹方 · caption 28pt · 权重 400
          color: 白字 #f5f5f0 · muted 半透明
          position: 屏幕底部
          appear_at: 25.5
          exit_at: 40.0
      forbidden: [荧光黄 #ffff00, 4 段挤一屏, 段名彩色, 数字 GSAP 跳动, 每段之间装饰性图标]
    audio:
      env: 无
      sfx:
        - whoosh × 3 段间过渡（30.5s / 33.5s / 36.5s · -12dB）
      bgm: none
    assets_needed:
      - QuickTime 屏录 × 1 主场（15s 连续 · 家居收纳版 4 段 prompt 演示）
      - 4 段 prompt 家居收纳版全文（generated_fact 声明 · 家居收纳 skin 化）
      - SVG accent_soft 淡黄底 badge × 4（静态 · headline 88pt 段名）
      - drawtext 苹方字体（badge 段名 + 底部 caption）
    forbidden:
      - HTML 仿真 AI 对话框
      - GSAP 数字跳动
      - AI 生成的表格输出
      - 打 AI 工具 logo

  - id: M8_5_criteria_table
    time_range: [40, 48]

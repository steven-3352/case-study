  # ═══ M6 · 13.65-24.82s · 3 段烂 prompt 快切（scene 对齐 VO s4 window 11.17s） ═══
  - name: M6_wrong_prompt_3_flash
    total_dur: 11.17
    clips:
      - src_type: img
        src_rel: build/assets_ui/06_m6_wrong_placeholder.png

  # ═══ M9 · 48.12-54.67s · 反教程价值锚 · 全屏灰底大字（scene 对齐 VO s7 window 6.55s） ═══
  - name: M9_anti_tutorial_value
    total_dur: 6.55
    clips:
      - src_type: img
        src_rel: build/assets_ui/09_m9_anti_tutorial_dark.png
        duration: 6.55

  # ═══ M10 · 54.67-59.77s · CTA（scene 对齐 VO s8 window 5.1s · 保 CTA 完整播出） ═══
  - name: M10_cta_options
    total_dur: 5.1
    clips:
      - src_type: img
        src_rel: build/assets_ui/10_m10_cta_dark.png
        duration: 5.1

# ─────────────────────────────────────
# 双平台字号差异（memory: feedback_pipeline-full-platform-output）
# A-fix: 删 weixin · 只做抖音 + 小红书（xhs 形态由形式策略官定 · 本条走视频）
# ─────────────────────────────────────
platforms:
  douyin:
    subs_size: 42
    margin_v: 200
    max_cue_chars: 32
    max_line_chars: 17
  xhs:
    subs_size: 50
    margin_v: 220
    max_cue_chars: 26
    max_line_chars: 14

# ─────────────────────────────────────
# overlays · 叠层大字快切（drawtext 路径 · 补 UI PNG 未覆盖的秒级快切）
# A-fix: 全部 t_start/t_end -3
# ─────────────────────────────────────
overlays:
  # M4 · headline 56pt「9 成中腰部创作者遇到选题问题」
  - text: "9 成中腰部创作者遇到选题问题"
    t_start: 0.5
    t_end: 5.75
    fontsize: 56
    y_expr: h/3
    color: "#f5f5f0"
    borderw: 3
    bordercolor: "#1a1a1a"

  # M4 · caption 24pt 来源
  - text: "引 知乎专栏 A 级"
    t_start: 0.5
    t_end: 5.75
    fontsize: 24
    y_expr: h-80
    color: "#f5f5f0"

  # M5 · caption 32pt 副标
  - text: "翻竞品 30 分钟存 8 张截图 · 一条不想拍"
    t_start: 7.75
    t_end: 13.65
    fontsize: 32
    y_expr: h-120
    color: "#f5f5f0"

  # M6 · caption 28pt × 3 段批注
  - text: "跳过身份卡"
    t_start: 15.15
    t_end: 16.95
    fontsize: 28
    y_expr: h*0.15
    color: "#f5f5f0"
    borderw: 1
    bordercolor: "#e53935"
  - text: "跳过账号定位"
    t_start: 18.65
    t_end: 20.45
    fontsize: 28
    y_expr: h*0.15
    color: "#f5f5f0"
    borderw: 1
    bordercolor: "#e53935"
  - text: "跳过粉丝痛点"
    t_start: 22.15
    t_end: 24.82
    fontsize: 28
    y_expr: h*0.15
    color: "#f5f5f0"
    borderw: 1
    bordercolor: "#e53935"

  # M7 · caption 28pt 底部收藏提示
  - text: "可长按暂停截屏抄"
    t_start: 25.32
    t_end: 39.82
    fontsize: 28
    y_expr: h-100
    color: "#f5f5f0"

  # M8 · caption 28pt 副标
  - text: "5 判据 · 通过 4 条即能用"
    t_start: 45.32
    t_end: 48.12
    fontsize: 28

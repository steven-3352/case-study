# W28D04 pipeline_config.yaml · config-driven flow (memory: p004-lib-config-driven)
# 用途：pipeline/p004_video/run_pipeline.py --config <this> --step all
# ⚠ 不覆盖已 render 的 mp4；如要再跑，先 mv build/ build_bak/
#
# ═══ A-fix (2026-07-05) · 删 0-3s 沉默钉子 ═══
# 教训（memory feedback_dense-vo-no-dead-air）：sfx-mixer P1 未实施 · s1_silence 前 3s 只有 anullsrc
# → 抖音 3s 完播率会崩 · 用户明确拍板：抖音 + 小红书 均删 0-3s
# 变更：
#   - 删 s1_silence · s2-s8 target_start -3
#   - 删 M1/M2/M3 scene · M4-M10 all_start -3
#   - 删 weixin 平台（用户新规：只做抖音 + 小红书）
#   - 新增 tts.target_total_cap: 60（估算门 90% 利用率 warn · 97% fail）
#   - overlays t_start/t_end -3
#
# 依赖对齐：
#   - audio_plan.yaml（voice_id=male-qn-jingying-jingpin · speed=1.08 · emotion=neutral · BGM off · sfx 34 events）
#   - storyboard.yaml（7 段 M4-M10 · 59.77s · 白天办公 3800-4200K · Vibe Motion 主 + WaytoAGI 辅）
#   - form_strategy.md（pass_dual_review avg=92 · 6 硬门全过）
#
# 前置资产（BUILD_NOTES.md 详列）：
#   - assets/broll/raw/*daylight*.mp4（新拉 Pexels 白天办公 3800-4200K）
#   - build/assets_ui/*.png（M5-M10 UI 叠层由 gen_ui_w28d04.py 生成）
#   - assets/sfx/**/*.wav（Freesound CC0 × 10 项 · sfx-mixer 未实施 · 本条不烧入）

content_id: W28D04

paths:
  root_rel: publish/2026-W28/D04-AI帮想视频选题

ffmpeg:
  crf: 20

# ─────────────────────────────────────
# TTS 段落（对齐 audio_plan.yaml.voice.segments · A-fix: 0-3s 已删）
# target_total_cap 60s: 抖音硬上限 · estimate_duration.py 检查 90/97% 利用率
# ─────────────────────────────────────
tts:
  voice_id: male-qn-jingying-jingpin
  base_speed: 1.08
  target_total_cap: 60.0
  segments:
    # ═══ M4 · 0-5s · 群体锚（applied overrun_fallback: -3 字 · 原 +34.6% → 目标 ≤ +10%）═══
    - sid: s2
      target_start: 0.0
      target_dur: 5.0
      emotion: neutral
      speed: 1.08
      text: "上周我也这样。9 成中腰部创作者遇到选题问题——不是你的问题。"
      tail_pad: 0.15
      original_text: "上周我也这样。9 成中腰部创作者早期都遇到选题问题——不是你的问题。"
      overrun_applied: "-3 字（删'早期都'）· 2026-07-05 first-run gate fail 34.6% 后启用"

    # ═══ M5 · 5-12s · 反爆款抱怨（applied overrun_fallback: -3 字 · 原 +25.4% → 目标 ≤ +10%）═══
    - sid: s3
      target_start: 5.0
      target_dur: 7.0
      emotion: neutral
      speed: 1.08
      text: "翻了半小时竞品，存 8 张截图，一条不想拍。同行 40w 赞我也拍过——我只有 800。"
      tail_pad: 0.20
      original_text: "你翻了半小时竞品，存了 8 张截图，还是一条不想拍。同行 40w 赞我也拍过——我只有 800。"
      overrun_applied: "-4 字（删'你'/'了了'/'还是'）· 2026-07-05 first-run warn 25.4% 后启用"

    # ═══ M6 · 12-22s · 反面正解（识别高溢出风险 · char=62 est=11.2s）═══
    - sid: s4
      target_start: 12.0
      target_dur: 10.0
      emotion: neutral
      speed: 1.10
      text: "我以前也这么干：让 AI 帮我想 10 个 → 都是「如何做好 XX」。加平台词 → 同行都在拍的模板。让 AI 抄爆款 → 换个数字的同质品。"
      tail_pad: 0.20
      overrun_fallback: "以前也这么干：让帮我想 10 个 → 都是「如何做好 XX」。加平台词 → 同行都在拍。让抄爆款 → 换数字的同质品。"

    # ═══ M7 · 22-37s · 4 段 prompt 演示核心（15s 段位 · char=74 est=13.4s 安全）═══
    - sid: s5
      target_start: 22.0
      target_dur: 15.0
      emotion: neutral
      speed: 1.08
      text: "换个打开方式：打开 AI，粘上 4 段 prompt——身份卡、账号定位、粉丝痛点、输出约束。同一个 AI，10 条候选，标题、场景、钩子、成本、差异化都齐了。"
      tail_pad: 0.30

    # ═══ M8 · 37-45s · 5 判据表格（applied overrun_fallback: -4 字 · 原 +22.5% → 目标 ≤ +10%）═══
    - sid: s6
      target_start: 37.0
      target_dur: 8.0
      emotion: neutral
      speed: 1.08
      text: "10 条里 8 条能用——5 判据筛：具体场景、前 3s 钩子、差异化、可拍性、粉丝相关。通过 4 条能拍。"
      tail_pad: 0.20
      original_text: "10 条里 8 条能用——用 5 判据筛：具体场景、前 3s 钩子、差异化、可拍性、粉丝相关。通过 4 条就能拍。"
      overrun_applied: "-4 字（删'用'/'就'）· 2026-07-05 first-run warn 22.5% 后启用"

    # ═══ M9 · 45-51s · 反教程价值锚（识别高溢出风险 · char=41 est=7.4s）═══
    - sid: s7
      target_start: 45.0
      target_dur: 6.0
      emotion: neutral
      speed: 1.10
      text: "不是教你用 AI —— 是把我上周 30 分钟搞定下周 5 条的那 4 段 prompt，直接给你。"
      tail_pad: 0.25
      overrun_fallback: "不是教你用 AI · 是把我 30 分钟搞定下周 5 条的 4 段 prompt · 给你。"

    # ═══ M10 · 51-55s · CTA（applied overrun_fallback: -16 字 · 原 +81% → 目标 ≤ +10%）═══
    - sid: s8
      target_start: 51.0
      target_dur: 4.0
      emotion: neutral
      speed: 1.08
      text: "私信「账号方向」——我给 5 条选题。不推服务。"
      tail_pad: 0.30
      original_text: "私信「你在做什么账号、想拍什么方向」——我给你 5 条选题。同行互助，不推服务。"
      overrun_applied: "-19 字 · 2026-07-05 first-run gate fail 81% 后启用 · 保「私信」+「账号方向」+「5 条选题」+「不推服务」核心"

# ─────────────────────────────────────
# scenes（对齐 storyboard.yaml.scenes · A-fix 后 7 段 M4-M10）
# 时长严格对齐 audio_plan.yaml.voice.segments.time_range
# ─────────────────────────────────────
scenes:
  # ═══ M4 · 0-5.75s · 群体锚 · 白天办公主角背影 + headline 叠层（scene 对齐 VO s2 window 5.75s） ═══
  - name: M4_group_anchor_daylight
    total_dur: 5.75

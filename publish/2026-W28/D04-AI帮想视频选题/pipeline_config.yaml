  # ═══ M8 · 39.82-48.12s · 5 判据表格（scene 对齐 VO s6 window 8.3s） ═══
  - name: M8_5_criteria_table
    total_dur: 8.3
    clips:
      - src_type: img
        src_rel: build/assets_ui/08_m8_5criteria_table_dark.png

week_id: "2026-W28"
title: "曝光优先 · AI 破圈测试周（B端 1 vs C端 6）"
start_date: "2026-07-06"
end_date: "2026-07-12"
goal: "用 7 条主视频做「B端 1 vs C端 6 池」曝光对比测试，找到本项目在双平台的最大受众池"

# 2026-07-04 战略变更（DECISIONS Q10）· 2026-07-04 二次调整（本次 C 方案）:
# 原 W28 内核「业务流程 × AI 化判断」锁死在企业决策者（老板/管理者）圈层。
# 本次改为「AI 到底能帮你做点什么」多受众破圈测试周：
#   - D01 保留老板圈选题（已进生产），作为 B 端对照组
#   - D02–D07 全部换成 6 个 C 端受众池，测破圈潜力
# 每条 D0X 的完整 skin 见对应 DXX/insights/topic_brief.md，本文件仅保留 week 层调度信息。
skin_registry:
  D01: publish/2026-W28/D01-土但值钱的AI工具/insights/topic_brief.md         # B端对照·中小老板
  D02: publish/2026-W28/D02-打工人5分钟出周报/insights/topic_brief.md          # C端·打工人
  D03: publish/2026-W28/D03-AI陪练英语口语/insights/topic_brief.md             # C端·学生/学英语党
  D04: publish/2026-W28/D04-AI帮想视频选题/insights/topic_brief.md             # C端·内容创作者
  D05: publish/2026-W28/D05-接单党AI写方案/insights/topic_brief.md             # C端·自由职业者/接单党
  D06: publish/2026-W28/D06-AI改简历不用找人改/insights/topic_brief.md         # C端·求职党
  D07: publish/2026-W28/D07-家长陪孩子学英语/insights/topic_brief.md           # C端·家长/宝妈

cadence:
  douyin: daily · 19:30
  xhs: daily · 12:30
  per_week: 14

strategy:
  north_star: exposure
  content_kernel: "AI 到底能帮你做点什么？"
  test_hypothesis: |
    在同一账号下并行发 7 条不同受众池的选题，1 周内看双平台推流反馈，
    确认三个问题：
    (1) B 端（中小老板圈）vs C 端（打工人/学生/创作者/接单/求职/家长）哪边跑得动
    (2) C 端 6 池之间，哪 1-2 池在本账号双平台上有明显推流优势
    (3) 破圈池的私信 / 收藏 / 评论质量能否承接项目「等私信」转化路径
  platform_split:
    douyin: "45-75秒真人/场景剧/演示型视频；每条前 3 秒必须有具体钉子场景（不是抽象口号）"
    xhs: "6-8页图文轮播为主；封面钉子场景 + 数字反差；正文清单可保存"
  cta: "每条按本条 skin 的 landing_intent 定制；不统一 CTA（不同池子聊的东西不同）"

principles:
  - 每条独立受众池，不共享钩子，不共享文案，不共享 CTA。
  - 每条 topic_brief.skin 必须写 differ_from_last，防止「6 池实际同质」。
  - D01 老皮肤（老板圈）保留在生产管线，作为 B 端曝光对照。
  - 抖音 ≠ 小红书：分立项、分脚本、分形式（W26 教训 · SYSTEM §3.1e）。
  - 每条曝光/互动数据分池归档；周末做「破圈池排行」进 evolution_apply.py。
  - 破圈池的 CTA 不硬拉私信；打工人/学生池以「收藏 + 评论问 prompt」为主要转化信号。


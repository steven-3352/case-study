env_audio_note: |
  D05 全片 ambient 层已并入 sfx01 (暖光晨光 ambient -24dB)
  M1/M2 睡姿场景由 ambient + 手机推送 × 3 撑
  M3-M10 白天转场后 ambient 延续 · 不再单列 env_audio

# ─────────────────────────────────────
# 5. 字幕 · pipeline 自动烧
# ─────────────────────────────────────

subtitles:
  srt_path: publish/2026-W28/D05-AI帮我一周活干成一天/subtitles/vA.srt
  ass_path: publish/2026-W28/D05-AI帮我一周活干成一天/subtitles/vA.ass
  srt_backup_path: publish/2026-W28/D05-AI帮我一周活干成一天/subtitles/vB.srt
  burn: true
  burn_engine: /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg
  burn_engine_reason: |
    系统 /usr/local/bin/ffmpeg 无 libass 编译 · 字幕烧片会 fail
    /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg 是 brew 装的 full 版 · 含 libass

  platform_font_sizes:
    douyin: 42pt
    xhs_轮播: 50pt          # xhs 轮播大字更大
    wechat_video: 42pt      # 本条不做视频号 · 保留 fallback

  # 大字分类 (feedback_pipeline-full-platform-output)
  static_vs_drawtext_split:
    static_png_ui:
      - M1 iOS 通知条 3 条 (推送内容 · 屏内原生 UI)
      - M4 5 AI 图标网格 (SVG 图标 · 无 drawtext)
      - M5 n8n workflow 半成品 UI (mock · 每节点红标 SVG)
      - M6 打字 vs 微信客户沟通分屏 mock
      - M7 三层堆叠 UI (Notion + Cursor + n8n 卡 · SVG 静态)
      - M8 60/20/20 表格 (SVG 表格结构)
    drawtext_fast_switch:
      - M2 display 90pt 双行「我睡着的时候 / 系统已经跑完了昨晚的活」
      - M3 headline 96pt 血红「40h/周 → 8h/周」+ caption 24pt 副标
      - M4 headline 72pt 白字「切来切去 40 min 没了」+ caption 24pt「少数派原话」
      - M5 headline 66pt 血红「② 3 月搭完美流 → 更累」
      - M6 headline 60pt 血红「③ 自动化最容易 → 省 10 min 累 6h」
      - M7 每层 50pt 白字标签 (第 1/2/3 层 · Notion/Cursor/n8n) + "散架"血红 pop
      - M8 数字 96pt (60/20/20) + 底注 42pt (动作 3 行) · SVG 表格结构叠 drawtext 数字
      - M9 display 100pt 双行「AI 帮我解放 / 不是帮我印钞机」
      - M10 headline 88pt 血红 CTA「私信『项目+卡点』→ 可自动化的第 1 步」

  style: |
    主画面叠字规则 (对齐 storyboard M1-M10):
      M1 (0-1.6s): 无 drawtext (iOS 推送本身即视觉字幕)
      M2 (1.6-3s): display 90pt 白字双行 · 思源黑体 Heavy · 黑蒙层上无描边
      M3 (3-8s): headline 96pt 血红居中 + caption 24pt 副标
      M4 (8-15s): headline 72pt 白字 + caption 24pt 灰字「少数派原话」
      M5 (15-20s): headline 66pt 血红屏底
      M6 (20-25s): headline 60pt 血红屏底
      M7 (25-40s): 每层 50pt 白字侧标 + 39s "散架"血红 pop + caption 24pt 底部「可长按暂停截屏」
      M8 (40-48s): 数字 96pt + 底注 42pt · 血红 (60%) + 白字 (20%)
      M9 (48-54s): display 100pt 白字双行居中 · fade-in 500ms
      M10 (54-58s): headline 88pt 血红 · 上下浮动 3px
    前 1.6s: 无字幕 (M1 iOS 通知条自带) · 1.9s M2 大字入
    字幕分类: static PNG (UI 内容 + SVG 表格/badge) vs drawtext (叠层大字快切)

  hook_first_3s: false           # M1 iOS 通知条自带内容 · M2 大字入 1.9s
  hook_at: 1.9                   # M2 display 90pt 双行入
  vo_align: true                 # M3-M10 字幕与 VO 逐句对齐


assets_prep:
  need_from_user:
    - name: 睡姿俯拍 B-roll 或 iPhone 内部拍
      note: |
        M1/M2 睡姿俯拍 3800-4200K 暖光晨光 · 时长 3s
        Pexels 关键词候选: `morning bed sleeping overhead` `waking up looking at phone`
        目标: 俯拍 + 主角一只眼睁开 + 手机屏可放大特写
    - name: Pexels 凌晨 1 点桌面 B-roll
      note: M3 左分屏 · 关键词 `night desk laptop lonely blue light`
    - name: Pexels 08:00 起床看手机 B-roll
      note: M3 右分屏 · 关键词 `morning wake up phone bed`

  sfx_can_auto_fetch:
    - name: morning_bedroom_room_tone
      spec: 暖光晨光 ambient · 3-8s 可 loop · -24dB
      how: Freesound.org `morning bedroom ambient birds distant` CC0
      backup: 剪映自带 SFX 库搜索`卧室氛围音`

    - name: ios_notification_soft
      spec: iOS 原生 notification tone · 0.3s · -8dB
      how: Freesound.org `iphone notification sound soft` CC0

    - name: impact_boom_soft
      spec: hit 拍点 · 0.3-0.4s · -8dB
      how: Freesound.org `impact soft boom cinematic` CC0

    - name: impact_hard_cut
      spec: hit 硬切 · 0.3s · -8dB
      how: Freesound.org `impact hard cut stinger` CC0

    - name: impact_boom_deep
      spec: M9 深长 hit · 0.5s · -8dB
      how: Freesound.org `impact deep resonance cinematic` CC0

    - name: soft_swish_transition
      spec: whoosh 段间过渡 · 0.4s · -10dB
      how: Freesound.org `whoosh transition swish soft` CC0
      backup: 剪映自带 SFX 库`转场音效`

    - name: subtle_tap_ui
      spec: tick 轻拍点 · 0.15s · -12dB
      how: Freesound.org `subtle ui tap soft` CC0

  bgm_prep: null  # 本条默认无 BGM

# ─────────────────────────────────────
# 8. QC 清单
# ─────────────────────────────────────

qc:
  vo:
    - VO 清晰可辨 (人工听 30s · 尤其 M7 25-40s 三层演示 · M8 40-48s 60/20/20 表格)
    - VO 覆盖 ≥85% (3-58s 段位 55s / 58s = 94.8%) ✅
    - 前 3s (M1/M2) 无 VO 是设计 · 由 ambient + iOS 推送 × 3 + hit 撑满 · 非死区
    - 无 3s+ 死区
    - loudnorm 目标 -16 dB
    - "**TTS 时长前置估算硬门**: estimate_duration.py 报告全段 ≤10% 溢出 · M3/M7 高溢出必处理"
    - voice_id male-qn-jingying-jingpin · emotion=neutral · speed=0.96

  bgm:
    - BGM off · 外发文件名带 `_no_bgm` 后缀 · 非"预览件"
    - reason 记明依据 (密 VO 演示型 + 白天卧室→办公场景)
    - future_upgrade_trigger 已声明

  sfx:
    - sfx.enabled=true · formula_check 三项至少 2 项为 true (ambient_bed + hit_on_key_moment)
    - sfx 覆盖: 每场景切换均有 whoosh 或 hit · whoosh × 3 + hit × 17 + tick × 8 + ambient × 1 达标
    - sfx 音量: 所有 events[].gain_db ≤ -8 · 全部在 [-8, -22] 内
    - sfx 合规: 所有 src_rel 走 assets/sfx/* 真素材库 · 禁 aevalsrc/sine 合成
    - VO ducking: VO 起时 ambient + tick + whoosh 降 6dB · hit 不 duck

  subtitles:
    - 字幕由 pipeline 生 SRT/ASS + ffmpeg-full libass 烧进 mp4
    - 使用 /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg
    - 双平台字号: 抖音 42pt · 小红书轮播 50pt (视频号本条不做)
    - static PNG vs drawtext 分类明确
    - M1 前 1.6s 无 drawtext 是设计 (iOS 通知条自带)
    - M2 大字入点 1.9s 与 hit sfx 2.4s (M2 显示定格 400ms 后 hit 打点强化)
    - 字幕与 VO 逐句对齐 (vo_align=true)

  outputs:
    - 外发文件带 `_no_bgm` 后缀 (抖音 1 个 + xhs 7 张轮播)
    - 未使用真实竞品 logo (Notion/Cursor/n8n UI 原生色允许 · logo 禁)
    - 未使用合成 BGM/sfx
    - tts_duration_estimate.json 已生成 · 无 >30% 溢出段
    - sfx_mix.log 已生成 · 无 gain_db 越界事件


      note: "M8 第 3 列底注 (含参考不套用小字)"

    # M9 (48-54s · 反印钞机价值锚)
    - sid: sfx27
      kind: hit
      t_start: 49.0
      duration: 0.5
      gain_db: -8
      src_rel: assets/sfx/hit/impact_boom_deep.wav
      note: "M9 display 100pt 双行「AI 帮我解放 / 不是帮我印钞机」深长 hit 落地"
      fetch_hint: "Freesound.org `impact deep resonance cinematic` CC0"

    # M10 (54-58s · CTA)
    - sid: sfx28
      kind: hit
      t_start: 54.5
      duration: 0.4
      gain_db: -8
      src_rel: assets/sfx/hit/impact_boom_soft.wav
      note: "M10 CTA 88pt 血红字入拍点"

    - sid: sfx29
      kind: hit
      t_start: 57.5
      duration: 0.5
      gain_db: -8
      src_rel: assets/sfx/hit/impact_boom_soft.wav
      note: "M10 全片收尾拍点 · fade-out 500ms"

  # sfx 统计 (QC 硬门校验用)
  stats:
    ambient_count: 1      # sfx01 全片
    tick_count: 8         # sfx08-12 (M4 图标 × 5) + sfx24-26 (M8 底注 × 3)
    whoosh_count: 3       # sfx17-19 (M7 三层 × 3)
    hit_count: 17         # sfx02-04 (M1 推送 × 3) + sfx05 (M2 大字) + sfx06-07 (M3 × 2) + sfx13 (M4) + sfx14 (M5) + sfx15-16 (M6 × 2) + sfx20 (M7 散架) + sfx21-23 (M8 数字 × 3) + sfx27 (M9) + sfx28-29 (M10 × 2)
    total_events: 29

  # VO ducking 规则
  vo_ducking:
    enabled: true
    ducking_amount_db: -6
    ducking_attack_ms: 100
    ducking_release_ms: 300
    scope: [ambient, tick, whoosh]  # hit 不 duck
    tool: pipeline/lib/sfx.py mix_sfx_with_vo · 若未实装走 ffmpeg sidechaincompress


# ─────────────────────────────────────
# 1. 配音 (Voice) · MiniMax speech-2.8-turbo
# ─────────────────────────────────────

voice:
  engine: minimax
  model: speech-2.8-turbo
  voice_id: male-qn-jingying-jingpin
  voice_id_rationale: |
    D05 skin.tone_direction「同行说话 · 不打鸡血 · 不 sell 秘籍 · 反教程反印钞机」
    → 沉稳男声匹配"做了 20 年互联网 · 一人公司"
    male-qn-jingying-jingpin 稳、克制、非博主感
    与 D04 相同 voice_id · emotion=neutral 保持一致 (同"同行"人设)
    speed 0.96 (略比 D04 0.98 慢 · 因本条价值锚更重 · 需消化时间)
  备选路线:
    - 1_female_shaonv_luyin: 若首轮数据回填测出女性受众更强
    - 2_user_real_recording: 首选 · 消除 AI 音色 gap · 若用户愿录
  ai_voice_gap_note: |
    memory feedback_ai-voice-known-gap 已识别 MiniMax 真诚青年破绽 4 类
    D05 属演示型 (三层 UI + 表格占 40% 时长 · AI 音色 gap 影响面小)
    触发切人声条件: 投后差评"AI 味太重" >15% 或 用户愿录样本

  speed: 0.96
  pitch: 0
  emotion: neutral
  script_path: publish/2026-W28/D05-AI帮我一周活干成一天/scripts/vA.md
  script_backup_path: publish/2026-W28/D05-AI帮我一周活干成一天/scripts/vB.md
  loudnorm:
    target: -16
    LRA: 11
    TP: -1.5

  # VO segments 逐段 (对齐 storyboard M1-M10 · 前 3s 无 VO)
  # 铁律: 无 3s+ 死区 (M1/M2 由 ambient + 推送音 × 3 + tick + hit 填充 · 不算死区)
  segments:
    # 0-3s 无 VO (M1_chaos_sleep_push + M2_reveal_bigtext · 沉默钉子)

    - m: M3
      time_range: [3.0, 8.0]
      text: "上周我也这样 · 凌晨 1 点还在改方案 · 早上继续跟单。这个项目做通之后 · 我一周的活干成了一天。"
      char_count: 45
      estimated_duration_s: 8.6   # 5.5 chars/sec × 0.96 → 8.5s · 略超 5s 段位 3.6s
      overrun_action: |
        方案 A (推荐): 精简→「上周我也这样 · 凌晨 1 点还在改方案。这项目做通后 · 一周活干成一天。」
        (-14 字节约 2.7s · 保"凌晨 1 点/一周活干成一天"双关键锚)
        方案 B: 延段位到 3-8.5s (M4 起点后推 0.5s)

    - m: M4
      time_range: [8.0, 15.0]
      text: "一人公司都想装 AI · 大多数装了 5 个用不起来——每天切来切去 40 分钟没了。"
      char_count: 38
      estimated_duration_s: 7.2   # 略超 7s 段位 0.2s · 可容
      overrun_action: 不改 (M4 段位 7s · 略超 0.2s 可容忍)

    - m: M5
      time_range: [15.0, 20.0]
      text: "或者花 3 个月搭个完美 workflow · 每步都要人 review · 更累。"
      char_count: 32
      estimated_duration_s: 6.1   # 超 5s 段位 1.1s
      overrun_action: |
        若报警: 改→「或花 3 月搭完美 workflow · 每步都要 review · 更累。」
        (-6 字节约 1.1s · 保"3 月/完美 workflow/更累"三锚)

    - m: M6
      time_range: [20.0, 25.0]
      text: "或者只自动化打字这种 10 分钟的活 · 客户沟通 6 小时的活一个字没碰。"
      char_count: 34
      estimated_duration_s: 6.5   # 超 5s 段位 1.5s
      overrun_action: |
        若报警: 改→「或只自动化 10 分钟的打字 · 6 小时客户沟通一个字没碰。」
        (-8 字节约 1.5s · 保"10 min/6h"双数字锚)

    - m: M7
      time_range: [25.0, 40.0]
      text: "解法是顺序不能反——先自己做一遍 · SOP 记 Notion。再让 Claude 按 SOP 出草稿 · Cursor 存 prompt 模板。最后 n8n 把 SOP 串成 workflow · 系统跑。跳过 SOP 直接搭自动化 · 需求一改整套散架。"
      char_count: 96
      estimated_duration_s: 18.3   # 超 15s 段位 3.3s · **本片最高风险段**
      overrun_action: |
        方案 A (推荐 · 保 3 层顺序完整): 精简→
        「顺序不能反——先自己做一遍 · SOP 记 Notion。再让 Claude 按 SOP 出草稿。最后 n8n 把 SOP 串成 workflow。跳过 SOP · 需求一改整套散架。」
        (-24 字节约 3.5s · 保"3 层顺序"骨架 + "散架"反证 · 精简 Cursor 描述)
        方案 B: 延段位到 25-42s · M8 段位相应压缩 42-49s

    - m: M8
      time_range: [40.0, 48.0]
      text: "每天分配是——60% 塞给 AI · 20% 塞给自动化 · 20% 保留给你决策。是我的项目实测 · 请参考不套用。"
      char_count: 47
      estimated_duration_s: 8.9   # 略超 8s 段位 0.9s
      overrun_action: |
        若报警: 改→「每天分配——60% 塞 AI · 20% 自动化 · 20% 你决策。我的项目实测 · 参考不套用。」
        (-11 字节约 2.1s · 保"60/20/20 + 参考不套用"双关键锚)

    - m: M9
      time_range: [48.0, 54.0]
      text: "我不是教你搞钱 · 是给你看我怎么把自己解放的。AI 帮我解放 · 不是帮我印钞机。"
      char_count: 37
      estimated_duration_s: 7.0   # 超 6s 段位 1.0s
      overrun_action: |
        若报警: 改→「不是教你搞钱 · 是给你看我怎么把自己解放。AI 帮我解放 · 不是印钞机。」
        (-6 字节约 1.1s · 保"解放/不是印钞机"双锚)

    - m: M10
      time_range: [54.0, 58.0]
      text: "私信『我在做什么项目 · 卡在哪』——我给你可自动化的第 1 步。"
      char_count: 28
      estimated_duration_s: 5.3   # 超 4s 段位 1.3s
      overrun_action: |
        方案 A (推荐 · 保 CTA 完整): 改→「私信『项目+卡点』——我给你可自动化的第 1 步。」
        (-10 字节约 1.9s · 保"项目+卡点/可自动化的第 1 步"双锚)
        方案 B: 延段位到 54-59s (视频总时长 59s 抖音上限内)

  # TTS 时长前置估算硬门 (memory: tts-estimate-duration-pre-synth)
  duration_pre_check:
    required: true
    tool: pipeline/tts/estimate_duration.py
    run_command: python pipeline/tts/estimate_duration.py --config publish/2026-W28/D05-AI帮我一周活干成一天/audio_plan.yaml --output publish/2026-W28/D05-AI帮我一周活干成一天/build/tts_duration_estimate.json
    warning_threshold_pct: 10   # >10% 溢出预警
    fail_threshold_pct: 30      # >30% 溢出 fail-closed
    action_on_fail: |
      按 overrun_action 改稿或改 storyboard 段位 · 改完重跑 estimate_duration.py 直到全段过关
      **本条已识别高溢出风险段**:
        - M7 (15s / 96 chars / 估 18.3s / 溢出 22%) → 方案 A 精简 -24 字节
        - M3 (5s / 45 chars / 估 8.6s / 溢出 72%) → 方案 A 精简 -14 字节 **必需处理**
        - M5/M6/M9/M10 均 20-33% 溢出 · 需处理

# ─────────────────────────────────────
# 2. BGM · 默认无
# ─────────────────────────────────────

bgm:
  enabled: false
  mood: none
  reason: |
    D05 属**密 VO 演示型 + 白天卧室→办公场景**:
    - VO 覆盖率 = 55s / 58s = 94.8% ≥ 85% 硬门
    - M1 睡姿 ambient 已有暖光晨光真实痕迹 (远处鸟鸣 + 室内空气声) · BGM 会稀释
    - M7 三层堆叠 UI (25-40s) 需权威静默感 · 收藏动机第一位 · BGM 会稀释
    - M8 60/20/20 表格 (40-48s) 收藏动机第二位 · 同 · BGM 会稀释
    - M9 反印钞机价值锚 (48-54s) 需情绪落点 · BGM 会稀释
    - 参考 WaytoAGI / 七七 / 浙大猫学长视频均无 BGM · 相同"演示型 + 静态大字"路径
    - 外发命名 *_no_bgm.mp4 (直接外发 · 非"预览件")

  future_upgrade_trigger:
    - metric: M3 段位 (3-8s) 停留率 <45% (共情段塌陷)
      action: 评估 M3 加极轻 lo-fi ambient (volume ≤0.05 · 无鼓点 · 3-8s only)
      restriction: 仍不加 M1/M2 段位 BGM (沉默钉子必保) · 用户提供 mp3 或剪映自带库 · 禁合成
    - metric: 整片 completion_rate <30% 且拆解显示 M9-M10 塌陷
      action: 评估 M9-M10 加极低压钢琴 ambient (volume ≤0.06 · 承接反印钞机情绪落点)

  global_if_enabled:
    max_volume: 0.08
    duck_on_vo: true
    forbidden:
      - ffmpeg aevalsrc/sine/棕噪合成的假 BGM
      - 版权音乐 · 用剪映自带库或免版权 lo-fi
      - EDM / 高亢营销 BGM (会拉起"AI 一键印钞"话术观感 · 与 M9 反印钞机冲突)
      - 前 3s BGM (会破坏推送 3 声 chaos punch)

# ─────────────────────────────────────
# 3. sfx 音效层 (视频形态硬门 · BGM off 但 sfx 不 off)
# ─────────────────────────────────────

sfx:
  enabled: true
  formula_check:
    ambient_bed: true
    riser_before_hit: false   # 演示型不用 riser
    hit_on_key_moment: true
  formula_note: |
    寒林招 3 (ambient + riser + hit) 本条改为「ambient + whoosh + hit + tick」
    参考 WaytoAGI / Vibe Motion 视频均无 riser
    D05 特色: 手机推送 × 3 (M1) + 三层 whoosh × 3 (M7) + 60/20/20 hit × 3 (M8) 三段拍点密集

  gain_ref_db: -12
  gain_range_db: [-8, -22]

  # 全时间戳级具体化事件表 (对齐 storyboard M1-M10)
  events:
    # M1 (0-1.6s · chaos + punch · 睡姿 + 手机推送 3 声)
    - sid: sfx01
      kind: ambient
      t_start: 0.0
      duration: 58.0
      gain_db: -24
      src_rel: assets/sfx/ambient/morning_bedroom_room_tone.wav
      src_backup: assets/sfx/ambient/quiet_room_tone.wav
      note: "全片暖光晨光 ambient 铺底 · 远处鸟鸣 + 室内空气声 · loop 若素材 <58s"
      fetch_hint: "Freesound.org `morning bedroom ambient birds distant` CC0"

    - sid: sfx02
      kind: hit
      t_start: 1.0
      duration: 0.3
      gain_db: -8
      src_rel: assets/sfx/hit/ios_notification_soft.wav
      note: "M1 手机推送 1 · iOS 原生 notification tone"
      fetch_hint: "Freesound.org `iphone notification sound soft` CC0"

    - sid: sfx03
      kind: hit
      t_start: 1.2
      duration: 0.3
      gain_db: -8
      src_rel: assets/sfx/hit/ios_notification_soft.wav
      note: "M1 手机推送 2"


# W28D05 pipeline_config.yaml · config-driven flow (memory: p004-lib-config-driven)
# 用途：pipeline/p004_video/run_pipeline.py --config <this> --step all
# ⚠ 不覆盖已 render 的 mp4；如要再跑，先 mv build/ build_bak/
#
# 依赖对齐:
#   - audio_plan.yaml (voice_id=male-qn-jingying-jingpin · base_speed=1.08 · emotion=neutral · BGM off · sfx 29 events)
#   - storyboard.yaml (10 段 M1-M10 · 58s · 卧室→办公 · Vibe Motion + 静态 UI 混合)
#   - form_strategy.md (pass_dual_review 92/85 · 6 硬门全过)
#   - motion_storyboard.md (pass_single_run · 无 GSAP)
#
# 溢出策略 (audio_plan overrun_action 已内联):
#   - M3 char=45 est=8.6s / 5s → 精简 -14 字 (原 72% 溢出)
#   - M7 char=96 est=18.3s / 15s → 精简 -24 字 (原 22% 溢出)
#   - M5/M6/M9/M10 均精简至 target ≤10% 溢出内
#   - target_total_cap 60s
#
# 前置资产 (BUILD_NOTES.md 详列):
#   - assets/broll/raw/*morning_bed*.mp4 (Pexels 睡姿 · 需拉)
#   - assets/broll/raw/*night_desk*.mp4  (Pexels 凌晨桌面 · 需拉)
#   - assets/broll/raw/*morning_wake*.mp4 (Pexels 起床看手机 · 需拉)
#   - build/assets_ui/*.png (M1/M4-M8 UI 由 gen_ui_w28d05.py 生成)
#   - assets/sfx/**/*.wav (Freesound CC0 × 7 项)

content_id: W28D05

paths:
  root_rel: publish/2026-W28/D05-AI帮我一周活干成一天

ffmpeg:
  crf: 20

# ─────────────────────────────────────
# TTS 段落 (对齐 audio_plan.yaml.voice.segments · 已应用 overrun_fallback)
# target_total_cap 60s: 抖音上限 · estimate_duration.py 检查 90/97% 利用率
# ─────────────────────────────────────
tts:
  voice_id: male-qn-jingying-jingpin
  base_speed: 1.08                     # 从 audio_plan speed 0.96 提到 1.08 · 因 D04 实测 1.08 = 0.96 感官速度 + 更符 TTS baseline
  target_total_cap: 60.0
  segments:
    # M1/M2 · 0-3s · 无 VO 沉默钉子 (由 ambient + iOS 推送 × 3 + hit 撑)
    # (不列 segment · estimate_duration.py 只算有文本段)

    # ═══ M3 · 3-8s · 群体锚 40h→8h (applied overrun -14 字 · 原 72% → 目标 ≤10%) ═══
    - sid: s3
      target_start: 3.0
      target_dur: 5.0
      emotion: neutral
      speed: 1.08
      text: "上周我也这样 · 凌晨 1 点还在改方案。这项目做通后 · 一周活干成一天。"
      tail_pad: 0.15
      original_text: "上周我也这样 · 凌晨 1 点还在改方案 · 早上继续跟单。这个项目做通之后 · 我一周的活干成了一天。"
      overrun_applied: "-14 字 · 精简'早上继续跟单/这个'/'之后'/'我'/'的' · 保'凌晨 1 点/一周活干成一天'双锚"

    # ═══ M4 · 8-15s · 烂做法 ① (safe · est 7.2s / 7s · 略超 0.2s 可容) ═══
    - sid: s4
      target_start: 8.0
      target_dur: 7.0
      emotion: neutral
      speed: 1.08
      text: "一人公司都想装 AI · 大多数装了 5 个用不起来——每天切来切去 40 分钟没了。"
      tail_pad: 0.15

    # ═══ M5 · 15-20s · 烂做法 ② (applied overrun -6 字 · 原 22% → 目标 ≤10%) ═══
    - sid: s5
      target_start: 16.35
      target_dur: 5.0
      emotion: neutral
      speed: 1.08
      text: "或花 3 月搭完美 workflow · 每步都要 review · 更累。"
      tail_pad: 0.15
      original_text: "或者花 3 个月搭个完美 workflow · 每步都要人 review · 更累。"
      overrun_applied: "-6 字 · 精简'或者'/'个'/'搭个' → '或/月/搭' · 保'3 月 workflow/更累'双锚"

    # ═══ M6 · 20-25s · 烂做法 ③ (applied overrun -8 字 · 原 30% → 目标 ≤10%) ═══
    - sid: s6
      target_start: 21.35
      target_dur: 5.0
      emotion: neutral
      speed: 1.08
      text: "或只自动化 10 分钟的打字 · 6 小时客户沟通一个字没碰。"
      tail_pad: 0.15
      original_text: "或者只自动化打字这种 10 分钟的活 · 客户沟通 6 小时的活一个字没碰。"
      overrun_applied: "-8 字 · 精简'或者'/'打字这种'/'的活' · 保'10 min/6h'双数字锚"

    # ═══ M7 · 25-40s · 核心 3 层堆叠 (applied overrun -12 字 · 原 22% → 二次调回 · 保 layer 3 VO 覆盖) ═══
    - sid: s7
      target_start: 26.35
      target_dur: 15.0
      emotion: neutral
      speed: 1.08
      text: "顺序不能反——先自己做一遍 · SOP 记 Notion。再让 Claude 按 SOP 出草稿 · Cursor 存 prompt 模板。最后 n8n 把 SOP 串成 workflow · 系统自己跑。跳过 SOP · 需求一改整套散架。"
      tail_pad: 0.30
      original_text: "解法是顺序不能反——先自己做一遍 · SOP 记 Notion。再让 Claude 按 SOP 出草稿 · Cursor 存 prompt 模板。最后 n8n 把 SOP 串成 workflow · 系统跑。跳过 SOP 直接搭自动化 · 需求一改整套散架。"
      overrun_applied: "-12 字 · 二次调整 · 精简'解法是'/'直接搭自动化'/'。' · 保 Cursor+系统自己跑 完整 layer 3 VO 覆盖"

    # ═══ M8 · 40-48s · 60/20/20 表格 (applied overrun -11 字 · 原 11% → 目标 ≤10%) ═══
    - sid: s8
      target_start: 41.35
      target_dur: 8.0
      emotion: neutral
      speed: 1.08
      text: "每天分配——60% 塞 AI · 20% 自动化 · 20% 你决策。我的项目实测 · 参考不套用。"
      tail_pad: 0.20
      original_text: "每天分配是——60% 塞给 AI · 20% 塞给自动化 · 20% 保留给你决策。是我的项目实测 · 请参考不套用。"
      overrun_applied: "-11 字 · 精简'是'/'塞给'重复/'保留给'/'是'/'请' · 保 60/20/20 + 参考不套用双锚"

    # ═══ M9 · 48-54s · 反印钞机价值锚 (applied overrun -6 字 · 原 17% → 目标 ≤10%) ═══
    - sid: s9
      target_start: 50.05
      target_dur: 6.0
      emotion: neutral
      speed: 1.10                       # 价值锚略提速强化情绪落
      text: "不是教你搞钱 · 是给你看我怎么把自己解放。AI 帮我解放 · 不是印钞机。"
      tail_pad: 0.25
      original_text: "我不是教你搞钱 · 是给你看我怎么把自己解放的。AI 帮我解放 · 不是帮我印钞机。"
      overrun_applied: "-6 字 · 精简'我'/'的'/'帮我'重复 · 保'解放/不是印钞机'双锚"

    # ═══ M10 · 54-58s · CTA (applied overrun -10 字 · 原 32% → 目标 ≤10%) ═══
    - sid: s10
      target_start: 56.05
      target_dur: 4.0
      emotion: neutral
      speed: 1.08
      text: "私信『项目+卡点』——我给你可自动化的第 1 步。"
      tail_pad: 0.30
      original_text: "私信『我在做什么项目 · 卡在哪』——我给你可自动化的第 1 步。"
      overrun_applied: "-10 字 · 精简'我在做什么项目 · 卡在哪' → '项目+卡点' · 保 CTA 完整"

# ─────────────────────────────────────
# scenes (对齐 storyboard.yaml.scenes)
# ─────────────────────────────────────
scenes:

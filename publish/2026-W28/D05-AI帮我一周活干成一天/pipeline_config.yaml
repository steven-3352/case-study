platforms:
  douyin:
    subs_size: 42
    margin_v: 200
    max_cue_chars: 32
    max_line_chars: 17
  xhs:
    subs_size: 50
    margin_v: 220
    max_cue_chars: 26
    max_line_chars: 14

# ─────────────────────────────────────
# overlays · 叠层大字快切 (drawtext · UI PNG 未覆盖的秒级快切)
# ─────────────────────────────────────
overlays:
  # M3 · headline 96pt「40h/周 → 8h/周」+ caption 24pt 副标
  - text: "40h/周 → 8h/周"
    t_start: 3.5
    t_end: 8.0
    fontsize: 96
    y_expr: h/3
    color: "#e53935"
    borderw: 3
    bordercolor: "#000000"
  - text: "(我的项目实测)"
    t_start: 3.5
    t_end: 8.0
    fontsize: 24
    y_expr: h-120
    color: "#f5f5f0"

  # M4 · headline 72pt「切来切去 40 min 没了」+ caption 24pt「少数派原话」

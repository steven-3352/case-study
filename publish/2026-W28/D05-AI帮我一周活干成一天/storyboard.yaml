#       design_language.md · retention_beat_sheet.md · cover_brief.md · scripts/vA.md
# 不走 GSAP · 不走 openmontage · 走 pipeline/p004_video/lib config-driven
# 字幕烧录: gen_subs + /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg + libass

meta:
  content_id: W28D05
  slug: 一周活干成一天
  script_version: vA
  platform: douyin
  duration_s: 58
  canvas: [1080, 1920]
  fps: 30
  bgm_layer: 0            # 密 VO 演示型 · BGM off
  vo_coverage_target: 0.85
  sfx_layer: 1            # sfx 4 类必覆盖
  subtitle_burn_pipeline: gen_subs + ffmpeg-full libass
  audience_pool: 一人公司 · 独立开发者 · 副业创作者 · 自动化重度爱好者
  skin:
    persona_anchor: 做了 20 年互联网 · 现在只做一人公司
    tone_direction: 同行说话 · 不打鸡血 · 不 sell 秘籍 · 反教程反印钞机
    landing_intent: 私信「项目+卡点」→ 可自动化的第 1 步 · SLA 24h · 不推付费群

scenes:
  - id: M1_chaos_sleep_push
    time_range: [0.0, 1.6]
    intent: chaos + punch · 睡姿 + 手机推送 3 声
    format_id: chaos_broll + ui_notification
    picture: |
      Pexels/内部拍 睡姿俯拍 B-roll 3800-4200K 暖光晨光（窗帘缝阳光打枕）
      1.0s 硬切: 手机屏幕特写占屏宽 70% · 时间戳 08:00 · iOS 通知条依次冒 3 条
      推送 1 (1.0-1.2s): 「Project-001 · 新询盘已分类·方案 v0.3 已生成·待你决策」
      推送 2 (1.2-1.4s): 「客户回问 3 条·2 条已回·1 条待你」
      推送 3 (1.4-1.6s): 「昨晚新增 4 单·系统已走完流程」
      iOS 通知条样式原生 · 保留 iOS 状态栏 · 化名 Project-001 · 禁真品牌名
    voiceover: null   # 首 3s 沉默钉子 · 由 sfx 撑
    subtitle:
      text: null
      style: null
    audio:
      env: 暖光晨光 ambient (-24dB · 远处鸟鸣 + 室内空气声)
      sfx:
        - ambient 全片 -24dB
        - 手机推送音 × 3 (1.0s / 1.2s / 1.4s · 每次 -8dB · iOS 原生 notification tone)
        - tick × 3 大字入前微拍
      bgm: none
    assets_needed:
      - Pexels 睡姿俯拍 B-roll × 1 (关键词: `morning bed sleeping overhead` `waking up looking at phone`)
      - iOS 通知条 gen_ui PNG × 1 (3 条推送 stagger · gen_ui_w28d05.py 直出)
    forbidden:
      - AI 生图睡姿 (chaos_must_be_real_footage: true)
      - 真品牌名 (Project-001 化名口径)
      - Dracula 霓虹色

  - id: M2_reveal_bigtext
    time_range: [1.6, 3.0]
    intent: reveal · 大字反差锚 · 停划最高点
    format_id: broll + drawtext_black_overlay
    picture: |
      续用睡姿 B-roll · 主角一只眼睁开
      全屏黑蒙层 rgba(0,0,0,0.65) · 高 500px · 大字入
      display 90pt 白字双行居中: 「我睡着的时候 / 系统已经跑完了昨晚的活」
      2.4s 大字 fade-in 300ms 完成
    voiceover: null
    subtitle:
      text: "我睡着的时候 / 系统已经跑完了昨晚的活"
      style:
        font: 思源黑体 Heavy 90pt · 白字 · 无描边 (黑蒙层上)
        position: 屏中央 · Y 700-1200px
        appear_at: 1.9
        transition: drawtext fade-in 300ms
      forbidden: [emoji, 感叹号, 花字, Dracula 色]
    audio:
      env: 无
      sfx:
        - hit × 1 (2.4s · -8dB · 大字入拍点)
      bgm: none
    assets_needed:
      - 睡姿续场 B-roll (无缝续 M1)
    forbidden:
      - 亮白底
      - AI 生图主角
      - 数字承诺 (禁"效率+80%"/"月入 x 万")

  - id: M3_group_anchor_split
    time_range: [3.0, 8.0]
    intent: 认领 · 40h→8h 时间对比
    format_id: split_screen + drawtext
    picture: |
      分屏 slide-in 500ms
      左: Pexels B-roll 凌晨 1 点桌面 · 台灯 · 屏幕蓝光 · 疲惫
      右: Pexels B-roll 08:00 起床看手机 · 晨光 · 放松
      中间 headline 96pt 血红 #e53935 大字: 「40h/周 → 8h/周 (我的项目实测)」
    voiceover: |
      上周我也这样 · 凌晨 1 点还在改方案 · 早上继续跟单。这个项目做通之后 · 我一周的活干成了一天。
    subtitle:
      text: "40h/周 → 8h/周 (我的项目实测)"
      style:
        font: 思源黑体 Heavy 96pt 血红 #e53935
        position: 屏中央
        appear_at: 3.5
        transition: drawtext 淡入 300ms
    audio:
      env: 白天 ambient 延续 -24dB
      sfx:
        - hit × 1 硬切进分屏 (3.0s · -8dB)
        - hit × 1 数字大字入 (3.5s · -8dB)
      bgm: none
    assets_needed:
      - Pexels 凌晨 1 点桌面 B-roll × 1 (`night desk laptop lonely`)
      - Pexels 08:00 起床看手机 B-roll × 1 (`morning wake up phone`)
    forbidden:
      - AI 生图桌面
      - 骂老板

  - id: M4_bad_practice_1_icon_grid
    time_range: [8.0, 15.0]
    intent: 烂做法 ① · R6 少数派原话
    format_id: gen_ui_html + drawtext
    picture: |
      黑底 · 5 AI 图标网格 (ChatGPT / Claude / Cursor / Notion / n8n · 小图标 · 禁大 logo)
      图标 fade-in stagger 700ms × 5 (8.5 / 9.2 / 9.9 / 10.6 / 11.3s)
      12s 处 headline 72pt 白字入: 「装了 5 个 AI · 切来切去 40 min 没了」
      caption 24pt 底部灰字: 「少数派原话」
    voiceover: |
      一人公司都想装 AI · 大多数装了 5 个用不起来——每天切来切去 40 分钟没了。
    subtitle:
      text: "装了 5 个 AI · 切来切去 40 min 没了 (少数派原话)"
      style:
        font: 思源黑体 Heavy 72pt · 白字
        position: 屏中央偏下
        appear_at: 12.0
    audio:
      env: -24dB ambient
      sfx:
        - tick × 5 图标入拍点 (8.5 / 9.2 / 9.9 / 10.6 / 11.3s · 每次 -12dB)
        - hit × 1 大字入 (12.0s · -8dB)
      bgm: none
    assets_needed:
      - gen_ui HTML 5 图标网格 PNG × 1 (纯 SVG 图标 · 禁大 logo)
    forbidden:
      - AI 产品大 logo (ChatGPT / Claude 全禁)
      - 抠白底

  - id: M5_bad_practice_2_workflow
    time_range: [15.0, 20.0]
    intent: 烂做法 ② · 3 月完美工作流
    format_id: gen_ui_html + drawtext_annotation
    picture: |
      屏录 mock n8n workflow 半成品 · 8 节点串联 · 每节点旁 accent_red #e53935 小字 "需 review"
      静态出 · drawtext 批注入
      headline 66pt 血红字入 (17s): 「② 3 月搭完美流 → 更累」
    voiceover: |
      或者花 3 个月搭个完美 workflow · 每步都要人 review · 更累。
    subtitle:
      text: "② 3 月搭完美工作流 → 更累"
      style:
        font: 思源黑体 Heavy 66pt · 血红 #e53935
        position: 屏底
        appear_at: 17.0
    audio:
      env: -24dB
      sfx:
        - hit × 1 大字入 (17.0s · -8dB)
      bgm: none
    assets_needed:
      - gen_ui HTML n8n workflow 半成品 PNG × 1 (8 节点 · 每节点红标)
    forbidden:
      - 真 n8n 截屏 (mock UI · 不打 n8n logo)

  - id: M6_bad_practice_3_typing_vs_client
    time_range: [20.0, 25.0]
    intent: 烂做法 ③ · 自动化最容易 · 省 10 min 累 6h
    format_id: split_screen + drawtext
    picture: |
      分屏 slide 300ms
      左: 打字自动化 UI mock (10 min · 灰底)
      右: 微信客户沟通截屏 mock (6h · 化名打码)
      headline 60pt 血红字入 (22s): 「③ 自动化最容易 → 省 10 min 累 6h」
    voiceover: |
      或者只自动化打字这种 10 分钟的活 · 客户沟通 6 小时的活一个字没碰。
    subtitle:
      text: "③ 自动化最容易 → 省 10 min 累 6h"
      style:
        font: 思源黑体 Heavy 60pt · 血红
        position: 屏底
        appear_at: 22.0
    audio:
      env: -24dB
      sfx:
        - hit × 1 分屏进 (20.0s · -8dB)
        - hit × 1 大字入 (22.0s · -8dB)
      bgm: none
    assets_needed:
      - gen_ui HTML 分屏 mock PNG × 1 (左打字 / 右微信 · 化名)
    forbidden:
      - 真微信截屏 (mock · 打码)
      - 真客户名

  - id: M7_core_3_layer_stack
    time_range: [25.0, 40.0]
    intent: 核心 · 3 层顺序 · 收藏动机第一位
    format_id: gen_ui_html + drawtext_stagger
    picture: |
      黑底 · 3 层堆叠 UI 纵向 · 每层卡片高约 500px
      25-30s: 第 1 层滑入 (slide-down 400ms) · Notion 卡 top (深灰 #191919 底 · 白字 SOP 列表)
              drawtext 50pt 白字右侧: 「第 1 层 · 手工 SOP · Notion」
      30-35s: 第 2 层滑入 · Cursor 卡 middle (深黑 #181818 底 · teal #00d4aa 语法高亮)
              drawtext 50pt 白字右侧: 「第 2 层 · AI 辅助 · Cursor + Claude」
      35-40s: 第 3 层滑入 · n8n workflow 底 (深蓝 #101330 底 · 橙红 #ff6d5a 节点)
              drawtext 50pt 白字右侧: 「第 3 层 · 系统自跑 · n8n」
              39s "散架"血红大字 pop-in 200ms 屏顶: 「跳过 SOP → 需求一改整套散架」
              caption 24pt 底部: 「可长按暂停截屏」
    voiceover: |
      解法是顺序不能反——先自己做一遍 · SOP 记 Notion。再让 Claude 按 SOP 出草稿 · Cursor 存 prompt 模板。最后 n8n 把 SOP 串成 workflow · 系统跑。跳过 SOP 直接搭自动化 · 需求一改整套散架。
    subtitle:
      text: "3 层顺序: 手工 SOP → AI 辅助 → 系统自跑"
      style:
        font: 思源黑体 Heavy 50pt (每层标) · 白字 · 血红 (散架)
        position: 每层卡右侧 (标签) + 屏顶 (散架)
        appear_at: [25.5, 30.5, 35.5, 39.0]
    audio:
      env: -24dB
      sfx:
        - whoosh × 3 每层滑入 (25.0s / 30.0s / 35.0s · 每次 -10dB)
        - hit × 1 "散架"血红字入 (39.0s · -8dB)
      bgm: none
    assets_needed:
      - gen_ui HTML 三层堆叠 PNG × 1 (Notion + Cursor + n8n mock · 化名 Project-001)
    forbidden:
      - 真 Notion/Cursor/n8n logo (原生色允许 · logo 禁)
      - 真项目名

  - id: M8_60_20_20_table
    time_range: [40.0, 48.0]
    intent: 60/20/20 分配表 · 收藏动机第二位
    format_id: gen_ui_html_table + drawtext
    picture: |
      黑底 · 3 列等宽表格 · 顶大字数字 · 中图标 · 底动作 3 行
      40-42s: 第 1 列 fade-in · 60% AI (highlight 血红) · 底注 "分类/草稿/翻译/答客户/搜索"
      42-44s: 第 2 列 fade-in · 20% 自动化 · 底注 "webhook/分类/推送/归档"
      44-48s: 第 3 列 fade-in · 20% 人做 · 底注 "审美/关系/战略" + caption 24pt "参考·不套用"
    voiceover: |
      每天分配是——60% 塞给 AI · 20% 塞给自动化 · 20% 保留给你决策。是我的项目实测·请参考不套用。
    subtitle:
      text: "60% AI · 20% 自动化 · 20% 人做"
      style:
        font: 思源黑体 Heavy 96pt (数字) · 42pt (底注) · 血红 (60%) + 白字 (20%/20%)
        position: 3 列表格中央
        appear_at: [40.5, 42.5, 44.5]
    audio:
      env: -24dB
      sfx:
        - hit × 3 数字 pop (40.5 / 42.5 / 44.5s · 每次 -8dB)
        - tick × 3 底注入 (41.5 / 43.5 / 45.5s · 每次 -12dB)
      bgm: none
    assets_needed:
      - gen_ui HTML 60/20/20 表格 PNG × 1
    forbidden:
      - 3D 图表
      - GSAP 弹跳

  - id: M9_value_anchor
    time_range: [48.0, 54.0]
    intent: 边界价值锚 · 反印钞机
    format_id: drawtext_black_fullscreen
    picture: |
      纯黑底 · display 100pt 白字双行居中 fade-in 500ms
      「AI 帮我解放 / 不是帮我印钞机」
    voiceover: |
      我不是教你搞钱 · 是给你看我怎么把自己解放的。AI 帮我解放 · 不是帮我印钞机。
    subtitle:
      text: "AI 帮我解放 / 不是帮我印钞机"
      style:
        font: 思源黑体 Heavy 100pt · 白字
        position: 屏中央双行
        appear_at: 49.0
        transition: drawtext fade-in 500ms
    audio:
      env: -24dB (ambient 落底)
      sfx:
        - hit × 1 大字入 (49.0s · -8dB · 深长回响 impact_boom_deep)
      bgm: none
    assets_needed: []
    forbidden:
      - "钱 / 变现 / 印钞 / 月入 (仅 M9 反用允许 · 其他镜禁)"
      - Dracula 色

  - id: M10_cta
    time_range: [54.0, 58.0]
    intent: CTA · 私信「项目+卡点」
    format_id: drawtext_black_fullscreen + subtle_bob
    picture: |
      纯黑底 · CTA 大字 88pt 血红入 · 上下浮动 3px 循环 (drawtext + ease sine)
      「私信『项目+卡点』→ 可自动化的第 1 步」
    voiceover: |
      私信『我在做什么项目 · 卡在哪』——我给你可自动化的第 1 步。
    subtitle:
      text: "私信『项目+卡点』→ 可自动化的第 1 步"
      style:
        font: 思源黑体 Heavy 88pt · 血红 #e53935
        position: 屏中央 (上下浮动 3px)
        appear_at: 54.5
    audio:
      env: -24dB (收尾)
      sfx:
        - hit × 1 CTA 入 (54.5s · -8dB)
        - hit × 1 全片收尾 (57.5s · -8dB · fade-out 500ms)
      bgm: none
    assets_needed: []
    forbidden:
      - 二维码 (xhs 禁 · 抖音也禁)
      - 付费群链接


# ─────────────────────────────────────
# 屏录合规 (feedback_screen-recording-rules)
# ─────────────────────────────────────

screen_recording_compliance:
  keep_ios_macos_status_bar: true       # iOS 通知条保状态栏
  keep_native_ui: true                  # Notion/Cursor/n8n 原生 UI 色
  forbid_logo_on_ui: true               # 禁打 AI 产品 logo (小图标 SVG 允许)
  forbid_crop_white_bg: true            # 禁抠白底
  brand_alias: Project-001              # 化名口径 · 禁真名

# ─────────────────────────────────────
# fail-closed 门禁
# ─────────────────────────────────────

gate_check_status:
  content_gate: pass_dual_review        # vB 92/91 PASS
  form_gate: pass_dual_review           # form_strategy 92/85 PASS
  motion_storyboard_gate: pass_single_run
  storyboard_gate: pass_self_generated  # 本文件
  audio_gate: pending                   # 步 11 audio_plan.yaml
  tts_duration_gate: pending            # estimate_duration.py 前置估算硬门
  gate_check_palette: pending
  pre_publish_forecast: pending

next_step: |
  1. 写 audio_plan.yaml (声音设计师单跑)
  2. 跑 python pipeline/tts/estimate_duration.py --config audio_plan.yaml
  3. 若 M7 (15s · 74+ chars) 或 M8 (8s · 48+ chars) 溢出 >30% · 按 overrun_action 改稿
  4. 进入 pipeline (config-driven · pipeline_config.yaml + run_pipeline.py --step all)

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #f6f4ef; }
  body { font-family: "STHeiti", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif; color: #171717; }
  #stage { position: relative; width: 720px; height: 1280px; background: #f6f4ef; overflow: hidden; }
  .grain { position:absolute; inset:0; opacity:.12; background-image: radial-gradient(#171717 0.6px, transparent 0.7px); background-size: 10px 10px; mix-blend-mode:multiply; }
  .tag { position:absolute; left:48px; top:48px; color:#6b7280; font-size:22px; }
  .counter { position:absolute; right:48px; top:42px; min-width:154px; height:48px; border-radius:6px; background:#171717; color:#fff; display:flex; align-items:center; justify-content:center; font-size:23px; font-weight:700; }
  .card { position:absolute; background:#fff; border:2px solid #e5e0d8; border-radius:8px; box-shadow:0 14px 36px rgba(23,23,23,.08); }
  .doc h3 { margin:0; font-size:34px; }
  .line { height:12px; border-radius:20px; background:#d9d3c8; margin-top:26px; }
  .toast { position:absolute; background:#eaf4ff; border:2px solid #bfd6f7; border-radius:8px; padding:18px 22px; font-size:29px; font-weight:700; box-shadow:0 14px 26px rgba(47,93,204,.12); }
  .big { position:absolute; left:58px; font-size:54px; line-height:1.12; font-weight:900; letter-spacing:0; }
  .subtitle { position:absolute; left:48px; right:48px; bottom:74px; min-height:78px; border-radius:8px; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; padding:10px 22px; font-size:28px; line-height:1.25; font-weight:800; text-align:center; }
  .note { position:absolute; width:510px; height:62px; border-radius:6px; border:2px solid #eedfa0; background:#fff7d1; padding:15px 20px; font-size:25px; font-weight:750; transform-origin:center; }
  .table { position:absolute; left:58px; top:250px; width:604px; background:#fff; border:2px solid #e5e0d8; border-radius:8px; overflow:hidden; }
  .row { display:grid; min-height:52px; border-top:1px solid #e5e0d8; align-items:center; font-size:24px; }
  .row:first-child { border-top:0; color:#6b7280; font-size:21px; font-weight:700; background:#fbfaf7; }
  .cell { padding:10px 18px; border-left:1px solid #eee9df; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cell:first-child { border-left:0; }
  .highlight { position:absolute; border-radius:7px; border:3px solid rgba(47,93,204,.78); background:rgba(47,93,204,.14); }
  .cursor { position:absolute; width:24px; height:34px; clip-path:polygon(0 0, 0 100%, 8px 80%, 14px 100%, 21px 96%, 15px 75%, 24px 75%); background:#171717; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .pill { position:absolute; border-radius:6px; padding:10px 15px; color:#fff; background:#171717; font-size:20px; font-weight:800; }
  .trace { position:absolute; height:6px; border-radius:20px; background:rgba(31,122,90,.55); transform-origin:left center; }
  .node { position:absolute; width:238px; height:108px; border-radius:8px; background:#fff; border:2px solid #e5e0d8; padding:18px; box-shadow:0 12px 28px rgba(23,23,23,.08); }
  .node .title { font-size:29px; font-weight:900; }
  .node .sub { margin-top:12px; font-size:20px; color:#1f7a5a; font-weight:800; }
  .chip { position:absolute; border-radius:8px; background:#fff; border:2px solid #e5e0d8; width:92px; height:60px; display:flex; align-items:center; justify-content:center; font-size:27px; font-weight:900; }
  .input { position:absolute; left:60px; top:375px; width:600px; height:118px; border-radius:9px; background:#fff; border:2px solid #e5e0d8; display:flex; align-items:center; padding-left:42px; font-size:44px; font-weight:900; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const stage = document.getElementById("stage");
const C = { blue:"#2f5dcc", orange:"#c2410c", green:"#1f7a5a", black:"#171717" };
const subtitles = [
  [0,3,"很多老板做 AI 的第一步就错了"],
  [3,13,"示意需求，不冒充真实原话"],
  [13,24,"早上：客户消息复制到表格"],
  [24,34,"中午：按备注判断谁该跟进"],
  [34,43,"下午：相似回复改几个字"],
  [43,49,"这不是员工勤奋，是流程没产品化"],
  [49,58,"先问 4 件事：高频 / 重复 / 输入 / 结果"],
  [58,99,"评论一个重复动作，我帮你判断值不值得 AI 化"],
];
function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function ease(v){v=clamp(v);return 1-Math.pow(1-v,3)}
function inr(t,a,b){return t>=a&&t<b}
function rel(t,a,b){return clamp((t-a)/(b-a))}
function el(cls, style={}, text=""){const d=document.createElement("div"); d.className=cls; Object.assign(d.style,style); d.textContent=text; stage.appendChild(d); return d}
function common(t, counter){
  el("grain");
  el("tag", {}, "示意 · generated_fact / synthetic_visual");
  el("counter", {}, counter);
}
function subtitle(t){ const s=subtitles.find(x=>inr(t,x[0],x[1])); if(s) el("subtitle",{},s[2]); }
function doc(x,y,w=604,h=210, scale=1){
  const d=el("card doc",{left:x+"px",top:y+"px",width:w+"px",height:h+"px",padding:"34px"});
  d.innerHTML=`<h3>高级 AI Agent 方案</h3><div class=line style="width:86%"></div><div class=line style="width:70%"></div><div class=line style="width:48%"></div>`;
  d.style.transform=`scale(${scale})`;
}
function table(cols, rows){
  const tb=el("table");
  tb.style.gridTemplateColumns = "";
  for(const row of rows){
    const r=el("row");
    r.style.gridTemplateColumns = cols.map(()=> "1fr").join(" ");
    for(const c of row) el("cell",{},c).parentNode === stage && r.appendChild(stage.lastChild);
    tb.appendChild(r);
  }
}
function cursor(x,y){ el("cursor",{left:x+"px",top:y+"px"}); }
function s1(t){
  common(t, t<1.45 ? "重复动作 0" : "重复动作 1");
  doc(58,150,604,218,1);
  if(t>.55){ const p=ease(rel(t,.55,1.1)); el("toast",{left:(92+20*(1-p))+"px",top:"392px",opacity:p},"客户消息弹窗：想了解报价"); }
  if(t>1.05){ const p=ease(rel(t,1.05,1.75)); el("big",{top:"555px",opacity:p,transform:`translateY(${24*(1-p)}px)`},"很多老板做 AI"); el("big",{top:"626px",opacity:p,transform:`translateY(${24*(1-p)}px)`},"第一步就错了"); }
  cursor(450+Math.sin(t*8)*4, 332);
}
function s2(t){
  common(t, "重复动作 1");
  el("big",{top:"142px",fontSize:"43px"},"示意需求压住了方案");
  doc(76,248,570,196,.98);
  const notes=[
    [3.4,"想用 AI，但不知道从哪开始",80,350,-4,"#fff7d1"],
    [5.2,"一上来就想做复杂 Agent",126,445,3,"#fff7d1"],
    [7.0,"买了工具，最后还是没人用",78,540,-2,"#fff7d1"],
    [8.8,"每天还在复制消息和整理表格",120,635,2,"#ffe4d5"],
  ];
  for(const [st,txt,x,y,r,bg] of notes){ if(t>st){ const p=ease(rel(t,st,st+.55)); el("note",{left:x+"px",top:y+"px",opacity:p,background:bg,transform:`translateY(${22*(1-p)}px) rotate(${r}deg)`},txt); } }
}
function s3(t){
  common(t, `重复动作 ${Math.min(4,1+Math.floor(rel(t,13,23)*4))}`);
  el("big",{top:"142px",fontSize:"43px"},"早上：复制客户消息");
  table(["客户","需求","下一步"], [["客户","需求","下一步"],["陈总","报价","发方案"],["李店","案例","补截图"],["王经理","时间","约电话"]]);
  const x=105+390*rel(t,13.3,22.2), y=352+Math.sin(t*3)*18; cursor(x,y);
  const rows=[[13.4,58,302],[16.0,260,354],[18.7,462,406],[21.0,170,458]];
  for(const [st,x,y] of rows) if(inr(t,st,st+1.4)) el("highlight",{left:x+"px",top:y+"px",width:"184px",height:"46px"});
  el("pill",{left:"468px",top:"420px",background:C.blue},"复制 → 表格");
  el("big",{top:"518px",fontSize:"55px",color:C.blue},`重复动作 ${Math.min(4,1+Math.floor(rel(t,13,23)*4))}`);
}
function s4(t){
  const n=Math.min(7,4+Math.floor(rel(t,24,33.2)*4));
  common(t, `重复判断 ${n}`);
  el("big",{top:"142px",fontSize:"43px"},"中午：按备注判断");
  table(["备注","判断"], [["备注","判断"],["昨天问过价格","今天跟进"],["已读未回","换案例"],["要发案例","补资料"]]);
  document.querySelector(".table").style.top="262px";
  const ys=[315,367,419];
  ys.forEach((y,i)=>{ if(t>24.4+i*2.55) el("highlight",{left:"70px",top:y+"px",width:"580px",height:"48px",borderColor:"rgba(194,65,12,.78)",background:"rgba(194,65,12,.12)"}); });
  cursor(510+Math.sin(t*5)*12, 330+rel(t,24,33)*150);
  el("pill",{left:"465px",top:"470px",background:C.orange},"扫备注 → 判断");
  el("big",{top:"540px",fontSize:"55px",color:C.orange},`重复判断 ${n}`);
}
function s5(t){
  const n=Math.min(10,7+Math.floor(rel(t,34,42.2)*4));
  common(t, `重复改写 ${n}`);
  el("big",{top:"142px",fontSize:"41px"},"下午：相似回复只改变量");
  [["陈总","门店获客",250],["李店","报价整理",410],["王经理","案例跟进",570]].forEach((r,i)=>{
    el("card",{left:"60px",top:r[2]+"px",width:"600px",height:"122px",padding:"24px",opacity:.94});
    el("",{position:"absolute",left:"88px",top:(r[2]+30)+"px",fontSize:"25px",fontWeight:"800"},`您好 ${r[0]}，这版方案适合 ${r[1]}，`);
    el("",{position:"absolute",left:"88px",top:(r[2]+68)+"px",fontSize:"25px",fontWeight:"800"},"今晚可以发您。");
  });
  const blink = Math.sin(t*10)>0;
  if(blink) [[126,280,60],[295,280,125],[126,440,60],[295,440,125],[126,600,60],[295,600,125]].forEach(([x,y,w])=>el("highlight",{left:x+"px",top:y+"px",width:w+"px",height:"34px",borderColor:"rgba(31,122,90,.78)",background:"rgba(31,122,90,.12)"}));
  el("pill",{left:"468px",top:"742px",background:C.blue},"只替换变量");
  el("big",{top:"698px",fontSize:"44px",color:C.blue},`重复改写 ${n}`);
}
function s6(t){
  common(t, "重复动作 10");
  el("card",{left:"48px",top:"168px",width:"624px",height:"710px",background:"rgba(31,122,90,.05)",borderColor:"rgba(31,122,90,.28)"});
  [[78,295,520,4],[112,470,500,-2],[88,650,455,3],[144,785,390,-1]].forEach(([x,y,w,r])=>el("trace",{left:x+"px",top:y+"px",width:w+"px",transform:`rotate(${r}deg)`}));
  el("big",{top:"205px",fontSize:"56px",color:C.orange},"重复动作 10");
  if(t>44){ const p=ease(rel(t,44,44.5)); el("big",{top:"760px",fontSize:"50px",opacity:p},"这不是员工勤奋"); }
  if(t>45){ const p=ease(rel(t,45,45.5)); el("big",{top:"828px",fontSize:"50px",opacity:p},"是流程没产品化"); }
}
function s7(t){
  common(t, "重复动作 10");
  el("big",{top:"142px",fontSize:"41px"},"从动作里抽出 4 个问题");
  [[95,310,500,-3],[130,470,460,2],[90,630,500,3]].forEach(([x,y,w,r])=>el("trace",{left:x+"px",top:y+"px",width:w+"px",transform:`rotate(${r}deg)`}));
  const nodes=[[49.4,80,250,"高频吗？","早 / 中 / 下午"],[50.5,400,410,"重复吗？","复制 / 判断 / 改写"],[51.6,80,570,"输入明确吗？","客户消息 + 备注"],[52.7,400,730,"结果明确吗？","下一步动作"]];
  for(const [st,x,y,title,sub] of nodes) if(t>st){ const p=ease(rel(t,st,st+.5)); const n=el("node",{left:x+"px",top:y+"px",opacity:p,transform:`translateY(${18*(1-p)}px)`}); n.innerHTML=`<div class=title>${title}</div><div class=sub>${sub}</div>`; }
}
function s8(t){
  common(t, "重复动作 0");
  el("big",{top:"142px",fontSize:"52px"},"你公司每天重复最多");
  el("big",{top:"210px",fontSize:"52px"},"的动作是：");
  el("input",{},"__________");
  ["复制","整理","判断","改写","提醒"].forEach((txt,i)=>{ if(t>58.5+i*.22) el("chip",{left:(66+i*118)+"px",top:"545px"},txt); });
  const caret=el("",{position:"absolute",left:"160px",top:"414px",width:"4px",height:"44px",background:C.black,opacity:Math.sin(t*8)>0?1:.1});
}
window.__renderAt = function(t, duration){
  stage.innerHTML = "";
  if(inr(t,0,3)) s1(t);
  else if(inr(t,3,13)) s2(t);
  else if(inr(t,13,24)) s3(t);
  else if(inr(t,24,34)) s4(t);
  else if(inr(t,34,43)) s5(t);
  else if(inr(t,43,49)) s6(t);
  else if(inr(t,49,58)) s7(t);
  else s8(t);
  subtitle(t);
}
window.__renderAt(0, 66);
</script>
</body>
</html>

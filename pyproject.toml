[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvstudio"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = ["numpy", "Pillow>=10,<12", "PyYAML>=6,<7"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mvstudio.engines.mv.atoms" = ["lock.json"]

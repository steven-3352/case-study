<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品浏览 · 内容工作台</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      line-height: 1.5;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      padding: 2rem 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Header */
    .gallery-header {
      margin-bottom: 3rem;
    }

    .gallery-eyebrow {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-secondary);
      margin-bottom: 0.75rem;
    }

    .gallery-title {
      font-size: 2.5rem;
      font-weight: 300;
      font-style: italic;
      font-family: var(--font-serif);
      color: var(--color-text-primary);
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .gallery-note {
      font-size: 1rem;
      color: var(--color-text-secondary);
      max-width: 600px;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--color-border);
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .filter-pill {
      padding: 0.5rem 1rem;
      border: 1px solid var(--color-border);
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 2px;
    }

    .filter-pill:hover {
      border-color: var(--color-text-primary);
    }

    .filter-pill.active {
      background: var(--color-text-primary);
      color: var(--color-bg-primary);
      border-color: var(--color-text-primary);
    }

    .filter-count {
      margin-left: auto;
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }

    /* Grid */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    @media (min-width: 768px) {
      .works-grid {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .works-grid {
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      }
    }

    /* Work Card */
    .work-card {
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .work-card:hover {
      transform: translateY(-4px);
    }

    .work-card-image {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--color-border);
      background: var(--color-bg-secondary);
      margin-bottom: 1rem;
    }

    .work-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .work-card-content {
      padding: 0 0.25rem;
    }

    .work-card-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .work-card-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.75rem;
    }

    .work-card-subproject {
      padding: 0.25rem 0.5rem;
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      border-radius: 1px;
    }

    .work-card-time {
      color: var(--color-text-secondary);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--color-text-secondary);
    }

    .empty-state-title {
      font-size: 1.25rem;
      font-weight: 300;
      margin-bottom: 1rem;
      color: var(--color-text-primary);
    }

    .empty-state-link {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--color-border);
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .empty-state-link:hover {
      border-color: var(--color-text-primary);
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 23, 20, 0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      background: var(--color-bg-primary);
      max-width: 90vw;
      max-height: 85vh;
      overflow: auto;
      border: 1px solid var(--color-border);
      padding: 2rem;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-text-secondary);
      font-size: 1.5rem;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .lightbox-close:hover {
      color: var(--color-text-primary);
    }

    .lightbox-image {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 1.5rem;
      border: 1px solid var(--color-border);
    }

    .lightbox-title {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .lightbox-subproject {
      padding: 0.375rem 0.75rem;
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      font-size: 0.875rem;
      display: inline-block;
    }
  </style>
</head>
<body>
  <header id="site-nav" data-here="gallery"></header>

  <main>
    <div class="gallery-header">
      <div class="gallery-eyebrow">作品浏览</div>
      <h1 class="gallery-title">内容的呼吸与节奏</h1>
      <p class="gallery-note">每一帧都承载策略,每一秒都传递情感。在这里浏览已完成的创意作品,发现可能的下一个灵感源点。</p>
    </div>

    <div class="filter-bar">
      <div class="filter-pills" id="filter-pills"></div>
      <div class="filter-count"><span id="filter-count">共 0 件</span></div>
    </div>

    <div id="works-container"></div>

    <div class="lightbox" id="lightbox">
      <div class="lightbox-content">
        <div class="lightbox-close" id="lightbox-close">&times;</div>
        <img id="lightbox-image" class="lightbox-image" alt="">
        <h2 class="lightbox-title" id="lightbox-title"></h2>
        <div class="lightbox-subproject" id="lightbox-subproject"></div>
      </div>
    </div>
  </main>

  <script src="assets/recipes.js"></script>
  <script src="assets/mock-engine.js"></script>
  <script>
    // State
    let allWorks = [];
    let filteredWorks = [];
    let selectedFilter = 'all';

    // Relative time formatter
    function getRelativeTime(ms) {
      const now = Date.now();
      const diff = now - ms;
      const sec = Math.floor(diff / 1000);
      const min = Math.floor(sec / 60);
      const hour = Math.floor(min / 60);
      const day = Math.floor(hour / 24);

      if (day > 0) return day + ' 天前';
      if (hour > 0) return hour + ' 小时前';
      if (min > 0) return min + ' 分钟前';
      return '刚刚';
    }

    // Get unique subProjects
    function getSubProjects() {
      const subProjects = [...new Set(allWorks.map(w => w.subProject))];
      return subProjects.sort();
    }

    // Render filter pills
    function renderFilterPills() {
      const container = document.getElementById('filter-pills');
      const subProjects = getSubProjects();
      const filters = ['all', ...subProjects];

      container.innerHTML = '';
      filters.forEach(filter => {
        const label = filter === 'all' ? '全部' : filter;
        const pill = document.createElement('button');
        pill.className = 'filter-pill' + (filter === selectedFilter ? ' active' : '');
        pill.textContent = label;
        pill.onclick = () => setFilter(filter);
        container.appendChild(pill);
      });
    }

    // Set filter and re-render
    function setFilter(filter) {
      selectedFilter = filter;
      if (filter === 'all') {
        filteredWorks = [...allWorks];
      } else {
        filteredWorks = allWorks.filter(w => w.subProject === filter);
      }
      renderFilterPills();
      renderGrid();
      updateCount();
    }

    // Update count
    function updateCount() {
      document.getElementById('filter-count').textContent = '共 ' + filteredWorks.length + ' 件';
    }

    // Render work card
    function renderWorkCard(work) {
      const card = document.createElement('div');
      card.className = 'work-card';

      const ratio = work.ratio;
      const [w, h] = ratio.split(':').map(Number);
      const aspectRatio = w / h;

      card.innerHTML = `
        <div class="work-card-image" style="aspect-ratio: ${aspectRatio}">
          <img src="${work.cover}" alt="${work.title}">
        </div>
        <div class="work-card-content">
          <div class="work-card-title">${work.title}</div>
          <div class="work-card-meta">
            <div class="work-card-subproject">${work.subProject}</div>
            <div class="work-card-time">${getRelativeTime(work.finishedAt)}</div>
          </div>
        </div>
      `;

      card.onclick = () => openLightbox(work);
      return card;
    }

    // Render grid
    function renderGrid() {
      const container = document.getElementById('works-container');

      if (filteredWorks.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">还没有作品</div>
            <p>探索创意的无限可能,从这里开始。</p>
            <a href="workspace.html" class="empty-state-link">去做一支</a>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      const grid = document.createElement('div');
      grid.className = 'works-grid';
      filteredWorks.forEach(work => {
        grid.appendChild(renderWorkCard(work));
      });
      container.appendChild(grid);
    }

    // Lightbox
    function openLightbox(work) {
      const ratio = work.ratio;
      const [w, h] = ratio.split(':').map(Number);
      const aspectRatio = w / h;

      document.getElementById('lightbox-image').src = work.cover;
      document.getElementById('lightbox-image').alt = work.title;
      document.getElementById('lightbox-image').style.aspectRatio = aspectRatio;
      document.getElementById('lightbox-title').textContent = work.title;
      document.getElementById('lightbox-subproject').textContent = work.subProject;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    // Event listeners
    document.getElementById('lightbox-close').onclick = closeLightbox;
    document.getElementById('lightbox').onclick = (e) => {
      if (e.target.id === 'lightbox') closeLightbox();
    };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    // Initialize
    allWorks = Studio.works.list() || [];
    filteredWorks = [...allWorks];
    renderFilterPills();
    renderGrid();
    updateCount();
  </script>
  <script src="assets/nav.js"></script>
</body>
</html>

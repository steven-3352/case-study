<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>内容工作台</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* ================================================================
     Direction B · "Build 奢华极简" — 继承 tokens.css 设计令牌
     暖白纸感 · 70%+ 留白 · 金色克制点缀 · 零 AI 味
     ================================================================ */
  @font-face{
    font-family:"InterVariable";
    src:url("assets/fonts/InterVariable.woff2") format("woff2");
    font-weight:100 900;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:"Redaction 35";
    src:url("assets/fonts/Redaction35-Italic.woff2") format("woff2");
    font-weight:400;font-style:italic;font-display:swap;
  }

  html{transition:background .25s ease;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--ui);
    font-size:16px;
    line-height:1.7;
    font-optical-sizing:auto;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 40px;}

  /* ---- Hero:大量呼吸空间,极细展示字 ---- */
  .hero{padding:150px 0 120px;}
  .eyebrow{font-size:11.5px;letter-spacing:0.26em;text-transform:uppercase;color:var(--gold);margin-bottom:40px;font-weight:500;}
  .hero h1{
    font-size:clamp(46px,8.5vw,92px);line-height:1.02;letter-spacing:-0.04em;font-weight:250;margin:0 0 40px;
    max-width:15ch;font-family:var(--ui);
  }
  .hero h1 em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-0.02em;}
  .hero p.lede{font-size:20px;color:var(--muted);max-width:50ch;margin:0 0 48px;line-height:1.75;font-weight:400;}
  .hero-cta{display:flex;gap:20px;align-items:center;}
  .btn-primary{
    background:var(--ink);color:var(--on-ink);border-radius:26px;padding:14px 30px;font-size:15px;font-weight:400;
    transition:opacity .18s ease;cursor:pointer;border:none;font-family:inherit;
  }
  .btn-primary:hover{opacity:0.84;}
  .btn-ghost{color:var(--muted);font-size:15px;font-weight:400;padding:14px 4px;transition:color .18s;cursor:pointer;}
  .btn-ghost:hover{color:var(--ink);}
  .btn-ghost .arrow{transition:transform .18s;display:inline-block;color:var(--gold);}
  .btn-ghost:hover .arrow{transform:translateX(4px);}

  .rule{height:1px;background:var(--line);margin:0;}

  /* ---- 分区:大留白 ---- */
  .section{padding:clamp(100px,12vw,160px) 0;}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;gap:24px;}
  .sec-head h2{font-size:12px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin:0;}
  .sec-head .note{font-size:13.5px;color:var(--faint);font-weight:400;}
  .sec-lede{font-family:var(--serif);font-style:italic;font-size:clamp(28px,4vw,40px);line-height:1.35;color:var(--ink);max-width:24ch;margin:0;font-weight:400;letter-spacing:-0.01em;}

  /* ---- 子项目编辑行 ---- */
  .rows{display:flex;flex-direction:column;gap:clamp(96px,12vw,168px);margin-top:96px;}
  .row{
    display:grid;grid-template-columns:0.82fr 1.18fr;gap:clamp(40px,6vw,88px);align-items:center;
  }
  .row.flip{grid-template-columns:1.18fr 0.82fr;}
  .row.flip .copy{order:2;}
  .row.flip .shot{order:1;}

  /* 逐行差异化:列比 + 垂直错位 */
  .row--lead{grid-template-columns:0.72fr 1.28fr;gap:clamp(48px,7vw,104px);}
  .row--lead .shot{margin-top:-16px;}
  .row--wide{grid-template-columns:1.34fr 0.66fr;}
  .row--wide .copy{align-self:flex-end;padding-bottom:14px;}
  .row--low{grid-template-columns:0.9fr 1.1fr;}
  .row--low .shot{margin-top:40px;}
  .row--tight{grid-template-columns:1.06fr 0.94fr;}
  .row--tight .copy{align-self:flex-start;padding-top:20px;}

  /* 文字块 */
  .copy{
    display:flex;flex-direction:column;justify-content:center;padding:8px 0;
  }
  .copy .num{
    font-family:var(--serif);font-style:italic;font-weight:400;
    font-size:clamp(54px,7vw,80px);line-height:0.9;color:var(--ink);margin:0 0 24px;letter-spacing:-0.02em;
    padding-top:26px;position:relative;
  }
  .copy .num::before{
    content:"";position:absolute;top:0;left:0;width:56px;height:1px;background:var(--gold);
  }
  .copy .kicker{font-size:11.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:20px;}
  .copy h3{font-size:clamp(26px,3.4vw,34px);letter-spacing:-0.03em;font-weight:300;line-height:1.18;margin:0 0 22px;}
  .copy p{font-size:16.5px;color:var(--muted);margin:0 0 32px;max-width:42ch;line-height:1.75;font-weight:400;}
  .copy .link{font-size:14.5px;font-weight:400;color:var(--ink);letter-spacing:-0.005em;border-bottom:1px solid var(--gold);padding-bottom:3px;display:inline-block;width:fit-content;}
  .copy .link .arrow{display:inline-block;transition:transform .18s;color:var(--gold);}
  .copy .link:hover .arrow{transform:translateX(4px);}

  /* ---- 占位"操作截图":浏览器窗口,奢华低浮阴影 ---- */
  .shot{
    align-self:center;
    background:var(--surface);border-radius:16px;
    box-shadow:0 1px 0 var(--line),0 30px 70px -24px rgba(26,23,20,0.22);
    overflow:hidden;
  }
  html[data-theme="dark"] .shot{box-shadow:0 1px 0 var(--line),0 34px 80px -26px rgba(0,0,0,0.6);}
  .shot .chrome{
    height:42px;background:var(--paper);box-shadow:0 1px 0 var(--line);
    display:flex;align-items:center;padding:0 16px;gap:8px;
  }
  .shot .dot{width:9px;height:9px;border-radius:50%;background:var(--line-strong);}
  .shot .chrome .url{
    margin-left:14px;flex:1;height:22px;background:var(--surface);border-radius:7px;
    font-size:11px;color:var(--faint);display:flex;align-items:center;padding:0 12px;box-shadow:inset 0 0 0 1px var(--line);
  }
  .shot .body{display:grid;grid-template-columns:162px 1fr;min-height:270px;}
  .steps{padding:22px 16px;background:var(--paper);box-shadow:1px 0 0 var(--line);}
  .steps .st-title{font-size:10.5px;text-transform:uppercase;letter-spacing:0.18em;color:var(--faint);font-weight:500;margin-bottom:18px;}
  .step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;color:var(--muted);font-weight:400;}
  .step .idx{
    width:20px;height:20px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:500;
    background:var(--surface);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line);
  }
  .step.done .idx{background:var(--ok);color:#fff;box-shadow:none;}
  .step.done{color:var(--ink);}
  .step.active .idx{background:var(--gold);color:var(--on-ink);box-shadow:none;}
  .step.active{color:var(--ink);font-weight:500;}
  .canvas{padding:26px;display:flex;flex-direction:column;gap:16px;}
  .ph-line{height:10px;border-radius:6px;background:var(--line);}
  .ph-frame{flex:1;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);
    display:flex;align-items:center;justify-content:center;min-height:130px;position:relative;}
  .ph-badge{font-size:12px;color:var(--faint);letter-spacing:0.06em;border:1px dashed var(--line-strong);
    padding:7px 14px;border-radius:22px;background:var(--surface);}
  .ph-row{display:flex;gap:12px;}
  .ph-chip{height:28px;border-radius:8px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);flex:1;}

  /* ---- 作品浏览预告 ---- */
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:56px;}
  .g-card{
    aspect-ratio:3/4;border-radius:14px;background:var(--surface);
    box-shadow:inset 0 0 0 1px var(--line),0 20px 44px -26px rgba(26,23,20,0.20);
    display:flex;align-items:flex-end;padding:18px;transition:transform .25s ease;
    overflow:hidden;position:relative;
  }
  .g-card:hover{transform:translateY(-4px);}
  .g-card img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;}
  .g-card span{font-size:12.5px;color:var(--faint);position:relative;z-index:1;background:rgba(0,0,0,0.3);padding:4px 8px;border-radius:6px;color:rgba(255,255,255,0.8);}

  /* ---- pull quote ---- */
  .quote{padding:clamp(100px,13vw,170px) 0;}
  .quote blockquote{
    font-family:var(--serif);font-style:italic;font-size:clamp(30px,4.6vw,48px);line-height:1.4;color:var(--ink);
    max-width:22ch;margin:0;font-weight:400;letter-spacing:-0.015em;
  }
  .quote cite{display:block;margin-top:32px;font-family:var(--ui);font-size:13px;color:var(--gold);font-style:normal;letter-spacing:0.04em;font-weight:400;}

  /* ---- footer ---- */
  footer{box-shadow:0 -1px 0 var(--line);padding:56px 0;margin-top:0;}
  .foot-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;}
  .foot-inner .cols{display:flex;gap:34px;}
  .foot-inner a{font-size:14px;color:var(--muted);font-weight:400;cursor:pointer;}
  .foot-inner a:hover{color:var(--ink);}
  .foot-inner .cr{font-size:13px;color:var(--faint);}

  /* ---- 单断点 ---- */
  @media (max-width:600px){
    .wrap{padding:0 22px;}
    .hero{padding:80px 0 64px;}
    .hero h1{font-size:clamp(38px,12vw,52px);}
    .row, .row.flip .copy, .row.flip .shot,
    .row--lead, .row--wide, .row--low, .row--tight{grid-template-columns:1fr;order:0;gap:32px;}
    .row--lead .shot, .row--low .shot{margin-top:0;}
    .row--wide .copy, .row--tight .copy{align-self:auto;padding-top:0;padding-bottom:0;}
    .rows{gap:80px;}
    .gallery{grid-template-columns:repeat(2,1fr);}
    .quote blockquote{font-size:26px;}
  }
</style>
</head>
<body>

<!-- 顶栏:由 nav.js 注入 -->
<header id="site-nav"></header>

<!-- Hero -->
<section class="hero">
  <div class="wrap">
    <div class="eyebrow">一个平台 · 多条产线</div>
    <h1>从一句话，到一支<em>成片。</em></h1>
    <p class="lede">带货、MV、拍同款、图片——每条产线都是一串清清楚楚的操作步骤。在下面直接看它们怎么用。</p>
    <div class="hero-cta">
      <a href="workspace.html" class="btn-primary">开始创作</a>
      <a href="#work" class="btn-ghost">浏览作品 <span class="arrow">→</span></a>
    </div>
  </div>
</section>

<div class="rule"><div class="wrap"></div></div>

<!-- 子项目:数据驱动行 -->
<section class="section">
  <div class="wrap">
    <div class="sec-head">
      <h2>怎么用</h2>
    </div>
    <p class="sec-lede">每条产线打开就是一列步骤,做到哪一步一目了然。</p>

    <div class="rows" id="recipe-rows">
      <!-- 由 JavaScript 数据驱动填充 -->
    </div>
  </div>
</section>

<div class="rule"><div class="wrap"></div></div>

<!-- 作品浏览预告 -->
<section class="section" id="work">
  <div class="wrap">
    <div class="sec-head">
      <h2>作品浏览</h2>
    </div>
    <p class="sec-lede">别人拍成了什么,顺手就能翻。</p>
    <div class="gallery" id="works-gallery">
      <!-- 由 JavaScript 数据驱动填充 -->
    </div>
  </div>
</section>

<div class="rule"><div class="wrap"></div></div>

<!-- pull quote -->
<section class="quote">
  <div class="wrap">
    <blockquote>"做到哪一步,一眼就看得见。"</blockquote>
    <cite>—— 设计原则:操作即步骤,步骤即状态</cite>
  </div>
</section>

<!-- footer -->
<footer>
  <div class="wrap foot-inner">
    <div class="cols">
      <a href="workspace.html">视频</a>
      <a href="workspace.html">图片</a>
      <a href="#">漫剧</a>
      <a href="#work">作品浏览</a>
      <a href="#">登录</a>
    </div>
    <span class="cr">内容工作台 · 首页</span>
  </div>
</footer>

<script src="assets/recipes.js"></script>
<script src="assets/mock-engine.js"></script>

<script>
(function(){
  // 获取 recipes 列表并数据驱动渲染行
  const recipes = Studio.recipes.list().filter(r => window.RECIPE_ORDER.includes(r.key));
  const rowsContainer = document.getElementById('recipe-rows');

  const rowClasses = ['row--lead', 'row--wide', 'row--low', 'row--tight'];
  const flipClasses = [false, true, false, true];

  recipes.forEach((recipe, idx) => {
    const rowClass = rowClasses[idx] || rowClasses[0];
    const shouldFlip = flipClasses[idx] || false;
    const rowNum = idx + 1;

    // 构建步骤 HTML
    let stepsHtml = '';
    if (recipe.steps && recipe.steps.length > 0) {
      recipe.steps.forEach((step, stepIdx) => {
        const isFirst = stepIdx === 0;
        const stepClass = isFirst ? 'step done' : (stepIdx === 1 ? 'step active' : 'step');
        const idxText = isFirst ? '✓' : (stepIdx + 1);
        stepsHtml += `<div class="${stepClass}"><span class="idx">${idxText}</span>${step.title}</div>`;
      });
    }

    const rowHtml = `
      <div class="row ${shouldFlip ? 'flip' : ''} ${rowClass}">
        <div class="copy">
          <div class="num">0${rowNum}</div>
          <div class="kicker">${recipe.tag || ''}</div>
          <h3>${recipe.name}</h3>
          <p>${recipe.blurb}</p>
          <a class="link" href="workspace.html?recipe=${recipe.key}">看它怎么用 <span class="arrow">→</span></a>
        </div>
        <div class="shot">
          <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">工作台 / ${recipe.name}</span></div>
          <div class="body">
            <div class="steps">
              <div class="st-title">操作步骤</div>
              ${stepsHtml}
            </div>
            <div class="canvas">
              <div class="ph-line" style="width:${45 + idx * 5}%"></div>
              <div class="ph-frame"><span class="ph-badge">操作截图占位</span></div>
              <div class="ph-row"><span class="ph-chip"></span><span class="ph-chip"></span><span class="ph-chip"></span></div>
            </div>
          </div>
        </div>
      </div>
    `;

    rowsContainer.insertAdjacentHTML('beforeend', rowHtml);
  });

  // 渲染作品浏览卡片
  const works = Studio.works.list().slice(0, 4);
  const galleryContainer = document.getElementById('works-gallery');

  works.forEach(work => {
    const cardHtml = `
      <div class="g-card">
        <img src="${work.cover}" alt="${work.title}" />
        <span>${work.title}</span>
      </div>
    `;
    galleryContainer.insertAdjacentHTML('beforeend', cardHtml);
  });

  // 如果没有作品,显示占位符
  if (works.length === 0) {
    for (let i = 1; i <= 4; i++) {
      const cardHtml = `<div class="g-card"><span>作品占位 0${i}</span></div>`;
      galleryContainer.insertAdjacentHTML('beforeend', cardHtml);
    }
  }
})();
</script>

<script src="assets/nav.js" data-here="home"></script>

</body>
</html>

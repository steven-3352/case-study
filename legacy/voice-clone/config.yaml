# 声音克隆配置 · 公共模块
# 引擎服务需单独部署，见 pipeline/voice/README.md

backend: gpt-sovits          # gpt-sovits | speech-ai-forge | cosyvoice

api:
  base_url: "http://127.0.0.1:9880"
  timeout_sec: 900
  tts_path: "/tts"

voice:
  ref_audio: "../../assets/avatar/dry_audio/ref_clip_narrative.wav"
  prompt_text_file: "../../assets/avatar/dry_audio/prompt_narrative.txt"
  prompt_lang: zh
  text_lang: zh
  speed: 1.08                # 略提速，贴近 58s 口播节奏

# 参考音 A/B：--preset intro | narrative | turn
presets:
  intro:
    ref_audio: "../../assets/avatar/dry_audio/ref_clip.wav"
    prompt_text_file: "../../assets/avatar/dry_audio/prompt_clip.txt"
  narrative:
    ref_audio: "../../assets/avatar/dry_audio/ref_clip_narrative.wav"
    prompt_text_file: "../../assets/avatar/dry_audio/prompt_narrative.txt"
  turn:
    ref_audio: "../../assets/avatar/dry_audio/ref_clip_turn.wav"
    prompt_text_file: "../../assets/avatar/dry_audio/prompt_turn.txt"

infer:
  text_split_method: cut0
  parallel_infer: false
  split_bucket: false
  repetition_penalty: 1.25   # 略降，减少机械重复感
  top_k: 12
  top_p: 0.95
  temperature: 0.95

output:
  format: wav
  sample_rate: 32000

# script.md 按口播块分段 + 段间 crossfade
chunk:
  mode: script_sections      # script_sections | chars
  max_chars: 50
  auto_above: 80
  crossfade_ms: 120

script_extract:
  markers: ["**口播：**", "**口播（续）：**"]
